server:
  port: ${NOTIFYFLOW_PORT:8080}

spring:
  application:
    name: notifyflow-app
  profiles:
    default: course
  datasource:
    url: ${NOTIFYFLOW_DB_URL:jdbc:mysql://localhost:3306/notifyflow?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8}
    username: ${NOTIFYFLOW_DB_USERNAME:notifyflow}
    password: ${NOTIFYFLOW_DB_PASSWORD:notifyflow}
    hikari:
      maximum-pool-size: ${NOTIFYFLOW_DB_POOL_SIZE:10}
  flyway:
    enabled: ${NOTIFYFLOW_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

notifyflow:
  provider:
    base-url: ${NOTIFYFLOW_PROVIDER_BASE_URL:http://localhost:8081}
  course:
    reconciliation-drain-enabled: ${NOTIFYFLOW_COURSE_RECONCILIATION_DRAIN_ENABLED:true}
