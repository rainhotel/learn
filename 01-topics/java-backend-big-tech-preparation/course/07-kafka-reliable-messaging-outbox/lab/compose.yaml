name: notifyflow-kafka-lab

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: notifyflow-kafka-lab
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
      - ./config:/course-config:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  kafka-data:

