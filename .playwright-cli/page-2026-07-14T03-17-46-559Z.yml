      - generic [ref=e150]:
        - heading "Diagnosing latency issues" [level=1] [ref=e151]
        - paragraph [ref=e152]: Finding the causes of slow responses
        - table [ref=e154]:
          - rowgroup [ref=e155]:
            - row "Redis Open Source" [ref=e156]
          - rowgroup
        - paragraph [ref=e158]: This document will help you understand what the problem could be if you are experiencing latency problems with Redis.
        - paragraph [ref=e159]:
          - text: In this context
          - emphasis [ref=e160]: latency
          - text: is the maximum delay between the time a client issues a command and the time the reply to the command is received by the client. Usually Redis processing time is extremely low, in the sub microsecond range, but there are certain conditions leading to higher latency figures.
        - heading [level=2] [ref=e161]:
          - text: I've little time, give me the checklist
          - link "Link to this section" [ref=e162] [cursor=pointer]:
            - /url: "#ive-little-time-give-me-the-checklist"
        - paragraph [ref=e165]: The following documentation is very important in order to run Redis in a low latency fashion. However I understand that we are busy people, so let's start with a quick checklist. If you fail following these steps, please return here to read the full documentation.
        - list [ref=e166]:
          - listitem [ref=e167]:
            - text: Make sure you are not running slow commands that are blocking the server. Use the Redis
            - link "Slow Log feature" [ref=e168] [cursor=pointer]:
              - /url: /commands/slowlog
            - text: to check this.
          - listitem [ref=e169]: For EC2 users, make sure you use HVM based modern EC2 instances, like m3.medium. Otherwise fork() is too slow.
          - listitem [ref=e170]:
            - text: Transparent huge pages must be disabled from your kernel. Use
            - code [ref=e171]: echo never > /sys/kernel/mm/transparent_hugepage/enabled
            - text: to disable them, and restart your Redis process.
          - listitem [ref=e172]:
            - text: If you are using a virtual machine, it is possible that you have an intrinsic latency that has nothing to do with Redis. Check the minimum latency you can expect from your runtime environment using
            - code [ref=e173]: ./redis-cli --intrinsic-latency 100
            - text: ". Note: you need to run this command in"
            - emphasis [ref=e174]: the server
            - text: not in the client.
          - listitem [ref=e175]:
            - text: Enable and use the
            - link "Latency monitor" [ref=e176] [cursor=pointer]:
              - /url: /docs/latest/operate/oss_and_stack/management/optimization/latency-monitor/
            - text: feature of Redis in order to get a human readable description of the latency events and causes in your Redis instance.
        - paragraph [ref=e177]: In general, use the following table for durability VS latency/performance tradeoffs, ordered from stronger safety to better latency.
        - list [ref=e178]:
          - listitem [ref=e179]: "AOF + fsync always: this is very slow, you should use it only if you know what you are doing."
          - listitem [ref=e180]: "AOF + fsync every second: this is a good compromise."
          - listitem [ref=e181]: "AOF + fsync every second + no-appendfsync-on-rewrite option set to yes: this is as the above, but avoids to fsync during rewrites to lower the disk pressure."
          - listitem [ref=e182]: AOF + fsync never. Fsyncing is up to the kernel in this setup, even less disk pressure and risk of latency spikes.
          - listitem [ref=e183]: RDB. Here you have a vast spectrum of tradeoffs depending on the save triggers you configure.
        - paragraph [ref=e184]: And now for people with 15 minutes to spend, the details...
        - heading [level=2] [ref=e185]:
          - text: Measuring latency
          - link "Link to this section" [ref=e186] [cursor=pointer]:
            - /url: "#measuring-latency"
        - paragraph [ref=e189]: "If you are experiencing latency problems, you probably know how to measure it in the context of your application, or maybe your latency problem is very evident even macroscopically. However redis-cli can be used to measure the latency of a Redis server in milliseconds, just try:"
        - code [ref=e191]: "redis-cli --latency -h `host` -p `port`"
        - heading [level=2] [ref=e192]:
          - text: Using the internal Redis latency monitoring subsystem
          - link "Link to this section" [ref=e193] [cursor=pointer]:
            - /url: "#using-the-internal-redis-latency-monitoring-subsystem"
        - paragraph [ref=e196]:
          - text: Since Redis 2.8.13, Redis provides latency monitoring capabilities that are able to sample different execution paths to understand where the server is blocking. This makes debugging of the problems illustrated in this documentation much simpler, so we suggest enabling latency monitoring ASAP. Please refer to the
          - link "Latency monitor documentation" [ref=e197] [cursor=pointer]:
            - /url: /docs/latest/operate/oss_and_stack/management/optimization/latency-monitor/
          - text: .
        - paragraph [ref=e198]: While the latency monitoring sampling and reporting capabilities will make it simpler to understand the source of latency in your Redis system, it is still advised that you read this documentation extensively to better understand the topic of Redis and latency spikes.
        - heading [level=2] [ref=e199]:
          - text: Latency baseline
          - link "Link to this section" [ref=e200] [cursor=pointer]:
            - /url: "#latency-baseline"
        - paragraph [ref=e203]: There is a kind of latency that is inherently part of the environment where you run Redis, that is the latency provided by your operating system kernel and, if you are using virtualization, by the hypervisor you are using.
        - paragraph [ref=e204]: While this latency can't be removed it is important to study it because it is the baseline, or in other words, you won't be able to achieve a Redis latency that is better than the latency that every process running in your environment will experience because of the kernel or hypervisor implementation or setup.
        - paragraph [ref=e205]:
          - text: We call this kind of latency
          - strong [ref=e206]: intrinsic latency
          - text: ", and"
          - code [ref=e207]: redis-cli
          - text: starting from Redis version 2.8.7 is able to measure it. This is an example run under Linux 3.11.0 running on an entry level server.
        - paragraph [ref=e208]:
          - text: "Note: the argument"
          - code [ref=e209]: "100"
          - text: is the number of seconds the test will be executed. The more time we run the test, the more likely we'll be able to spot latency spikes. 100 seconds is usually appropriate, however you may want to perform a few runs at different times. Please note that the test is CPU intensive and will likely saturate a single core in your system.
        - code [ref=e211]: "$ ./redis-cli --intrinsic-latency 100 Max latency so far: 1 microseconds. Max latency so far: 16 microseconds. Max latency so far: 50 microseconds. Max latency so far: 53 microseconds. Max latency so far: 83 microseconds. Max latency so far: 115 microseconds."
        - paragraph [ref=e212]:
          - text: "Note: redis-cli in this special case needs to"
          - strong [ref=e213]: run in the server
          - text: "where you run or plan to run Redis, not in the client. In this special mode redis-cli does not connect to a Redis server at all: it will just try to measure the largest time the kernel does not provide CPU time to run to the redis-cli process itself."
        - paragraph [ref=e214]: In the above example, the intrinsic latency of the system is just 0.115 milliseconds (or 115 microseconds), which is a good news, however keep in mind that the intrinsic latency may change over time depending on the load of the system.
        - paragraph [ref=e215]: "Virtualized environments will not show so good numbers, especially with high load or if there are noisy neighbors. The following is a run on a Linode 4096 instance running Redis and Apache:"
        - code [ref=e217]: "$ ./redis-cli --intrinsic-latency 100 Max latency so far: 573 microseconds. Max latency so far: 695 microseconds. Max latency so far: 919 microseconds. Max latency so far: 1606 microseconds. Max latency so far: 3191 microseconds. Max latency so far: 9243 microseconds. Max latency so far: 9671 microseconds."
        - paragraph [ref=e218]: "Here we have an intrinsic latency of 9.7 milliseconds: this means that we can't ask better than that to Redis. However other runs at different times in different virtualization environments with higher load or with noisy neighbors can easily show even worse values. We were able to measure up to 40 milliseconds in systems otherwise apparently running normally."
        - heading [level=2] [ref=e219]:
          - text: Latency induced by network and communication
          - link "Link to this section" [ref=e220] [cursor=pointer]:
            - /url: "#latency-induced-by-network-and-communication"
        - paragraph [ref=e223]: Clients connect to Redis using a TCP/IP connection or a Unix domain connection. The typical latency of a 1 Gbit/s network is about 200 us, while the latency with a Unix domain socket can be as low as 30 us. It actually depends on your network and system hardware. On top of the communication itself, the system adds some more latency (due to thread scheduling, CPU caches, NUMA placement, etc ...). System induced latencies are significantly higher on a virtualized environment than on a physical machine.
        - paragraph [ref=e224]: The consequence is even if Redis processes most commands in sub microsecond range, a client performing many roundtrips to the server will have to pay for these network and system related latencies.
        - paragraph [ref=e225]: An efficient client will therefore try to limit the number of roundtrips by pipelining several commands together. This is fully supported by the servers and most clients. Aggregated commands like MSET/MGET can be also used for that purpose. Starting with Redis 2.4, a number of commands also support variadic parameters for all data types.
        - paragraph [ref=e226]: "Here are some guidelines:"
        - list [ref=e227]:
          - listitem [ref=e228]: If you can afford it, prefer a physical machine over a VM to host the server.
          - listitem [ref=e229]: Do not systematically connect/disconnect to the server (especially true for web based applications). Keep your connections as long lived as possible.
          - listitem [ref=e230]: If your client is on the same host than the server, use Unix domain sockets.
          - listitem [ref=e231]: Prefer to use aggregated commands (MSET/MGET), or commands with variadic parameters (if possible) over pipelining.
          - listitem [ref=e232]: Prefer to use pipelining (if possible) over sequence of roundtrips.
          - listitem [ref=e233]: Redis supports Lua server-side scripting to cover cases that are not suitable for raw pipelining (for instance when the result of a command is an input for the following commands).
        - paragraph [ref=e234]:
          - text: On Linux, some people can achieve better latencies by playing with process placement (taskset), cgroups, real-time priorities (chrt), NUMA configuration (numactl), or by using a low-latency kernel. Please note vanilla Redis is not really suitable to be bound on a
          - strong [ref=e235]: single
          - text: CPU core. Redis can fork background tasks that can be extremely CPU consuming like
          - link [ref=e236] [cursor=pointer]:
            - /url: /commands/bgsave
            - code [ref=e237]: BGSAVE
          - text: or
          - link [ref=e238] [cursor=pointer]:
            - /url: /commands/bgrewriteaof
            - code [ref=e239]: BGREWRITEAOF
          - text: . These tasks must
          - strong [ref=e240]: never
          - text: run on the same core as the main event loop.
        - paragraph [ref=e241]: In most situations, these kind of system level optimizations are not needed. Only do them if you require them, and if you are familiar with them.
        - heading [level=2] [ref=e242]:
          - text: Single threaded nature of Redis
          - link "Link to this section" [ref=e243] [cursor=pointer]:
            - /url: "#single-threaded-nature-of-redis"
        - paragraph [ref=e246]:
          - text: Redis uses a
          - emphasis [ref=e247]: mostly
          - text: single threaded design. This means that a single process serves all the client requests, using a technique called
          - strong [ref=e248]: multiplexing
          - text: . This means that Redis can serve a single request in every given moment, so all the requests are served sequentially. This is very similar to how Node.js works as well. However, both products are not often perceived as being slow. This is caused in part by the small amount of time to complete a single request, but primarily because these products are designed to not block on system calls, such as reading data from or writing data to a socket.
        - paragraph [ref=e249]:
          - text: I said that Redis is
          - emphasis [ref=e250]: mostly
          - text: single threaded since actually from Redis 2.4 we use threads in Redis in order to perform some slow I/O operations in the background, mainly related to disk I/O, but this does not change the fact that Redis serves all the requests using a single thread.
        - heading [level=2] [ref=e251]:
          - text: Latency generated by slow commands
          - link "Link to this section" [ref=e252] [cursor=pointer]:
            - /url: "#latency-generated-by-slow-commands"
        - paragraph [ref=e255]:
          - text: A consequence of being single thread is that when a request is slow to serve all the other clients will wait for this request to be served. When executing normal commands, like
          - link [ref=e256] [cursor=pointer]:
            - /url: /commands/get
            - code [ref=e257]: GET
          - text: or
          - link [ref=e258] [cursor=pointer]:
            - /url: /commands/set
            - code [ref=e259]: SET
          - text: or
          - link [ref=e260] [cursor=pointer]:
            - /url: /commands/lpush
            - code [ref=e261]: LPUSH
          - text: this is not a problem at all since these commands are executed in constant (and very small) time. However there are commands operating on many elements, like
          - link [ref=e262] [cursor=pointer]:
            - /url: /commands/sort
            - code [ref=e263]: SORT
          - text: ","
          - link [ref=e264] [cursor=pointer]:
            - /url: /commands/lrem
            - code [ref=e265]: LREM
          - text: ","
          - link [ref=e266] [cursor=pointer]:
            - /url: /commands/sunion
            - code [ref=e267]: SUNION
          - text: and others. For instance taking the intersection of two big sets can take a considerable amount of time.
        - paragraph [ref=e268]: The algorithmic complexity of all commands is documented. A good practice is to systematically check it when using commands you are not familiar with.
        - paragraph [ref=e269]: If you have latency concerns you should either not use slow commands against values composed of many elements, or you should run a replica using Redis replication where you run all your slow queries.
        - paragraph [ref=e270]:
          - text: It is possible to monitor slow commands using the Redis
          - link "Slow Log feature" [ref=e271] [cursor=pointer]:
            - /url: /commands/slowlog
          - text: .
        - paragraph [ref=e272]: Additionally, you can use your favorite per-process monitoring program (top, htop, prstat, etc ...) to quickly check the CPU consumption of the main Redis process. If it is high while the traffic is not, it is usually a sign that slow commands are used.
        - paragraph [ref=e273]:
          - strong [ref=e274]: IMPORTANT NOTE
          - text: ": a VERY common source of latency generated by the execution of slow commands is the use of the"
          - link [ref=e275] [cursor=pointer]:
            - /url: /commands/keys
            - code [ref=e276]: KEYS
          - text: command in production environments.
          - link [ref=e277] [cursor=pointer]:
            - /url: /commands/keys
            - code [ref=e278]: KEYS
          - text: ", as documented in the Redis documentation, should only be used for debugging purposes. Since Redis 2.8 a new commands were introduced in order to iterate the key space and other large collections incrementally, please check the"
          - link [ref=e279] [cursor=pointer]:
            - /url: /commands/scan
            - code [ref=e280]: SCAN
          - text: ","
          - link [ref=e281] [cursor=pointer]:
            - /url: /commands/sscan
            - code [ref=e282]: SSCAN
          - text: ","
          - link [ref=e283] [cursor=pointer]:
            - /url: /commands/hscan
            - code [ref=e284]: HSCAN
          - text: and
          - link [ref=e285] [cursor=pointer]:
            - /url: /commands/zscan
            - code [ref=e286]: ZSCAN
          - text: commands for more information.
        - heading [level=2] [ref=e287]:
          - text: Latency generated by fork
          - link "Link to this section" [ref=e288] [cursor=pointer]:
            - /url: "#latency-generated-by-fork"
        - paragraph [ref=e291]: In order to generate the RDB file in background, or to rewrite the Append Only File if AOF persistence is enabled, Redis has to fork background processes. The fork operation (running in the main thread) can induce latency by itself.
        - paragraph [ref=e292]: Forking is an expensive operation on most Unix-like systems, since it involves copying a good number of objects linked to the process. This is especially true for the page table associated to the virtual memory mechanism.
        - paragraph [ref=e293]: For instance on a Linux/AMD64 system, the memory is divided in 4 kB pages. To convert virtual addresses to physical addresses, each process stores a page table (actually represented as a tree) containing at least a pointer per page of the address space of the process. So a large 24 GB Redis instance requires a page table of 24 GB / 4 kB * 8 = 48 MB.
        - paragraph [ref=e294]: When a background save is performed, this instance will have to be forked, which will involve allocating and copying 48 MB of memory. It takes time and CPU, especially on virtual machines where allocation and initialization of a large memory chunk can be expensive.
        - heading [level=2] [ref=e295]:
          - text: Fork time in different systems
          - link "Link to this section" [ref=e296] [cursor=pointer]:
            - /url: "#fork-time-in-different-systems"
        - paragraph [ref=e299]:
          - text: Modern hardware is pretty fast at copying the page table, but Xen is not. The problem with Xen is not virtualization-specific, but Xen-specific. For instance using VMware or Virtual Box does not result into slow fork time. The following is a table that compares fork time for different Redis instance size. Data is obtained performing a BGSAVE and looking at the
          - code [ref=e300]: latest_fork_usec
          - text: filed in the
          - link [ref=e301] [cursor=pointer]:
            - /url: /commands/info
            - code [ref=e302]: INFO
          - text: command output.
        - paragraph [ref=e303]:
          - text: However the good news is that
          - strong [ref=e304]: new types of EC2 HVM based instances are much better with fork times
          - text: ", almost on par with physical servers, so for example using m3.medium (or better) instances will provide good results."
        - list [ref=e305]:
          - listitem [ref=e306]:
            - strong [ref=e307]: Linux beefy VM on VMware
            - text: 6.0GB RSS forked in 77 milliseconds (12.8 milliseconds per GB).
          - listitem [ref=e308]:
            - strong [ref=e309]: Linux running on physical machine (Unknown HW)
            - text: 6.1GB RSS forked in 80 milliseconds (13.1 milliseconds per GB)
          - listitem [ref=e310]:
            - strong [ref=e311]: Linux running on physical machine (Xeon @ 2.27Ghz)
            - text: 6.9GB RSS forked into 62 milliseconds (9 milliseconds per GB).
          - listitem [ref=e312]:
            - strong [ref=e313]: Linux VM on 6sync (KVM)
            - text: 360 MB RSS forked in 8.2 milliseconds (23.3 milliseconds per GB).
          - listitem [ref=e314]:
            - strong [ref=e315]: Linux VM on EC2, old instance types (Xen)
            - text: 6.1GB RSS forked in 1460 milliseconds (239.3 milliseconds per GB).
          - listitem [ref=e316]:
            - strong [ref=e317]: Linux VM on EC2, new instance types (Xen)
            - text: 1GB RSS forked in 10 milliseconds (10 milliseconds per GB).
          - listitem [ref=e318]:
            - strong [ref=e319]: Linux VM on Linode (Xen)
            - text: 0.9GBRSS forked into 382 milliseconds (424 milliseconds per GB).
        - paragraph [ref=e320]: "As you can see certain VMs running on Xen have a performance hit that is between one order to two orders of magnitude. For EC2 users the suggestion is simple: use modern HVM based instances."
        - heading [level=2] [ref=e321]:
          - text: Latency induced by transparent huge pages
          - link "Link to this section" [ref=e322] [cursor=pointer]:
            - /url: "#latency-induced-by-transparent-huge-pages"
        - paragraph [ref=e325]:
          - text: Unfortunately when a Linux kernel has transparent huge pages enabled, Redis incurs to a big latency penalty after the
          - code [ref=e326]: fork
          - text: "call is used in order to persist on disk. Huge pages are the cause of the following issue:"
        - list [ref=e327]:
          - listitem [ref=e328]: Fork is called, two processes with shared huge pages are created.
          - listitem [ref=e329]: In a busy instance, a few event loops runs will cause commands to target a few thousand of pages, causing the copy on write of almost the whole process memory.
          - listitem [ref=e330]: This will result in big latency and big memory usage.
        - paragraph [ref=e331]:
          - text: Make sure to
          - strong [ref=e332]: disable transparent huge pages
          - text: "using the following command:"
        - code [ref=e334]: echo never > /sys/kernel/mm/transparent_hugepage/enabled
        - heading [level=2] [ref=e335]:
          - text: Latency induced by swapping (operating system paging)
          - link "Link to this section" [ref=e336] [cursor=pointer]:
            - /url: "#latency-induced-by-swapping-operating-system-paging"
        - paragraph [ref=e339]: Linux (and many other modern operating systems) is able to relocate memory pages from the memory to the disk, and vice versa, in order to use the system memory efficiently.
        - paragraph [ref=e340]: If a Redis page is moved by the kernel from the memory to the swap file, when the data stored in this memory page is used by Redis (for example accessing a key stored into this memory page) the kernel will stop the Redis process in order to move the page back into the main memory. This is a slow operation involving random I/Os (compared to accessing a page that is already in memory) and will result into anomalous latency experienced by Redis clients.
        - paragraph [ref=e341]: "The kernel relocates Redis memory pages on disk mainly because of three reasons:"
        - list [ref=e342]:
          - listitem [ref=e343]: The system is under memory pressure since the running processes are demanding more physical memory than the amount that is available. The simplest instance of this problem is simply Redis using more memory than is available.
          - listitem [ref=e344]: The Redis instance data set, or part of the data set, is mostly completely idle (never accessed by clients), so the kernel could swap idle memory pages on disk. This problem is very rare since even a moderately slow instance will touch all the memory pages often, forcing the kernel to retain all the pages in memory.
          - listitem [ref=e345]: Some processes are generating massive read or write I/Os on the system. Because files are generally cached, it tends to put pressure on the kernel to increase the filesystem cache, and therefore generate swapping activity. Please note it includes Redis RDB and/or AOF background threads which can produce large files.
        - paragraph [ref=e346]: Fortunately Linux offers good tools to investigate the problem, so the simplest thing to do is when latency due to swapping is suspected is just to check if this is the case.
        - paragraph [ref=e347]: "The first thing to do is to checking the amount of Redis memory that is swapped on disk. In order to do so you need to obtain the Redis instance pid:"
        - code [ref=e349]: $ redis-cli info | grep process_id process_id:5454
        - paragraph [ref=e350]: "Now enter the /proc file system directory for this process:"
        - code [ref=e352]: $ cd /proc/5454
        - paragraph [ref=e353]:
          - text: Here you'll find a file called
          - strong [ref=e354]: smaps
          - text: that describes the memory layout of the Redis process (assuming you are using Linux 2.6.16 or newer). This file contains very detailed information about our process memory maps, and one field called
          - strong [ref=e355]: Swap
          - text: is exactly what we are looking for. However there is not just a single swap field since the smaps file contains the different memory maps of our Redis process (The memory layout of a process is more complex than a simple linear array of pages).
        - paragraph [ref=e356]: "Since we are interested in all the memory swapped by our process the first thing to do is to grep for the Swap field across all the file:"
        - code [ref=e358]: "$ cat smaps | grep 'Swap:' Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 12 kB Swap: 156 kB Swap: 8 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 4 kB Swap: 0 kB Swap: 0 kB Swap: 4 kB Swap: 0 kB Swap: 0 kB Swap: 4 kB Swap: 4 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB Swap: 0 kB"
        - paragraph [ref=e359]: "If everything is 0 kB, or if there are sporadic 4k entries, everything is perfectly normal. Actually in our example instance (the one of a real web site running Redis and serving hundreds of users every second) there are a few entries that show more swapped pages. To investigate if this is a serious problem or not we change our command in order to also print the size of the memory map:"
        - code [ref=e361]: "$ cat smaps | egrep '^(Swap|Size)' Size: 316 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 8 kB Swap: 0 kB Size: 40 kB Swap: 0 kB Size: 132 kB Swap: 0 kB Size: 720896 kB Swap: 12 kB Size: 4096 kB Swap: 156 kB Size: 4096 kB Swap: 8 kB Size: 4096 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 1272 kB Swap: 0 kB Size: 8 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 16 kB Swap: 0 kB Size: 84 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 8 kB Swap: 4 kB Size: 8 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 4 kB Swap: 4 kB Size: 144 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 4 kB Swap: 4 kB Size: 12 kB Swap: 4 kB Size: 108 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 4 kB Swap: 0 kB Size: 272 kB Swap: 0 kB Size: 4 kB Swap: 0 kB"
        - paragraph [ref=e362]: "As you can see from the output, there is a map of 720896 kB (with just 12 kB swapped) and 156 kB more swapped in another map: basically a very small amount of our memory is swapped so this is not going to create any problem at all."
        - paragraph [ref=e363]:
          - text: If instead a non trivial amount of the process memory is swapped on disk your latency problems are likely related to swapping. If this is the case with your Redis instance you can further verify it using the
          - strong [ref=e364]: vmstat
          - text: "command:"
        - code [ref=e366]: $ vmstat 1 procs -----------memory---------- ---swap-- -----io---- -system-- ----cpu---- r b swpd free buff cache si so bi bo in cs us sy id wa 0 0 3980 697932 147180 1406456 0 0 2 2 2 0 4 4 91 0 0 0 3980 697428 147180 1406580 0 0 0 0 19088 16104 9 6 84 0 0 0 3980 697296 147180 1406616 0 0 0 28 18936 16193 7 6 87 0 0 0 3980 697048 147180 1406640 0 0 0 0 18613 15987 6 6 88 0 2 0 3980 696924 147180 1406656 0 0 0 0 18744 16299 6 5 88 0 0 0 3980 697048 147180 1406688 0 0 0 4 18520 15974 6 6 88 0 ^C
        - paragraph [ref=e367]:
          - text: The interesting part of the output for our needs are the two columns
          - strong [ref=e368]: si
          - text: and
          - strong [ref=e369]: so
          - text: ", that counts the amount of memory swapped from/to the swap file. If you see non zero counts in those two columns then there is swapping activity in your system."
        - paragraph [ref=e370]:
          - text: Finally, the
          - strong [ref=e371]: iostat
          - text: command can be used to check the global I/O activity of the system.
        - code [ref=e373]: "$ iostat -xk 1 avg-cpu: %user %nice %system %iowait %steal %idle 13.55 0.04 2.92 0.53 0.00 82.95 Device: rrqm/s wrqm/s r/s w/s rkB/s wkB/s avgrq-sz avgqu-sz await svctm %util sda 0.77 0.00 0.01 0.00 0.40 0.00 73.65 0.00 3.62 2.58 0.00 sdb 1.27 4.75 0.82 3.54 38.00 32.32 32.19 0.11 24.80 4.24 1.85"
        - paragraph [ref=e374]: If your latency problem is due to Redis memory being swapped on disk you need to lower the memory pressure in your system, either adding more RAM if Redis is using more memory than the available, or avoiding running other memory hungry processes in the same system.
        - heading [level=2] [ref=e375]:
          - text: Latency due to AOF and disk I/O
          - link "Link to this section" [ref=e376] [cursor=pointer]:
            - /url: "#latency-due-to-aof-and-disk-io"
        - paragraph [ref=e379]: Another source of latency is due to the Append Only File support on Redis. The AOF basically uses two system calls to accomplish its work. One is write(2) that is used in order to write data to the append only file, and the other one is fdatasync(2) that is used in order to flush the kernel file buffer on disk in order to ensure the durability level specified by the user.
        - paragraph [ref=e380]: Both the write(2) and fdatasync(2) calls can be source of latency. For instance write(2) can block both when there is a system wide sync in progress, or when the output buffers are full and the kernel requires to flush on disk in order to accept new writes.
        - paragraph [ref=e381]: The fdatasync(2) call is a worse source of latency as with many combinations of kernels and file systems used it can take from a few milliseconds to a few seconds to complete, especially in the case of some other process doing I/O. For this reason when possible Redis does the fdatasync(2) call in a different thread since Redis 2.4.
        - paragraph [ref=e382]: We'll see how configuration can affect the amount and source of latency when using the AOF file.
        - paragraph [ref=e383]:
          - text: The AOF can be configured to perform a fsync on disk in three different ways using the
          - strong [ref=e384]: appendfsync
          - text: configuration option (this setting can be modified at runtime using the
          - strong [ref=e385]: CONFIG SET
          - text: command).
        - list [ref=e386]:
          - listitem [ref=e387]:
            - paragraph [ref=e388]:
              - text: When appendfsync is set to the value of
              - strong [ref=e389]: "no"
              - text: Redis performs no fsync. In this configuration the only source of latency can be write(2). When this happens usually there is no solution since simply the disk can't cope with the speed at which Redis is receiving data, however this is uncommon if the disk is not seriously slowed down by other processes doing I/O.
          - listitem [ref=e390]:
            - paragraph [ref=e391]:
              - text: When appendfsync is set to the value of
              - strong [ref=e392]: everysec
              - text: Redis performs a fsync every second. It uses a different thread, and if the fsync is still in progress Redis uses a buffer to delay the write(2) call up to two seconds (since write would block on Linux if a fsync is in progress against the same file). However if the fsync is taking too long Redis will eventually perform the write(2) call even if the fsync is still in progress, and this can be a source of latency.
          - listitem [ref=e393]:
            - paragraph [ref=e394]:
              - text: When appendfsync is set to the value of
              - strong [ref=e395]: always
              - text: a fsync is performed at every write operation before replying back to the client with an OK code (actually Redis will try to cluster many commands executed at the same time into a single fsync). In this mode performances are very low in general and it is strongly recommended to use a fast disk and a file system implementation that can perform the fsync in short time.
        - paragraph [ref=e396]:
          - text: Most Redis users will use either the
          - strong [ref=e397]: "no"
          - text: or
          - strong [ref=e398]: everysec
          - text: setting for the appendfsync configuration directive. The suggestion for minimum latency is to avoid other processes doing I/O in the same system. Using an SSD disk can help as well, but usually even non SSD disks perform well with the append only file if the disk is spare as Redis writes to the append only file without performing any seek.
        - paragraph [ref=e399]: "If you want to investigate your latency issues related to the append only file you can use the strace command under Linux:"
        - code [ref=e401]: sudo strace -p $(pidof redis-server) -T -e trace=fdatasync
        - paragraph [ref=e402]:
          - text: The above command will show all the fdatasync(2) system calls performed by Redis in the main thread. With the above command you'll not see the fdatasync system calls performed by the background thread when the appendfsync config option is set to
          - strong [ref=e403]: everysec
          - text: . In order to do so just add the -f switch to strace.
        - paragraph [ref=e404]: "If you wish you can also see both fdatasync and write system calls with the following command:"
        - code [ref=e406]: sudo strace -p $(pidof redis-server) -T -e trace=fdatasync,write
        - paragraph [ref=e407]: "However since write(2) is also used in order to write data to the client sockets this will likely show too many things unrelated to disk I/O. Apparently there is no way to tell strace to just show slow system calls so I use the following command:"
        - code [ref=e409]: sudo strace -f -p $(pidof redis-server) -T -e trace=fdatasync,write 2>&1 | grep -v '0.0' | grep -v unfinished
        - heading [level=2] [ref=e410]:
          - text: Latency generated by expires
          - link "Link to this section" [ref=e411] [cursor=pointer]:
            - /url: "#latency-generated-by-expires"
        - paragraph [ref=e414]: "Redis evict expired keys in two ways:"
        - list [ref=e415]:
          - listitem [ref=e416]:
            - text: One
            - emphasis [ref=e417]: lazy
            - text: way expires a key when it is requested by a command, but it is found to be already expired.
          - listitem [ref=e418]:
            - text: One
            - emphasis [ref=e419]: active
            - text: way expires a few keys every 100 milliseconds.
        - paragraph [ref=e420]: "The active expiring is designed to be adaptive. An expire cycle is started every 100 milliseconds (10 times per second), and will do the following:"
        - list [ref=e421]:
          - listitem [ref=e422]:
            - text: Sample
            - code [ref=e423]: ACTIVE_EXPIRE_CYCLE_LOOKUPS_PER_LOOP
            - text: keys, evicting all the keys already expired.
          - listitem [ref=e424]: If the more than 25% of the keys were found expired, repeat.
        - paragraph [ref=e425]:
          - text: Given that
          - code [ref=e426]: ACTIVE_EXPIRE_CYCLE_LOOKUPS_PER_LOOP
          - text: is set to 20 by default, and the process is performed ten times per second, usually just 200 keys per second are actively expired. This is enough to clean the DB fast enough even when already expired keys are not accessed for a long time, so that the
          - emphasis [ref=e427]: lazy
          - text: algorithm does not help. At the same time expiring just 200 keys per second has no effects in the latency a Redis instance.
        - paragraph [ref=e428]:
          - text: However the algorithm is adaptive and will loop if it finds more than 25% of keys already expired in the set of sampled keys. But given that we run the algorithm ten times per second, this means that the unlucky event of more than 25% of the keys in our random sample are expiring at least
          - emphasis [ref=e429]: in the same second
          - text: .
        - paragraph [ref=e430]:
          - text: Basically this means that
          - strong [ref=e431]: if the database has many, many keys expiring in the same second, and these make up at least 25% of the current population of keys with an expire set
          - text: ", Redis can block in order to get the percentage of keys already expired below 25%."
        - paragraph [ref=e432]:
          - text: This approach is needed in order to avoid using too much memory for keys that are already expired, and usually is absolutely harmless since it's strange that a big number of keys are going to expire in the same exact second, but it is not impossible that the user used
          - link [ref=e433] [cursor=pointer]:
            - /url: /commands/expireat
            - code [ref=e434]: EXPIREAT
          - text: extensively with the same Unix time.
        - paragraph [ref=e435]: "In short: be aware that many keys expiring at the same moment can be a source of latency."
        - heading [level=2] [ref=e436]:
          - text: Redis software watchdog
          - link "Link to this section" [ref=e437] [cursor=pointer]:
            - /url: "#redis-software-watchdog"
        - paragraph [ref=e440]:
          - text: Redis 2.6 introduces the
          - emphasis [ref=e441]: Redis Software Watchdog
          - text: that is a debugging tool designed to track those latency problems that for one reason or the other escaped an analysis using normal tools.
        - paragraph [ref=e442]: The software watchdog is an experimental feature. While it is designed to be used in production environments care should be taken to backup the database before proceeding as it could possibly have unexpected interactions with the normal execution of the Redis server.
        - paragraph [ref=e443]:
          - text: It is important to use it only as
          - emphasis [ref=e444]: last resort
          - text: when there is no way to track the issue by other means.
        - paragraph [ref=e445]: "This is how this feature works:"
        - list [ref=e446]:
          - listitem [ref=e447]:
            - text: The user enables the software watchdog using the
            - link [ref=e448] [cursor=pointer]:
              - /url: /commands/config-set
              - code [ref=e449]: CONFIG SET
            - text: command.
          - listitem [ref=e450]: Redis starts monitoring itself constantly.
          - listitem [ref=e451]: If Redis detects that the server is blocked into some operation that is not returning fast enough, and that may be the source of the latency issue, a low level report about where the server is blocked is dumped on the log file.
          - listitem [ref=e452]: The user contacts the developers writing a message in the Redis Google Group, including the watchdog report in the message.
        - paragraph [ref=e453]: Note that this feature cannot be enabled using the redis.conf file, because it is designed to be enabled only in already running instances and only for debugging purposes.
        - paragraph [ref=e454]: "To enable the feature just use the following:"
        - code [ref=e456]: CONFIG SET watchdog-period 500
        - paragraph [ref=e457]: The period is specified in milliseconds. In the above example I specified to log latency issues only if the server detects a delay of 500 milliseconds or greater. The minimum configurable period is 200 milliseconds.
        - paragraph [ref=e458]:
          - text: When you are done with the software watchdog you can turn it off setting the
          - code [ref=e459]: watchdog-period
          - text: parameter to 0.
          - strong [ref=e460]: "Important:"
          - text: remember to do this because keeping the instance with the watchdog turned on for a longer time than needed is generally not a good idea.
        - paragraph [ref=e461]: "The following is an example of what you'll see printed in the log file once the software watchdog detects a delay longer than the configured one:"
        - code [ref=e463]: "[8547 | signal handler] (1333114359) --- WATCHDOG TIMER EXPIRED --- /lib/libc.so.6(nanosleep+0x2d) [0x7f16b5c2d39d] /lib/libpthread.so.0(+0xf8f0) [0x7f16b5f158f0] /lib/libc.so.6(nanosleep+0x2d) [0x7f16b5c2d39d] /lib/libc.so.6(usleep+0x34) [0x7f16b5c62844] ./redis-server(debugCommand+0x3e1) [0x43ab41] ./redis-server(call+0x5d) [0x415a9d] ./redis-server(processCommand+0x375) [0x415fc5] ./redis-server(processInputBuffer+0x4f) [0x4203cf] ./redis-server(readQueryFromClient+0xa0) [0x4204e0] ./redis-server(aeProcessEvents+0x128) [0x411b48] ./redis-server(aeMain+0x2b) [0x411dbb] ./redis-server(main+0x2b6) [0x418556] /lib/libc.so.6(__libc_start_main+0xfd) [0x7f16b5ba1c4d] ./redis-server() [0x411099] ------"
        - paragraph [ref=e464]:
          - text: "Note: in the example the"
          - strong [ref=e465]: DEBUG SLEEP
          - text: command was used in order to block the server. The stack trace is different if the server blocks in a different context.
        - paragraph [ref=e466]: "If you happen to collect multiple watchdog stack traces you are encouraged to send everything to the Redis Google Group: the more traces we obtain, the simpler it will be to understand what the problem with your instance is."
        - generic [ref=e468]:
          - generic [ref=e469]:
            - generic [ref=e470]: RATE THIS PAGE
