                      - text: parameter because the info is not available for an empty batch.
              - paragraph [ref=e1291]:
                - text: If you receive
                - code [ref=e1292]: List<Message<Thing>>
                - text: the info is in the
                - code [ref=e1293]: KafkaHeaders.LISTENER_INFO
                - text: header of each
                - code [ref=e1294]: Message<?>
                - text: .
              - paragraph [ref=e1296]:
                - text: See
                - link "Batch Listeners" [ref=e1297] [cursor=pointer]:
                  - /url: receiving-messages/listener-annotation.html#batch-listeners
                - text: for more information about consuming batches.
          - generic [ref=e1298]:
            - heading "Publishing Dead-letter Records" [level=2] [ref=e1299]
            - generic [ref=e1300]:
              - paragraph [ref=e1302]:
                - text: You can configure the
                - code [ref=e1303]: DefaultErrorHandler
                - text: and
                - code [ref=e1304]: DefaultAfterRollbackProcessor
                - text: with a record recoverer when the maximum number of failures is reached for a record. The framework provides the
                - code [ref=e1305]: DeadLetterPublishingRecoverer
                - text: ", which publishes the failed message to another topic. The recoverer requires a"
                - code [ref=e1306]: KafkaTemplate<Object, Object>
                - text: ", which is used to send the record. You can also, optionally, configure it with a"
                - code [ref=e1307]: BiFunction<ConsumerRecord<?, ?>, Exception, TopicPartition>
                - text: ", which is called to resolve the destination topic and partition."
              - table [ref=e1309]:
                - rowgroup [ref=e1310]:
                  - row [ref=e1311]:
                    - cell "Important" [ref=e1312]
                    - cell [ref=e1314]:
                      - text: By default, the dead-letter record is sent to a topic named
                      - code [ref=e1315]: <originalTopic>-dlt
                      - text: (the original topic name suffixed with
                      - code [ref=e1316]: "-dlt"
                      - text: ) and to the same partition as the original record. Therefore, when you use the default resolver, the dead-letter topic
                      - strong [ref=e1317]: must have at least as many partitions as the original topic.
              - paragraph [ref=e1319]:
                - text: If the returned
                - code [ref=e1320]: TopicPartition
                - text: has a negative partition, the partition is not set in the
                - code [ref=e1321]: ProducerRecord
                - text: ", so the partition is selected by Kafka. Starting with version 2.2.4, any"
                - code [ref=e1322]: ListenerExecutionFailedException
                - text: (thrown, for example, when an exception is detected in a
                - code [ref=e1323]: "@KafkaListener"
                - text: method) is enhanced with the
                - code [ref=e1324]: groupId
                - text: property. This allows the destination resolver to use this, in addition to the information in the
                - code [ref=e1325]: ConsumerRecord
                - text: to select the dead letter topic.
              - paragraph [ref=e1327]: "The following example shows how to wire a custom destination resolver:"
              - generic [ref=e1330]:
                - code [ref=e1331]: "java DeadLetterPublishingRecoverer recoverer = new DeadLetterPublishingRecoverer(template, (r, e) -> { if (e instanceof FooException) { return new TopicPartition(r.topic() + \".Foo.failures\", r.partition()); } else { return new TopicPartition(r.topic() + \".other.failures\", r.partition()); } }); CommonErrorHandler errorHandler = new DefaultErrorHandler(recoverer, new FixedBackOff(0L, 2L));"
                - button "Copied!" [ref=e1333] [cursor=pointer]
              - paragraph [ref=e1336]: "The record sent to the dead-letter topic is enhanced with the following headers:"
              - list [ref=e1338]:
                - listitem [ref=e1339]:
                  - paragraph [ref=e1340]:
                    - code [ref=e1341]: KafkaHeaders.DLT_EXCEPTION_FQCN
                    - text: ": The Exception class name (generally a"
                    - code [ref=e1342]: ListenerExecutionFailedException
                    - text: ", but can be others)."
                - listitem [ref=e1343]:
                  - paragraph [ref=e1344]:
                    - code [ref=e1345]: KafkaHeaders.DLT_EXCEPTION_CAUSE_FQCN
                    - text: ": The Exception cause class name, if present (since version 2.8)."
                - listitem [ref=e1346]:
                  - paragraph [ref=e1347]:
                    - code [ref=e1348]: KafkaHeaders.DLT_EXCEPTION_STACKTRACE
                    - text: ": The Exception stack trace."
                - listitem [ref=e1349]:
                  - paragraph [ref=e1350]:
                    - code [ref=e1351]: KafkaHeaders.DLT_EXCEPTION_MESSAGE
                    - text: ": The Exception message."
                - listitem [ref=e1352]:
                  - paragraph [ref=e1353]:
                    - code [ref=e1354]: KafkaHeaders.DLT_KEY_EXCEPTION_FQCN
                    - text: ": The Exception class name (key deserialization errors only)."
                - listitem [ref=e1355]:
                  - paragraph [ref=e1356]:
                    - code [ref=e1357]: KafkaHeaders.DLT_KEY_EXCEPTION_STACKTRACE
                    - text: ": The Exception stack trace (key deserialization errors only)."
                - listitem [ref=e1358]:
                  - paragraph [ref=e1359]:
                    - code [ref=e1360]: KafkaHeaders.DLT_KEY_EXCEPTION_MESSAGE
                    - text: ": The Exception message (key deserialization errors only)."
                - listitem [ref=e1361]:
                  - paragraph [ref=e1362]:
                    - code [ref=e1363]: KafkaHeaders.DLT_ORIGINAL_TOPIC
                    - text: ": The original topic."
                - listitem [ref=e1364]:
                  - paragraph [ref=e1365]:
                    - code [ref=e1366]: KafkaHeaders.DLT_ORIGINAL_PARTITION
                    - text: ": The original partition."
                - listitem [ref=e1367]:
                  - paragraph [ref=e1368]:
                    - code [ref=e1369]: KafkaHeaders.DLT_ORIGINAL_OFFSET
                    - text: ": The original offset."
                - listitem [ref=e1370]:
                  - paragraph [ref=e1371]:
                    - code [ref=e1372]: KafkaHeaders.DLT_ORIGINAL_TIMESTAMP
                    - text: ": The original timestamp."
                - listitem [ref=e1373]:
                  - paragraph [ref=e1374]:
                    - code [ref=e1375]: KafkaHeaders.DLT_ORIGINAL_TIMESTAMP_TYPE
                    - text: ": The original timestamp type."
                - listitem [ref=e1376]:
                  - paragraph [ref=e1377]:
                    - code [ref=e1378]: KafkaHeaders.DLT_ORIGINAL_CONSUMER_GROUP
                    - text: ": The original consumer group that failed to process the record (since version 2.8)."
              - paragraph [ref=e1380]:
                - text: Key exceptions are only caused by
                - code [ref=e1381]: DeserializationException
                - text: s so there is no
                - code [ref=e1382]: DLT_KEY_EXCEPTION_CAUSE_FQCN
                - text: .
              - paragraph [ref=e1384]: There are two mechanisms to add more headers.
              - list [ref=e1386]:
                - listitem [ref=e1387]:
                  - paragraph [ref=e1388]:
                    - text: Subclass the recoverer and override
                    - code [ref=e1389]: createProducerRecord()
                    - text: "- call"
                    - code [ref=e1390]: super.createProducerRecord()
                    - text: and add more headers.
                - listitem [ref=e1391]:
                  - paragraph [ref=e1392]:
                    - text: Provide a
                    - code [ref=e1393]: BiFunction
                    - text: to receive the consumer record and exception, returning a
                    - code [ref=e1394]: Headers
                    - text: object; headers from there will be copied to the final producer record; also see
                    - link "Managing Dead Letter Record Headers" [ref=e1395] [cursor=pointer]:
                      - /url: "#dlpr-headers"
                    - text: . Use
                    - code [ref=e1396]: setHeadersFunction()
                    - text: to set the
                    - code [ref=e1397]: BiFunction
                    - text: .
              - paragraph [ref=e1399]: The second is simpler to implement but the first has more information available, including the already assembled standard headers.
              - paragraph [ref=e1401]:
                - text: Starting with version 2.3, when used in conjunction with an
                - code [ref=e1402]: ErrorHandlingDeserializer
                - text: ", the publisher will restore the record"
                - code [ref=e1403]: value()
                - text: ", in the dead-letter producer record, to the original value that failed to be deserialized. Previously, the"
                - code [ref=e1404]: value()
                - text: was null and user code had to decode the
                - code [ref=e1405]: DeserializationException
                - text: from the message headers. In addition, you can provide multiple
                - code [ref=e1406]: KafkaTemplate
                - text: s to the publisher; this might be needed, for example, if you want to publish the
                - code [ref=e1407]: byte[]
                - text: from a
                - code [ref=e1408]: DeserializationException
                - text: ", as well as values using a different serializer from records that were deserialized successfully. Here is an example of configuring the publisher with"
                - code [ref=e1409]: KafkaTemplate
                - text: s that use a
                - code [ref=e1410]: String
                - text: and
                - code [ref=e1411]: byte[]
                - text: "serializer:"
              - generic [ref=e1414]:
                - code [ref=e1415]:
                  - text: java @Bean
                  - generic [ref=e1416]: public DeadLetterPublishingRecoverer publisher(KafkaTemplate<?, ?> stringTemplate, KafkaTemplate<?, ?> bytesTemplate)
                  - text: "{ Map<Class<?>, KafkaOperations<?, ?>> templates = new LinkedHashMap<>(); templates.put(String"
                  - generic [ref=e1417]: .class, stringTemplate)
                  - text: ; templates.put(byte[]
                  - generic [ref=e1418]: .class, bytesTemplate)
                  - text: "; return new DeadLetterPublishingRecoverer(templates); }"
                - button "Copied!" [ref=e1420] [cursor=pointer]
              - paragraph [ref=e1423]:
                - text: The publisher uses the map keys to locate a template that is suitable for the
                - code [ref=e1424]: value()
                - text: about to be published. A
                - code [ref=e1425]: LinkedHashMap
                - text: is recommended so that the keys are examined in order.
              - paragraph [ref=e1427]:
                - text: When publishing
                - code [ref=e1428]: "null"
                - text: values, and there are multiple templates, the recoverer will look for a template for the
                - code [ref=e1429]: Void
                - text: class; if none is present, the first template from the
                - code [ref=e1430]: values().iterator()
                - text: will be used.
              - paragraph [ref=e1432]:
                - text: Since 2.7 you can use the
                - code [ref=e1433]: setFailIfSendResultIsError
                - text: method so that an exception is thrown when message publishing fails. You can also set a timeout for the verification of the sender success with
                - code [ref=e1434]: setWaitForSendResultTimeout
                - text: .
              - table [ref=e1436]:
                - rowgroup [ref=e1437]:
                  - row [ref=e1438]:
                    - cell "Important" [ref=e1439]
                    - cell [ref=e1441]:
                      - text: If the recoverer fails (throws an exception), the failed record will be included in the seeks. Starting with version 2.5.5, if the recoverer fails, the
                      - code [ref=e1442]: BackOff
                      - text: will be reset by default and redeliveries will again go through the back offs before recovery is attempted again. With earlier versions, the
                      - code [ref=e1443]: BackOff
                      - text: was not reset and recovery was re-attempted on the next failure. To revert to the previous behavior, set the error handler’s
                      - code [ref=e1444]: resetStateOnRecoveryFailure
                      - text: property to
                      - code [ref=e1445]: "false"
                      - text: .
              - paragraph [ref=e1447]:
                - text: Starting with version 2.6.3, set
                - code [ref=e1448]: resetStateOnExceptionChange
                - text: to
                - code [ref=e1449]: "true"
                - text: and the retry sequence will be restarted (including the selection of a new
                - code [ref=e1450]: BackOff
                - text: ", if so configured) if the exception type changes between failures. By default, the exception type is not considered."
              - paragraph [ref=e1452]:
                - text: Starting with version 2.3, the recoverer can also be used with Kafka Streams - see
                - link "Recovery from Deserialization Exceptions" [ref=e1453] [cursor=pointer]:
                  - /url: ../streams.html#streams-deser-recovery
                - text: for more information.
              - paragraph [ref=e1455]:
                - text: The
                - code [ref=e1456]: ErrorHandlingDeserializer
                - text: adds the deserialization exception(s) in headers
                - code [ref=e1457]: ErrorHandlingDeserializer.VALUE_DESERIALIZER_EXCEPTION_HEADER
                - text: and
                - code [ref=e1458]: ErrorHandlingDeserializer.KEY_DESERIALIZER_EXCEPTION_HEADER
                - text: (using Java serialization). By default, these headers are not retained in the message published to the dead letter topic. Starting with version 2.7, if both the key and value fail deserialization, the original values of both are populated in the record sent to the DLT.
              - paragraph [ref=e1460]:
                - text: If incoming records are dependent on each other, but may arrive out of order, it may be useful to republish a failed record to the tail of the original topic (for some number of times), instead of sending it directly to the dead letter topic. See
                - link "this Stack Overflow Question" [ref=e1461] [cursor=pointer]:
                  - /url: https://stackoverflow.com/questions/64646996
                - text: for an example.
              - paragraph [ref=e1463]: "The following error handler configuration will do exactly that:"
              - generic [ref=e1466]:
                - code [ref=e1467]:
                  - text: java @Bean
                  - generic [ref=e1468]: public ErrorHandler eh(KafkaOperations<String, String> template)
                  - text: "{ return new DefaultErrorHandler(new DeadLetterPublishingRecoverer(template, (rec, ex) -> { org.apache.kafka.common.header.Header retries = rec.headers().lastHeader(\"retries\"); if (retries == null) { retries = new RecordHeader(\"retries\", new byte[] { 1 }); rec.headers().add(retries); } else { retries.value()[0]++; } return retries.value()[0] > 5 ? new TopicPartition(\"topic-dlt\", rec.partition()) : new TopicPartition(\"topic\", rec.partition()); }), new FixedBackOff(0L, 0L)); }"
                - button "Copied!" [ref=e1470] [cursor=pointer]
              - paragraph [ref=e1473]:
                - text: Starting with version 2.7, the recoverer checks that the partition selected by the destination resolver actually exists. If the partition is not present, the partition in the
                - code [ref=e1474]: ProducerRecord
                - text: is set to
                - code [ref=e1475]: "null"
                - text: ", allowing the"
                - code [ref=e1476]: KafkaProducer
                - text: to select the partition. You can disable this check by setting the
                - code [ref=e1477]: verifyPartition
                - text: property to
                - code [ref=e1478]: "false"
                - text: .
              - paragraph [ref=e1480]:
                - text: Starting with version 3.1, setting the
                - code [ref=e1481]: logRecoveryRecord
                - text: property to
                - code [ref=e1482]: "true"
                - text: will log the recovery record and exception.
          - generic [ref=e1483]:
            - heading "Managing Dead Letter Record Headers" [level=2] [ref=e1484]
            - generic [ref=e1485]:
              - paragraph [ref=e1487]:
                - text: Referring to
                - link "Publishing Dead-letter Records" [ref=e1488] [cursor=pointer]:
                  - /url: "#dead-letters"
                - text: above, the
                - code [ref=e1489]: DeadLetterPublishingRecoverer
                - text: has two properties used to manage headers when those headers already exist (such as when reprocessing a dead letter record that failed, including when using
                - link "Non-Blocking Retries" [ref=e1490] [cursor=pointer]:
                  - /url: ../retrytopic.html
                - text: ).
              - list [ref=e1492]:
                - listitem [ref=e1493]:
                  - paragraph [ref=e1494]:
                    - code [ref=e1495]: appendOriginalHeaders
                    - text: (default
                    - code [ref=e1496]: "true"
                    - text: )
                - listitem [ref=e1497]:
                  - paragraph [ref=e1498]:
                    - code [ref=e1499]: stripPreviousExceptionHeaders
                    - text: (default
                    - code [ref=e1500]: "true"
                    - text: since version 2.8)
              - paragraph [ref=e1502]:
                - text: Apache Kafka supports multiple headers with the same name; to obtain the "latest" value, you can use
                - code [ref=e1503]: headers.lastHeader(headerName)
                - text: ; to get an iterator over multiple headers, use
                - code [ref=e1504]: headers.headers(headerName).iterator()
                - text: .
              - paragraph [ref=e1506]:
                - text: When repeatedly republishing a failed record, these headers can grow (and eventually cause publication to fail due to a
                - code [ref=e1507]: RecordTooLargeException
                - text: ); this is especially true for the exception headers and particularly for the stack trace headers.
              - paragraph [ref=e1509]: The reason for the two properties is because, while you might want to retain only the last exception information, you might want to retain the history of which topic(s) the record passed through for each failure.
              - paragraph [ref=e1511]:
                - code [ref=e1512]: appendOriginalHeaders
                - text: is applied to all headers named
                - code [ref=e1513]:
                  - strong [ref=e1514]: ORIGINAL
                - text: while
                - code [ref=e1515]: stripPreviousExceptionHeaders
                - text: is applied to all headers named
                - code [ref=e1516]:
                  - strong [ref=e1517]: EXCEPTION
                - text: .
              - paragraph [ref=e1519]:
                - text: Starting with version 2.8.4, you now can control which of the standard headers will be added to the output record. See the
                - code [ref=e1520]: enum HeadersToAdd
                - text: for the generic names of the (currently) 10 standard headers that are added by default (these are not the actual header names, just an abstraction; the actual header names are set up by the
                - code [ref=e1521]: getHeaderNames()
                - text: method which subclasses can override.
              - paragraph [ref=e1523]:
                - text: To exclude headers, use the
                - code [ref=e1524]: excludeHeaders()
                - text: "method; for example, to suppress adding the exception stack trace in a header, use:"
              - generic [ref=e1527]:
                - code [ref=e1528]: java DeadLetterPublishingRecoverer recoverer = new DeadLetterPublishingRecoverer(template); recoverer.excludeHeaders(HeaderNames.HeadersToAdd.EX_STACKTRACE);
                - button "Copied!" [ref=e1530] [cursor=pointer]
              - paragraph [ref=e1533]:
                - text: In addition, you can completely customize the addition of exception headers by adding an
                - code [ref=e1534]: ExceptionHeadersCreator
                - text: ; this also disables all standard exception headers.
              - generic [ref=e1537]:
                - code [ref=e1538]: "java DeadLetterPublishingRecoverer recoverer = new DeadLetterPublishingRecoverer(template); recoverer.setExceptionHeadersCreator((kafkaHeaders, exception, isKey, headerNames) -> { kafkaHeaders.add(new RecordHeader(..., ...)); });"
                - button "Copied!" [ref=e1540] [cursor=pointer]
              - paragraph [ref=e1543]:
                - text: Also starting with version 2.8.4, you can now provide multiple headers functions, via the
                - code [ref=e1544]: addHeadersFunction
                - text: method. This allows additional functions to apply, even if another function has already been registered, for example, when using
                - link "Non-Blocking Retries" [ref=e1545] [cursor=pointer]:
                  - /url: ../retrytopic.html
                - text: .
              - paragraph [ref=e1547]:
                - text: Also see
                - link "Failure Header Management" [ref=e1548] [cursor=pointer]:
                  - /url: ../retrytopic/features.html#retry-headers
                - text: with
                - link "Non-Blocking Retries" [ref=e1549] [cursor=pointer]:
                  - /url: ../retrytopic.html
                - text: .
          - generic [ref=e1550]:
            - heading [level=2] [ref=e1551]:
              - code [ref=e1552]: ExponentialBackOffWithMaxRetries
              - text: Implementation
            - generic [ref=e1553]:
              - paragraph [ref=e1555]:
                - text: Spring Framework provides a number of
                - code [ref=e1556]: BackOff
                - text: implementations. By default, the
                - code [ref=e1557]: ExponentialBackOff
                - text: will retry indefinitely; to give up after some number of retry attempts requires calculating the
                - code [ref=e1558]: maxElapsedTime
                - text: . Since version 2.7.3, Spring for Apache Kafka provides the
                - code [ref=e1559]: ExponentialBackOffWithMaxRetries
                - text: which is a subclass that receives the
                - code [ref=e1560]: maxRetries
                - text: property and automatically calculates the
                - code [ref=e1561]: maxElapsedTime
                - text: ", which is a little more convenient."
              - generic [ref=e1564]:
                - code [ref=e1565]:
                  - text: java @Bean
                  - generic [ref=e1566]: DefaultErrorHandler handler()
                  - text: "{ ExponentialBackOffWithMaxRetries bo = new ExponentialBackOffWithMaxRetries(6); bo.setInitialInterval(1_000L); bo.setMultiplier(2.0); bo.setMaxInterval(10_000L); return new DefaultErrorHandler(myRecoverer, bo); }"
                - button "Copied!" [ref=e1568] [cursor=pointer]
              - paragraph [ref=e1571]:
                - text: This will retry after
                - code [ref=e1572]: 1, 2, 4, 8, 10, 10
                - text: seconds, before calling the recoverer.
