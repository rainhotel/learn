          - heading "Handling Exceptions" [level=1] [ref=e222]
          - paragraph [ref=e226]: This section describes how to handle various exceptions that may arise when you use Spring for Apache Kafka.
          - generic [ref=e227]:
            - heading "Listener Error Handlers" [level=2] [ref=e228]
            - generic [ref=e229]:
              - paragraph [ref=e231]:
                - text: Starting with version 2.0, the
                - code [ref=e232]: "@KafkaListener"
                - text: "annotation has a new attribute:"
                - code [ref=e233]: errorHandler
                - text: .
              - paragraph [ref=e235]:
                - text: You can use the
                - code [ref=e236]: errorHandler
                - text: to provide the bean name of a
                - code [ref=e237]: KafkaListenerErrorHandler
                - text: "implementation. This functional interface has one method, as the following listing shows:"
              - generic [ref=e240]:
                - code [ref=e241]:
                  - text: java @FunctionalInterface public
                  - generic [ref=e242]: interface KafkaListenerErrorHandler
                  - text: "{"
                  - generic [ref=e243]: Object handleError(Message<?> message, ListenerExecutionFailedException exception) throws Exception
                  - text: "; }"
                - button "Copied!" [ref=e245] [cursor=pointer]
              - paragraph [ref=e248]:
                - text: You have access to the spring-messaging
                - code [ref=e249]: Message<?>
                - text: object produced by the message converter and the exception that was thrown by the listener, which is wrapped in a
                - code [ref=e250]: ListenerExecutionFailedException
                - text: . The error handler can throw the original or a new exception, which is thrown to the container. Anything returned by the error handler is ignored.
              - paragraph [ref=e252]:
                - text: Starting with version 2.7, you can set the
                - code [ref=e253]: rawRecordHeader
                - text: property on the
                - code [ref=e254]: MessagingMessageConverter
                - text: and
                - code [ref=e255]: BatchMessagingMessageConverter
                - text: which causes the raw
                - code [ref=e256]: ConsumerRecord
                - text: to be added to the converted
                - code [ref=e257]: Message<?>
                - text: in the
                - code [ref=e258]: KafkaHeaders.RAW_DATA
                - text: header. This is useful, for example, if you wish to use a
                - code [ref=e259]: DeadLetterPublishingRecoverer
                - text: in a listener error handler. It might be used in a request/reply scenario where you wish to send a failure result to the sender, after some number of retries, after capturing the failed record in a dead letter topic.
              - generic [ref=e262]:
                - code [ref=e263]:
                  - text: java @Bean
                  - generic [ref=e264]: public KafkaListenerErrorHandler eh(DeadLetterPublishingRecoverer recoverer)
                  - text: "{ return (msg, ex) -> { if (msg.getHeaders().get(KafkaHeaders.DELIVERY_ATTEMPT, Integer"
                  - generic [ref=e265]: .class) > 9)
                  - text: "{ recoverer.accept(msg.getHeaders().get(KafkaHeaders.RAW_DATA, ConsumerRecord"
                  - generic [ref=e266]: .class), ex)
                  - text: "; return \"FAILED\"; } throw ex; }; }"
                - button "Copied!" [ref=e268] [cursor=pointer]
              - paragraph [ref=e271]:
                - text: It has a sub-interface (
                - code [ref=e272]: ConsumerAwareListenerErrorHandler
                - text: ") that has access to the consumer object, through the following method:"
              - generic [ref=e275]:
                - code [ref=e276]:
                  - text: java
                  - generic [ref=e277]: Object handleError(Message<?> message, ListenerExecutionFailedException exception, Consumer<?, ?> consumer)
                  - text: ;
                - button "Copied!" [ref=e279] [cursor=pointer]
              - paragraph [ref=e282]:
                - text: Another sub-interface (
                - code [ref=e283]: ManualAckListenerErrorHandler
                - text: ) provides access to the
                - code [ref=e284]: Acknowledgment
                - text: object when using manual
                - code [ref=e285]: AckMode
                - text: s.
              - generic [ref=e288]:
                - code [ref=e289]:
                  - text: java
                  - generic [ref=e290]: Object handleError(Message<?> message, ListenerExecutionFailedException exception, Consumer<?, ?> consumer, @Nullable Acknowledgment ack)
                  - text: ;
                - button "Copied!" [ref=e292] [cursor=pointer]
              - paragraph [ref=e295]: In either case, you should NOT perform any seeks on the consumer because the container would be unaware of them.
          - generic [ref=e296]:
            - heading "Container Error Handlers" [level=2] [ref=e297]
            - generic [ref=e298]:
              - paragraph [ref=e300]:
                - text: Starting with version 2.8, the legacy
                - code [ref=e301]: ErrorHandler
                - text: and
                - code [ref=e302]: BatchErrorHandler
                - text: interfaces have been superseded by a new
                - code [ref=e303]: CommonErrorHandler
                - text: . These error handlers can handle errors for both record and batch listeners, allowing a single listener container factory to create containers for both types of listener.
                - code [ref=e304]: CommonErrorHandler
                - text: implementations to replace most legacy framework error handler implementations are provided.
              - paragraph [ref=e306]:
                - text: See
                - link [ref=e307] [cursor=pointer]:
                  - /url: "#migrating-legacy-eh"
                  - text: Migrating Custom Legacy Error Handler Implementations to
                  - code [ref=e308]: CommonErrorHandler
                - text: for information to migrate custom error handlers to
                - code [ref=e309]: CommonErrorHandler
                - text: .
              - paragraph [ref=e311]:
                - text: When transactions are being used, no error handlers are configured, by default, so that the exception will roll back the transaction. Error handling for transactional containers are handled by the
                - link [ref=e312] [cursor=pointer]:
                  - /url: "#after-rollback"
                  - code [ref=e313]: AfterRollbackProcessor
                - text: . If you provide a custom error handler when using transactions, it must throw an exception if you want the transaction rolled back.
              - paragraph [ref=e315]:
                - text: This interface has a default method
                - code [ref=e316]: isAckAfterHandle()
                - text: which is called by the container to determine whether the offset(s) should be committed if the error handler returns without throwing an exception; it returns true by default.
              - paragraph [ref=e318]:
                - text: Typically, the error handlers provided by the framework will throw an exception when the error is not "handled" (e.g. after performing a seek operation). By default, such exceptions are logged by the container at
                - code [ref=e319]: ERROR
                - text: level. All of the framework error handlers extend
                - code [ref=e320]: KafkaExceptionLogLevelAware
                - text: which allows you to control the level at which these exceptions are logged.
              - generic [ref=e323]:
                - code [ref=e324]:
                  - text: java
                  - generic [ref=e325]: /** * Set the level at which the exception thrown by this handler is logged. * @param logLevel the level (default ERROR). */
                  - generic [ref=e326]: public void setLogLevel(KafkaException.Level logLevel)
                  - text: "{ ... }"
                - button "Copied!" [ref=e328] [cursor=pointer]
              - paragraph [ref=e331]: "You can specify a global error handler to be used for all listeners in the container factory. The following example shows how to do so:"
              - generic [ref=e334]:
                - code [ref=e335]: "java @Bean public KafkaListenerContainerFactory<ConcurrentMessageListenerContainer<Integer, String>> kafkaListenerContainerFactory() { ConcurrentKafkaListenerContainerFactory<Integer, String> factory = new ConcurrentKafkaListenerContainerFactory<>(); ... factory.setCommonErrorHandler(myErrorHandler); ... return factory; }"
                - button "Copied!" [ref=e337] [cursor=pointer]
              - paragraph [ref=e340]: By default, if an annotated listener method throws an exception, it is thrown to the container, and the message is handled according to the container configuration.
              - paragraph [ref=e342]: The container commits any pending offset commits before calling the error handler.
              - paragraph [ref=e344]:
                - text: If you are using Spring Boot, you simply need to add the error handler as a
                - code [ref=e345]: "@Bean"
                - text: and Boot will add it to the auto-configured factory.
          - generic [ref=e346]:
            - heading "Back Off Handlers" [level=2] [ref=e347]
            - paragraph [ref=e350]:
              - text: Error handlers such as the
              - link "DefaultErrorHandler" [ref=e351] [cursor=pointer]:
                - /url: "#default-eh"
              - text: use a
              - code [ref=e352]: BackOff
              - text: to determine how long to wait before retrying a delivery. Starting with version 2.9, you can configure a custom
              - code [ref=e353]: BackOffHandler
              - text: . The default handler simply suspends the thread until the back off time passes (or the container is stopped). The framework also provides the
              - code [ref=e354]: ContainerPausingBackOffHandler
              - text: which pauses the listener container until the back off time passes and then resumes the container. This is useful when the delays are longer than the
              - code [ref=e355]: max.poll.interval.ms
              - text: consumer property. Note that the resolution of the actual back off time will be affected by the
              - code [ref=e356]: pollTimeout
              - text: container property.
          - generic [ref=e357]:
            - heading "DefaultErrorHandler" [level=2] [ref=e358]
            - generic [ref=e359]:
              - paragraph [ref=e361]:
                - text: This new error handler replaces the
                - code [ref=e362]: SeekToCurrentErrorHandler
                - text: and
                - code [ref=e363]: RecoveringBatchErrorHandler
                - text: ", which have been the default error handlers for several releases now. One difference is that the fallback behavior for batch listeners (when an exception other than a"
                - code [ref=e364]: BatchListenerFailedException
                - text: is thrown) is the equivalent of the
                - link "Retrying Complete Batches" [ref=e365] [cursor=pointer]:
                  - /url: "#retrying-batch-eh"
                - text: .
              - table [ref=e367]:
                - rowgroup [ref=e368]:
                  - row [ref=e369]:
                    - cell "Important" [ref=e370]
                    - cell [ref=e372]:
                      - text: Starting with version 2.9, the
                      - code [ref=e373]: DefaultErrorHandler
                      - text: can be configured to provide the same semantics as seeking the unprocessed record offsets as discussed below, but without actually seeking. Instead, the records are retained by the listener container and resubmitted to the listener after the error handler exits (and after performing a single paused
                      - code [ref=e374]: poll()
                      - text: ", to keep the consumer alive; if"
                      - link "Non-Blocking Retries" [ref=e375] [cursor=pointer]:
                        - /url: ../retrytopic.html
                      - text: or a
                      - code [ref=e376]: ContainerPausingBackOffHandler
                      - text: are being used, the pause may extend over multiple polls). The error handler returns a result to the container that indicates whether the current failing record can be resubmitted, or if it was recovered and then it will not be sent to the listener again. To enable this mode, set the property
                      - code [ref=e377]: seekAfterError
                      - text: to
                      - code [ref=e378]: "false"
                      - text: .
              - paragraph [ref=e380]:
                - text: The error handler can recover (skip) a record that keeps failing. By default, after ten failures, the failed record is logged (at the
                - code [ref=e381]: ERROR
                - text: level). You can configure the handler with a custom recoverer (
                - code [ref=e382]: BiConsumer
                - text: ) and a
                - code [ref=e383]: BackOff
                - text: that controls the delivery attempts and delays between each. Using a
                - code [ref=e384]: FixedBackOff
                - text: with
                - code [ref=e385]: FixedBackOff.UNLIMITED_ATTEMPTS
                - text: "causes (effectively) infinite retries. The following example configures recovery after three tries:"
              - generic [ref=e388]:
                - code [ref=e389]: "java DefaultErrorHandler errorHandler = new DefaultErrorHandler((record, exception) -> { // recover after 3 failures, with no back off - e.g. send to a dead-letter topic }, new FixedBackOff(0L, 2L));"
                - button "Copied!" [ref=e391] [cursor=pointer]
              - paragraph [ref=e394]: To configure the listener container with a customized instance of this handler, add it to the container factory.
              - paragraph [ref=e396]:
                - text: For example, with the
                - code [ref=e397]: "@KafkaListener"
                - text: container factory, you can add
                - code [ref=e398]: DefaultErrorHandler
                - text: "as follows:"
              - generic [ref=e401]:
                - code [ref=e402]:
                  - text: java @Bean
                  - generic [ref=e403]: public ConcurrentKafkaListenerContainerFactory<String, String> kafkaListenerContainerFactory()
                  - text: "{ ConcurrentKafkaListenerContainerFactory<String, String> factory = new ConcurrentKafkaListenerContainerFactory<>(); factory.setConsumerFactory(consumerFactory()); factory.getContainerProperties().setAckMode(AckMode.RECORD); factory.setCommonErrorHandler(new DefaultErrorHandler(new FixedBackOff(1000L, 2L))); return factory; }"
                - button "Copied!" [ref=e405] [cursor=pointer]
              - paragraph [ref=e408]:
                - text: For a record listener, this will retry a delivery up to 2 times (3 delivery attempts) with a back off of 1 second, instead of the default configuration (
                - code [ref=e409]: FixedBackOff(0L, 9)
                - text: ). Failures are simply logged after retries are exhausted.
              - paragraph [ref=e411]:
                - text: As an example, if the
                - code [ref=e412]: poll
                - text: returns six records (two from each partition 0, 1, 2) and the listener throws an exception on the fourth record, the container acknowledges the first three messages by committing their offsets. The
                - code [ref=e413]: DefaultErrorHandler
                - text: seeks to offset 1 for partition 1 and offset 0 for partition 2. The next
                - code [ref=e414]: poll()
                - text: returns the three unprocessed records.
              - paragraph [ref=e416]:
                - text: If the
                - code [ref=e417]: AckMode
                - text: was
                - code [ref=e418]: BATCH
                - text: ", the container commits the offsets for the first two partitions before calling the error handler."
              - paragraph [ref=e420]:
                - text: For a batch listener, the listener must throw a
                - code [ref=e421]: BatchListenerFailedException
                - text: indicating which records in the batch failed.
              - paragraph [ref=e423]: "The sequence of events is:"
              - list [ref=e425]:
                - listitem [ref=e426]:
                  - paragraph [ref=e427]: Commit the offsets of the records before the index.
                - listitem [ref=e428]:
                  - paragraph [ref=e429]: If retries are not exhausted, perform seeks so that all the remaining records (including the failed record) will be redelivered.
                - listitem [ref=e430]:
                  - paragraph [ref=e431]: If retries are exhausted, attempt recovery of the failed record (default log only) and perform seeks so that the remaining records (excluding the failed record) will be redelivered. The recovered record’s offset is committed.
                - listitem [ref=e432]:
                  - paragraph [ref=e433]: If retries are exhausted and recovery fails, seeks are performed as if retries are not exhausted.
              - table [ref=e435]:
                - rowgroup [ref=e436]:
                  - row [ref=e437]:
                    - cell "Important" [ref=e438]
                    - cell [ref=e440]:
                      - text: Starting with version 2.9, the
                      - code [ref=e441]: DefaultErrorHandler
                      - text: can be configured to provide the same semantics as seeking the unprocessed record offsets as discussed above, but without actually seeking. Instead, error handler creates a new
                      - code [ref=e442]: ConsumerRecords<?, ?>
                      - text: containing just the unprocessed records which will then be submitted to the listener (after performing a single paused
                      - code [ref=e443]: poll()
                      - text: ", to keep the consumer alive). To enable this mode, set the property"
                      - code [ref=e444]: seekAfterError
                      - text: to
                      - code [ref=e445]: "false"
                      - text: .
              - paragraph [ref=e447]:
                - text: The default recoverer logs the failed record after retries are exhausted. You can use a custom recoverer, or one provided by the framework such as the
                - link [ref=e448] [cursor=pointer]:
                  - /url: "#dead-letters"
                  - code [ref=e449]: DeadLetterPublishingRecoverer
                - text: .
              - paragraph [ref=e451]:
                - text: When using a POJO batch listener (e.g.
                - code [ref=e452]: List<Thing>
                - text: "), and you don’t have the full consumer record to add to the exception, you can just add the index of the record that failed:"
              - generic [ref=e455]:
                - code [ref=e456]:
                  - text: java @KafkaListener(id = "recovering", topics = "someTopic")
                  - generic [ref=e457]: public void listen(List<Thing> things)
                  - text: "{ for (int i = 0; i < things.size(); i++) { try { process(things.get(i)); } catch (Exception e) { throw new BatchListenerFailedException(\"Failed to process\", i); } } }"
                - button "Copied!" [ref=e459] [cursor=pointer]
              - paragraph [ref=e462]:
                - text: When the container is configured with
                - code [ref=e463]: AckMode.MANUAL_IMMEDIATE
                - text: ", the error handler can be configured to commit the offset of recovered records; set the"
                - code [ref=e464]: commitRecovered
                - text: property to
                - code [ref=e465]: "true"
                - text: .
              - paragraph [ref=e467]:
                - text: See also
                - link "Publishing Dead-letter Records" [ref=e468] [cursor=pointer]:
                  - /url: "#dead-letters"
                - text: .
              - paragraph [ref=e470]:
                - text: When using transactions, similar functionality is provided by the
                - code [ref=e471]: DefaultAfterRollbackProcessor
                - text: . See
                - link "After-rollback Processor" [ref=e472] [cursor=pointer]:
                  - /url: "#after-rollback"
                - text: .
              - paragraph [ref=e474]:
                - text: The
                - code [ref=e475]: DefaultErrorHandler
                - text: "considers certain exceptions to be fatal, and retries are skipped for such exceptions; the recoverer is invoked on the first failure. The exceptions that are considered fatal, by default, are:"
              - list [ref=e477]:
                - listitem [ref=e478]:
                  - paragraph [ref=e479]:
                    - code [ref=e480]: DeserializationException
                - listitem [ref=e481]:
                  - paragraph [ref=e482]:
                    - code [ref=e483]: MessageConversionException
                - listitem [ref=e484]:
                  - paragraph [ref=e485]:
                    - code [ref=e486]: ConversionException
                - listitem [ref=e487]:
                  - paragraph [ref=e488]:
                    - code [ref=e489]: MethodArgumentResolutionException
                - listitem [ref=e490]:
                  - paragraph [ref=e491]:
                    - code [ref=e492]: NoSuchMethodException
                - listitem [ref=e493]:
                  - paragraph [ref=e494]:
                    - code [ref=e495]: ClassCastException
              - paragraph [ref=e497]: since these exceptions are unlikely to be resolved on a retried delivery.
              - paragraph [ref=e499]:
                - text: You can add more exception types to the not-retryable category, or completely replace the map of classified exceptions. See the Javadocs for
                - code [ref=e500]: DefaultErrorHandler.addNotRetryableException()
                - text: and
                - code [ref=e501]: DefaultErrorHandler.setClassifications()
                - text: for more information, as well as
                - code [ref=e502]: ExceptionMatcher
                - text: .
              - paragraph [ref=e504]:
                - text: Here is an example that adds
                - code [ref=e505]: IllegalArgumentException
                - text: "to the not-retryable exceptions:"
              - generic [ref=e508]:
                - code [ref=e509]:
                  - text: java @Bean
                  - generic [ref=e510]: public DefaultErrorHandler errorHandler(ConsumerRecordRecoverer recoverer)
                  - text: "{ DefaultErrorHandler handler = new DefaultErrorHandler(recoverer); handler.addNotRetryableExceptions(IllegalArgumentException"
                  - generic [ref=e511]: .class)
                  - text: "; return handler; }"
                - button "Copied!" [ref=e513] [cursor=pointer]
              - table [ref=e516]:
                - rowgroup [ref=e517]:
                  - row [ref=e518]:
                    - cell "Important" [ref=e519]
                    - cell [ref=e521]:
                      - text: The
                      - code [ref=e522]: DefaultErrorHandler
                      - text: only processes exceptions that inherit from
                      - code [ref=e523]: RuntimeException
                      - text: . Exceptions inheriting from
                      - code [ref=e524]: Error
                      - text: bypass the error handler entirely, causing the consumer to terminate immediately, close the Kafka connection, and skip all retry/recovery mechanisms. This critical distinction means applications may report healthy status despite having terminated consumers that no longer process messages. Always ensure that exceptions thrown in message processing code explicitly extend from
                      - code [ref=e525]: RuntimeException
                      - text: rather than
                      - code [ref=e526]: Error
                      - text: to allow proper error handling. In other words, if the application throws an exception, ensure that it is extended from
                      - code [ref=e527]: RuntimeException
                      - text: and not inadvertently inherited from
                      - code [ref=e528]: Error
                      - text: . Standard errors like
                      - code [ref=e529]: OutOfMemoryError
                      - text: ","
                      - code [ref=e530]: IllegalAccessError
                      - text: ", and other errors beyond the control of the application are still treated as"
                      - code [ref=e531]: Error
                      - text: s and not retried.
              - paragraph [ref=e533]:
                - text: The error handler can be configured with one or more
                - code [ref=e534]: RetryListener
                - text: s, receiving notifications of retry and recovery progress. Starting with version 2.8.10, methods for batch listeners were added.
              - generic [ref=e537]:
                - code [ref=e538]:
                  - text: java @FunctionalInterface public
                  - generic [ref=e539]: interface RetryListener
                  - text: "{"
                  - generic [ref=e540]:
                    - text: void failedDelivery
                    - generic [ref=e541]: (ConsumerRecord<?, ?> record, Exception ex, int deliveryAttempt)
                  - text: ;
                  - generic [ref=e542]: default void recovered(ConsumerRecord<?, ?> record, Exception ex)
                  - text: "{ }"
                  - generic [ref=e543]: default void recoveryFailed(ConsumerRecord<?, ?> record, Exception original, Exception failure)
                  - text: "{ }"
                  - generic [ref=e544]:
                    - text: default void failedDelivery
                    - generic [ref=e545]: (ConsumerRecords<?, ?> records, Exception ex, int deliveryAttempt)
                  - text: "{ }"
                  - generic [ref=e546]: default void recovered(ConsumerRecords<?, ?> records, Exception ex)
                  - text: "{ }"
                  - generic [ref=e547]: default void recoveryFailed(ConsumerRecords<?, ?> records, Exception original, Exception failure)
                  - text: "{ } }"
                - button "Copied!" [ref=e549] [cursor=pointer]
              - paragraph [ref=e552]: See the JavaDocs for more information.
              - table [ref=e554]:
                - rowgroup [ref=e555]:
                  - row [ref=e556]:
                    - cell "Important" [ref=e557]
                    - cell [ref=e559]:
                      - text: If the recoverer fails (throws an exception), the failed record will be included in the seeks. If the recoverer fails, the
                      - code [ref=e560]: BackOff
                      - text: will be reset by default and redeliveries will again go through the back offs before recovery is attempted again. To skip retries after a recovery failure, set the error handler’s
                      - code [ref=e561]: resetStateOnRecoveryFailure
                      - text: to
                      - code [ref=e562]: "false"
                      - text: .
              - paragraph [ref=e564]:
                - text: You can provide the error handler with a
                - code [ref=e565]: BiFunction<ConsumerRecord<?, ?>, Exception, BackOff>
                - text: to determine the
                - code [ref=e566]: BackOff
                - text: "to use, based on the failed record and/or the exception:"
              - generic [ref=e569]:
                - code [ref=e570]: "java handler.setBackOffFunction((record, ex) -> { ... });"
                - button "Copied!" [ref=e572] [cursor=pointer]
              - paragraph [ref=e575]:
                - text: If the function returns
                - code [ref=e576]: "null"
                - text: ", the handler’s default"
                - code [ref=e577]: BackOff
                - text: will be used.
              - paragraph [ref=e579]:
                - text: Set
                - code [ref=e580]: resetStateOnExceptionChange
                - text: to
                - code [ref=e581]: "true"
                - text: and the retry sequence will be restarted (including the selection of a new
                - code [ref=e582]: BackOff
                - text: ", if so configured) if the exception type changes between failures. When"
                - code [ref=e583]: "false"
                - text: (the default before version 2.9), the exception type is not considered.
              - paragraph [ref=e585]:
                - text: Starting with version 2.9, this is now
                - code [ref=e586]: "true"
                - text: by default.
              - paragraph [ref=e588]:
                - text: Also see
                - link "Delivery Attempts Header" [ref=e589] [cursor=pointer]:
                  - /url: "#delivery-header"
                - text: .
          - generic [ref=e590]:
            - heading "Batch Listener Error Handling with Dead Letter Topics" [level=2] [ref=e591]
            - generic [ref=e592]:
              - table [ref=e594]:
                - rowgroup [ref=e595]:
                  - row [ref=e596]:
                    - cell "Important" [ref=e597]
                    - cell [ref=e599]:
                      - link "Non-Blocking Retries" [ref=e600] [cursor=pointer]:
                        - /url: ../retrytopic.html
                      - text: (the
                      - code [ref=e601]: "@RetryableTopic"
                      - text: annotation) are NOT supported with batch listeners. For Dead Letter Topic functionality with batch listeners, use
                      - code [ref=e602]: DefaultErrorHandler
                      - text: with
                      - code [ref=e603]: DeadLetterPublishingRecoverer
                      - text: .
              - generic [ref=e604]:
                - heading "Using BatchListenerFailedException" [level=3] [ref=e605]
                - paragraph [ref=e607]:
                  - text: To indicate which specific record in a batch failed, throw a
                  - code [ref=e608]: BatchListenerFailedException
                  - text: ":"
                - generic [ref=e611]:
                  - code [ref=e612]:
                    - text: java @KafkaListener(id = "batch-listener", topics = "myTopic", containerFactory = "batchFactory")
                    - generic [ref=e613]: public void listen(List<ConsumerRecord<String, Order>> records)
                    - text: "{ for (ConsumerRecord<String, Order> record : records) { try { process(record.value()); } catch (Exception e) { // Identifies the failed record for error handling throw new BatchListenerFailedException(\"Failed to process\", e, record); } } }"
                  - button "Copied!" [ref=e615] [cursor=pointer]
                - paragraph [ref=e618]:
                  - text: For POJO batch listeners where you don’t have the
                  - code [ref=e619]: ConsumerRecord
                  - text: ", use the index instead:"
                - generic [ref=e622]:
                  - code [ref=e623]:
                    - text: java @KafkaListener(id = "batch-listener", topics = "myTopic", containerFactory = "batchFactory")
                    - generic [ref=e624]: public void listen(List<Order> orders)
                    - text: "{ for (int i = 0; i < orders.size(); i++) { try { process(orders.get(i)); } catch (Exception e) { throw new BatchListenerFailedException(\"Failed to process\", e, i); } } }"
                  - button "Copied!" [ref=e626] [cursor=pointer]
              - generic [ref=e628]:
                - heading "Configuring Dead Letter Topics for Batch Listeners" [level=3] [ref=e629]
                - paragraph [ref=e631]:
                  - text: Configure a
                  - code [ref=e632]: DefaultErrorHandler
                  - text: with a
                  - code [ref=e633]: DeadLetterPublishingRecoverer
                  - text: "on your batch listener container factory:"
                - generic [ref=e636]:
                  - code [ref=e637]:
                    - text: java @Bean
                    - generic [ref=e638]: public ConcurrentKafkaListenerContainerFactory<String, Order> batchFactory( ConsumerFactory<String, Order> consumerFactory, KafkaTemplate<String, Order> kafkaTemplate)
                    - text: "{ ConcurrentKafkaListenerContainerFactory<String, Order> factory = new ConcurrentKafkaListenerContainerFactory<>(); factory.setConsumerFactory(consumerFactory); factory.setBatchListener(true); // Configure Dead Letter Publishing DeadLetterPublishingRecoverer recoverer = new DeadLetterPublishingRecoverer(kafkaTemplate, (record, ex) -> new TopicPartition(record.topic() + \"-dlt\", record.partition())); // Configure retries: 3 attempts with 1 second between each DefaultErrorHandler errorHandler = new DefaultErrorHandler(recoverer, new FixedBackOff(1000L, 2L)); // 2 retries = 3 total attempts factory.setCommonErrorHandler(errorHandler); return factory; }"
                  - button "Copied!" [ref=e640] [cursor=pointer]
              - generic [ref=e642]:
                - heading "How Batch Error Handling Works" [level=3] [ref=e643]
                - paragraph [ref=e645]:
                  - text: When a
                  - code [ref=e646]: BatchListenerFailedException
                  - text: is thrown, the
                  - code [ref=e647]: DefaultErrorHandler
                  - text: ":"
                - list [ref=e649]:
                  - listitem [ref=e650]:
                    - paragraph [ref=e651]:
                      - strong [ref=e652]: Commits offsets
                      - text: for all records before the failed record
                  - listitem [ref=e653]:
                    - paragraph [ref=e654]:
                      - strong [ref=e655]: Retries
                      - text: the failed record (and subsequent records) according to the
                      - code [ref=e656]: BackOff
                      - text: configuration
                  - listitem [ref=e657]:
                    - paragraph [ref=e658]:
                      - strong [ref=e659]: Publishes to DLT
                      - text: when retries are exhausted - only the failed record is sent to the DLT
                  - listitem [ref=e660]:
                    - paragraph [ref=e661]:
                      - strong [ref=e662]: Commits the failed record’s offset
                      - text: and redelivers remaining records for processing
                - paragraph [ref=e664]: "Example flow with a batch of 6 records where record at index 2 fails:"
                - list [ref=e666]:
                  - listitem [ref=e667]:
                    - paragraph [ref=e668]: "First attempt: Records 0, 1 processed successfully; record 2 fails"
                  - listitem [ref=e669]:
                    - paragraph [ref=e670]: Container commits offsets for records 0, 1
                  - listitem [ref=e671]:
                    - paragraph [ref=e672]: "Retry attempt 1: Records 2, 3, 4, 5 are retried"
                  - listitem [ref=e673]:
                    - paragraph [ref=e674]: "Retry attempt 2: Records 2, 3, 4, 5 are retried again"
                  - listitem [ref=e675]:
                    - paragraph [ref=e676]: "After retries exhausted: Record 2 is published to DLT and its offset is committed"
                  - listitem [ref=e677]:
                    - paragraph [ref=e678]: Container continues with records 3, 4, 5
              - generic [ref=e679]:
                - heading "Skipping Retries for Specific Exceptions" [level=3] [ref=e680]
                - paragraph [ref=e682]:
                  - text: By default, the
                  - code [ref=e683]: DefaultErrorHandler
                  - text: retries all exceptions except for fatal ones (like
                  - code [ref=e684]: DeserializationException
                  - text: ","
                  - code [ref=e685]: MessageConversionException
                  - text: ", etc.). To skip retries for your own exception types, configure the error handler with exception classifications."
                - paragraph [ref=e687]:
                  - text: The error handler examines the
                  - strong [ref=e688]: cause
                  - text: of the
                  - code [ref=e689]: BatchListenerFailedException
                  - text: "to determine if it should skip retries:"
                - generic [ref=e692]:
                  - code [ref=e693]:
                    - text: java @Bean
                    - generic [ref=e694]: public ConcurrentKafkaListenerContainerFactory<String, Order> batchFactory( ConsumerFactory<String, Order> consumerFactory, KafkaTemplate<String, Order> kafkaTemplate)
                    - text: "{ ConcurrentKafkaListenerContainerFactory<String, Order> factory = new ConcurrentKafkaListenerContainerFactory<>(); factory.setConsumerFactory(consumerFactory); factory.setBatchListener(true); DeadLetterPublishingRecoverer recoverer = new DeadLetterPublishingRecoverer(kafkaTemplate); DefaultErrorHandler errorHandler = new DefaultErrorHandler(recoverer, new FixedBackOff(1000L, 2L)); // Add custom exception types that should skip retries and go directly to DLT errorHandler.addNotRetryableExceptions(ValidationException"
                    - generic [ref=e695]: .class, InvalidFormatException.class)
                    - text: "; factory.setCommonErrorHandler(errorHandler); return factory; }"
                  - button "Copied!" [ref=e697] [cursor=pointer]
                - paragraph [ref=e700]: "Now in your listener:"
                - generic [ref=e703]:
                  - code [ref=e704]:
                    - text: java @KafkaListener(id = "batch-listener", topics = "orders", containerFactory = "batchFactory")
                    - generic [ref=e705]: public void processOrders(List<ConsumerRecord<String, Order>> records)
                    - text: "{ for (ConsumerRecord<String, Order> record : records) { try { process(record.value()); } catch (DatabaseException e) { // Will be retried 3 times (according to BackOff configuration) throw new BatchListenerFailedException(\"Database error\", e, record); } catch (ValidationException e) { // Skips retries - goes directly to DLT // (because ValidationException is configured as not retryable) throw new BatchListenerFailedException(\"Validation failed\", e, record); } } }"
                  - button "Copied!" [ref=e707] [cursor=pointer]
                - table [ref=e710]:
                  - rowgroup [ref=e711]:
                    - row [ref=e712]:
                      - cell "Important" [ref=e713]
                      - cell [ref=e715]:
                        - text: The error handler checks the
                        - strong [ref=e716]: cause
                        - text: (the second parameter) of the
                        - code [ref=e717]: BatchListenerFailedException
                        - text: . If the cause is classified as not retryable, the record is immediately sent to the DLT without retries.
              - generic [ref=e718]:
                - heading "Offset Commit Behavior" [level=3] [ref=e719]
                - paragraph [ref=e721]: "Understanding offset commits is important for batch error handling:"
                - list [ref=e723]:
                  - listitem [ref=e724]:
                    - paragraph [ref=e725]:
                      - strong [ref=e726]: AckMode.BATCH
                      - text: "(most common for batch listeners):"
                    - list [ref=e728]:
                      - listitem [ref=e729]:
                        - paragraph [ref=e730]: Offsets before the failed record are committed before error handling
                      - listitem [ref=e731]:
                        - paragraph [ref=e732]: The failed record’s offset is committed after successful recovery (DLT publishing)
                  - listitem [ref=e733]:
                    - paragraph [ref=e734]:
                      - strong [ref=e735]: AckMode.MANUAL_IMMEDIATE
                      - text: ":"
                    - list [ref=e737]:
                      - listitem [ref=e738]:
                        - paragraph [ref=e739]:
                          - text: Set
                          - code [ref=e740]: errorHandler.setCommitRecovered(true)
                          - text: to commit recovered record offsets
                      - listitem [ref=e741]:
                        - paragraph [ref=e742]: You control acknowledgment timing in your listener
                - paragraph [ref=e744]: "Example with manual acknowledgment:"
                - generic [ref=e747]:
                  - code [ref=e748]:
                    - text: java @KafkaListener(id = "manual-batch", topics = "myTopic", containerFactory = "manualBatchFactory")
                    - generic [ref=e749]: public void listen(List<ConsumerRecord<String, Order>> records, Acknowledgment ack)
                    - text: "{ for (ConsumerRecord<String, Order> record : records) { try { process(record.value()); } catch (Exception e) { throw new BatchListenerFailedException(\"Processing failed\", e, record); } } ack.acknowledge(); }"
                  - button "Copied!" [ref=e751] [cursor=pointer]
              - generic [ref=e753]:
                - heading "Conversion Errors with Batch Error Handlers" [level=3] [ref=e754]
                - paragraph [ref=e756]:
                  - text: Starting with version 2.8, batch listeners can now properly handle conversion errors, when using a
                  - code [ref=e757]: MessageConverter
                  - text: with a
                  - code [ref=e758]: ByteArrayDeserializer
                  - text: ", a"
                  - code [ref=e759]: BytesDeserializer
                  - text: or a
                  - code [ref=e760]: StringDeserializer
                  - text: ", as well as a"
                  - code [ref=e761]: DefaultErrorHandler
                  - text: . When a conversion error occurs, the payload is set to null and a deserialization exception is added to the record headers, similar to the
                  - code [ref=e762]: ErrorHandlingDeserializer
                  - text: . A list of
                  - code [ref=e763]: ConversionException
                  - text: s is available in the listener so the listener can throw a
                  - code [ref=e764]: BatchListenerFailedException
                  - text: indicating the first index at which a conversion exception occurred.
                - paragraph [ref=e766]: "Example:"
                - generic [ref=e769]:
                  - code [ref=e770]:
                    - text: java @KafkaListener(id = "test", topics = "topic")
                    - generic [ref=e771]: void listen(List<Thing> in, @Header(KafkaHeaders.CONVERSION_FAILURES) List<ConversionException> exceptions)
                    - text: "{ for (int i = 0; i < in.size(); i++) { Foo foo = in.get(i); if (foo == null && exceptions.get(i) != null) { throw new BatchListenerFailedException(\"Conversion error\", exceptions.get(i), i); } process(foo); } }"
                  - button "Copied!" [ref=e773] [cursor=pointer]
              - generic [ref=e775]:
                - heading "Deserialization Errors with Batch Listeners" [level=3] [ref=e776]
                - table [ref=e778]:
                  - rowgroup [ref=e779]:
                    - row [ref=e780]:
                      - cell "Important" [ref=e781]
                      - cell [ref=e783]:
                        - text: Batch listeners require
                        - strong [ref=e784]: manual handling
                        - text: of deserialization errors. Unlike record listeners, there is no automatic error handler that detects and routes deserialization failures to the DLT. You must explicitly check for failed records and throw
                        - code [ref=e785]: BatchListenerFailedException
                        - text: .
                - paragraph [ref=e787]:
                  - text: Use
                  - code [ref=e788]: ErrorHandlingDeserializer
                  - text: "to prevent deserialization failures from stopping the entire batch:"
                - generic [ref=e791]:
                  - code [ref=e792]:
                    - text: java @Bean
                    - generic [ref=e793]: public ConsumerFactory<String, Order> consumerFactory()
                    - text: "{ Map<String, Object> props = new HashMap<>(); props.put(ConsumerConfig.BOOTSTRAP_SERVERS_CONFIG, bootstrapServers); props.put(ConsumerConfig.KEY_DESERIALIZER_CLASS_CONFIG, StringDeserializer"
                    - generic [ref=e794]: .class)
                    - text: ; // Wrap your deserializer with ErrorHandlingDeserializer props.put(ConsumerConfig.VALUE_DESERIALIZER_CLASS_CONFIG, ErrorHandlingDeserializer
                    - generic [ref=e795]: .class)
                    - text: ; props.put(ErrorHandlingDeserializer.VALUE_DESERIALIZER_CLASS, JsonDeserializer
                    - generic [ref=e796]: .class.getName())
                    - text: "; return new DefaultKafkaConsumerFactory<>(props); }"
                  - button "Copied!" [ref=e798] [cursor=pointer]
                - paragraph [ref=e801]:
                  - text: In your listener, you must manually check for
                  - code [ref=e802]: "null"
                  - text: "values which indicate deserialization failures:"
                - generic [ref=e805]:
                  - code [ref=e806]:
                    - text: java @KafkaListener(id = "batch-deser", topics = "orders", containerFactory = "batchFactory")
                    - generic [ref=e807]: public void listen(List<ConsumerRecord<String, Order>> records)
                    - text: "{ for (ConsumerRecord<String, Order> record : records) { if (record.value() == null) { // Deserialization failed - throw exception to send to DLT throw new BatchListenerFailedException(\"Deserialization failed\", record); } process(record.value()); } }"
                  - button "Copied!" [ref=e809] [cursor=pointer]
                - paragraph [ref=e812]:
                  - text: When
                  - code [ref=e813]: DeadLetterPublishingRecoverer
                  - text: "publishes a deserialization failure to the DLT:"
