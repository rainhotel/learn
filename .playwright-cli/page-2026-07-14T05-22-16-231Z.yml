                    - code [ref=e1112]: NoSuchMethodException
                - listitem [ref=e1113]:
                  - paragraph [ref=e1114]:
                    - code [ref=e1115]: ClassCastException
              - paragraph [ref=e1117]: since these exceptions are unlikely to be resolved on a retried delivery.
              - paragraph [ref=e1119]:
                - text: You can add more exception types to the not-retryable category, or completely replace the map of classified exceptions. See the Javadocs for
                - code [ref=e1120]: DefaultAfterRollbackProcessor.setClassifications()
                - text: for more information, as well as
                - code [ref=e1121]: ExceptionMatcher
                - text: .
              - paragraph [ref=e1123]:
                - text: Here is an example that adds
                - code [ref=e1124]: IllegalArgumentException
                - text: "to the not-retryable exceptions:"
              - generic [ref=e1127]:
                - code [ref=e1128]:
                  - text: java @Bean
                  - generic [ref=e1129]: public DefaultAfterRollbackProcessor errorHandler(BiConsumer<ConsumerRecord<?, ?>, Exception> recoverer)
                  - text: "{ DefaultAfterRollbackProcessor processor = new DefaultAfterRollbackProcessor(recoverer); processor.addNotRetryableException(IllegalArgumentException"
                  - generic [ref=e1130]: .class)
                  - text: "; return processor; }"
                - button "Copied!" [ref=e1132] [cursor=pointer]
              - paragraph [ref=e1135]:
                - text: Also see
                - link "Delivery Attempts Header" [ref=e1136] [cursor=pointer]:
                  - /url: "#delivery-header"
                - text: .
              - table [ref=e1138]:
                - rowgroup [ref=e1139]:
                  - row [ref=e1140]:
                    - cell "Important" [ref=e1141]
                    - cell [ref=e1143]:
                      - text: With current
                      - code [ref=e1144]: kafka-clients
                      - text: ", the container cannot detect whether a"
                      - code [ref=e1145]: ProducerFencedException
                      - text: is caused by a rebalance or if the producer’s
                      - code [ref=e1146]: transactional.id
                      - text: has been revoked due to a timeout or expiry. Because, in most cases, it is caused by a rebalance, the container does not call the
                      - code [ref=e1147]: AfterRollbackProcessor
                      - text: (because it’s not appropriate to seek the partitions because we no longer are assigned them). If you ensure the timeout is large enough to process each transaction and periodically perform an "empty" transaction (e.g. via a
                      - code [ref=e1148]: ListenerContainerIdleEvent
                      - text: ) you can avoid fencing due to timeout and expiry. Or, you can set the
                      - code [ref=e1149]: stopContainerWhenFenced
                      - text: container property to
                      - code [ref=e1150]: "true"
                      - text: and the container will stop, avoiding the loss of records. You can consume a
                      - code [ref=e1151]: ConsumerStoppedEvent
                      - text: and check the
                      - code [ref=e1152]: Reason
                      - text: property for
                      - code [ref=e1153]: FENCED
                      - text: to detect this condition. Since the event also has a reference to the container, you can restart the container using this event.
              - paragraph [ref=e1155]:
                - text: Starting with version 2.7, while waiting for a
                - code [ref=e1156]: BackOff
                - text: interval, the error handler will loop with a short sleep until the desired delay is reached, while checking to see if the container has been stopped, allowing the sleep to exit soon after the
                - code [ref=e1157]: stop()
                - text: rather than causing a delay.
              - paragraph [ref=e1159]:
                - text: Starting with version 2.7, the processor can be configured with one or more
                - code [ref=e1160]: RetryListener
                - text: s, receiving notifications of retry and recovery progress.
              - generic [ref=e1163]:
                - code [ref=e1164]:
                  - text: java @FunctionalInterface public
