          - generic [ref=e1016]:
            - heading "After Rollback Processor" [level=2] [ref=e1017]
            - generic [ref=e1018]:
              - paragraph [ref=e1020]:
                - text: When using transactions, if the listener throws an exception (and an error handler, if present, throws an exception), the transaction is rolled back. By default, any unprocessed records (including the failed record) are re-fetched on the next poll. This is achieved by performing
                - code [ref=e1021]: seek
                - text: operations in the
                - code [ref=e1022]: DefaultAfterRollbackProcessor
                - text: . With a batch listener, the entire batch of records is reprocessed (the container has no knowledge of which record in the batch failed). To modify this behavior, you can configure the listener container with a custom
                - code [ref=e1023]: AfterRollbackProcessor
                - text: . For example, with a record-based listener, you might want to keep track of the failed record and give up after some number of attempts, perhaps by publishing it to a dead-letter topic.
              - paragraph [ref=e1025]:
                - text: Starting with version 2.2, the
                - code [ref=e1026]: DefaultAfterRollbackProcessor
                - text: can now recover (skip) a record that keeps failing. By default, after ten failures, the failed record is logged (at the
                - code [ref=e1027]: ERROR
                - text: level). You can configure the processor with a custom recoverer (
                - code [ref=e1028]: BiConsumer
                - text: ) and maximum failures. Setting the
                - code [ref=e1029]: maxFailures
                - text: "property to a negative number causes infinite retries. The following example configures recovery after three tries:"
              - generic [ref=e1032]:
                - code [ref=e1033]: "java AfterRollbackProcessor<String, String> processor = new DefaultAfterRollbackProcessor((record, exception) -> { // recover after 3 failures, with no back off - e.g. send to a dead-letter topic }, new FixedBackOff(0L, 2L));"
                - button "Copied!" [ref=e1035] [cursor=pointer]
              - paragraph [ref=e1038]:
                - text: When you do not use transactions, you can achieve similar functionality by configuring a
                - code [ref=e1039]: DefaultErrorHandler
                - text: . See
                - link "Container Error Handlers" [ref=e1040] [cursor=pointer]:
                  - /url: "#error-handlers"
                - text: .
              - paragraph [ref=e1042]:
                - text: Starting with version 3.2, Recovery can now recover (skip) entire batch of records that keeps failing. Set
                - code [ref=e1043]: ContainerProperties.setBatchRecoverAfterRollback(true)
                - text: to enable this feature.
              - table [ref=e1045]:
                - rowgroup [ref=e1046]:
                  - row [ref=e1047]:
                    - cell "Important" [ref=e1048]
                    - cell "Default behavior, recovery is not possible with a batch listener, since the framework has no knowledge about which record in the batch keeps failing. In such cases, the application listener must handle a record that keeps failing." [ref=e1050]
              - paragraph [ref=e1052]:
                - text: See also
                - link "Publishing Dead-letter Records" [ref=e1053] [cursor=pointer]:
                  - /url: "#dead-letters"
                - text: .
              - paragraph [ref=e1055]:
                - text: Starting with version 2.2.5, the
                - code [ref=e1056]: DefaultAfterRollbackProcessor
                - text: can be invoked in a new transaction (started after the failed transaction rolls back). Then, if you are using the
                - code [ref=e1057]: DeadLetterPublishingRecoverer
                - text: to publish a failed record, the processor will send the recovered record’s offset in the original topic/partition to the transaction. To enable this feature, set the
                - code [ref=e1058]: commitRecovered
                - text: and
                - code [ref=e1059]: kafkaTemplate
                - text: properties on the
                - code [ref=e1060]: DefaultAfterRollbackProcessor
                - text: .
              - table [ref=e1062]:
                - rowgroup [ref=e1063]:
                  - row [ref=e1064]:
                    - cell "Important" [ref=e1065]
                    - cell [ref=e1067]:
                      - text: If the recoverer fails (throws an exception), the failed record will be included in the seeks. Starting with version 2.5.5, if the recoverer fails, the
                      - code [ref=e1068]: BackOff
                      - text: will be reset by default and redeliveries will again go through the back offs before recovery is attempted again. With earlier versions, the
                      - code [ref=e1069]: BackOff
                      - text: was not reset and recovery was re-attempted on the next failure. To revert to the previous behavior, set the processor’s
                      - code [ref=e1070]: resetStateOnRecoveryFailure
                      - text: property to
                      - code [ref=e1071]: "false"
                      - text: .
              - paragraph [ref=e1073]:
                - text: Starting with version 2.6, you can now provide the processor with a
                - code [ref=e1074]: BiFunction<ConsumerRecord<?, ?>, Exception, BackOff>
                - text: to determine the
                - code [ref=e1075]: BackOff
                - text: "to use, based on the failed record and/or the exception:"
              - generic [ref=e1078]:
                - code [ref=e1079]: "java handler.setBackOffFunction((record, ex) -> { ... });"
                - button "Copied!" [ref=e1081] [cursor=pointer]
              - paragraph [ref=e1084]:
                - text: If the function returns
                - code [ref=e1085]: "null"
                - text: ", the processor’s default"
                - code [ref=e1086]: BackOff
                - text: will be used.
              - paragraph [ref=e1088]:
                - text: Starting with version 2.6.3, set
                - code [ref=e1089]: resetStateOnExceptionChange
                - text: to
                - code [ref=e1090]: "true"
                - text: and the retry sequence will be restarted (including the selection of a new
                - code [ref=e1091]: BackOff
                - text: ", if so configured) if the exception type changes between failures. By default, the exception type is not considered."
              - paragraph [ref=e1093]:
                - text: Starting with version 2.3.1, similar to the
                - code [ref=e1094]: DefaultErrorHandler
                - text: ", the"
                - code [ref=e1095]: DefaultAfterRollbackProcessor
                - text: "considers certain exceptions to be fatal, and retries are skipped for such exceptions; the recoverer is invoked on the first failure. The exceptions that are considered fatal, by default, are:"
              - list [ref=e1097]:
                - listitem [ref=e1098]:
                  - paragraph [ref=e1099]:
