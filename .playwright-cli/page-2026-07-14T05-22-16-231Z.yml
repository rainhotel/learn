                - text: header into the
                - code [ref=e1240]: ConsumerRecord
                - text: .
          - generic [ref=e1241]:
            - heading "Listener Info Header" [level=2] [ref=e1242]
            - generic [ref=e1243]:
              - paragraph [ref=e1245]: In some cases, it is useful to be able to know which container a listener is running in.
              - paragraph [ref=e1247]:
                - text: Starting with version 2.8.4, you can now set the
                - code [ref=e1248]: listenerInfo
                - text: property on the listener container, or set the
                - code [ref=e1249]: info
                - text: attribute on the
                - code [ref=e1250]: "@KafkaListener"
                - text: annotation. Then, the container will add this in the
                - code [ref=e1251]: KafkaListener.LISTENER_INFO
                - text: header to all incoming messages; it can then be used in record interceptors, filters, etc., or in the listener itself.
              - generic [ref=e1254]:
                - code [ref=e1255]:
                  - text: java @KafkaListener(id = "something", topics = "topic", filter = "someFilter", info = "this is the something listener")
                  - generic [ref=e1256]: public void listen(@Payload Thing thing, @Header(KafkaHeaders.LISTENER_INFO) String listenerInfo)
                  - text: "{ ... }"
                - button "Copied!" [ref=e1258] [cursor=pointer]
              - paragraph [ref=e1261]:
                - text: When used in a
                - code [ref=e1262]: RecordInterceptor
                - text: or
                - code [ref=e1263]: RecordFilterStrategy
                - text: implementation, the header is in the consumer record as a byte array, converted using the
                - code [ref=e1264]: KafkaListenerAnnotationBeanPostProcessor
                - text: "'s"
                - code [ref=e1265]: charSet
                - text: property.
              - paragraph [ref=e1267]:
                - text: The header mappers also convert to
                - code [ref=e1268]: String
                - text: when creating
                - code [ref=e1269]: MessageHeaders
                - text: from the consumer record and never map this header on an outbound record.
              - paragraph [ref=e1271]:
                - text: For POJO batch listeners, starting with version 2.8.6, the header is copied into each member of the batch and is also available as a single
                - code [ref=e1272]: String
                - text: parameter after conversion.
              - generic [ref=e1275]:
                - code [ref=e1276]:
                  - text: java @KafkaListener(id = "list2", topics = "someTopic", containerFactory = "batchFactory", info = "info for batch")
                  - generic [ref=e1277]: public void listen(List<Thing> list, @Header(KafkaHeaders.RECEIVED_KEY) List<Integer> keys, @Header(KafkaHeaders.RECEIVED_PARTITION) List<Integer> partitions, @Header(KafkaHeaders.RECEIVED_TOPIC) List<String> topics, @Header(KafkaHeaders.OFFSET) List<Long> offsets, @Header(KafkaHeaders.LISTENER_INFO) String info)
                  - text: "{ ... }"
                - button "Copied!" [ref=e1279] [cursor=pointer]
              - table [ref=e1282]:
                - rowgroup [ref=e1283]:
                  - row [ref=e1284]:
                    - cell "Note" [ref=e1285]
                    - cell [ref=e1287]:
                      - text: If the batch listener has a filter and the filter results in an empty batch, you will need to add
                      - code [ref=e1288]: required = false
