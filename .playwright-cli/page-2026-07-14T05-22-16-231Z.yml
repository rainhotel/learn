              - paragraph [ref=e833]:
                - text: There is no guarantee that, when a batch is redelivered, the batch has the same number of records and/or the redelivered records are in the same order. It is impossible, therefore, to easily maintain retry state for a batch. The
                - code [ref=e834]: FallbackBatchErrorHandler
                - text: takes the following approach. If a batch listener throws an exception that is not a
                - code [ref=e835]: BatchListenerFailedException
                - text: ", the retries are performed from the in-memory batch of records. In order to avoid a rebalance during an extended retry sequence, the error handler pauses the consumer, polls it before sleeping for the back off, for each retry, and calls the listener again. If/when retries are exhausted, the"
                - code [ref=e836]: ConsumerRecordRecoverer
                - text: is called for each record in the batch. If the recoverer throws an exception, or the thread is interrupted during its sleep, the batch of records will be redelivered on the next poll. Before exiting, regardless of the outcome, the consumer is resumed.
              - table [ref=e838]:
