            - link "signals" [ref=e154] [cursor=pointer]:
              - /url: /docs/specs/otel/glossary/#signals
            - text: . Signals are system outputs that describe the underlying activity of the operating system and applications running on a platform. A signal can be something you want to measure at a specific point in time, like temperature or memory usage, or an event that goes through the components of your distributed system that you’d like to trace. You can group different signals together to observe the inner workings of the same piece of technology under different angles.
