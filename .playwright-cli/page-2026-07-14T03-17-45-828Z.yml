      - generic [ref=e131]:
        - heading "High availability with Redis Sentinel" [level=1] [ref=e132]
        - paragraph [ref=e133]: High availability for non-clustered Redis
        - table [ref=e135]:
          - rowgroup [ref=e136]:
            - row "Redis Open Source" [ref=e137]
          - rowgroup
        - paragraph [ref=e139]:
          - text: Redis Sentinel provides high availability for Redis when not using
          - link "Redis Cluster" [ref=e140] [cursor=pointer]:
            - /url: /docs/latest/operate/oss_and_stack/management/scaling/
          - text: .
        - paragraph [ref=e141]: Redis Sentinel also provides other collateral tasks such as monitoring, notifications and acts as a configuration provider for clients.
        - paragraph [ref=e142]:
          - text: This is the full list of Sentinel capabilities at a macroscopic level (i.e. the
          - emphasis [ref=e143]: big picture
          - text: "):"
        - list [ref=e144]:
          - listitem [ref=e145]:
            - strong [ref=e146]: Monitoring
            - text: . Sentinel constantly checks if your master and replica instances are working as expected.
          - listitem [ref=e147]:
            - strong [ref=e148]: Notification
            - text: . Sentinel can notify the system administrator, or other computer programs, via an API, that something is wrong with one of the monitored Redis instances.
          - listitem [ref=e149]:
            - strong [ref=e150]: Automatic failover
            - text: . If a master is not working as expected, Sentinel can start a failover process where a replica is promoted to master, the other additional replicas are reconfigured to use the new master, and the applications using the Redis server are informed about the new address to use when connecting.
          - listitem [ref=e151]:
            - strong [ref=e152]: Configuration provider
            - text: ". Sentinel acts as a source of authority for clients service discovery: clients connect to Sentinels in order to ask for the address of the current Redis master responsible for a given service. If a failover occurs, Sentinels will report the new address."
        - heading [level=2] [ref=e153]:
          - text: Sentinel as a distributed system
          - link "Link to this section" [ref=e154] [cursor=pointer]:
            - /url: "#sentinel-as-a-distributed-system"
        - paragraph [ref=e157]: "Redis Sentinel is a distributed system:"
        - paragraph [ref=e158]: "Sentinel itself is designed to run in a configuration where there are multiple Sentinel processes cooperating together. The advantage of having multiple Sentinel processes cooperating are the following:"
        - list [ref=e159]:
          - listitem [ref=e160]: Failure detection is performed when multiple Sentinels agree about the fact a given master is no longer available. This lowers the probability of false positives.
          - listitem [ref=e161]: Sentinel works even if not all the Sentinel processes are working, making the system robust against failures. There is no fun in having a failover system which is itself a single point of failure, after all.
        - paragraph [ref=e162]: The sum of Sentinels, Redis instances (masters and replicas) and clients connecting to Sentinel and Redis, are also a larger distributed system with specific properties. In this document concepts will be introduced gradually starting from basic information needed in order to understand the basic properties of Sentinel, to more complex information (that are optional) in order to understand how exactly Sentinel works.
        - heading [level=2] [ref=e163]:
          - text: Sentinel quick start
          - link "Link to this section" [ref=e164] [cursor=pointer]:
            - /url: "#sentinel-quick-start"
        - heading [level=3] [ref=e167]:
          - text: Obtaining Sentinel
          - link "Link to this section" [ref=e168] [cursor=pointer]:
            - /url: "#obtaining-sentinel"
        - paragraph [ref=e171]:
          - text: The current version of Sentinel is called
          - strong [ref=e172]: Sentinel 2
          - text: . It is a rewrite of the initial Sentinel implementation using stronger and simpler-to-predict algorithms (that are explained in this documentation).
        - paragraph [ref=e173]: A stable release of Redis Sentinel is shipped since Redis 2.8.
        - paragraph [ref=e174]:
          - text: New developments are performed in the
          - emphasis [ref=e175]: unstable
          - text: branch, and new features sometimes are back ported into the latest stable branch as soon as they are considered to be stable.
        - paragraph [ref=e176]: Redis Sentinel version 1, shipped with Redis 2.6, is deprecated and should not be used.
        - heading [level=3] [ref=e177]:
          - text: Running Sentinel
          - link "Link to this section" [ref=e178] [cursor=pointer]:
            - /url: "#running-sentinel"
        - paragraph [ref=e181]:
          - text: If you are using the
          - code [ref=e182]: redis-sentinel
          - text: executable (or if you have a symbolic link with that name to the
          - code [ref=e183]: redis-server
          - text: "executable) you can run Sentinel with the following command line:"
        - code [ref=e185]: redis-sentinel /path/to/sentinel.conf
        - paragraph [ref=e186]:
          - text: Otherwise you can use directly the
          - code [ref=e187]: redis-server
          - text: "executable starting it in Sentinel mode:"
        - code [ref=e189]: redis-server /path/to/sentinel.conf --sentinel
        - paragraph [ref=e190]: Both ways work the same.
        - paragraph [ref=e191]:
          - text: However
          - strong [ref=e192]: it is mandatory
          - text: to use a configuration file when running Sentinel, as this file will be used by the system in order to save the current state that will be reloaded in case of restarts. Sentinel will simply refuse to start if no configuration file is given or if the configuration file path is not writable.
        - paragraph [ref=e193]:
          - text: Sentinels by default run
          - strong [ref=e194]: listening for connections to TCP port 26379
          - text: ", so for Sentinels to work, port 26379 of your servers"
          - strong [ref=e195]: must be open
          - text: to receive connections from the IP addresses of the other Sentinel instances. Otherwise Sentinels can't talk and can't agree about what to do, so failover will never be performed.
        - heading [level=3] [ref=e196]:
          - text: Fundamental things to know about Sentinel before deploying
          - link "Link to this section" [ref=e197] [cursor=pointer]:
            - /url: "#fundamental-things-to-know-about-sentinel-before-deploying"
        - list [ref=e200]:
          - listitem [ref=e201]: You need at least three Sentinel instances for a robust deployment.
          - listitem [ref=e202]: The three Sentinel instances should be placed into computers or virtual machines that are believed to fail in an independent way. So for example different physical servers or Virtual Machines executed on different availability zones.
          - listitem [ref=e203]: Sentinel + Redis distributed system does not guarantee that acknowledged writes are retained during failures, since Redis uses asynchronous replication. However there are ways to deploy Sentinel that make the window to lose writes limited to certain moments, while there are other less secure ways to deploy it.
          - listitem [ref=e204]: You need Sentinel support in your clients. Popular client libraries have Sentinel support, but not all.
          - listitem [ref=e205]: There is no HA setup which is safe if you don't test from time to time in development environments, or even better if you can, in production environments, if they work. You may have a misconfiguration that will become apparent only when it's too late (at 3am when your master stops working).
          - listitem [ref=e206]:
            - strong [ref=e207]: Sentinel, Docker, or other forms of Network Address Translation or Port Mapping should be mixed with care
            - text: ": Docker performs port remapping, breaking Sentinel auto discovery of other Sentinel processes and the list of replicas for a master. Check the"
            - link [ref=e208] [cursor=pointer]:
              - /url: "#sentinel-docker-nat-and-possible-issues"
              - text: section about
              - emphasis [ref=e209]: Sentinel and Docker
            - text: later in this document for more information.
        - heading [level=3] [ref=e210]:
          - text: Configuring Sentinel
          - link "Link to this section" [ref=e211] [cursor=pointer]:
            - /url: "#configuring-sentinel"
        - paragraph [ref=e214]:
          - text: The Redis source distribution contains a file called
          - code [ref=e215]: sentinel.conf
          - text: "that is a self-documented example configuration file you can use to configure Sentinel, however a typical minimal configuration file looks like the following:"
        - code [ref=e217]: sentinel monitor mymaster 127.0.0.1 6379 2 sentinel down-after-milliseconds mymaster 60000 sentinel failover-timeout mymaster 180000 sentinel parallel-syncs mymaster 1 sentinel monitor resque 192.168.1.3 6380 4 sentinel down-after-milliseconds resque 10000 sentinel failover-timeout resque 180000 sentinel parallel-syncs resque 5
        - paragraph [ref=e218]: You only need to specify the masters to monitor, giving to each separated master (that may have any number of replicas) a different name. There is no need to specify replicas, which are auto-discovered. Sentinel will update the configuration automatically with additional information about replicas (in order to retain the information in case of restart). The configuration is also rewritten every time a replica is promoted to master during a failover and every time a new Sentinel is discovered.
        - paragraph [ref=e219]:
          - text: The example configuration above basically monitors two sets of Redis instances, each composed of a master and an undefined number of replicas. One set of instances is called
          - code [ref=e220]: mymaster
          - text: ", and the other"
          - code [ref=e221]: resque
          - text: .
        - paragraph [ref=e222]:
          - text: The meaning of the arguments of
          - code [ref=e223]: sentinel monitor
          - text: "statements is the following:"
        - code [ref=e225]: sentinel monitor <master-name> <ip> <port> <quorum>
        - paragraph [ref=e226]: "For the sake of clarity, let's check line by line what the configuration options mean:"
        - paragraph [ref=e227]:
          - text: The first line is used to tell Redis to monitor a master called
          - emphasis [ref=e228]: mymaster
          - text: ", that is at address 127.0.0.1 and port 6379, with a quorum of 2. Everything is pretty obvious but the"
          - strong [ref=e229]: quorum
          - text: "argument:"
        - list [ref=e230]:
          - listitem [ref=e231]:
            - text: The
            - strong [ref=e232]: quorum
            - text: is the number of Sentinels that need to agree about the fact the master is not reachable, in order to really mark the master as failing, and eventually start a failover procedure if possible.
          - listitem [ref=e233]:
            - text: However
            - strong [ref=e234]: the quorum is only used to detect the failure
            - text: . In order to actually perform a failover, one of the Sentinels need to be elected leader for the failover and be authorized to proceed. This only happens with the vote of the
            - strong [ref=e235]: majority of the Sentinel processes
            - text: .
        - paragraph [ref=e236]: "So for example if you have 5 Sentinel processes, and the quorum for a given master set to the value of 2, this is what happens:"
        - list [ref=e237]:
          - listitem [ref=e238]: If two Sentinels agree at the same time about the master being unreachable, one of the two will try to start a failover.
          - listitem [ref=e239]: If there are at least a total of three Sentinels reachable, the failover will be authorized and will actually start.
        - paragraph [ref=e240]:
          - text: In practical terms this means during failures
          - strong [ref=e241]: Sentinel never starts a failover if the majority of Sentinel processes are unable to talk
          - text: (aka no failover in the minority partition).
        - heading [level=3] [ref=e242]:
          - text: Other Sentinel options
          - link "Link to this section" [ref=e243] [cursor=pointer]:
            - /url: "#other-sentinel-options"
        - paragraph [ref=e246]: "The other options are almost always in the form:"
        - code [ref=e248]: sentinel <option_name> <master_name> <option_value>
        - paragraph [ref=e249]: "And are used for the following purposes:"
        - list [ref=e250]:
          - listitem [ref=e251]:
            - code [ref=e252]: down-after-milliseconds
            - text: is the time in milliseconds an instance should not be reachable (either does not reply to our PINGs or it is replying with an error) for a Sentinel starting to think it is down.
          - listitem [ref=e253]:
            - code [ref=e254]: parallel-syncs
            - text: sets the number of replicas that can be reconfigured to use the new master after a failover at the same time. The lower the number, the more time it will take for the failover process to complete, however if the replicas are configured to serve old data, you may not want all the replicas to re-synchronize with the master at the same time. While the replication process is mostly non blocking for a replica, there is a moment when it stops to load the bulk data from the master. You may want to make sure only one replica at a time is not reachable by setting this option to the value of 1.
        - paragraph [ref=e255]:
          - text: Additional options are described in the rest of this document and documented in the example
          - code [ref=e256]: sentinel.conf
          - text: file shipped with the Redis distribution.
        - paragraph [ref=e257]: "Configuration parameters can be modified at runtime:"
        - list [ref=e258]:
          - listitem [ref=e259]:
            - text: Master-specific configuration parameters are modified using
            - code [ref=e260]: SENTINEL SET
            - text: .
          - listitem [ref=e261]:
            - text: Global configuration parameters are modified using
            - code [ref=e262]: SENTINEL CONFIG SET
            - text: .
        - paragraph [ref=e263]:
          - text: See the
          - link [ref=e264] [cursor=pointer]:
            - /url: "#reconfiguring-sentinel-at-runtime"
            - emphasis [ref=e265]: Reconfiguring Sentinel at runtime
            - text: section
          - text: for more information.
        - heading [level=3] [ref=e266]:
          - text: Example Sentinel deployments
          - link "Link to this section" [ref=e267] [cursor=pointer]:
            - /url: "#example-sentinel-deployments"
        - paragraph [ref=e270]: Now that you know the basic information about Sentinel, you may wonder where you should place your Sentinel processes, how many Sentinel processes you need and so forth. This section shows a few example deployments.
        - paragraph [ref=e271]:
          - text: We use ASCII art in order to show you configuration examples in a
          - emphasis [ref=e272]: graphical
          - text: "format, this is what the different symbols means:"
        - code [ref=e274]: +--------------------+ | This is a computer | | or VM that fails | | independently. We | | call it a "box" | +--------------------+
        - paragraph [ref=e275]: "We write inside the boxes what they are running:"
        - code [ref=e277]: +-------------------+ | Redis master M1 | | Redis Sentinel S1 | +-------------------+
        - paragraph [ref=e278]: "Different boxes are connected by lines, to show that they are able to talk:"
        - code [ref=e280]: +-------------+ +-------------+ | Sentinel S1 |---------------| Sentinel S2 | +-------------+ +-------------+
        - paragraph [ref=e281]: "Network partitions are shown as interrupted lines using slashes:"
        - code [ref=e283]: +-------------+ +-------------+ | Sentinel S1 |------ // ------| Sentinel S2 | +-------------+ +-------------+
        - paragraph [ref=e284]: "Also note that:"
        - list [ref=e285]:
          - listitem [ref=e286]: Masters are called M1, M2, M3, ..., Mn.
          - listitem [ref=e287]:
            - text: Replicas are called R1, R2, R3, ..., Rn (R stands for
            - emphasis [ref=e288]: replica
            - text: ).
          - listitem [ref=e289]: Sentinels are called S1, S2, S3, ..., Sn.
          - listitem [ref=e290]: Clients are called C1, C2, C3, ..., Cn.
          - listitem [ref=e291]: When an instance changes role because of Sentinel actions, we put it inside square brackets, so [M1] means an instance that is now a master because of Sentinel intervention.
        - paragraph [ref=e292]:
          - text: Note that we will never show
          - strong [ref=e293]: setups where just two Sentinels are used
          - text: ", since Sentinels always need"
          - strong [ref=e294]: to talk with the majority
          - text: in order to start a failover.
        - heading [level=4] [ref=e295]:
          - text: "Example 1: just two Sentinels, DON'T DO THIS"
          - link "Link to this section" [ref=e296] [cursor=pointer]:
            - /url: "#example-1-just-two-sentinels-dont-do-this"
        - code [ref=e300]: "+----+ +----+ | M1 |---------| R1 | | S1 | | S2 | +----+ +----+ Configuration: quorum = 1"
        - list [ref=e301]:
          - listitem [ref=e302]: In this setup, if the master M1 fails, R1 will be promoted since the two Sentinels can reach agreement about the failure (obviously with quorum set to 1) and can also authorize a failover because the majority is two. So apparently it could superficially work, however check the next points to see why this setup is broken.
          - listitem [ref=e303]: If the box where M1 is running stops working, also S1 stops working. The Sentinel running in the other box S2 will not be able to authorize a failover, so the system will become not available.
        - paragraph [ref=e304]: "Note that a majority is needed in order to order different failovers, and later propagate the latest configuration to all the Sentinels. Also note that the ability to failover in a single side of the above setup, without any agreement, would be very dangerous:"
        - code [ref=e306]: +----+ +------+ | M1 |----//-----| [M1] | | S1 | | S2 | +----+ +------+
        - paragraph [ref=e307]:
          - text: In the above configuration we created two masters (assuming S2 could failover without authorization) in a perfectly symmetrical way. Clients may write indefinitely to both sides, and there is no way to understand when the partition heals what configuration is the right one, in order to prevent a
          - emphasis [ref=e308]: permanent split brain condition
          - text: .
        - paragraph [ref=e309]:
          - text: So please
          - strong [ref=e310]: deploy at least three Sentinels in three different boxes
          - text: always.
        - heading [level=4] [ref=e311]:
          - text: "Example 2: basic setup with three boxes"
          - link "Link to this section" [ref=e312] [cursor=pointer]:
            - /url: "#example-2-basic-setup-with-three-boxes"
        - paragraph [ref=e315]: This is a very simple setup, that has the advantage to be simple to tune for additional safety. It is based on three boxes, each box running both a Redis process and a Sentinel process.
        - code [ref=e317]: "+----+ | M1 | | S1 | +----+ | +----+ | +----+ | R2 |----+----| R3 | | S2 | | S3 | +----+ +----+ Configuration: quorum = 2"
        - paragraph [ref=e318]: If the master M1 fails, S2 and S3 will agree about the failure and will be able to authorize a failover, making clients able to continue.
        - paragraph [ref=e319]: "In every Sentinel setup, as Redis uses asynchronous replication, there is always the risk of losing some writes because a given acknowledged write may not be able to reach the replica which is promoted to master. However in the above setup there is a higher risk due to clients being partitioned away with an old master, like in the following picture:"
        - code [ref=e321]: +----+ | M1 | | S1 | <- C1 (writes will be lost) +----+ | / / +------+ | +----+ | [M2] |----+----| R3 | | S2 | | S3 | +------+ +----+
        - paragraph [ref=e322]: In this case a network partition isolated the old master M1, so the replica R2 is promoted to master. However clients, like C1, that are in the same partition as the old master, may continue to write data to the old master. This data will be lost forever since when the partition will heal, the master will be reconfigured as a replica of the new master, discarding its data set.
        - paragraph [ref=e323]: This problem can be mitigated using the following Redis replication feature, that allows to stop accepting writes if a master detects that it is no longer able to transfer its writes to the specified number of replicas.
        - code [ref=e325]: min-replicas-to-write 1 min-replicas-max-lag 10
        - paragraph [ref=e326]:
          - text: With the above configuration (please see the self-commented
          - code [ref=e327]: redis.conf
          - text: example in the Redis distribution for more information) a Redis instance, when acting as a master, will stop accepting writes if it can't write to at least 1 replica. Since replication is asynchronous
          - emphasis [ref=e328]: not being able to write
          - text: actually means that the replica is either disconnected, or is not sending us asynchronous acknowledges for more than the specified
          - code [ref=e329]: max-lag
          - text: number of seconds.
        - paragraph [ref=e330]: Using this configuration, the old Redis master M1 in the above example, will become unavailable after 10 seconds. When the partition heals, the Sentinel configuration will converge to the new one, the client C1 will be able to fetch a valid configuration and will continue with the new master.
        - paragraph [ref=e331]: However there is no free lunch. With this refinement, if the two replicas are down, the master will stop accepting writes. It's a trade off.
        - heading [level=4] [ref=e332]:
          - text: "Example 3: Sentinel in the client boxes"
          - link "Link to this section" [ref=e333] [cursor=pointer]:
            - /url: "#example-3-sentinel-in-the-client-boxes"
        - paragraph [ref=e336]: "Sometimes we have only two Redis boxes available, one for the master and one for the replica. The configuration in the example 2 is not viable in that case, so we can resort to the following, where Sentinels are placed where clients are:"
        - code [ref=e338]: "+----+ +----+ | M1 |----+----| R1 | | | | | | +----+ | +----+ | +------------+------------+ | | | | | | +----+ +----+ +----+ | C1 | | C2 | | C3 | | S1 | | S2 | | S3 | +----+ +----+ +----+ Configuration: quorum = 2"
        - paragraph [ref=e339]: "In this setup, the point of view Sentinels is the same as the clients: if a master is reachable by the majority of the clients, it is fine. C1, C2, C3 here are generic clients, it does not mean that C1 identifies a single client connected to Redis. It is more likely something like an application server, a Rails app, or something like that."
        - paragraph [ref=e340]: If the box where M1 and S1 are running fails, the failover will happen without issues, however it is easy to see that different network partitions will result in different behaviors. For example Sentinel will not be able to setup if the network between the clients and the Redis servers is disconnected, since the Redis master and replica will both be unavailable.
        - paragraph [ref=e341]: Note that if C3 gets partitioned with M1 (hardly possible with the network described above, but more likely possible with different layouts, or because of failures at the software layer), we have a similar issue as described in Example 2, with the difference that here we have no way to break the symmetry, since there is just a replica and master, so the master can't stop accepting queries when it is disconnected from its replica, otherwise the master would never be available during replica failures.
        - paragraph [ref=e342]: So this is a valid setup but the setup in the Example 2 has advantages such as the HA system of Redis running in the same boxes as Redis itself which may be simpler to manage, and the ability to put a bound on the amount of time a master in the minority partition can receive writes.
        - heading [level=4] [ref=e343]:
          - text: "Example 4: Sentinel client side with less than three clients"
          - link "Link to this section" [ref=e344] [cursor=pointer]:
            - /url: "#example-4-sentinel-client-side-with-less-than-three-clients"
        - paragraph [ref=e347]: "The setup described in the Example 3 cannot be used if there are less than three boxes in the client side (for example three web servers). In this case we need to resort to a mixed setup like the following:"
        - code [ref=e349]: "+----+ +----+ | M1 |----+----| R1 | | S1 | | | S2 | +----+ | +----+ | +------+-----+ | | | | +----+ +----+ | C1 | | C2 | | S3 | | S4 | +----+ +----+ Configuration: quorum = 3"
        - paragraph [ref=e350]: This is similar to the setup in Example 3, but here we run four Sentinels in the four boxes we have available. If the master M1 becomes unavailable the other three Sentinels will perform the failover.
        - paragraph [ref=e351]: In theory this setup works removing the box where C2 and S4 are running, and setting the quorum to 2. However it is unlikely that we want HA in the Redis side without having high availability in our application layer.
        - heading [level=3] [ref=e352]:
          - text: Sentinel, Docker, NAT, and possible issues
          - link "Link to this section" [ref=e353] [cursor=pointer]:
            - /url: "#sentinel-docker-nat-and-possible-issues"
        - paragraph [ref=e356]: "Docker uses a technique called port mapping: programs running inside Docker containers may be exposed with a different port compared to the one the program believes to be using. This is useful in order to run multiple containers using the same ports, at the same time, in the same server."
        - paragraph [ref=e357]: Docker is not the only software system where this happens, there are other Network Address Translation setups where ports may be remapped, and sometimes not ports but also IP addresses.
        - paragraph [ref=e358]: "Remapping ports and addresses creates issues with Sentinel in two ways:"
        - list [ref=e359]:
          - listitem [ref=e360]:
            - text: Sentinel auto-discovery of other Sentinels no longer works, since it is based on
            - emphasis [ref=e361]: hello
            - text: messages where each Sentinel announce at which port and IP address they are listening for connection. However Sentinels have no way to understand that an address or port is remapped, so it is announcing an information that is not correct for other Sentinels to connect.
          - listitem [ref=e362]:
            - text: Replicas are listed in the
            - link [ref=e363] [cursor=pointer]:
              - /url: /commands/info
              - code [ref=e364]: INFO
            - text: "output of a Redis master in a similar way: the address is detected by the master checking the remote peer of the TCP connection, while the port is advertised by the replica itself during the handshake, however the port may be wrong for the same reason as exposed in point 1."
        - paragraph [ref=e365]:
          - text: Since Sentinels auto detect replicas using masters
          - link [ref=e366] [cursor=pointer]:
            - /url: /commands/info
            - code [ref=e367]: INFO
          - text: output information, the detected replicas will not be reachable, and Sentinel will never be able to failover the master, since there are no good replicas from the point of view of the system, so there is currently no way to monitor with Sentinel a set of master and replica instances deployed with Docker,
          - strong [ref=e368]: unless you instruct Docker to map the port 1:1
          - text: .
        - paragraph [ref=e369]: "For the first problem, in case you want to run a set of Sentinel instances using Docker with forwarded ports (or any other NAT setup where ports are remapped), you can use the following two Sentinel configuration directives in order to force Sentinel to announce a specific set of IP and port:"
        - code [ref=e371]: sentinel announce-ip <ip> sentinel announce-port <port>
        - paragraph [ref=e372]:
          - text: Note that Docker has the ability to run in
          - emphasis [ref=e373]: host networking mode
          - text: (check the
          - code [ref=e374]: "--net=host"
          - text: option for more information). This should create no issues since ports are not remapped in this setup.
        - heading [level=3] [ref=e375]:
          - text: IP Addresses and DNS names
          - link "Link to this section" [ref=e376] [cursor=pointer]:
            - /url: "#ip-addresses-and-dns-names"
        - paragraph [ref=e379]:
          - text: Older versions of Sentinel did not support host names and required IP addresses to be specified everywhere. Starting with version 6.2, Sentinel has
          - emphasis [ref=e380]: optional
          - text: support for host names.
        - paragraph [ref=e381]:
          - strong [ref=e382]: "This capability is disabled by default. If you're going to enable DNS/hostnames support, please note:"
        - list [ref=e383]:
          - listitem [ref=e384]: The name resolution configuration on your Redis and Sentinel nodes must be reliable and be able to resolve addresses quickly. Unexpected delays in address resolution may have a negative impact on Sentinel.
          - listitem [ref=e385]:
            - text: You should use hostnames everywhere and avoid mixing hostnames and IP addresses. To do that, use
            - code [ref=e386]: replica-announce-ip <hostname>
            - text: and
            - code [ref=e387]: sentinel announce-ip <hostname>
            - text: for all Redis and Sentinel instances, respectively.
        - paragraph [ref=e388]:
          - text: Enabling the
          - code [ref=e389]: resolve-hostnames
          - text: "global configuration allows Sentinel to accept host names:"
        - list [ref=e390]:
          - listitem [ref=e391]:
            - text: As part of a
            - code [ref=e392]: sentinel monitor
            - text: command
          - listitem [ref=e393]:
            - text: As a replica address, if the replica uses a host name value for
            - code [ref=e394]: replica-announce-ip
        - paragraph [ref=e395]: Sentinel will accept host names as valid inputs and resolve them, but will still refer to IP addresses when announcing an instance, updating configuration files, etc.
        - paragraph [ref=e396]:
          - text: Enabling the
          - code [ref=e397]: announce-hostnames
          - text: global configuration makes Sentinel use host names instead. This affects replies to clients, values written in configuration files, the
          - link [ref=e398] [cursor=pointer]:
            - /url: /commands/replicaof
            - code [ref=e399]: REPLICAOF
          - text: command issued to replicas, etc.
        - paragraph [ref=e400]: This behavior may not be compatible with all Sentinel clients, that may explicitly expect an IP address.
        - paragraph [ref=e401]: Using host names may be useful when clients use TLS to connect to instances and require a name rather than an IP address in order to perform certificate ASN matching.
        - heading [level=2] [ref=e402]:
          - text: A quick tutorial
          - link "Link to this section" [ref=e403] [cursor=pointer]:
            - /url: "#a-quick-tutorial"
        - paragraph [ref=e406]:
          - text: In the next sections of this document, all the details about
          - link [ref=e407] [cursor=pointer]:
            - /url: "#sentinel-api"
            - emphasis [ref=e408]: Sentinel API
          - text: ", configuration and semantics will be covered incrementally. However for people that want to play with the system ASAP, this section is a tutorial that shows how to configure and interact with 3 Sentinel instances."
        - paragraph [ref=e409]: Here we assume that the instances are executed at port 5000, 5001, 5002. We also assume that you have a running Redis master at port 6379 with a replica running at port 6380. We will use the IPv4 loopback address 127.0.0.1 everywhere during the tutorial, assuming you are running the simulation on your personal computer.
        - paragraph [ref=e410]: "The three Sentinel configuration files should look like the following:"
        - code [ref=e412]: port 5000 sentinel monitor mymaster 127.0.0.1 6379 2 sentinel down-after-milliseconds mymaster 5000 sentinel failover-timeout mymaster 60000 sentinel parallel-syncs mymaster 1
        - paragraph [ref=e413]: The other two configuration files will be identical but using 5001 and 5002 as port numbers.
        - paragraph [ref=e414]: "A few things to note about the above configuration:"
        - list [ref=e415]:
          - listitem [ref=e416]:
            - text: The master set is called
            - code [ref=e417]: mymaster
            - text: . It identifies the master and its replicas. Since each
            - emphasis [ref=e418]: master set
            - text: has a different name, Sentinel can monitor different sets of masters and replicas at the same time.
          - listitem [ref=e419]:
            - text: The quorum was set to the value of 2 (last argument of
            - code [ref=e420]: sentinel monitor
            - text: configuration directive).
          - listitem [ref=e421]:
            - text: The
            - code [ref=e422]: down-after-milliseconds
            - text: value is 5000 milliseconds, that is 5 seconds, so masters will be detected as failing as soon as we don't receive any reply from our pings within this amount of time.
        - paragraph [ref=e423]: "Once you start the three Sentinels, you'll see a few messages they log, like:"
        - code [ref=e425]: +monitor master mymaster 127.0.0.1 6379 quorum 2
        - paragraph [ref=e426]:
          - text: This is a Sentinel event, and you can receive this kind of events via Pub/Sub if you
          - link [ref=e427] [cursor=pointer]:
            - /url: /commands/subscribe
            - code [ref=e428]: SUBSCRIBE
          - text: to the event name as specified later in
          - link [ref=e429] [cursor=pointer]:
            - /url: "#pubsub-messages"
            - emphasis [ref=e430]: Pub/Sub Messages
            - text: section
          - text: .
        - paragraph [ref=e431]: Sentinel generates and logs different events during failure detection and failover.
        - heading [level=2] [ref=e432]:
          - text: Asking Sentinel about the state of a master
          - link "Link to this section" [ref=e433] [cursor=pointer]:
            - /url: "#asking-sentinel-about-the-state-of-a-master"
        - paragraph [ref=e436]: "The most obvious thing to do with Sentinel to get started, is check if the master it is monitoring is doing well:"
        - code [ref=e438]: $ redis-cli -p 5000 127.0.0.1:5000> sentinel master mymaster 1) "name" 2) "mymaster" 3) "ip" 4) "127.0.0.1" 5) "port" 6) "6379" 7) "runid" 8) "953ae6a589449c13ddefaee3538d356d287f509b" 9) "flags" 10) "master" 11) "link-pending-commands" 12) "0" 13) "link-refcount" 14) "1" 15) "last-ping-sent" 16) "0" 17) "last-ok-ping-reply" 18) "735" 19) "last-ping-reply" 20) "735" 21) "down-after-milliseconds" 22) "5000" 23) "info-refresh" 24) "126" 25) "role-reported" 26) "master" 27) "role-reported-time" 28) "532439" 29) "config-epoch" 30) "1" 31) "num-slaves" 32) "1" 33) "num-other-sentinels" 34) "2" 35) "quorum" 36) "2" 37) "failover-timeout" 38) "60000" 39) "parallel-syncs" 40) "1"
        - paragraph [ref=e439]: "As you can see, it prints a number of information about the master. There are a few that are of particular interest for us:"
        - list [ref=e440]:
          - listitem [ref=e441]:
            - code [ref=e442]: num-other-sentinels
            - text: is 2, so we know the Sentinel already detected two more Sentinels for this master. If you check the logs you'll see the
            - code [ref=e443]: +sentinel
            - text: events generated.
          - listitem [ref=e444]:
            - code [ref=e445]: flags
            - text: is just
            - code [ref=e446]: master
            - text: . If the master was down we could expect to see
            - code [ref=e447]: s_down
            - text: or
            - code [ref=e448]: o_down
            - text: flag as well here.
          - listitem [ref=e449]:
            - code [ref=e450]: num-slaves
            - text: is correctly set to 1, so Sentinel also detected that there is an attached replica to our master.
        - paragraph [ref=e451]: "In order to explore more about this instance, you may want to try the following two commands:"
        - code [ref=e453]: SENTINEL replicas mymaster SENTINEL sentinels mymaster
        - paragraph [ref=e454]: The first will provide similar information about the replicas connected to the master, and the second about the other Sentinels.
        - heading [level=2] [ref=e455]:
          - text: Obtaining the address of the current master
          - link "Link to this section" [ref=e456] [cursor=pointer]:
            - /url: "#obtaining-the-address-of-the-current-master"
        - paragraph [ref=e459]: "As we already specified, Sentinel also acts as a configuration provider for clients that want to connect to a set of master and replicas. Because of possible failovers or reconfigurations, clients have no idea about who is the currently active master for a given set of instances, so Sentinel exports an API to ask this question:"
        - code [ref=e461]: 127.0.0.1:5000> SENTINEL get-master-addr-by-name mymaster 1) "127.0.0.1" 2) "6379"
        - heading [level=3] [ref=e462]:
          - text: Testing the failover
          - link "Link to this section" [ref=e463] [cursor=pointer]:
            - /url: "#testing-the-failover"
        - paragraph [ref=e466]: "At this point our toy Sentinel deployment is ready to be tested. We can just kill our master and check if the configuration changes. To do so we can just do:"
        - code [ref=e468]: redis-cli -p 6379 DEBUG sleep 30
        - paragraph [ref=e469]: This command will make our master no longer reachable, sleeping for 30 seconds. It basically simulates a master hanging for some reason.
        - paragraph [ref=e470]: "If you check the Sentinel logs, you should be able to see a lot of action:"
        - list [ref=e471]:
          - listitem [ref=e472]:
            - text: Each Sentinel detects the master is down with an
            - code [ref=e473]: +sdown
            - text: event.
          - listitem [ref=e474]:
            - text: This event is later escalated to
            - code [ref=e475]: +odown
            - text: ", which means that multiple Sentinels agree about the fact the master is not reachable."
          - listitem [ref=e476]: Sentinels vote a Sentinel that will start the first failover attempt.
          - listitem [ref=e477]: The failover happens.
        - paragraph [ref=e478]:
          - text: If you ask again what is the current master address for
          - code [ref=e479]: mymaster
          - text: ", eventually we should get a different reply this time:"
        - code [ref=e481]: 127.0.0.1:5000> SENTINEL get-master-addr-by-name mymaster 1) "127.0.0.1" 2) "6380"
        - paragraph [ref=e482]: So far so good... At this point you may jump to create your Sentinel deployment or can read more to understand all the Sentinel commands and internals.
        - heading [level=2] [ref=e483]:
          - text: Sentinel API
          - link "Link to this section" [ref=e484] [cursor=pointer]:
            - /url: "#sentinel-api"
        - paragraph [ref=e487]: Sentinel provides an API in order to inspect its state, check the health of monitored masters and replicas, subscribe in order to receive specific notifications, and change the Sentinel configuration at run time.
        - paragraph [ref=e488]:
          - text: By default Sentinel runs using TCP port 26379 (note that 6379 is the normal Redis port). Sentinels accept commands using the Redis protocol, so you can use
          - code [ref=e489]: redis-cli
          - text: or any other unmodified Redis client in order to talk with Sentinel.
        - paragraph [ref=e490]:
          - text: It is possible to directly query a Sentinel to check what is the state of the monitored Redis instances from its point of view, to see what other Sentinels it knows, and so forth. Alternatively, using Pub/Sub, it is possible to receive
          - emphasis [ref=e491]: push style
          - text: notifications from Sentinels, every time some event happens, like a failover, or an instance entering an error condition, and so forth.
        - heading [level=3] [ref=e492]:
          - text: Sentinel commands
          - link "Link to this section" [ref=e493] [cursor=pointer]:
            - /url: "#sentinel-commands"
        - paragraph [ref=e496]:
          - text: The
          - code [ref=e497]: SENTINEL
          - text: "command is the main API for Sentinel. The following is the list of its subcommands (minimal version is noted for where applicable):"
        - list [ref=e498]:
          - listitem [ref=e499]:
            - strong [ref=e500]:
              - text: SENTINEL CONFIG GET
              - code [ref=e501]: <name>
            - text: (
            - code [ref=e502]: ">= 6.2"
            - text: ) Get the current value of a global Sentinel configuration parameter. The specified name may be a wildcard, similar to the Redis
            - link [ref=e503] [cursor=pointer]:
              - /url: /commands/config-get
              - code [ref=e504]: CONFIG GET
            - text: command.
          - listitem [ref=e505]:
            - strong [ref=e506]:
              - text: SENTINEL CONFIG SET
              - code [ref=e507]: <name>
              - code [ref=e508]: <value>
            - text: (
            - code [ref=e509]: ">= 6.2"
            - text: ) Set the value of a global Sentinel configuration parameter.
          - listitem [ref=e510]:
            - strong [ref=e511]:
              - text: SENTINEL CKQUORUM
              - code [ref=e512]: <master name>
            - text: Check if the current Sentinel configuration is able to reach the quorum needed to failover a master, and the majority needed to authorize the failover. This command should be used in monitoring systems to check if a Sentinel deployment is ok.
          - listitem [ref=e513]:
            - strong [ref=e514]: SENTINEL FLUSHCONFIG
            - text: Force Sentinel to rewrite its configuration on disk, including the current Sentinel state. Normally Sentinel rewrites the configuration every time something changes in its state (in the context of the subset of the state which is persisted on disk across restart). However sometimes it is possible that the configuration file is lost because of operation errors, disk failures, package upgrade scripts or configuration managers. In those cases a way to force Sentinel to rewrite the configuration file is handy. This command works even if the previous configuration file is completely missing.
          - listitem [ref=e515]:
            - strong [ref=e516]:
              - text: SENTINEL FAILOVER
              - code [ref=e517]: <master name>
            - text: Force a failover as if the master was not reachable, and without asking for agreement to other Sentinels (however a new version of the configuration will be published so that the other Sentinels will update their configurations).
          - listitem [ref=e518]:
            - strong [ref=e519]:
              - text: SENTINEL GET-MASTER-ADDR-BY-NAME
              - code [ref=e520]: <master name>
            - text: Return the ip and port number of the master with that name. If a failover is in progress or terminated successfully for this master it returns the address and port of the promoted replica.
          - listitem [ref=e521]:
            - strong [ref=e522]: SENTINEL INFO-CACHE
            - text: (
            - code [ref=e523]: ">= 3.2"
            - text: ) Return cached
            - link [ref=e524] [cursor=pointer]:
              - /url: /commands/info
              - code [ref=e525]: INFO
            - text: output from masters and replicas.
          - listitem [ref=e526]:
            - strong [ref=e527]: SENTINEL IS-MASTER-DOWN-BY-ADDR
            - text: Check if the master specified by ip:port is down from current Sentinel's point of view. This command is mostly for internal use.
          - listitem [ref=e528]:
            - strong [ref=e529]:
              - text: SENTINEL MASTER
              - code [ref=e530]: <master name>
            - text: Show the state and info of the specified master.
          - listitem [ref=e531]:
            - strong [ref=e532]: SENTINEL MASTERS
            - text: Show a list of monitored masters and their state.
          - listitem [ref=e533]:
            - strong [ref=e534]: SENTINEL MONITOR
            - text: Start Sentinel's monitoring. Refer to the
            - link [ref=e535] [cursor=pointer]:
              - /url: "#reconfiguring-sentinel-at-runtime"
              - emphasis [ref=e536]: Reconfiguring Sentinel at Runtime
              - text: section
            - text: for more information.
          - listitem [ref=e537]:
            - strong [ref=e538]: SENTINEL MYID
            - text: (
            - code [ref=e539]: ">= 6.2"
            - text: ) Return the ID of the Sentinel instance.
          - listitem [ref=e540]:
            - strong [ref=e541]: SENTINEL PENDING-SCRIPTS
            - text: This command returns information about pending scripts.
          - listitem [ref=e542]:
            - strong [ref=e543]: SENTINEL REMOVE
            - text: Stop Sentinel's monitoring. Refer to the
            - link [ref=e544] [cursor=pointer]:
              - /url: "#reconfiguring-sentinel-at-runtime"
              - emphasis [ref=e545]: Reconfiguring Sentinel at Runtime
              - text: section
            - text: for more information.
          - listitem [ref=e546]:
            - strong [ref=e547]:
              - text: SENTINEL REPLICAS
              - code [ref=e548]: <master name>
            - text: (
            - code [ref=e549]: ">= 5.0"
            - text: ) Show a list of replicas for this master, and their state.
          - listitem [ref=e550]:
            - strong [ref=e551]:
              - text: SENTINEL SENTINELS
              - code [ref=e552]: <master name>
            - text: Show a list of sentinel instances for this master, and their state.
          - listitem [ref=e553]:
            - strong [ref=e554]: SENTINEL SET
            - text: Set Sentinel's monitoring configuration. Refer to the
            - link [ref=e555] [cursor=pointer]:
              - /url: "#reconfiguring-sentinel-at-runtime"
              - emphasis [ref=e556]: Reconfiguring Sentinel at Runtime
              - text: section
            - text: for more information.
          - listitem [ref=e557]:
            - strong [ref=e558]: SENTINEL SIMULATE-FAILURE (crash-after-election|crash-after-promotion|help)
            - text: (
            - code [ref=e559]: ">= 3.2"
            - text: ) This command simulates different Sentinel crash scenarios.
          - listitem [ref=e560]:
            - strong [ref=e561]:
              - text: SENTINEL RESET
              - code [ref=e562]: <pattern>
            - text: This command will reset all the masters with matching name. The pattern argument is a glob-style pattern. The reset process clears any previous state in a master (including a failover in progress), and removes every replica and sentinel already discovered and associated with the master.
        - paragraph [ref=e563]: "For connection management and administration purposes, Sentinel supports the following subset of Redis' commands:"
        - list [ref=e564]:
          - listitem [ref=e565]:
            - strong [ref=e566]: ACL
            - text: (
            - code [ref=e567]: ">= 6.2"
            - text: ) This command manages the Sentinel Access Control List. For more information refer to the
            - link "ACL" [ref=e568] [cursor=pointer]:
              - /url: /docs/latest/operate/oss_and_stack/management/security/acl/
            - text: documentation page and the
            - link [ref=e569] [cursor=pointer]:
              - /url: "#sentinel-access-control-list-authentication"
              - emphasis [ref=e570]: Sentinel Access Control List authentication
            - text: .
          - listitem [ref=e571]:
            - strong [ref=e572]: AUTH
            - text: (
            - code [ref=e573]: ">= 5.0.1"
            - text: ) Authenticate a client connection. For more information refer to the
            - link [ref=e574] [cursor=pointer]:
              - /url: /commands/auth
              - code [ref=e575]: AUTH
            - text: command and the
            - link [ref=e576] [cursor=pointer]:
              - /url: "#configuring-sentinel-instances-with-authentication"
              - emphasis [ref=e577]: Configuring Sentinel instances with authentication
              - text: section
            - text: .
          - listitem [ref=e578]:
            - strong [ref=e579]: CLIENT
            - text: This command manages client connections. For more information refer to its subcommands' pages.
          - listitem [ref=e580]:
            - strong [ref=e581]: COMMAND
            - text: (
            - code [ref=e582]: ">= 6.2"
            - text: ) This command returns information about commands. For more information refer to the
            - link [ref=e583] [cursor=pointer]:
              - /url: /commands/command
              - code [ref=e584]: COMMAND
            - text: command and its various subcommands.
          - listitem [ref=e585]:
            - strong [ref=e586]: HELLO
            - text: (
            - code [ref=e587]: ">= 6.0"
            - text: ) Switch the connection's protocol. For more information refer to the
            - link [ref=e588] [cursor=pointer]:
              - /url: /commands/hello
              - code [ref=e589]: HELLO
            - text: command.
          - listitem [ref=e590]:
            - strong [ref=e591]: INFO
            - text: Return information and statistics about the Sentinel server. For more information see the
            - link [ref=e592] [cursor=pointer]:
              - /url: /commands/info
              - code [ref=e593]: INFO
            - text: command.
          - listitem [ref=e594]:
            - strong [ref=e595]: PING
            - text: This command simply returns PONG.
          - listitem [ref=e596]:
            - strong [ref=e597]: ROLE
            - text: This command returns the string "sentinel" and a list of monitored masters. For more information refer to the
            - link [ref=e598] [cursor=pointer]:
              - /url: /commands/role
              - code [ref=e599]: ROLE
            - text: command.
          - listitem [ref=e600]:
            - strong [ref=e601]: SHUTDOWN
            - text: Shut down the Sentinel instance.
        - paragraph [ref=e602]:
          - text: Lastly, Sentinel also supports the
          - link [ref=e603] [cursor=pointer]:
            - /url: /commands/subscribe
            - code [ref=e604]: SUBSCRIBE
          - text: ","
          - link [ref=e605] [cursor=pointer]:
            - /url: /commands/unsubscribe
            - code [ref=e606]: UNSUBSCRIBE
          - text: ","
          - link [ref=e607] [cursor=pointer]:
            - /url: /commands/psubscribe
            - code [ref=e608]: PSUBSCRIBE
          - text: and
          - link [ref=e609] [cursor=pointer]:
            - /url: /commands/punsubscribe
            - code [ref=e610]: PUNSUBSCRIBE
          - text: commands. Refer to the
          - link [ref=e611] [cursor=pointer]:
            - /url: "#pubsub-messages"
            - emphasis [ref=e612]: Pub/Sub Messages
            - text: section
          - text: for more details.
        - heading [level=3] [ref=e613]:
          - text: Reconfiguring Sentinel at Runtime
          - link "Link to this section" [ref=e614] [cursor=pointer]:
            - /url: "#reconfiguring-sentinel-at-runtime"
        - paragraph [ref=e617]: Starting with Redis version 2.8.4, Sentinel provides an API in order to add, remove, or change the configuration of a given master. Note that if you have multiple sentinels you should apply the changes to all to your instances for Redis Sentinel to work properly. This means that changing the configuration of a single Sentinel does not automatically propagate the changes to the other Sentinels in the network.
        - paragraph [ref=e618]:
          - text: The following is a list of
          - code [ref=e619]: SENTINEL
          - text: subcommands used in order to update the configuration of a Sentinel instance.
        - list [ref=e620]:
          - listitem [ref=e621]:
            - strong [ref=e622]:
              - text: SENTINEL MONITOR
              - code [ref=e623]: <name>
              - code [ref=e624]: <ip>
              - code [ref=e625]: <port>
              - code [ref=e626]: <quorum>
            - text: This command tells the Sentinel to start monitoring a new master with the specified name, ip, port, and quorum. It is identical to the
            - code [ref=e627]: sentinel monitor
            - text: configuration directive in
            - code [ref=e628]: sentinel.conf
            - text: configuration file, with the difference that you can't use a hostname in as
            - code [ref=e629]: ip
            - text: ", but you need to provide an IPv4 or IPv6 address."
          - listitem [ref=e630]:
            - strong [ref=e631]:
              - text: SENTINEL REMOVE
              - code [ref=e632]: <name>
            - text: "is used in order to remove the specified master: the master will no longer be monitored, and will totally be removed from the internal state of the Sentinel, so it will no longer listed by"
            - code [ref=e633]: SENTINEL masters
            - text: and so forth.
          - listitem [ref=e634]:
            - strong [ref=e635]:
              - text: SENTINEL SET
              - code [ref=e636]: <name>
              - text: "["
              - code [ref=e637]: <option>
              - code [ref=e638]: <value>
              - text: ...]
            - text: The SET command is very similar to the
            - link [ref=e639] [cursor=pointer]:
              - /url: /commands/config-set
              - code [ref=e640]: CONFIG SET
            - text: command of Redis, and is used in order to change configuration parameters of a specific master. Multiple option / value pairs can be specified (or none at all). All the configuration parameters that can be configured via
            - code [ref=e641]: sentinel.conf
            - text: are also configurable using the SET command.
        - paragraph [ref=e642]:
          - text: The following is an example of
          - code [ref=e643]: SENTINEL SET
          - text: command in order to modify the
          - code [ref=e644]: down-after-milliseconds
          - text: configuration of a master called
          - code [ref=e645]: objects-cache
          - text: ":"
        - code [ref=e647]: SENTINEL SET objects-cache-master down-after-milliseconds 1000
        - paragraph [ref=e648]:
          - text: As already stated,
          - code [ref=e649]: SENTINEL SET
          - text: can be used to set all the configuration parameters that are settable in the startup configuration file. Moreover it is possible to change just the master quorum configuration without removing and re-adding the master with
          - code [ref=e650]: SENTINEL REMOVE
          - text: followed by
          - code [ref=e651]: SENTINEL MONITOR
          - text: ", but simply using:"
        - code [ref=e653]: SENTINEL SET objects-cache-master quorum 5
        - paragraph [ref=e654]:
          - text: Note that there is no equivalent GET command since
          - code [ref=e655]: SENTINEL MASTER
          - text: provides all the configuration parameters in a simple to parse format (as a field/value pairs array).
        - paragraph [ref=e656]: Starting with Redis version 6.2, Sentinel also allows getting and setting global configuration parameters which were only supported in the configuration file prior to that.
        - list [ref=e657]:
          - listitem [ref=e658]:
            - strong [ref=e659]:
              - text: SENTINEL CONFIG GET
              - code [ref=e660]: <name>
            - text: Get the current value of a global Sentinel configuration parameter. The specified name may be a wildcard, similar to the Redis
            - link [ref=e661] [cursor=pointer]:
              - /url: /commands/config-get
              - code [ref=e662]: CONFIG GET
            - text: command.
          - listitem [ref=e663]:
            - strong [ref=e664]:
              - text: SENTINEL CONFIG SET
              - code [ref=e665]: <name>
              - code [ref=e666]: <value>
            - text: Set the value of a global Sentinel configuration parameter.
        - paragraph [ref=e667]: "Global parameters that can be manipulated include:"
        - list [ref=e668]:
          - listitem [ref=e669]:
            - code [ref=e670]: resolve-hostnames
            - text: ","
            - code [ref=e671]: announce-hostnames
            - text: . See
            - link [ref=e672] [cursor=pointer]:
              - /url: "#ip-addresses-and-dns-names"
              - emphasis [ref=e673]: IP addresses and DNS names
            - text: .
          - listitem [ref=e674]:
            - code [ref=e675]: announce-ip
            - text: ","
            - code [ref=e676]: announce-port
            - text: . See
            - link [ref=e677] [cursor=pointer]:
              - /url: "#sentinel-docker-nat-and-possible-issues"
              - emphasis [ref=e678]: Sentinel, Docker, NAT, and possible issues
            - text: .
          - listitem [ref=e679]:
            - code [ref=e680]: sentinel-user
            - text: ","
            - code [ref=e681]: sentinel-pass
            - text: . See
            - link [ref=e682] [cursor=pointer]:
              - /url: "#configuring-sentinel-instances-with-authentication"
              - emphasis [ref=e683]: Configuring Sentinel instances with authentication
            - text: .
        - heading [level=3] [ref=e684]:
          - text: Adding or removing Sentinels
          - link "Link to this section" [ref=e685] [cursor=pointer]:
            - /url: "#adding-or-removing-sentinels"
        - paragraph [ref=e688]: Adding a new Sentinel to your deployment is a simple process because of the auto-discover mechanism implemented by Sentinel. All you need to do is to start the new Sentinel configured to monitor the currently active master. Within 10 seconds the Sentinel will acquire the list of other Sentinels and the set of replicas attached to the master.
        - paragraph [ref=e689]: If you need to add multiple Sentinels at once, it is suggested to add it one after the other, waiting for all the other Sentinels to already know about the first one before adding the next. This is useful in order to still guarantee that majority can be achieved only in one side of a partition, in the chance failures should happen in the process of adding new Sentinels.
        - paragraph [ref=e690]: This can be easily achieved by adding every new Sentinel with a 30 seconds delay, and during absence of network partitions.
        - paragraph [ref=e691]:
          - text: At the end of the process it is possible to use the command
          - code [ref=e692]: SENTINEL MASTER mastername
          - text: in order to check if all the Sentinels agree about the total number of Sentinels monitoring the master.
        - paragraph [ref=e693]:
          - text: "Removing a Sentinel is a bit more complex:"
          - strong [ref=e694]: Sentinels never forget already seen Sentinels
          - text: ", even if they are not reachable for a long time, since we don't want to dynamically change the majority needed to authorize a failover and the creation of a new configuration number. So in order to remove a Sentinel the following steps should be performed in absence of network partitions:"
        - list [ref=e695]:
          - listitem [ref=e696]: Stop the Sentinel process of the Sentinel you want to remove.
          - listitem [ref=e697]:
            - text: Send a
            - code [ref=e698]: SENTINEL RESET *
            - text: command to all the other Sentinel instances (instead of
            - code [ref=e699]: "*"
            - text: you can use the exact master name if you want to reset just a single master). One after the other, waiting at least 30 seconds between instances.
          - listitem [ref=e700]:
            - text: Check that all the Sentinels agree about the number of Sentinels currently active, by inspecting the output of
            - code [ref=e701]: SENTINEL MASTER mastername
            - text: of every Sentinel.
        - heading [level=3] [ref=e702]:
          - text: Removing the old master or unreachable replicas
          - link "Link to this section" [ref=e703] [cursor=pointer]:
            - /url: "#removing-the-old-master-or-unreachable-replicas"
        - paragraph [ref=e706]: Sentinels never forget about replicas of a given master, even when they are unreachable for a long time. This is useful, because Sentinels should be able to correctly reconfigure a returning replica after a network partition or a failure event.
        - paragraph [ref=e707]: Moreover, after a failover, the failed over master is virtually added as a replica of the new master, this way it will be reconfigured to replicate with the new master as soon as it will be available again.
        - paragraph [ref=e708]: However sometimes you want to remove a replica (that may be the old master) forever from the list of replicas monitored by Sentinels.
        - paragraph [ref=e709]:
          - text: In order to do this, you need to send a
          - code [ref=e710]: SENTINEL RESET mastername
          - text: "command to all the Sentinels: they'll refresh the list of replicas within the next 10 seconds, only adding the ones listed as correctly replicating from the current master"
          - link [ref=e711] [cursor=pointer]:
            - /url: /commands/info
            - code [ref=e712]: INFO
          - text: output.
        - heading [level=3] [ref=e713]:
          - text: Pub/Sub messages
          - link "Link to this section" [ref=e714] [cursor=pointer]:
            - /url: "#pubsub-messages"
        - paragraph [ref=e717]:
          - text: A client can use a Sentinel as a Redis-compatible Pub/Sub server (but you can't use
          - link [ref=e718] [cursor=pointer]:
            - /url: /commands/publish
            - code [ref=e719]: PUBLISH
          - text: ) in order to
          - link [ref=e720] [cursor=pointer]:
            - /url: /commands/subscribe
            - code [ref=e721]: SUBSCRIBE
          - text: or
          - link [ref=e722] [cursor=pointer]:
            - /url: /commands/psubscribe
            - code [ref=e723]: PSUBSCRIBE
          - text: to channels and get notified about specific events.
        - paragraph [ref=e724]:
          - text: The channel name is the same as the name of the event. For instance the channel named
          - code [ref=e725]: +sdown
          - text: will receive all the notifications related to instances entering an
          - code [ref=e726]: SDOWN
          - text: (SDOWN means the instance is no longer reachable from the point of view of the Sentinel you are querying) condition.
        - paragraph [ref=e727]:
          - text: To get all the messages simply subscribe using
          - code [ref=e728]: PSUBSCRIBE *
          - text: .
        - paragraph [ref=e729]: The following is a list of channels and message formats you can receive using this API. The first word is the channel / event name, the rest is the format of the data.
        - paragraph [ref=e730]:
          - text: "Note: where"
          - emphasis [ref=e731]: instance details
          - text: "is specified it means that the following arguments are provided to identify the target instance:"
        - code [ref=e733]: <instance-type> <name> <ip> <port> @ <master-name> <master-ip> <master-port>
        - paragraph [ref=e734]: The part identifying the master (from the @ argument to the end) is optional and is only specified if the instance is not a master itself.
        - list [ref=e735]:
          - listitem [ref=e736]:
            - strong [ref=e737]: +reset-master
            - code [ref=e738]: <instance details>
            - text: "-- The master was reset."
          - listitem [ref=e739]:
            - strong [ref=e740]: +slave
            - code [ref=e741]: <instance details>
            - text: "-- A new replica was detected and attached."
          - listitem [ref=e742]:
            - strong [ref=e743]: +failover-state-reconf-slaves
            - code [ref=e744]: <instance details>
            - text: "-- Failover state changed to"
            - code [ref=e745]: reconf-slaves
            - text: state.
          - listitem [ref=e746]:
            - strong [ref=e747]: +failover-detected
            - code [ref=e748]: <instance details>
            - text: "-- A failover started by another Sentinel or any other external entity was detected (An attached replica turned into a master)."
          - listitem [ref=e749]:
            - strong [ref=e750]: +slave-reconf-sent
            - code [ref=e751]: <instance details>
            - text: "-- The leader sentinel sent the"
            - link [ref=e752] [cursor=pointer]:
              - /url: /commands/replicaof
              - code [ref=e753]: REPLICAOF
            - text: command to this instance in order to reconfigure it for the new replica.
          - listitem [ref=e754]:
            - strong [ref=e755]: +slave-reconf-inprog
            - code [ref=e756]: <instance details>
            - text: "-- The replica being reconfigured showed to be a replica of the new master ip:port pair, but the synchronization process is not yet complete."
          - listitem [ref=e757]:
            - strong [ref=e758]: +slave-reconf-done
            - code [ref=e759]: <instance details>
            - text: "-- The replica is now synchronized with the new master."
          - listitem [ref=e760]:
            - strong [ref=e761]: "-dup-sentinel"
            - code [ref=e762]: <instance details>
            - text: "-- One or more sentinels for the specified master were removed as duplicated (this happens for instance when a Sentinel instance is restarted)."
          - listitem [ref=e763]:
            - strong [ref=e764]: +sentinel
            - code [ref=e765]: <instance details>
            - text: "-- A new sentinel for this master was detected and attached."
          - listitem [ref=e766]:
            - strong [ref=e767]: +sdown
            - code [ref=e768]: <instance details>
            - text: "-- The specified instance is now in Subjectively Down state."
          - listitem [ref=e769]:
            - strong [ref=e770]: "-sdown"
            - code [ref=e771]: <instance details>
            - text: "-- The specified instance is no longer in Subjectively Down state."
          - listitem [ref=e772]:
            - strong [ref=e773]: +odown
            - code [ref=e774]: <instance details>
            - text: "-- The specified instance is now in Objectively Down state."
          - listitem [ref=e775]:
            - strong [ref=e776]: "-odown"
            - code [ref=e777]: <instance details>
            - text: "-- The specified instance is no longer in Objectively Down state."
          - listitem [ref=e778]:
            - strong [ref=e779]: +new-epoch
            - code [ref=e780]: <instance details>
            - text: "-- The current epoch was updated."
          - listitem [ref=e781]:
            - strong [ref=e782]: +try-failover
            - code [ref=e783]: <instance details>
            - text: "-- New failover in progress, waiting to be elected by the majority."
          - listitem [ref=e784]:
            - strong [ref=e785]: +elected-leader
            - code [ref=e786]: <instance details>
            - text: "-- Won the election for the specified epoch, can do the failover."
          - listitem [ref=e787]:
            - strong [ref=e788]: +failover-state-select-slave
            - code [ref=e789]: <instance details>
            - text: "-- New failover state is"
            - code [ref=e790]: select-slave
            - text: ": we are trying to find a suitable replica for promotion."
          - listitem [ref=e791]:
            - strong [ref=e792]: no-good-slave
            - code [ref=e793]: <instance details>
            - text: "-- There is no good replica to promote. Currently we'll try after some time, but probably this will change and the state machine will abort the failover at all in this case."
          - listitem [ref=e794]:
            - strong [ref=e795]: selected-slave
            - code [ref=e796]: <instance details>
            - text: "-- We found the specified good replica to promote."
          - listitem [ref=e797]:
            - strong [ref=e798]: failover-state-send-slaveof-noone
            - code [ref=e799]: <instance details>
            - text: "-- We are trying to reconfigure the promoted replica as master, waiting for it to switch."
          - listitem [ref=e800]:
            - strong [ref=e801]: failover-end-for-timeout
            - code [ref=e802]: <instance details>
            - text: "-- The failover terminated for timeout, replicas will eventually be configured to replicate with the new master anyway."
          - listitem [ref=e803]:
            - strong [ref=e804]: failover-end
            - code [ref=e805]: <instance details>
            - text: "-- The failover terminated with success. All the replicas appears to be reconfigured to replicate with the new master."
          - listitem [ref=e806]:
            - strong [ref=e807]: switch-master
            - code [ref=e808]: <master name> <oldip> <oldport> <newip> <newport>
            - text: "-- The master new IP and address is the specified one after a configuration change. This is"
            - strong [ref=e809]: the message most external users are interested in
            - text: .
          - listitem [ref=e810]:
            - strong [ref=e811]: +tilt
            - text: "-- Tilt mode entered."
          - listitem [ref=e812]:
            - strong [ref=e813]: "-tilt"
            - text: "-- Tilt mode exited."
        - heading [level=3] [ref=e814]:
          - text: Handling of -BUSY state
          - link "Link to this section" [ref=e815] [cursor=pointer]:
            - /url: "#handling-of--busy-state"
        - paragraph [ref=e818]:
          - text: The -BUSY error is returned by a Redis instance when a Lua script is running for more time than the configured Lua script time limit. When this happens before triggering a fail over Redis Sentinel will try to send a
          - link [ref=e819] [cursor=pointer]:
            - /url: /commands/script-kill
            - code [ref=e820]: SCRIPT KILL
          - text: command, that will only succeed if the script was read-only.
        - paragraph [ref=e821]: If the instance is still in an error condition after this try, it will eventually be failed over.
        - heading [level=2] [ref=e822]:
          - text: Replicas priority
          - link "Link to this section" [ref=e823] [cursor=pointer]:
            - /url: "#replicas-priority"
        - paragraph [ref=e826]:
          - text: Redis instances have a configuration parameter called
          - code [ref=e827]: replica-priority
          - text: . This information is exposed by Redis replica instances in their
          - link [ref=e828] [cursor=pointer]:
            - /url: /commands/info
            - code [ref=e829]: INFO
          - text: "output, and Sentinel uses it in order to pick a replica among the ones that can be used in order to failover a master:"
        - list [ref=e830]:
          - listitem [ref=e831]: If the replica priority is set to 0, the replica is never promoted to master.
          - listitem [ref=e832]:
            - text: Replicas with a
            - emphasis [ref=e833]: lower
            - text: priority number are preferred by Sentinel.
        - paragraph [ref=e834]: For example if there is a replica S1 in the same data center of the current master, and another replica S2 in another data center, it is possible to set S1 with a priority of 10 and S2 with a priority of 100, so that if the master fails and both S1 and S2 are available, S1 will be preferred.
        - paragraph [ref=e835]:
          - text: For more information about the way replicas are selected, please check the
          - link [ref=e836] [cursor=pointer]:
            - /url: "#replica-selection-and-priority"
            - emphasis [ref=e837]: Replica selection and priority
            - text: section
          - text: of this documentation.
        - heading [level=3] [ref=e838]:
          - text: Sentinel and Redis authentication
          - link "Link to this section" [ref=e839] [cursor=pointer]:
            - /url: "#sentinel-and-redis-authentication"
        - paragraph [ref=e842]: When the master is configured to require authentication from clients, as a security measure, replicas need to also be aware of the credentials in order to authenticate with the master and create the master-replica connection used for the asynchronous replication protocol.
        - heading [level=2] [ref=e843]:
          - text: Redis Access Control List authentication
          - link "Link to this section" [ref=e844] [cursor=pointer]:
            - /url: "#redis-access-control-list-authentication"
        - paragraph [ref=e847]:
          - text: Starting with Redis 6, user authentication and permission is managed with the
          - link "Access Control List (ACL)" [ref=e848] [cursor=pointer]:
            - /url: /docs/latest/operate/oss_and_stack/management/security/acl/
          - text: .
        - paragraph [ref=e849]: "In order for Sentinels to connect to Redis server instances when they are configured with ACL, the Sentinel configuration must include the following directives:"
        - code [ref=e851]: sentinel auth-user <master-name> <username> sentinel auth-pass <master-name> <password>
        - paragraph [ref=e852]:
          - text: Where
          - code [ref=e853]: <username>
          - text: and
          - code [ref=e854]: <password>
          - text: "are the username and password for accessing the group's instances. These credentials should be provisioned on all of the group's Redis instances with the minimal control permissions. For example:"
        - code [ref=e856]: 127.0.0.1:6379> ACL SETUSER sentinel-user ON >somepassword resetchannels &__sentinel__:hello +multi +slaveof +ping +exec +subscribe +config|rewrite +role +publish +info +client|setname +client|kill +script|kill
        - paragraph [ref=e857]:
          - text: The only Pub/Sub channel that Sentinel uses on a monitored node is
          - code [ref=e858]: __sentinel__:hello
          - text: ", so this user is granted access to that channel only ("
          - code [ref=e859]: resetchannels &__sentinel__:hello
          - text: ) rather than to all channels (
          - code [ref=e860]: allchannels
          - text: ", equivalently"
          - code [ref=e861]: "&*"
          - text: ).
        - generic [ref=e866]:
          - generic [ref=e867]: "Warning:"
          - paragraph [ref=e868]:
            - text: Sentinel discovery relies on the reserved
            - code [ref=e869]: __sentinel__:hello
            - text: Pub/Sub channel on each monitored master and replica. Sentinels periodically publish their presence there and subscribe to it to discover other Sentinels and learn the current topology. These messages carry no authentication and are trusted by receiving Sentinels, so any client that can publish to this channel on a monitored node can inject forged topology information and trigger spurious failovers or a denial of service.
          - paragraph [ref=e870]: "Because of this, do not grant broad Pub/Sub access on Sentinel-monitored Redis nodes:"
          - list [ref=e871]:
            - listitem [ref=e872]:
              - text: No user needs access to all channels (
              - code [ref=e873]: allchannels
              - text: /
              - code [ref=e874]: "&*"
              - text: ). The Sentinel
              - code [ref=e875]: auth-user
              - text: needs access only to the
              - code [ref=e876]: __sentinel__:hello
              - text: channel (
              - code [ref=e877]: "&__sentinel__:hello"
              - text: ), and no other user should be able to publish to or subscribe to it. Since Redis 7.0, the default value of
              - code [ref=e878]: acl-pubsub-default
              - text: is
              - code [ref=e879]: resetchannels
              - text: ", so newly created ACL users have no channel access unless you grant it explicitly. Be especially careful with the legacy"
              - code [ref=e880]: default
              - text: user, which may still have broad access.
            - listitem [ref=e881]:
              - text: Treat the
              - code [ref=e882]: "__sentinel__:"
              - text: channel prefix as reserved for Sentinel's internal use.
        - heading [level=3] [ref=e883]:
          - text: Redis password-only authentication
          - link "Link to this section" [ref=e884] [cursor=pointer]:
            - /url: "#redis-password-only-authentication"
        - paragraph [ref=e887]: "Until Redis 6, authentication is achieved using the following configuration directives:"
        - list [ref=e888]:
          - listitem [ref=e889]:
            - code [ref=e890]: requirepass
            - text: in the master, in order to set the authentication password, and to make sure the instance will not process requests for non authenticated clients.
          - listitem [ref=e891]:
            - code [ref=e892]: masterauth
            - text: in the replicas in order for the replicas to authenticate with the master in order to correctly replicate data from it.
        - paragraph [ref=e893]: When Sentinel is used, there is not a single master, since after a failover replicas may play the role of masters, and old masters can be reconfigured in order to act as replicas, so what you want to do is to set the above directives in all your instances, both masters and replicas.
        - paragraph [ref=e894]: This is also usually a sane setup since you don't want to protect data only in the master, having the same data accessible in the replicas.
        - paragraph [ref=e895]:
          - text: However, in the uncommon case where you need a replica that is accessible without authentication, you can still do it by setting up
          - strong [ref=e896]: a replica priority of zero
          - text: ", to prevent this replica from being promoted to master, and configuring in this replica only the"
          - code [ref=e897]: masterauth
          - text: directive, without using the
          - code [ref=e898]: requirepass
          - text: directive, so that data will be readable by unauthenticated clients.
        - paragraph [ref=e899]:
          - text: In order for Sentinels to connect to Redis server instances when they are configured with
          - code [ref=e900]: requirepass
          - text: ", the Sentinel configuration must include the"
          - code [ref=e901]: sentinel auth-pass
          - text: "directive, in the format:"
        - code [ref=e903]: sentinel auth-pass <master-name> <password>
        - heading [level=2] [ref=e904]:
          - text: Configuring Sentinel instances with authentication
          - link "Link to this section" [ref=e905] [cursor=pointer]:
            - /url: "#configuring-sentinel-instances-with-authentication"
        - paragraph [ref=e908]:
          - text: Sentinel instances themselves can be secured by requiring clients to authenticate via the
          - link [ref=e909] [cursor=pointer]:
            - /url: /commands/auth
            - code [ref=e910]: AUTH
          - text: command. Starting with Redis 6.2, the
          - link "Access Control List (ACL)" [ref=e911] [cursor=pointer]:
            - /url: /docs/latest/operate/oss_and_stack/management/security/acl/
          - text: is available, whereas previous versions (starting with Redis 5.0.1) support password-only authentication.
        - paragraph [ref=e912]:
          - text: Note that Sentinel's authentication configuration should be
          - strong [ref=e913]: applied to each of the instances
          - text: in your deployment, and
          - strong [ref=e914]: all instances should use the same configuration
          - text: . Furthermore, ACL and password-only authentication should not be used together.
        - heading [level=3] [ref=e915]:
          - text: Sentinel Access Control List authentication
          - link "Link to this section" [ref=e916] [cursor=pointer]:
            - /url: "#sentinel-access-control-list-authentication"
        - paragraph [ref=e919]: "The first step in securing a Sentinel instance with ACL is preventing any unauthorized access to it. To do that, you'll need to disable the default superuser (or at the very least set it up with a strong password) and create a new one and allow it access to Pub/Sub channels:"
        - code [ref=e921]: 127.0.0.1:5000> ACL SETUSER admin ON >admin-password allchannels +@all OK 127.0.0.1:5000> ACL SETUSER default off OK
        - paragraph [ref=e922]: "The default user is used by Sentinel to connect to other instances. You can provide the credentials of another superuser with the following configuration directives:"
        - code [ref=e924]: sentinel sentinel-user <username> sentinel sentinel-pass <password>
        - paragraph [ref=e925]:
          - text: Where
          - code [ref=e926]: <username>
          - text: and
          - code [ref=e927]: <password>
          - text: are the Sentinel's superuser and password, respectively (e.g.
          - code [ref=e928]: admin
          - text: and
          - code [ref=e929]: admin-password
          - text: in the example above).
        - paragraph [ref=e930]: "Lastly, for authenticating incoming client connections, you can create a Sentinel restricted user profile such as the following:"
        - code [ref=e932]: 127.0.0.1:5000> ACL SETUSER sentinel-user ON >user-password -@all +auth +client|getname +client|id +client|setname +command +hello +ping +role +sentinel|get-master-addr-by-name +sentinel|master +sentinel|myid +sentinel|replicas +sentinel|sentinels +sentinel|masters
        - paragraph [ref=e933]: Refer to the documentation of your Sentinel client of choice for further information.
        - heading [level=3] [ref=e934]:
          - text: Sentinel password-only authentication
          - link "Link to this section" [ref=e935] [cursor=pointer]:
            - /url: "#sentinel-password-only-authentication"
        - paragraph [ref=e938]:
          - text: To use Sentinel with password-only authentication, add the
          - code [ref=e939]: requirepass
          - text: configuration directive to
          - strong [ref=e940]: all
          - text: "your Sentinel instances as follows:"
        - code [ref=e942]: requirepass "your_password_here"
        - paragraph [ref=e943]: "When configured this way, Sentinels will do two things:"
        - list [ref=e944]:
          - listitem [ref=e945]: A password will be required from clients in order to send commands to Sentinels. This is obvious since this is how such configuration directive works in Redis in general.
          - listitem [ref=e946]: Moreover the same password configured to access the local Sentinel, will be used by this Sentinel instance in order to authenticate to all the other Sentinel instances it connects to.
        - paragraph [ref=e947]:
          - text: This means that
          - strong [ref=e948]:
            - text: you will have to configure the same
            - code [ref=e949]: requirepass
            - text: password in all the Sentinel instances
          - text: . This way every Sentinel can talk with every other Sentinel without any need to configure for each Sentinel the password to access all the other Sentinels, that would be very impractical.
        - paragraph [ref=e950]:
          - text: Before using this configuration, make sure your client library can send the
          - link [ref=e951] [cursor=pointer]:
            - /url: /commands/auth
            - code [ref=e952]: AUTH
          - text: command to Sentinel instances.
        - heading [level=3] [ref=e953]:
          - text: Sentinel clients implementation
          - link "Link to this section" [ref=e954] [cursor=pointer]:
            - /url: "#sentinel-clients-implementation"
        - separator [ref=e957]
        - paragraph [ref=e958]:
          - text: Sentinel requires explicit client support, unless the system is configured to execute a script that performs a transparent redirection of all the requests to the new master instance (virtual IP or other similar systems). The topic of client libraries implementation is covered in the document
          - link "Sentinel clients guidelines" [ref=e959] [cursor=pointer]:
            - /url: /docs/latest/develop/reference/sentinel-clients/
          - text: .
        - heading [level=2] [ref=e960]:
          - text: More advanced concepts
          - link "Link to this section" [ref=e961] [cursor=pointer]:
            - /url: "#more-advanced-concepts"
        - paragraph [ref=e964]: In the following sections we'll cover a few details about how Sentinel works, without resorting to implementation details and algorithms that will be covered in the final part of this document.
        - heading [level=3] [ref=e965]:
          - text: SDOWN and ODOWN failure state
          - link "Link to this section" [ref=e966] [cursor=pointer]:
            - /url: "#sdown-and-odown-failure-state"
        - paragraph [ref=e969]:
          - text: Redis Sentinel has two different concepts of
          - emphasis [ref=e970]: being down
          - text: ", one is called a"
          - emphasis [ref=e971]: Subjectively Down
          - text: condition (SDOWN) and is a down condition that is local to a given Sentinel instance. Another is called
          - emphasis [ref=e972]: Objectively Down
          - text: condition (ODOWN) and is reached when enough Sentinels (at least the number configured as the
          - code [ref=e973]: quorum
          - text: parameter of the monitored master) have an SDOWN condition, and get feedback from other Sentinels using the
          - code [ref=e974]: SENTINEL is-master-down-by-addr
          - text: command.
        - paragraph [ref=e975]:
          - text: From the point of view of a Sentinel an SDOWN condition is reached when it does not receive a valid reply to PING requests for the number of seconds specified in the configuration as
          - code [ref=e976]: is-master-down-after-milliseconds
          - text: parameter.
        - paragraph [ref=e977]: "An acceptable reply to PING is one of the following:"
        - list [ref=e978]:
          - listitem [ref=e979]: PING replied with +PONG.
          - listitem [ref=e980]: PING replied with -LOADING error.
          - listitem [ref=e981]: PING replied with -MASTERDOWN error.
        - paragraph [ref=e982]:
          - text: Any other reply (or no reply at all) is considered non valid. However note that
          - strong [ref=e983]: a logical master that advertises itself as a replica in the INFO output is considered to be down
          - text: .
        - paragraph [ref=e984]: Note that SDOWN requires that no acceptable reply is received for the whole interval configured, so for instance if the interval is 30000 milliseconds (30 seconds) and we receive an acceptable ping reply every 29 seconds, the instance is considered to be working.
        - paragraph [ref=e985]: "SDOWN is not enough to trigger a failover: it only means a single Sentinel believes a Redis instance is not available. To trigger a failover, the ODOWN state must be reached."
        - paragraph [ref=e986]:
          - text: "To switch from SDOWN to ODOWN no strong consensus algorithm is used, but just a form of gossip: if a given Sentinel gets reports that a master is not working from enough Sentinels"
          - strong [ref=e987]: in a given time range
          - text: ", the SDOWN is promoted to ODOWN. If this acknowledge is later missing, the flag is cleared."
        - paragraph [ref=e988]: A more strict authorization that uses an actual majority is required in order to really start the failover, but no failover can be triggered without reaching the ODOWN state.
        - paragraph [ref=e989]:
          - text: The ODOWN condition
          - strong [ref=e990]: only applies to masters
          - text: . For other kind of instances Sentinel doesn't require to act, so the ODOWN state is never reached for replicas and other sentinels, but only SDOWN is.
        - paragraph [ref=e991]: However SDOWN has also semantic implications. For example a replica in SDOWN state is not selected to be promoted by a Sentinel performing a failover.
        - heading [level=2] [ref=e992]:
          - text: Sentinels and replicas auto discovery
          - link "Link to this section" [ref=e993] [cursor=pointer]:
            - /url: "#sentinels-and-replicas-auto-discovery"
        - paragraph [ref=e996]: Sentinels stay connected with other Sentinels in order to reciprocally check the availability of each other, and to exchange messages. However you don't need to configure a list of other Sentinel addresses in every Sentinel instance you run, as Sentinel uses the Redis instances Pub/Sub capabilities in order to discover the other Sentinels that are monitoring the same masters and replicas.
        - paragraph [ref=e997]:
          - text: This feature is implemented by sending
          - emphasis [ref=e998]: hello messages
          - text: into the channel named
          - code [ref=e999]: __sentinel__:hello
          - text: .
        - paragraph [ref=e1000]: Similarly you don't need to configure what is the list of the replicas attached to a master, as Sentinel will auto discover this list querying Redis.
        - list [ref=e1001]:
          - listitem [ref=e1002]:
            - text: Every Sentinel publishes a message to every monitored master and replica Pub/Sub channel
            - code [ref=e1003]: __sentinel__:hello
            - text: ", every two seconds, announcing its presence with ip, port, runid."
          - listitem [ref=e1004]:
            - text: Every Sentinel is subscribed to the Pub/Sub channel
            - code [ref=e1005]: __sentinel__:hello
            - text: of every master and replica, looking for unknown sentinels. When new sentinels are detected, they are added as sentinels of this master.
          - listitem [ref=e1006]: Hello messages also include the full current configuration of the master. If the receiving Sentinel has a configuration for a given master which is older than the one received, it updates to the new configuration immediately.
          - listitem [ref=e1007]: Before adding a new sentinel to a master a Sentinel always checks if there is already a sentinel with the same runid or the same address (ip and port pair). In that case all the matching sentinels are removed, and the new added.
        - heading [level=2] [ref=e1008]:
          - text: Sentinel reconfiguration of instances outside the failover procedure
          - link "Link to this section" [ref=e1009] [cursor=pointer]:
            - /url: "#sentinel-reconfiguration-of-instances-outside-the-failover-procedure"
        - paragraph [ref=e1012]: "Even when no failover is in progress, Sentinels will always try to set the current configuration on monitored instances. Specifically:"
        - list [ref=e1013]:
          - listitem [ref=e1014]: Replicas (according to the current configuration) that claim to be masters, will be configured as replicas to replicate with the current master.
          - listitem [ref=e1015]: Replicas connected to a wrong master, will be reconfigured to replicate with the right master.
        - paragraph [ref=e1016]: For Sentinels to reconfigure replicas, the wrong configuration must be observed for some time, that is greater than the period used to broadcast new configurations.
        - paragraph [ref=e1017]: This prevents Sentinels with a stale configuration (for example because they just rejoined from a partition) will try to change the replicas configuration before receiving an update.
        - paragraph [ref=e1018]: "Also note how the semantics of always trying to impose the current configuration makes the failover more resistant to partitions:"
        - list [ref=e1019]:
          - listitem [ref=e1020]: Masters failed over are reconfigured as replicas when they return available.
          - listitem [ref=e1021]: Replicas partitioned away during a partition are reconfigured once reachable.
        - paragraph [ref=e1022]:
          - text: "The important lesson to remember about this section is:"
          - strong [ref=e1023]: Sentinel is a system where each process will always try to impose the last logical configuration to the set of monitored instances
          - text: .
        - heading [level=3] [ref=e1024]:
          - text: Replica selection and priority
          - link "Link to this section" [ref=e1025] [cursor=pointer]:
            - /url: "#replica-selection-and-priority"
        - paragraph [ref=e1028]:
          - text: When a Sentinel instance is ready to perform a failover, since the master is in
          - code [ref=e1029]: ODOWN
          - text: state and the Sentinel received the authorization to failover from the majority of the Sentinel instances known, a suitable replica needs to be selected.
        - paragraph [ref=e1030]: "The replica selection process evaluates the following information about replicas:"
        - list [ref=e1031]:
          - listitem [ref=e1032]: Disconnection time from the master.
          - listitem [ref=e1033]: Replica priority.
          - listitem [ref=e1034]: Replication offset processed.
          - listitem [ref=e1035]: Run ID.
        - paragraph [ref=e1036]: A replica that is found to be disconnected from the master for more than ten times the configured master timeout (down-after-milliseconds option), plus the time the master is also not available from the point of view of the Sentinel doing the failover, is considered to be not suitable for the failover and is skipped.
        - paragraph [ref=e1037]:
          - text: In more rigorous terms, a replica whose the
          - link [ref=e1038] [cursor=pointer]:
            - /url: /commands/info
            - code [ref=e1039]: INFO
          - text: "output suggests it has been disconnected from the master for more than:"
        - code [ref=e1041]: (down-after-milliseconds * 10) + milliseconds_since_master_is_in_SDOWN_state
        - paragraph [ref=e1042]: Is considered to be unreliable and is disregarded entirely.
        - paragraph [ref=e1043]: The replica selection only considers the replicas that passed the above test, and sorts it based on the above criteria, in the following order.
        - list [ref=e1044]:
          - listitem [ref=e1045]:
            - text: The replicas are sorted by
            - code [ref=e1046]: replica-priority
            - text: as configured in the
            - code [ref=e1047]: redis.conf
            - text: file of the Redis instance. A lower priority will be preferred.
          - listitem [ref=e1048]: If the priority is the same, the replication offset processed by the replica is checked, and the replica that received more data from the master is selected.
          - listitem [ref=e1049]: If multiple replicas have the same priority and processed the same data from the master, a further check is performed, selecting the replica with the lexicographically smaller run ID. Having a lower run ID is not a real advantage for a replica, but is useful in order to make the process of replica selection more deterministic, instead of resorting to select a random replica.
        - paragraph [ref=e1050]:
          - text: In most cases,
          - code [ref=e1051]: replica-priority
          - text: does not need to be set explicitly so all instances will use the same default value. If there is a particular fail-over preference,
          - code [ref=e1052]: replica-priority
          - text: must be set on all instances, including masters, as a master may become a replica at some future point in time - and it will then need the proper
          - code [ref=e1053]: replica-priority
          - text: settings.
        - paragraph [ref=e1054]:
          - text: A Redis instance can be configured with a special
          - code [ref=e1055]: replica-priority
          - text: of zero in order to be
          - strong [ref=e1056]: never selected
          - text: by Sentinels as the new master. However a replica configured in this way will still be reconfigured by Sentinels in order to replicate with the new master after a failover, the only difference is that it will never become a master itself.
        - heading [level=2] [ref=e1057]:
          - text: Algorithms and internals
          - link "Link to this section" [ref=e1058] [cursor=pointer]:
            - /url: "#algorithms-and-internals"
        - paragraph [ref=e1061]: In the following sections we will explore the details of Sentinel behavior. It is not strictly needed for users to be aware of all the details, but a deep understanding of Sentinel may help to deploy and operate Sentinel in a more effective way.
        - heading [level=3] [ref=e1062]:
          - text: Quorum
          - link "Link to this section" [ref=e1063] [cursor=pointer]:
            - /url: "#quorum"
        - paragraph [ref=e1066]:
          - text: The previous sections showed that every master monitored by Sentinel is associated to a configured
          - strong [ref=e1067]: quorum
          - text: . It specifies the number of Sentinel processes that need to agree about the unreachability or error condition of the master in order to trigger a failover.
        - paragraph [ref=e1068]:
          - text: However, after the failover is triggered, in order for the failover to actually be performed,
          - strong [ref=e1069]: at least a majority of Sentinels must authorize the Sentinel to failover
          - text: . Sentinel never performs a failover in the partition where a minority of Sentinels exist.
        - paragraph [ref=e1070]: "Let's try to make things a bit more clear:"
        - list [ref=e1071]:
          - listitem [ref=e1072]:
            - text: "Quorum: the number of Sentinel processes that need to detect an error condition in order for a master to be flagged as"
            - strong [ref=e1073]: ODOWN
            - text: .
          - listitem [ref=e1074]:
            - text: The failover is triggered by the
            - strong [ref=e1075]: ODOWN
            - text: state.
          - listitem [ref=e1076]: Once the failover is triggered, the Sentinel trying to failover is required to ask for authorization to a majority of Sentinels (or more than the majority if the quorum is set to a number greater than the majority).
        - paragraph [ref=e1077]: The difference may seem subtle but is actually quite simple to understand and use. For example if you have 5 Sentinel instances, and the quorum is set to 2, a failover will be triggered as soon as 2 Sentinels believe that the master is not reachable, however one of the two Sentinels will be able to failover only if it gets authorization at least from 3 Sentinels.
        - paragraph [ref=e1078]: If instead the quorum is configured to 5, all the Sentinels must agree about the master error condition, and the authorization from all Sentinels is required in order to failover.
        - paragraph [ref=e1079]: "This means that the quorum can be used to tune Sentinel in two ways:"
        - list [ref=e1080]:
          - listitem [ref=e1081]: If a quorum is set to a value smaller than the majority of Sentinels we deploy, we are basically making Sentinel more sensitive to master failures, triggering a failover as soon as even just a minority of Sentinels is no longer able to talk with the master.
          - listitem [ref=e1082]: If a quorum is set to a value greater than the majority of Sentinels, we are making Sentinel able to failover only when there are a very large number (larger than majority) of well connected Sentinels which agree about the master being down.
        - heading [level=3] [ref=e1083]:
          - text: Configuration epochs
          - link "Link to this section" [ref=e1084] [cursor=pointer]:
            - /url: "#configuration-epochs"
        - paragraph [ref=e1087]: "Sentinels require to get authorizations from a majority in order to start a failover for a few important reasons:"
        - paragraph [ref=e1088]:
          - text: When a Sentinel is authorized, it gets a unique
          - strong [ref=e1089]: configuration epoch
          - text: for the master it is failing over. This is a number that will be used to version the new configuration after the failover is completed. Because a majority agreed that a given version was assigned to a given Sentinel, no other Sentinel will be able to use it. This means that every configuration of every failover is versioned with a unique version. We'll see why this is so important.
        - paragraph [ref=e1090]:
          - text: "Moreover Sentinels have a rule: if a Sentinel voted another Sentinel for the failover of a given master, it will wait some time to try to failover the same master again. This delay is the"
          - code [ref=e1091]: 2 * failover-timeout
          - text: you can configure in
          - code [ref=e1092]: sentinel.conf
          - text: . This means that Sentinels will not try to failover the same master at the same time, the first to ask to be authorized will try, if it fails another will try after some time, and so forth.
        - paragraph [ref=e1093]:
          - text: Redis Sentinel guarantees the
          - emphasis [ref=e1094]: liveness
          - text: property that if a majority of Sentinels are able to talk, eventually one will be authorized to failover if the master is down.
        - paragraph [ref=e1095]:
          - text: Redis Sentinel also guarantees the
          - emphasis [ref=e1096]: safety
          - text: property that every Sentinel will failover the same master using a different
          - emphasis [ref=e1097]: configuration epoch
          - text: .
        - heading [level=3] [ref=e1098]:
          - text: Configuration propagation
          - link "Link to this section" [ref=e1099] [cursor=pointer]:
            - /url: "#configuration-propagation"
        - paragraph [ref=e1102]: Once a Sentinel is able to failover a master successfully, it will start to broadcast the new configuration so that the other Sentinels will update their information about a given master.
        - paragraph [ref=e1103]:
          - text: For a failover to be considered successful, it requires that the Sentinel was able to send the
          - code [ref=e1104]: REPLICAOF NO ONE
          - text: command to the selected replica, and that the switch to master was later observed in the
          - link [ref=e1105] [cursor=pointer]:
            - /url: /commands/info
            - code [ref=e1106]: INFO
          - text: output of the master.
        - paragraph [ref=e1107]: At this point, even if the reconfiguration of the replicas is in progress, the failover is considered to be successful, and all the Sentinels are required to start reporting the new configuration.
        - paragraph [ref=e1108]: The way a new configuration is propagated is the reason why we need that every Sentinel failover is authorized with a different version number (configuration epoch).
        - paragraph [ref=e1109]: Every Sentinel continuously broadcast its version of the configuration of a master using Redis Pub/Sub messages, both in the master and all the replicas. At the same time all the Sentinels wait for messages to see what is the configuration advertised by the other Sentinels.
        - paragraph [ref=e1110]:
          - text: Configurations are broadcast in the
          - code [ref=e1111]: __sentinel__:hello
          - text: Pub/Sub channel.
        - paragraph [ref=e1112]: Because every configuration has a different version number, the greater version always wins over smaller versions.
        - paragraph [ref=e1113]:
          - text: So for example the configuration for the master
          - code [ref=e1114]: mymaster
          - text: start with all the Sentinels believing the master is at 192.168.1.50:6379. This configuration has version 1. After some time a Sentinel is authorized to failover with version 2. If the failover is successful, it will start to broadcast a new configuration, let's say 192.168.1.50:9000, with version 2. All the other instances will see this configuration and will update their configuration accordingly, since the new configuration has a greater version.
        - paragraph [ref=e1115]: "This means that Sentinel guarantees a second liveness property: a set of Sentinels that are able to communicate will all converge to the same configuration with the higher version number."
        - paragraph [ref=e1116]: Basically if the net is partitioned, every partition will converge to the higher local configuration. In the special case of no partitions, there is a single partition and every Sentinel will agree about the configuration.
        - heading [level=3] [ref=e1117]:
          - text: Consistency under partitions
          - link "Link to this section" [ref=e1118] [cursor=pointer]:
            - /url: "#consistency-under-partitions"
        - paragraph [ref=e1121]: "Redis Sentinel configurations are eventually consistent, so every partition will converge to the higher configuration available. However in a real-world system using Sentinel there are three different players:"
        - list [ref=e1122]:
          - listitem [ref=e1123]: Redis instances.
          - listitem [ref=e1124]: Sentinel instances.
          - listitem [ref=e1125]: Clients.
        - paragraph [ref=e1126]: In order to define the behavior of the system we have to consider all three.
        - paragraph [ref=e1127]: "The following is a simple network where there are 3 nodes, each running a Redis instance, and a Sentinel instance:"
        - code [ref=e1129]: +-------------+ | Sentinel 1 |----- Client A | Redis 1 (M) | +-------------+ | | +-------------+ | +------------+ | Sentinel 2 |-----+-- // ----| Sentinel 3 |----- Client B | Redis 2 (S) | | Redis 3 (M)| +-------------+ +------------+
        - paragraph [ref=e1130]: In this system the original state was that Redis 3 was the master, while Redis 1 and 2 were replicas. A partition occurred isolating the old master. Sentinels 1 and 2 started a failover promoting Sentinel 1 as the new master.
        - paragraph [ref=e1131]: The Sentinel properties guarantee that Sentinel 1 and 2 now have the new configuration for the master. However Sentinel 3 has still the old configuration since it lives in a different partition.
        - paragraph [ref=e1132]: We know that Sentinel 3 will get its configuration updated when the network partition will heal, however what happens during the partition if there are clients partitioned with the old master?
        - paragraph [ref=e1133]: Clients will be still able to write to Redis 3, the old master. When the partition will rejoin, Redis 3 will be turned into a replica of Redis 1, and all the data written during the partition will be lost.
        - paragraph [ref=e1134]: "Depending on your configuration you may want or not that this scenario happens:"
        - list [ref=e1135]:
          - listitem [ref=e1136]: If you are using Redis as a cache, it could be handy that Client B is still able to write to the old master, even if its data will be lost.
          - listitem [ref=e1137]: If you are using Redis as a store, this is not good and you need to configure the system in order to partially prevent this problem.
        - paragraph [ref=e1138]: "Since Redis is asynchronously replicated, there is no way to totally prevent data loss in this scenario, however you can bound the divergence between Redis 3 and Redis 1 using the following Redis configuration option:"
        - code [ref=e1140]: min-replicas-to-write 1 min-replicas-max-lag 10
        - paragraph [ref=e1141]:
          - text: With the above configuration (please see the self-commented
          - code [ref=e1142]: redis.conf
          - text: example in the Redis distribution for more information) a Redis instance, when acting as a master, will stop accepting writes if it can't write to at least 1 replica. Since replication is asynchronous
          - emphasis [ref=e1143]: not being able to write
          - text: actually means that the replica is either disconnected, or is not sending us asynchronous acknowledges for more than the specified
          - code [ref=e1144]: max-lag
          - text: number of seconds.
        - paragraph [ref=e1145]: Using this configuration the Redis 3 in the above example will become unavailable after 10 seconds. When the partition heals, the Sentinel 3 configuration will converge to the new one, and Client B will be able to fetch a valid configuration and continue.
        - paragraph [ref=e1146]:
          - text: In general Redis + Sentinel as a whole are an
          - strong [ref=e1147]: eventually consistent system
          - text: where the merge function is
          - strong [ref=e1148]: last failover wins
          - text: ", and the data from old masters are discarded to replicate the data of the current master, so there is always a window for losing acknowledged writes. This is due to Redis asynchronous replication and the discarding nature of the \"virtual\" merge function of the system. Note that this is not a limitation of Sentinel itself, and if you orchestrate the failover with a strongly consistent replicated state machine, the same properties will still apply. There are only two ways to avoid losing acknowledged writes:"
        - list [ref=e1149]:
          - listitem [ref=e1150]: Use synchronous replication (and a proper consensus algorithm to run a replicated state machine).
          - listitem [ref=e1151]: Use an eventually consistent system where different versions of the same object can be merged.
        - paragraph [ref=e1152]:
          - text: Redis currently is not able to use any of the above systems, and is currently outside the development goals. However there are proxies implementing solution "2" on top of Redis stores such as SoundCloud
          - link "Roshi" [ref=e1153] [cursor=pointer]:
            - /url: https://github.com/soundcloud/roshi
          - text: ", or Netflix"
          - link "Dynomite" [ref=e1154] [cursor=pointer]:
            - /url: https://github.com/Netflix/dynomite
          - text: .
        - heading [level=2] [ref=e1155]:
          - text: Sentinel persistent state
          - link "Link to this section" [ref=e1156] [cursor=pointer]:
            - /url: "#sentinel-persistent-state"
        - paragraph [ref=e1159]: Sentinel state is persisted in the sentinel configuration file. For example every time a new configuration is received, or created (leader Sentinels), for a master, the configuration is persisted on disk together with the configuration epoch. This means that it is safe to stop and restart Sentinel processes.
        - heading [level=3] [ref=e1160]:
          - text: TILT mode
          - link "Link to this section" [ref=e1161] [cursor=pointer]:
            - /url: "#tilt-mode"
        - paragraph [ref=e1164]: "Redis Sentinel is heavily dependent on the computer time: for instance in order to understand if an instance is available it remembers the time of the latest successful reply to the PING command, and compares it with the current time to understand how old it is."
        - paragraph [ref=e1165]: However if the computer time changes in an unexpected way, or if the computer is very busy, or the process blocked for some reason, Sentinel may start to behave in an unexpected way.
        - paragraph [ref=e1166]: The TILT mode is a special "protection" mode that a Sentinel can enter when something odd is detected that can lower the reliability of the system. The Sentinel timer interrupt is normally called 10 times per second, so we expect that more or less 100 milliseconds will elapse between two calls to the timer interrupt.
        - paragraph [ref=e1167]: "What a Sentinel does is to register the previous time the timer interrupt was called, and compare it with the current call: if the time difference is negative or unexpectedly big (2 seconds or more) the TILT mode is entered (or if it was already entered the exit from the TILT mode postponed)."
        - paragraph [ref=e1168]: "When in TILT mode the Sentinel will continue to monitor everything, but:"
        - list [ref=e1169]:
          - listitem [ref=e1170]: It stops acting at all.
          - listitem [ref=e1171]:
            - text: It starts to reply negatively to
            - code [ref=e1172]: SENTINEL is-master-down-by-addr
            - text: requests as the ability to detect a failure is no longer trusted.
        - paragraph [ref=e1173]: If everything appears to be normal for 30 second, the TILT mode is exited.
        - paragraph [ref=e1174]: "In the Sentinel TILT mode, if we send the INFO command, we could get the following response:"
        - code [ref=e1176]: "$ redis-cli -p 26379 127.0.0.1:26379> info (Other information from Sentinel server skipped.) # Sentinel sentinel_masters:1 sentinel_tilt:0 sentinel_tilt_since_seconds:-1 sentinel_running_scripts:0 sentinel_scripts_queue_length:0 sentinel_simulate_failure_flags:0 master0:name=mymaster,status=ok,address=127.0.0.1:6379,slaves=0,sentinels=1"
        - paragraph [ref=e1177]: The field "sentinel_tilt_since_seconds" indicates how many seconds the Sentinel already is in the TILT mode. If it is not in TILT mode, the value will be -1.
        - paragraph [ref=e1178]: Note that in some ways TILT mode could be replaced using the monotonic clock API that many kernels offer. However it is not still clear if this is a good solution since the current system avoids issues in case the process is just suspended or not executed by the scheduler for a long time.
        - paragraph [ref=e1179]:
          - strong [ref=e1180]: A note about the word slave used in this man page
          - text: ": Starting with Redis 5, if not for backward compatibility, the Redis project no longer uses the word slave. Unfortunately in this command the word slave is part of the protocol, so we'll be able to remove such occurrences only when this API will be naturally deprecated."
        - generic [ref=e1182]:
