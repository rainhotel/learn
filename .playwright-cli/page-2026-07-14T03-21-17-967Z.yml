                - text: by setting
                - code [ref=e184]: setEnableTransactionSupport(true)
                - text: . Enabling transaction support binds
                - code [ref=e185]: RedisConnection
                - text: to the current transaction backed by a
                - code [ref=e186]: ThreadLocal
                - text: . If the transaction finishes without errors, the Redis transaction gets commited with
                - code [ref=e187]: EXEC
                - text: ", otherwise rolled back with"
                - code [ref=e188]: DISCARD
                - text: . Redis transactions are batch-oriented. Commands issued during an ongoing transaction are queued and only applied when committing the transaction.
              - paragraph [ref=e190]:
