          - generic [ref=e132]:
            - paragraph [ref=e134]:
              - text: Redis provides support for
              - link "transactions" [ref=e135] [cursor=pointer]:
                - /url: https://redis.io/topics/transactions
              - text: through the
              - code [ref=e136]: multi
              - text: ","
              - code [ref=e137]: exec
              - text: ", and"
              - code [ref=e138]: discard
              - text: commands. These operations are available on
              - link [ref=e139] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/RedisTemplate.html
                - code [ref=e140]: RedisTemplate
              - text: . However,
              - code [ref=e141]: RedisTemplate
              - text: is not guaranteed to run all the operations in the transaction with the same connection.
            - paragraph [ref=e143]:
              - text: Spring Data Redis provides the
              - link [ref=e144] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/SessionCallback.html
                - code [ref=e145]: SessionCallback
              - text: interface for use when multiple operations need to be performed with the same
              - code [ref=e146]: connection
              - text: ", such as when using Redis transactions.The following example uses the"
              - code [ref=e147]: multi
              - text: "method:"
            - generic [ref=e150]:
              - code [ref=e151]:
                - text: "java //execute a transaction List<Object> txResults = redisOperations.execute(new SessionCallback<List<Object>>() {"
                - generic [ref=e152]: public List<Object> execute(RedisOperations operations) throws DataAccessException
                - text: "{ operations.multi(); operations.opsForSet().add(\"key\", \"value1\"); // This will contain the results of all operations in the transaction return operations.exec(); } }); System.out.println(\"Number of items added to set: \" + txResults.get(0));"
