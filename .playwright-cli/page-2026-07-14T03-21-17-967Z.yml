            - paragraph [ref=e157]:
              - code [ref=e158]: RedisTemplate
              - text: uses its value, hash key, and hash value serializers to deserialize all results of
              - code [ref=e159]: exec
              - text: before returning. There is an additional
              - code [ref=e160]: exec
              - text: method that lets you pass a custom serializer for transaction results.
            - paragraph [ref=e162]:
              - text: It is worth mentioning that in case between
              - code [ref=e163]: multi()
              - text: and
              - code [ref=e164]: exec()
              - text: "an exception happens (e.g. a timeout exception in case Redis does not respond within the timeout) then the connection may get stuck in a transactional state. To prevent such a situation need have to discard the transactional state to clear the connection:"
            - generic [ref=e167]:
              - code [ref=e168]:
