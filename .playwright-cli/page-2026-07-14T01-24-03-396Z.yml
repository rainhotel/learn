          - heading "Rolling Back a Declarative Transaction" [level=1] [ref=e175]
          - paragraph [ref=e177]:
            - text: The previous section outlined the basics of how to specify transactional settings for classes, typically service layer classes, declaratively in your application. This section describes how you can control the rollback of transactions in a simple, declarative fashion in XML configuration. For details on controlling rollback semantics declaratively with the
            - code [ref=e178]: "@Transactional"
            - text: annotation, see
            - link [ref=e179] [cursor=pointer]:
              - /url: annotations.html#transaction-declarative-attransactional-settings
              - code [ref=e180]: "@Transactional"
              - text: Settings
            - text: .
          - paragraph [ref=e182]:
            - text: The recommended way to indicate to the Spring Framework’s transaction infrastructure that a transaction’s work is to be rolled back is to throw an
            - code [ref=e183]: Exception
            - text: from code that is currently executing in the context of a transaction. The Spring Framework’s transaction infrastructure code catches any unhandled
            - code [ref=e184]: Exception
            - text: as it bubbles up the call stack and makes a determination whether to mark the transaction for rollback.
          - paragraph [ref=e186]:
            - text: In its default configuration, the Spring Framework’s transaction infrastructure code marks a transaction for rollback only in the case of runtime, unchecked exceptions. That is, when the thrown exception is an instance or subclass of
            - code [ref=e187]: RuntimeException
            - text: . (
            - code [ref=e188]: Error
            - text: instances also, by default, result in a rollback).
          - paragraph [ref=e190]:
            - text: The default configuration also provides support for Vavr’s
            - code [ref=e191]: Try
            - text: method to trigger transaction rollbacks when it returns a 'Failure'. This allows you to handle functional-style errors using Try and have the transaction automatically rolled back in case of a failure. For more information on Vavr’s Try, refer to the
            - link "official Vavr documentation" [ref=e192] [cursor=pointer]:
              - /url: https://vavr-io.github.io/vavr-docs/#_try
            - text: ". Here’s an example of how to use Vavr’s Try with a transactional method:"
          - generic [ref=e194]:
            - tablist [ref=e196]:
              - tab [selected] [ref=e197] [cursor=pointer]:
                - paragraph [ref=e198]: Java
            - tabpanel "Java" [ref=e199]:
              - generic [ref=e202]:
                - code [ref=e203]:
                  - text: java @Transactional
                  - generic [ref=e204]: public Try<String> myTransactionalMethod()
                  - text: "{ // If myDataAccessOperation throws an exception, it will be caught by the // Try instance created with Try.of() and wrapped inside the Failure class // which can be checked using the isFailure() method on the Try instance. return Try.of(delegate::myDataAccessOperation); }"
                - button "Copied!" [ref=e206] [cursor=pointer]
          - paragraph [ref=e209]:
            - text: As of Spring Framework 6.1, there is also special treatment of
            - code [ref=e210]: CompletableFuture
            - text: (and general
            - code [ref=e211]: Future
            - text: ) return values, triggering a rollback for such a handle if it was exceptionally completed at the time of being returned from the original method. This is intended for
            - code [ref=e212]: "@Async"
            - text: methods where the actual method implementation may need to comply with a
            - code [ref=e213]: CompletableFuture
            - text: signature (auto-adapted to an actual asynchronous handle for a call to the proxy by
            - code [ref=e214]: "@Async"
            - text: "processing at runtime), preferring exposure in the returned handle rather than rethrowing an exception:"
          - generic [ref=e216]:
            - tablist [ref=e218]:
              - tab [selected] [ref=e219] [cursor=pointer]:
                - paragraph [ref=e220]: Java
            - tabpanel "Java" [ref=e221]:
              - generic [ref=e224]:
                - code [ref=e225]:
                  - text: java @Transactional @Async
                  - generic [ref=e226]: public CompletableFuture<String> myTransactionalMethod()
                  - text: "{ try { return CompletableFuture.completedFuture(delegate.myDataAccessOperation()); } catch (DataAccessException ex) { return CompletableFuture.failedFuture(ex); } }"
                - button "Copied!" [ref=e228] [cursor=pointer]
          - paragraph [ref=e231]:
            - text: Checked exceptions that are thrown from a transactional method do not result in a rollback in the default configuration. You can configure exactly which
            - code [ref=e232]: Exception
            - text: types mark a transaction for rollback, including checked exceptions by specifying
            - emphasis [ref=e233]: rollback rules
            - text: .
          - table [ref=e235]:
            - rowgroup [ref=e236]:
              - row [ref=e237]:
                - cell "Note" [ref=e238]
                - cell [ref=e240]:
                  - generic [ref=e241]: Rollback rules
                  - paragraph [ref=e243]: Rollback rules determine if a transaction should be rolled back when a given exception is thrown, and the rules are based on exception types or exception patterns.
                  - paragraph [ref=e245]:
                    - text: Rollback rules may be configured in XML via the
                    - code [ref=e246]: rollback-for
                    - text: and
                    - code [ref=e247]: no-rollback-for
                    - text: attributes, which allow rules to be defined as patterns. When using
                    - link [ref=e248] [cursor=pointer]:
                      - /url: annotations.html#transaction-declarative-attransactional-settings
                      - code [ref=e249]: "@Transactional"
                    - text: ", rollback rules may be configured via the"
                    - code [ref=e250]: rollbackFor
                    - text: /
                    - code [ref=e251]: noRollbackFor
                    - text: and
                    - code [ref=e252]: rollbackForClassName
                    - text: /
                    - code [ref=e253]: noRollbackForClassName
                    - text: attributes, which allow rules to be defined based on exception types or patterns, respectively.
                  - paragraph [ref=e255]:
                    - text: When a rollback rule is defined with an exception type – for example, via
                    - code [ref=e256]: rollbackFor
                    - text: – that type will be used to match against the type of a thrown exception. Specifically, given a configured exception type
                    - code [ref=e257]: C
                    - text: ", a thrown exception of type"
                    - code [ref=e258]: T
                    - text: will be considered a match against
                    - code [ref=e259]: C
                    - text: if
                    - code [ref=e260]: T
                    - text: is equal to
                    - code [ref=e261]: C
                    - text: or a subclass of
                    - code [ref=e262]: C
                    - text: . This provides type safety and avoids any unintentional matches that may occur when using a pattern. For example, a value of
                    - code [ref=e263]: jakarta.servlet.ServletException.class
                    - text: will only match thrown exceptions of type
                    - code [ref=e264]: jakarta.servlet.ServletException
                    - text: and its subclasses.
                  - paragraph [ref=e266]:
                    - text: When a rollback rule is defined with an exception pattern, the pattern can be a fully qualified class name or a substring of a fully qualified class name for an exception type (which must be a subclass of
                    - code [ref=e267]: Throwable
                    - text: ), with no wildcard support at present. For example, a value of
                    - code [ref=e268]: "\"jakarta.servlet.ServletException\""
                    - text: or
                    - code [ref=e269]: "\"ServletException\""
                    - text: will match
                    - code [ref=e270]: jakarta.servlet.ServletException
                    - text: and its subclasses.
                  - table [ref=e272]:
                    - rowgroup [ref=e273]:
                      - row [ref=e274]:
                        - cell "Warning" [ref=e275]
                        - cell [ref=e277]:
                          - paragraph [ref=e279]:
                            - text: You must carefully consider how specific a pattern is and whether to include package information (which isn’t mandatory). For example,
                            - code [ref=e280]: "\"Exception\""
                            - text: will match nearly anything and will probably hide other rules.
                            - code [ref=e281]: "\"java.lang.Exception\""
                            - text: would be correct if
                            - code [ref=e282]: "\"Exception\""
                            - text: were meant to define a rule for all checked exceptions. With more unique exception names such as
                            - code [ref=e283]: "\"BaseBusinessException\""
                            - text: there is likely no need to use the fully qualified class name for the exception pattern.
                          - paragraph [ref=e285]:
                            - text: Furthermore, pattern-based rollback rules may result in unintentional matches for similarly named exceptions and nested classes. This is due to the fact that a thrown exception is considered to be a match for a given pattern-based rollback rule if the name of the thrown exception contains the exception pattern configured for the rollback rule. For example, given a rule configured to match on
                            - code [ref=e286]: "\"com.example.CustomException\""
                            - text: ", that rule will match against an exception named"
                            - code [ref=e287]: com.example.CustomExceptionV2
                            - text: (an exception in the same package as
                            - code [ref=e288]: CustomException
                            - text: but with an additional suffix) or an exception named
                            - code [ref=e289]: com.example.CustomException$AnotherException
                            - text: (an exception declared as a nested class in
                            - code [ref=e290]: CustomException
                            - text: ).
          - paragraph [ref=e292]:
            - text: The following XML snippet demonstrates how to configure rollback for a checked, application-specific
            - code [ref=e293]: Exception
            - text: type by supplying an
            - emphasis [ref=e294]: exception pattern
            - text: via the
            - code [ref=e295]: rollback-for
            - text: "attribute:"
          - generic [ref=e298]:
            - code [ref=e299]:
              - text: xml
              - generic [ref=e300]: <tx:advice id="txAdvice" transaction-manager="txManager">
              - generic [ref=e301]: <tx:attributes>
              - generic [ref=e302]: <tx:method name="get*" read-only="true" rollback-for="NoProductInStockException"/>
              - generic [ref=e303]: <tx:method name="*"/>
              - generic [ref=e304]: </tx:attributes>
              - generic [ref=e305]: </tx:advice>
            - button "Copied!" [ref=e307] [cursor=pointer]
          - paragraph [ref=e310]:
            - text: If you do not want a transaction rolled back when an exception is thrown, you can also specify 'no rollback' rules. The following example tells the Spring Framework’s transaction infrastructure to commit the attendant transaction even in the face of an unhandled
            - code [ref=e311]: InstrumentNotFoundException
            - text: ":"
          - generic [ref=e314]:
            - code [ref=e315]:
              - text: xml
              - generic [ref=e316]: <tx:advice id="txAdvice">
              - generic [ref=e317]: <tx:attributes>
              - generic [ref=e318]: <tx:method name="updateStock" no-rollback-for="InstrumentNotFoundException"/>
              - generic [ref=e319]: <tx:method name="*"/>
              - generic [ref=e320]: </tx:attributes>
              - generic [ref=e321]: </tx:advice>
            - button "Copied!" [ref=e323] [cursor=pointer]
          - paragraph [ref=e326]:
            - text: When the Spring Framework’s transaction infrastructure catches an exception and consults the configured rollback rules to determine whether to mark the transaction for rollback, the strongest matching rule wins. So, in the case of the following configuration, any exception other than an
            - code [ref=e327]: InstrumentNotFoundException
            - text: "results in a rollback of the attendant transaction:"
          - generic [ref=e330]:
            - code [ref=e331]:
              - text: xml
              - generic [ref=e332]: <tx:advice id="txAdvice">
              - generic [ref=e333]: <tx:attributes>
              - generic [ref=e334]: <tx:method name="*" rollback-for="Throwable" no-rollback-for="InstrumentNotFoundException"/>
              - generic [ref=e335]: </tx:attributes>
              - generic [ref=e336]: </tx:advice>
            - button "Copied!" [ref=e338] [cursor=pointer]
          - paragraph [ref=e341]: "You can also indicate a required rollback programmatically. Although simple, this process is quite invasive and tightly couples your code to the Spring Framework’s transaction infrastructure. The following example shows how to programmatically indicate a required rollback:"
          - generic [ref=e343]:
            - tablist [ref=e345]:
              - tab [selected] [ref=e346] [cursor=pointer]:
                - paragraph [ref=e347]: Java
              - tab [ref=e348] [cursor=pointer]:
                - paragraph [ref=e349]: Kotlin
            - tabpanel "Java" [ref=e350]:
              - generic [ref=e353]:
                - code [ref=e354]:
                  - text: java
                  - generic [ref=e355]: public void resolvePosition()
                  - text: "{ try { // some business logic... } catch (NoProductInStockException ex) { // trigger rollback programmatically TransactionAspectSupport.currentTransactionStatus().setRollbackOnly(); } }"
                - button "Copied!" [ref=e357] [cursor=pointer]
            - text: kotlin
          - paragraph [ref=e360]: You are strongly encouraged to use the declarative approach to rollback, if at all possible. Programmatic rollback is available should you absolutely need it, but its usage flies in the face of achieving a clean POJO-based architecture.
          - navigation [ref=e361]:
