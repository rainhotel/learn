              - heading [level=2] [ref=e328]:
                - text: Usage notes
                - link "Direct link to heading" [ref=e329] [cursor=pointer]:
                  - /url: "#usage-notes"
                  - text: "#"
              - paragraph [ref=e330]:
                - strong [ref=e331]: We recommend that you do not schedule the same delivery time for a large number of messages.
              - paragraph [ref=e332]: delay messages are stored in a time-based storage system before they are delivered to consumers at the specified delivery time. If you specify the same delivery time for a large number of delay messages, the system has to simultaneously process the messages at the delivery time. This puts the system under heavy load and results in delays in message delivery.
