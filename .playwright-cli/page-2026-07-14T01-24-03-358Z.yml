          - heading "Proxying Mechanisms" [level=1] [ref=e173]
          - generic [ref=e175]:
            - paragraph [ref=e177]:
              - text: Spring AOP uses either JDK dynamic proxies or CGLIB to create the proxy for a given target object. JDK dynamic proxies are built into the JDK, whereas CGLIB is a common open-source class definition library (repackaged into
              - code [ref=e178]: spring-core
              - text: ).
            - paragraph [ref=e180]: If the target object to be proxied implements at least one interface, a JDK dynamic proxy is used, and all of the interfaces implemented by the target type are proxied. If the target object does not implement any interfaces, a CGLIB proxy is created which is a runtime-generated subclass of the target type.
            - paragraph [ref=e182]: "If you want to force the use of CGLIB proxying (for example, to proxy every method defined for the target object, not only those implemented by its interfaces), you can do so. However, you should consider the following issues:"
            - list [ref=e184]:
              - listitem [ref=e185]:
                - paragraph [ref=e186]:
                  - code [ref=e187]: final
                  - text: classes cannot be proxied, because they cannot be extended.
              - listitem [ref=e188]:
                - paragraph [ref=e189]:
                  - code [ref=e190]: final
                  - text: methods cannot be advised, because they cannot be overridden.
              - listitem [ref=e191]:
                - paragraph [ref=e192]:
                  - code [ref=e193]: private
                  - text: methods cannot be advised, because they cannot be overridden.
              - listitem [ref=e194]:
                - paragraph [ref=e195]: Methods that are not visible – for example, package-private methods in a parent class from a different package – cannot be advised because they are effectively private.
              - listitem [ref=e196]:
                - paragraph [ref=e197]: The constructor of your proxied object will not be called twice, since the CGLIB proxy instance is created through Objenesis. However, if your JVM does not allow for constructor bypassing, you might see double invocations and corresponding debug log entries from Spring’s AOP support.
              - listitem [ref=e198]:
                - paragraph [ref=e199]:
                  - text: Your CGLIB proxy usage may face limitations with the Java Module System. As a typical case, you cannot create a CGLIB proxy for a class from the
                  - code [ref=e200]: java.lang
                  - text: package when deploying on the module path. Such cases require a JVM bootstrap flag
                  - code [ref=e201]: "--add-opens=java.base/java.lang=ALL-UNNAMED"
                  - text: which is not available for modules.
          - generic [ref=e202]:
            - heading "Forcing Specific AOP Proxy Types" [level=2] [ref=e203]
            - generic [ref=e204]:
              - paragraph [ref=e206]:
                - text: To force the use of CGLIB proxies, set the value of the
                - code [ref=e207]: proxy-target-class
                - text: attribute of the
                - code [ref=e208]: <aop:config>
                - text: "element to true, as follows:"
              - generic [ref=e211]:
                - code [ref=e212]:
                  - text: xml
                  - generic [ref=e213]: <aop:config proxy-target-class="true">
                  - text: <!-- other beans defined here... -->
                  - generic [ref=e214]: </aop:config>
                - button "Copied!" [ref=e216] [cursor=pointer]
              - paragraph [ref=e219]:
                - text: To force CGLIB proxying when you use the @AspectJ auto-proxy support, set the
                - code [ref=e220]: proxy-target-class
                - text: attribute of the
                - code [ref=e221]: <aop:aspectj-autoproxy>
                - text: element to
                - code [ref=e222]: "true"
                - text: ", as follows:"
              - generic [ref=e225]:
                - code [ref=e226]:
                  - text: xml
                  - generic [ref=e227]: <aop:aspectj-autoproxy proxy-target-class="true"/>
                - button "Copied!" [ref=e229] [cursor=pointer]
              - table [ref=e232]:
                - rowgroup [ref=e233]:
                  - row [ref=e234]:
                    - cell "Note" [ref=e235]
                    - cell [ref=e237]:
                      - paragraph [ref=e239]:
                        - text: Multiple
                        - code [ref=e240]: <aop:config/>
                        - text: sections are collapsed into a single unified auto-proxy creator at runtime, which applies the
                        - emphasis [ref=e241]: strongest
                        - text: proxy settings that any of the
                        - code [ref=e242]: <aop:config/>
                        - text: sections (typically from different XML bean definition files) specified. This also applies to the
                        - code [ref=e243]: <tx:annotation-driven/>
                        - text: and
                        - code [ref=e244]: <aop:aspectj-autoproxy/>
                        - text: elements.
                      - paragraph [ref=e246]:
                        - text: To be clear, using
                        - code [ref=e247]: proxy-target-class="true"
                        - text: "on"
                        - code [ref=e248]: <tx:annotation-driven/>
                        - text: ","
                        - code [ref=e249]: <aop:aspectj-autoproxy/>
                        - text: ", or"
                        - code [ref=e250]: <aop:config/>
                        - text: elements forces the use of CGLIB proxies
                        - emphasis [ref=e251]: for all three of them
                        - text: .
              - paragraph [ref=e253]:
                - code [ref=e254]: "@EnableAspectJAutoProxy"
                - text: ","
                - code [ref=e255]: "@EnableTransactionManagement"
                - text: and related configuration annotations offer a corresponding
                - code [ref=e256]: proxyTargetClass
                - text: attribute. These are collapsed into a single unified auto-proxy creator too, effectively applying the
                - emphasis [ref=e257]: strongest
                - text: proxy settings at runtime. As of 7.0, this applies to individual proxy processors as well, for example
                - code [ref=e258]: "@EnableAsync"
                - text: ", consistently participating in unified global default settings for all auto-proxying attempts in a given application."
              - paragraph [ref=e260]: The global default proxy type may differ between setups. While the core framework suggests interface-based proxies by default, Spring Boot may - depending on configuration properties - enable class-based proxies by default.
              - paragraph [ref=e262]:
                - text: As of 7.0, forcing a specific proxy type for individual beans is possible through the
                - code [ref=e263]: "@Proxyable"
                - text: annotation on a given
                - code [ref=e264]: "@Bean"
                - text: method or
                - code [ref=e265]: "@Component"
                - text: class, with
                - code [ref=e266]: "@Proxyable(INTERFACES)"
                - text: or
                - code [ref=e267]: "@Proxyable(TARGET_CLASS)"
                - text: overriding any globally configured default. For very specific purposes, you may even specify the proxy interface(s) to use through
                - code [ref=e268]: "@Proxyable(interfaces=…)"
                - text: ", limiting the exposure to selected interfaces rather than all interfaces that the target bean implements."
          - generic [ref=e269]:
            - heading "Understanding AOP Proxies" [level=2] [ref=e270]
            - generic [ref=e271]:
              - paragraph [ref=e273]: Spring AOP is proxy-based. It is vitally important that you grasp the semantics of what that last statement actually means before you write your own aspects or use any of the Spring AOP-based aspects supplied with the Spring Framework.
              - paragraph [ref=e275]: "Consider first the scenario where you have a plain-vanilla, un-proxied object reference, as the following code snippet shows:"
              - generic [ref=e277]:
                - tablist [ref=e279]:
                  - tab [selected] [ref=e280] [cursor=pointer]:
                    - paragraph [ref=e281]: Java
                  - tab [ref=e282] [cursor=pointer]:
                    - paragraph [ref=e283]: Kotlin
                - tabpanel "Java" [ref=e284]:
                  - generic [ref=e287]:
                    - code [ref=e288]:
                      - text: java public
                      - generic [ref=e289]: class SimplePojo implements Pojo
                      - text: "{"
                      - generic [ref=e290]: public void foo()
                      - text: "{ // this next method invocation is a direct call on the 'this' reference this.bar(); }"
                      - generic [ref=e291]: public void bar()
                      - text: "{ // some logic... } }"
                    - button "Copied!" [ref=e293] [cursor=pointer]
                - text: kotlin
              - paragraph [ref=e296]: "If you invoke a method on an object reference, the method is invoked directly on that object reference, as the following image and listing show:"
              - img "aop proxy plain pojo call" [ref=e299]
              - generic [ref=e301]:
                - tablist [ref=e303]:
                  - tab [selected] [ref=e304] [cursor=pointer]:
                    - paragraph [ref=e305]: Java
                  - tab [ref=e306] [cursor=pointer]:
                    - paragraph [ref=e307]: Kotlin
                - tabpanel "Java" [ref=e308]:
                  - generic [ref=e311]:
                    - code [ref=e312]:
                      - text: java public
                      - generic [ref=e313]: class Main
                      - text: "{"
                      - generic [ref=e314]: public static void main(String[] args)
                      - text: "{ Pojo pojo = new SimplePojo(); // this is a direct method call on the 'pojo' reference pojo.foo(); } }"
                    - button "Copied!" [ref=e316] [cursor=pointer]
                - text: kotlin
              - paragraph [ref=e319]: "Things change slightly when the reference that client code has is a proxy. Consider the following diagram and code snippet:"
              - img "aop proxy call" [ref=e322]
              - generic [ref=e324]:
                - tablist [ref=e326]:
                  - tab [selected] [ref=e327] [cursor=pointer]:
                    - paragraph [ref=e328]: Java
                  - tab [ref=e329] [cursor=pointer]:
                    - paragraph [ref=e330]: Kotlin
                - tabpanel "Java" [ref=e331]:
                  - generic [ref=e334]:
                    - code [ref=e335]:
                      - text: java public
                      - generic [ref=e336]: class Main
                      - text: "{"
                      - generic [ref=e337]: public static void main(String[] args)
                      - text: "{ ProxyFactory factory = new ProxyFactory(new SimplePojo()); factory.addInterface(Pojo"
                      - generic [ref=e338]: .class)
                      - text: "; factory.addAdvice(new RetryAdvice()); Pojo pojo = (Pojo) factory.getProxy(); // this is a method call on the proxy! pojo.foo(); } }"
                    - button "Copied!" [ref=e340] [cursor=pointer]
                - text: kotlin
              - paragraph [ref=e343]:
                - text: The key thing to understand here is that the client code inside the
                - code [ref=e344]: main(..)
                - text: method of the
                - code [ref=e345]: Main
                - text: class has a reference to the proxy. This means that method calls on that object reference are calls on the proxy. As a result, the proxy can delegate to all of the interceptors (advice) that are relevant to that particular method call. However, once the call has finally reached the target object (the
                - code [ref=e346]: SimplePojo
                - text: reference in this case), any method calls that it may make on itself, such as
                - code [ref=e347]: this.bar()
                - text: or
                - code [ref=e348]: this.foo()
                - text: ", are going to be invoked against the"
                - code [ref=e349]: this
                - text: reference, and not the proxy. This has important implications. It means that self invocation is not going to result in the advice associated with a method invocation getting a chance to run. In other words, self invocation via an explicit or implicit
                - code [ref=e350]: this
                - text: reference will bypass the advice.
              - paragraph [ref=e352]: To address that, you have the following options.
              - generic [ref=e354]:
                - term [ref=e355]: Avoid self invocation
                - definition [ref=e356]:
                  - paragraph [ref=e357]: The best approach (the term "best" is used loosely here) is to refactor your code such that the self invocation does not happen. This does entail some work on your part, but it is the best, least-invasive approach.
                - term [ref=e358]: Inject a self reference
                - definition [ref=e359]:
                  - paragraph [ref=e360]:
                    - text: An alternative approach is to make use of
                    - link "self injection" [ref=e361] [cursor=pointer]:
                      - /url: ../beans/annotation-config/autowired.html#beans-autowired-annotation-self-injection
                    - text: ", and invoke methods on the proxy via the self reference instead of via"
                    - code [ref=e362]: this
                    - text: .
                - term [ref=e363]:
                  - text: Use
                  - code [ref=e364]: AopContext.currentProxy()
                - definition [ref=e365]:
                  - paragraph [ref=e366]: This last approach is highly discouraged, and we hesitate to point it out, in favor of the previous options. However, as a last resort you can choose to tie the logic within your class to Spring AOP, as the following example shows.
              - generic [ref=e368]:
                - tablist [ref=e370]:
                  - tab [selected] [ref=e371] [cursor=pointer]:
                    - paragraph [ref=e372]: Java
                  - tab [ref=e373] [cursor=pointer]:
                    - paragraph [ref=e374]: Kotlin
                - tabpanel "Java" [ref=e375]:
                  - generic [ref=e378]:
                    - code [ref=e379]:
                      - text: java public
                      - generic [ref=e380]: class SimplePojo implements Pojo
                      - text: "{"
                      - generic [ref=e381]: public void foo()
                      - text: "{ // This works, but it should be avoided if possible. ((Pojo) AopContext.currentProxy()).bar(); }"
                      - generic [ref=e382]: public void bar()
                      - text: "{ // some logic... } }"
                    - button "Copied!" [ref=e384] [cursor=pointer]
                - text: kotlin
              - paragraph [ref=e387]:
                - text: The use of
                - code [ref=e388]: AopContext.currentProxy()
                - text: totally couples your code to Spring AOP, and it makes the class itself aware of the fact that it is being used in an AOP context, which reduces some of the benefits of AOP. It also requires that the
                - code [ref=e389]: ProxyFactory
                - text: "is configured to expose the proxy, as the following example shows:"
              - generic [ref=e391]:
                - tablist [ref=e393]:
                  - tab [selected] [ref=e394] [cursor=pointer]:
                    - paragraph [ref=e395]: Java
                  - tab [ref=e396] [cursor=pointer]:
                    - paragraph [ref=e397]: Kotlin
                - tabpanel "Java" [ref=e398]:
                  - generic [ref=e401]:
                    - code [ref=e402]:
                      - text: java public
                      - generic [ref=e403]: class Main
                      - text: "{"
                      - generic [ref=e404]: public static void main(String[] args)
                      - text: "{ ProxyFactory factory = new ProxyFactory(new SimplePojo()); factory.addInterface(Pojo"
                      - generic [ref=e405]: .class)
                      - text: "; factory.addAdvice(new RetryAdvice()); factory.setExposeProxy(true); Pojo pojo = (Pojo) factory.getProxy(); // this is a method call on the proxy! pojo.foo(); } }"
                    - button "Copied!" [ref=e407] [cursor=pointer]
                - text: kotlin
              - table [ref=e410]:
                - rowgroup [ref=e411]:
                  - row [ref=e412]:
                    - cell "Note" [ref=e413]
                    - cell "AspectJ compile-time weaving and load-time weaving do not have this self-invocation issue because they apply advice within the bytecode instead of via a proxy." [ref=e415]
