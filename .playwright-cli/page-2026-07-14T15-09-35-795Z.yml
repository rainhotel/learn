        - generic [ref=e164]:
          - heading "Baggage" [level=1] [ref=e165]
          - generic [ref=e166]: Contextual information that is passed between signals.
          - paragraph [ref=e167]:
            - text: In OpenTelemetry, Baggage is contextual information that resides next to context. Baggage is a key-value store, which means it lets you
            - link "propagate" [ref=e168] [cursor=pointer]:
              - /url: ../../context-propagation/#propagation
            - text: any data you like alongside
            - link "context" [ref=e169] [cursor=pointer]:
              - /url: ../../context-propagation/#context
            - text: .
          - paragraph [ref=e170]:
            - text: Baggage means you can pass data across services and processes, making it available to add to
            - link "traces" [ref=e171] [cursor=pointer]:
              - /url: ../traces/
            - text: ","
            - link "metrics" [ref=e172] [cursor=pointer]:
              - /url: ../metrics/
            - text: ", or"
            - link "logs" [ref=e173] [cursor=pointer]:
              - /url: ../logs/
            - text: in those services.
          - heading "Example" [level=2] [ref=e174]
          - paragraph [ref=e175]: Baggage is often used in tracing to propagate additional data across services.
          - paragraph [ref=e176]:
            - text: For example, imagine you have a
            - code [ref=e177]: clientId
            - text: at the start of a request, but you’d like for that ID to be available on all spans in a trace, some metrics in another service, and some logs along the way. Because the trace may span multiple services, you need some way to propagate that data without copying the
            - code [ref=e178]: clientId
            - text: across many places in your codebase.
          - paragraph [ref=e179]:
            - text: By using
            - link "Context Propagation" [ref=e180] [cursor=pointer]:
              - /url: ../traces/#context-propagation
            - text: to pass baggage across these services, the
            - code [ref=e181]: clientId
            - text: is available to add to any additional spans, metrics, or logs. Additionally, instrumentations automatically propagate baggage for you.
          - button "OTel Baggage" [ref=e182]
          - heading "What should OTel Baggage be used for?" [level=2] [ref=e183]
          - paragraph [ref=e184]: Baggage is best used to include information typically available only at the start of a request further downstream. This can include things like Account Identification, User IDs, Product IDs, and origin IPs, for example.
          - paragraph [ref=e185]: Propagating this information using baggage allows for deeper analysis of telemetry in a backend. For example, if you include information like a User ID on a span that tracks a database call, you can much more easily answer questions like “which users are experiencing the slowest database calls?” You can also log information about a downstream operation and include that same User ID in the log data.
          - button "OTel Baggage" [ref=e186]
          - heading "Baggage security considerations" [level=2] [ref=e187]
          - paragraph [ref=e188]: Sensitive Baggage items can be shared with unintended resources, like third-party APIs. This is because automatic instrumentation includes Baggage in most of your service’s network requests. Specifically, Baggage and other parts of trace context are sent in HTTP headers, making it visible to anyone inspecting your network traffic. If traffic is restricted within your network, then this risk may not apply, but keep in mind that downstream services could propagate Baggage outside your network.
          - paragraph [ref=e189]: Also, there are no built-in integrity checks to ensure that Baggage items are yours, so exercise caution when reading them.
          - heading "Baggage is not the same as attributes" [level=2] [ref=e190]
          - paragraph [ref=e191]: An important thing to note about baggage is that it is a separate key-value store and is unassociated with attributes on spans, metrics, or logs without explicitly adding them.
          - paragraph [ref=e192]: To add baggage entries to attributes, you need to explicitly read the data from baggage and add it as attributes to your spans, metrics, or logs.
          - paragraph [ref=e193]:
            - text: Because a common use cases for Baggage is to add data to
            - link "Span Attributes" [ref=e194] [cursor=pointer]:
              - /url: ../traces/#attributes
            - text: across a whole trace, several languages have Baggage Span Processors that add data from baggage as attributes on span creation.
          - blockquote [ref=e195]:
            - paragraph [ref=e196]:
              - text: For more information, see the
              - link "baggage specification" [ref=e197] [cursor=pointer]:
                - /url: /docs/specs/otel/overview/#baggage-signal
              - text: .
