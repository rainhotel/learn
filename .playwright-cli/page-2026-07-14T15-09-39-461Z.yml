          - heading "Gauges" [level=1] [ref=e128]
          - generic [ref=e130]:
            - paragraph [ref=e132]: A gauge is a handle to get the current value. Typical examples for gauges would be the size of a collection or map or the number of threads in a running state.
            - table [ref=e134]:
              - rowgroup [ref=e135]:
                - row [ref=e136]:
                  - cell "Tip" [ref=e137]
                  - cell "Gauges are useful for monitoring things with natural upper bounds. We do not recommend using a gauge to monitor things like request count, as they can grow without bound for the duration of an application instance’s life." [ref=e139]
            - table [ref=e141]:
              - rowgroup [ref=e142]:
                - row [ref=e143]:
                  - cell "Tip" [ref=e144]
                  - cell [ref=e146]:
                    - text: Never gauge something you can count with a
                    - code [ref=e147]: Counter
                    - text: "!"
            - paragraph [ref=e149]: Micrometer takes the stance that gauges should be sampled and not be set, so there is no information about what might have occurred between samples. Any intermediate values set on a gauge are lost by the time the gauge value is reported to a metrics backend, so there is little value in setting those intermediate values in the first place.
            - paragraph [ref=e151]:
              - text: Think of a
              - code [ref=e152]: Gauge
              - text: "as a “heisen-gauge”: a meter that changes only when it is observed. Every other meter type accumulates intermediate counts toward the point where the data is sent to the metrics backend."
            - paragraph [ref=e154]:
              - text: The
              - code [ref=e155]: MeterRegistry
              - text: "interface contains methods for building gauges to observe numeric values, functions, collections, and maps:"
            - generic [ref=e158]:
              - code [ref=e159]:
                - text: java List<String> list = registry.gauge("listGauge", Collections.emptyList(), new ArrayList<>(), List::size);
                - generic [ref=e160]: "1"
                - text: List<String> list2 = registry.gaugeCollectionSize("listSize2", Tags.empty(), new ArrayList<>());
                - generic [ref=e161]: "2"
                - text: Map<String, Integer> map = registry.gaugeMapSize("mapGauge", Tags.empty(), new HashMap<>());
              - button "Copied!" [ref=e163] [cursor=pointer]
            - table [ref=e166]:
              - rowgroup [ref=e167]:
                - row [ref=e168]:
                  - cell "1" [ref=e169]
                  - cell "A slightly more common form of gauge is one that monitors some non-numeric object. The last argument establishes the function that is used to determine the value of the gauge when the gauge is observed." [ref=e171]
                - row [ref=e172]:
                  - cell "2" [ref=e173]
                  - cell "A more convenient form of (1) for when you want to monitor collection size." [ref=e175]
            - paragraph [ref=e177]:
              - text: All of the different forms of creating a gauge maintain only a
              - emphasis [ref=e178]: weak reference
              - text: to the object being observed, so as not to prevent garbage collection of the object.
          - generic [ref=e179]:
            - heading "Manually Incrementing or Decrementing a Gauge" [level=2] [ref=e180]
            - generic [ref=e181]:
              - paragraph [ref=e183]:
                - text: A gauge can be made to track any
                - code [ref=e184]: java.lang.Number
                - text: subtype that is settable, such as
                - code [ref=e185]: AtomicInteger
                - text: and
                - code [ref=e186]: AtomicLong
                - text: found in
                - code [ref=e187]: java.util.concurrent.atomic
                - text: and similar types, such as Guava’s
                - code [ref=e188]: AtomicDouble
                - text: ":"
              - generic [ref=e191]:
                - code [ref=e192]: java // maintain a reference to myGauge AtomicInteger myGauge = registry.gauge("numberGauge", new AtomicInteger(0)); // ... elsewhere you can update the value it holds using the object reference myGauge.set(27); myGauge.set(11);
                - button "Copied!" [ref=e194] [cursor=pointer]
              - paragraph [ref=e197]:
                - text: Note that, in this form, unlike other meter types, you do not get a reference to the
                - code [ref=e198]: Gauge
                - text: "when creating one. Rather, you get a reference to the thing being observed. This is because of the “heisen-gauge” principal: The gauge is self-sufficient once created, so you should never need to interact with it. This lets us give you back only the instrumented object, which allows for quick one-liners that both create the object to be observed and set up metrics around it."
              - paragraph [ref=e200]:
                - text: This pattern should be less common than the
                - code [ref=e201]: DoubleFunction
                - text: form. Remember that frequent setting of the observed
                - code [ref=e202]: Number
                - text: results in a lot of intermediate values that never get published. Only the
                - emphasis [ref=e203]: instantaneous value
                - text: of the gauge at publish time is ever sent to the monitoring system.
              - table [ref=e205]:
                - rowgroup [ref=e206]:
                  - row [ref=e207]:
                    - cell "Warning" [ref=e208]
                    - cell [ref=e210]:
                      - text: Attempting to construct a gauge with a primitive number or one of its
                      - code [ref=e211]: java.lang
                      - text: object forms is always incorrect. These numbers are immutable. Thus, the gauge cannot ever be changed. Attempting to "re-register" the gauge with a different number does not work, as the registry maintains only one meter for each unique combination of name and tags. "Re-registering" a gauge can happen indirectly for example as the result of a
                      - code [ref=e212]: MeterFilter
                      - text: modifying the name and/or the tags of two different gauges so that they will be the same after the filter is applied.
              - paragraph [ref=e214]: "Attempting to \"re-register\" a gauge will result in a warning like this:"
              - generic [ref=e217]:
                - code [ref=e218]: "WARNING: This Gauge has been already registered (MeterId{name='my.gauge', tags=[]}), the registration will be ignored. Note that subsequent logs will be logged at debug level."
                - button "Copied!" [ref=e220] [cursor=pointer]
          - generic [ref=e222]:
            - heading "Gauge Fluent Builder" [level=2] [ref=e223]
            - generic [ref=e224]:
              - paragraph [ref=e226]: "The interface contains a fluent builder for gauges:"
              - generic [ref=e229]:
                - code [ref=e230]: java Gauge gauge = Gauge .builder("gauge", myObj, myObj::gaugeValue) .description("a description of what this gauge does") // optional .tags("region", "test") // optional .register(registry);
                - button "Copied!" [ref=e232] [cursor=pointer]
              - paragraph [ref=e235]:
                - text: Generally the returned
                - code [ref=e236]: Gauge
                - text: instance is not useful except in testing, as the gauge is already set up to track a value automatically upon registration.
          - generic [ref=e237]:
            - heading "Why is My Gauge Reporting NaN or Disappearing?" [level=2] [ref=e238]
            - generic [ref=e239]:
              - paragraph [ref=e241]:
                - text: It is your responsibility to hold a strong reference to the state object that you are measuring with a
                - code [ref=e242]: Gauge
                - text: . Micrometer is careful to not create strong references to objects that would otherwise be garbage collected. Once the object being gauged is de-referenced and is garbage collected, Micrometer starts reporting a NaN or nothing for a gauge, depending on the registry implementation.
              - paragraph [ref=e244]: If you see your gauge reporting for a few minutes and then disappearing or reporting NaN, it almost certainly suggests that the underlying object being gauged has been garbage collected.
          - generic [ref=e245]:
            - heading [level=2] [ref=e246]:
              - code [ref=e247]: TimeGauge
            - generic [ref=e248]:
              - paragraph [ref=e250]:
                - code [ref=e251]: TimeGauge
                - text: is a specialized gauge that tracks a time value, to be scaled to the base unit of time expected by each registry implementation.
              - paragraph [ref=e253]:
                - code [ref=e254]: TimeGauge
                - text: can be registered with
                - code [ref=e255]: TimeUnit
                - text: "as follows:"
              - generic [ref=e258]:
                - code [ref=e259]: java AtomicInteger msTimeGauge = new AtomicInteger(4000); AtomicInteger usTimeGauge = new AtomicInteger(4000); TimeGauge.builder("my.gauge", msTimeGauge, TimeUnit.MILLISECONDS, AtomicInteger::get).register(registry); TimeGauge.builder("my.other.gauge", usTimeGauge, TimeUnit.MICROSECONDS, AtomicInteger::get).register(registry);
                - button "Copied!" [ref=e261] [cursor=pointer]
              - paragraph [ref=e264]: "And for example, if the registry is Prometheus, they will be converted in seconds as follows:"
              - generic [ref=e267]:
                - code [ref=e268]: "# HELP my_gauge_seconds # TYPE my_gauge_seconds gauge my_gauge_seconds 4.0 # HELP my_other_gauge_seconds # TYPE my_other_gauge_seconds gauge my_other_gauge_seconds 0.004"
                - button "Copied!" [ref=e270] [cursor=pointer]
          - generic [ref=e272]:
            - heading "Multi-gauge" [level=2] [ref=e273]
            - generic [ref=e274]:
              - paragraph [ref=e276]:
                - text: Micrometer supports one last special type of
                - code [ref=e277]: Gauge
                - text: ", called a"
                - code [ref=e278]: MultiGauge
                - text: ", to help manage gauging a growing or shrinking list of criteria. This feature lets you select a set of well-bounded but slightly changing set of criteria from something like an SQL query and report each"
                - code [ref=e279]: Row
                - text: (see the example below) as a
                - code [ref=e280]: Gauge
                - text: . The following example creates a
                - code [ref=e281]: MultiGauge
                - text: ":"
              - generic [ref=e284]:
                - code [ref=e285]: java // SELECT count(*) from job group by status WHERE job = 'dirty' MultiGauge statuses = MultiGauge.builder("statuses") .tag("job", "dirty") .description("The number of widgets in various statuses") .baseUnit("widgets") .register(registry); ... // run this whenever you re-run your query statuses.register( resultSet.stream() .map(result -> Row.of(Tags.of("status", result.getAsString("status")), result.getAsInt("count"))) .collect(toList()), true // whether to overwrite the previous value or only record it once );
                - button "Copied!" [ref=e287] [cursor=pointer]
              - paragraph [ref=e290]:
                - text: The
                - code [ref=e291]: overwrite
                - text: argument controls how rows with the same set of tags are handled on subsequent registrations. Use
                - code [ref=e292]: overwrite=true
                - text: when each registration represents a new snapshot and previously registered rows should be replaced with the latest values. Use
                - code [ref=e293]: overwrite=false
                - text: when existing rows should remain unchanged on later registrations with the same tags. Rows that are no longer present in the new registration are removed.
