          - heading "Transactions" [level=1] [ref=e186]
          - paragraph [ref=e190]: This section describes how Spring for Apache Kafka supports transactions.
          - generic [ref=e191]:
            - heading "Overview" [level=2] [ref=e192]
            - generic [ref=e193]:
              - paragraph [ref=e195]: "The 0.11.0.0 client library added support for transactions. Spring for Apache Kafka adds support in the following ways:"
              - list [ref=e197]:
                - listitem [ref=e198]:
                  - paragraph [ref=e199]:
                    - code [ref=e200]: KafkaTransactionManager
                    - text: ": Used with normal Spring transaction support ("
                    - code [ref=e201]: "@Transactional"
                    - text: ","
                    - code [ref=e202]: TransactionTemplate
                    - text: ", etc.)"
                - listitem [ref=e203]:
                  - paragraph [ref=e204]:
                    - text: Transactional
                    - code [ref=e205]: KafkaMessageListenerContainer
                - listitem [ref=e206]:
                  - paragraph [ref=e207]:
                    - text: Local transactions with
                    - code [ref=e208]: KafkaTemplate
                - listitem [ref=e209]:
                  - paragraph [ref=e210]: Transaction synchronization with other transaction managers
              - paragraph [ref=e212]:
                - text: Transactions are enabled by providing the
                - code [ref=e213]: DefaultKafkaProducerFactory
                - text: with a
                - code [ref=e214]: transactionIdPrefix
                - text: . In that case, instead of managing a single shared
                - code [ref=e215]: Producer
                - text: ", the factory maintains a cache of transactional producers. When the user calls"
                - code [ref=e216]: close()
                - text: on a producer, it is returned to the cache for reuse instead of actually being closed. The
                - code [ref=e217]: transactional.id
                - text: property of each producer is
                - code [ref=e218]: transactionIdPrefix
                - text: +
                - code [ref=e219]: "n"
                - text: ", where"
                - code [ref=e220]: "n"
                - text: starts with
                - code [ref=e221]: "0"
                - text: and is incremented for each new producer. In previous versions of Spring for Apache Kafka, the
                - code [ref=e222]: transactional.id
                - text: was generated differently for transactions started by a listener container with a record-based listener, to support fencing zombies, which is not necessary anymore, with
                - code [ref=e223]: EOSMode.V2
                - text: being the only option starting with 3.0. For applications running with multiple instances, the
                - code [ref=e224]: transactionIdPrefix
                - text: must be unique per instance.
              - paragraph [ref=e226]:
                - text: Also see
                - link "Exactly Once Semantics" [ref=e227] [cursor=pointer]:
                  - /url: exactly-once.html
                - text: .
              - paragraph [ref=e229]:
                - text: Also see
                - link [ref=e230] [cursor=pointer]:
                  - /url: "#transaction-id-prefix"
                  - code [ref=e231]: transactionIdPrefix
                - text: .
              - paragraph [ref=e233]:
                - text: With Spring Boot, it is only necessary to set the
                - code [ref=e234]: spring.kafka.producer.transaction-id-prefix
                - text: property - Spring Boot will automatically configure a
                - code [ref=e235]: KafkaTransactionManager
                - text: bean and wire it into the listener container.
              - table [ref=e237]:
                - rowgroup [ref=e238]:
                  - row [ref=e239]:
                    - cell "Important" [ref=e240]
                    - cell [ref=e242]:
                      - text: Starting with version 2.5.8, you can now configure the
                      - code [ref=e243]: maxAge
                      - text: property on the producer factory. This is useful when using transactional producers that might lay idle for the broker’s
                      - code [ref=e244]: transactional.id.expiration.ms
                      - text: . With current
                      - code [ref=e245]: kafka-clients
                      - text: ", this can cause a"
                      - code [ref=e246]: ProducerFencedException
                      - text: without a rebalance. By setting the
                      - code [ref=e247]: maxAge
                      - text: to less than
                      - code [ref=e248]: transactional.id.expiration.ms
                      - text: ", the factory will refresh the producer if it is past its max age."
          - generic [ref=e249]:
            - heading [level=2] [ref=e250]:
              - text: Using
              - code [ref=e251]: KafkaTransactionManager
            - generic [ref=e252]:
              - paragraph [ref=e254]:
                - text: The
                - code [ref=e255]: KafkaTransactionManager
                - text: is an implementation of Spring Framework’s
                - code [ref=e256]: PlatformTransactionManager
                - text: . It is provided with a reference to the producer factory in its constructor. If you provide a custom producer factory, it must support transactions. See
                - code [ref=e257]: ProducerFactory.transactionCapable()
                - text: .
              - paragraph [ref=e259]:
                - text: You can use the
                - code [ref=e260]: KafkaTransactionManager
                - text: with normal Spring transaction support (
                - code [ref=e261]: "@Transactional"
                - text: ","
                - code [ref=e262]: TransactionTemplate
                - text: ", and others). If a transaction is active, any"
                - code [ref=e263]: KafkaTemplate
                - text: operations performed within the scope of the transaction use the transaction’s
                - code [ref=e264]: Producer
                - text: . The manager commits or rolls back the transaction, depending on success or failure. You must configure the
                - code [ref=e265]: KafkaTemplate
                - text: to use the same
                - code [ref=e266]: ProducerFactory
                - text: as the transaction manager.
          - generic [ref=e267]:
            - heading "Transaction Synchronization" [level=2] [ref=e268]
            - generic [ref=e269]:
              - paragraph [ref=e271]:
                - text: This section refers to producer-only transactions (those not started by a listener container); see
                - link "Using Consumer-Initiated Transactions" [ref=e272] [cursor=pointer]:
                  - /url: "#container-transaction-manager"
                - text: for information about chaining transactions when the container starts the transaction.
              - paragraph [ref=e274]:
                - text: If you want to send records to kafka and perform some database updates, you can use normal Spring transaction management with, say, a
                - code [ref=e275]: DataSourceTransactionManager
                - text: .
              - generic [ref=e278]:
                - code [ref=e279]:
                  - text: java @Transactional
                  - generic [ref=e280]: public void process(List<Thing> things)
                  - text: "{ things.forEach(thing -> this.kafkaTemplate.send(\"topic\", thing)); updateDb(things); }"
                - button "Copied!" [ref=e282] [cursor=pointer]
              - paragraph [ref=e285]:
                - text: The interceptor for the
                - code [ref=e286]: "@Transactional"
                - text: annotation starts the transaction and the
                - code [ref=e287]: KafkaTemplate
                - text: will synchronize a transaction with that transaction manager; each send will participate in that transaction. When the method exits, the database transaction will commit followed by the Kafka transaction. If you wish the commits to be performed in the reverse order (Kafka first), use nested
                - code [ref=e288]: "@Transactional"
                - text: methods, with the outer method configured to use the
                - code [ref=e289]: DataSourceTransactionManager
                - text: ", and the inner method configured to use the"
                - code [ref=e290]: KafkaTransactionManager
                - text: .
              - paragraph [ref=e292]:
                - text: See
                - link "Examples of Kafka Transactions with Other Transaction Managers" [ref=e293] [cursor=pointer]:
                  - /url: ../tips.html#ex-jdbc-sync
                - text: for examples of an application that synchronizes JDBC and Kafka transactions in Kafka-first or DB-first configurations.
              - table [ref=e295]:
                - rowgroup [ref=e296]:
                  - row [ref=e297]:
                    - cell "Note" [ref=e298]
                    - cell "Starting with versions 2.5.17, 2.6.12, 2.7.9 and 2.8.0, if the commit fails on the synchronized transaction (after the primary transaction has committed), the exception will be thrown to the caller. Previously, this was silently ignored (logged at debug level). Applications should take remedial action, if necessary, to compensate for the committed primary transaction." [ref=e300]
          - generic [ref=e301]:
            - heading "Using Consumer-Initiated Transactions" [level=2] [ref=e302]
            - generic [ref=e303]:
              - paragraph [ref=e305]:
                - text: The
                - code [ref=e306]: ChainedKafkaTransactionManager
                - text: is now deprecated, since version 2.7; see the JavaDocs for its super class
                - code [ref=e307]: ChainedTransactionManager
                - text: for more information. Instead, use a
                - code [ref=e308]: KafkaTransactionManager
                - text: in the container to start the Kafka transaction and annotate the listener method with
                - code [ref=e309]: "@Transactional"
                - text: to start the other transaction.
              - paragraph [ref=e311]:
                - text: See
                - link "Examples of Kafka Transactions with Other Transaction Managers" [ref=e312] [cursor=pointer]:
                  - /url: ../tips.html#ex-jdbc-sync
                - text: for an example application that chains JDBC and Kafka transactions.
              - table [ref=e314]:
                - rowgroup [ref=e315]:
                  - row [ref=e316]:
                    - cell "Important" [ref=e317]
                    - cell [ref=e319]:
                      - link "Non-Blocking Retries" [ref=e320] [cursor=pointer]:
                        - /url: ../retrytopic.html
                      - text: cannot combine with
                      - link "Container Transactions" [ref=e321] [cursor=pointer]:
                        - /url: "#container-transaction-manager"
                      - text: . When the listener code throws an exception, the container transaction commit succeeds, and the record is sent to the retryable topic.
          - generic [ref=e322]:
            - heading [level=2] [ref=e323]:
              - code [ref=e324]: KafkaTemplate
              - text: Local Transactions
            - generic [ref=e325]:
              - paragraph [ref=e327]:
                - text: You can use the
                - code [ref=e328]: KafkaTemplate
                - text: "to execute a series of operations within a local transaction. The following example shows how to do so:"
              - generic [ref=e331]:
                - code [ref=e332]: "java boolean result = template.executeInTransaction(t -> { t.sendDefault(\"thing1\", \"thing2\"); t.sendDefault(\"cat\", \"hat\"); return true; });"
                - button "Copied!" [ref=e334] [cursor=pointer]
              - paragraph [ref=e337]:
                - text: The argument in the callback is the template itself (
                - code [ref=e338]: this
                - text: ). If the callback exits normally, the transaction is committed. If an exception is thrown, the transaction is rolled back.
              - table [ref=e340]:
                - rowgroup [ref=e341]:
                  - row [ref=e342]:
                    - cell "Note" [ref=e343]
                    - cell [ref=e345]:
                      - text: If there is a
                      - code [ref=e346]: KafkaTransactionManager
                      - text: (or synchronized) transaction in process, it is not used. Instead, a new "nested" transaction is used.
          - generic [ref=e347]:
            - heading [level=2] [ref=e348]:
              - code [ref=e349]: TransactionIdPrefix
            - paragraph [ref=e352]:
              - text: With
              - code [ref=e353]: EOSMode.V2
              - text: (aka
              - code [ref=e354]: BETA
              - text: ), the only supported mode, it is no longer necessary to use the same
              - code [ref=e355]: transactional.id
              - text: ", even for consumer-initiated transactions; in fact, it must be unique on each instance the same as for producer-initiated transactions. This property must have a different value on each application instance."
          - generic [ref=e356]:
            - heading [level=2] [ref=e357]:
              - code [ref=e358]: TransactionIdSuffix
              - text: Fixed
            - generic [ref=e359]:
              - paragraph [ref=e361]:
                - text: Since 3.2, a new
                - code [ref=e362]: TransactionIdSuffixStrategy
                - text: interface was introduced to manage
                - code [ref=e363]: transactional.id
                - text: suffix. The default implementation is
                - code [ref=e364]: DefaultTransactionIdSuffixStrategy
                - text: when setting
                - code [ref=e365]: maxCache
                - text: greater than zero can reuse
                - code [ref=e366]: transactional.id
                - text: within a specific range, otherwise suffixes will be generated on the fly by incrementing a counter. When a transaction producer is requested and
                - code [ref=e367]: transactional.id
                - text: all in use, throw a
                - code [ref=e368]: NoProducerAvailableException
                - text: . User can then use a
                - code [ref=e369]: RetryTemplate
                - text: configured to retry that exception, with a suitably configured back off.
              - generic [ref=e372]:
                - code [ref=e373]:
                  - text: java public static
                  - generic [ref=e374]: class Config
                  - text: "{ @Bean"
                  - generic [ref=e375]: public ProducerFactory<String, String> myProducerFactory()
                  - text: "{ Map<String, Object> configs = producerConfigs(); configs.put(ProducerConfig.CLIENT_ID_CONFIG, \"myClientId\"); ... DefaultKafkaProducerFactory<String, String> pf = new DefaultKafkaProducerFactory<>(configs); ... TransactionIdSuffixStrategy ss = new DefaultTransactionIdSuffixStrategy(5); pf.setTransactionIdSuffixStrategy(ss); return pf; } }"
                - button "Copied!" [ref=e377] [cursor=pointer]
              - paragraph [ref=e380]:
                - text: When setting
                - code [ref=e381]: maxCache
                - text: to 5,
                - code [ref=e382]: transactional.id
                - text: is
                - code [ref=e383]: my.txid.
                - text: +
                - code [ref=e384]: "{0-4}"
                - text: .
              - table [ref=e386]:
                - rowgroup [ref=e387]:
                  - row [ref=e388]:
                    - cell "Important" [ref=e389]
                    - cell [ref=e391]:
                      - text: When using
                      - code [ref=e392]: KafkaTransactionManager
                      - text: with the
                      - code [ref=e393]: ConcurrentMessageListenerContainer
                      - text: and enabling
                      - code [ref=e394]: maxCache
                      - text: ", it is necessary to set"
                      - code [ref=e395]: maxCache
                      - text: to a value greater than or equal to
                      - code [ref=e396]: concurrency
                      - text: . If a
                      - code [ref=e397]: MessageListenerContainer
                      - text: is unable to acquire a
                      - code [ref=e398]: transactional.id
                      - text: suffix, it will throw a
                      - code [ref=e399]: NoProducerAvailableException
                      - text: . When using nested transactions in the
                      - code [ref=e400]: ConcurrentMessageListenerContainer
                      - text: ", it is necessary to adjust the maxCache setting to handle the increased number of nested transactions."
          - generic [ref=e401]:
            - heading [level=2] [ref=e402]:
              - code [ref=e403]: KafkaTemplate
              - text: Transactional and non-Transactional Publishing
            - paragraph [ref=e406]:
              - text: Normally, when a
              - code [ref=e407]: KafkaTemplate
              - text: is transactional (configured with a transaction-capable producer factory), transactions are required. The transaction can be started by a
              - code [ref=e408]: TransactionTemplate
              - text: ", a"
              - code [ref=e409]: "@Transactional"
              - text: method, calling
              - code [ref=e410]: executeInTransaction
              - text: ", or by a listener container, when configured with a"
              - code [ref=e411]: KafkaTransactionManager
              - text: . Any attempt to use the template outside the scope of a transaction results in the template throwing an
              - code [ref=e412]: IllegalStateException
              - text: . Starting with version 2.4.3, you can set the template’s
              - code [ref=e413]: allowNonTransactional
              - text: property to
              - code [ref=e414]: "true"
              - text: . In that case, the template will allow the operation to run without a transaction, by calling the
              - code [ref=e415]: ProducerFactory
              - text: "'s"
