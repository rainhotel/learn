            - generic [ref=e421]:
              - paragraph [ref=e423]:
                - text: When a listener fails while transactions are being used, the
                - code [ref=e424]: AfterRollbackProcessor
                - text: is invoked to take some action after the rollback occurs. When using the default
                - code [ref=e425]: AfterRollbackProcessor
                - text: with a record listener, seeks are performed so that the failed record will be redelivered. With a batch listener, however, the whole batch will be redelivered because the framework doesn’t know which record in the batch failed. See the
                - link "After-rollback Processor" [ref=e426] [cursor=pointer]:
                  - /url: annotation-error-handling.html#after-rollback
                - text: for more information.
              - paragraph [ref=e428]:
                - text: "When using a batch listener, version 2.4.2 introduced an alternative mechanism to deal with failures while processing a batch:"
                - code [ref=e429]: BatchToRecordAdapter
                - text: . When a container factory with
                - code [ref=e430]: batchListener
                - text: set to true is configured with a
                - code [ref=e431]: BatchToRecordAdapter
                - text: ", the listener is invoked with one record at a time. This enables error handling within the batch, while still making it possible to stop processing the entire batch, depending on the exception type. A default"
                - code [ref=e432]: BatchToRecordAdapter
                - text: is provided, that can be configured with a standard
                - code [ref=e433]: ConsumerRecordRecoverer
                - text: such as the
                - code [ref=e434]: DeadLetterPublishingRecoverer
