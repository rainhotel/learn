          - text: would return 0 and not alter the timeout for a key with a timeout set.
        - heading [level=3] [ref=e1811]:
          - text: "Pattern: navigation session"
          - link "Link to this section" [ref=e1812] [cursor=pointer]:
            - /url: "#pattern-navigation-session"
        - paragraph [ref=e1815]:
          - text: Imagine you have a web service and you are interested in the latest N pages
          - emphasis [ref=e1816]: recently
          - text: visited by your users, such that each adjacent page view was not performed more than 60 seconds after the previous. Conceptually you may consider this set of page views as a
          - emphasis [ref=e1817]: Navigation session
          - text: of your user, that may contain interesting information about what kind of products he or she is looking for currently, so that you can recommend related products.
        - paragraph [ref=e1818]: "You can easily model this pattern in Redis using the following strategy: every time the user does a page view you call the following commands:"
        - code [ref=e1820]: MULTI RPUSH pagewviews.user:<userid> http://..... EXPIRE pagewviews.user:<userid> 60 EXEC
        - paragraph [ref=e1821]: If the user will be idle more than 60 seconds, the key will be deleted and only subsequent page views that have less than 60 seconds of difference will be recorded.
        - paragraph [ref=e1822]:
          - text: This pattern is easily modified to use counters using
          - link [ref=e1823] [cursor=pointer]:
            - /url: /docs/latest/commands/incr/
            - code [ref=e1824]: INCR
          - text: instead of lists using
          - link [ref=e1825] [cursor=pointer]:
            - /url: /docs/latest/commands/rpush/
            - code [ref=e1826]: RPUSH
          - text: .
        - heading [level=3] [ref=e1827]:
          - text: "Appendix: Redis expires"
          - link "Link to this section" [ref=e1828] [cursor=pointer]:
            - /url: "#appendix-redis-expires"
        - heading [level=4] [ref=e1831]:
          - text: Keys with an expire
          - link "Link to this section" [ref=e1832] [cursor=pointer]:
            - /url: "#keys-with-an-expire"
        - paragraph [ref=e1835]:
          - text: Normally Redis keys are created without an associated time to live. The key will simply live forever, unless it is removed by the user in an explicit way, for instance using the
          - link [ref=e1836] [cursor=pointer]:
            - /url: /docs/latest/commands/del/
            - code [ref=e1837]: DEL
          - text: command.
        - paragraph [ref=e1838]:
          - text: The
          - code [ref=e1839]: EXPIRE
          - text: family of commands is able to associate an expire to a given key, at the cost of some additional memory used by the key. When a key has an expire set, Redis will make sure to remove the key when the specified amount of time elapsed.
        - paragraph [ref=e1840]:
          - text: The key time to live can be updated or entirely removed using the
          - code [ref=e1841]: EXPIRE
          - text: and
          - link [ref=e1842] [cursor=pointer]:
            - /url: /docs/latest/commands/persist/
            - code [ref=e1843]: PERSIST
          - text: command (or other strictly related commands).
        - heading [level=4] [ref=e1844]:
          - text: Expire accuracy
          - link "Link to this section" [ref=e1845] [cursor=pointer]:
            - /url: "#expire-accuracy"
        - paragraph [ref=e1848]: In Redis 2.4 the expire might not be pin-point accurate, and it could be between zero to one seconds out.
        - paragraph [ref=e1849]: Since Redis 2.6 the expire error is from 0 to 1 milliseconds.
        - heading [level=4] [ref=e1850]:
          - text: Expires and persistence
          - link "Link to this section" [ref=e1851] [cursor=pointer]:
            - /url: "#expires-and-persistence"
        - paragraph [ref=e1854]: Keys expiring information is stored as absolute Unix timestamps (in milliseconds in case of Redis version 2.6 or greater). This means that the time is flowing even when the Redis instance is not active.
        - paragraph [ref=e1855]: For expires to work well, the computer time must be taken stable. If you move an RDB file from two computers with a big desync in their clocks, funny things may happen (like all the keys loaded to be expired at loading time).
        - paragraph [ref=e1856]: Even running instances will always check the computer clock, so for instance if you set a key with a time to live of 1000 seconds, and then set your computer time 2000 seconds in the future, the key will be expired immediately, instead of lasting for 1000 seconds.
        - heading [level=4] [ref=e1857]:
          - text: How Redis expires keys
          - link "Link to this section" [ref=e1858] [cursor=pointer]:
            - /url: "#how-redis-expires-keys"
        - paragraph [ref=e1861]: "Redis keys are expired in two ways: a passive way and an active way."
        - paragraph [ref=e1862]: A key is passively expired when a client tries to access it and the key is timed out.
        - paragraph [ref=e1863]: However, this is not enough as there are expired keys that will never be accessed again. These keys should be expired anyway, so periodically, Redis tests a few keys at random amongst the set of keys with an expiration. All the keys that are already expired are deleted from the keyspace.
        - heading [level=4] [ref=e1864]:
          - text: How expires are handled in the replication link and AOF file
          - link "Link to this section" [ref=e1865] [cursor=pointer]:
            - /url: "#how-expires-are-handled-in-the-replication-link-and-aof-file"
        - paragraph [ref=e1868]:
          - text: In order to obtain a correct behavior without sacrificing consistency, when a key expires, a
          - link [ref=e1869] [cursor=pointer]:
            - /url: /docs/latest/commands/del/
            - code [ref=e1870]: DEL
          - text: operation is synthesized in both the AOF file and gains all the attached replicas nodes. This way the expiration process is centralized in the master instance, and there is no chance of consistency errors.
        - paragraph [ref=e1871]:
          - text: However while the replicas connected to a master will not expire keys independently (but will wait for the
          - link [ref=e1872] [cursor=pointer]:
            - /url: /docs/latest/commands/del/
            - code [ref=e1873]: DEL
          - text: coming from the master), they'll still take the full state of the expires existing in the dataset, so when a replica is elected to master it will be able to expire the keys independently, fully acting as a master.
        - heading [level=4] [ref=e1874]:
          - text: Redis Search and expiration
          - link "Link to this section" [ref=e1875] [cursor=pointer]:
            - /url: "#redis-search-and-expiration"
        - paragraph [ref=e1878]:
          - text: Starting with Redis 8, Redis Search has enhanced behavior when handling expiring keys. For detailed information about how
          - link [ref=e1879] [cursor=pointer]:
            - /url: /docs/latest/commands/ft.search/
            - code [ref=e1880]: FT.SEARCH
          - text: and
          - link [ref=e1881] [cursor=pointer]:
            - /url: /docs/latest/commands/ft.aggregate/
            - code [ref=e1882]: FT.AGGREGATE
          - text: commands interact with expiring keys, see
          - link "Key and field expiration behavior" [ref=e1883] [cursor=pointer]:
            - /url: /docs/latest/develop/ai/search-and-query/advanced-concepts/expiration/
          - text: .
        - heading [level=2] [ref=e1884]:
          - text: Redis Software and Redis Cloud compatibility
          - link "Link to this section" [ref=e1885] [cursor=pointer]:
            - /url: "#redis-software-and-redis-cloud-compatibility"
