        - paragraph [ref=e1670]:
          - text: Set a timeout on
          - code [ref=e1671]: key
          - text: . After the timeout has expired, the key will automatically be deleted. A key with an associated timeout is often said to be
          - emphasis [ref=e1672]: volatile
          - text: in Redis terminology.
        - paragraph [ref=e1673]:
          - text: The timeout will only be cleared by commands that delete or overwrite the contents of the key, including
          - link [ref=e1674] [cursor=pointer]:
            - /url: /docs/latest/commands/del/
            - code [ref=e1675]: DEL
          - text: ","
          - link [ref=e1676] [cursor=pointer]:
            - /url: /docs/latest/commands/set/
            - code [ref=e1677]: SET
          - text: ","
          - link [ref=e1678] [cursor=pointer]:
            - /url: /docs/latest/commands/getset/
            - code [ref=e1679]: GETSET
          - text: and all the
          - code [ref=e1680]: "*STORE"
          - text: commands. This means that all the operations that conceptually
          - emphasis [ref=e1681]: alter
          - text: the value stored at the key without replacing it with a new one will leave the timeout untouched. For instance, incrementing the value of a key with
          - link [ref=e1682] [cursor=pointer]:
            - /url: /docs/latest/commands/incr/
            - code [ref=e1683]: INCR
          - text: ", pushing a new value into a list with"
          - link [ref=e1684] [cursor=pointer]:
            - /url: /docs/latest/commands/lpush/
            - code [ref=e1685]: LPUSH
          - text: ", or altering the field value of a hash with"
          - link [ref=e1686] [cursor=pointer]:
            - /url: /docs/latest/commands/hset/
            - code [ref=e1687]: HSET
          - text: are all operations that will leave the timeout untouched.
        - paragraph [ref=e1688]:
          - text: The timeout can also be cleared, turning the key back into a persistent key, using the
          - link [ref=e1689] [cursor=pointer]:
            - /url: /docs/latest/commands/persist/
            - code [ref=e1690]: PERSIST
          - text: command.
        - paragraph [ref=e1691]:
          - text: If a key is renamed with
          - link [ref=e1692] [cursor=pointer]:
            - /url: /docs/latest/commands/rename/
            - code [ref=e1693]: RENAME
          - text: ", the associated time to live is transferred to the new key name."
        - paragraph [ref=e1694]:
          - text: If a key is overwritten by
          - link [ref=e1695] [cursor=pointer]:
            - /url: /docs/latest/commands/rename/
            - code [ref=e1696]: RENAME
          - text: ", like in the case of an existing key"
          - code [ref=e1697]: Key_A
          - text: that is overwritten by a call like
          - code [ref=e1698]: RENAME Key_B Key_A
          - text: ", it does not matter if the original"
          - code [ref=e1699]: Key_A
          - text: had a timeout associated or not, the new key
          - code [ref=e1700]: Key_A
          - text: will inherit all the characteristics of
          - code [ref=e1701]: Key_B
          - text: .
        - paragraph [ref=e1702]:
          - text: Note that calling
          - code [ref=e1703]: EXPIRE
          - text: /
          - link [ref=e1704] [cursor=pointer]:
