          - 'heading "Step 7: Process your events with Kafka Streams" [level=2] [ref=e402]'
          - paragraph [ref=e403]:
            - text: Once your data is stored in Kafka as events, you can process the data with the
            - link "Kafka Streams" [ref=e404] [cursor=pointer]:
              - /url: /documentation/streams
            - text: client library for Java/Scala. It allows you to implement mission-critical real-time applications and microservices, where the input and/or output data is stored in Kafka topics. Kafka Streams combines the simplicity of writing and deploying standard Java and Scala applications on the client side with the benefits of Kafka’s server-side cluster technology to make these applications highly scalable, elastic, fault-tolerant, and distributed. The library supports exactly-once processing, stateful operations and aggregations, windowing, joins, processing based on event-time, and much more.
          - paragraph [ref=e405]:
            - text: To give you a first taste, here’s how one would implement the popular
            - code [ref=e406]: WordCount
            - text: "algorithm:"
