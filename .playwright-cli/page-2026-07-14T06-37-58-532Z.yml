          - 'heading "Step 3: Create a topic to store your events" [level=2] [ref=e259]'
          - paragraph [ref=e260]:
            - text: Kafka is a distributed
            - emphasis [ref=e261]: event streaming platform
            - text: that lets you read, write, store, and process
            - link [ref=e262] [cursor=pointer]:
              - /url: /documentation/#messages
              - emphasis [ref=e263]: events
            - text: (also called
            - emphasis [ref=e264]: records
            - text: or
            - emphasis [ref=e265]: messages
            - text: in the documentation) across many machines.
          - paragraph [ref=e266]:
            - text: Example events are payment transactions, geolocation updates from mobile phones, shipping orders, sensor measurements from IoT devices or medical equipment, and much more. These events are organized and stored in
            - link [ref=e267] [cursor=pointer]:
              - /url: /43/getting-started/introduction/#main-concepts-and-terminology
              - emphasis [ref=e268]: topics
            - text: . Very simplified, a topic is similar to a folder in a filesystem, and the events are the files in that folder.
          - paragraph [ref=e269]: "So before you can write your first events, you must create a topic. Open another terminal session and run:"
          - generic [ref=e271]:
            - button "Copy to clipboard" [ref=e272] [cursor=pointer]: 
            - code [ref=e273]:
              - generic [ref=e274]: $ bin/kafka-topics.sh --create --topic quickstart-events --bootstrap-server localhost:9092
          - paragraph [ref=e276]:
            - text: "All of Kafka’s command line tools have additional options: run the"
            - code [ref=e277]: kafka-topics.sh
            - text: command without any arguments to display usage information. For example, it can also show you
            - link "details such as the partition count" [ref=e278] [cursor=pointer]:
              - /url: /43/getting-started/introduction/#main-concepts-and-terminology
            - text: "of the new topic:"
          - generic [ref=e280]:
            - button "Copy to clipboard" [ref=e281] [cursor=pointer]: 
            - code [ref=e282]:
              - generic [ref=e283]: $ bin/kafka-topics.sh --describe --topic quickstart-events --bootstrap-server localhost:9092
              - generic [ref=e285]: "Topic: quickstart-events TopicId: NPmZHyhbR9y00wMglMH2sg PartitionCount: 1 ReplicationFactor: 1 Configs:"
              - generic [ref=e287]: "Topic: quickstart-events Partition: 0 Leader: 0 Replicas: 0 Isr: 0"
          - 'heading "Step 4: Write some events into the topic" [level=2] [ref=e289]'
          - paragraph [ref=e290]: A Kafka client communicates with the Kafka brokers via the network for writing (or reading) events. Once received, the brokers will store the events in a durable and fault-tolerant manner for as long as you need-even forever.
          - paragraph [ref=e291]: Run the console producer client to write a few events into your topic. By default, each line you enter will result in a separate event being written to the topic.
          - generic [ref=e293]:
            - button "Copy to clipboard" [ref=e294] [cursor=pointer]: 
            - code [ref=e295]:
              - generic [ref=e296]: $ bin/kafka-console-producer.sh --topic quickstart-events --bootstrap-server localhost:9092
              - generic [ref=e298]: ">This is my first event"
              - generic [ref=e300]: ">This is my second event"
          - paragraph [ref=e302]:
            - text: You can stop the producer client with
            - code [ref=e303]: Ctrl-C
            - text: at any time.
          - 'heading "Step 5: Read the events" [level=2] [ref=e304]'
          - paragraph [ref=e305]: "Open another terminal session and run the console consumer client to read the events you just created:"
          - generic [ref=e307]:
            - button "Copy to clipboard" [ref=e308] [cursor=pointer]: 
            - code [ref=e309]:
              - generic [ref=e310]: $ bin/kafka-console-consumer.sh --topic quickstart-events --from-beginning --bootstrap-server localhost:9092
              - generic [ref=e312]: This is my first event
              - generic [ref=e314]: This is my second event
          - paragraph [ref=e316]:
            - text: You can stop the consumer client with
            - code [ref=e317]: Ctrl-C
            - text: at any time.
          - paragraph [ref=e318]: "Feel free to experiment: for example, switch back to your producer terminal (previous step) to write additional events, and see how the events immediately show up in your consumer terminal."
          - paragraph [ref=e319]: Because events are durably stored in Kafka, they can be read as many times and by as many consumers as you want. You can easily verify this by opening yet another terminal session and re-running the previous command again.
          - 'heading "Step 6: Import/export your data as streams of events with Kafka Connect" [level=2] [ref=e320]'
          - paragraph [ref=e321]:
            - text: You probably have lots of data in existing systems like relational databases or traditional messaging systems, along with many applications that already use these systems.
            - link "Kafka Connect" [ref=e322] [cursor=pointer]:
              - /url: /documentation/#connect
            - text: allows you to continuously ingest data from external systems into Kafka, and vice versa. It is an extensible tool that runs
            - emphasis [ref=e323]: connectors
            - text: ", which implement the custom logic for interacting with an external system. It is thus very easy to integrate existing systems with Kafka. To make this process even easier, there are hundreds of such connectors readily available."
          - paragraph [ref=e324]: In this quickstart we’ll see how to run Kafka Connect with simple connectors that import data from a file to a Kafka topic and export data from a Kafka topic to a file.
          - paragraph [ref=e325]:
            - text: First, make sure to add
            - code [ref=e326]: connect-file-4.3.1.jar
            - text: to the
            - code [ref=e327]: plugin.path
            - text: property in the Connect worker’s configuration. For the purpose of this quickstart we’ll use a relative path and consider the connectors’ package as an uber jar, which works when the quickstart commands are run from the installation directory. However, it’s worth noting that for production deployments using absolute paths is always preferable. See
            - link "plugin.path" [ref=e328] [cursor=pointer]:
              - /url: ../../configuration/kafka-connect-configs/#connectconfigs_plugin.path
            - text: for a detailed description of how to set this config.
          - paragraph [ref=e329]:
            - text: Edit the
            - code [ref=e330]: config/connect-standalone.properties
            - text: file, add or change the
            - code [ref=e331]: plugin.path
            - text: "configuration property match the following, and save the file:"
          - generic [ref=e333]:
            - button "Copy to clipboard" [ref=e334] [cursor=pointer]: 
            - code [ref=e335]:
              - generic [ref=e336]: $ echo "plugin.path=libs/connect-file-4.3.1.jar" >> config/connect-standalone.properties
          - paragraph [ref=e338]: "Then, start by creating some seed data to test with:"
          - generic [ref=e340]:
            - button "Copy to clipboard" [ref=e341] [cursor=pointer]: 
            - code [ref=e342]:
              - generic [ref=e343]: $ echo -e "foo
              - generic [ref=e345]: bar" > test.txt
          - paragraph [ref=e347]: "Or on Windows:"
          - generic [ref=e349]:
            - button "Copy to clipboard" [ref=e350] [cursor=pointer]: 
            - code [ref=e351]:
              - generic [ref=e352]: $ echo foo > test.txt
              - generic [ref=e354]: $ echo bar >> test.txt
          - paragraph [ref=e356]:
            - text: Next, we’ll start two connectors running in
            - emphasis [ref=e357]: standalone
            - text: mode, which means they run in a single, local, dedicated process. We provide three configuration files as parameters. The first is always the configuration for the Kafka Connect process, containing common configuration such as the Kafka brokers to connect to and the serialization format for data. The remaining configuration files each specify a connector to create. These files include a unique connector name, the connector class to instantiate, and any other configuration required by the connector.
          - generic [ref=e359]:
            - button "Copy to clipboard" [ref=e360] [cursor=pointer]: 
            - code [ref=e361]:
              - generic [ref=e362]: $ bin/connect-standalone.sh config/connect-standalone.properties config/connect-file-source.properties config/connect-file-sink.properties
          - paragraph [ref=e364]: "These sample configuration files, included with Kafka, use the default local cluster configuration you started earlier and create two connectors: the first is a source connector that reads lines from an input file and produces each to a Kafka topic and the second is a sink connector that reads messages from a Kafka topic and produces each as a line in an output file."
          - paragraph [ref=e365]:
            - text: During startup you’ll see a number of log messages, including some indicating that the connectors are being instantiated. Once the Kafka Connect process has started, the source connector should start reading lines from
            - code [ref=e366]: test.txt
            - text: and producing them to the topic
            - code [ref=e367]: connect-test
            - text: ", and the sink connector should start reading messages from the topic"
