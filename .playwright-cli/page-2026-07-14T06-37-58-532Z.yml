          - 'heading "Step 2: Start the Kafka environment" [level=2] [ref=e203]'
          - paragraph [ref=e204]: "NOTE: Your local environment must have Java 17+ installed."
          - paragraph [ref=e205]: Kafka can be run using local scripts and downloaded files or the docker image.
          - heading "Using downloaded files" [level=3] [ref=e206]
          - paragraph [ref=e207]: Generate a Cluster UUID
