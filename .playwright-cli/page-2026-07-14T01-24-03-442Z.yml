          - heading "Understanding the Spring Framework’s Declarative Transaction Implementation" [level=1] [ref=e175]
          - paragraph [ref=e177]:
            - text: It is not sufficient merely to tell you to annotate your classes with the
            - code [ref=e178]: "@Transactional"
            - text: annotation, add
            - code [ref=e179]: "@EnableTransactionManagement"
            - text: to your configuration, and expect you to understand how it all works. To provide a deeper understanding, this section explains the inner workings of the Spring Framework’s declarative transaction infrastructure in the context of transaction-related issues.
          - paragraph [ref=e181]:
            - text: The most important concepts to grasp with regard to the Spring Framework’s declarative transaction support are that this support is enabled
            - link "via AOP proxies" [ref=e182] [cursor=pointer]:
              - /url: ../../../core/aop/proxying.html#aop-understanding-aop-proxies
            - text: and that the transactional advice is driven by metadata (currently XML- or annotation-based). The combination of AOP with transactional metadata yields an AOP proxy that uses a
            - code [ref=e183]: TransactionInterceptor
            - text: in conjunction with an appropriate
            - code [ref=e184]: TransactionManager
            - text: implementation to drive transactions around method invocations.
          - table [ref=e186]:
            - rowgroup [ref=e187]:
              - row [ref=e188]:
                - cell "Note" [ref=e189]
                - cell [ref=e191]:
                  - text: Spring AOP is covered in
                  - link "the AOP section" [ref=e192] [cursor=pointer]:
                    - /url: ../../../core/aop.html
                  - text: .
          - paragraph [ref=e194]:
            - text: Spring Framework’s
            - code [ref=e195]: TransactionInterceptor
            - text: provides transaction management for imperative and reactive programming models. The interceptor detects the desired flavor of transaction management by inspecting the method return type. Methods returning a reactive type such as
            - code [ref=e196]: Publisher
            - text: or Kotlin
            - code [ref=e197]: Flow
            - text: (or a subtype of those) qualify for reactive transaction management. All other return types including
            - code [ref=e198]: void
            - text: use the code path for imperative transaction management.
          - paragraph [ref=e200]:
            - text: Transaction management flavors impact which transaction manager is required. Imperative transactions require a
            - code [ref=e201]: PlatformTransactionManager
            - text: ", while reactive transactions use"
            - code [ref=e202]: ReactiveTransactionManager
            - text: implementations.
          - table [ref=e204]:
            - rowgroup [ref=e205]:
              - row [ref=e206]:
                - cell "Note" [ref=e207]
                - cell [ref=e209]:
                  - paragraph [ref=e211]:
                    - code [ref=e212]: "@Transactional"
                    - text: commonly works with thread-bound transactions managed by
                    - code [ref=e213]: PlatformTransactionManager
                    - text: ", exposing a transaction to all data access operations within the current execution thread. Note: This does"
                    - emphasis [ref=e214]: not
                    - text: propagate to newly started threads within the method.
                  - paragraph [ref=e216]:
                    - text: A reactive transaction managed by
                    - code [ref=e217]: ReactiveTransactionManager
                    - text: uses the Reactor context instead of thread-local attributes. As a consequence, all participating data access operations need to execute within the same Reactor context in the same reactive pipeline.
                  - paragraph [ref=e219]:
                    - text: When configured with a
                    - code [ref=e220]: ReactiveTransactionManager
                    - text: ", all transaction-demarcated methods are expected to return a reactive pipeline. Void methods or regular return types need to be associated with a regular"
                    - code [ref=e221]: PlatformTransactionManager
                    - text: ", for example, through the"
                    - code [ref=e222]: transactionManager
                    - text: attribute of the corresponding
                    - code [ref=e223]: "@Transactional"
                    - text: declarations.
          - paragraph [ref=e225]: "The following image shows a conceptual view of calling a method on a transactional proxy:"
          - img "tx" [ref=e228]
