          - heading "Concepts" [level=1] [ref=e120]
          - generic [ref=e121]:
            - heading "Purpose" [level=2] [ref=e122]
            - generic [ref=e123]:
              - paragraph [ref=e125]: Micrometer is a metrics instrumentation library for JVM-based applications. It provides a simple facade over the instrumentation clients for the most popular monitoring systems, letting you instrument your JVM-based application code without vendor lock-in. It is designed to add little to no overhead to your metrics collection activity while maximizing the portability of your metrics effort.
              - paragraph [ref=e127]:
                - text: Starting from Micrometer 1.10, Micrometer provides the
                - link "Observation API" [ref=e128] [cursor=pointer]:
                  - /url: observation.html
                - text: and a plugin mechanism that lets you add capabilities, including the tracing features. You can read more about tracing in the
                - link "Micrometer Tracing documentation" [ref=e129] [cursor=pointer]:
                  - /url: https://docs.micrometer.io/tracing/reference/
                - text: .
              - paragraph [ref=e131]:
                - text: For better understanding of the differences among these different types of systems (Metrics, Distributed Tracing, and Logging) we recommend Adrian Cole’s talk, titled
                - link "Observability 3 Ways" [ref=e132] [cursor=pointer]:
                  - /url: https://www.youtube.com/watch?v=juP9VApKy_I
                - text: . To learn more about Micrometer Observation API, we recommend Tommy Ludwig’s and Marcin Grzejszczak’s talk, titled
                - link "Observability of Your Application" [ref=e133] [cursor=pointer]:
                  - /url: https://www.youtube.com/watch?v=fh3VbrPvAjg
                - text: and Tommy Ludwig’s and Jonatan Ivanov’s talk, titled
                - link "Micrometer Mastery" [ref=e134] [cursor=pointer]:
                  - /url: https://www.youtube.com/watch?v=Qyku6cR6ADY
                - text: .
          - generic [ref=e135]:
            - heading "Dependencies" [level=2] [ref=e136]
            - generic [ref=e137]:
              - paragraph [ref=e139]:
                - text: The
                - code [ref=e140]: micrometer-core
                - text: module aims to have minimal dependencies. It does not require any third-party (non-Micrometer) dependencies on the classpath at compile time for applications that use Micrometer, except for
                - link "JSpecify" [ref=e141] [cursor=pointer]:
                  - /url: https://jspecify.dev/
                - text: .
              - paragraph [ref=e143]:
                - text: Use of the
                - link "pause detection" [ref=e144] [cursor=pointer]:
                  - /url: concepts/timers.html#_pause_detection
                - text: feature requires the
                - link "LatencyUtils" [ref=e145] [cursor=pointer]:
                  - /url: https://github.com/LatencyUtils/LatencyUtils
                - text: dependency (
                - code [ref=e146]: org.latencyutils:LatencyUtils
                - text: ) to be available on the classpath at runtime. Micrometer does not include LatencyUtils on the runtime classpath by default because pause detection is turned off by default.
              - paragraph [ref=e148]:
                - text: If you use
                - link "client-side percentiles" [ref=e149] [cursor=pointer]:
                  - /url: concepts/histogram-quantiles.html
                - text: ", you need"
                - link "HdrHistogram" [ref=e150] [cursor=pointer]:
                  - /url: https://github.com/HdrHistogram/HdrHistogram
                - text: on the classpath at runtime. If you do not use client-side percentiles, you may exclude HdrHistogram from your application’s runtime classpath.
