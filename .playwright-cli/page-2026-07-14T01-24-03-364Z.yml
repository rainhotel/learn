          - heading [level=1] [ref=e186]:
            - text: Using
            - code [ref=e187]: "@Transactional"
          - generic [ref=e189]:
            - paragraph [ref=e191]: In addition to the XML-based declarative approach to transaction configuration, you can use an annotation-based approach. Declaring transaction semantics directly in the Java source code puts the declarations much closer to the affected code. There is not much danger of undue coupling, because code that is meant to be used transactionally is almost always deployed that way anyway.
            - table [ref=e193]:
              - rowgroup [ref=e194]:
                - row [ref=e195]:
                  - cell "Note" [ref=e196]
                  - cell [ref=e198]:
                    - text: The standard
                    - code [ref=e199]: jakarta.transaction.Transactional
                    - text: annotation is also supported as a drop-in replacement for Spring’s own annotation. Please refer to the JTA documentation for more details.
            - paragraph [ref=e201]:
              - text: The ease-of-use afforded by the use of the
              - code [ref=e202]: "@Transactional"
              - text: "annotation is best illustrated with an example, which is explained in the text that follows. Consider the following class definition:"
            - generic [ref=e204]:
              - tablist [ref=e206]:
                - tab [selected] [ref=e207] [cursor=pointer]:
                  - paragraph [ref=e208]: Java
                - tab [ref=e209] [cursor=pointer]:
                  - paragraph [ref=e210]: Kotlin
              - tabpanel "Java" [ref=e211]:
                - generic [ref=e214]:
                  - code [ref=e215]:
                    - text: java // the service class that we want to make transactional @Transactional public
                    - generic [ref=e216]: class DefaultFooService implements FooService
                    - text: "{ @Override"
                    - generic [ref=e217]: public Foo getFoo(String fooName)
                    - text: "{ // ... } @Override"
                    - generic [ref=e218]: public Foo getFoo(String fooName, String barName)
                    - text: "{ // ... } @Override"
                    - generic [ref=e219]: public void insertFoo(Foo foo)
                    - text: "{ // ... } @Override"
                    - generic [ref=e220]: public void updateFoo(Foo foo)
                    - text: "{ // ... } }"
                  - button "Copied!" [ref=e222] [cursor=pointer]
              - text: kotlin
            - paragraph [ref=e225]:
              - text: Used at the class level as above, the annotation indicates a default for all methods of the declaring class (as well as its subclasses). Alternatively, each method can be annotated individually. See
              - link "method visibility" [ref=e226] [cursor=pointer]:
                - /url: "#transaction-declarative-annotations-method-visibility"
              - text: for further details on which methods Spring considers transactional. Note that a class-level annotation does not apply to ancestor classes up the class hierarchy; in such a scenario, inherited methods need to be locally redeclared in order to participate in a subclass-level annotation.
            - paragraph [ref=e228]:
              - text: When a POJO class such as the one above is defined as a bean in a Spring context, you can make the bean instance transactional through an
              - code [ref=e229]: "@EnableTransactionManagement"
              - text: annotation in a
              - code [ref=e230]: "@Configuration"
              - text: class. See the
              - link "javadoc" [ref=e231] [cursor=pointer]:
                - /url: https://docs.spring.io/spring-framework/docs/7.0.8/javadoc-api/org/springframework/transaction/annotation/EnableTransactionManagement.html
              - text: for full details.
            - paragraph [ref=e233]: "The following example shows the configuration needed to enable annotation-driven transaction management:"
            - generic [ref=e235]:
              - tablist [ref=e237]:
                - tab [selected] [ref=e238] [cursor=pointer]:
                  - paragraph [ref=e239]: Java
                - tab [ref=e240] [cursor=pointer]:
                  - paragraph [ref=e241]: Kotlin
                - tab [ref=e242] [cursor=pointer]:
                  - paragraph [ref=e243]: Xml
              - tabpanel "Java" [ref=e244]:
                - generic [ref=e247]:
                  - code [ref=e248]:
                    - text: java @Configuration @EnableTransactionManagement public
                    - generic [ref=e249]: class AppConfig
                    - text: "{ @Bean"
                    - generic [ref=e250]: public FooService fooService()
                    - text: "{ return new DefaultFooService(); } @Bean"
                    - generic [ref=e251]: public PlatformTransactionManager txManager(DataSource dataSource)
                    - text: "{ return new DataSourceTransactionManager(dataSource); } }"
                  - button "Copied!" [ref=e253] [cursor=pointer]
              - text: kotlin xml
            - table [ref=e256]:
              - rowgroup [ref=e257]:
                - row [ref=e258]:
                  - cell "Tip" [ref=e259]
                  - cell [ref=e261]:
                    - text: In programmatic configuration, the
                    - code [ref=e262]: "@EnableTransactionManagement"
                    - text: annotation uses any
                    - code [ref=e263]: TransactionManager
                    - text: bean in the context. In XML configuration, you can omit the
                    - code [ref=e264]: transaction-manager
                    - text: attribute in the
                    - code [ref=e265]: <tx:annotation-driven/>
                    - text: tag if the bean name of the
                    - code [ref=e266]: TransactionManager
                    - text: that you want to wire in has the name
                    - code [ref=e267]: transactionManager
                    - text: . If the
                    - code [ref=e268]: TransactionManager
                    - text: bean has any other name, you have to use the
                    - code [ref=e269]: transaction-manager
                    - text: attribute explicitly, as in the preceding example.
            - paragraph [ref=e271]: "Reactive transactional methods use reactive return types in contrast to imperative programming arrangements as the following listing shows:"
            - generic [ref=e273]:
              - tablist [ref=e275]:
                - tab [selected] [ref=e276] [cursor=pointer]:
                  - paragraph [ref=e277]: Java
                - tab [ref=e278] [cursor=pointer]:
                  - paragraph [ref=e279]: Kotlin
              - tabpanel "Java" [ref=e280]:
                - generic [ref=e283]:
                  - code [ref=e284]:
                    - text: java // the reactive service class that we want to make transactional @Transactional public
                    - generic [ref=e285]: class DefaultFooService implements FooService
                    - text: "{ @Override"
                    - generic [ref=e286]: public Publisher<Foo> getFoo(String fooName)
                    - text: "{ // ... } @Override"
                    - generic [ref=e287]: public Mono<Foo> getFoo(String fooName, String barName)
                    - text: "{ // ... } @Override"
                    - generic [ref=e288]: public Mono<Void> insertFoo(Foo foo)
                    - text: "{ // ... } @Override"
                    - generic [ref=e289]: public Mono<Void> updateFoo(Foo foo)
                    - text: "{ // ... } }"
                  - button "Copied!" [ref=e291] [cursor=pointer]
              - text: kotlin
            - paragraph [ref=e294]:
              - text: Note that there are special considerations for the returned
              - code [ref=e295]: Publisher
              - text: with regards to Reactive Streams cancellation signals. See the
              - link "Cancel Signals" [ref=e296] [cursor=pointer]:
                - /url: ../programmatic.html#tx-prog-operator-cancel
              - text: section under "Using the TransactionalOperator" for more details.
            - table [ref=e298]:
              - rowgroup [ref=e299]:
                - row [ref=e300]:
                  - cell "Note" [ref=e301]
                  - cell [ref=e303]:
                    - generic [ref=e304]:
                      - text: Method visibility and
                      - code [ref=e305]: "@Transactional"
                      - text: in proxy mode
                    - paragraph [ref=e307]:
                      - text: The
                      - code [ref=e308]: "@Transactional"
                      - text: annotation is typically used on methods with
                      - code [ref=e309]: public
                      - text: visibility. As of 6.0,
                      - code [ref=e310]: protected
                      - text: or package-visible methods can also be made transactional for class-based proxies by default. Note that transactional methods in interface-based proxies must always be
                      - code [ref=e311]: public
                      - text: and defined in the proxied interface. For both kinds of proxies, only external method calls coming in through the proxy are intercepted.
                    - paragraph [ref=e313]:
                      - text: If you prefer consistent treatment of method visibility across the different kinds of proxies (which was the default up until 5.3), consider specifying
                      - code [ref=e314]: publicMethodsOnly
                      - text: ":"
                    - generic [ref=e317]:
                      - code [ref=e318]:
                        - generic [ref=e319]: /** * Register a custom AnnotationTransactionAttributeSource with the * publicMethodsOnly flag set to true to consistently ignore non-public methods. * @see ProxyTransactionManagementConfiguration#transactionAttributeSource() */
                        - text: "@Bean"
                        - generic [ref=e320]: TransactionAttributeSource transactionAttributeSource()
                        - text: "{ return new AnnotationTransactionAttributeSource(true); }"
                      - button "Copied!" [ref=e322] [cursor=pointer]
                    - paragraph [ref=e325]:
                      - text: The
                      - emphasis [ref=e326]: Spring TestContext Framework
                      - text: supports non-private
                      - code [ref=e327]: "@Transactional"
                      - text: test methods by default as well. See
                      - link "Transaction Management" [ref=e328] [cursor=pointer]:
                        - /url: ../../../testing/testcontext-framework/tx.html
                      - text: in the testing chapter for examples.
            - paragraph [ref=e330]:
              - text: You can apply the
              - code [ref=e331]: "@Transactional"
              - text: annotation to an interface definition, a method on an interface, a class definition, or a method on a class. However, the mere presence of the
              - code [ref=e332]: "@Transactional"
              - text: annotation is not enough to activate the transactional behavior. The
              - code [ref=e333]: "@Transactional"
              - text: annotation is merely metadata that can be consumed by corresponding runtime infrastructure which uses that metadata to configure the appropriate beans with transactional behavior. In the preceding examples that use programmatic configuration, the
              - code [ref=e334]: "@EnableTransactionManagement"
              - text: annotation switches on actual transaction management at runtime. Whereas, in the preceding example that uses XML configuration, the
              - code [ref=e335]: <tx:annotation-driven/>
              - text: element switches on actual transaction management at runtime.
            - table [ref=e337]:
              - rowgroup [ref=e338]:
                - row [ref=e339]:
                  - cell "Tip" [ref=e340]
                  - cell [ref=e342]:
                    - text: The Spring team recommends that you annotate methods of concrete classes with the
                    - code [ref=e343]: "@Transactional"
                    - text: "annotation, rather than relying on annotated methods in interfaces, even if the latter does work for interface-based and target-class proxies as of 5.0. Since Java annotations are not inherited from interfaces, interface-declared annotations are still not recognized by the weaving infrastructure when using AspectJ mode, so the aspect does not get applied. As a consequence, your transaction annotations may be silently ignored: Your code might appear to \"work\" until you test a rollback scenario."
            - table [ref=e345]:
              - rowgroup [ref=e346]:
                - row [ref=e347]:
                  - cell "Note" [ref=e348]
                  - cell [ref=e350]:
                    - text: In proxy mode (which is the default), only external method calls coming in through the proxy are intercepted. This means that self-invocation (in effect, a method within the target object calling another method of the target object) does not lead to an actual transaction at runtime even if the invoked method is marked with
                    - code [ref=e351]: "@Transactional"
                    - text: . Also, the proxy must be fully initialized to provide the expected behavior, so you should not rely on this feature in your initialization code — for example, in a
                    - code [ref=e352]: "@PostConstruct"
                    - text: method.
            - paragraph [ref=e354]:
              - text: Consider using AspectJ mode (see the
              - code [ref=e355]: mode
              - text: attribute in the following table) if you expect self-invocations to be wrapped with transactions as well. In this case, there is no proxy in the first place. Instead, the target class is woven (that is, its byte code is modified) to support
              - code [ref=e356]: "@Transactional"
              - text: runtime behavior on any kind of method.
            - table [ref=e357]:
              - caption [ref=e358]: Table 1. Annotation driven transaction settings
              - rowgroup [ref=e364]:
                - row [ref=e365]:
                  - columnheader "XML Attribute" [ref=e366]
                  - columnheader "Annotation Attribute" [ref=e367]
                  - columnheader "Default" [ref=e368]
                  - columnheader "Description" [ref=e369]
              - rowgroup [ref=e370]:
                - row [ref=e371]:
                  - cell [ref=e372]:
                    - paragraph [ref=e373]:
                      - code [ref=e374]: transaction-manager
                  - cell [ref=e375]:
                    - paragraph [ref=e376]:
                      - text: N/A (see
                      - link [ref=e377] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-framework/docs/7.0.8/javadoc-api/org/springframework/transaction/annotation/TransactionManagementConfigurer.html
                        - code [ref=e378]: TransactionManagementConfigurer
                      - text: javadoc)
                  - cell [ref=e379]:
                    - paragraph [ref=e380]:
                      - code [ref=e381]: transactionManager
                  - cell [ref=e382]:
                    - paragraph [ref=e383]:
                      - text: Name of the transaction manager to use. Required only if the name of the transaction manager is not
                      - code [ref=e384]: transactionManager
                      - text: ", as in the preceding example."
                - row [ref=e385]:
                  - cell [ref=e386]:
                    - paragraph [ref=e387]:
                      - code [ref=e388]: mode
                  - cell [ref=e389]:
                    - paragraph [ref=e390]:
                      - code [ref=e391]: mode
                  - cell [ref=e392]:
                    - paragraph [ref=e393]:
                      - code [ref=e394]: proxy
                  - cell [ref=e395]:
                    - paragraph [ref=e396]:
                      - text: The default mode (
                      - code [ref=e397]: proxy
                      - text: ) processes annotated beans to be proxied by using Spring’s AOP framework (following proxy semantics, as discussed earlier, applying to method calls coming in through the proxy only). The alternative mode (
                      - code [ref=e398]: aspectj
                      - text: ) instead weaves the affected classes with Spring’s AspectJ transaction aspect, modifying the target class byte code to apply to any kind of method call. AspectJ weaving requires
                      - code [ref=e399]: spring-aspects.jar
                      - text: in the classpath as well as having load-time weaving (or compile-time weaving) enabled. (See
                      - link "Spring configuration" [ref=e400] [cursor=pointer]:
                        - /url: ../../../core/aop/using-aspectj.html#aop-aj-ltw-spring
                      - text: for details on how to set up load-time weaving.)
                - row [ref=e401]:
                  - cell [ref=e402]:
                    - paragraph [ref=e403]:
                      - code [ref=e404]: proxy-target-class
                  - cell [ref=e405]:
                    - paragraph [ref=e406]:
                      - code [ref=e407]: proxyTargetClass
                  - cell [ref=e408]:
                    - paragraph [ref=e409]:
                      - code [ref=e410]: "false"
                  - cell [ref=e411]:
                    - paragraph [ref=e412]:
                      - text: Applies to
                      - code [ref=e413]: proxy
                      - text: mode only. Controls what type of transactional proxies are created for classes annotated with the
                      - code [ref=e414]: "@Transactional"
                      - text: annotation. If the
                      - code [ref=e415]: proxy-target-class
                      - text: attribute is set to
                      - code [ref=e416]: "true"
                      - text: ", class-based proxies are created. If"
                      - code [ref=e417]: proxy-target-class
                      - text: is
                      - code [ref=e418]: "false"
                      - text: or if the attribute is omitted, then standard JDK interface-based proxies are created. (See
                      - link "Proxying Mechanisms" [ref=e419] [cursor=pointer]:
                        - /url: ../../../core/aop/proxying.html
                      - text: for a detailed examination of the different proxy types.)
                - row [ref=e420]:
                  - cell [ref=e421]:
                    - paragraph [ref=e422]:
                      - code [ref=e423]: order
                  - cell [ref=e424]:
                    - paragraph [ref=e425]:
                      - code [ref=e426]: order
                  - cell [ref=e427]:
                    - paragraph [ref=e428]:
                      - code [ref=e429]: Ordered.LOWEST_PRECEDENCE
                  - cell [ref=e430]:
                    - paragraph [ref=e431]:
                      - text: Defines the order of the transaction advice that is applied to beans annotated with
                      - code [ref=e432]: "@Transactional"
                      - text: . (For more information about the rules related to ordering of AOP advice, see
                      - link "Advice Ordering" [ref=e433] [cursor=pointer]:
                        - /url: ../../../core/aop/ataspectj/advice.html#aop-ataspectj-advice-ordering
                      - text: .) No specified ordering means that the AOP subsystem determines the order of the advice.
            - table [ref=e435]:
              - rowgroup [ref=e436]:
                - row [ref=e437]:
                  - cell "Note" [ref=e438]
                  - cell [ref=e440]:
                    - text: The default advice mode for processing
                    - code [ref=e441]: "@Transactional"
                    - text: annotations is
                    - code [ref=e442]: proxy
                    - text: ", which allows for interception of calls through the proxy only. Local calls within the same class cannot get intercepted that way. For a more advanced mode of interception, consider switching to"
                    - code [ref=e443]: aspectj
                    - text: mode in combination with compile-time or load-time weaving.
            - table [ref=e445]:
              - rowgroup [ref=e446]:
                - row [ref=e447]:
                  - cell "Note" [ref=e448]
                  - cell [ref=e450]:
                    - text: The
                    - code [ref=e451]: proxy-target-class
                    - text: attribute controls what type of transactional proxies are created for classes annotated with the
                    - code [ref=e452]: "@Transactional"
                    - text: annotation. If
                    - code [ref=e453]: proxy-target-class
                    - text: is set to
                    - code [ref=e454]: "true"
                    - text: ", class-based proxies are created. If"
                    - code [ref=e455]: proxy-target-class
                    - text: is
                    - code [ref=e456]: "false"
                    - text: or if the attribute is omitted, standard JDK interface-based proxies are created. (See
                    - link "Proxying Mechanisms" [ref=e457] [cursor=pointer]:
                      - /url: ../../../core/aop/proxying.html
                    - text: for a discussion of the different proxy types.)
            - table [ref=e459]:
              - rowgroup [ref=e460]:
                - row [ref=e461]:
                  - cell "Note" [ref=e462]
                  - cell [ref=e464]:
                    - code [ref=e465]: "@EnableTransactionManagement"
                    - text: and
                    - code [ref=e466]: <tx:annotation-driven/>
                    - text: look for
                    - code [ref=e467]: "@Transactional"
                    - text: only on beans in the same application context in which they are defined. This means that, if you put annotation-driven configuration in a
                    - code [ref=e468]: WebApplicationContext
                    - text: for a
                    - code [ref=e469]: DispatcherServlet
                    - text: ", it checks for"
                    - code [ref=e470]: "@Transactional"
                    - text: beans only in your controllers and not in your services. See
                    - link "MVC" [ref=e471] [cursor=pointer]:
                      - /url: ../../../web/webmvc/mvc-servlet.html
                    - text: for more information.
            - paragraph [ref=e473]:
              - text: The most derived location takes precedence when evaluating the transactional settings for a method. In the case of the following example, the
              - code [ref=e474]: DefaultFooService
              - text: class is annotated at the class level with the settings for a read-only transaction, but the
              - code [ref=e475]: "@Transactional"
              - text: annotation on the
              - code [ref=e476]: updateFoo(Foo)
              - text: method in the same class takes precedence over the transactional settings defined at the class level.
            - generic [ref=e478]:
              - tablist [ref=e480]:
                - tab [selected] [ref=e481] [cursor=pointer]:
                  - paragraph [ref=e482]: Java
                - tab [ref=e483] [cursor=pointer]:
                  - paragraph [ref=e484]: Kotlin
              - tabpanel "Java" [ref=e485]:
                - generic [ref=e488]:
                  - code [ref=e489]:
                    - text: java @Transactional(readOnly = true) public
                    - generic [ref=e490]: class DefaultFooService implements FooService
                    - text: "{"
                    - generic [ref=e491]: public Foo getFoo(String fooName)
                    - text: "{ // ... } // these settings have precedence for this method @Transactional(readOnly = false, propagation = Propagation.REQUIRES_NEW)"
                    - generic [ref=e492]: public void updateFoo(Foo foo)
                    - text: "{ // ... } }"
                  - button "Copied!" [ref=e494] [cursor=pointer]
              - text: kotlin
          - generic [ref=e496]:
            - heading [level=2] [ref=e497]:
              - code [ref=e498]: "@Transactional"
              - text: Settings
            - generic [ref=e499]:
              - paragraph [ref=e501]:
                - text: The
                - code [ref=e502]: "@Transactional"
                - text: annotation is metadata that specifies that an interface, class, or method must have transactional semantics (for example, "start a brand new read-only transaction when this method is invoked, suspending any existing transaction"). The default
                - code [ref=e503]: "@Transactional"
                - text: "settings are as follows:"
              - list [ref=e505]:
                - listitem [ref=e506]:
                  - paragraph [ref=e507]:
                    - text: The propagation setting is
                    - code [ref=e508]: PROPAGATION_REQUIRED.
                - listitem [ref=e509]:
                  - paragraph [ref=e510]:
                    - text: The isolation level is
                    - code [ref=e511]: ISOLATION_DEFAULT.
                - listitem [ref=e512]:
                  - paragraph [ref=e513]: The transaction is read-write.
                - listitem [ref=e514]:
                  - paragraph [ref=e515]: The transaction timeout defaults to the default timeout of the underlying transaction system, or to none if timeouts are not supported.
                - listitem [ref=e516]:
                  - paragraph [ref=e517]:
                    - text: Any
                    - code [ref=e518]: RuntimeException
                    - text: or
                    - code [ref=e519]: Error
                    - text: triggers rollback, and any checked
                    - code [ref=e520]: Exception
                    - text: does not.
              - paragraph [ref=e522]:
                - text: You can change these default settings. The following table summarizes the various properties of the
                - code [ref=e523]: "@Transactional"
                - text: "annotation:"
              - table [ref=e524]:
                - caption [ref=e525]: Table 2. @Transactional Settings
                - rowgroup [ref=e530]:
                  - row [ref=e531]:
                    - columnheader "Property" [ref=e532]
                    - columnheader "Type" [ref=e533]
                    - columnheader "Description" [ref=e534]
                - rowgroup [ref=e535]:
                  - row [ref=e536]:
                    - cell [ref=e537]:
                      - paragraph [ref=e538]:
                        - link "value" [ref=e539] [cursor=pointer]:
                          - /url: "#tx-multiple-tx-mgrs-with-attransactional"
                    - cell [ref=e540]:
                      - paragraph [ref=e541]:
                        - code [ref=e542]: String
                    - cell [ref=e543]:
                      - paragraph [ref=e544]: Optional qualifier that specifies the transaction manager to be used.
                  - row [ref=e545]:
                    - cell [ref=e546]:
                      - paragraph [ref=e547]:
                        - code [ref=e548]: transactionManager
                    - cell [ref=e549]:
                      - paragraph [ref=e550]:
                        - code [ref=e551]: String
                    - cell [ref=e552]:
                      - paragraph [ref=e553]:
                        - text: Alias for
                        - code [ref=e554]: value
                        - text: .
                  - row [ref=e555]:
                    - cell [ref=e556]:
                      - paragraph [ref=e557]:
                        - code [ref=e558]: label
                    - cell [ref=e559]:
                      - paragraph [ref=e560]:
                        - text: Array of
                        - code [ref=e561]: String
                        - text: labels to add an expressive description to the transaction.
                    - cell [ref=e562]:
                      - paragraph [ref=e563]: Labels may be evaluated by transaction managers to associate implementation-specific behavior with the actual transaction.
                  - row [ref=e564]:
                    - cell [ref=e565]:
                      - paragraph [ref=e566]:
                        - link "propagation" [ref=e567] [cursor=pointer]:
                          - /url: tx-propagation.html
                    - cell [ref=e568]:
                      - paragraph [ref=e569]:
                        - code [ref=e570]: enum
                        - text: ":"
                        - code [ref=e571]: Propagation
                    - cell [ref=e572]:
                      - paragraph [ref=e573]: Optional propagation setting.
                  - row [ref=e574]:
                    - cell [ref=e575]:
                      - paragraph [ref=e576]:
                        - code [ref=e577]: isolation
                    - cell [ref=e578]:
                      - paragraph [ref=e579]:
                        - code [ref=e580]: enum
                        - text: ":"
                        - code [ref=e581]: Isolation
                    - cell [ref=e582]:
                      - paragraph [ref=e583]:
                        - text: Optional isolation level. Applies only to propagation values of
                        - code [ref=e584]: REQUIRED
                        - text: or
                        - code [ref=e585]: REQUIRES_NEW
                        - text: .
                  - row [ref=e586]:
                    - cell [ref=e587]:
                      - paragraph [ref=e588]:
                        - code [ref=e589]: timeout
                    - cell [ref=e590]:
                      - paragraph [ref=e591]:
                        - code [ref=e592]: int
                        - text: (in seconds of granularity)
                    - cell [ref=e593]:
                      - paragraph [ref=e594]:
                        - text: Optional transaction timeout. Applies only to propagation values of
                        - code [ref=e595]: REQUIRED
                        - text: or
                        - code [ref=e596]: REQUIRES_NEW
                        - text: .
                  - row [ref=e597]:
                    - cell [ref=e598]:
                      - paragraph [ref=e599]:
                        - code [ref=e600]: timeoutString
                    - cell [ref=e601]:
                      - paragraph [ref=e602]:
                        - code [ref=e603]: String
                        - text: (in seconds of granularity)
                    - cell [ref=e604]:
                      - paragraph [ref=e605]:
                        - text: Alternative for specifying the
                        - code [ref=e606]: timeout
                        - text: in seconds as a
                        - code [ref=e607]: String
                        - text: value — for example, as a placeholder.
                  - row [ref=e608]:
                    - cell [ref=e609]:
                      - paragraph [ref=e610]:
                        - code [ref=e611]: readOnly
                    - cell [ref=e612]:
                      - paragraph [ref=e613]:
                        - code [ref=e614]: boolean
                    - cell [ref=e615]:
                      - paragraph [ref=e616]:
                        - text: Read-write versus read-only transaction. Only applicable to values of
                        - code [ref=e617]: REQUIRED
                        - text: or
                        - code [ref=e618]: REQUIRES_NEW
                        - text: .
                  - row [ref=e619]:
                    - cell [ref=e620]:
                      - paragraph [ref=e621]:
                        - code [ref=e622]: rollbackFor
                    - cell [ref=e623]:
                      - paragraph [ref=e624]:
                        - text: Array of
                        - code [ref=e625]: Class
                        - text: objects, which must be derived from
                        - code [ref=e626]: Throwable.
                    - cell [ref=e627]:
                      - paragraph [ref=e628]: Optional array of exception types that must cause rollback.
                  - row [ref=e629]:
                    - cell [ref=e630]:
                      - paragraph [ref=e631]:
                        - code [ref=e632]: rollbackForClassName
                    - cell [ref=e633]:
                      - paragraph [ref=e634]: Array of exception name patterns.
                    - cell [ref=e635]:
                      - paragraph [ref=e636]: Optional array of exception name patterns that must cause rollback.
                  - row [ref=e637]:
                    - cell [ref=e638]:
                      - paragraph [ref=e639]:
                        - code [ref=e640]: noRollbackFor
                    - cell [ref=e641]:
                      - paragraph [ref=e642]:
                        - text: Array of
                        - code [ref=e643]: Class
                        - text: objects, which must be derived from
                        - code [ref=e644]: Throwable.
                    - cell [ref=e645]:
                      - paragraph [ref=e646]: Optional array of exception types that must not cause rollback.
                  - row [ref=e647]:
                    - cell [ref=e648]:
                      - paragraph [ref=e649]:
                        - code [ref=e650]: noRollbackForClassName
                    - cell [ref=e651]:
                      - paragraph [ref=e652]: Array of exception name patterns.
                    - cell [ref=e653]:
                      - paragraph [ref=e654]: Optional array of exception name patterns that must not cause rollback.
              - table [ref=e656]:
                - rowgroup [ref=e657]:
                  - row [ref=e658]:
                    - cell "Tip" [ref=e659]
                    - cell [ref=e661]:
                      - text: See
                      - link "Rollback rules" [ref=e662] [cursor=pointer]:
                        - /url: rolling-back.html#transaction-declarative-rollback-rules
                      - text: for further details on rollback rule semantics, patterns, and warnings regarding possible unintentional matches for pattern-based rollback rules.
              - table [ref=e664]:
                - rowgroup [ref=e665]:
                  - row [ref=e666]:
                    - cell "Note" [ref=e667]
                    - cell [ref=e669]:
                      - paragraph [ref=e671]:
                        - text: As of 6.2, you can globally change the default rollback behavior – for example, through
                        - code [ref=e672]: "@EnableTransactionManagement(rollbackOn=ALL_EXCEPTIONS)"
                        - text: ", leading to a rollback for all exceptions raised within a transaction, including any checked exception. For further customizations,"
                        - code [ref=e673]: AnnotationTransactionAttributeSource
                        - text: provides an
                        - code [ref=e674]: addDefaultRollbackRule(RollbackRuleAttribute)
                        - text: method for custom default rules.
                      - paragraph [ref=e676]:
                        - text: Note that transaction-specific rollback rules override the default behavior but retain the chosen default for unspecified exceptions. This is the case for Spring’s
                        - code [ref=e677]: "@Transactional"
                        - text: as well as JTA’s
                        - code [ref=e678]: jakarta.transaction.Transactional
                        - text: annotation.
                      - paragraph [ref=e680]:
                        - text: Unless you rely on EJB-style business exceptions with commit behavior, it is advisable to switch to
                        - code [ref=e681]: ALL_EXCEPTIONS
                        - text: for consistent rollback semantics even in case of a (potentially accidental) checked exception. Also, it is advisable to make that switch for Kotlin-based applications where there is no enforcement of checked exceptions at all.
              - paragraph [ref=e683]:
                - text: Currently, you cannot have explicit control over the name of a transaction, where 'name' means the transaction name that appears in a transaction monitor and in logging output. For declarative transactions, the transaction name is always the fully-qualified class name of the transactionally advised class +
                - code [ref=e684]: .
                - text: + the method name. For example, if the
                - code [ref=e685]: handlePayment(..)
                - text: method of the
                - code [ref=e686]: BusinessService
                - text: class started a transaction, the name of the transaction would be
                - code [ref=e687]: com.example.BusinessService.handlePayment
                - text: .
          - generic [ref=e688]:
            - heading [level=2] [ref=e689]:
              - text: Multiple Transaction Managers with
              - code [ref=e690]: "@Transactional"
            - generic [ref=e691]:
              - paragraph [ref=e693]:
                - text: Most Spring applications need only a single transaction manager, but there may be situations where you want multiple independent transaction managers in a single application. You can use the
                - code [ref=e694]: value
                - text: or
                - code [ref=e695]: transactionManager
                - text: attribute of the
                - code [ref=e696]: "@Transactional"
                - text: annotation to optionally specify the identity of the
                - code [ref=e697]: TransactionManager
                - text: "to be used. This can either be the bean name or the qualifier value of the transaction manager bean. For example, using the qualifier notation, you can combine the following Java code with the following transaction manager bean declarations in the application context:"
              - generic [ref=e699]:
                - tablist [ref=e701]:
                  - tab [selected] [ref=e702] [cursor=pointer]:
                    - paragraph [ref=e703]: Java
                  - tab [ref=e704] [cursor=pointer]:
                    - paragraph [ref=e705]: Kotlin
                - tabpanel "Java" [ref=e706]:
                  - generic [ref=e709]:
                    - code [ref=e710]:
                      - text: java public
                      - generic [ref=e711]: class TransactionalService
                      - text: "{ @Transactional(\"order\")"
                      - generic [ref=e712]: public void setSomething(String name)
                      - text: "{ ... } @Transactional(\"account\")"
                      - generic [ref=e713]: public void doSomething()
                      - text: "{ ... } @Transactional(\"reactive-account\")"
                      - generic [ref=e714]: public Mono<Void> doSomethingReactive()
                      - text: "{ ... } }"
                    - button "Copied!" [ref=e716] [cursor=pointer]
                - text: kotlin
              - paragraph [ref=e719]: "The following listing shows the bean declarations:"
              - generic [ref=e722]:
                - code [ref=e723]:
                  - text: xml
                  - generic [ref=e724]: <tx:annotation-driven/>
                  - generic [ref=e725]: <bean id="transactionManager1" class="org.springframework.jdbc.support.JdbcTransactionManager">
                  - text: ...
                  - generic [ref=e726]: <qualifier value="order"/>
                  - generic [ref=e727]: </bean>
                  - generic [ref=e728]: <bean id="transactionManager2" class="org.springframework.jdbc.support.JdbcTransactionManager">
                  - text: ...
                  - generic [ref=e729]: <qualifier value="account"/>
                  - generic [ref=e730]: </bean>
                  - generic [ref=e731]: <bean id="transactionManager3" class="org.springframework.data.r2dbc.connection.R2dbcTransactionManager">
                  - text: ...
                  - generic [ref=e732]: <qualifier value="reactive-account"/>
                  - generic [ref=e733]: </bean>
                - button "Copied!" [ref=e735] [cursor=pointer]
              - paragraph [ref=e738]:
                - text: In this case, the individual methods on
                - code [ref=e739]: TransactionalService
                - text: run under separate transaction managers, differentiated by the
                - code [ref=e740]: order
                - text: ","
                - code [ref=e741]: account
                - text: ", and"
                - code [ref=e742]: reactive-account
                - text: qualifiers. The default
                - code [ref=e743]: <tx:annotation-driven>
                - text: target bean name,
                - code [ref=e744]: transactionManager
                - text: ", is still used if no specifically qualified"
                - code [ref=e745]: TransactionManager
                - text: bean is found.
              - table [ref=e747]:
                - rowgroup [ref=e748]:
                  - row [ref=e749]:
                    - cell "Tip" [ref=e750]
                    - cell [ref=e752]:
                      - paragraph [ref=e754]:
                        - text: If all transactional methods on the same class share the same qualifier, consider declaring a type-level
                        - code [ref=e755]: org.springframework.beans.factory.annotation.Qualifier
                        - text: annotation instead. If its value matches the qualifier value (or bean name) of a specific transaction manager, that transaction manager is going to be used for transaction definitions without a specific qualifier on
                        - code [ref=e756]: "@Transactional"
                        - text: itself.
                      - paragraph [ref=e758]: Such a type-level qualifier can be declared on the concrete class, applying to transaction definitions from a base class as well. This effectively overrides the default transaction manager choice for any unqualified base class methods.
                      - paragraph [ref=e760]: Last but not least, such a type-level bean qualifier can serve multiple purposes, for example, with a value of "order" it can be used for autowiring purposes (identifying the order repository) as well as transaction manager selection, as long as the target beans for autowiring as well as the associated transaction manager definitions declare the same qualifier value. Such a qualifier value only needs to be unique within a set of type-matching beans, not having to serve as an ID.
          - generic [ref=e761]:
            - heading "Custom Composed Annotations" [level=2] [ref=e762]
            - generic [ref=e763]:
              - paragraph [ref=e765]:
                - text: If you find you repeatedly use the same attributes with
                - code [ref=e766]: "@Transactional"
                - text: on many different methods,
                - link "Spring’s meta-annotation support" [ref=e767] [cursor=pointer]:
                  - /url: ../../../core/beans/classpath-scanning.html#beans-meta-annotations
                - text: "lets you define custom composed annotations for your specific use cases. For example, consider the following annotation definitions:"
              - generic [ref=e769]:
                - tablist [ref=e771]:
                  - tab [selected] [ref=e772] [cursor=pointer]:
                    - paragraph [ref=e773]: Java
                  - tab [ref=e774] [cursor=pointer]:
                    - paragraph [ref=e775]: Kotlin
                - tabpanel "Java" [ref=e776]:
                  - generic [ref=e779]:
                    - code [ref=e780]: "java @Target({ElementType.METHOD, ElementType.TYPE}) @Retention(RetentionPolicy.RUNTIME) @Transactional(transactionManager = \"order\", label = \"causal-consistency\") public @interface OrderTx { } @Target({ElementType.METHOD, ElementType.TYPE}) @Retention(RetentionPolicy.RUNTIME) @Transactional(transactionManager = \"account\", label = \"retryable\") public @interface AccountTx { }"
                    - button "Copied!" [ref=e782] [cursor=pointer]
                - text: kotlin
              - paragraph [ref=e785]: "The preceding annotations let us write the example from the previous section as follows:"
              - generic [ref=e787]:
                - tablist [ref=e789]:
                  - tab [selected] [ref=e790] [cursor=pointer]:
                    - paragraph [ref=e791]: Java
                  - tab [ref=e792] [cursor=pointer]:
                    - paragraph [ref=e793]: Kotlin
                - tabpanel "Java" [ref=e794]:
                  - generic [ref=e797]:
                    - code [ref=e798]:
                      - text: java public
                      - generic [ref=e799]: class TransactionalService
                      - text: "{ @OrderTx"
                      - generic [ref=e800]: public void setSomething(String name)
                      - text: "{ // ... } @AccountTx"
                      - generic [ref=e801]: public void doSomething()
                      - text: "{ // ... } }"
                    - button "Copied!" [ref=e803] [cursor=pointer]
                - text: kotlin
              - paragraph [ref=e806]: In the preceding example, we used the syntax to define the transaction manager qualifier and transactional labels, but we could also have included propagation behavior, rollback rules, timeouts, and other features.
