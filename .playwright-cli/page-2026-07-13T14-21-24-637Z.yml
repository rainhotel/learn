          - paragraph [ref=e570]:
            - text: Several mechanisms can produce the reordering in
            - link "Table 17.4-B" [ref=e571] [cursor=pointer]:
              - /url: jls-17.html#jls-17.4-B
            - text: . A Just-In-Time compiler in a Java Virtual Machine implementation may rearrange code, or the processor. In addition, the memory hierarchy of the architecture on which a Java Virtual Machine implementation is run may make it appear as if code is being reordered. In this chapter, we shall refer to anything that can reorder code as a
            - emphasis [ref=e573]: compiler
            - text: .
          - paragraph [ref=e574]:
            - text: Another example of surprising results can be seen in
