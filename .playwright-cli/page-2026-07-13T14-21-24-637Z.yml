      - generic [ref=e947]:
        - heading "17.4.5. Happens-before Order" [level=3] [ref=e951]
        - paragraph [ref=e952]:
          - text: Two actions can be ordered by a
          - emphasis [ref=e954]: happens-before
          - text: relationship. If one action
