    - paragraph [ref=e112]:
      - text: While most of the discussion in the preceding chapters is concerned only with the behavior of code as executed a single statement or expression at a time, that is, by a single
      - emphasis [ref=e114]: thread
      - text: ", the Java Virtual Machine can support many threads of execution at once. These threads independently execute code that operates on values and objects residing in a shared main memory. Threads may be supported by having many hardware processors, by time-slicing a single hardware processor, or by time-slicing many hardware processors."
    - paragraph [ref=e115]:
      - text: Threads are represented by the
      - code [ref=e116]: Thread
      - text: class. The only way for a user to create a thread is to create an object of this class; each thread is associated with such an object. A thread will start when the
      - code [ref=e117]: start()
      - text: method is invoked on the corresponding
      - code [ref=e118]: Thread
      - text: object.
    - paragraph [ref=e119]:
      - text: The behavior of threads, particularly when not correctly synchronized, can be confusing and counterintuitive. This chapter describes the semantics of multithreaded programs; it includes rules for which values may be seen by a read of shared memory that is updated by multiple threads. As the specification is similar to the
      - emphasis [ref=e121]: memory models
      - text: for different hardware architectures, these semantics are known as the
      - emphasis [ref=e123]: Java programming language memory model
      - text: . When no confusion can arise, we will simply refer to these rules as "the memory model".
    - paragraph [ref=e124]: These semantics do not prescribe how a multithreaded program should be executed. Rather, they describe the behaviors that multithreaded programs are allowed to exhibit. Any execution strategy that generates only allowed behaviors is an acceptable execution strategy.
    - generic [ref=e125]:
      - heading "17.1. Synchronization" [level=2] [ref=e129]
      - paragraph [ref=e130]:
        - text: The Java programming language provides multiple mechanisms for communicating between threads. The most basic of these methods is
        - emphasis [ref=e132]: synchronization
        - text: ", which is implemented using"
        - emphasis [ref=e134]: monitors
        - text: . Each object in Java is associated with a monitor, which a thread can
        - emphasis [ref=e136]: lock
        - text: or
        - emphasis [ref=e138]: unlock
        - text: . Only one thread at a time may hold a lock on a monitor. Any other threads attempting to lock that monitor are blocked until they can obtain a lock on that monitor. A thread
        - emphasis [ref=e140]: t
        - text: may lock a particular monitor multiple times; each unlock reverses the effect of one lock operation.
      - paragraph [ref=e141]:
        - text: The
        - code [ref=e142]: synchronized
        - text: statement (
        - link "§14.19" [ref=e143] [cursor=pointer]:
          - /url: jls-14.html#jls-14.19
        - text: ) computes a reference to an object; it then attempts to perform a lock action on that object's monitor and does not proceed further until the lock action has successfully completed. After the lock action has been performed, the body of the
        - code [ref=e144]: synchronized
        - text: statement is executed. If execution of the body is ever completed, either normally or abruptly, an unlock action is automatically performed on that same monitor.
      - paragraph [ref=e145]:
        - text: A
        - code [ref=e146]: synchronized
        - text: method (
        - link "§8.4.3.6" [ref=e147] [cursor=pointer]:
          - /url: jls-8.html#jls-8.4.3.6
        - text: ) automatically performs a lock action when it is invoked; its body is not executed until the lock action has successfully completed. If the method is an instance method, it locks the monitor associated with the instance for which it was invoked (that is, the object that will be known as
        - code [ref=e148]: this
        - text: during execution of the body of the method). If the method is
        - code [ref=e149]: static
        - text: ", it locks the monitor associated with the"
        - code [ref=e150]: Class
        - text: object that represents the class in which the method is defined. If execution of the method's body is ever completed, either normally or abruptly, an unlock action is automatically performed on that same monitor.
      - paragraph [ref=e151]: The Java programming language neither prevents nor requires detection of deadlock conditions. Programs where threads hold (directly or indirectly) locks on multiple objects should use conventional techniques for deadlock avoidance, creating higher-level locking primitives that do not deadlock, if necessary.
      - paragraph [ref=e152]:
        - text: Other mechanisms, such as reads and writes of
        - code [ref=e153]: volatile
        - text: variables and the use of classes in the
        - code [ref=e154]: java.util.concurrent
        - text: package, provide alternative ways of synchronization.
