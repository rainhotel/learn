      - heading "17.6. Word Tearing" [level=2] [ref=e2308]
      - paragraph [ref=e2309]: One consideration for implementations of the Java Virtual Machine is that every field and array element is considered distinct; updates to one field or element must not interact with reads or updates of any other field or element. In particular, two threads that update adjacent elements of a byte array separately must not interfere or interact and do not need synchronization to ensure sequential consistency.
