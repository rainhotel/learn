            - text: . This program uses local variables
            - code [ref=e500]: r1
            - text: and
            - code [ref=e501]: r2
            - text: and shared variables
            - code [ref=e502]: A
            - text: and
            - code [ref=e503]: B
            - text: . Initially,
            - code [ref=e504]: A == B == 0
            - text: .
          - generic [ref=e505]:
