          - paragraph [ref=e557]: "To some programmers, this behavior may seem \"broken\". However, it should be noted that this code is improperly synchronized:"
          - list [ref=e559]:
            - listitem [ref=e560]:
              - paragraph [ref=e561]: there is a write in one thread,
            - listitem [ref=e562]:
              - paragraph [ref=e563]: a read of the same variable by another thread,
