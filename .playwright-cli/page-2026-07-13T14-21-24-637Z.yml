        - generic [ref=e1798]:
          - paragraph [ref=e1799]: Example 17.4.8-1. Happens-before Consistency Is Not Sufficient
          - generic [ref=e1800]:
            - paragraph [ref=e1801]:
              - text: Happens-before consistency is a necessary, but not sufficient, set of constraints. Merely enforcing happens-before consistency would allow for unacceptable behaviors - those that violate the requirements we have established for programs. For example, happens-before consistency allows values to appear "out of thin air". This can be seen by a detailed examination of the trace in
              - link "Table 17.4.8-A" [ref=e1802] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.8-A
              - text: .
            - generic [ref=e1803]:
              - paragraph [ref=e1804]: Table 17.4.8-A. Happens-before consistency is not sufficient
              - table "Happens-before consistency is not sufficient" [ref=e1806]:
                - rowgroup [ref=e1810]:
                  - row [ref=e1811]:
                    - columnheader "Thread 1" [ref=e1812]
                    - columnheader "Thread 2" [ref=e1813]
                - rowgroup [ref=e1814]:
                  - row [ref=e1815]:
                    - cell [ref=e1816]:
                      - code [ref=e1817]: r1 = x;
                    - cell [ref=e1818]:
                      - code [ref=e1819]: r2 = y;
                  - row [ref=e1820]:
                    - cell [ref=e1821]:
                      - code [ref=e1822]: if (r1 != 0) y = 1;
                    - cell [ref=e1823]:
                      - code [ref=e1824]: if (r2 != 0) x = 1;
            - paragraph [ref=e1825]:
              - text: The code shown in
              - link "Table 17.4.8-A" [ref=e1826] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.8-A
              - text: "is correctly synchronized. This may seem surprising, since it does not perform any synchronization actions. Remember, however, that a program is correctly synchronized if, when it is executed in a sequentially consistent manner, there are no data races. If this code is executed in a sequentially consistent way, each action will occur in program order, and neither of the writes will occur. Since no writes occur, there can be no data races: the program is correctly synchronized."
            - paragraph [ref=e1827]: "Since this program is correctly synchronized, the only behaviors we can allow are sequentially consistent behaviors. However, there is an execution of this program that is happens-before consistent, but not sequentially consistent:"
            - generic [ref=e1828]: r1 = x; // sees write of x = 1 y = 1; r2 = y; // sees write of y = 1 x = 1;
            - paragraph [ref=e1829]: "This result is happens-before consistent: there is no happens-before relationship that prevents it from occurring. However, it is clearly not acceptable: there is no sequentially consistent execution that would result in this behavior. The fact that we allow a read to see a write that comes later in the execution order can sometimes thus result in unacceptable behaviors."
            - paragraph [ref=e1830]:
              - text: Although allowing reads to see writes that come later in the execution order is sometimes undesirable, it is also sometimes necessary. As we saw above, the trace in
              - link "Table 17.4.5-A" [ref=e1831] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.5-A
              - text: requires some reads to see writes that occur later in the execution order. Since the reads come first in each thread, the very first action in the execution order must be a read. If that read cannot see a write that occurs later, then it cannot see any value other than the initial value for the variable it reads. This is clearly not reflective of all behaviors.
            - paragraph [ref=e1832]:
              - text: We refer to the issue of when reads can see future writes as
              - emphasis [ref=e1834]: causality
              - text: ", because of issues that arise in cases like the one found in"
              - link "Table 17.4.8-A" [ref=e1835] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.8-A
              - text: . In that case, the reads cause the writes to occur, and the writes cause the reads to occur. There is no "first cause" for the actions. Our memory model therefore needs a consistent way of determining which reads can see writes early.
            - paragraph [ref=e1836]:
              - text: Examples such as the one found in
              - link "Table 17.4.8-A" [ref=e1837] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.8-A
              - text: demonstrate that the specification must be careful when stating whether a read can see a write that occurs later in the execution (bearing in mind that if a read sees a write that occurs later in the execution, it represents the fact that the write is actually performed early).
            - paragraph [ref=e1838]: The memory model takes as input a given execution, and a program, and determines whether that execution is a legal execution of the program. It does this by gradually building a set of "committed" actions that reflect which actions were executed by the program. Usually, the next action to be committed will reflect the next action that can be performed by a sequentially consistent execution. However, to reflect reads that need to see later writes, we allow some actions to be committed earlier than other actions that happen-before them.
            - paragraph [ref=e1839]:
              - text: Obviously, some actions may be committed early and some may not. If, for example, one of the writes in
              - link "Table 17.4.8-A" [ref=e1840] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.8-A
              - text: were committed before the read of that variable, the read could see the write, and the "out-of-thin-air" result could occur. Informally, we allow an action to be committed early if we know that the action can occur without assuming some data race occurs. In
              - link "Table 17.4.8-A" [ref=e1841] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.8-A
              - text: ", we cannot perform either write early, because the writes cannot occur unless the reads see the result of a data race."
      - generic [ref=e1842]:
        - heading "17.4.9. Observable Behavior and Nonterminating Executions" [level=3] [ref=e1846]
        - paragraph [ref=e1847]: For programs that always terminate in some bounded finite period of time, their behavior can be understood (informally) simply in terms of their allowable executions. For programs that can fail to terminate in a bounded amount of time, more subtle issues arise.
        - paragraph [ref=e1848]:
          - text: The observable behavior of a program is defined by the finite sets of external actions that the program may perform. A program that, for example, simply prints "Hello" forever is described by a set of behaviors that for any non-negative integer
          - emphasis [ref=e1850]: i
          - text: ", includes the behavior of printing \"Hello\""
          - emphasis [ref=e1852]: i
          - text: times.
        - paragraph [ref=e1853]:
          - text: Termination is not explicitly modeled as a behavior, but a program can easily be extended to generate an additional external action
          - emphasis [ref=e1855]: executionTermination
          - text: that occurs when all threads have terminated.
        - paragraph [ref=e1856]:
          - text: We also define a special
          - emphasis [ref=e1858]: hang
          - text: action. If behavior is described by a set of external actions including a
          - emphasis [ref=e1860]: hang
          - text: action, it indicates a behavior where after the external actions are observed, the program can run for an unbounded amount of time without performing any additional external actions or terminating. Programs can hang if all threads are blocked or if the program can perform an unbounded number of actions without performing any external actions.
        - paragraph [ref=e1861]: A thread can be blocked in a variety of circumstances, such as when it is attempting to acquire a lock or perform an external action (such as a read) that depends on external data.
        - paragraph [ref=e1862]: An execution may result in a thread being blocked indefinitely and the execution's not terminating. In such cases, the actions generated by the blocked thread must consist of all actions generated by that thread up to and including the action that caused the thread to be blocked, and no actions that would be generated by the thread after that action.
        - paragraph [ref=e1863]: To reason about observable behaviors, we need to talk about sets of observable actions.
        - paragraph [ref=e1864]:
          - text: If
          - emphasis [ref=e1866]: O
          - text: is a set of observable actions for an execution
          - emphasis [ref=e1868]: E
          - text: ", then set"
          - emphasis [ref=e1870]: O
          - text: must be a subset of
          - emphasis [ref=e1872]: E
          - text: "'s actions,"
          - emphasis [ref=e1874]: A
          - text: ", and must contain only a finite number of actions, even if"
          - emphasis [ref=e1876]: A
          - text: contains an infinite number of actions. Furthermore, if an action
          - emphasis [ref=e1878]: "y"
          - text: is in
          - emphasis [ref=e1880]: O
          - text: ", and either"
          - emphasis [ref=e1882]: hb(x, y)
          - text: or
          - emphasis [ref=e1884]: so(x, y)
          - text: ", then"
          - emphasis [ref=e1886]: x
          - text: is in
          - emphasis [ref=e1888]: O
          - text: .
