        - paragraph [ref=e1057]:
          - text: When a program contains two conflicting accesses (
          - link "§17.4.1" [ref=e1058] [cursor=pointer]:
            - /url: jls-17.html#jls-17.4.1
          - text: ) that are not ordered by a happens-before relationship, it is said to contain a
          - emphasis [ref=e1060]: data race
          - text: .
        - paragraph [ref=e1061]:
          - text: The semantics of operations other than inter-thread actions, such as reads of array lengths (
          - link "§10.7" [ref=e1062] [cursor=pointer]:
            - /url: jls-10.html#jls-10.7
          - text: ), executions of checked casts (
          - link "§5.5" [ref=e1063] [cursor=pointer]:
            - /url: jls-5.html#jls-5.5
          - text: ","
          - link "§15.16" [ref=e1064] [cursor=pointer]:
            - /url: jls-15.html#jls-15.16
          - text: ), and invocations of virtual methods (
          - link "§15.12" [ref=e1065] [cursor=pointer]:
            - /url: jls-15.html#jls-15.12
          - text: ), are not directly affected by data races.
        - paragraph [ref=e1066]: Therefore, a data race cannot cause incorrect behavior such as returning the wrong length for an array.
        - paragraph [ref=e1067]:
          - text: A program is
          - emphasis [ref=e1069]: correctly synchronized
          - text: if and only if all sequentially consistent executions are free of data races.
        - paragraph [ref=e1070]:
          - text: If a program is correctly synchronized, then all executions of the program will appear to be sequentially consistent (
          - link "§17.4.3" [ref=e1071] [cursor=pointer]:
            - /url: jls-17.html#jls-17.4.3
          - text: ).
        - paragraph [ref=e1072]: This is an extremely strong guarantee for programmers. Programmers do not need to reason about reorderings to determine that their code contains data races. Therefore they do not need to reason about reorderings when determining whether their code is correctly synchronized. Once the determination that the code is correctly synchronized is made, the programmer does not need to worry that reorderings will affect his or her code.
        - paragraph [ref=e1073]: A program must be correctly synchronized to avoid the kinds of counterintuitive behaviors that can be observed when code is reordered. The use of correct synchronization does not ensure that the overall behavior of a program is correct. However, its use does allow a programmer to reason about the possible behaviors of a program in a simple way; the behavior of a correctly synchronized program is much less dependent on possible reorderings. Without correct synchronization, very strange, confusing and counterintuitive behaviors are possible.
        - paragraph [ref=e1074]:
