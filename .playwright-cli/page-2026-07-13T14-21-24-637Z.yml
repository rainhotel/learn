          - emphasis [ref=e1025]: sufficient
          - text: if it is the minimal set such that the transitive closure of
          - emphasis [ref=e1027]: S
          - text: with the program order determines all of the
          - emphasis [ref=e1029]: happens-before
          - text: edges in the execution. This set is unique.
        - paragraph [ref=e1030]: "It follows from the above definitions that:"
        - list [ref=e1032]:
          - listitem [ref=e1033]:
            - paragraph [ref=e1034]:
              - text: An unlock on a monitor
