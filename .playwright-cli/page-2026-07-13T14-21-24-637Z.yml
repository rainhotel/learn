            - /url: jls-17.html#jls-17.2.1
          - text: ) have lock and unlock actions associated with them; their
          - emphasis [ref=e1008]: happens-before
          - text: relationships are defined by these associated actions.
        - paragraph [ref=e1009]:
          - text: It should be noted that the presence of a
          - emphasis [ref=e1011]: happens-before
          - text: relationship between two actions does not necessarily imply that they have to take place in that order in an implementation. If the reordering produces results consistent with a legal execution, it is not illegal.
        - paragraph [ref=e1012]: For example, the write of a default value to every field of an object constructed by a thread need not happen before the beginning of that thread, as long as no read ever observes that fact.
        - paragraph [ref=e1013]:
          - text: More specifically, if two actions share a
          - emphasis [ref=e1015]: happens-before
          - text: relationship, they do not necessarily have to appear to have happened in that order to any code with which they do not share a
          - emphasis [ref=e1017]: happens-before
          - text: relationship. Writes in one thread that are in a data race with reads in another thread may, for example, appear to occur out of order to those reads.
        - paragraph [ref=e1018]:
          - text: The
          - emphasis [ref=e1020]: happens-before
          - text: relation defines when data races take place.
        - paragraph [ref=e1021]:
          - text: A set of synchronization edges,
          - emphasis [ref=e1023]: S
