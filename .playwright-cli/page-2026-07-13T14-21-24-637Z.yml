    - generic [ref=e484]:
      - heading "17.4. Memory Model" [level=2] [ref=e488]
      - paragraph [ref=e489]:
        - text: A
        - emphasis [ref=e491]: memory model
        - text: describes, given a program and an execution trace of that program, whether the execution trace is a legal execution of the program. The Java programming language memory model works by examining each read in an execution trace and checking that the write observed by that read is valid according to certain rules.
      - paragraph [ref=e492]: The memory model describes possible behaviors of a program. An implementation is free to produce any code it likes, as long as all resulting executions of a program produce a result that can be predicted by the memory model.
      - paragraph [ref=e493]: This provides a great deal of freedom for the implementor to perform a myriad of code transformations, including the reordering of actions and removal of unnecessary synchronization.
      - generic [ref=e494]:
        - paragraph [ref=e495]: Example 17.4-1. Incorrectly Synchronized Programs May Exhibit Surprising Behavior
        - generic [ref=e496]:
          - paragraph [ref=e497]: The semantics of the Java programming language allow compilers and microprocessors to perform optimizations that can interact with incorrectly synchronized code in ways that can produce behaviors that seem paradoxical. Here are some examples of how incorrectly synchronized programs may exhibit surprising behaviors.
          - paragraph [ref=e498]:
            - text: Consider, for example, the example program traces shown in
            - link "Table 17.4-A" [ref=e499] [cursor=pointer]:
