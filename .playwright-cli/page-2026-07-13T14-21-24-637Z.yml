    - generic [ref=e462]:
      - heading "17.3. Sleep and Yield" [level=2] [ref=e466]
      - paragraph [ref=e467]:
        - code [ref=e468]: Thread.sleep
        - text: causes the currently executing thread to sleep (temporarily cease execution) for the specified duration, subject to the precision and accuracy of system timers and schedulers. The thread does not lose ownership of any monitors, and resumption of execution will depend on scheduling and the availability of processors on which to execute the thread.
      - paragraph [ref=e469]:
        - text: It is important to note that neither
        - code [ref=e470]: Thread.sleep
        - text: nor
