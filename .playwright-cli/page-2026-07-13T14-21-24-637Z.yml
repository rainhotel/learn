      - paragraph [ref=e665]:
        - text: The memory model determines what values can be read at every point in the program. The actions of each thread in isolation must behave as governed by the semantics of that thread, with the exception that the values seen by each read are determined by the memory model. When we refer to this, we say that the program obeys
        - emphasis [ref=e667]: intra-thread semantics
        - text: . Intra-thread semantics are the semantics for single-threaded programs, and allow the complete prediction of the behavior of a thread based on the values seen by read actions within the thread. To determine if the actions of thread
        - emphasis [ref=e669]: t
        - text: in an execution are legal, we simply evaluate the implementation of thread
        - emphasis [ref=e671]: t
        - text: as it would be performed in a single-threaded context, as defined in the rest of this specification.
      - paragraph [ref=e672]:
        - text: Each time the evaluation of thread
        - emphasis [ref=e674]: t
        - text: generates an inter-thread action, it must match the inter-thread action
        - emphasis [ref=e676]: a
        - text: of
        - emphasis [ref=e678]: t
        - text: that comes next in program order. If
        - emphasis [ref=e680]: a
        - text: is a read, then further evaluation of
        - emphasis [ref=e682]: t
        - text: uses the value seen by
        - emphasis [ref=e684]: a
        - text: as determined by the memory model.
      - paragraph [ref=e685]:
        - text: This section provides the specification of the Java programming language memory model except for issues dealing with
        - code [ref=e686]: final
        - text: fields, which are described in
        - link "§17.5" [ref=e687] [cursor=pointer]:
          - /url: jls-17.html#jls-17.5
        - text: .
      - paragraph [ref=e688]:
        - text: The memory model specified herein is not fundamentally based in the object-oriented nature of the Java programming language. For conciseness and simplicity in our examples, we often exhibit code fragments without class or method definitions, or explicit dereferencing. Most examples consist of two or more threads containing statements with access to local variables, shared global variables, or instance fields of an object. We typically use variables names such as
        - code [ref=e689]: r1
        - text: or
        - code [ref=e690]: r2
        - text: to indicate variables local to a method or thread. Such variables are not accessible by other threads.
      - generic [ref=e691]:
        - heading "17.4.1. Shared Variables" [level=3] [ref=e695]
        - paragraph [ref=e696]:
          - text: Memory that can be shared between threads is called
          - emphasis [ref=e698]: shared memory
          - text: or
          - emphasis [ref=e700]: heap memory
          - text: .
        - paragraph [ref=e701]:
          - text: All instance fields,
          - code [ref=e702]: static
          - text: fields, and array elements are stored in heap memory. In this chapter, we use the term
          - emphasis [ref=e704]: variable
          - text: to refer to both fields and array elements.
        - paragraph [ref=e705]:
          - text: Local variables (
          - link "§14.4" [ref=e706] [cursor=pointer]:
            - /url: jls-14.html#jls-14.4
          - text: ), formal method parameters (
          - link "§8.4.1" [ref=e707] [cursor=pointer]:
            - /url: jls-8.html#jls-8.4.1
          - text: ), and exception handler parameters (
          - link "§14.20" [ref=e708] [cursor=pointer]:
            - /url: jls-14.html#jls-14.20
          - text: ) are never shared between threads and are unaffected by the memory model.
        - paragraph [ref=e709]:
          - text: Two accesses to (reads of or writes to) the same variable are said to be
          - emphasis [ref=e711]: conflicting
          - text: if at least one of the accesses is a write.
      - generic [ref=e712]:
        - heading "17.4.2. Actions" [level=3] [ref=e716]
        - paragraph [ref=e717]:
          - text: An
          - emphasis [ref=e719]: inter-thread action
          - text: "is an action performed by one thread that can be detected or directly influenced by another thread. There are several kinds of inter-thread action that a program may perform:"
        - list [ref=e721]:
          - listitem [ref=e722]:
            - paragraph [ref=e723]:
              - emphasis [ref=e725]: Read
              - text: (normal, or non-volatile). Reading a variable.
          - listitem [ref=e726]:
            - paragraph [ref=e727]:
              - emphasis [ref=e729]: Write
              - text: (normal, or non-volatile). Writing a variable.
          - listitem [ref=e730]:
            - paragraph [ref=e731]:
              - emphasis [ref=e733]: Synchronization actions
              - text: ", which are:"
            - list [ref=e735]:
              - listitem [ref=e736]:
                - paragraph [ref=e737]:
                  - emphasis [ref=e739]: Volatile read
                  - text: . A volatile read of a variable.
              - listitem [ref=e740]:
                - paragraph [ref=e741]:
                  - emphasis [ref=e743]: Volatile write
                  - text: . A volatile write of a variable.
              - listitem [ref=e744]:
                - paragraph [ref=e745]:
                  - emphasis [ref=e747]: Lock
                  - text: . Locking a monitor
              - listitem [ref=e748]:
                - paragraph [ref=e749]:
                  - emphasis [ref=e751]: Unlock
                  - text: . Unlocking a monitor.
              - listitem [ref=e752]:
                - paragraph [ref=e753]: The (synthetic) first and last action of a thread.
              - listitem [ref=e754]:
                - paragraph [ref=e755]:
                  - text: Actions that start a thread or detect that a thread has terminated (
                  - link "§17.4.4" [ref=e756] [cursor=pointer]:
                    - /url: jls-17.html#jls-17.4.4
                  - text: ).
          - listitem [ref=e757]:
            - paragraph [ref=e758]:
              - emphasis [ref=e760]: External Actions
              - text: . An external action is an action that may be observable outside of an execution, and has a result based on an environment external to the execution.
          - listitem [ref=e761]:
            - paragraph [ref=e762]:
              - emphasis [ref=e764]: Thread divergence actions
              - text: (
              - link "§17.4.9" [ref=e765] [cursor=pointer]:
                - /url: jls-17.html#jls-17.4.9
              - text: ). A thread divergence action is only performed by a thread that is in an infinite loop in which no memory, synchronization, or external actions are performed. If a thread performs a thread divergence action, it will be followed by an infinite number of thread divergence actions.
            - paragraph [ref=e766]: Thread divergence actions are introduced to model how a thread may cause all other threads to stall and fail to make progress.
        - paragraph [ref=e767]:
          - text: This specification is only concerned with inter-thread actions. We do not need to concern ourselves with intra-thread actions (e.g., adding two local variables and storing the result in a third local variable). As previously mentioned, all threads need to obey the correct intra-thread semantics for Java programs. We will usually refer to inter-thread actions more succinctly as simply
          - emphasis [ref=e769]: actions
          - text: .
        - paragraph [ref=e770]:
          - text: An action
          - emphasis [ref=e772]: a
          - text: is described by a tuple <
          - emphasis [ref=e774]: t
          - text: ","
          - emphasis [ref=e776]: k
          - text: ","
          - emphasis [ref=e778]: v
          - text: ","
          - emphasis [ref=e780]: u
          - text: ">, comprising:"
        - list [ref=e782]:
          - listitem [ref=e783]:
            - paragraph [ref=e784]:
              - emphasis [ref=e786]: t
              - text: "- the thread performing the action"
          - listitem [ref=e787]:
            - paragraph [ref=e788]:
              - emphasis [ref=e790]: k
              - text: "- the kind of action"
          - listitem [ref=e791]:
            - paragraph [ref=e792]:
              - emphasis [ref=e794]: v
              - text: "- the variable or monitor involved in the action."
            - paragraph [ref=e795]:
              - text: For lock actions,
              - emphasis [ref=e797]: v
              - text: is the monitor being locked; for unlock actions,
              - emphasis [ref=e799]: v
              - text: is the monitor being unlocked.
            - paragraph [ref=e800]:
              - text: If the action is a (volatile or non-volatile) read,
              - emphasis [ref=e802]: v
              - text: is the variable being read.
            - paragraph [ref=e803]:
              - text: If the action is a (volatile or non-volatile) write,
              - emphasis [ref=e805]: v
              - text: is the variable being written.
          - listitem [ref=e806]:
            - paragraph [ref=e807]:
              - emphasis [ref=e809]: u
              - text: "- an arbitrary unique identifier for the action"
        - paragraph [ref=e810]: An external action tuple contains an additional component, which contains the results of the external action as perceived by the thread performing the action. This may be information as to the success or failure of the action, and any values read by the action.
        - paragraph [ref=e811]: Parameters to the external action (e.g., which bytes are written to which socket) are not part of the external action tuple. These parameters are set up by other actions within the thread and can be determined by examining the intra-thread semantics. They are not explicitly discussed in the memory model.
        - paragraph [ref=e812]:
          - text: In non-terminating executions, not all external actions are observable. Non-terminating executions and observable actions are discussed in
          - link "§17.4.9" [ref=e813] [cursor=pointer]:
            - /url: jls-17.html#jls-17.4.9
          - text: .
      - generic [ref=e814]:
        - heading "17.4.3. Programs and Program Order" [level=3] [ref=e818]
        - paragraph [ref=e819]:
          - text: Among all the inter-thread actions performed by each thread
          - emphasis [ref=e821]: t
          - text: ", the"
          - emphasis [ref=e823]: program order
          - text: of
          - emphasis [ref=e825]: t
          - text: is a total order that reflects the order in which these actions would be performed according to the intra-thread semantics of
          - emphasis [ref=e827]: t
          - text: .
        - paragraph [ref=e828]:
          - text: A set of actions is
          - emphasis [ref=e830]: sequentially consistent
          - text: if all actions occur in a total order (the execution order) that is consistent with program order, and furthermore, each read
          - emphasis [ref=e832]: r
          - text: of a variable
          - emphasis [ref=e834]: v
          - text: sees the value written by the write
          - emphasis [ref=e836]: w
          - text: to
          - emphasis [ref=e838]: v
          - text: "such that:"
        - list [ref=e840]:
          - listitem [ref=e841]:
            - paragraph [ref=e842]:
              - emphasis [ref=e844]: w
              - text: comes before
              - emphasis [ref=e846]: r
              - text: in the execution order, and
          - listitem [ref=e847]:
            - paragraph [ref=e848]:
              - text: there is no other write
              - emphasis [ref=e850]: w
              - text: "' such that"
              - emphasis [ref=e852]: w
              - text: comes before
              - emphasis [ref=e854]: w
              - text: "' and"
              - emphasis [ref=e856]: w
              - text: "' comes before"
              - emphasis [ref=e858]: r
              - text: in the execution order.
        - paragraph [ref=e859]: Sequential consistency is a very strong guarantee that is made about visibility and ordering in an execution of a program. Within a sequentially consistent execution, there is a total order over all individual actions (such as reads and writes) which is consistent with the order of the program, and each individual action is atomic and is immediately visible to every thread.
        - paragraph [ref=e860]: If a program has no data races, then all executions of the program will appear to be sequentially consistent.
        - paragraph [ref=e861]: Sequential consistency and/or freedom from data races still allows errors arising from groups of operations that need to be perceived atomically and are not.
        - paragraph [ref=e862]:
          - text: If we were to use sequential consistency as our memory model, many of the compiler and processor optimizations that we have discussed would be illegal. For example, in the trace in
          - link "Table 17.4-C" [ref=e863] [cursor=pointer]:
            - /url: jls-17.html#jls-17.4-C
          - text: ", as soon as the write of"
          - code [ref=e864]: "3"
          - text: to
          - code [ref=e865]: p.x
          - text: occurred, subsequent reads of that location would be required to see that value.
      - generic [ref=e866]:
        - heading "17.4.4. Synchronization Order" [level=3] [ref=e870]
        - paragraph [ref=e871]:
          - text: Every execution has a
          - emphasis [ref=e873]: synchronization order
          - text: . A synchronization order is a total order over all of the synchronization actions of an execution. For each thread
          - emphasis [ref=e875]: t
          - text: ", the synchronization order of the synchronization actions ("
          - link "§17.4.2" [ref=e876] [cursor=pointer]:
            - /url: jls-17.html#jls-17.4.2
          - text: ) in
          - emphasis [ref=e878]: t
          - text: is consistent with the program order (
          - link "§17.4.3" [ref=e879] [cursor=pointer]:
            - /url: jls-17.html#jls-17.4.3
          - text: ) of
          - emphasis [ref=e881]: t
          - text: .
        - paragraph [ref=e882]:
          - text: Synchronization actions induce the
          - emphasis [ref=e884]: synchronized-with
          - text: "relation on actions, defined as follows:"
        - list [ref=e886]:
          - listitem [ref=e887]:
            - paragraph [ref=e888]:
              - text: An unlock action on monitor
              - emphasis [ref=e890]: m
              - emphasis [ref=e892]: synchronizes-with
              - text: all subsequent lock actions on
              - emphasis [ref=e894]: m
              - text: (where "subsequent" is defined according to the synchronization order).
          - listitem [ref=e895]:
            - paragraph [ref=e896]:
              - text: A write to a volatile variable
              - emphasis [ref=e898]: v
