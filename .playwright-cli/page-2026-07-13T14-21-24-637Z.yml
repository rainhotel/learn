        - text: have any synchronization semantics. In particular, the compiler does not have to flush writes cached in registers out to shared memory before a call to
        - code [ref=e472]: Thread.sleep
        - text: or
        - code [ref=e473]: Thread.yield
        - text: ", nor does the compiler have to reload values cached in registers after a call to"
        - code [ref=e474]: Thread.sleep
        - text: or
        - code [ref=e475]: Thread.yield
        - text: .
