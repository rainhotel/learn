          - heading "Meters" [level=1] [ref=e114]
          - paragraph [ref=e116]:
            - text: A
            - code [ref=e117]: Meter
            - text: is the interface for collecting a set of measurements (which we individually call metrics) about your application.
          - paragraph [ref=e119]:
            - text: Micrometer supports a set of
            - code [ref=e120]: Meter
            - text: primitives, including
            - code [ref=e121]: Timer
            - text: ","
            - code [ref=e122]: Counter
            - text: ","
            - code [ref=e123]: Gauge
            - text: ","
            - code [ref=e124]: DistributionSummary
            - text: ","
            - code [ref=e125]: LongTaskTimer
            - text: ","
            - code [ref=e126]: FunctionCounter
            - text: ","
            - code [ref=e127]: FunctionTimer
            - text: ", and"
            - code [ref=e128]: TimeGauge
            - text: . Different meter types result in a different number of time series metrics. For example, while there is a single metric that represents a
            - code [ref=e129]: Gauge
            - text: ", a"
            - code [ref=e130]: Timer
            - text: measures both the count of timed events and the total time of all timed events.
          - table [ref=e132]:
            - rowgroup [ref=e133]:
              - row [ref=e134]:
                - cell "Tip" [ref=e135]
                - cell [ref=e137]:
                  - text: Recording a measurement for a
                  - code [ref=e138]: Meter
                  - text: is expected to be a relatively cheap operation and should not throw any exception. If the
                  - link "registry" [ref=e139] [cursor=pointer]:
                    - /url: registry.html
                  - text: supports publishing metrics to a monitoring system, this is done in a separate thread and should not affect recording metrics.
          - paragraph [ref=e141]:
            - text: A meter is uniquely identified by its name and dimensions. We use the terms, “dimensions” and “tags,” interchangeably, and the Micrometer interface is
            - code [ref=e142]: Tag
            - text: simply because it is shorter. As a general rule, it should be possible to use the name as a pivot. Dimensions let a particular named metric be sliced to drill down and reason about the data. This means that, if only the name is selected, you can drill down by using other dimensions and reason about the value being shown.
          - navigation [ref=e143]:
