            - generic [ref=e131]: "Version: 5.0"
            - generic [ref=e132]:
              - heading "Ordered Message" [level=1] [ref=e133]
              - paragraph [ref=e134]: Ordered messages are a type of message with advanced features in Apache RocketMQ. This topic describes the scenarios, working mechanism, limits, usage examples, and usage notes of ordered messages.
              - heading [level=2] [ref=e135]:
                - text: Scenarios
                - link "Direct link to heading" [ref=e136] [cursor=pointer]:
                  - /url: "#scenarios"
                  - text: "#"
              - paragraph [ref=e137]: Heterogeneous systems use state synchronization to maintain strong consistency in scenarios such as ordered event processing, transaction matchmaking, and real-time incremental data synchronization. The preceding scenarios require ordered delivery of messages from upstream applications to downstream applications when an event change occurs. Apache RocketMQ provides ordered messages to help you implement ordered message transmission.
              - paragraph [ref=e138]:
                - strong [ref=e139]: "Scenario 1: Transaction matchmaking"
                - img "交易撮合" [ref=e140]
              - paragraph [ref=e141]: For example, in securities and stock trading scenarios, if multiple bidders offer the same bid price for a bid order, the bidder who first offers the bid price wins the bid. Therefore, the downstream order processing system must be designed to process orders in the order in which prices were offered.
              - paragraph [ref=e142]:
                - strong [ref=e143]: "Scenario 2: Real-time incremental data synchronization"
              - paragraph [ref=e144]:
                - text: Normal message
                - img "普通消息" [ref=e145]
                - text: Fifo message
                - img "顺序消息" [ref=e146]
              - paragraph [ref=e147]: For example, you want to perform incremental synchronization of data that is related to database modifications. You can use ordered messages provided in Apache RocketMQ to transmit messages from the upstream source database to the downstream query system. The messages can be binary logs of addition, deletion, and modification operations. The downstream system retrieves the messages in the order in which the messages are sent to make the database status updated in the same order. Ordered messages help you ensure consistency between the operations in the upstream system and the status data in the downstream system. If you use normal messages in this scenario, state inconsistency may occur.
              - heading [level=2] [ref=e148]:
                - text: Working mechanism
                - link "Direct link to heading" [ref=e149] [cursor=pointer]:
                  - /url: "#working-mechanism"
                  - text: "#"
              - paragraph [ref=e150]:
                - strong [ref=e151]: Definition of ordered messages
              - paragraph [ref=e152]: Ordered messages are an advanced type of message in Apache RocketMQ. Ordered messages are delivered to consumers in the order in which the messages are sent. This message type allows you to implement ordered processing in business scenarios.
              - paragraph [ref=e153]: The defining characteristics of ordered messages are the order of message sending, storage, and delivery.
              - paragraph [ref=e154]: Apache RocketMQ uses message groups to determine the order of ordered messages. You must configure message groups for ordered messages. The messages in a message group are processed in the first-in, first-out (FIFO) order. Message ordering does not apply to different message groups or messages that are not in a message group.
              - paragraph [ref=e155]: Message group-based message ordering allows you to specify fine-grained message ordering based on your business logic. This helps you implement partial message ordering in your business system and improve the degree of concurrency and throughput of the business system.
              - paragraph [ref=e156]:
                - strong [ref=e157]: Message ordering
              - paragraph [ref=e158]: "Two types of message order apply in Apache RocketMQ: the production order and the consumption order."
              - list [ref=e159]:
                - listitem [ref=e160]:
                  - paragraph [ref=e161]:
                    - strong [ref=e162]: Production order
                    - text: ： Apache RocketMQ uses the protocol that is established between the producer and the server to ensure that messages are serially sent from the producer to the server and that the messages are stored and persisted in the order in which the messages are sent.
                  - paragraph [ref=e163]: "To ensure the production order of messages, make sure that the following conditions are met:"
                  - list [ref=e164]:
                    - listitem [ref=e165]:
                      - paragraph [ref=e166]: "Single producer: The production order of messages applies to individual producers. Apache RocketMQ cannot determine the order of messages from different producers in different systems, even if you configure the same message group for the messages."
                    - listitem [ref=e167]:
                      - paragraph [ref=e168]: "Serial transmission: A producer in Apache RocketMQ supports secure access by using multiple threads. If a producer uses multiple threads to concurrently send messages, Apache RocketMQ cannot determine the order of messages from different threads."
              - paragraph [ref=e169]: If producers that meet the preceding conditions send messages to Apache RocketMQ, the messages that belong to the same message group are stored in the same queue in the order in which the messages are sent. The following figure describes the sequential storage logic of Apache RocketMQ.
              - paragraph [ref=e170]:
                - img "顺序存储逻辑" [ref=e171]
              - paragraph [ref=e172]: In the preceding figure, messages from MessageGroup 1 and MessageGroup 4 are stored in the same queue (MessageQueue 1). Apache RocketMQ ensures that messages G1-M1, G1-M2, and G1-M3 from MessageGroup 1 are stored in the queue in the order in which the messages are sent. Messages G4-M1 and G4-M2 from MessageGroup 4 are also stored in the order in which the messages are sent. However, messages from MessageGroup 1 and MessageGroup 4 are stored in no particular order.
              - list [ref=e173]:
                - listitem [ref=e174]:
                  - paragraph [ref=e175]:
                    - strong [ref=e176]: Consumption order
                    - text: ：
                  - paragraph [ref=e177]: Apache RocketMQ uses the protocol that is established between the consumers and the server to ensure that messages are consumed in the order in which the messages are stored.
                  - paragraph [ref=e178]: "To ensure the consumption order of messages, make sure that the following conditions are met:"
                  - list [ref=e179]:
                    - listitem [ref=e180]:
                      - paragraph [ref=e181]: "Delivery order: Apache RocketMQ ensures that message are delivered in the message storage order on the server by using the client SDK and the communications protocol on the server side. When consumer applications consume messages, the applications must follow the receive-process-reply path to prevent out-of-order messages caused by asynchronous processing."
                      - generic [ref=e182]:
                        - generic [ref=e183]: note
                        - list [ref=e188]:
                          - listitem [ref=e189]: When a PushConsumer consumer consumes messages, Apache RocketMQ ensures that messages are delivered to the consumer one by one in the order in which the messages are stored.
                          - listitem [ref=e190]:
                            - text: When a SimpleConsumer consumer consumes messages, the consumer may pull multiple messages at a time, and the business application must have a solution to implement the message consumption order. For more information about consumer types, see
                            - link "Consumer types" [ref=e191] [cursor=pointer]:
                              - /url: /docs/featureBehavior/06consumertype
                            - text: .
                    - listitem [ref=e192]:
                      - paragraph [ref=e193]: Limited retries:Apache RocketMQ limits the number of delivery retries for ordered messages. If a message reaches the maximum number of delivery retries, Apache RocketMQ stops retrying the delivery of the message for consumption. This prevents other messages in the queue from constantly waiting for delivery.
                  - paragraph [ref=e194]: In scenarios in which the consumption order is critical, we recommend that you specify an appropriate number of retries to prevent out-of-order message processing.
              - paragraph [ref=e195]:
                - strong [ref=e196]: Combination of production order and consumption order
              - paragraph [ref=e197]: If you want messages to be processed based on the FIFO principle, the production order and the consumption order are required. In most business scenarios, a producer may map to multiple consumers, and not all consumers require ordered consumption of messages. You can combine the settings of production order and consumption order to meet your requirements in different business scenarios. For example, you can send ordered messages and use non-sequential concurrent consumption to improve throughput. The following table describes different combinations of production order and consumption order settings.
              - table [ref=e198]:
                - rowgroup [ref=e199]:
                  - row [ref=e200]:
                    - columnheader "Production order" [ref=e201]
                    - columnheader "Consumption order" [ref=e202]
                    - columnheader "Effect" [ref=e203]
                - rowgroup [ref=e204]:
                  - row [ref=e205]:
                    - cell "Configure message groups to implement ordered delivery of messages." [ref=e206]
                    - cell "Ordered consumption of messages" [ref=e207]
                    - cell "The order of messages is ensured at the message group level. Messages in the same message group are sent and consumed in the same order." [ref=e208]
                  - row [ref=e209]:
                    - cell "Configure message groups to implement ordered delivery of messages." [ref=e210]
                    - cell "Concurrent consumption" [ref=e211]
                    - cell "Messages are concurrently and chronologically consumed." [ref=e212]
                  - row [ref=e213]:
                    - cell "Configure no message groups to implement unordered delivery of messages." [ref=e214]
                    - cell "Ordered consumption of messages" [ref=e215]
                    - cell "The order of messages is ensured at the queue level. The message consumption is based on the attributes of the queue. Apache RocketMQ ensures that the consumption order is the same as the storage order in the queue, but not necessarily the same as the message sending order." [ref=e216]
                  - row [ref=e217]:
                    - cell "Configure no message groups to implement unordered delivery of messages." [ref=e218]
                    - cell "Concurrent consumption" [ref=e219]
                    - cell "Messages are concurrently and chronologically consumed." [ref=e220]
              - paragraph [ref=e221]:
                - strong [ref=e222]: Lifecycle of an ordered message
                - img "生命周期" [ref=e223]
              - list [ref=e224]:
                - listitem [ref=e225]:
                  - paragraph [ref=e226]: "Initialized: The message is built and initialized by the producer and is ready to be sent to a broker."
                - listitem [ref=e227]:
                  - paragraph [ref=e228]: "Ready: The message is sent to the broker, and is visible to the consumer and available for consumption."
                - listitem [ref=e229]:
                  - paragraph [ref=e230]: "Inflight: The message is obtained by the consumer and processed based on the local business logic of the consumer."
                  - paragraph [ref=e231]:
                    - text: In this process, the broker waits for the consumer to complete the consumption and submit the consumption result. If no response is received from the consumer in a certain period of time, Apache RocketMQ retries the message. For more information, see
                    - link "Consumption retry" [ref=e232] [cursor=pointer]:
                      - /url: /docs/featureBehavior/10consumerretrypolicy
                    - text: .
                - listitem [ref=e233]:
                  - paragraph [ref=e234]: "Acked: The consumer completes consumption and submits the consumption result to the broker. The broker marks whether the current message is successfully consumed."
                  - paragraph [ref=e235]: By default, Apache RocketMQ retains all messages. When the consumption result is submitted, the message data is logically marked as consumed instead of being deleted immediately. Therefore, the consumer can backtrack the message for re-consumption before it is deleted due to the expiration of the retention period or insufficient storage space.
                - listitem [ref=e236]:
                  - paragraph [ref=e237]:
                    - text: "Deleted: When the retention period of the message expires or the storage space is insufficient, Apache RocketMQ deletes the earliest saved message from the physical file in a rolling manner. For more information, see"
                    - link "Message storage and cleanup" [ref=e238] [cursor=pointer]:
                      - /url: /docs/featureBehavior/11messagestorepolicy
                    - text: .
              - generic [ref=e239]:
                - generic [ref=e240]: note
                - list [ref=e245]:
                  - listitem [ref=e246]:
                    - paragraph [ref=e247]: Message consumption failures or timeouts trigger the retry logic of the server. If a consumption retry is triggered for a message, the message reaches the end of its lifecycle. The original message is considered a new message with a new message ID.
                  - listitem [ref=e248]:
                    - paragraph [ref=e249]: If a consumption retry is triggered for an ordered message, the messages that follow the ordered message can be processed only after the ordered message is consumed.
              - heading [level=2] [ref=e250]:
                - text: Usage limits
                - link "Direct link to heading" [ref=e251] [cursor=pointer]:
                  - /url: "#usage-limits"
                  - text: "#"
              - paragraph [ref=e252]: Ordered messages support only topics whose MessageType is FIFO.
              - heading [level=2] [ref=e253]:
                - text: Example
                - link "Direct link to heading" [ref=e254] [cursor=pointer]:
