              - paragraph [ref=e255]:
                - strong [ref=e256]: Create topic
              - paragraph [ref=e257]: "For creating topics in Apache RocketMQ 5.0, it is recommended to use the mqadmin tool. However, it is worth noting that message type needs to be added as a property parameter. Here is an example:"
