              - paragraph [ref=e292]:
                - strong [ref=e293]: Send messages
              - paragraph [ref=e294]: Compared with normal messages, ordered messages must have message groups configured for them. We recommend that you configure message groups at a fine-grained level based on your business requirements to allow for workload decoupling and concurrency scaling.
              - paragraph [ref=e295]:
