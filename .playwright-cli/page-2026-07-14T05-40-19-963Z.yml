              - heading [level=2] [ref=e403]:
                - text: Usage notes
                - link "Direct link to heading" [ref=e404] [cursor=pointer]:
                  - /url: "#usage-notes"
                  - text: "#"
              - paragraph [ref=e405]:
                - strong [ref=e406]: Use serial consumption to prevent out-of-order message processing.
              - paragraph [ref=e407]: We recommend that you use serial message consumption instead of batch consumption. Consumption of multiple messages at the same time may cause out-of-order message processing.
              - paragraph [ref=e408]: For example, messages 1, 2, 3, and 4 are sent in the 1-2-3-4 order and the order of batch consumption is 1-[2, 3](processed in batches but failed)-[2, 3](retry)-4. The system may repeatedly process Message 2 if Message 3 fails to be processed. As a result, out-of-order message consumption occurs.
              - paragraph [ref=e409]:
                - strong [ref=e410]: Avoid including a large number of messages in a message group.
              - paragraph [ref=e411]: Apache RocketMQ ensures that the messages in the same message group are stored in the same queue. A message group that contains a large number of messages causes the corresponding queue to be overloaded. This affects messaging performance and hinders scalability. When you configure message groups, you can use order IDs and user IDs as the message sequencing conditions. This ensures the order of messages of the same user.
              - paragraph [ref=e412]: We recommend that you split messages in your business applications by message group. For example, you can use order IDs and user IDs as message group keywords to implement ordered processing of messages of the same user. You do not need to ensure the order of messages of different users.
