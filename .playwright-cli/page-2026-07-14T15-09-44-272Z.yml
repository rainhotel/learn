              - generic [ref=e1001]:
                - heading "Logging" [level=3] [ref=e1002]
                - paragraph [ref=e1004]:
                  - text: The
                  - link [ref=e1005] [cursor=pointer]:
                    - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/opentelemetry/autoconfigure/logging/OpenTelemetryLoggingAutoConfiguration.html
                    - code [ref=e1006]: OpenTelemetryLoggingAutoConfiguration
                  - text: configures OpenTelemetry’s
                  - link [ref=e1007] [cursor=pointer]:
                    - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-logs/1.62.0/io/opentelemetry/sdk/logs/SdkLoggerProvider.html
                    - code [ref=e1008]: SdkLoggerProvider
                  - text: . Exporting logs via OTLP is supported through the
                  - link [ref=e1009] [cursor=pointer]:
                    - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/opentelemetry/autoconfigure/logging/otlp/OtlpLoggingAutoConfiguration.html
                    - code [ref=e1010]: OtlpLoggingAutoConfiguration
                  - text: ", which enables OTLP log exporting over HTTP or gRPC."
                - table [ref=e1012]:
                  - rowgroup [ref=e1013]:
                    - row [ref=e1014]:
                      - cell "Note" [ref=e1015]
                      - cell [ref=e1017]:
                        - text: If you need to apply advanced customizations to OTLP log record exporters, consider registering
                        - link [ref=e1018] [cursor=pointer]:
                          - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/opentelemetry/autoconfigure/logging/otlp/OtlpHttpLogRecordExporterBuilderCustomizer.html
                          - code [ref=e1019]: OtlpHttpLogRecordExporterBuilderCustomizer
                        - text: or
                        - link [ref=e1020] [cursor=pointer]:
                          - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/opentelemetry/autoconfigure/logging/otlp/OtlpGrpcLogRecordExporterBuilderCustomizer.html
                          - code [ref=e1021]: OtlpGrpcLogRecordExporterBuilderCustomizer
                        - text: beans. These will be invoked before the creation of the
                        - link [ref=e1022] [cursor=pointer]:
                          - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-exporter-otlp/1.62.0/io/opentelemetry/exporter/otlp/http/logs/OtlpHttpLogRecordExporter.html
                          - code [ref=e1023]: OtlpHttpLogRecordExporter
                        - text: or
                        - link [ref=e1024] [cursor=pointer]:
                          - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-exporter-otlp/1.62.0/io/opentelemetry/exporter/otlp/logs/OtlpGrpcLogRecordExporter.html
                          - code [ref=e1025]: OtlpGrpcLogRecordExporter
                        - text: . The customizers take precedence over anything applied by the auto-configuration.
                - paragraph [ref=e1027]:
                  - text: However, while there is a
                  - code [ref=e1028]: SdkLoggerProvider
                  - text: bean, Spring Boot doesn’t support bridging logs to this bean out of the box. This can be done with 3rd-party log bridges, as described in the
                  - link "Logging with OpenTelemetry" [ref=e1029] [cursor=pointer]:
                    - /url: loggers.html#actuator.loggers.opentelemetry
                  - text: section.
              - generic [ref=e1030]:
                - heading "Metrics" [level=3] [ref=e1031]
                - paragraph [ref=e1033]:
                  - text: The choice of metrics in the Spring portfolio is Micrometer, which means that metrics are not collected and exported through the OpenTelemetry’s
                  - link [ref=e1034] [cursor=pointer]:
                    - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-metrics/1.62.0/io/opentelemetry/sdk/metrics/SdkMeterProvider.html
                    - code [ref=e1035]: SdkMeterProvider
                  - text: . Spring Boot doesn’t provide a
                  - code [ref=e1036]: SdkMeterProvider
                  - text: bean.
                - paragraph [ref=e1038]:
                  - text: However, Micrometer metrics can be exported via OTLP to any OpenTelemetry capable backend using the
                  - link [ref=e1039] [cursor=pointer]:
                    - /url: https://javadoc.io/doc/io.micrometer/micrometer-registry-otlp/1.17.0/io/micrometer/registry/otlp/OtlpMeterRegistry.html
                    - code [ref=e1040]: OtlpMeterRegistry
                  - text: ", as described in the"
                  - link "Metrics with OTLP" [ref=e1041] [cursor=pointer]:
                    - /url: metrics.html#actuator.metrics.export.otlp
                  - text: section.
                - table [ref=e1043]:
                  - rowgroup [ref=e1044]:
                    - row [ref=e1045]:
                      - cell "Note" [ref=e1046]
                      - cell [ref=e1048]:
                        - text: Micrometer’s OTLP registry doesn’t use the
                        - code [ref=e1049]: Resource
                        - text: bean, but setting
                        - code [ref=e1050]: OTEL_RESOURCE_ATTRIBUTES
                        - text: ","
                        - code [ref=e1051]: OTEL_SERVICE_NAME
                        - text: or
                        - code [ref=e1052]: management.opentelemetry.resource-attributes
                        - text: works.
                - generic [ref=e1053]:
                  - heading "Metrics via the OpenTelemetry API and SDK" [level=4] [ref=e1054]
                  - paragraph [ref=e1056]:
                    - text: If you or a dependency you include make use of OpenTelemetry’s
                    - link [ref=e1057] [cursor=pointer]:
                      - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-api/1.62.0/io/opentelemetry/api/metrics/MeterProvider.html
                      - code [ref=e1058]: MeterProvider
                    - text: ", those metrics are not exported."
                  - paragraph [ref=e1060]:
                    - text: We strongly recommend that you report your metrics with Micrometer. If a dependency you include uses OpenTelemetry’s
                    - code [ref=e1061]: MeterProvider
                    - text: ", you can include this configuration in your application to configure a"
                    - code [ref=e1062]: MeterProvider
                    - text: "bean, which you then have to wire into your dependency:"
                  - generic [ref=e1065]:
                    - code [ref=e1066]:
                      - text: java
                      - generic: import java.time.Duration; import io.opentelemetry.exporter.otlp.http.metrics.OtlpHttpMetricExporter; import io.opentelemetry.sdk.metrics.SdkMeterProvider; import io.opentelemetry.sdk.metrics.export.MetricExporter; import io.opentelemetry.sdk.metrics.export.MetricReader; import io.opentelemetry.sdk.metrics.export.PeriodicMetricReader; import io.opentelemetry.sdk.resources.Resource; import org.springframework.context.annotation.Bean; import org.springframework.context.annotation.Configuration;
                      - generic [ref=e1067]:
                        - text: "@Configuration(proxyBeanMethods = false)"
                        - generic [ref=e1068]: class OpenTelemetryMetricsConfiguration
                        - text: "{ @Bean"
                        - generic [ref=e1069]: OtlpHttpMetricExporter metricExporter()
                        - text: "{ String endpoint = \"http://localhost:4318/v1/metrics\"; return OtlpHttpMetricExporter.builder().setEndpoint(endpoint).build(); } @Bean"
                        - generic [ref=e1070]: PeriodicMetricReader metricReader(MetricExporter exporter)
                        - text: "{ Duration interval = Duration.ofMinutes(1); return PeriodicMetricReader.builder(exporter).setInterval(interval).build(); } @Bean"
                        - generic [ref=e1071]: SdkMeterProvider meterProvider(Resource resource, MetricReader metricReader)
                        - text: "{ return SdkMeterProvider.builder().registerMetricReader(metricReader).setResource(resource).build(); } }"
                    - generic [ref=e1072]:
                      - button "Expand foldable text" [ref=e1073] [cursor=pointer]
                      - button "Copied!" [ref=e1074] [cursor=pointer]
                  - paragraph [ref=e1077]: This configuration also enables metrics export via OTLP over HTTP.
              - generic [ref=e1078]:
                - heading "Tracing" [level=3] [ref=e1079]
                - paragraph [ref=e1081]:
                  - text: If Micrometer tracing is used, the
                  - link [ref=e1082] [cursor=pointer]:
