                - link [ref=e420] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.micrometer/micrometer-core/1.17.0/io/micrometer/core/aop/MeterTag.html
                  - code [ref=e421]: "@MeterTag"
                - text: and
                - link [ref=e422] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.micrometer/micrometer-tracing/1.7.0/io/micrometer/tracing/annotation/NewSpan.html
                  - code [ref=e423]: "@NewSpan"
                - text: ", set the"
                - code [ref=e424]: management.observations.annotations.enabled
                - text: property to
                - code [ref=e425]: "true"
                - text: . A dependency on
                - code [ref=e426]: org.aspectj:aspectjweaver
                - text: ", which is part of"
                - code [ref=e427]: spring-boot-starter-aspectj
                - text: ", is also required. This feature is supported by Micrometer directly. Please refer to the"
                - link "Micrometer" [ref=e428] [cursor=pointer]:
                  - /url: https://docs.micrometer.io/micrometer/reference/1.17/concepts/timers.html#_the_timed_annotation
                - text: ","
                - link "Micrometer Observation" [ref=e429] [cursor=pointer]:
                  - /url: https://docs.micrometer.io/micrometer/reference/1.17/observation/components.html#micrometer-observation-annotations
                - text: and
                - link "Micrometer Tracing" [ref=e430] [cursor=pointer]:
                  - /url: https://docs.micrometer.io/tracing/reference/1.7/api.html#_aspect_oriented_programming
                - text: reference docs.
              - table [ref=e432]:
                - rowgroup [ref=e433]:
                  - row [ref=e434]:
                    - cell "Note" [ref=e435]
                    - cell [ref=e437]:
                      - text: When you annotate methods or classes which are already instrumented (for example,
                      - link "Spring Data repositories" [ref=e438] [cursor=pointer]:
                        - /url: metrics.html#actuator.metrics.supported.spring-data-repository
                      - text: or
                      - link "Spring MVC controllers" [ref=e439] [cursor=pointer]:
                        - /url: metrics.html#actuator.metrics.supported.spring-mvc
                      - text: ), you will get duplicate observations. In that case you can either disable the automatic instrumentation using
                      - link "properties" [ref=e440] [cursor=pointer]:
                        - /url: "#actuator.observability.preventing-observations"
                      - text: or an
                      - link [ref=e441] [cursor=pointer]:
                        - /url: https://javadoc.io/doc/io.micrometer/micrometer-observation/1.17.0/io/micrometer/observation/ObservationPredicate.html
                        - code [ref=e442]: ObservationPredicate
                      - text: and rely on your annotations, or you can remove your annotations.
          - generic [ref=e443]:
            - heading "OpenTelemetry Support" [level=2] [ref=e444]
            - generic [ref=e445]:
              - table [ref=e447]:
                - rowgroup [ref=e448]:
                  - row [ref=e449]:
                    - cell "Note" [ref=e450]
                    - cell [ref=e452]:
                      - text: There are several ways to support
                      - link "OpenTelemetry" [ref=e453] [cursor=pointer]:
                        - /url: https://opentelemetry.io/
                      - text: in your application. You can use the
                      - link "OpenTelemetry Java Agent" [ref=e454] [cursor=pointer]:
                        - /url: https://opentelemetry.io/docs/zero-code/java/agent/
                      - text: or the
                      - link "OpenTelemetry Spring Boot Starter" [ref=e455] [cursor=pointer]:
                        - /url: https://opentelemetry.io/docs/zero-code/java/spring-boot-starter/
                      - text: ", which are supported by the OTel community; the metrics and traces use the semantic conventions defined by OTel libraries. This documentation describes OpenTelemetry as officially supported by the Spring team, using Micrometer and the OTLP exporter; the metrics and traces use the semantic conventions described in the Spring projects documentation, such as"
                      - link "Spring Framework" [ref=e456] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-framework/reference/7.0/integration/observability.html
                      - text: .
              - paragraph [ref=e458]: Spring Boot’s actuator module includes basic support for OpenTelemetry.
              - paragraph [ref=e460]:
                - text: It provides a bean of type
                - link [ref=e461] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-api/1.62.0/io/opentelemetry/api/OpenTelemetry.html
                  - code [ref=e462]: OpenTelemetry
                - text: ", and if there are beans of type"
                - link [ref=e463] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-trace/1.62.0/io/opentelemetry/sdk/trace/SdkTracerProvider.html
                  - code [ref=e464]: SdkTracerProvider
                - text: ","
                - link [ref=e465] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-context/1.62.0/io/opentelemetry/context/propagation/ContextPropagators.html
                  - code [ref=e466]: ContextPropagators
                - text: ","
                - link [ref=e467] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-logs/1.62.0/io/opentelemetry/sdk/logs/SdkLoggerProvider.html
                  - code [ref=e468]: SdkLoggerProvider
                - text: or
                - link [ref=e469] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-metrics/1.62.0/io/opentelemetry/sdk/metrics/SdkMeterProvider.html
                  - code [ref=e470]: SdkMeterProvider
                - text: in the application context, they automatically get registered. Additionally, it provides a
                - link [ref=e471] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-common/1.62.0/io/opentelemetry/sdk/resources/Resource.html
                  - code [ref=e472]: Resource
                - text: bean. The attributes of the auto-configured
                - link [ref=e473] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-common/1.62.0/io/opentelemetry/sdk/resources/Resource.html
                  - code [ref=e474]: Resource
                - text: can be configured via the
                - code [ref=e475]: management.opentelemetry.resource-attributes
                - text: configuration property. Auto-configured attributes will be merged with attributes from the
                - code [ref=e476]: OTEL_RESOURCE_ATTRIBUTES
                - text: and
                - code [ref=e477]: OTEL_SERVICE_NAME
                - text: environment variables, with attributes configured through the configuration property taking precedence over those from the environment variables.
              - paragraph [ref=e479]:
                - text: If you have defined your own
                - link [ref=e480] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.opentelemetry/opentelemetry-sdk-common/1.62.0/io/opentelemetry/sdk/resources/Resource.html
                  - code [ref=e481]: Resource
                - text: bean, this will no longer be the case.
              - table [ref=e483]:
                - rowgroup [ref=e484]:
                  - row [ref=e485]:
                    - cell "Note" [ref=e486]
                    - cell [ref=e488]:
                      - text: Spring Boot does not provide automatic exporting of OpenTelemetry metrics or logs. Exporting OpenTelemetry traces is only auto-configured when used together with
                      - link "Micrometer Tracing" [ref=e489] [cursor=pointer]:
                        - /url: tracing.html
                      - text: .
              - generic [ref=e490]:
                - heading "Disabling OpenTelemetry" [level=3] [ref=e491]
                - paragraph [ref=e493]:
                  - text: The OpenTelemetry support can be disabled by setting the
                  - code [ref=e494]: management.opentelemetry.enabled
                  - text: property to
                  - code [ref=e495]: "false"
                  - text: . This behaves similarly to the
                  - link [ref=e496] [cursor=pointer]:
                    - /url: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#general-sdk-configuration
                    - code [ref=e497]: OTEL_SDK_DISABLED
                  - text: "environment variable (but negated): when the SDK is disabled, metrics, traces, and logging will use no-op implementations. Context propagators are not affected and continue to function normally."
                - table [ref=e499]:
                  - rowgroup [ref=e500]:
                    - row [ref=e501]:
                      - cell "Note" [ref=e502]
                      - cell "Keep in mind that Spring Boot doesn’t use OpenTelemetry’s metrics functionality, so metrics might still be enabled even when disabling OpenTelemetry." [ref=e504]
              - generic [ref=e505]:
                - heading "Environment variables" [level=3] [ref=e506]
                - paragraph [ref=e508]:
                  - text: Spring Boot supports a subset of the
                  - link "OpenTelemetry SDK environment variables" [ref=e509] [cursor=pointer]:
                    - /url: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
                  - text: . These environment variables are automatically mapped to Spring Boot configuration properties at startup. When an environment variable has a signal-specific variant (for example,
                  - code [ref=e510]: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                  - text: ) and a general variant (
                  - code [ref=e511]: OTEL_EXPORTER_OTLP_ENDPOINT
                  - text: ), the signal-specific variant takes precedence and is used as-is. When the general variant is used as a fallback, the signal-specific path (
                  - code [ref=e512]: v1/traces
                  - text: ","
                  - code [ref=e513]: v1/metrics
                  - text: ", or"
                  - code [ref=e514]: v1/logs
                  - text: ) is appended to it. For example, setting
                  - code [ref=e515]: OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
                  - text: results in
                  - code [ref=e516]:
                    - link "collector:4318/v1/traces" [ref=e517] [cursor=pointer]:
                      - /url: http://collector:4318/v1/traces
                  - text: for traces.
                - paragraph [ref=e519]:
                  - text: This mapping can be disabled by setting
                  - code [ref=e520]: management.opentelemetry.map-environment-variables
                  - text: to
                  - code [ref=e521]: "false"
                  - text: .
