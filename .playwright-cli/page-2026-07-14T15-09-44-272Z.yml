                  - /url: https://docs.micrometer.io/micrometer/reference/1.17/observation
                - text: .
          - generic [ref=e318]:
            - heading "Common Tags" [level=2] [ref=e319]
            - generic [ref=e320]:
              - paragraph [ref=e322]: "Common tags are generally used for dimensional drill-down on the operating environment, such as host, instance, region, stack, and others. Common tags are applied to all observations as low cardinality tags and can be configured, as the following example shows:"
              - generic [ref=e324]:
