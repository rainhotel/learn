          - heading "Observability" [level=1] [ref=e203]
          - generic [ref=e205]:
            - paragraph [ref=e207]: "Observability is the ability to observe the internal state of a running system from the outside. It consists of the three pillars: logging, metrics and traces."
            - paragraph [ref=e209]:
              - text: For metrics and traces, Spring Boot uses
              - link "Micrometer Observation" [ref=e210] [cursor=pointer]:
                - /url: https://docs.micrometer.io/micrometer/reference/1.17/observation
              - text: . To create your own observations (which will lead to metrics and traces), you can inject an
              - link [ref=e211] [cursor=pointer]:
                - /url: https://javadoc.io/doc/io.micrometer/micrometer-observation/1.17.0/io/micrometer/observation/ObservationRegistry.html
                - code [ref=e212]: ObservationRegistry
              - text: .
            - generic [ref=e214]:
              - tablist [ref=e216]:
                - tab [selected] [ref=e217] [cursor=pointer]:
                  - paragraph [ref=e218]: Java
                - tab [ref=e219] [cursor=pointer]:
                  - paragraph [ref=e220]: Kotlin
              - tabpanel "Java" [ref=e221]:
                - generic [ref=e224]:
                  - code [ref=e225]:
                    - text: java
                    - generic: import io.micrometer.observation.Observation; import io.micrometer.observation.ObservationRegistry; import org.springframework.stereotype.Component;
                    - generic [ref=e226]:
                      - text: "@Component public"
                      - generic [ref=e227]: class MyCustomObservation
                      - text: "{ private final ObservationRegistry observationRegistry;"
                      - generic [ref=e228]: public MyCustomObservation(ObservationRegistry observationRegistry)
                      - text: "{ this.observationRegistry = observationRegistry; }"
                      - generic [ref=e229]: public void doSomething()
                      - text: "{ Observation.createNotStarted(\"doSomething\", this.observationRegistry) .lowCardinalityKeyValue(\"locale\", \"en-US\") .highCardinalityKeyValue(\"userId\", \"42\") .observe(() -> { // Execute business logic here }); } }"
                  - generic [ref=e230]:
                    - button "Expand foldable text" [ref=e231] [cursor=pointer]
                    - button "Copied!" [ref=e232] [cursor=pointer]
              - text: kotlin
            - table [ref=e235]:
              - rowgroup [ref=e236]:
                - row [ref=e237]:
                  - cell "Note" [ref=e238]
                  - cell "Low cardinality tags will be added to metrics and traces, while high cardinality tags will only be added to traces." [ref=e240]
            - paragraph [ref=e242]:
              - text: Beans of type
              - link [ref=e243] [cursor=pointer]:
                - /url: https://javadoc.io/doc/io.micrometer/micrometer-observation/1.17.0/io/micrometer/observation/ObservationPredicate.html
                - code [ref=e244]: ObservationPredicate
              - text: ","
              - link [ref=e245] [cursor=pointer]:
                - /url: https://javadoc.io/doc/io.micrometer/micrometer-observation/1.17.0/io/micrometer/observation/GlobalObservationConvention.html
                - code [ref=e246]: GlobalObservationConvention
              - text: ","
              - link [ref=e247] [cursor=pointer]:
                - /url: https://javadoc.io/doc/io.micrometer/micrometer-observation/1.17.0/io/micrometer/observation/ObservationFilter.html
                - code [ref=e248]: ObservationFilter
              - text: and
              - link [ref=e249] [cursor=pointer]:
                - /url: https://javadoc.io/doc/io.micrometer/micrometer-observation/1.17.0/io/micrometer/observation/ObservationHandler.html
                - code [ref=e250]: ObservationHandler
              - text: will be automatically registered on the
              - link [ref=e251] [cursor=pointer]:
                - /url: https://javadoc.io/doc/io.micrometer/micrometer-observation/1.17.0/io/micrometer/observation/ObservationRegistry.html
                - code [ref=e252]: ObservationRegistry
              - text: . You can additionally register any number of
              - link [ref=e253] [cursor=pointer]:
                - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/micrometer/observation/autoconfigure/ObservationRegistryCustomizer.html
                - code [ref=e254]: ObservationRegistryCustomizer
              - text: beans to further configure the registry.
            - table [ref=e256]:
              - rowgroup [ref=e257]:
                - row [ref=e258]:
                  - cell "Tip" [ref=e259]
                  - cell [ref=e261]:
                    - text: Observability for JDBC can be configured using a separate project. The
                    - link "Datasource Micrometer project" [ref=e262] [cursor=pointer]:
                      - /url: https://github.com/jdbc-observations/datasource-micrometer
                    - text: provides a Spring Boot starter which automatically creates observations when JDBC operations are invoked. Read more about it
                    - link "in the reference documentation" [ref=e263] [cursor=pointer]:
                      - /url: https://jdbc-observations.github.io/datasource-micrometer/docs/current/docs/html/
                    - text: .
            - table [ref=e265]:
              - rowgroup [ref=e266]:
                - row [ref=e267]:
                  - cell "Tip" [ref=e268]
                  - cell [ref=e270]:
                    - text: Observability for R2DBC is built into Spring Boot. To enable it, add the
                    - code [ref=e271]: io.r2dbc:r2dbc-proxy
                    - text: dependency to your project.
          - generic [ref=e272]:
            - heading "Context Propagation" [level=2] [ref=e273]
            - generic [ref=e274]:
              - paragraph [ref=e276]:
                - text: Observability support relies on the
                - link "Context Propagation library" [ref=e277] [cursor=pointer]:
                  - /url: https://github.com/micrometer-metrics/context-propagation
                - text: for forwarding the current observation across threads and reactive pipelines. By default,
                - link [ref=e278] [cursor=pointer]:
                  - /url: https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/ThreadLocal.html
                  - code [ref=e279]: ThreadLocal
                - text: values are not automatically reinstated in reactive operators. This behavior is controlled with the
                - code [ref=e280]: spring.reactor.context-propagation
                - text: property, which can be set to
                - code [ref=e281]: auto
                - text: to enable automatic propagation.
              - paragraph [ref=e283]:
                - text: If you’re working with
                - link [ref=e284] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/scheduling/annotation/Async.html
                  - code [ref=e285]: "@Async"
                - text: methods and the
                - link [ref=e286] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/core/task/AsyncTaskExecutor.html
                  - code [ref=e287]: AsyncTaskExecutor
                - text: is auto-configured, you have to opt-in for context propagation using the
                - code [ref=e288]: spring.task.execution.propagate-context
                - text: property.
              - paragraph [ref=e290]:
                - text: If you are configuring the
                - link [ref=e291] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/core/task/AsyncTaskExecutor.html
                  - code [ref=e292]: AsyncTaskExecutor
                - text: yourself, then you need to register a
                - link [ref=e293] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/core/task/support/ContextPropagatingTaskDecorator.html
                  - code [ref=e294]: ContextPropagatingTaskDecorator
                - text: "bean, as shown in the following example:"
              - generic [ref=e296]:
