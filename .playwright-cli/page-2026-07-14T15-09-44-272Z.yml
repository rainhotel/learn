                    - code [ref=e1087]: OtlpTracingAutoConfiguration
                  - text: ", which supports exporting traces with OTLP over HTTP or gRPC."
                - paragraph [ref=e1089]: We strongly recommend using the Micrometer Observation or Tracing API instead of using the OpenTelemetry API directly.
