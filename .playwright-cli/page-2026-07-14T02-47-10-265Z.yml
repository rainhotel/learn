              - /url: https://github.com/antirez/redlock-rb
            - text: (Ruby implementation). There is also a
            - link "fork of Redlock-rb" [ref=e191] [cursor=pointer]:
              - /url: https://github.com/leandromoreira/redlock-rb
            - text: that adds a gem for easy distribution.
          - listitem [ref=e192]:
