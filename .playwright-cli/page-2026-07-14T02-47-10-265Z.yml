        - heading "Distributed Locks with Redis" [level=1] [ref=e177]
        - paragraph [ref=e178]: A distributed lock pattern with Redis
        - paragraph [ref=e179]: Distributed locks are a very useful primitive in many environments where different processes must operate with shared resources in a mutually exclusive way.
        - paragraph [ref=e180]: There are a number of libraries and blog posts describing how to implement a DLM (Distributed Lock Manager) with Redis, but every library uses a different approach, and many use a simple approach with lower guarantees compared to what can be achieved with slightly more complex designs.
        - paragraph [ref=e181]:
          - text: This page describes a more canonical algorithm to implement distributed locks with Redis. We propose an algorithm, called
          - strong [ref=e182]: Redlock
          - text: ", which implements a DLM which we believe to be safer than the vanilla single instance approach. We hope that the community will analyze it, provide feedback, and use it as a starting point for the implementations of more complex or alternative designs."
        - heading [level=2] [ref=e183]:
          - text: Implementations
          - link "Link to this section" [ref=e184] [cursor=pointer]:
            - /url: "#implementations"
        - paragraph [ref=e187]: Before describing the algorithm, here are a few links to implementations already available that can be used for reference.
