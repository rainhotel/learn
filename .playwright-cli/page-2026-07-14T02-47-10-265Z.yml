        - heading [level=2] [ref=e234]:
          - text: Safety and Liveness Guarantees
          - link "Link to this section" [ref=e235] [cursor=pointer]:
            - /url: "#safety-and-liveness-guarantees"
        - paragraph [ref=e238]: We are going to model our design with just three properties that, from our point of view, are the minimum guarantees needed to use distributed locks in an effective way.
        - list [ref=e239]:
          - listitem [ref=e240]: "Safety property: Mutual exclusion. At any given moment, only one client can hold a lock."
          - listitem [ref=e241]: "Liveness property A: Deadlock free. Eventually it is always possible to acquire a lock, even if the client that locked a resource crashes or gets partitioned."
          - listitem [ref=e242]: "Liveness property B: Fault tolerance. As long as the majority of Redis nodes are up, clients are able to acquire and release locks."
        - heading [level=2] [ref=e243]:
          - text: Why Failover-based Implementations Are Not Enough
          - link "Link to this section" [ref=e244] [cursor=pointer]:
            - /url: "#why-failover-based-implementations-are-not-enough"
        - paragraph [ref=e247]: To understand what we want to improve, let’s analyze the current state of affairs with most Redis-based distributed lock libraries.
        - paragraph [ref=e248]: The simplest way to use Redis to lock a resource is to create a key in an instance. The key is usually created with a limited time to live, using the Redis expires feature, so that eventually it will get released (property 2 in our list). When the client needs to release the resource, it deletes the key.
        - paragraph [ref=e249]: "Superficially this works well, but there is a problem: this is a single point of failure in our architecture. What happens if the Redis master goes down? Well, let’s add a replica! And use it if the master is unavailable. This is unfortunately not viable. By doing so we can’t implement our safety property of mutual exclusion, because Redis replication is asynchronous."
        - paragraph [ref=e250]: "There is a race condition with this model:"
        - list [ref=e251]:
          - listitem [ref=e252]: Client A acquires the lock in the master.
          - listitem [ref=e253]: The master crashes before the write to the key is transmitted to the replica.
          - listitem [ref=e254]: The replica gets promoted to master.
          - listitem [ref=e255]:
            - text: Client B acquires the lock to the same resource A already holds a lock for.
            - strong [ref=e256]: SAFETY VIOLATION!
        - paragraph [ref=e257]: Sometimes it is perfectly fine that, under special circumstances, for example during a failure, multiple clients can hold the lock at the same time. If this is the case, you can use your replication based solution. Otherwise we suggest to implement the solution described in this document.
        - heading [level=2] [ref=e258]:
          - text: Correct Implementation with a Single Instance
          - link "Link to this section" [ref=e259] [cursor=pointer]:
            - /url: "#correct-implementation-with-a-single-instance"
        - paragraph [ref=e262]: Before trying to overcome the limitation of the single instance setup described above, let’s check how to do it correctly in this simple case, since this is actually a viable solution in applications where a race condition from time to time is acceptable, and because locking into a single instance is the foundation we’ll use for the distributed algorithm described here.
        - paragraph [ref=e263]: "To acquire the lock, the way to go is the following:"
        - code [ref=e265]: SET resource_name my_random_value NX PX 30000
        - paragraph [ref=e266]:
          - text: The command will set the key only if it does not already exist (
          - code [ref=e267]: NX
          - text: option), with an expire of 30000 milliseconds (
          - code [ref=e268]: PX
          - text: option). The key is set to a value "my_random_value". This value must be unique across all clients and all lock requests.
        - paragraph [ref=e269]: "Basically the random value is used in order to release the lock in a safe way, with a script that tells Redis: remove the key only if it exists and the value stored at the key is exactly the one I expect to be. This is accomplished with the following command:"
        - code [ref=e271]: DELEX key IFEQ my_random_value
        - paragraph [ref=e272]:
          - text: The
          - code [ref=e273]: DELEX
          - text: "command was introduced in Redis 8.4. On previous Redis versions, this could be accomplished with the following Lua script:"
        - code [ref=e275]: if redis.call("get",KEYS[1]) == ARGV[1] then return redis.call("del",KEYS[1]) else return 0 end
        - paragraph [ref=e276]:
          - text: This is important in order to avoid removing a lock that was created by another client. For example a client may acquire the lock, get blocked performing some operation for longer than the lock validity time (the time at which the key will expire), and later remove the lock, that was already acquired by some other client. Using just
          - link [ref=e277] [cursor=pointer]:
            - /url: /docs/latest/commands/del/
            - code [ref=e278]: DEL
          - text: is not safe as a client may remove another client's lock. With the
          - code [ref=e279]: DELEX
          - text: command or the above script instead every lock is "signed" with a random string, so the lock will be removed only if it is still the one that was set by the client trying to remove it.
        - paragraph [ref=e280]:
          - text: What should this random string be? We assume it’s 20 bytes from
          - code [ref=e281]: /dev/urandom
          - text: ", but you can find cheaper ways to make it unique enough for your tasks. For example a safe pick is to seed RC4 with"
          - code [ref=e282]: /dev/urandom
          - text: ", and generate a pseudo random stream from that. A simpler solution is to use a UNIX timestamp with microsecond precision, concatenating the timestamp with a client ID. It is not as safe, but probably sufficient for most environments."
        - paragraph [ref=e283]: The "lock validity time" is the time we use as the key's time to live. It is both the auto release time, and the time the client has in order to perform the operation required before another client may be able to acquire the lock again, without technically violating the mutual exclusion guarantee, which is only limited to a given window of time from the moment the lock is acquired.
        - paragraph [ref=e284]: So now we have a good way to acquire and release the lock. With this system, reasoning about a non-distributed system composed of a single, always available, instance, is safe. Let’s extend the concept to a distributed system where we don’t have such guarantees.
        - heading [level=2] [ref=e285]:
          - text: The Redlock Algorithm
          - link "Link to this section" [ref=e286] [cursor=pointer]:
            - /url: "#the-redlock-algorithm"
        - paragraph [ref=e289]: In the distributed version of the algorithm we assume we have N Redis masters. Those nodes are totally independent, so we don’t use replication or any other implicit coordination system. We already described how to acquire and release the lock safely in a single instance. We take for granted that the algorithm will use this method to acquire and release the lock in a single instance. In our examples we set N=5, which is a reasonable value, so we need to run 5 Redis masters on different computers or virtual machines in order to ensure that they’ll fail in a mostly independent way.
        - paragraph [ref=e290]: "In order to acquire the lock, the client performs the following operations:"
        - list [ref=e291]:
          - listitem [ref=e292]: It gets the current time in milliseconds.
          - listitem [ref=e293]: It tries to acquire the lock in all the N instances in parallel, using the same key name and random value in all the instances. During step 2, when setting the lock in each instance, the client uses a timeout which is small compared to the total lock auto-release time in order to acquire it. For example if the auto-release time is 10 seconds, the timeout could be in the ~ 5-50 milliseconds range. This prevents the client from staying blocked too long when communicating with an unavailable Redis node, ensuring the connection attempt times out quickly.
          - listitem [ref=e294]: The client computes how much time elapsed in order to acquire the lock, by subtracting from the current time the timestamp obtained in step 1. If and only if the client was able to acquire the lock in the majority of the instances (at least 3), and the total time elapsed to acquire the lock is less than lock validity time, the lock is considered to be acquired.
          - listitem [ref=e295]: If the lock was acquired, its validity time is considered to be the initial validity time minus the time elapsed, as computed in step 3.
          - listitem [ref=e296]: If the client failed to acquire the lock for some reason (either it was not able to lock N/2+1 instances or the validity time is negative), it will try to unlock all the instances (even the instances it believed it was not able to lock).
        - heading [level=3] [ref=e297]:
          - text: Is the Algorithm Asynchronous?
          - link "Link to this section" [ref=e298] [cursor=pointer]:
            - /url: "#is-the-algorithm-asynchronous"
        - paragraph [ref=e301]: "The algorithm relies on the assumption that while there is no synchronized clock across the processes, the local time in every process updates at approximately at the same rate, with a small margin of error compared to the auto-release time of the lock. This assumption closely resembles a real-world computer: every computer has a local clock and we can usually rely on different computers to have a clock drift which is small."
        - paragraph [ref=e302]: "At this point we need to better specify our mutual exclusion rule: it is guaranteed only as long as the client holding the lock terminates its work within the lock validity time (as obtained in step 3), minus some time (just a few milliseconds in order to compensate for clock drift between processes)."
        - paragraph [ref=e303]:
          - text: This paper contains more information about similar systems requiring a bound
          - emphasis [ref=e304]: clock drift
          - text: ":"
          - 'link "Leases: an efficient fault-tolerant mechanism for distributed file cache consistency" [ref=e305] [cursor=pointer]':
            - /url: http://dl.acm.org/citation.cfm?id=74870
          - text: .
        - heading [level=3] [ref=e306]:
          - text: Retry on Failure
          - link "Link to this section" [ref=e307] [cursor=pointer]:
            - /url: "#retry-on-failure"
        - paragraph [ref=e310]:
          - text: When a client is unable to acquire the lock, it should try again after a random delay in order to try to desynchronize multiple clients trying to acquire the lock for the same resource at the same time (this may result in a split brain condition where nobody wins). Also the faster a client tries to acquire the lock in the majority of Redis instances, the smaller the window for a split brain condition (and the need for a retry), so ideally the client should try to send the
          - link [ref=e311] [cursor=pointer]:
            - /url: /docs/latest/commands/set/
            - code [ref=e312]: SET
          - text: commands to the N instances at the same time using multiplexing.
        - paragraph [ref=e313]: It is worth stressing how important it is for clients that fail to acquire the majority of locks, to release the (partially) acquired locks ASAP, so that there is no need to wait for key expiry in order for the lock to be acquired again (however if a network partition happens and the client is no longer able to communicate with the Redis instances, there is an availability penalty to pay as it waits for key expiration).
        - heading [level=3] [ref=e314]:
          - text: Releasing the Lock
          - link "Link to this section" [ref=e315] [cursor=pointer]:
            - /url: "#releasing-the-lock"
        - paragraph [ref=e318]: Releasing the lock is simple, and can be performed whether or not the client believes it was able to successfully lock a given instance.
        - heading [level=3] [ref=e319]:
          - text: Safety Arguments
          - link "Link to this section" [ref=e320] [cursor=pointer]:
            - /url: "#safety-arguments"
        - paragraph [ref=e323]: Is the algorithm safe? Let's examine what happens in different scenarios.
        - paragraph [ref=e324]:
          - text: To start let’s assume that a client is able to acquire the lock in the majority of instances. All the instances will contain a key with the same time to live. However, the key was set at different times, so the keys will also expire at different times. But if the first key was set at worst at time T1 (the time we sample before contacting the first server) and the last key was set at worst at time T2 (the time we obtained the reply from the last server), we are sure that the first key to expire in the set will exist for at least
          - code [ref=e325]: MIN_VALIDITY=TTL-(T2-T1)-CLOCK_DRIFT
          - text: . All the other keys will expire later, so we are sure that the keys will be simultaneously set for at least this time.
        - paragraph [ref=e326]: During the time that the majority of keys are set, another client will not be able to acquire the lock, since N/2+1 SET NX operations can’t succeed if N/2+1 keys already exist. So if a lock was acquired, it is not possible to re-acquire it at the same time (violating the mutual exclusion property).
        - paragraph [ref=e327]: However we want to also make sure that multiple clients trying to acquire the lock at the same time can’t simultaneously succeed.
        - paragraph [ref=e328]:
          - text: If a client locked the majority of instances using a time near, or greater, than the lock maximum validity time (the TTL we use for SET basically), it will consider the lock invalid and will unlock the instances, so we only need to consider the case where a client was able to lock the majority of instances in a time which is less than the validity time. In this case for the argument already expressed above, for
          - code [ref=e329]: MIN_VALIDITY
          - text: no client should be able to re-acquire the lock. So multiple clients will be able to lock N/2+1 instances at the same time (with "time" being the end of Step 2) only when the time to lock the majority was greater than the TTL time, making the lock invalid.
        - heading [level=3] [ref=e330]:
          - text: Liveness Arguments
          - link "Link to this section" [ref=e331] [cursor=pointer]:
            - /url: "#liveness-arguments"
        - paragraph [ref=e334]: "The system liveness is based on three main features:"
        - list [ref=e335]:
          - listitem [ref=e336]: "The auto release of the lock (since keys expire): eventually keys are available again to be locked."
          - listitem [ref=e337]: The fact that clients, usually, will cooperate removing the locks when the lock was not acquired, or when the lock was acquired and the work terminated, making it likely that we don’t have to wait for keys to expire to re-acquire the lock.
          - listitem [ref=e338]: The fact that when a client needs to retry a lock, it waits a time which is comparably greater than the time needed to acquire the majority of locks, in order to probabilistically make split brain conditions during resource contention unlikely.
        - paragraph [ref=e339]:
          - text: However, we pay an availability penalty equal to
          - link [ref=e340] [cursor=pointer]:
            - /url: /docs/latest/commands/ttl/
            - code [ref=e341]: TTL
          - text: time on network partitions, so if there are continuous partitions, we can pay this penalty indefinitely. This happens every time a client acquires a lock and gets partitioned away before being able to remove the lock.
        - paragraph [ref=e342]: Basically if there are infinite continuous network partitions, the system may become not available for an infinite amount of time.
        - heading [level=3] [ref=e343]:
          - text: Performance, Crash Recovery and fsync
          - link "Link to this section" [ref=e344] [cursor=pointer]:
            - /url: "#performance-crash-recovery-and-fsync"
        - paragraph [ref=e347]: Many users using Redis as a lock server need high performance in terms of both latency to acquire and release a lock, and number of acquire / release operations that it is possible to perform per second. In order to meet this requirement, the strategy to talk with the N Redis servers to reduce latency is definitely multiplexing (putting the socket in non-blocking mode, send all the commands, and read all the commands later, assuming that the RTT between the client and each instance is similar).
        - paragraph [ref=e348]: However there is another consideration around persistence if we want to target a crash-recovery system model.
        - paragraph [ref=e349]: Basically to see the problem here, let’s assume we configure Redis without persistence at all. A client acquires the lock in 3 of 5 instances. One of the instances where the client was able to acquire the lock is restarted, at this point there are again 3 instances that we can lock for the same resource, and another client can lock it again, violating the safety property of exclusivity of lock.
        - paragraph [ref=e350]:
          - text: If we enable AOF persistence, things will improve quite a bit. For example we can upgrade a server by sending it a
          - link [ref=e351] [cursor=pointer]:
            - /url: /docs/latest/commands/shutdown/
            - code [ref=e352]: SHUTDOWN
          - text: command and restarting it. Because Redis expires are semantically implemented so that time still elapses when the server is off, all our requirements are fine. However everything is fine as long as it is a clean shutdown. What about a power outage? If Redis is configured, as by default, to fsync on disk every second, it is possible that after a restart our key is missing. In theory, if we want to guarantee the lock safety in the face of any kind of instance restart, we need to enable
          - code [ref=e353]: fsync=always
          - text: in the persistence settings. This will affect performance due to the additional sync overhead.
        - paragraph [ref=e354]:
          - text: However things are better than they look like at a first glance. Basically, the algorithm safety is retained as long as when an instance restarts after a crash, it no longer participates to any
          - strong [ref=e355]: currently active
          - text: lock. This means that the set of currently active locks when the instance restarts were all obtained by locking instances other than the one which is rejoining the system.
        - paragraph [ref=e356]:
          - text: To guarantee this we just need to make an instance, after a crash, unavailable for at least a bit more than the max
          - link [ref=e357] [cursor=pointer]:
            - /url: /docs/latest/commands/ttl/
            - code [ref=e358]: TTL
          - text: we use. This is the time needed for all the keys about the locks that existed when the instance crashed to become invalid and be automatically released.
        - paragraph [ref=e359]:
          - text: Using
          - emphasis [ref=e360]: delayed restarts
          - text: it is basically possible to achieve safety even without any kind of Redis persistence available, however note that this may translate into an availability penalty. For example if a majority of instances crash, the system will become globally unavailable for
          - link [ref=e361] [cursor=pointer]:
            - /url: /docs/latest/commands/ttl/
            - code [ref=e362]: TTL
          - text: (here globally means that no resource at all will be lockable during this time).
        - heading [level=3] [ref=e363]:
          - text: "Making the algorithm more reliable: Extending the lock"
          - link "Link to this section" [ref=e364] [cursor=pointer]:
            - /url: "#making-the-algorithm-more-reliable-extending-the-lock"
        - paragraph [ref=e367]: If the work performed by clients consists of small steps, it is possible to use smaller lock validity times by default, and extend the algorithm implementing a lock extension mechanism. Basically the client, if in the middle of the computation while the lock validity is approaching a low value, may extend the lock by sending a Lua script to all the instances that extends the TTL of the key if the key exists and its value is still the random value the client assigned when the lock was acquired.
        - paragraph [ref=e368]: The client should only consider the lock re-acquired if it was able to extend the lock into the majority of instances, and within the validity time (basically the algorithm to use is very similar to the one used when acquiring the lock).
        - paragraph [ref=e369]: However this does not technically change the algorithm, so the maximum number of lock reacquisition attempts should be limited, otherwise one of the liveness properties is violated.
        - heading [level=3] [ref=e370]:
          - text: Disclaimer about consistency
          - link "Link to this section" [ref=e371] [cursor=pointer]:
            - /url: "#disclaimer-about-consistency"
        - paragraph [ref=e374]:
          - text: Please consider thoroughly reviewing the
          - link "Analysis of Redlock" [ref=e375] [cursor=pointer]:
            - /url: "#analysis-of-redlock"
          - text: "section at the end of this page. Martin Kleppman's article and antirez's answer to it are very relevant. If you are concerned about consistency and correctness, you should pay attention to the following topics:"
        - list [ref=e376]:
          - listitem [ref=e377]: You should implement fencing tokens. This is especially important for processes that can take significant time and applies to any distributed locking system. Extending locks' lifetime is also an option, but don´t assume that a lock is retained as long as the process that had acquired it is alive.
          - listitem [ref=e378]: Redis is not using monotonic clock for TTL expiration mechanism. That means that a wall-clock shift may result in a lock being acquired by more than one process. Even though the problem can be mitigated by preventing admins from manually setting the server's time and setting up NTP properly, there's still a chance of this issue occurring in real life and compromising consistency.
        - heading [level=2] [ref=e379]:
          - text: Want to help?
          - link "Link to this section" [ref=e380] [cursor=pointer]:
            - /url: "#want-to-help"
        - paragraph [ref=e383]: If you are into distributed systems, it would be great to have your opinion / analysis. Also reference implementations in other languages could be great.
        - paragraph [ref=e384]: Thanks in advance!
