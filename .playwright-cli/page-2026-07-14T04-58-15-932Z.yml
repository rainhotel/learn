                  - row [ref=e421]:
                    - rowheader "Valid Values:" [ref=e422]
                    - cell "[partitionId]:[brokerId],[partitionId]:[brokerId],..." [ref=e423]
                  - row [ref=e424]:
                    - rowheader "Server Default Property:" [ref=e425]
                    - cell "null" [ref=e426]
                  - row [ref=e427]:
                    - rowheader "Importance:" [ref=e428]
                    - cell "medium" [ref=e429]
            - listitem [ref=e430]:
              - heading [level=4] [ref=e431]:
                - link "index.interval.bytes" [ref=e432] [cursor=pointer]:
                  - /url: "#topicconfigs_index.interval.bytes"
              - paragraph [ref=e433]: This setting controls how frequently Kafka adds entries to its offset index and, conditionally, to its time index. The default setting ensures that we index a message roughly every 4096 bytes. More frequent indexing allows reads to jump closer to the exact position in the log but results in larger index files. You probably don't need to change this.
              - paragraph [ref=e434]: "Note: the time index will be inserted only when the timestamp is greater than the last indexed timestamp."
              - paragraph
              - table [ref=e435]:
                - rowgroup [ref=e436]:
