                    - cell "[-2,...]" [ref=e489]
                  - row [ref=e490]:
                    - rowheader "Server Default Property:" [ref=e491]
                    - cell "log.local.retention.bytes" [ref=e492]
                  - row [ref=e493]:
                    - rowheader "Importance:" [ref=e494]
                    - cell "medium" [ref=e495]
            - listitem [ref=e496]:
              - heading [level=4] [ref=e497]:
                - link "local.retention.ms" [ref=e498] [cursor=pointer]:
                  - /url: "#topicconfigs_local.retention.ms"
              - paragraph [ref=e499]:
                - text: The number of milliseconds to keep the local log segment before it gets deleted. Default value is -2, it represents
                - code [ref=e500]: retention.ms
                - text: value is to be used. The effective value should always be less than or equal to
                - code [ref=e501]: retention.ms
                - text: value.
              - table [ref=e502]:
                - rowgroup [ref=e503]:
