                    - cell "medium" [ref=e386]
            - listitem [ref=e387]:
              - heading [level=4] [ref=e388]:
                - link "flush.ms" [ref=e389] [cursor=pointer]:
                  - /url: "#topicconfigs_flush.ms"
              - paragraph [ref=e390]:
                - text: This setting allows specifying a time interval at which we will force an fsync of data written to the log. For example if this was set to 1000 we would fsync after 1000 ms had passed. Note that this setting depends on the broker-level configuration
                - code [ref=e391]: log.flush.scheduler.interval.ms
                - text: ", which controls how frequently the flush check occurs. In general we recommend you not set this and use replication for durability and allow the operating system's background flush capabilities as it is more efficient."
