                    - rowheader "Type:" [ref=e526]
                    - cell "long" [ref=e527]
                  - row [ref=e528]:
                    - rowheader "Default:" [ref=e529]
                    - cell "9223372036854775807" [ref=e530]
                  - row [ref=e531]:
                    - rowheader "Valid Values:" [ref=e532]
                    - cell "[1,...]" [ref=e533]
                  - row [ref=e534]:
                    - rowheader "Server Default Property:" [ref=e535]
                    - cell "log.cleaner.max.compaction.lag.ms" [ref=e536]
                  - row [ref=e537]:
                    - rowheader "Importance:" [ref=e538]
                    - cell "medium" [ref=e539]
            - listitem [ref=e540]:
              - heading [level=4] [ref=e541]:
                - link "max.message.bytes" [ref=e542] [cursor=pointer]:
                  - /url: "#topicconfigs_max.message.bytes"
              - paragraph [ref=e543]: The largest record batch size allowed by Kafka (after compression if compression is enabled).
              - table [ref=e544]:
                - rowgroup [ref=e545]:
                  - row [ref=e546]:
                    - rowheader "Type:" [ref=e547]
                    - cell "int" [ref=e548]
                  - row [ref=e549]:
                    - rowheader "Default:" [ref=e550]
                    - cell "1048588" [ref=e551]
                  - row [ref=e552]:
                    - rowheader "Valid Values:" [ref=e553]
                    - cell "[0,...]" [ref=e554]
                  - row [ref=e555]:
                    - rowheader "Server Default Property:" [ref=e556]
                    - cell "message.max.bytes" [ref=e557]
                  - row [ref=e558]:
                    - rowheader "Importance:" [ref=e559]
                    - cell "medium" [ref=e560]
            - listitem [ref=e561]:
              - heading [level=4] [ref=e562]:
                - link "message.timestamp.after.max.ms" [ref=e563] [cursor=pointer]:
                  - /url: "#topicconfigs_message.timestamp.after.max.ms"
              - paragraph [ref=e564]: This configuration sets the allowable timestamp difference between the message timestamp and the broker's timestamp. The message timestamp can be later than or equal to the broker's timestamp, with the maximum allowable difference determined by the value set in this configuration. If message.timestamp.type=CreateTime, the message will be rejected if the difference in timestamps exceeds this specified threshold. This configuration is ignored if message.timestamp.type=LogAppendTime.
              - table [ref=e565]:
                - rowgroup [ref=e566]:
                  - row [ref=e567]:
                    - rowheader "Type:" [ref=e568]
                    - cell "long" [ref=e569]
                  - row [ref=e570]:
                    - rowheader "Default:" [ref=e571]
                    - cell "3600000 (1 hour)" [ref=e572]
                  - row [ref=e573]:
                    - rowheader "Valid Values:" [ref=e574]
                    - cell "[0,...]" [ref=e575]
                  - row [ref=e576]:
                    - rowheader "Server Default Property:" [ref=e577]
                    - cell "log.message.timestamp.after.max.ms" [ref=e578]
                  - row [ref=e579]:
                    - rowheader "Importance:" [ref=e580]
                    - cell "medium" [ref=e581]
            - listitem [ref=e582]:
              - heading [level=4] [ref=e583]:
                - link "message.timestamp.before.max.ms" [ref=e584] [cursor=pointer]:
                  - /url: "#topicconfigs_message.timestamp.before.max.ms"
              - paragraph [ref=e585]: This configuration sets the allowable timestamp difference between the broker's timestamp and the message timestamp. The message timestamp can be earlier than or equal to the broker's timestamp, with the maximum allowable difference determined by the value set in this configuration. If message.timestamp.type=CreateTime, the message will be rejected if the difference in timestamps exceeds this specified threshold. This configuration is ignored if message.timestamp.type=LogAppendTime.
              - table [ref=e586]:
                - rowgroup [ref=e587]:
                  - row [ref=e588]:
                    - rowheader "Type:" [ref=e589]
                    - cell "long" [ref=e590]
                  - row [ref=e591]:
                    - rowheader "Default:" [ref=e592]
                    - cell "9223372036854775807" [ref=e593]
                  - row [ref=e594]:
                    - rowheader "Valid Values:" [ref=e595]
                    - cell "[0,...]" [ref=e596]
                  - row [ref=e597]:
                    - rowheader "Server Default Property:" [ref=e598]
                    - cell "log.message.timestamp.before.max.ms" [ref=e599]
                  - row [ref=e600]:
                    - rowheader "Importance:" [ref=e601]
                    - cell "medium" [ref=e602]
            - listitem [ref=e603]:
              - heading [level=4] [ref=e604]:
                - link "message.timestamp.type" [ref=e605] [cursor=pointer]:
                  - /url: "#topicconfigs_message.timestamp.type"
              - paragraph [ref=e606]: Define whether the timestamp in the message is message create time or log append time.
              - table [ref=e607]:
                - rowgroup [ref=e608]:
                  - row [ref=e609]:
                    - rowheader "Type:" [ref=e610]
                    - cell "string" [ref=e611]
                  - row [ref=e612]:
                    - rowheader "Default:" [ref=e613]
                    - cell "CreateTime" [ref=e614]
                  - row [ref=e615]:
                    - rowheader "Valid Values:" [ref=e616]
                    - cell "[CreateTime, LogAppendTime]" [ref=e617]
                  - row [ref=e618]:
                    - rowheader "Server Default Property:" [ref=e619]
                    - cell "log.message.timestamp.type" [ref=e620]
                  - row [ref=e621]:
                    - rowheader "Importance:" [ref=e622]
                    - cell "medium" [ref=e623]
            - listitem [ref=e624]:
              - heading [level=4] [ref=e625]:
                - link "min.cleanable.dirty.ratio" [ref=e626] [cursor=pointer]:
                  - /url: "#topicconfigs_min.cleanable.dirty.ratio"
              - paragraph [ref=e627]:
                - text: This configuration controls how frequently the log compactor will attempt to clean the log (assuming
                - link "log compaction" [ref=e628] [cursor=pointer]:
                  - /url: "#compaction"
                - text: "is enabled). By default we will avoid cleaning a log where more than 50% of the log has been compacted. This ratio bounds the maximum space wasted in the log by duplicates (at 50% at most 50% of the log could be duplicates). A higher ratio will mean fewer, more efficient cleanings but will mean more wasted space in the log. If the max.compaction.lag.ms or the min.compaction.lag.ms configurations are also specified, then the log compactor considers the log to be eligible for compaction as soon as either: (i) the dirty ratio threshold has been met and the log has had dirty (uncompacted) records for at least the min.compaction.lag.ms duration, or (ii) if the log has had dirty (uncompacted) records for at most the max.compaction.lag.ms period."
              - table [ref=e629]:
                - rowgroup [ref=e630]:
                  - row [ref=e631]:
                    - rowheader "Type:" [ref=e632]
                    - cell "double" [ref=e633]
                  - row [ref=e634]:
                    - rowheader "Default:" [ref=e635]
                    - cell "0.5" [ref=e636]
                  - row [ref=e637]:
                    - rowheader "Valid Values:" [ref=e638]
                    - cell "[0,...,1]" [ref=e639]
                  - row [ref=e640]:
                    - rowheader "Server Default Property:" [ref=e641]
                    - cell "log.cleaner.min.cleanable.ratio" [ref=e642]
                  - row [ref=e643]:
                    - rowheader "Importance:" [ref=e644]
                    - cell "medium" [ref=e645]
            - listitem [ref=e646]:
              - heading [level=4] [ref=e647]:
                - link "min.compaction.lag.ms" [ref=e648] [cursor=pointer]:
                  - /url: "#topicconfigs_min.compaction.lag.ms"
              - paragraph [ref=e649]: The minimum time a message will remain uncompacted in the log. Only applicable for logs that are being compacted.
              - table [ref=e650]:
                - rowgroup [ref=e651]:
                  - row [ref=e652]:
                    - rowheader "Type:" [ref=e653]
                    - cell "long" [ref=e654]
                  - row [ref=e655]:
                    - rowheader "Default:" [ref=e656]
                    - cell "0" [ref=e657]
                  - row [ref=e658]:
                    - rowheader "Valid Values:" [ref=e659]
                    - cell "[0,...]" [ref=e660]
                  - row [ref=e661]:
                    - rowheader "Server Default Property:" [ref=e662]
                    - cell "log.cleaner.min.compaction.lag.ms" [ref=e663]
                  - row [ref=e664]:
                    - rowheader "Importance:" [ref=e665]
                    - cell "medium" [ref=e666]
            - listitem [ref=e667]:
              - heading [level=4] [ref=e668]:
                - link "min.insync.replicas" [ref=e669] [cursor=pointer]:
                  - /url: "#topicconfigs_min.insync.replicas"
              - paragraph [ref=e670]:
                - text: Specifies the minimum number of in-sync replicas (including the leader) required for a write to succeed when a producer sets
                - code [ref=e671]: acks
                - text: to "all" (or "-1"). In the
                - code [ref=e672]: acks=all
                - text: case, every in-sync replica must acknowledge a write for it to be considered successful. E.g., if a topic has
                - code [ref=e673]: replication.factor
                - text: of 3 and the ISR set includes all three replicas, then all three replicas must acknowledge an
                - code [ref=e674]: acks=all
                - text: write for it to succeed, even if
                - code [ref=e675]: min.insync.replicas
                - text: happens to be less than 3. If
                - code [ref=e676]: acks=all
                - text: and the current ISR set contains fewer than
                - code [ref=e677]: min.insync.replicas
                - text: members, then the producer will raise an exception (either
                - code [ref=e678]: NotEnoughReplicas
                - text: or
                - code [ref=e679]: NotEnoughReplicasAfterAppend
                - text: ).Regardless of the
                - code [ref=e680]: acks
                - text: setting, the messages will not be visible to the consumers until they are replicated to all in-sync replicas and the
                - code [ref=e681]: min.insync.replicas
                - text: condition is met.When used together,
                - code [ref=e682]: min.insync.replicas
                - text: and
                - code [ref=e683]: acks
                - text: allow you to enforce greater durability guarantees. A typical scenario would be to create a topic with a replication factor of 3, set
                - code [ref=e684]: min.insync.replicas
                - text: to 2, and produce with
                - code [ref=e685]: acks
                - text: of "all". This ensures that a majority of replicas must persist a write before it's considered successful by the producer and it's visible to consumers.
              - paragraph [ref=e686]:
                - text: Note that when the Eligible Leader Replicas feature is enabled, the semantics of this config changes. Please refer to
                - link "the ELR section" [ref=e687] [cursor=pointer]:
                  - /url: "#eligible_leader_replicas"
                - text: for more info.
              - paragraph
              - table [ref=e688]:
                - rowgroup [ref=e689]:
                  - row [ref=e690]:
                    - rowheader "Type:" [ref=e691]
                    - cell "int" [ref=e692]
                  - row [ref=e693]:
                    - rowheader "Default:" [ref=e694]
                    - cell "1" [ref=e695]
                  - row [ref=e696]:
                    - rowheader "Valid Values:" [ref=e697]
                    - cell "[1,...]" [ref=e698]
                  - row [ref=e699]:
                    - rowheader "Server Default Property:" [ref=e700]
                    - cell "min.insync.replicas" [ref=e701]
                  - row [ref=e702]:
                    - rowheader "Importance:" [ref=e703]
                    - cell "medium" [ref=e704]
            - listitem [ref=e705]:
              - heading [level=4] [ref=e706]:
                - link "preallocate" [ref=e707] [cursor=pointer]:
                  - /url: "#topicconfigs_preallocate"
              - paragraph [ref=e708]: True if we should preallocate the file on disk when creating a new log segment.
              - table [ref=e709]:
                - rowgroup [ref=e710]:
                  - row [ref=e711]:
                    - rowheader "Type:" [ref=e712]
                    - cell "boolean" [ref=e713]
                  - row [ref=e714]:
                    - rowheader "Default:" [ref=e715]
                    - cell "false" [ref=e716]
                  - row [ref=e717]:
                    - columnheader "Valid Values:" [ref=e718]
                    - cell [ref=e719]
                  - row [ref=e720]:
                    - rowheader "Server Default Property:" [ref=e721]
                    - cell "log.preallocate" [ref=e722]
                  - row [ref=e723]:
                    - rowheader "Importance:" [ref=e724]
                    - cell "medium" [ref=e725]
            - listitem [ref=e726]:
              - heading [level=4] [ref=e727]:
                - link "remote.log.copy.disable" [ref=e728] [cursor=pointer]:
                  - /url: "#topicconfigs_remote.log.copy.disable"
              - paragraph [ref=e729]: Determines whether tiered data for a topic should become read only, and no more data uploading on a topic. Once this config is set to true, the local retention configuration (i.e. local.retention.ms/bytes) becomes irrelevant, and all data expiration follows the topic-wide retention configuration(i.e. retention.ms/bytes).
              - table [ref=e730]:
                - rowgroup [ref=e731]:
                  - row [ref=e732]:
                    - rowheader "Type:" [ref=e733]
                    - cell "boolean" [ref=e734]
                  - row [ref=e735]:
                    - rowheader "Default:" [ref=e736]
                    - cell "false" [ref=e737]
                  - row [ref=e738]:
                    - columnheader "Valid Values:" [ref=e739]
                    - cell [ref=e740]
                  - row [ref=e741]:
                    - rowheader "Server Default Property:" [ref=e742]
                    - cell "null" [ref=e743]
                  - row [ref=e744]:
                    - rowheader "Importance:" [ref=e745]
                    - cell "medium" [ref=e746]
            - listitem [ref=e747]:
              - heading [level=4] [ref=e748]:
                - link "remote.log.delete.on.disable" [ref=e749] [cursor=pointer]:
                  - /url: "#topicconfigs_remote.log.delete.on.disable"
              - paragraph [ref=e750]:
                - text: Determines whether tiered data for a topic should be deleted after tiered storage is disabled on a topic. This configuration should be enabled when trying to set
                - code [ref=e751]: remote.storage.enable
                - text: from true to false
              - table [ref=e752]:
                - rowgroup [ref=e753]:
                  - row [ref=e754]:
                    - rowheader "Type:" [ref=e755]
                    - cell "boolean" [ref=e756]
                  - row [ref=e757]:
                    - rowheader "Default:" [ref=e758]
                    - cell "false" [ref=e759]
                  - row [ref=e760]:
                    - columnheader "Valid Values:" [ref=e761]
                    - cell [ref=e762]
                  - row [ref=e763]:
                    - rowheader "Server Default Property:" [ref=e764]
                    - cell "null" [ref=e765]
                  - row [ref=e766]:
                    - rowheader "Importance:" [ref=e767]
                    - cell "medium" [ref=e768]
            - listitem [ref=e769]:
              - heading [level=4] [ref=e770]:
                - link "remote.storage.enable" [ref=e771] [cursor=pointer]:
                  - /url: "#topicconfigs_remote.storage.enable"
              - paragraph [ref=e772]:
                - text: To enable tiered storage for a topic, set this configuration to true. To disable tiered storage for a topic that has it enabled, set this configuration to false. When disabling, you must also set
                - code [ref=e773]: remote.log.delete.on.disable
                - text: to true.
              - table [ref=e774]:
                - rowgroup [ref=e775]:
                  - row [ref=e776]:
                    - rowheader "Type:" [ref=e777]
                    - cell "boolean" [ref=e778]
                  - row [ref=e779]:
                    - rowheader "Default:" [ref=e780]
                    - cell "false" [ref=e781]
                  - row [ref=e782]:
                    - columnheader "Valid Values:" [ref=e783]
                    - cell [ref=e784]
                  - row [ref=e785]:
                    - rowheader "Server Default Property:" [ref=e786]
                    - cell "null" [ref=e787]
                  - row [ref=e788]:
                    - rowheader "Importance:" [ref=e789]
                    - cell "medium" [ref=e790]
            - listitem [ref=e791]:
              - heading [level=4] [ref=e792]:
                - link "retention.bytes" [ref=e793] [cursor=pointer]:
                  - /url: "#topicconfigs_retention.bytes"
              - paragraph [ref=e794]: This configuration controls the maximum size a partition (which consists of log segments) can grow to before we will discard old log segments to free up space if we are using the "delete" retention policy. By default there is no size limit only a time limit. Since this limit is enforced at the partition level, multiply it by the number of partitions to compute the topic retention in bytes. Additionally, retention.bytes configuration operates independently of "segment.ms" and "segment.bytes" configurations. Moreover, it triggers the rolling of new segment if the retention.bytes is configured to zero.
              - table [ref=e795]:
                - rowgroup [ref=e796]:
                  - row [ref=e797]:
                    - rowheader "Type:" [ref=e798]
                    - cell "long" [ref=e799]
                  - row [ref=e800]:
                    - rowheader "Default:" [ref=e801]
                    - cell "-1" [ref=e802]
                  - row [ref=e803]:
                    - columnheader "Valid Values:" [ref=e804]
                    - cell [ref=e805]
                  - row [ref=e806]:
                    - rowheader "Server Default Property:" [ref=e807]
                    - cell "log.retention.bytes" [ref=e808]
                  - row [ref=e809]:
                    - rowheader "Importance:" [ref=e810]
                    - cell "medium" [ref=e811]
            - listitem [ref=e812]:
              - heading [level=4] [ref=e813]:
                - link "retention.ms" [ref=e814] [cursor=pointer]:
                  - /url: "#topicconfigs_retention.ms"
              - paragraph [ref=e815]: This configuration controls the maximum time we will retain a log before we will discard old log segments to free up space if we are using the "delete" retention policy. This represents an SLA on how soon consumers must read their data. If set to -1, no time limit is applied. Additionally, retention.ms configuration operates independently of "segment.ms" and "segment.bytes" configurations. Moreover, it triggers the rolling of new segment if the retention.ms condition is satisfied.
              - table [ref=e816]:
                - rowgroup [ref=e817]:
                  - row [ref=e818]:
                    - rowheader "Type:" [ref=e819]
                    - cell "long" [ref=e820]
                  - row [ref=e821]:
                    - rowheader "Default:" [ref=e822]
                    - cell "604800000 (7 days)" [ref=e823]
                  - row [ref=e824]:
                    - rowheader "Valid Values:" [ref=e825]
                    - cell "[-1,...]" [ref=e826]
                  - row [ref=e827]:
                    - rowheader "Server Default Property:" [ref=e828]
                    - cell "log.retention.ms" [ref=e829]
                  - row [ref=e830]:
                    - rowheader "Importance:" [ref=e831]
                    - cell "medium" [ref=e832]
            - listitem [ref=e833]:
              - heading [level=4] [ref=e834]:
                - link "segment.bytes" [ref=e835] [cursor=pointer]:
                  - /url: "#topicconfigs_segment.bytes"
              - paragraph [ref=e836]: This configuration controls the segment file size for the log. Retention and cleaning is always done a file at a time so a larger segment size means fewer files but less granular control over retention.
              - table [ref=e837]:
                - rowgroup [ref=e838]:
                  - row [ref=e839]:
                    - rowheader "Type:" [ref=e840]
                    - cell "int" [ref=e841]
                  - row [ref=e842]:
                    - rowheader "Default:" [ref=e843]
                    - cell "1073741824 (1 gibibyte)" [ref=e844]
                  - row [ref=e845]:
                    - rowheader "Valid Values:" [ref=e846]
                    - cell "[1048576,...]" [ref=e847]
                  - row [ref=e848]:
                    - rowheader "Server Default Property:" [ref=e849]
                    - cell "log.segment.bytes" [ref=e850]
                  - row [ref=e851]:
                    - rowheader "Importance:" [ref=e852]
                    - cell "medium" [ref=e853]
            - listitem [ref=e854]:
              - heading [level=4] [ref=e855]:
                - link "segment.index.bytes" [ref=e856] [cursor=pointer]:
                  - /url: "#topicconfigs_segment.index.bytes"
              - paragraph [ref=e857]: This configuration controls the size of the index that maps offsets to file positions. We preallocate this index file and shrink it only after log rolls. You generally should not need to change this setting.
              - table [ref=e858]:
                - rowgroup [ref=e859]:
                  - row [ref=e860]:
                    - rowheader "Type:" [ref=e861]
                    - cell "int" [ref=e862]
                  - row [ref=e863]:
                    - rowheader "Default:" [ref=e864]
                    - cell "10485760 (10 mebibytes)" [ref=e865]
                  - row [ref=e866]:
                    - rowheader "Valid Values:" [ref=e867]
                    - cell "[4,...]" [ref=e868]
                  - row [ref=e869]:
                    - rowheader "Server Default Property:" [ref=e870]
                    - cell "log.index.size.max.bytes" [ref=e871]
                  - row [ref=e872]:
                    - rowheader "Importance:" [ref=e873]
                    - cell "medium" [ref=e874]
            - listitem [ref=e875]:
              - heading [level=4] [ref=e876]:
                - link "segment.jitter.ms" [ref=e877] [cursor=pointer]:
                  - /url: "#topicconfigs_segment.jitter.ms"
              - paragraph [ref=e878]: The maximum random jitter subtracted from the scheduled segment roll time to avoid thundering herds of segment rolling
              - table [ref=e879]:
                - rowgroup [ref=e880]:
                  - row [ref=e881]:
                    - rowheader "Type:" [ref=e882]
                    - cell "long" [ref=e883]
                  - row [ref=e884]:
                    - rowheader "Default:" [ref=e885]
                    - cell "0" [ref=e886]
                  - row [ref=e887]:
                    - rowheader "Valid Values:" [ref=e888]
                    - cell "[0,...]" [ref=e889]
                  - row [ref=e890]:
                    - rowheader "Server Default Property:" [ref=e891]
                    - cell "log.roll.jitter.ms" [ref=e892]
                  - row [ref=e893]:
                    - rowheader "Importance:" [ref=e894]
                    - cell "medium" [ref=e895]
            - listitem [ref=e896]:
              - heading [level=4] [ref=e897]:
                - link "segment.ms" [ref=e898] [cursor=pointer]:
                  - /url: "#topicconfigs_segment.ms"
              - paragraph [ref=e899]: This configuration controls the period of time after which Kafka will force the log to roll even if the segment file isn't full to ensure that retention can delete or compact old data.
              - table [ref=e900]:
                - rowgroup [ref=e901]:
                  - row [ref=e902]:
                    - rowheader "Type:" [ref=e903]
                    - cell "long" [ref=e904]
                  - row [ref=e905]:
                    - rowheader "Default:" [ref=e906]
                    - cell "604800000 (7 days)" [ref=e907]
                  - row [ref=e908]:
                    - rowheader "Valid Values:" [ref=e909]
                    - cell "[1,...]" [ref=e910]
                  - row [ref=e911]:
                    - rowheader "Server Default Property:" [ref=e912]
                    - cell "log.roll.ms" [ref=e913]
                  - row [ref=e914]:
                    - rowheader "Importance:" [ref=e915]
                    - cell "medium" [ref=e916]
            - listitem [ref=e917]:
              - heading [level=4] [ref=e918]:
                - link "unclean.leader.election.enable" [ref=e919] [cursor=pointer]:
                  - /url: "#topicconfigs_unclean.leader.election.enable"
              - paragraph [ref=e920]: Indicates whether to enable replicas not in the ISR set to be elected as leader as a last resort, even though doing so may result in data loss.
              - paragraph [ref=e921]:
                - text: "Note: In KRaft mode, when enabling this config dynamically, it needs to wait for the unclean leader electionthread to trigger election periodically (default is 5 minutes). Please run"
                - code [ref=e922]: kafka-leader-election.sh
                - text: with
                - code [ref=e923]: unclean
                - text: option to trigger the unclean leader election immediately if needed.
              - paragraph
              - table [ref=e924]:
                - rowgroup [ref=e925]:
