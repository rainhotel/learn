            - listitem [ref=e365]:
              - heading [level=4] [ref=e366]:
                - link "flush.messages" [ref=e367] [cursor=pointer]:
                  - /url: "#topicconfigs_flush.messages"
              - paragraph [ref=e368]:
                - text: This setting allows specifying an interval at which we will force an fsync of data written to the log. For example if this was set to 1 we would fsync after every message; if it were 5 we would fsync after every five messages. In general we recommend you not set this and use replication for durability and allow the operating system's background flush capabilities as it is more efficient. This setting can be overridden on a per-topic basis (see
                - link "the per-topic configuration section" [ref=e369] [cursor=pointer]:
                  - /url: "#topicconfigs"
                - text: ).
              - table [ref=e370]:
