            - listitem [ref=e322]:
              - heading [level=4] [ref=e323]:
                - link "delete.retention.ms" [ref=e324] [cursor=pointer]:
                  - /url: "#topicconfigs_delete.retention.ms"
              - paragraph [ref=e325]:
                - text: The amount of time to retain delete tombstone markers for
                - link "log compacted" [ref=e326] [cursor=pointer]:
                  - /url: "#compaction"
