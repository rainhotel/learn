                    - cell "-2" [ref=e509]
                  - row [ref=e510]:
                    - rowheader "Valid Values:" [ref=e511]
                    - cell "[-2,...]" [ref=e512]
                  - row [ref=e513]:
                    - rowheader "Server Default Property:" [ref=e514]
                    - cell "log.local.retention.ms" [ref=e515]
                  - row [ref=e516]:
                    - rowheader "Importance:" [ref=e517]
                    - cell "medium" [ref=e518]
            - listitem [ref=e519]:
              - heading [level=4] [ref=e520]:
                - link "max.compaction.lag.ms" [ref=e521] [cursor=pointer]:
                  - /url: "#topicconfigs_max.compaction.lag.ms"
              - paragraph [ref=e522]: The maximum time a message will remain ineligible for compaction in the log. Only applicable for logs that are being compacted.
              - table [ref=e523]:
                - rowgroup [ref=e524]:
