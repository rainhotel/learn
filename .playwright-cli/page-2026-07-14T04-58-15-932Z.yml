                - link "follower.replication.throttled.replicas" [ref=e411] [cursor=pointer]:
                  - /url: "#topicconfigs_follower.replication.throttled.replicas"
              - paragraph [ref=e412]: A list of replicas for which log replication should be throttled on the follower side. The list should describe a set of replicas in the form [PartitionId]:[BrokerId],[PartitionId]:[BrokerId]:... or alternatively the wildcard '*' can be used to throttle all replicas for this topic.
              - table [ref=e413]:
