                    - rowheader "Type:" [ref=e438]
                    - cell "int" [ref=e439]
                  - row [ref=e440]:
                    - rowheader "Default:" [ref=e441]
                    - cell "4096 (4 kibibytes)" [ref=e442]
                  - row [ref=e443]:
                    - rowheader "Valid Values:" [ref=e444]
                    - cell "[0,...]" [ref=e445]
                  - row [ref=e446]:
                    - rowheader "Server Default Property:" [ref=e447]
                    - cell "log.index.interval.bytes" [ref=e448]
                  - row [ref=e449]:
                    - rowheader "Importance:" [ref=e450]
                    - cell "medium" [ref=e451]
            - listitem [ref=e452]:
              - heading [level=4] [ref=e453]:
                - link "leader.replication.throttled.replicas" [ref=e454] [cursor=pointer]:
                  - /url: "#topicconfigs_leader.replication.throttled.replicas"
              - paragraph [ref=e455]: A list of replicas for which log replication should be throttled on the leader side. The list should describe a set of replicas in the form [PartitionId]:[BrokerId],[PartitionId]:[BrokerId]:... or alternatively the wildcard '*' can be used to throttle all replicas for this topic.
              - table [ref=e456]:
                - rowgroup [ref=e457]:
                  - row [ref=e458]:
                    - rowheader "Type:" [ref=e459]
                    - cell "list" [ref=e460]
                  - row [ref=e461]:
                    - rowheader "Default:" [ref=e462]
                    - cell "\"\"" [ref=e463]
                  - row [ref=e464]:
                    - rowheader "Valid Values:" [ref=e465]
                    - cell "[partitionId]:[brokerId],[partitionId]:[brokerId],..." [ref=e466]
                  - row [ref=e467]:
                    - rowheader "Server Default Property:" [ref=e468]
                    - cell "null" [ref=e469]
                  - row [ref=e470]:
                    - rowheader "Importance:" [ref=e471]
                    - cell "medium" [ref=e472]
            - listitem [ref=e473]:
              - heading [level=4] [ref=e474]:
                - link "local.retention.bytes" [ref=e475] [cursor=pointer]:
                  - /url: "#topicconfigs_local.retention.bytes"
              - paragraph [ref=e476]:
                - text: The maximum size of local log segments that can grow for a partition before it deletes the old segments. Default value is -2, it represents
                - code [ref=e477]: retention.bytes
                - text: value to be used. The effective value should always be less than or equal to
                - code [ref=e478]: retention.bytes
                - text: value.
              - table [ref=e479]:
                - rowgroup [ref=e480]:
