        - generic [ref=e163]:
          - heading "Topic Configs" [level=1] [ref=e164]
          - generic [ref=e165]: Topic Configs
          - generic [ref=e167]:
            - heading "Tags:" [level=5] [ref=e168]
            - list [ref=e169]:
              - listitem [ref=e170]:
                - link "Kafka" [ref=e171] [cursor=pointer]:
                  - /url: https://kafka.apache.org/tags/kafka/
              - listitem [ref=e172]:
                - link "Docs" [ref=e173] [cursor=pointer]:
                  - /url: https://kafka.apache.org/tags/docs/
          - paragraph [ref=e174]:
            - text: Configurations pertinent to topics have both a server default as well an optional per-topic override. If no per-topic configuration is given the server default is used. The override can be set at topic creation time by giving one or more
            - code [ref=e175]: "--config"
            - text: options. This example creates a topic named
            - emphasis [ref=e176]: my-topic
            - text: "with a custom max message size and flush rate:"
          - generic [ref=e178]:
            - button "Copy to clipboard" [ref=e179] [cursor=pointer]: 
            - code [ref=e180]:
              - generic [ref=e181]: $ bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic my-topic --partitions 1 \
              - generic [ref=e183]: "--replication-factor 1 --config max.message.bytes=64000 --config flush.messages=1"
          - paragraph [ref=e185]:
            - text: Overrides can also be changed or set later using the alter configs command. This example updates the max message size for
            - emphasis [ref=e186]: my-topic
            - text: ":"
          - generic [ref=e188]:
            - button "Copy to clipboard" [ref=e189] [cursor=pointer]: 
            - code [ref=e190]:
              - generic [ref=e191]: $ bin/kafka-configs.sh --bootstrap-server localhost:9092 --entity-type topics --entity-name my-topic \
              - generic [ref=e193]: "--alter --add-config max.message.bytes=128000"
          - paragraph [ref=e195]: To check overrides set on the topic you can do
          - generic [ref=e197]:
            - button "Copy to clipboard" [ref=e198] [cursor=pointer]: 
            - code [ref=e199]:
              - generic [ref=e200]: $ bin/kafka-configs.sh --bootstrap-server localhost:9092 --entity-type topics --entity-name my-topic --describe
          - paragraph [ref=e202]: To remove an override you can do
          - generic [ref=e204]:
            - button "Copy to clipboard" [ref=e205] [cursor=pointer]: 
            - code [ref=e206]:
              - generic [ref=e207]: $ bin/kafka-configs.sh --bootstrap-server localhost:9092 --entity-type topics --entity-name my-topic \
              - generic [ref=e209]: "--alter --delete-config max.message.bytes"
          - paragraph [ref=e211]: Below is the topic configuration. The server’s default configuration for this property is given under the Server Default Property heading. A given server default config value only applies to a topic if it does not have an explicit topic config override.
          - list [ref=e212]:
            - listitem [ref=e213]:
              - heading [level=4] [ref=e214]:
                - link "cleanup.policy" [ref=e215] [cursor=pointer]:
                  - /url: "#topicconfigs_cleanup.policy"
              - paragraph [ref=e216]:
                - text: This config designates the retention policy to use on log segments. The "delete" policy (which is the default) will discard old segments when their retention time or size limit has been reached. The "compact" policy will enable
                - link "log compaction" [ref=e217] [cursor=pointer]:
                  - /url: "#compaction"
                - text: ", which retains the latest value for each key. It is also possible to specify both policies in a comma-separated list (e.g. \"delete,compact\"). In this case, old segments will be discarded per the retention time and size configuration, while retained segments will be compacted. An empty list means infinite retention - no cleanup policies will be applied and log segments will be retained indefinitely. Note that with remote storage enabled, local retention limits (log.local.retention.ms and log.local.retention.bytes) are still applied to local segments."
              - table [ref=e218]:
                - rowgroup [ref=e219]:
                  - row [ref=e220]:
                    - rowheader "Type:" [ref=e221]
                    - cell "list" [ref=e222]
                  - row [ref=e223]:
                    - rowheader "Default:" [ref=e224]
                    - cell "delete" [ref=e225]
                  - row [ref=e226]:
                    - rowheader "Valid Values:" [ref=e227]
                    - cell "[compact, delete]" [ref=e228]
                  - row [ref=e229]:
                    - rowheader "Server Default Property:" [ref=e230]
                    - cell "log.cleanup.policy" [ref=e231]
                  - row [ref=e232]:
                    - rowheader "Importance:" [ref=e233]
                    - cell "medium" [ref=e234]
            - listitem [ref=e235]:
              - heading [level=4] [ref=e236]:
                - link "compression.gzip.level" [ref=e237] [cursor=pointer]:
