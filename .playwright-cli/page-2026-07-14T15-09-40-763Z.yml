          - heading "Traces" [level=1] [ref=e196]
          - generic [ref=e197]: The path of a request through your application.
          - paragraph [ref=e198]:
            - strong [ref=e199]: Traces
            - text: give us the big picture of what happens when a request is made to an application. Whether your application is a monolith with a single database or a sophisticated mesh of services, traces are essential to understanding the full “path” a request takes in your application.
          - paragraph [ref=e200]:
            - text: Let’s explore this with three units of work, represented as
            - link "Spans" [ref=e201] [cursor=pointer]:
              - /url: "#spans"
            - text: ":"
          - alert [ref=e202]:
            - heading "Note" [ref=e203]
            - paragraph [ref=e205]:
              - text: The following JSON examples do not represent a specific format, and especially not
              - link "OTLP/JSON" [ref=e206] [cursor=pointer]:
                - /url: /docs/specs/otlp/#json-protobuf-encoding
              - text: ", which is more verbose."
          - paragraph [ref=e207]:
            - code [ref=e208]: hello
            - text: "span:"
