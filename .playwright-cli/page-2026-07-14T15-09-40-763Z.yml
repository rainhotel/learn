          - paragraph [ref=e489]: "Spans can be nested, as is implied by the presence of a parent span ID: child spans represent sub-operations. This allows spans to more accurately capture the work done in an application."
          - heading "Span Context" [level=3] [ref=e490]
          - paragraph [ref=e491]: "Span context is an immutable object on every span that contains the following:"
          - list [ref=e492]:
            - listitem [ref=e493]: The Trace ID representing the trace that the span is a part of
            - listitem [ref=e494]: The span’s Span ID
            - listitem [ref=e495]: Trace Flags, a binary encoding containing information about the trace
            - listitem [ref=e496]: Trace State, a list of key-value pairs that can carry vendor-specific trace information
          - paragraph [ref=e497]:
            - text: Span context is the part of a span that is serialized and propagated alongside
            - link "Distributed Context" [ref=e498] [cursor=pointer]:
              - /url: "#context-propagation"
            - text: and
            - link "Baggage" [ref=e499] [cursor=pointer]:
              - /url: ../baggage
            - text: .
          - paragraph [ref=e500]:
            - text: Because Span Context contains the Trace ID, it is used when creating
            - link "Span Links" [ref=e501] [cursor=pointer]:
              - /url: "#span-links"
            - text: .
          - heading "Attributes" [level=3] [ref=e502]
          - paragraph [ref=e503]: Attributes are key-value pairs that contain metadata that you can use to annotate a Span to carry information about the operation it is tracking.
          - paragraph [ref=e504]: For example, if a span tracks an operation that adds an item to a user’s shopping cart in an eCommerce system, you can capture the user’s ID, the ID of the item to add to the cart, and the cart ID.
          - paragraph [ref=e505]: You can add attributes to spans during or after span creation. Prefer adding attributes at span creation to make the attributes available to SDK sampling. If you have to add a value after span creation, update the span with the value.
          - paragraph [ref=e506]: "Attributes have the following rules that each language SDK implements:"
          - list [ref=e507]:
            - listitem [ref=e508]: Keys must be non-null string values
            - listitem [ref=e509]: Values must be a non-null string, boolean, floating point value, integer, or an array of these values
          - paragraph [ref=e510]:
            - text: Additionally, there are
            - link "Semantic Attributes" [ref=e511] [cursor=pointer]:
              - /url: /docs/specs/semconv/general/trace/
            - text: ", which are known naming conventions for metadata that is typically present in common operations. It’s helpful to use semantic attribute naming wherever possible so that common kinds of metadata are standardized across systems."
          - heading "Span Events" [level=3] [ref=e512]
          - paragraph [ref=e513]: A Span Event can be thought of as a structured log message (or annotation) on a Span, typically used to denote a meaningful, singular point in time during the Span’s duration.
          - paragraph [ref=e514]: "For example, consider two scenarios in a web browser:"
          - list [ref=e515]:
            - listitem [ref=e516]: Tracking a page load
            - listitem [ref=e517]: Denoting when a page becomes interactive
          - paragraph [ref=e518]: A Span is best used to track the first scenario because it’s an operation with a start and an end.
          - paragraph [ref=e519]: A Span Event is best used to track the second scenario because it represents a meaningful, singular point in time.
          - heading "When to use span events versus span attributes" [level=4] [ref=e520]
          - paragraph [ref=e521]: Since span events also contain attributes, the question of when to use events instead of attributes might not always have an obvious answer. To inform your decision, consider whether a specific timestamp is meaningful.
          - paragraph [ref=e522]: For example, when you’re tracking an operation with a span and the operation completes, you might want to add data from the operation to your telemetry.
          - list [ref=e523]:
            - listitem [ref=e524]: If the timestamp in which the operation completes is meaningful or relevant, attach the data to a span event.
            - listitem [ref=e525]: If the timestamp isn’t meaningful, attach the data as span attributes.
          - heading "Span Links" [level=3] [ref=e526]
          - paragraph [ref=e527]: Links exist so that you can associate one span with one or more spans, implying a causal relationship. For example, let’s say we have a distributed system where some operations are tracked by a trace.
          - paragraph [ref=e528]: In response to some of these operations, an additional operation is queued to be executed, but its execution is asynchronous. We can track this subsequent operation with a trace as well.
          - paragraph [ref=e529]: We would like to associate the trace for the subsequent operations with the first trace, but we cannot predict when the subsequent operations will start. We need to associate these two traces, so we will use a span link.
          - paragraph [ref=e530]: You can link the last span from the first trace to the first span in the second trace. Now, they are causally associated with one another.
          - paragraph [ref=e531]: Links are optional but serve as a good way to associate trace spans with one another.
          - paragraph [ref=e532]:
            - text: For more information see
            - link "Span Links" [ref=e533] [cursor=pointer]:
              - /url: /docs/specs/otel/trace/api/#link
            - text: .
          - heading "Span Status" [level=3] [ref=e534]
          - paragraph [ref=e535]: "Each span has a status. The three possible values are:"
          - list [ref=e536]:
            - listitem [ref=e537]:
              - code [ref=e538]: Unset
            - listitem [ref=e539]:
              - code [ref=e540]: Error
            - listitem [ref=e541]:
              - code [ref=e542]: Ok
          - paragraph [ref=e543]:
            - text: The default value is
            - code [ref=e544]: Unset
            - text: . A span status that is
            - code [ref=e545]: Unset
            - text: means that the operation it tracked successfully completed without an error.
          - paragraph [ref=e546]:
            - text: When a span status is
            - code [ref=e547]: Error
            - text: ", then that means some error occurred in the operation it tracks. For example, this could be due to an HTTP 500 error on a server handling a request."
          - paragraph [ref=e548]:
            - text: When a span status is
            - code [ref=e549]: Ok
            - text: ", then that means the span was explicitly marked as error-free by the developer of an application. Although this is unintuitive, it’s not required to set a span status as"
            - code [ref=e550]: Ok
            - text: when a span is known to have completed without error, as this is covered by
            - code [ref=e551]: Unset
            - text: . What
            - code [ref=e552]: Ok
            - text: does is represent an unambiguous “final call” on the status of a span that has been explicitly set by a user. This is helpful in any situation where a developer wishes for there to be no other interpretation of a span other than “successful”.
          - paragraph [ref=e553]:
            - text: "To reiterate:"
            - code [ref=e554]: Unset
            - text: represents a span that completed without an error.
            - code [ref=e555]: Ok
            - text: represents when a developer explicitly marks a span as successful. In most cases, it is not necessary to explicitly mark a span as
            - code [ref=e556]: Ok
            - text: .
          - heading "Span Kind" [level=3] [ref=e557]
          - paragraph [ref=e558]:
            - text: When a span is created, it is one of
            - code [ref=e559]: Client
            - text: ","
            - code [ref=e560]: Server
            - text: ","
            - code [ref=e561]: Internal
            - text: ","
            - code [ref=e562]: Producer
            - text: ", or"
            - code [ref=e563]: Consumer
            - text: . This span kind provides a hint to the tracing backend as to how the trace should be assembled. According to the OpenTelemetry specification, the parent of a server span is often a remote client span, and the child of a client span is usually a server span. Similarly, the parent of a consumer span is always a producer and the child of a producer span is always a consumer. If not provided, the span kind is assumed to be internal.
          - paragraph [ref=e564]:
            - text: For more information regarding SpanKind, see
            - link "SpanKind" [ref=e565] [cursor=pointer]:
              - /url: /docs/specs/otel/trace/api/#spankind
            - text: .
          - heading "Client" [level=4] [ref=e566]
          - paragraph [ref=e567]:
            - text: A client span represents a synchronous outgoing remote call such as an outgoing HTTP request or database call. Note that in this context, “synchronous” does not refer to
            - code [ref=e568]: async/await
            - text: ", but to the fact that it is not queued for later processing."
          - heading "Server" [level=4] [ref=e569]
          - paragraph [ref=e570]: A server span represents a synchronous incoming remote call such as an incoming HTTP request or remote procedure call.
          - heading "Internal" [level=4] [ref=e571]
          - paragraph [ref=e572]: Internal spans represent operations which do not cross a process boundary. Things like instrumenting a function call or an Express middleware may use internal spans.
          - heading "Producer" [level=4] [ref=e573]
          - paragraph [ref=e574]: Producer spans represent the creation of a job which may be asynchronously processed later. It may be a remote job such as one inserted into a job queue or a local job handled by an event listener.
          - heading "Consumer" [level=4] [ref=e575]
          - paragraph [ref=e576]: Consumer spans represent the processing of a job created by a producer and may start long after the producer span has already ended.
          - heading "Specification" [level=2] [ref=e577]
          - paragraph [ref=e578]:
            - text: For more information, see the
            - link "traces specification" [ref=e579] [cursor=pointer]:
              - /url: /docs/specs/otel/overview/#tracing-signal
            - text: .
