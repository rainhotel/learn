          - paragraph [ref=e380]:
            - text: This span represents the third operation in this trace and, like the previous one, it’s a child of the
            - code [ref=e381]: hello
            - text: span. That also makes it a sibling of the
            - code [ref=e382]: hello-greetings
            - text: span.
          - paragraph [ref=e383]:
            - text: These three blocks of JSON all share the same
            - code [ref=e384]: trace_id
            - text: ", and the"
            - code [ref=e385]: parent_id
            - text: field represents a hierarchy. That makes it a Trace!
          - paragraph [ref=e386]: Another thing you’ll note is that each Span looks like a structured log. That’s because it kind of is! One way to think of Traces is that they’re a collection of structured logs with context, correlation, hierarchy, and more baked in. However, these “structured logs” can come from different processes, services, VMs, data centers, and so on. This is what allows tracing to represent an end-to-end view of any system.
          - paragraph [ref=e387]: To understand how tracing in OpenTelemetry works, let’s look at a list of components that will play a part in instrumenting our code.
          - heading "Tracer Provider" [level=2] [ref=e388]
          - paragraph [ref=e389]:
            - text: A Tracer Provider (sometimes called
            - code [ref=e390]: TracerProvider
            - text: ) is a factory for
            - code [ref=e391]: Tracer
            - text: s. In most applications, a Tracer Provider is initialized once and its lifecycle matches the application’s lifecycle. Tracer Provider initialization also includes Resource and Exporter initialization. It is typically the first step in tracing with OpenTelemetry. In some language SDKs, a global Tracer Provider is already initialized for you.
          - heading "Tracer" [level=2] [ref=e392]
          - paragraph [ref=e393]: A Tracer creates spans containing more information about what is happening for a given operation, such as a request in a service. Tracers are created from Tracer Providers.
          - heading "Trace Exporters" [level=2] [ref=e394]
          - paragraph [ref=e395]: Trace Exporters send traces to a consumer. This consumer can be standard output for debugging and development-time, the OpenTelemetry Collector, or any open source or vendor backend of your choice.
          - heading "Context Propagation" [level=2] [ref=e396]
          - paragraph [ref=e397]:
            - text: Context Propagation is the core concept that enables Distributed Tracing. With Context Propagation, Spans can be correlated with each other and assembled into a trace, regardless of where Spans are generated. To learn more about this topic, see the concept page on
            - link "Context Propagation" [ref=e398] [cursor=pointer]:
              - /url: ../../context-propagation
            - text: .
          - heading "Spans" [level=2] [ref=e399]
          - paragraph [ref=e400]:
            - text: A
            - strong [ref=e401]: span
            - text: "represents a unit of work or operation. Spans are the building blocks of Traces. In OpenTelemetry, they include the following information:"
          - list [ref=e402]:
            - listitem [ref=e403]: Name
            - listitem [ref=e404]: Parent span ID (empty for root spans)
            - listitem [ref=e405]: Start and End Timestamps
            - listitem [ref=e406]:
              - link "Span Context" [ref=e407] [cursor=pointer]:
                - /url: "#span-context"
            - listitem [ref=e408]:
