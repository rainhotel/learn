            - code [ref=e326]: trace_id
            - text: as the root span, indicating it’s a part of the same trace. Additionally, it has a
            - code [ref=e327]: parent_id
            - text: that matches the
            - code [ref=e328]: span_id
            - text: of the
            - code [ref=e329]: hello
            - text: span.
