          - heading "Histograms and Percentiles" [level=1] [ref=e114]
          - paragraph [ref=e116]: "Timers and distribution summaries support collecting data to observe their percentile distributions. There are two main approaches to viewing percentiles:"
          - list [ref=e118]:
            - listitem [ref=e119]:
              - paragraph [ref=e120]:
                - strong [ref=e121]: Percentile histograms
                - text: ": Micrometer accumulates values to an underlying histogram and ships a predetermined set of buckets to the monitoring system. The monitoring system’s query language is responsible for calculating percentiles off of this histogram. Currently, only Prometheus, Atlas, and Wavefront support histogram-based percentile approximations, through"
                - code [ref=e122]: histogram_quantile
                - text: ","
                - code [ref=e123]: :percentile
                - text: ", and"
                - code [ref=e124]: hs()
                - text: ", respectively. If you target Prometheus, Atlas, or Wavefront, prefer this approach, since you can aggregate the histograms across dimensions (by summing the values of the buckets across a set of dimensions) and derive an aggregable percentile from the histogram."
            - listitem [ref=e125]:
              - paragraph [ref=e126]:
                - strong [ref=e127]: Client-side percentiles
                - text: ": Micrometer computes a percentile approximation for each meter ID (set of name and tags) and ships the percentile value to the monitoring system. This is not as flexible as a percentile histogram because it is not possible to aggregate percentile approximations across tags. Nevertheless, it provides some level of insight into percentile distributions for monitoring systems that do not support server-side percentile calculation based on a histogram."
          - paragraph [ref=e129]: "The following example builds a timer with a histogram:"
          - generic [ref=e132]:
            - code [ref=e133]:
              - text: java Timer.builder("my.timer") .publishPercentiles(0.5, 0.95) // median and 95th percentile
              - generic [ref=e134]: "1"
              - text: .publishPercentileHistogram()
              - generic [ref=e135]: "2"
              - text: .serviceLevelObjectives(Duration.ofMillis(100))
              - generic [ref=e136]: "3"
              - text: .minimumExpectedValue(Duration.ofMillis(1))
              - generic [ref=e137]: "4"
              - text: .maximumExpectedValue(Duration.ofSeconds(10))
            - button "Copied!" [ref=e139] [cursor=pointer]
          - table [ref=e142]:
            - rowgroup [ref=e143]:
              - row [ref=e144]:
                - cell "1" [ref=e145]
                - cell [ref=e147]:
                  - code [ref=e148]: publishPercentiles
                  - text: ": Used to publish percentile values computed in your application. These values are non-aggregable across dimensions."
              - row [ref=e149]:
                - cell "2" [ref=e150]
                - cell [ref=e152]:
                  - code [ref=e153]: publishPercentileHistogram
                  - text: ": Used to publish a histogram suitable for computing aggregable (across dimensions) percentile approximations in Prometheus (by using"
                  - code [ref=e154]: histogram_quantile
                  - text: ), Atlas (by using
                  - code [ref=e155]: :percentile
                  - text: ), and Wavefront (by using
                  - code [ref=e156]: hs()
                  - text: ). For Prometheus and Atlas, the buckets in the resulting histogram are preset by Micrometer based on a generator that has been determined empirically by Netflix to yield a reasonable error bound on most real world timers and distribution summaries. By default, the generator yields 276 buckets, but Micrometer includes only those that are within the range set by
                  - code [ref=e157]: minimumExpectedValue
                  - text: and
                  - code [ref=e158]: maximumExpectedValue
                  - text: ", inclusive. Micrometer clamps timers by default to a range of 1 millisecond to 1 minute, yielding 73 histogram buckets per timer dimension."
                  - code [ref=e159]: publishPercentileHistogram
                  - text: has no effect on systems that do not support aggregable percentile approximations. No histogram is shipped for these systems.
              - row [ref=e160]:
                - cell "3" [ref=e161]
                - cell [ref=e163]:
                  - code [ref=e164]: serviceLevelObjectives
                  - text: ": Used to publish a cumulative histogram with buckets defined by your SLOs. When used in concert with"
                  - code [ref=e165]: publishPercentileHistogram
                  - text: on a monitoring system that supports aggregable percentiles, this setting adds additional buckets to the published histogram. When used on a system that does not support aggregable percentiles, this setting causes a histogram to be published with only these buckets.
              - row [ref=e166]:
                - cell "4" [ref=e167]
                - cell [ref=e169]:
                  - code [ref=e170]: minimumExpectedValue
                  - text: /
                  - code [ref=e171]: maximumExpectedValue
                  - text: ": Controls the number of buckets shipped by"
                  - code [ref=e172]: publishPercentileHistogram
                  - text: and controls the accuracy and memory footprint of the underlying HdrHistogram structure.
          - table [ref=e174]:
            - rowgroup [ref=e175]:
              - row [ref=e176]:
                - cell "Note" [ref=e177]
                - cell [ref=e179]:
                  - text: For those monitoring systems, where percentiles can be approximated using the histogram (see
                  - code [ref=e180]: publishPercentileHistogram
                  - text: above), it is usually unnecessary to also publish client-side percentiles (
                  - code [ref=e181]: publishPercentiles
                  - text: ) since in those scenarios client-side percentiles are redundant and also non-aggregable across dimensions (unlike histograms). Prometheus Java Client (1.x) does not support having both under the same metric name.
          - paragraph [ref=e183]:
            - text: Since shipping percentiles to the monitoring system generates additional time series, it is generally preferable to
            - strong [ref=e184]: not
            - text: configure them in core libraries that are included as dependencies in applications. Instead, applications can turn on this behavior for some set of timers and distribution summaries by using a meter filter.
          - paragraph [ref=e186]:
            - text: For example, suppose we have a handful of timers in a common library. We have prefixed these timer names with
            - code [ref=e187]: myservice
            - text: ":"
          - generic [ref=e190]:
            - code [ref=e191]: java registry.timer("myservice.http.requests").record(..); registry.timer("myservice.db.requests").record(..);
            - button "Copied!" [ref=e193] [cursor=pointer]
          - paragraph [ref=e196]: "We can turn on client-side percentiles for both timers by using a meter filter:"
          - generic [ref=e199]:
            - code [ref=e200]:
              - text: "java registry.config().meterFilter( new MeterFilter() { @Override"
              - generic [ref=e201]: public DistributionStatisticConfig configure(Meter.Id id, DistributionStatisticConfig config)
              - text: "{ if(id.getName().startsWith(\"myservice\")) { return DistributionStatisticConfig.builder() .percentiles(0.95) .build() .merge(config); } return config; } });"
            - button "Copied!" [ref=e203] [cursor=pointer]
