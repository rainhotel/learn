          - heading "Thresholds" [level=1] [ref=e93]
          - paragraph [ref=e94]:
            - text: Thresholds are the pass/fail criteria that you define for your test metrics. If the performance of the system under test (SUT) does not meet the conditions of your threshold,
            - strong [ref=e95]: the test finishes with a failed status.
          - paragraph [ref=e96]: "Often, testers use thresholds to codify their SLOs. For example, you can create thresholds for any combination of the following expectations:"
          - list [ref=e97]:
            - listitem [ref=e98]: Less than 1% of requests return an error.
            - listitem [ref=e99]: 95% of requests have a response time below 200ms.
            - listitem [ref=e100]: 99% of requests have a response time below 400ms.
            - listitem [ref=e101]: A specific endpoint always responds within 300ms.
            - listitem [ref=e102]:
              - text: Any conditions for a
              - link "custom metric" [ref=e103] [cursor=pointer]:
                - /url: /docs/k6/latest/using-k6/metrics/create-custom-metrics/
              - text: .
          - paragraph [ref=e104]:
            - text: Thresholds are also essential for
            - link "load-testing automation" [ref=e105] [cursor=pointer]:
              - /url: /docs/k6/latest/testing-guides/automated-performance-testing/
            - text: ":"
          - list [ref=e106]:
            - listitem [ref=e107]: Give your test a threshold.
            - listitem [ref=e108]: Automate your execution
            - listitem [ref=e109]: Set up alerts for test failures.
          - paragraph [ref=e110]: After that, you need to worry about the test only after your SUT fails to meet its performance expectations.
          - heading "Thresholds example for HTTP errors and response duration" [level=2] [ref=e111]
          - paragraph [ref=e112]:
            - text: This sample script specifies two thresholds. One threshold evaluates the rate of HTTP errors (
            - code [ref=e113]: http_req_failed
            - text: metric). The other evaluates whether 95 percent of responses happen within a certain duration (the
            - code [ref=e114]: http_req_duration
            - text: metric).
          - generic [ref=e115]:
            - generic [ref=e116]:
              - generic [ref=e117]: JavaScript
              - button "Copy code to clipboard Copy" [ref=e119] [cursor=pointer]:
                - img "Copy code to clipboard" [ref=e120]
                - generic [ref=e121]: Copy
            - code [ref=e125]: "import http from 'k6/http'; export const options = { thresholds: { http_req_failed: ['rate<0.01'], // http errors should be less than 1% http_req_duration: ['p(95)<200'], // 95% of requests should be below 200ms }, }; export default function () { http.get('https://quickpizza.grafana.com'); }"
          - paragraph [ref=e126]:
