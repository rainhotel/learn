        - generic [ref=e164]:
          - heading "Context propagation" [level=1] [ref=e165]
          - generic [ref=e166]: Learn about the concept that enables Distributed Tracing.
          - paragraph [ref=e167]:
            - text: With context propagation,
            - link "signals" [ref=e168] [cursor=pointer]:
              - /url: ../signals/
            - text: (
            - link "traces" [ref=e169] [cursor=pointer]:
              - /url: ../signals/traces/
            - text: ","
            - link "metrics" [ref=e170] [cursor=pointer]:
              - /url: ../signals/metrics/
            - text: ", and"
            - link "logs" [ref=e171] [cursor=pointer]:
              - /url: ../signals/logs/
            - text: ) can be correlated with each other, regardless of where they are generated. Although not limited to tracing, context propagation allows
            - link "traces" [ref=e172] [cursor=pointer]:
              - /url: ../signals/traces/
            - text: to build causal information about a system across services that are arbitrarily distributed across process and network boundaries.
          - paragraph [ref=e173]: "To understand context propagation, you need to understand two separate concepts: context and propagation."
          - heading "Context" [level=2] [ref=e174]
          - paragraph [ref=e175]:
            - text: Context is an object that contains the information for the sending and receiving service, or
            - link "execution unit" [ref=e176] [cursor=pointer]:
              - /url: /docs/specs/otel/glossary/#execution-unit
            - text: ", to correlate one signal with another."
          - paragraph [ref=e177]: When Service A calls Service B, Service A includes a trace ID and a span ID as part of the context. Service B uses these values to create a new span that belongs to the same trace, setting the span from Service A as its parent. This makes it possible to track the full flow of a request across service boundaries.
          - heading "Propagation" [level=2] [ref=e178]
          - paragraph [ref=e179]: Propagation is the mechanism that moves context between services and processes. It serializes or deserializes the context object and provides the relevant information to be propagated from one service to another.
          - paragraph [ref=e180]:
            - text: Propagation is usually handled by instrumentation libraries and is transparent to the user. In the event that you need to manually propagate context, you can use the
            - link "Propagators API" [ref=e181] [cursor=pointer]:
              - /url: /docs/specs/otel/context/api-propagators/
            - text: .
          - paragraph [ref=e182]:
            - text: OpenTelemetry maintains several official propagators. The default propagator uses the headers specified by the
            - link "W3C TraceContext " [ref=e183] [cursor=pointer]:
              - /url: https://www.w3.org/TR/trace-context/
            - text: specification.
          - heading "Example" [level=2] [ref=e184]
          - paragraph [ref=e185]:
            - text: A service called
            - code [ref=e186]: Frontend
            - text: that provides different HTTP endpoints such as
            - code [ref=e187]: POST /cart/add
            - text: and
            - code [ref=e188]: GET /checkout/
            - text: reaches out to a downstream service
            - code [ref=e189]: Product Catalog
            - text: via an HTTP endpoint
            - code [ref=e190]: GET /product
            - text: to receive details on products that a user wants to add to the cart or that are part of the checkout. To understand activities in the
            - code [ref=e191]: Product Catalog
            - text: service within the context of requests coming from
            - code [ref=e192]: Frontend
            - text: ", the context (here: Trace ID and Span ID as “Parent ID”) is propagated using the"
            - code [ref=e193]: traceparent
            - text: "header as it is defined in the W3C TraceContext specification. This means the IDs are embedded in the fields of the header:"
          - generic [ref=e195]:
            - button "Copy to clipboard" [ref=e196] [cursor=pointer]: 
            - code [ref=e197]:
              - generic [ref=e198]: <version>-<trace-id>-<parent-id>-<trace-flags>
          - paragraph [ref=e200]: "For example:"
          - generic [ref=e202]:
            - button "Copy to clipboard" [ref=e203] [cursor=pointer]: 
            - code [ref=e204]:
              - generic [ref=e205]: 00-a0892f3577b34da6a3ce929d0e0e4736-f03067aa0ba902b7-01
          - heading "Traces" [level=3] [ref=e207]
          - paragraph [ref=e208]:
            - text: As mentioned, context propagation allows traces to build causal information across services. In this example, the two calls to the HTTP endpoint
            - code [ref=e209]: GET /product
            - text: of service
            - code [ref=e210]: Product Catalog
            - text: can be correlated with their upstream calls in service
            - code [ref=e211]: Frontend
            - text: by extracting the remote context from the
            - code [ref=e212]: traceparent
            - text: header and injecting it into the local context to set the Trace ID and Parent ID. With that, it is possible in a
            - link "backend" [ref=e213] [cursor=pointer]:
              - /url: /ecosystem/vendors/
            - text: like
            - link "Jaeger " [ref=e214] [cursor=pointer]:
              - /url: https://jaegertracing.io
            - text: to see two requests as spans of one trace.
          - button "Context propagation example showing trace correlation across services" [ref=e215]
          - heading "Logs" [level=3] [ref=e216]
          - paragraph [ref=e217]: OpenTelemetry SDKs are able to automatically correlate logs with traces. This means they can inject context (Trace ID, Span ID) into a log record. This not only enables you to see logs in the context of the trace and span they belong to, but it also enables you to see logs that belong together across service or execution unit boundaries.
          - heading "Metrics" [level=3] [ref=e218]
          - paragraph [ref=e219]:
            - text: In the case of metrics, context propagation enables you to aggregate measurements in that context. For example, instead of only looking at the response time of all the
            - code [ref=e220]: GET /product
            - text: requests, you can also get metrics for combinations of
            - code [ref=e221]: POST /cart/add > GET /product
            - text: and
            - code [ref=e222]: GET /checkout < GET /product
            - text: .
          - table [ref=e223]:
            - rowgroup [ref=e224]:
              - row [ref=e225]:
                - columnheader "Name" [ref=e226]
                - columnheader "Calls Per Second" [ref=e227]
                - columnheader "Average Response Time" [ref=e228]
            - rowgroup [ref=e229]:
              - row [ref=e230]:
                - cell [ref=e231]:
                  - code [ref=e232]: "* > GET /product"
                - cell "370" [ref=e233]
                - cell "300ms" [ref=e234]
              - row [ref=e235]:
                - cell [ref=e236]:
                  - code [ref=e237]: POST /card/add > GET /product
                - cell "330" [ref=e238]
                - cell "130ms" [ref=e239]
              - row [ref=e240]:
                - cell [ref=e241]:
                  - code [ref=e242]: GET /checkout > GET /product
                - cell "40" [ref=e243]
                - cell "1703ms" [ref=e244]
          - heading "Custom Context Propagation" [level=2] [ref=e245]
          - paragraph [ref=e246]:
            - text: For most use cases, you will find
            - link "instrumentation libraries or native library instrumentation" [ref=e247] [cursor=pointer]:
              - /url: /docs/concepts/instrumentation/libraries/
            - text: "that handle the context propagation for you. In some cases no such support is available and you want to create that support for yourself. To do so you need to leverage the previously mentioned Propagators API:"
          - list [ref=e248]:
            - listitem [ref=e249]:
              - text: On the side of the sender, the context is
              - link "injected" [ref=e250] [cursor=pointer]:
                - /url: /docs/specs/otel/context/api-propagators/#inject
              - text: into the carrier, for example, into the headers of an HTTP request. In other cases, you need to find a place that can store metadata for your request.
            - listitem [ref=e251]:
              - text: On the receiving side, the context is
              - link "extracted" [ref=e252] [cursor=pointer]:
                - /url: /docs/specs/otel/context/api-propagators/#extract
              - text: from the carrier. Again, in the case of HTTP, this is retrieved from the headers. In other cases, you pick the place you chose on the sending side to store the context.
          - paragraph [ref=e253]: Note that it is possible to propagate context in protocols that do not have a dedicated field for metadata, but you have to make sure that on the receiving side they are extracted and removed before the data is processed, otherwise you may create undefined behavior.
          - paragraph [ref=e254]: "For the following languages a step-by-step tutorial exists for custom context propagation:"
          - list [ref=e255]:
            - listitem [ref=e256]:
              - link "Erlang" [ref=e257] [cursor=pointer]:
                - /url: /docs/languages/erlang/propagation/#manual-context-propagation
            - listitem [ref=e258]:
              - link "JavaScript" [ref=e259] [cursor=pointer]:
                - /url: /docs/languages/js/propagation/#manual-context-propagation
            - listitem [ref=e260]:
              - link "PHP" [ref=e261] [cursor=pointer]:
                - /url: /docs/languages/php/propagation/#manual-context-propagation
            - listitem [ref=e262]:
              - link "Python" [ref=e263] [cursor=pointer]:
                - /url: /docs/languages/python/propagation/#manual-context-propagation
          - heading "Security best practices" [level=2] [ref=e264]
          - paragraph [ref=e265]: Propagation involves sending and receiving data across service boundaries, which can have security implications.
          - heading "External services" [level=3] [ref=e266]
          - paragraph [ref=e267]: "When your service interacts with external services (services you do not own or trust), consider the following:"
          - list [ref=e268]:
            - listitem [ref=e269]:
              - strong [ref=e270]: Incoming context
              - text: ": Be cautious when accepting context from external sources. Malicious actors could send forged trace headers to manipulate your tracing data or potentially exploit vulnerabilities in context parsing. You might want to ignore or sanitize incoming context from untrusted sources."
            - listitem [ref=e271]:
              - strong [ref=e272]: Outgoing context
              - text: ": Be mindful of what you propagate to external services. Internal trace IDs, span IDs, or baggage items might reveal sensitive information about your internal architecture or business logic. You may want to configure your propagators to not send context to external or public-facing endpoints."
          - heading "Baggage" [level=3] [ref=e273]
          - paragraph [ref=e274]:
            - link "Baggage" [ref=e275] [cursor=pointer]:
              - /url: ../signals/baggage/
            - text: allows you to propagate arbitrary key-value pairs. Since this data is propagated across service boundaries, avoid putting sensitive information (like user credentials, API keys, or PII) in baggage, as it might be logged or sent to untrusted downstream services.
          - heading "Support in Language SDKs" [level=2] [ref=e276]
          - paragraph [ref=e277]: "For the individual language-specific implementations of the OpenTelemetry API & SDK, you will find details on the support of context propagation in the respective documentation pages:"
          - list [ref=e278]:
            - listitem [ref=e279]:
              - link "C++" [ref=e280] [cursor=pointer]:
                - /url: /docs/languages/cpp/instrumentation/#context-propagation
