      - generic [ref=e109]:
        - heading "Transactions" [level=1] [ref=e110]
        - paragraph [ref=e111]: How transactions work in Redis
        - paragraph [ref=e112]:
          - text: Redis Transactions allow the execution of a group of commands in a single step, they are centered around the commands
          - link [ref=e113] [cursor=pointer]:
            - /url: /docs/latest/commands/multi/
            - code [ref=e114]: MULTI
          - text: ","
          - link [ref=e115] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e116]: EXEC
          - text: ","
          - link [ref=e117] [cursor=pointer]:
            - /url: /docs/latest/commands/discard/
            - code [ref=e118]: DISCARD
          - text: and
          - link [ref=e119] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e120]: WATCH
          - text: ". Redis Transactions make two important guarantees:"
        - list [ref=e121]:
          - listitem [ref=e122]:
            - paragraph [ref=e123]:
              - text: All the commands in a transaction are serialized and executed sequentially. A request sent by another client will never be served
              - strong [ref=e124]: in the middle
              - text: of the execution of a Redis Transaction. This guarantees that the commands are executed as a single isolated operation.
          - listitem [ref=e125]:
            - paragraph [ref=e126]:
              - text: The
              - link [ref=e127] [cursor=pointer]:
                - /url: /docs/latest/commands/exec/
                - code [ref=e128]: EXEC
              - text: command triggers the execution of all the commands in the transaction, so if a client loses the connection to the server in the context of a transaction before calling the
              - link [ref=e129] [cursor=pointer]:
                - /url: /docs/latest/commands/exec/
                - code [ref=e130]: EXEC
              - text: command none of the operations are performed, instead if the
              - link [ref=e131] [cursor=pointer]:
                - /url: /docs/latest/commands/exec/
                - code [ref=e132]: EXEC
              - text: command is called, all the operations are performed. When using the
              - link "append-only file" [ref=e133] [cursor=pointer]:
                - /url: /docs/latest/operate/oss_and_stack/management/persistence/#append-only-file
              - text: Redis makes sure to use a single write(2) syscall to write the transaction on disk. However if the Redis server crashes or is killed by the system administrator in some hard way it is possible that only a partial number of operations are registered. Redis will detect this condition at restart, and will exit with an error. Using the
              - code [ref=e134]: redis-check-aof
              - text: tool it is possible to fix the append only file that will remove the partial transaction so that the server can start again.
        - paragraph [ref=e135]:
          - text: Starting with version 2.2, Redis allows for an extra guarantee to the above two, in the form of optimistic locking in a way very similar to a check-and-set (CAS) operation. This is documented
          - link "later" [ref=e136] [cursor=pointer]:
            - /url: "#cas"
          - text: on this page.
        - heading [level=2] [ref=e137]:
          - text: Usage
          - link "Link to this section" [ref=e138] [cursor=pointer]:
            - /url: "#usage"
        - paragraph [ref=e141]:
          - text: A Redis Transaction is entered using the
          - link [ref=e142] [cursor=pointer]:
            - /url: /docs/latest/commands/multi/
            - code [ref=e143]: MULTI
          - text: command. The command always replies with
          - code [ref=e144]: OK
          - text: . At this point the user can issue multiple commands. Instead of executing these commands, Redis will queue them. All the commands are executed once
          - link [ref=e145] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e146]: EXEC
          - text: is called.
        - paragraph [ref=e147]:
          - text: Calling
          - link [ref=e148] [cursor=pointer]:
            - /url: /docs/latest/commands/discard/
            - code [ref=e149]: DISCARD
          - text: instead will flush the transaction queue and will exit the transaction.
        - paragraph [ref=e150]:
          - text: The following example increments keys
          - code [ref=e151]: foo
          - text: and
          - code [ref=e152]: bar
          - text: atomically.
        - code [ref=e154]: "> MULTI OK > INCR foo QUEUED > INCR bar QUEUED > EXEC 1) (integer) 1 2) (integer) 1"
        - paragraph [ref=e155]:
          - text: As is clear from the session above,
          - link [ref=e156] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e157]: EXEC
          - text: returns an array of replies, where every element is the reply of a single command in the transaction, in the same order the commands were issued.
        - paragraph [ref=e158]:
          - text: When a Redis connection is in the context of a
          - link [ref=e159] [cursor=pointer]:
            - /url: /docs/latest/commands/multi/
            - code [ref=e160]: MULTI
          - text: request, all commands will reply with the string
          - code [ref=e161]: QUEUED
          - text: (sent as a Status Reply from the point of view of the Redis protocol). A queued command is simply scheduled for execution when
          - link [ref=e162] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e163]: EXEC
          - text: is called.
        - heading [level=2] [ref=e164]:
          - text: Errors inside a transaction
          - link "Link to this section" [ref=e165] [cursor=pointer]:
            - /url: "#errors-inside-a-transaction"
        - paragraph [ref=e168]: "During a transaction it is possible to encounter two kind of command errors:"
        - list [ref=e169]:
          - listitem [ref=e170]:
            - text: A command may fail to be queued, so there may be an error before
            - link [ref=e171] [cursor=pointer]:
              - /url: /docs/latest/commands/exec/
              - code [ref=e172]: EXEC
            - text: is called. For instance the command may be syntactically wrong (wrong number of arguments, wrong command name, ...), or there may be some critical condition like an out of memory condition (if the server is configured to have a memory limit using the
            - code [ref=e173]: maxmemory
            - text: directive).
          - listitem [ref=e174]:
            - text: A command may fail
            - emphasis [ref=e175]: after
            - link [ref=e176] [cursor=pointer]:
              - /url: /docs/latest/commands/exec/
              - code [ref=e177]: EXEC
            - text: is called, for instance since we performed an operation against a key with the wrong value (like calling a list operation against a string value).
        - paragraph [ref=e178]:
          - text: Starting with Redis 2.6.5, the server will detect an error during the accumulation of commands. It will then refuse to execute the transaction returning an error during
          - link [ref=e179] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e180]: EXEC
          - text: ", discarding the transaction."
        - blockquote [ref=e181]:
          - paragraph [ref=e182]:
            - strong [ref=e183]: "Note for Redis < 2.6.5:"
            - text: Prior to Redis 2.6.5 clients needed to detect errors occurring prior to
            - link [ref=e184] [cursor=pointer]:
              - /url: /docs/latest/commands/exec/
              - code [ref=e185]: EXEC
            - text: "by checking the return value of the queued command: if the command replies with QUEUED it was queued correctly, otherwise Redis returns an error. If there is an error while queueing a command, most clients will abort and discard the transaction. Otherwise, if the client elected to proceed with the transaction the"
            - link [ref=e186] [cursor=pointer]:
              - /url: /docs/latest/commands/exec/
              - code [ref=e187]: EXEC
            - text: command would execute all commands queued successfully regardless of previous errors.
        - paragraph [ref=e188]:
          - text: Errors happening
          - emphasis [ref=e189]: after
          - link [ref=e190] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e191]: EXEC
          - text: "instead are not handled in a special way: all the other commands will be executed even if some command fails during the transaction."
        - paragraph [ref=e192]: "This is more clear on the protocol level. In the following example one command will fail when executed even if the syntax is right:"
        - code [ref=e194]: Trying 127.0.0.1... Connected to localhost. Escape character is '^]'. MULTI +OK SET a abc +QUEUED LPOP a +QUEUED EXEC *2 +OK -WRONGTYPE Operation against a key holding the wrong kind of value
        - paragraph [ref=e195]:
          - link [ref=e196] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e197]: EXEC
          - text: returned two-element
          - link "bulk string reply" [ref=e198] [cursor=pointer]:
            - /url: /docs/latest/develop/reference/protocol-spec/#bulk-string-reply
          - text: where one is an
          - code [ref=e199]: OK
          - text: code and the other an error reply. It's up to the client library to find a sensible way to provide the error to the user.
        - paragraph [ref=e200]:
          - text: It's important to note that
          - strong [ref=e201]: even when a command fails, all the other commands in the queue are processed
          - text: – Redis will
          - emphasis [ref=e202]: not
          - text: stop the processing of commands.
        - paragraph [ref=e203]:
          - text: Another example, again using the wire protocol with
          - code [ref=e204]: telnet
          - text: ", shows how syntax errors are reported ASAP instead:"
        - code [ref=e206]: MULTI +OK INCR a b c -ERR wrong number of arguments for 'incr' command
        - paragraph [ref=e207]:
          - text: This time due to the syntax error the bad
          - link [ref=e208] [cursor=pointer]:
            - /url: /docs/latest/commands/incr/
            - code [ref=e209]: INCR
          - text: command is not queued at all.
        - heading [level=2] [ref=e210]:
          - text: What about rollbacks?
          - link "Link to this section" [ref=e211] [cursor=pointer]:
            - /url: "#what-about-rollbacks"
        - paragraph [ref=e214]: Redis does not support rollbacks of transactions since supporting rollbacks would have a significant impact on the simplicity and performance of Redis.
        - heading [level=2] [ref=e215]:
          - text: Discarding the command queue
          - link "Link to this section" [ref=e216] [cursor=pointer]:
            - /url: "#discarding-the-command-queue"
        - paragraph [ref=e219]:
          - link [ref=e220] [cursor=pointer]:
            - /url: /docs/latest/commands/discard/
            - code [ref=e221]: DISCARD
          - text: can be used in order to abort a transaction. In this case, no commands are executed and the state of the connection is restored to normal.
        - code [ref=e223]: "> SET foo 1 OK > MULTI OK > INCR foo QUEUED > DISCARD OK > GET foo \"1\""
        - paragraph
        - heading [level=2] [ref=e224]:
          - text: Optimistic locking using check-and-set
          - link "Link to this section" [ref=e225] [cursor=pointer]:
            - /url: "#optimistic-locking-using-check-and-set"
        - paragraph [ref=e228]:
          - link [ref=e229] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e230]: WATCH
          - text: is used to provide a check-and-set (CAS) behavior to Redis transactions.
        - paragraph [ref=e231]:
          - link [ref=e232] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e233]: WATCH
          - text: ed keys are monitored in order to detect changes against them. If at least one watched key is modified before the
          - link [ref=e234] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e235]: EXEC
          - text: command, the whole transaction aborts, and
          - link [ref=e236] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e237]: EXEC
          - text: returns a
          - link "Null reply" [ref=e238] [cursor=pointer]:
            - /url: /docs/latest/develop/reference/protocol-spec/#nil-reply
          - text: to notify that the transaction failed.
        - paragraph [ref=e239]:
          - text: For example, imagine we have the need to atomically increment the value of a key by 1 (let's suppose Redis doesn't have
          - link [ref=e240] [cursor=pointer]:
            - /url: /docs/latest/commands/incr/
            - code [ref=e241]: INCR
          - text: ).
        - paragraph [ref=e242]: "The first try may be the following:"
        - code [ref=e244]: val = GET mykey val = val + 1 SET mykey $val
        - paragraph [ref=e245]:
          - text: This will work reliably only if we have a single client performing the operation in a given time. If multiple clients try to increment the key at about the same time there will be a race condition. For instance, client A and B will read the old value, for instance, 10. The value will be incremented to 11 by both the clients, and finally
          - link [ref=e246] [cursor=pointer]:
            - /url: /docs/latest/commands/set/
            - code [ref=e247]: SET
          - text: as the value of the key. So the final value will be 11 instead of 12.
        - paragraph [ref=e248]:
          - text: Thanks to
          - link [ref=e249] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e250]: WATCH
          - text: "we are able to model the problem very well:"
        - code [ref=e252]: WATCH mykey val = GET mykey val = val + 1 MULTI SET mykey $val EXEC
        - paragraph [ref=e253]:
          - text: Using the above code, if there are race conditions and another client modifies the result of
          - code [ref=e254]: val
          - text: in the time between our call to
          - link [ref=e255] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e256]: WATCH
          - text: and our call to
          - link [ref=e257] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e258]: EXEC
          - text: ", the transaction will fail."
        - paragraph [ref=e259]:
          - text: We just have to repeat the operation hoping this time we'll not get a new race. This form of locking is called
          - emphasis [ref=e260]: optimistic locking
          - text: . In many use cases, multiple clients will be accessing different keys, so collisions are unlikely – usually there's no need to repeat the operation.
        - paragraph [ref=e261]:
          - text: Starting with version 8.4, Redis offers new atomic compare-and-set and compare-and-delete commands for string keys. A client can use a single (
          - link [ref=e262] [cursor=pointer]:
            - /url: /docs/latest/commands/set/
            - code [ref=e263]: SET
          - text: command with the
          - code [ref=e264]: IFEQ
          - text: /
          - code [ref=e265]: IFNE
          - text: /
          - code [ref=e266]: IFDEQ
          - text: /
          - code [ref=e267]: IFDNE
          - text: options to atomically update a string key only if its value has not changed since it was fetched. This is much simpler and faster. Similarly, a client can use a single
          - link [ref=e268] [cursor=pointer]:
            - /url: /docs/latest/commands/delex/
            - code [ref=e269]: DELEX
          - text: "command for compare-and-delete: atomically deleting a string key if its value hasn't changed since it was fetched."
        - heading [level=2] [ref=e270]:
          - text: WATCH explained
          - link "Link to this section" [ref=e271] [cursor=pointer]:
            - /url: "#watch-explained"
        - paragraph [ref=e274]:
          - text: So what is
          - link [ref=e275] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e276]: WATCH
          - text: really about? It is a command that will make the
          - link [ref=e277] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e278]: EXEC
          - text: "conditional: we are asking Redis to perform the transaction only if none of the"
          - link [ref=e279] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e280]: WATCH
          - text: ed keys were modified. This includes modifications made by the client, like write commands, and by Redis itself, like expiration or eviction. If keys were modified between when they were
          - link [ref=e281] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e282]: WATCH
          - text: ed and when the
          - link [ref=e283] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e284]: EXEC
          - text: was received, the entire transaction will be aborted instead.
        - paragraph [ref=e285]:
          - strong [ref=e286]: NOTE
        - list [ref=e287]:
          - listitem [ref=e288]:
            - text: In Redis versions before 6.0.9, an expired key would not cause a transaction to be aborted.
            - link "More on this" [ref=e289] [cursor=pointer]:
              - /url: https://github.com/redis/redis/pull/7920
          - listitem [ref=e290]:
            - text: Commands within a transaction won't trigger the
            - link [ref=e291] [cursor=pointer]:
              - /url: /docs/latest/commands/watch/
              - code [ref=e292]: WATCH
            - text: condition since they are only queued until the
            - link [ref=e293] [cursor=pointer]:
              - /url: /docs/latest/commands/exec/
              - code [ref=e294]: EXEC
            - text: is sent.
        - paragraph [ref=e295]:
          - link [ref=e296] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e297]: WATCH
          - text: can be called multiple times. Simply all the
          - link [ref=e298] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e299]: WATCH
          - text: calls will have the effects to watch for changes starting from the call, up to the moment
          - link [ref=e300] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e301]: EXEC
          - text: is called. You can also send any number of keys to a single
          - link [ref=e302] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e303]: WATCH
          - text: call.
        - paragraph [ref=e304]:
          - text: When
          - link [ref=e305] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e306]: EXEC
          - text: is called, all keys are
          - link [ref=e307] [cursor=pointer]:
            - /url: /docs/latest/commands/unwatch/
            - code [ref=e308]: UNWATCH
          - text: ed, regardless of whether the transaction was aborted or not. Also when a client connection is closed, everything gets
          - link [ref=e309] [cursor=pointer]:
            - /url: /docs/latest/commands/unwatch/
            - code [ref=e310]: UNWATCH
          - text: ed.
        - paragraph [ref=e311]:
          - text: It is also possible to use the
          - link [ref=e312] [cursor=pointer]:
            - /url: /docs/latest/commands/unwatch/
            - code [ref=e313]: UNWATCH
          - text: command (without arguments) in order to flush all the watched keys. Sometimes this is useful as we optimistically lock a few keys, since possibly we need to perform a transaction to alter those keys, but after reading the current content of the keys we don't want to proceed. When this happens we just call
          - link [ref=e314] [cursor=pointer]:
            - /url: /docs/latest/commands/unwatch/
            - code [ref=e315]: UNWATCH
          - text: so that the connection can already be used freely for new transactions.
        - heading [level=3] [ref=e316]:
          - text: Using WATCH to implement ZPOP
          - link "Link to this section" [ref=e317] [cursor=pointer]:
            - /url: "#using-watch-to-implement-zpop"
        - paragraph [ref=e320]:
          - text: A good example to illustrate how
          - link [ref=e321] [cursor=pointer]:
            - /url: /docs/latest/commands/watch/
            - code [ref=e322]: WATCH
          - text: can be used to create new atomic operations otherwise not supported by Redis is to implement ZPOP (
          - link [ref=e323] [cursor=pointer]:
            - /url: /docs/latest/commands/zpopmin/
            - code [ref=e324]: ZPOPMIN
          - text: ","
          - link [ref=e325] [cursor=pointer]:
            - /url: /docs/latest/commands/zpopmax/
            - code [ref=e326]: ZPOPMAX
          - text: "and their blocking variants have only been added in version 5.0), that is a command that pops the element with the lower score from a sorted set in an atomic way. This is the simplest implementation:"
        - code [ref=e328]: WATCH zset element = ZRANGE zset 0 0 MULTI ZREM zset element EXEC
        - paragraph [ref=e329]:
          - text: If
          - link [ref=e330] [cursor=pointer]:
            - /url: /docs/latest/commands/exec/
            - code [ref=e331]: EXEC
          - text: fails (i.e. returns a
          - link "Null reply" [ref=e332] [cursor=pointer]:
