            - text: Set the key's value and expiration only if the hash digest of its current value is not equal to
            - code [ref=e1731]: ifdne-digest
            - text: . If the key doesn't exist, it will be created. See the
            - link "Hash Digest" [ref=e1732] [cursor=pointer]:
