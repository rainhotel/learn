          - paragraph [ref=e1706]: Only set the key if it does not already exist.
        - group [ref=e1707]:
          - code [ref=e1709]: XX
          - paragraph [ref=e1710]: Only set the key if it already exists.
        - group [ref=e1711]:
          - code [ref=e1713]: IFEQ ifeq-value
          - paragraph [ref=e1714]:
            - text: Set the key's value and expiration only if its current value is equal to
            - code [ref=e1715]: ifeq-value
            - text: . If the key doesn't exist, it won't be created.
        - group [ref=e1716]:
          - code [ref=e1718]: IFNE ifne-value
          - paragraph [ref=e1719]:
            - text: Set the key's value and expiration only if its current value is not equal to
            - code [ref=e1720]: ifne-value
            - text: . If the key doesn't exist, it will be created.
        - group [ref=e1721]:
          - code [ref=e1723]: IFDEQ ifdeq-digest
