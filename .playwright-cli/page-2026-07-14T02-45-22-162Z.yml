            - text: section below for more information.
        - group [ref=e1733]:
          - code [ref=e1735]: GET
          - paragraph [ref=e1736]:
            - text: Return the old string stored at the key, or nil if the key did not exist. An error is returned and
            - code [ref=e1737]: SET
