          - link "the Redlock algorithm" [ref=e1833] [cursor=pointer]:
            - /url: /docs/latest/develop/clients/patterns/distributed-locks/
          - text: which is only a bit more complex to implement, but offers better guarantees and is fault tolerant.
        - paragraph [ref=e1834]:
          - text: The command
          - code [ref=e1835]: SET resource-name anystring NX EX max-lock-time
          - text: is a simple way to implement a locking system with Redis.
        - paragraph [ref=e1836]:
          - text: A client can acquire the lock if the above command returns
          - code [ref=e1837]: OK
          - text: (or retry after some time if the command returns Nil), and remove the lock just using
          - link [ref=e1838] [cursor=pointer]:
            - /url: /docs/latest/commands/del/
            - code [ref=e1839]: DEL
          - text: .
        - paragraph [ref=e1840]: The lock will be auto-released after the expire time is reached.
        - paragraph [ref=e1841]: "It is possible to make this system more robust modifying the unlock schema as follows:"
        - list [ref=e1842]:
          - listitem [ref=e1843]: Instead of setting a fixed string, set a non-guessable large random string, called token.
          - listitem [ref=e1844]:
            - text: Instead of releasing the lock with
            - link [ref=e1845] [cursor=pointer]:
              - /url: /docs/latest/commands/del/
              - code [ref=e1846]: DEL
            - text: ", send a script that only removes the key if the value matches."
        - paragraph [ref=e1847]: This avoids that a client will try to release the lock after the expire time deleting the key created by another client that acquired the lock later.
        - paragraph [ref=e1848]: "An example of unlock script would be similar to the following:"
        - code [ref=e1850]: if redis.call("get",KEYS[1]) == ARGV[1] then return redis.call("del",KEYS[1]) else return 0 end
        - paragraph [ref=e1851]:
          - text: The script should be called with
          - code [ref=e1852]: EVAL ...script... 1 resource-name token-value
        - heading [level=2] [ref=e1853]:
          - text: Redis Software and Redis Cloud compatibility
          - link "Link to this section" [ref=e1854] [cursor=pointer]:
            - /url: "#redis-software-and-redis-cloud-compatibility"
