        - paragraph [ref=e1819]:
          - text: A hash digest is a fixed-size numerical representation of a string value, computed using the XXH3 hash algorithm. Redis uses this hash digest for efficient comparison operations without needing to compare the full string content. You can retrieve a key's hash digest using the
          - link [ref=e1820] [cursor=pointer]:
