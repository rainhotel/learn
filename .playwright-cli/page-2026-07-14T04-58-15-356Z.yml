          - heading "RocksDB Metrics" [level=3] [ref=e3962]
          - paragraph [ref=e3963]:
            - text: RocksDB metrics are grouped into statistics-based metrics and properties-based metrics. The former are recorded from statistics that a RocksDB state store collects whereas the latter are recorded from properties that RocksDB exposes. Statistics collected by RocksDB provide cumulative measurements over time, e.g. bytes written to the state store. Properties exposed by RocksDB provide current measurements, e.g., the amount of memory currently used. Note that the
            - code [ref=e3964]: store-scope
            - text: "for built-in RocksDB state stores are currently the following:"
          - list [ref=e3965]:
            - listitem [ref=e3966]:
              - code [ref=e3967]: rocksdb-state
              - text: (for RocksDB backed key-value store)
            - listitem [ref=e3968]:
              - code [ref=e3969]: rocksdb-window-state
              - text: (for RocksDB backed window store)
            - listitem [ref=e3970]:
              - code [ref=e3971]: rocksdb-session-state
              - text: (for RocksDB backed session store)
          - paragraph [ref=e3972]:
            - strong [ref=e3973]: "RocksDB Statistics-based Metrics:"
            - text: All the following statistics-based metrics have a recording level of
            - code [ref=e3974]: debug
            - text: because collecting statistics in
            - link "RocksDB may have an impact on performance" [ref=e3975] [cursor=pointer]:
              - /url: https://github.com/facebook/rocksdb/wiki/Statistics#stats-level-and-performance-costs
            - text: . Statistics-based metrics are collected every minute from the RocksDB state stores. If a state store consists of multiple RocksDB instances, as is the case for WindowStores and SessionStores, each metric reports an aggregation over the RocksDB instances of the state store.
