          - paragraph
          - heading "Streams Monitoring" [level=2] [ref=e2941]
          - paragraph [ref=e2942]:
            - text: "A Kafka Streams instance contains all the producer and consumer metrics as well as additional metrics specific to Streams. The metrics have three recording levels:"
            - code [ref=e2943]: info
            - text: ","
            - code [ref=e2944]: debug
            - text: ", and"
            - code [ref=e2945]: trace
            - text: .
          - paragraph [ref=e2946]: Note that the metrics have a 4-layer hierarchy. At the top level there are client-level metrics for each started Kafka Streams client. Each client has stream threads, with their own metrics. Each stream thread has tasks, with their own metrics. Each task has a number of processor nodes, with their own metrics. Each task also has a number of state stores and record caches, all with their own metrics.
          - paragraph [ref=e2947]: "Use the following configuration option to specify which metrics you want collected:"
          - generic [ref=e2949]:
            - button "Copy to clipboard" [ref=e2950] [cursor=pointer]: 
            - code [ref=e2951]:
              - generic [ref=e2952]: metrics.recording.level="info"
