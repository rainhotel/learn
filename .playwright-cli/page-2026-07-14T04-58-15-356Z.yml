        - generic [ref=e228]:
          - heading "Monitoring" [level=1] [ref=e229]
          - generic [ref=e230]: Monitoring
          - generic [ref=e232]:
            - heading "Tags:" [level=5] [ref=e233]
            - list [ref=e234]:
              - listitem [ref=e235]:
                - link "Kafka" [ref=e236] [cursor=pointer]:
                  - /url: https://kafka.apache.org/tags/kafka/
              - listitem [ref=e237]:
                - link "Docs" [ref=e238] [cursor=pointer]:
                  - /url: https://kafka.apache.org/tags/docs/
          - paragraph [ref=e239]: Kafka uses Yammer Metrics for metrics reporting in the server. The Java clients use Kafka Metrics, a built-in metrics registry that minimizes transitive dependencies pulled into client applications. Both expose metrics via JMX and can be configured to report stats using pluggable stats reporters to hook up to your monitoring system.
          - paragraph [ref=e240]:
            - text: All Kafka rate metrics have a corresponding cumulative count metric with suffix
            - code [ref=e241]: "-total"
            - text: . For example,
            - code [ref=e242]: records-consumed-rate
            - text: has a corresponding metric named
            - code [ref=e243]: records-consumed-total
            - text: .
          - paragraph [ref=e244]: The easiest way to see the available metrics is to fire up jconsole and point it at a running kafka client or server; this will allow browsing all metrics with JMX.
          - heading "Security Considerations for Remote Monitoring using JMX" [level=2] [ref=e245]
          - paragraph [ref=e246]:
            - text: Apache Kafka disables remote JMX by default. You can enable remote monitoring using JMX by setting the environment variable
            - code [ref=e247]: JMX_PORT
            - text: for processes started using the CLI or standard Java system properties to enable remote JMX programmatically. You must enable security when enabling remote JMX in production scenarios to ensure that unauthorized users cannot monitor or control your broker or application as well as the platform on which these are running. Note that authentication is disabled for JMX by default in Kafka and security configs must be overridden for production deployments by setting the environment variable
            - code [ref=e248]: KAFKA_JMX_OPTS
            - text: for processes started using the CLI or by setting appropriate Java system properties. See
            - link "Monitoring and Management Using JMX Technology" [ref=e249] [cursor=pointer]:
              - /url: https://docs.oracle.com/javase/8/docs/technotes/guides/management/agent.html
            - text: for details on securing JMX.
          - paragraph [ref=e250]: "We do graphing and alerting on the following metrics:"
          - table [ref=e251]:
            - rowgroup [ref=e252]:
              - row [ref=e253]:
                - columnheader [ref=e254]:
                  - paragraph [ref=e255]: Description
                - columnheader [ref=e256]:
                  - paragraph [ref=e257]: Mbean name
                - columnheader [ref=e258]:
                  - paragraph [ref=e259]: Normal value
              - row [ref=e260]:
                - cell [ref=e261]:
                  - paragraph [ref=e262]: Message in rate
                - cell [ref=e263]:
                  - paragraph [ref=e264]: kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec,topic=([-.\w]+)
                - cell [ref=e265]:
                  - paragraph [ref=e266]: Incoming message rate per topic. Omitting ’topic=(…)’ will yield the all-topic rate.
              - row [ref=e267]:
                - cell [ref=e268]:
                  - paragraph [ref=e269]: Byte in rate from clients
                - cell [ref=e270]:
                  - paragraph [ref=e271]: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec,topic=([-.\w]+)
                - cell [ref=e272]:
                  - paragraph [ref=e273]: Byte in (from the clients) rate per topic. Omitting ’topic=(…)’ will yield the all-topic rate.
              - row [ref=e274]:
                - cell [ref=e275]:
                  - paragraph [ref=e276]: Byte in rate from other brokers
                - cell [ref=e277]:
                  - paragraph [ref=e278]: kafka.server:type=BrokerTopicMetrics,name=ReplicationBytesInPerSec
                - cell [ref=e279]:
                  - paragraph [ref=e280]: Byte in (from the other brokers) rate across all topics.
              - row [ref=e281]:
                - cell [ref=e282]:
                  - paragraph [ref=e283]: Controller Request rate from Broker
                - cell [ref=e284]:
                  - paragraph [ref=e285]: kafka.controller:type=ControllerChannelManager,name=RequestRateAndQueueTimeMs,brokerId=([0-9]+)
                - cell [ref=e286]:
                  - paragraph [ref=e287]: The rate (requests per second) at which the ControllerChannelManager takes requests from the queue of the given broker. And the time it takes for a request to stay in this queue before it is taken from the queue.
              - row [ref=e288]:
                - cell [ref=e289]:
                  - paragraph [ref=e290]: Controller Event queue size
                - cell [ref=e291]:
                  - paragraph [ref=e292]: kafka.controller:type=ControllerEventManager,name=EventQueueSize
                - cell [ref=e293]:
                  - paragraph [ref=e294]: Size of the ControllerEventManager’s queue.
              - row [ref=e295]:
                - cell [ref=e296]:
                  - paragraph [ref=e297]: Controller Event queue time
                - cell [ref=e298]:
                  - paragraph [ref=e299]: kafka.controller:type=ControllerEventManager,name=EventQueueTimeMs
                - cell [ref=e300]:
                  - paragraph [ref=e301]: Time that takes for any event (except the Idle event) to wait in the ControllerEventManager’s queue before being processed
              - row [ref=e302]:
                - cell [ref=e303]:
                  - paragraph [ref=e304]: Request rate
                - cell [ref=e305]:
                  - paragraph [ref=e306]: "kafka.network:type=RequestMetrics,name=RequestsPerSec,request={Produce|FetchConsumer|FetchFollower},version=([0-9]+)"
                - cell [ref=e307]
              - row [ref=e308]:
                - cell [ref=e309]:
                  - paragraph [ref=e310]: Error rate
                - cell [ref=e311]:
                  - paragraph [ref=e312]: kafka.network:type=RequestMetrics,name=ErrorsPerSec,request=([-.\w]+),error=([-.\w]+)
                - cell [ref=e313]:
                  - paragraph [ref=e314]: Number of errors in responses counted per-request-type, per-error-code. If a response contains multiple errors, all are counted. error=NONE indicates successful responses.
              - row [ref=e315]:
                - cell [ref=e316]:
                  - paragraph [ref=e317]: Produce request rate
                - cell [ref=e318]:
                  - paragraph [ref=e319]: kafka.server:type=BrokerTopicMetrics,name=TotalProduceRequestsPerSec,topic=([-.\w]+)
                - cell [ref=e320]:
                  - paragraph [ref=e321]: Produce request rate per topic. Omitting ’topic=(…)’ will yield the all-topic rate.
              - row [ref=e322]:
                - cell [ref=e323]:
                  - paragraph [ref=e324]: Fetch request rate
                - cell [ref=e325]:
                  - paragraph [ref=e326]: kafka.server:type=BrokerTopicMetrics,name=TotalFetchRequestsPerSec,topic=([-.\w]+)
                - cell [ref=e327]:
                  - paragraph [ref=e328]: Fetch request (from clients or followers) rate per topic. Omitting ’topic=(…)’ will yield the all-topic rate.
              - row [ref=e329]:
                - cell [ref=e330]:
                  - paragraph [ref=e331]: Failed produce request rate
                - cell [ref=e332]:
                  - paragraph [ref=e333]: kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec,topic=([-.\w]+)
                - cell [ref=e334]:
                  - paragraph [ref=e335]: Failed Produce request rate per topic. Omitting ’topic=(…)’ will yield the all-topic rate.
              - row [ref=e336]:
                - cell [ref=e337]:
                  - paragraph [ref=e338]: Failed fetch request rate
                - cell [ref=e339]:
                  - paragraph [ref=e340]: kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec,topic=([-.\w]+)
                - cell [ref=e341]:
                  - paragraph [ref=e342]: Failed Fetch request (from clients or followers) rate per topic. Omitting ’topic=(…)’ will yield the all-topic rate.
              - row [ref=e343]:
                - cell [ref=e344]:
                  - paragraph [ref=e345]: Request size in bytes
                - cell [ref=e346]:
                  - paragraph [ref=e347]: kafka.network:type=RequestMetrics,name=RequestBytes,request=([-.\w]+)
                - cell [ref=e348]:
                  - paragraph [ref=e349]: Size of requests for each request type.
              - row [ref=e350]:
                - cell [ref=e351]:
                  - paragraph [ref=e352]: Temporary memory size in bytes
                - cell [ref=e353]:
                  - paragraph [ref=e354]: "kafka.network:type=RequestMetrics,name=TemporaryMemoryBytes,request={Produce|Fetch}"
                - cell [ref=e355]:
                  - paragraph [ref=e356]: Temporary memory used for message format conversions and decompression.
              - row [ref=e357]:
                - cell [ref=e358]:
                  - paragraph [ref=e359]: Message conversion time
                - cell [ref=e360]:
                  - paragraph [ref=e361]: "kafka.network:type=RequestMetrics,name=MessageConversionsTimeMs,request={Produce|Fetch}"
                - cell [ref=e362]:
                  - paragraph [ref=e363]: Time in milliseconds spent on message format conversions.
              - row [ref=e364]:
                - cell [ref=e365]:
                  - paragraph [ref=e366]: Message conversion rate
                - cell [ref=e367]:
                  - paragraph [ref=e368]: "kafka.server:type=BrokerTopicMetrics,name={Produce|Fetch}MessageConversionsPerSec,topic=([-.\\w]+)"
                - cell [ref=e369]:
                  - paragraph [ref=e370]: Message format conversion rate, for Produce or Fetch requests, per topic. Omitting ’topic=(…)’ will yield the all-topic rate.
              - row [ref=e371]:
                - cell [ref=e372]:
                  - paragraph [ref=e373]: Request Queue Size
                - cell [ref=e374]:
