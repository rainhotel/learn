          - generic [ref=e96]:
            - text: Hash table based implementation of the
            - code [ref=e97]: Map
            - text: interface. This implementation provides all of the optional map operations, and permits
            - code [ref=e98]: "null"
            - text: values and the
            - code [ref=e99]: "null"
            - text: key. (The
            - code [ref=e100]: HashMap
            - text: class is roughly equivalent to
            - code [ref=e101]: Hashtable
            - text: ", except that it is unsynchronized and permits nulls.) This class makes no guarantees as to the order of the map; in particular, it does not guarantee that the order will remain constant over time."
            - paragraph [ref=e102]:
              - text: This implementation provides constant-time performance for the basic operations (
              - code [ref=e103]: get
              - text: and
              - code [ref=e104]: put
              - text: ), assuming the hash function disperses the elements properly among the buckets. Iteration over collection views requires time proportional to the "capacity" of the
              - code [ref=e105]: HashMap
              - text: instance (the number of buckets) plus its size (the number of key-value mappings). Thus, it's very important not to set the initial capacity too high (or the load factor too low) if iteration performance is important.
            - paragraph [ref=e106]:
              - text: An instance of
              - code [ref=e107]: HashMap
              - text: "has two parameters that affect its performance: initial capacity and load factor. The capacity is the number of buckets in the hash table, and the initial capacity is simply the capacity at the time the hash table is created. The load factor is a measure of how full the hash table is allowed to get before its capacity is automatically increased. When the number of entries in the hash table exceeds the product of the load factor and the current capacity, the hash table is rehashed (that is, internal data structures are rebuilt) so that the hash table has approximately twice the number of buckets."
            - paragraph [ref=e108]:
              - text: As a general rule, the default load factor (.75) offers a good tradeoff between time and space costs. Higher values decrease the space overhead but increase the lookup cost (reflected in most of the operations of the
              - code [ref=e109]: HashMap
              - text: class, including
              - code [ref=e110]: get
              - text: and
              - code [ref=e111]: put
              - text: ). The expected number of entries in the map and its load factor should be taken into account when setting its initial capacity, so as to minimize the number of rehash operations. If the initial capacity is greater than the maximum number of entries divided by the load factor, no rehash operations will ever occur.
            - paragraph [ref=e112]:
              - text: If many mappings are to be stored in a
              - code [ref=e113]: HashMap
              - text: instance, creating it with a sufficiently large capacity will allow the mappings to be stored more efficiently than letting it perform automatic rehashing as needed to grow the table. Note that using many keys with the same
              - code [ref=e114]: hashCode()
              - text: is a sure way to slow down performance of any hash table. To ameliorate impact, when keys are
              - link [ref=e115] [cursor=pointer]:
                - /url: ../lang/Comparable.html
                - code [ref=e116]: Comparable
              - text: ", this class may use comparison order among keys to help break ties."
            - paragraph [ref=e117]:
              - strong [ref=e118]: Note that this implementation is not synchronized.
              - text: If multiple threads access a hash map concurrently, and at least one of the threads modifies the map structurally, it must be synchronized externally. (A structural modification is any operation that adds or deletes one or more mappings; merely changing the value associated with a key that an instance already contains is not a structural modification.) This is typically accomplished by synchronizing on some object that naturally encapsulates the map. If no such object exists, the map should be "wrapped" using the
              - link [ref=e119] [cursor=pointer]:
                - /url: Collections.html#synchronizedMap(java.util.Map)
                - code [ref=e120]: Collections.synchronizedMap
              - text: "method. This is best done at creation time, to prevent accidental unsynchronized access to the map:"
            - generic [ref=e121]: Map m = Collections.synchronizedMap(new HashMap(...));
            - paragraph
            - paragraph [ref=e122]:
              - text: "The iterators returned by all of this class's \"collection view methods\" are fail-fast: if the map is structurally modified at any time after the iterator is created, in any way except through the iterator's own"
              - code [ref=e123]: remove
              - text: method, the iterator will throw a
              - link [ref=e124] [cursor=pointer]:
                - /url: ConcurrentModificationException.html
                - code [ref=e125]: ConcurrentModificationException
              - text: . Thus, in the face of concurrent modification, the iterator fails quickly and cleanly, rather than risking arbitrary, non-deterministic behavior at an undetermined time in the future.
            - paragraph [ref=e126]:
              - text: Note that the fail-fast behavior of an iterator cannot be guaranteed as it is, generally speaking, impossible to make any hard guarantees in the presence of unsynchronized concurrent modification. Fail-fast iterators throw
              - code [ref=e127]: ConcurrentModificationException
              - text: "on a best-effort basis. Therefore, it would be wrong to write a program that depended on this exception for its correctness: the fail-fast behavior of iterators should be used only to detect bugs."
            - paragraph [ref=e128]:
              - text: This class is a member of the
              - link "Java Collections Framework" [ref=e129] [cursor=pointer]:
                - /url: ../../../java.base/java/util/package-summary.html#CollectionsFramework
              - text: .
