          - heading "Tracing" [level=1] [ref=e211]
          - generic [ref=e213]:
            - paragraph [ref=e215]:
              - text: Spring Boot Actuator provides dependency management and auto-configuration for
              - link "Micrometer Tracing" [ref=e216] [cursor=pointer]:
                - /url: https://docs.micrometer.io/tracing/reference/1.7
              - text: ", a facade for popular tracer libraries."
            - table [ref=e218]:
              - rowgroup [ref=e219]:
                - row [ref=e220]:
                  - cell "Tip" [ref=e221]
                  - cell [ref=e223]:
                    - text: To learn more about Micrometer Tracing capabilities, see its
                    - link "reference documentation" [ref=e224] [cursor=pointer]:
                      - /url: https://docs.micrometer.io/tracing/reference/1.7
                    - text: .
          - generic [ref=e225]:
            - heading "Supported Tracers" [level=2] [ref=e226]
            - generic [ref=e227]:
              - paragraph [ref=e229]: "Spring Boot ships auto-configuration for the following tracers:"
              - list [ref=e231]:
                - listitem [ref=e232]:
                  - paragraph [ref=e233]:
                    - link "OpenTelemetry" [ref=e234] [cursor=pointer]:
                      - /url: https://opentelemetry.io/
                    - text: with
                    - link "OTLP" [ref=e235] [cursor=pointer]:
                      - /url: https://opentelemetry.io/docs/reference/specification/protocol/
                    - text: .
                - listitem [ref=e236]:
                  - paragraph [ref=e237]:
                    - link "OpenZipkin Brave" [ref=e238] [cursor=pointer]:
                      - /url: https://github.com/openzipkin/brave
                    - text: with
                    - link "Zipkin" [ref=e239] [cursor=pointer]:
                      - /url: https://zipkin.io/
                    - text: .
          - generic [ref=e240]:
            - heading "Getting Started" [level=2] [ref=e241]
            - generic [ref=e242]:
              - paragraph [ref=e244]:
                - text: We need an example application that we can use to get started with tracing. For our purposes, the simple “Hello World!” web application that’s covered in the
                - link "Developing Your First Spring Boot Application" [ref=e245] [cursor=pointer]:
                  - /url: ../../tutorial/first-application/index.html
                - text: section will suffice. We’re going to use the Brave tracer with Zipkin as trace backend.
              - paragraph [ref=e247]: "To recap, our main application code looks like this:"
              - generic [ref=e249]:
                - tablist [ref=e251]:
                  - tab [selected] [ref=e252] [cursor=pointer]:
                    - paragraph [ref=e253]: Java
                  - tab [ref=e254] [cursor=pointer]:
                    - paragraph [ref=e255]: Kotlin
                - tabpanel "Java" [ref=e256]:
                  - generic [ref=e259]:
                    - code [ref=e260]:
                      - text: java
                      - generic: import org.apache.commons.logging.Log; import org.apache.commons.logging.LogFactory; import org.springframework.boot.SpringApplication; import org.springframework.boot.autoconfigure.SpringBootApplication; import org.springframework.web.bind.annotation.RequestMapping; import org.springframework.web.bind.annotation.RestController;
                      - generic [ref=e261]:
                        - text: "@RestController @SpringBootApplication public"
                        - generic [ref=e262]: class MyApplication
                        - text: "{ private static final Log logger = LogFactory.getLog(MyApplication"
                        - generic [ref=e263]: .class)
                        - text: ; @RequestMapping("/")
                        - generic [ref=e264]: String home()
                        - text: "{ logger.info(\"home() has been called\"); return \"Hello World!\"; }"
                        - generic [ref=e265]: public static void main(String[] args)
                        - text: "{ SpringApplication.run(MyApplication"
                        - generic [ref=e266]: .class, args)
                        - text: "; } }"
                    - generic [ref=e267]:
                      - button "Expand foldable text" [ref=e268] [cursor=pointer]
                      - button "Copied!" [ref=e269] [cursor=pointer]
                - text: kotlin
              - table [ref=e272]:
                - rowgroup [ref=e273]:
                  - row [ref=e274]:
                    - cell "Note" [ref=e275]
                    - cell [ref=e277]:
                      - text: There’s an added logger statement in the
                      - code [ref=e278]: home()
                      - text: method, which will be important later.
              - paragraph [ref=e280]:
                - text: Now we have to add the
                - code [ref=e281]: org.springframework.boot:spring-boot-starter-zipkin
                - text: dependency.
              - paragraph [ref=e283]: "Then add the following application properties:"
              - generic [ref=e285]:
                - tablist [ref=e287]:
                  - tab [selected] [ref=e288] [cursor=pointer]:
                    - paragraph [ref=e289]: Properties
                  - tab [ref=e290] [cursor=pointer]:
                    - paragraph [ref=e291]: YAML
                - tabpanel "Properties" [ref=e292]:
                  - generic [ref=e295]:
                    - code [ref=e296]: properties management.tracing.sampling.probability=1
                    - button "Copied!" [ref=e298] [cursor=pointer]
                - text: yaml
              - paragraph [ref=e301]: By default, Spring Boot samples only 10% of requests to prevent overwhelming the trace backend. This property switches it to 100% so that every request is sent to the trace backend.
              - paragraph [ref=e303]:
                - text: To collect and visualize the traces, we need a running trace backend. We use Zipkin as our trace backend here. The
                - link "Zipkin Quickstart guide" [ref=e304] [cursor=pointer]:
                  - /url: https://zipkin.io/pages/quickstart
                - text: provides instructions how to start Zipkin locally.
              - paragraph [ref=e306]: After Zipkin is running, you can start your application.
              - paragraph [ref=e308]:
                - text: If you open a web browser to
                - code [ref=e309]:
                  - link "localhost:8080" [ref=e310] [cursor=pointer]:
                    - /url: http://localhost:8080
                - text: ", you should see the following output:"
              - generic [ref=e313]:
                - code [ref=e314]: Hello World!
                - button "Copied!" [ref=e316] [cursor=pointer]
              - paragraph [ref=e319]: Behind the scenes, an observation has been created for the HTTP request, which in turn gets bridged to Brave, which reports a new trace to Zipkin.
              - paragraph [ref=e321]:
                - text: Now open the Zipkin UI at
                - code [ref=e322]:
                  - link "localhost:9411" [ref=e323] [cursor=pointer]:
                    - /url: http://localhost:9411
                - text: and press the "Run Query" button to list all collected traces. You should see one trace. Press the "Show" button to see the details of that trace.
          - generic [ref=e324]:
            - heading "Logging Correlation IDs" [level=2] [ref=e325]
            - generic [ref=e326]:
              - paragraph [ref=e328]: Correlation IDs provide a helpful way to link lines in your log files to spans/traces. If you are using Micrometer Tracing, Spring Boot will include correlation IDs in your logs by default.
              - paragraph [ref=e330]:
                - text: The default correlation ID is built from
                - code [ref=e331]: traceId
                - text: and
                - code [ref=e332]: spanId
                - link "MDC" [ref=e333] [cursor=pointer]:
                  - /url: https://logback.qos.ch/manual/mdc.html
                - text: values. For example, if Micrometer Tracing has added an MDC
                - code [ref=e334]: traceId
                - text: of
                - code [ref=e335]: 803B448A0489F84084905D3093480352
                - text: and an MDC
                - code [ref=e336]: spanId
                - text: of
                - code [ref=e337]: 3425F23BB2432450
                - text: the log output will include the correlation ID
                - code [ref=e338]: "[803B448A0489F84084905D3093480352-3425F23BB2432450]"
                - text: .
              - paragraph [ref=e340]:
                - text: If you prefer to use a different format for your correlation ID, you can use the
                - code [ref=e341]: logging.pattern.correlation
                - text: "property to define one. For example, the following will provide a correlation ID for Logback in format previously used by Spring Cloud Sleuth:"
              - generic [ref=e343]:
                - tablist [ref=e345]:
                  - tab [selected] [ref=e346] [cursor=pointer]:
                    - paragraph [ref=e347]: Properties
                  - tab [ref=e348] [cursor=pointer]:
                    - paragraph [ref=e349]: YAML
                - tabpanel "Properties" [ref=e350]:
                  - generic [ref=e353]:
                    - code [ref=e354]: "properties logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] logging.include-application-name=false"
                    - button "Copied!" [ref=e356] [cursor=pointer]
                - text: yaml
              - table [ref=e359]:
                - rowgroup [ref=e360]:
                  - row [ref=e361]:
                    - cell "Note" [ref=e362]
                    - cell [ref=e364]:
                      - text: In the example above,
                      - code [ref=e365]: logging.include-application-name
                      - text: is set to
                      - code [ref=e366]: "false"
                      - text: to avoid the application name being duplicated in the log messages (
                      - code [ref=e367]: logging.pattern.correlation
                      - text: already contains it). It’s also worth mentioning that
                      - code [ref=e368]: logging.pattern.correlation
                      - text: contains a trailing space so that it is separated from the logger name that comes right after it by default.
              - table [ref=e370]:
                - rowgroup [ref=e371]:
                  - row [ref=e372]:
                    - cell "Tip" [ref=e373]
                    - cell [ref=e375]:
                      - text: Correlation IDs rely on context propagation. Please read
                      - link "this documentation for more details" [ref=e376] [cursor=pointer]:
                        - /url: observability.html#actuator.observability.context-propagation
                      - text: .
          - generic [ref=e377]:
            - heading "Propagating Traces" [level=2] [ref=e378]
            - generic [ref=e379]:
              - paragraph [ref=e381]:
                - text: To automatically propagate traces over the network, use the auto-configured
                - link [ref=e382] [cursor=pointer]:
                  - /url: ../io/rest-client.html#io.rest-client.resttemplate
                  - code [ref=e383]: RestTemplateBuilder
                - text: ","
                - link [ref=e384] [cursor=pointer]:
                  - /url: ../io/rest-client.html#io.rest-client.restclient
                  - code [ref=e385]: RestClient.Builder
                - text: or
                - link [ref=e386] [cursor=pointer]:
                  - /url: ../io/rest-client.html#io.rest-client.webclient
                  - code [ref=e387]: WebClient.Builder
                - text: to construct the client.
              - table [ref=e389]:
                - rowgroup [ref=e390]:
                  - row [ref=e391]:
                    - cell "Warning" [ref=e392]
                    - cell [ref=e394]:
                      - text: If you create the
                      - link [ref=e395] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/web/client/RestTemplate.html
                        - code [ref=e396]: RestTemplate
                      - text: ", the"
                      - link [ref=e397] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/web/client/RestClient.html
                        - code [ref=e398]: RestClient
                      - text: or the
                      - link [ref=e399] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/web/reactive/function/client/WebClient.html
                        - code [ref=e400]: WebClient
                      - text: without using the auto-configured builders, automatic trace propagation won’t work!
          - generic [ref=e401]:
            - heading "Tracer Implementations" [level=2] [ref=e402]
            - generic [ref=e403]:
              - paragraph [ref=e405]: As Micrometer Tracer supports multiple tracer implementations, there are multiple dependency combinations possible with Spring Boot. The combinations OpenTelemetry with OTLP and Brave with Zipkin are common and have dedicated starters.
              - generic [ref=e406]:
                - heading "OpenTelemetry With OTLP" [level=3] [ref=e407]
                - paragraph [ref=e409]: "Tracing with OpenTelemetry and reporting using OTLP requires the following dependencies:"
                - list [ref=e411]:
                  - listitem [ref=e412]:
                    - paragraph [ref=e413]:
                      - code [ref=e414]: org.springframework.boot:spring-boot-starter-opentelemetry
                - paragraph [ref=e416]:
                  - text: Use the
                  - code [ref=e417]: management.opentelemetry.tracing.export.otlp.*
                  - text: configuration properties to configure reporting using OTLP.
                - table [ref=e419]:
                  - rowgroup [ref=e420]:
                    - row [ref=e421]:
                      - cell "Note" [ref=e422]
                      - cell [ref=e424]:
                        - text: If you need to apply advanced customizations to OTLP span exporters, consider registering
                        - link [ref=e425] [cursor=pointer]:
                          - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/micrometer/tracing/opentelemetry/autoconfigure/otlp/OtlpHttpSpanExporterBuilderCustomizer.html
                          - code [ref=e426]: OtlpHttpSpanExporterBuilderCustomizer
                        - text: or
                        - link [ref=e427] [cursor=pointer]:
                          - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/micrometer/tracing/opentelemetry/autoconfigure/otlp/OtlpGrpcSpanExporterBuilderCustomizer.html
                          - code [ref=e428]: OtlpGrpcSpanExporterBuilderCustomizer
                        - text: beans. These will be invoked before the creation of the
                        - code [ref=e429]: OtlpHttpSpanExporter
                        - text: or
                        - code [ref=e430]: OtlpGrpcSpanExporter
                        - text: . The customizers take precedence over anything applied by the auto-configuration.
              - generic [ref=e431]:
                - heading "OpenTelemetry With Zipkin" [level=3] [ref=e432]
                - table [ref=e434]:
                  - rowgroup [ref=e435]:
                    - row [ref=e436]:
                      - cell "Warning" [ref=e437]
                      - cell [ref=e439]:
                        - text: OpenTelemetry has
