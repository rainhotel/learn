    - heading "Advanced Topics" [level=1] [ref=e521]
    - paragraph [ref=e522]: Once you have a healthy and mature SLO and error budget culture, you can continue to improve and refine how you measure and discuss the reliability of your services.
    - heading "Modeling User Journeys" [level=5] [ref=e523]
    - paragraph [ref=e524]: While all of the techniques discussed in this chapter will be beneficial to your organization, ultimately SLOs should center on improving the customer experience. Therefore, you should write SLOs in terms of user-centric actions.
    - paragraph [ref=e525]: "You can use critical user journeys to help capture the experience of your customers. A critical user journey is a sequence of tasks that is a core part of a given user’s experience and an essential aspect of the service. For example, for an online shopping experience, critical user journeys might include:"
    - list [ref=e526]:
      - listitem [ref=e527]: Searching for a product
      - listitem [ref=e528]: Adding a product to a shopping cart
      - listitem [ref=e529]: Completing a purchase
    - paragraph [ref=e530]: These tasks will almost certainly not map well to your existing SLIs; each task requires multiple complex steps that can fail at any point, and inferring the success (or failure) of these actions from logs can be extremely difficult. (For example, how do you determine if the user failed at the third step, or if they simply got distracted by cat videos in another tab?) However, we need to identify what matters to the user before we can start making sure that aspect of the service is reliable.
    - paragraph [ref=e531]: Once you identify user-centric events, you can solve the problem of measuring them. You might measure them by joining distinct log events together, using advanced JavaScript probing, using client-side instrumentation, or using some other process. Once you can measure an event, it becomes just another SLI, which you can track alongside your existing SLIs and SLOs. Critical user journeys can improve your recall without affecting your precision.
    - heading "Grading Interaction Importance" [level=5] [ref=e532]
    - paragraph [ref=e533]: Not all requests are considered equal. The HTTP request from a mobile app that checks for account notifications (where notifications are generated by a daily pipeline) is important to your user, but is not as important as a billing-related request by your advertiser.
    - paragraph [ref=e534]:
      - text: We need a way to distinguish certain classes of requests from others. You can use bucketing to accomplish this—that is, adding more labels to your SLIs, and then applying different SLOs to those different labels.
      - link "Table 2-6" [ref=e535] [cursor=pointer]:
        - /url: "#bucketing-by-tier"
      - text: shows an example.
    - table [ref=e536]:
      - caption [ref=e537]: Table 2-6. Bucketing by tier
      - rowgroup [ref=e538]:
        - row [ref=e539]:
          - columnheader "Customer tier" [ref=e540]
          - columnheader "Availability SLO" [ref=e541]
      - rowgroup [ref=e542]:
        - row [ref=e543]:
          - cell [ref=e544]:
            - paragraph [ref=e545]: Premium
          - cell [ref=e546]:
            - paragraph [ref=e547]: 99.99%
        - row [ref=e548]:
          - cell [ref=e549]:
            - paragraph [ref=e550]: Free
          - cell [ref=e551]:
            - paragraph [ref=e552]: 99.9%
    - paragraph [ref=e553]:
      - text: You can split requests by expected responsiveness, as shown in
      - link "Table 2-7" [ref=e554] [cursor=pointer]:
        - /url: "#bucketing-by-expected-responsiveness"
    - table [ref=e555]:
      - caption [ref=e556]: Table 2-7. Bucketing by expected responsiveness
      - rowgroup [ref=e557]:
        - row [ref=e558]:
          - columnheader "Responsiveness" [ref=e559]
          - columnheader "Latency SLO" [ref=e560]
      - rowgroup [ref=e561]:
        - row [ref=e562]:
          - cell [ref=e563]:
            - paragraph [ref=e564]: Interactive (i.e., requests that block page load)
          - cell [ref=e565]:
            - paragraph [ref=e566]: 90% of requests complete in 100 ms
        - row [ref=e567]:
          - cell [ref=e568]:
            - paragraph [ref=e569]: CSV download
          - cell [ref=e570]:
            - paragraph [ref=e571]: 90% of downloads start within 5 s
    - paragraph [ref=e572]: If you have the data available to apply your SLO to each customer independently, you can track the number of customers who are in SLO at any given time. Note that this number can be highly variable—customers who send a very low number of requests will have either 100% availability (because they were lucky enough to experience no failures) or very low availability (because the one failure they experienced was a significant percentage of their requests). Individual customers can fail to meet their SLO for uninteresting reasons, but in aggregate, tracking problems that affect a wide number of customers’ SLO compliance can be a useful signal.
    - heading "Modeling Dependencies" [level=5] [ref=e573]
    - paragraph [ref=e574]: Large systems have many components. A single system may have a presentation layer, an application layer, a business logic layer, and a data persistence layer. Each of these layers may consist of many services or microservices.
    - paragraph [ref=e575]: While your prime concern is implementing a user-centric SLO that covers the entire stack, SLOs can also be a useful way to coordinate and implement reliability requirements between different components in the stack.
    - paragraph [ref=e576]:
      - text: For example, if a single component is a critical dependency
      - superscript [ref=e577]:
        - link "9" [ref=e578] [cursor=pointer]:
          - /url: "#ch02fn9"
      - text: for a particularly high-value interaction, its reliability guarantee should be at least as high as the reliability guarantee of the dependent action. The team that runs that particular component needs to own and manage its service’s SLO in the same way as the overarching product SLO.
    - paragraph [ref=e579]: If a particular component has inherent reliability limitations, the SLO can communicate that limitation. If the user journey that depends upon it needs a higher level of availability than that component can reasonably provide, you need to engineer around that condition. You can either use a different component or add sufficient defenses (caching, offline store-and-forward processing, graceful degradation, etc.) to handle failures in that component.
    - paragraph [ref=e580]: It can be tempting to try to math your way out of these problems. If you have a service that offers 99.9% availability in a single zone, and you need 99.95% availability, simply deploying the service in two zones should solve that requirement. The probability that both services will experience an outage at the same time is so low that two zones should provide 99.9999% availability. However, this reasoning assumes that both services are wholly independent, which is almost never the case. The two instances of your app will have common dependencies, common failure domains, shared fate, and global control planes—all of which can cause an outage in both systems, no matter how carefully it is designed and managed. Unless each of these dependencies and failure patterns is carefully enumerated and accounted for, any such calculations will be deceptive.
    - paragraph [ref=e581]: "There are two schools of thought regarding how an error budget policy should address a missed SLO when the failure is caused by a dependency that’s handled by another team:"
    - list [ref=e582]:
      - listitem [ref=e583]: Your team should not halt releases or devote more time to reliability, as your system didn’t cause the issue.
      - listitem [ref=e584]: You should enact a change freeze in order to minimize the chances of future outages, regardless of the cause of that outage.
    - paragraph [ref=e585]:
      - text: The second approach will make your users happier. You have some flexibility in how you apply this principle. Depending on the nature of the outage and dependency, freezing changes may not be practical. Decide what is most appropriate for your service and its dependencies, and record that decision for posterity in your documented error budget. For an example of how this might work in practice, see the example error budget policy in
      - link "Example Error Budget Policy" [ref=e586] [cursor=pointer]:
        - /url: https://sre.google/workbook/error-budget-policy/
      - text: .
    - heading "Experimenting with Relaxing Your SLOs" [level=5] [ref=e587]
    - paragraph [ref=e588]: You may want to experiment with the reliability of your application and measure which changes in reliability (e.g., adding latency into page load times) have a measurably adverse impact on user behavior (e.g., percentage of users completing a purchase). We recommend performing this sort of analysis only if you are confident that you have error budget to burn. There are many subtle interactions between latency, availability, customers, business domains, and competition (or lack thereof). To make a choice to deliberately lower the perceived customer experience is a Rubicon to be crossed extremely thoughtfully, if at all.
    - paragraph [ref=e589]: While this exercise might seem scary (nobody wants to lose sales!), the knowledge you can gain by performing such experiments will allow you to improve your service in ways that could lead to even better performance (and higher sales!) in the future. This process may allow you to mathematically identify a relationship between a key business metric (e.g., sales) and a measurable technical metric (e.g., latency). If it does, you have gained a very valuable piece of data you can use to make important engineering decisions for your service going forward.
    - paragraph [ref=e590]: This exercise should not be a one-time activity. As your service evolves, so will your customers’ expectations. Make sure you regularly review the ongoing validity of the relationship.
    - paragraph [ref=e591]: This sort of analysis is also risky because you can misinterpret the data you get. For example, if you artificially slow your pages down by 50 ms and notice that no corresponding loss in conversions occurs, you might conclude that your latency SLO is too strict. However, your users might be unhappy, but simply lacking an alternative to your service at the moment. As soon as a competitor comes along, your users will leave. Be sure you are measuring the correct indicators, and take appropriate precautions.
    - heading "Conclusion" [level=1] [ref=e592]
    - paragraph [ref=e593]: Every topic covered in this book can be tied back to SLOs. Now that you’ve read this chapter, we hope you’ll agree that even partly formalized SLOs (which clearly state your promises to users) offer a framework to discuss system behavior with greater clarity, and can help with pinpointing actionable remedies when services fail to meet expectations.
    - paragraph [ref=e594]: "To summarize:"
    - list [ref=e595]:
      - listitem [ref=e596]: SLOs are the tool by which you measure your service’s reliability.
      - listitem [ref=e597]: Error budgets are a tool for balancing reliability with other engineering work, and a great way to decide which projects will have the most impact.
      - listitem [ref=e598]: You should start using SLOs and error budgets today.
    - paragraph [ref=e599]:
      - text: For an example SLO document and an example error budget policy, see Appendixes
      - link "Example SLO Document" [ref=e600] [cursor=pointer]:
        - /url: https://sre.google/workbook/slo-document/
      - text: and
      - link "Example Error Budget Policy" [ref=e601] [cursor=pointer]:
        - /url: https://sre.google/workbook/error-budget-policy/
      - text: .
    - generic [ref=e602]:
      - paragraph [ref=e603]:
        - superscript [ref=e604]:
          - link "1" [ref=e605] [cursor=pointer]:
            - /url: "#ch02fn1-marker"
        - text: "A note on terminology: throughout this chapter, we use the word reliability to talk about how a service is performing with regard to all of its SLIs. This could be indicative of many things, such as availability or latency."
      - paragraph [ref=e606]:
        - superscript [ref=e607]:
          - link "2" [ref=e608] [cursor=pointer]:
            - /url: "#ch02fn2-marker"
        - text: This is distinct from a service level agreement (SLA), which is a business contract that comes into effect when your users are so unhappy you have to compensate them in some fashion.
      - paragraph [ref=e609]:
        - superscript [ref=e610]:
          - link "3" [ref=e611] [cursor=pointer]:
            - /url: "#ch02fn3-marker"
        - text: For more details about factoring dependencies into your service’s reliability, see Ben Treynor, Mike Dahlin, Vivek Rau, and Betsy Beyer, “The Calculus of Service Availability,” ACM Queue 15, no. 2 (2017),
        - link "https://queue.acm.org/detail.cfm?id=3096459" [ref=e612] [cursor=pointer]:
          - /url: https://queue.acm.org/detail.cfm?id=3096459
        - text: .
      - paragraph [ref=e613]:
        - superscript [ref=e614]:
          - link "4" [ref=e615] [cursor=pointer]:
            - /url: "#ch02fn4-marker"
        - text: If you measure your SLO over a calendar period, such as a quarter-year, then you may not know how big your budget will be at the end of the quarter if it’s based upon unpredictable metrics such as traffic. See
        - link "Choosing an Appropriate Time Window" [ref=e616] [cursor=pointer]:
          - /url: "#choosing-an-appropriate-time-window"
        - text: for more discussion about reporting periods.
      - paragraph [ref=e617]:
        - superscript [ref=e618]:
          - link "5" [ref=e619] [cursor=pointer]:
            - /url: "#ch02fn5-marker"
        - text: 50 ms because users are unlikely to perceive a 50 ms change in latency, but the appropriate window obviously depends on the service and the users. A reporting service will be different from a real-time game.
      - paragraph [ref=e620]:
        - superscript [ref=e621]:
          - link "6" [ref=e622] [cursor=pointer]:
            - /url: "#ch02fn6-marker"
        - text: "Disclaimer: there may be more difficult tasks in your future."
      - paragraph [ref=e623]:
        - superscript [ref=e624]:
          - link "7" [ref=e625] [cursor=pointer]:
            - /url: "#ch02fn7-marker"
        - text: Recall is the proportion of significantly user-impacting events that the SLI captures. Precision is the proportion of events captured by the SLI that were significantly user-impacting.
      - paragraph [ref=e626]:
        - superscript [ref=e627]:
          - link "8" [ref=e628] [cursor=pointer]:
            - /url: "#ch02fn8-marker"
        - text: It is worth reiterating here that an error budget is an approximation of user satisfaction. A four-hour outage every 30 days would probably result in fewer unhappy users than four separate one-hour outages every 30 days, which in turn would cause fewer unhappy users than a constant error rate of 0.5%, but our error budget treats them the same. These thresholds will vary between services.
      - paragraph [ref=e629]:
        - superscript [ref=e630]:
          - link "9" [ref=e631] [cursor=pointer]:
            - /url: "#ch02fn9-marker"
        - text: A dependency is critical if its unavailability means that your service is also unavailable.
