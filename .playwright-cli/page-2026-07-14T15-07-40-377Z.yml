      - listitem [ref=e258]: "Total successful requests: 3,557,865 (97.123%)"
      - listitem [ref=e259]: "90th percentile latency: 432 ms"
      - listitem [ref=e260]: "99th percentile latency: 891 ms"
    - paragraph [ref=e261]:
      - text: We repeat this process for the other SLIs, and create a proposed SLO for the API, shown in
      - link "Table 2-3" [ref=e262] [cursor=pointer]:
