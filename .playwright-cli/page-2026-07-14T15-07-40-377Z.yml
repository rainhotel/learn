    - heading "Using the SLIs to Calculate Starter SLOs" [level=5] [ref=e251]
    - paragraph [ref=e252]:
      - text: We can round down these SLIs to manageable numbers (e.g., two significant figures of availability, or up to 50 ms
      - superscript [ref=e253]:
        - link "5" [ref=e254] [cursor=pointer]:
          - /url: "#ch02fn5"
      - text: of latency) to obtain our starting SLOs.
    - paragraph [ref=e255]: "For example, over four weeks, the API metrics show:"
    - list [ref=e256]:
