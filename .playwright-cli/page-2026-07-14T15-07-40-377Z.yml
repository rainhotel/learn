- main [ref=e2]:
  - heading "Chapter 2 - Implementing SLOs" [level=2] [ref=e7]
  - generic [ref=e9]:
    - heading "Implementing SLOs" [level=1] [ref=e10]
    - paragraph [ref=e11]: By Steven Thurgood and David Ferguson with Alex Hidalgo and Betsy Beyer
    - paragraph [ref=e12]: Service level objectives (SLOs) specify a target level for the reliability of your service. Because SLOs are key to making data-driven decisions about reliability, they’re at the core of SRE practices. In many ways, this is the most important chapter in this book.
    - paragraph [ref=e13]:
      - text: Once you’re equipped with a few guidelines, setting up initial SLOs and a process for refining them can be straightforward.
      - link "Chapter 4" [ref=e14] [cursor=pointer]:
        - /url: https://sre.google/sre-book/service-level-objectives/
      - text: in our first book introduced the topic of SLOs and SLIs (service level indicators), and gave some advice on how to use them.
    - paragraph [ref=e15]:
      - text: After discussing the motivation behind SLOs and error budgets, this chapter provides a step-by-step recipe to get you started thinking about SLOs, and also some advice about how to iterate from there. We’ll then cover how to use SLOs to make effective business decisions, and explore some advanced topics. Finally, we’ll give you some examples of SLOs for different types of services and some pointers on how to create more sophisticated SLOs in specific situations.
      - superscript [ref=e16]:
        - link "1" [ref=e17] [cursor=pointer]:
          - /url: "#ch02fn1"
    - heading "Why SREs Need SLOs" [level=2] [ref=e18]
    - paragraph [ref=e19]: Engineers are a scarce resource at even the largest organizations. Engineering time should be invested in the most important characteristics of the most important services. Striking the right balance between investing in functionality that will win new customers or retain current ones, versus investing in the reliability and scalability that will keep those customers happy, is difficult. At Google, we’ve learned that a well-thought-out and adopted SLO is key to making data-informed decisions about the opportunity cost of reliability work, and to determining how to appropriately prioritize that work.
    - paragraph [ref=e20]: "SREs’ core responsibilities aren’t merely to automate “all the things” and hold the pager. Their day-to-day tasks and projects are driven by SLOs: ensuring that SLOs are defended in the short term and that they can be maintained in the medium to long term. One could even claim that without SLOs, there is no need for SREs."
    - paragraph [ref=e21]:
      - text: "SLOs are a tool to help determine what engineering work to prioritize. For example, consider the engineering tradeoffs for two reliability projects: automating rollbacks and moving to a replicated data store. By calculating the estimated impact on our error budget, we can determine which project is most beneficial to our users. See the section"
      - link "Decision Making Using SLOs and Error Budgets" [ref=e22] [cursor=pointer]:
        - /url: "#decision-making-using-slos-and-error-budgets"
      - text: for more detail on this, and
      - link "“Managing Risk”" [ref=e23] [cursor=pointer]:
        - /url: "https://sre.google/sre-book/embracing-risk/\n#id-AnCDFmtB"
      - text: in Site Reliability Engineering.
    - heading "Getting Started" [level=1] [ref=e24]
    - paragraph [ref=e25]:
      - text: As a starting point for establishing a basic
      - link "set of SLOs" [ref=e26] [cursor=pointer]:
        - /url: https://sre.google/workbook/slo-engineering-case-studies/
      - text: ", let’s assume that your service is some form of code that has been compiled and released and is running on networked infrastructure that users access via the web. Your system’s maturity level might be one of the following:"
    - list [ref=e27]:
      - listitem [ref=e28]: A greenfield development, with nothing currently deployed
      - listitem [ref=e29]: A system in production with some monitoring to notify you when things go awry, but no formal objectives, no concept of an error budget, and an unspoken goal of 100% uptime
      - listitem [ref=e30]: A running deployment with an SLO below 100%, but without a common understanding about its importance or how to leverage it to make continuous improvement choices—in other words, an SLO without teeth
    - paragraph [ref=e31]: "In order to adopt an error budget-based approach to Site Reliability Engineering, you need to reach a state where the following hold true:"
    - list [ref=e32]:
      - listitem [ref=e33]: There are SLOs that all stakeholders in the organization have approved as being fit for the product.
      - listitem [ref=e34]: The people responsible for ensuring that the service meets its SLO have agreed that it is possible to meet this SLO under normal circumstances.
      - listitem [ref=e35]: The organization has committed to using the error budget for decision making and prioritizing. This commitment is formalized in an error budget policy.
      - listitem [ref=e36]: There is a process in place for refining the SLO.
    - paragraph [ref=e37]: Otherwise, you won’t be able to adopt an error budget–based approach to reliability. SLO compliance will simply be another KPI (key performance indicator) or reporting metric, rather than a decision-making tool.
    - heading "Reliability Targets and Error Budgets" [level=5] [ref=e38]
    - paragraph [ref=e39]: The first step in formulating appropriate SLOs is to talk about what an SLO should be, and what it should cover.
    - paragraph [ref=e40]:
      - text: An SLO sets a target level of reliability for the service’s customers. Above this threshold, almost all users should be happy with your service (assuming they are otherwise happy with the utility of the service).
      - superscript [ref=e41]:
        - link "2" [ref=e42] [cursor=pointer]:
          - /url: "#ch02fn2"
      - text: Below this threshold, users are likely to start complaining or to stop using the service. Ultimately, user happiness is what matters—happy users use the service, generate revenue for your organization, place low demands on your customer support teams, and recommend the service to their friends. We keep our services reliable to keep our customers happy.
    - paragraph [ref=e43]: Customer happiness is a rather fuzzy concept; we can’t measure it precisely. Often we have very little visibility into it at all, so how do we begin? What do we use for our first SLO?
    - paragraph [ref=e44]: "Our experience has shown that 100% reliability is the wrong target:"
    - list [ref=e45]:
      - listitem [ref=e46]: If your SLO is aligned with customer satisfaction, 100% is not a reasonable goal. Even with redundant components, automated health checking, and fast failover, there is a nonzero probability that one or more components will fail simultaneously, resulting in less than 100% availability.
      - listitem [ref=e47]:
        - text: Even if you could achieve 100% reliability within your system, your customers would not experience 100% reliability. The chain of systems between you and your customers is often long and complex, and any of these components can fail.
        - superscript [ref=e48]:
          - link "3" [ref=e49] [cursor=pointer]:
            - /url: "#ch02fn3"
        - text: This also means that as you go from 99% to 99.9% to 99.99% reliability, each extra nine comes at an increased cost, but the marginal utility to your customers steadily approaches zero.
      - listitem [ref=e50]: "If you do manage to create an experience that is 100% reliable for your customers, and want to maintain that level of reliability, you can never update or improve your service. The number one source of outages is change: pushing new features, applying security patches, deploying new hardware, and scaling up to meet customer demand will impact that 100% target. Sooner or later, your service will stagnate and your customers will go elsewhere, which is not great for anyone’s bottom line."
      - listitem [ref=e51]: An SLO of 100% means you only have time to be reactive. You literally cannot do anything other than react to < 100% availability, which is guaranteed to happen. Reliability of 100% is not an engineering culture SLO—it’s an operations team SLO.
    - paragraph [ref=e52]: Once you have an SLO target below 100%, it needs to be owned by someone in the organization who is empowered to make tradeoffs between feature velocity and reliability. In a small organization, this may be the CTO; in larger organizations, this is normally the product owner (or product manager).
    - 'heading "What to Measure: Using SLIs" [level=5] [ref=e53]'
    - paragraph [ref=e54]:
      - text: Once you agree that 100% is the wrong number, how do you determine the right number? And what are you measuring, anyway? Here,
      - link "service level indicators" [ref=e55] [cursor=pointer]:
        - /url: https://sre.google/sre-book/service-level-objectives/
      - text: "come into play: an SLI is an indicator of the level of service that you are providing."
    - paragraph [ref=e56]: "While many numbers can function as an SLI, we generally recommend treating the SLI as the ratio of two numbers: the number of good events divided by the total number of events. For example:"
    - list [ref=e57]:
      - listitem [ref=e58]: Number of successful HTTP requests / total HTTP requests (success rate)
      - listitem [ref=e59]: Number of gRPC calls that completed successfully in < 100 ms / total gRPC requests
      - listitem [ref=e60]: Number of search results that used the entire corpus / total number of search results, including those that degraded gracefully
      - listitem [ref=e61]: Number of “stock check count” requests from product searches that used stock data fresher than 10 minutes / total number of stock check requests
      - listitem [ref=e62]: Number of “good user minutes” according to some extended list of criteria for that metric / total number of user minutes
    - paragraph [ref=e63]:
      - text: "SLIs of this form have a couple of particularly useful properties. The SLI ranges from 0% to 100%, where 0% means nothing works, and 100% means nothing is broken. We have found this scale intuitive, and this style lends itself easily to the concept of an error budget: the SLO is a target percentage and the error budget is 100% minus the SLO. For example, if you have a 99.9% success ratio SLO, then a service that receives 3 million requests over a four-week period had a budget of 3,000 (0.1%) errors over that period. If a single outage is responsible for 1,500 errors, that error costs 50% of the error budget."
      - superscript [ref=e64]:
        - link "4" [ref=e65] [cursor=pointer]:
          - /url: "#ch02fn4"
    - paragraph [ref=e66]: "In addition, making all of your SLIs follow a consistent style allows you to take better advantage of tooling: you can write alerting logic, SLO analysis tools, error budget calculation, and reports to expect the same inputs: numerator, denominator, and threshold. Simplification is a bonus here."
    - paragraph [ref=e67]: "When attempting to formulate SLIs for the first time, you might find it useful to further divide SLIs into SLI specification and SLI implementation:"
    - paragraph [ref=e68]: SLI specification
    - list [ref=e69]:
      - listitem [ref=e70]: The assessment of service outcome that you think matters to users, independent of how it is measured.
      - listitem [ref=e71]: "For example: Ratio of home page requests that loaded in < 100 ms"
    - paragraph [ref=e72]: SLI implementation
    - list [ref=e73]:
      - listitem [ref=e74]: The SLI specification and a way to measure it.
    - list [ref=e75]:
      - listitem [ref=e76]: "For example:"
      - list [ref=e77]:
        - listitem [ref=e78]:
          - paragraph [ref=e79]: Ratio of home page requests that loaded in < 100 ms, as measured from the Latency column of the server log. This measurement will miss requests that fail to reach the backend.
        - listitem [ref=e80]: Ratio of home page requests that loaded in < 100 ms, as measured by probers that execute JavaScript in a browser running in a virtual machine. This measurement will catch errors when requests cannot reach our network, but may miss issues that affect only a subset of users.
        - listitem [ref=e81]: Ratio of home page requests that loaded in < 100 ms, as measured by instrumentation in the JavaScript on the home page itself, and reported back to a dedicated telemetry recording service. This measurement will more accurately capture the user experience, although we now need to modify the code to capture this information and build the infrastructure to record it—a specification that has its own reliability requirements.
    - paragraph [ref=e82]: As you can see, a single SLI specification might have multiple SLI implementations, each with its own set of pros and cons in terms of quality (how accurately they capture the experience of a customer), coverage (how well they capture the experience of all customers), and cost.
    - paragraph [ref=e83]:
      - text: Your first attempt at an SLI and SLO doesn’t have to be correct; the most important goal is to get something in place and measured, and to set up a feedback loop so you can improve. (We dive deeper into this topic in
      - link "Continuous Improvement of SLO Targets" [ref=e84] [cursor=pointer]:
        - /url: "#continuous-improvement-of-slo-targets"
      - text: .)
    - paragraph [ref=e85]:
      - text: In
      - link "our first book" [ref=e86] [cursor=pointer]:
        - /url: https://sre.google/sre-book/table-of-contents/
      - text: ", we advise against picking an SLO based upon current performance, because this can commit you to unnecessarily strict SLOs. While that advice is true, your current performance can be a good place to start if you don’t have any other information, and if you have a good process for iterating in place (which we’ll cover later). However, don’t let current performance limit you as you refine your SLO: your customers will also come to expect your service to perform at its SLO, so if your service returns successful requests 99.999% of the time in less than 10 ms, any significant regression from that baseline may make them unhappy."
    - paragraph [ref=e87]: To create your first set of SLOs, you need to decide upon a few key SLI specifications that matter to your service. Availability and latency SLOs are pretty common; freshness, durability, correctness, quality, and coverage SLOs also have their place (we’ll talk more about those later).
    - paragraph [ref=e88]: "If you are having trouble figuring out what sort of SLIs to start with, it helps to start simple:"
    - list [ref=e89]:
      - listitem [ref=e90]: Choose one application for which you want to define SLOs. If your product comprises many applications, you can add those later.
      - listitem [ref=e91]: Decide clearly who the “users” are in this situation. These are the people whose happiness you are optimizing.
      - listitem [ref=e92]: Consider the common ways your users interact with your system—common tasks and critical activities.
      - listitem [ref=e93]: Draw a high-level architecture diagram of your system; show the key components, the request flow, the data flow, and the critical dependencies. Group these components into categories listed in the following section (there may be some overlap and ambiguity; use your intuition and don’t let perfect be the enemy of the good).
    - paragraph [ref=e94]: You should think carefully about exactly what you select as your SLIs, but you also shouldn’t overcomplicate things. Especially if you’re just starting your SLI journey, pick an aspect of your system that’s relevant but easy to measure—you can always iterate and refine later.
    - heading "Types of components" [level=6] [ref=e95]
    - paragraph [ref=e96]: "The easiest way to get started with setting SLIs is to abstract your system into a few common types of components. You can then use our list of suggested SLIs for each component to choose the ones most relevant to your service:"
    - paragraph [ref=e97]: Request-driven
    - list [ref=e98]:
      - listitem [ref=e99]: The user creates some type of event and expects a response. For example, this could be an HTTP service where the user interacts with a browser or an API for a mobile application.
    - paragraph [ref=e100]: Pipeline
    - list [ref=e101]:
      - listitem [ref=e102]: "A system that takes records as input, mutates them, and places the output somewhere else. This might be a simple process that runs on a single instance in real time, or a multistage batch process that takes many hours. Examples include:"
      - list [ref=e103]:
        - listitem [ref=e104]: A system that periodically reads data from a relational database and writes it into a distributed hash table for optimized serving
        - listitem [ref=e105]: A video processing service that converts video from one format to another
        - listitem [ref=e106]: A system that reads in log files from many sources to generate reports
        - listitem [ref=e107]:
          - text: A monitoring system that pulls metrics from remote servers and generates
          - link "time series and alerts" [ref=e108] [cursor=pointer]:
            - /url: ../../sre-book/practical-alerting/
    - paragraph [ref=e109]: Storage
    - list [ref=e110]:
      - listitem [ref=e111]: A system that accepts data (e.g., bytes, records, files, videos) and makes it available to be retrieved at a later date.
    - heading "A Worked Example" [level=1] [ref=e112]
    - paragraph [ref=e113]:
      - text: Consider a simplified architecture for a mobile phone game, shown in
      - link "Figure 2-1" [ref=e114] [cursor=pointer]:
        - /url: "#architecture-for-an-example-mobile-phone-game"
      - text: .
    - figure "Figure 2-1. Architecture for an example mobile phone game" [ref=e115]:
      - img "architecture-for-an-example-mobile-phone-game" [ref=e116]
    - paragraph [ref=e118]: The app running on the user’s phone interacts with an HTTP API running in the cloud. The API writes state changes to a permanent storage system. A pipeline periodically runs over this data to generate league tables that provide high scores for today, this week, and all time. This data is written to a separate league table data store, and the results are available via the mobile app (for in-game scores) and a website. Users can upload custom avatars, which are used both in-game via the API and in the high score website, to the User Data table.
    - paragraph [ref=e119]: Given this setup, we can start thinking about how users interact with the system, and what sort of SLIs would measure the various aspects of a user’s experience.
    - paragraph [ref=e120]: "Some of these SLIs may overlap: a request-driven service may have a correctness SLI, a pipeline may have an availability SLI, and durability SLIs might be viewed as a variant on correctness SLIs. We recommend choosing a small number (five or fewer) of SLI types that represent the most critical functionality to your customers."
    - paragraph [ref=e121]: "In order to capture both the typical user experience and the long tail, we also recommend using multiple grades of SLOs for some types of SLIs. For example, if 90% of users’ requests return within 100 ms, but the remaining 10% take 10 seconds, many users will be unhappy. A latency SLO can capture this user base by setting multiple thresholds: 90% of requests are faster than 100 ms, and 99% of requests are faster than 400 ms. This principle applies to all SLIs with parameters that measure user unhappiness."
    - paragraph [ref=e122]:
      - link "Table 2-1" [ref=e123] [cursor=pointer]:
        - /url: "#slis-for-different-types-of-services"
      - text: provides some common SLIs for different types of services.
    - table [ref=e124]:
      - caption [ref=e125]: Table 2-1. Potential SLIs for different types of components
      - rowgroup [ref=e126]:
        - row [ref=e127]:
          - columnheader "Type of service" [ref=e128]
          - columnheader "Type of SLI" [ref=e129]
          - columnheader "Description" [ref=e130]
      - rowgroup [ref=e131]:
        - row [ref=e132]:
          - cell [ref=e133]:
            - paragraph [ref=e134]: Request-driven
          - cell [ref=e135]:
            - paragraph [ref=e136]: Availability
          - cell [ref=e137]:
            - paragraph [ref=e138]: The proportion of requests that resulted in a successful response.
        - row [ref=e139]:
          - cell [ref=e140]:
            - paragraph [ref=e141]: Request-driven
          - cell [ref=e142]:
            - paragraph [ref=e143]: Latency
          - cell [ref=e144]:
            - paragraph [ref=e145]: The proportion of requests that were faster than some threshold.
        - row [ref=e146]:
          - cell [ref=e147]:
            - paragraph [ref=e148]: Request-driven
          - cell [ref=e149]:
            - paragraph [ref=e150]: Quality
          - cell [ref=e151]:
            - paragraph [ref=e152]: If the service degrades gracefully when overloaded or when backends are unavailable, you need to measure the proportion of responses that were served in an undegraded state. For example, if the User Data store is unavailable, the game is still playable but uses generic imagery.
        - row [ref=e153]:
          - cell [ref=e154]:
            - paragraph [ref=e155]: Pipeline
          - cell [ref=e156]:
            - paragraph [ref=e157]: Freshness
          - cell [ref=e158]:
            - paragraph [ref=e159]: The proportion of the data that was updated more recently than some time threshold. Ideally this metric counts how many times a user accessed the data, so that it most accurately reflects the user experience.
        - row [ref=e160]:
          - cell [ref=e161]:
            - paragraph [ref=e162]: Pipeline
          - cell [ref=e163]:
            - paragraph [ref=e164]: Correctness
          - cell [ref=e165]:
            - paragraph [ref=e166]: The proportion of records coming into the pipeline that resulted in the correct value coming out.
        - row [ref=e167]:
          - cell [ref=e168]:
            - paragraph [ref=e169]: Pipeline
          - cell [ref=e170]:
            - paragraph [ref=e171]: Coverage
          - cell [ref=e172]:
            - paragraph [ref=e173]: For batch processing, the proportion of jobs that processed above some target amount of data. For streaming processing, the proportion of incoming records that were successfully processed within some time window.
        - row [ref=e174]:
          - cell [ref=e175]:
            - paragraph [ref=e176]: Storage
          - cell [ref=e177]:
            - paragraph [ref=e178]: Durability
          - cell [ref=e179]:
            - paragraph [ref=e180]: "The proportion of records written that can be successfully read. Take particular care with durability SLIs: the data that the user wants may be only a small portion of the data that is stored. For example, if you have 1 billion records for the previous 10 years, but the user wants only the records from today (which are unavailable), then they will be unhappy even though almost all of their data is readable."
    - heading "Moving from SLI Specification to SLI Implementation" [level=5] [ref=e181]
    - paragraph [ref=e182]: Now that we know our SLI specifications, we need to start thinking about how to implement them.
    - paragraph [ref=e183]: For your first SLIs, choose something that requires a minimum of engineering work. If your web server logs are already available, but setting up probes would take weeks and instrumenting your JavaScript would take months, use the logs.
    - paragraph [ref=e184]: "You need enough information to measure the SLI: for availability, you need the success/failure status; for slow requests, you need the time taken to serve the request. You may need to reconfigure your web server to record this information. If you’re using a cloud-based service, some of this information may already be available in a monitoring dashboard."
    - paragraph [ref=e185]: There are various options for SLI implementations for our example architecture, each with its own pros and cons. The following sections detail SLIs for the three types of components in our system.
    - heading "API and HTTP server availability and latency" [level=6] [ref=e186]
    - paragraph [ref=e187]: For all of the considered SLI implementations, we base the response success on the HTTP status code. 5XX responses count against SLO, while all other requests are considered successful. Our availability SLI is the proportion of successful requests, and our latency SLIs are the proportion of requests that are faster than defined thresholds.
    - paragraph [ref=e188]:
      - text: Your SLIs should be specific and measurable. To summarize the list of potential candidates provided in
      - 'link "What to Measure: Using SLIs" [ref=e189] [cursor=pointer]':
        - /url: "#what-to-measure-using-slis"
      - text: ", your SLIs can use one or more of the following sources:"
    - list [ref=e190]:
      - listitem [ref=e191]: Application server logs
      - listitem [ref=e192]: Load balancer monitoring
      - listitem [ref=e193]: Black-box monitoring
      - listitem [ref=e194]: Client-side instrumentation
    - paragraph [ref=e195]: Our example uses the load balancer monitoring, as the metrics are already available and provide SLIs that are closer to the user’s experience than those from the application server’s logs.
    - heading "Pipeline freshness, coverage, and correctness" [level=6] [ref=e196]
    - paragraph [ref=e197]: "When our pipeline updates the league table, it records a watermark containing the timestamp of when the data was updated. Some example SLI implementations:"
    - list [ref=e198]:
      - listitem [ref=e199]: Run a periodic query across the league table, counting the total number of fresh records and the total number of records. This will treat each stale record as equally important, regardless of how many users saw the data.
      - listitem [ref=e200]: Make all clients of the league table check the watermark when they request fresh data and increment a metric counter saying that data was requested. Increment another counter if the data was fresher than a predefined threshold.
    - paragraph [ref=e201]: From these two options, our example uses the client-side implementation, as it gives SLIs that are much more closely correlated with user experience and are straightforward to add.
    - paragraph [ref=e202]: To calculate our coverage SLI, our pipeline exports the number of records that it should have processed and the number of records that it successfully processed. This metric may miss records that our pipeline did not know about due to misconfiguration.
    - paragraph [ref=e203]: "We have a couple potential approaches to measure correctness:"
    - list [ref=e204]:
      - listitem [ref=e205]: Inject data with known outputs into the system, and count the proportion of times that the output matches our expectations.
      - listitem [ref=e206]: Use a method to calculate correct output based on input that is distinct from our pipeline itself (and likely more expensive, and therefore not suitable for our pipeline). Use this to sample input/output pairs, and count the proportion of correct output records. This methodology assumes that creating such a system is both possible and practical.
    - paragraph [ref=e207]: Our example bases its correctness SLI on some manually curated data in the game state database, with known good outputs that are tested every time the pipeline runs. Our SLI is the proportion of correct entries for our test data. In order for this SLI to be representative of the actual user experience, we need to make sure that our manually curated data is representative of real-world data.
    - heading "Measuring the SLIs" [level=5] [ref=e208]
    - paragraph [ref=e209]:
      - link "Figure 2-2" [ref=e210] [cursor=pointer]:
        - /url: "#how-our-monitoring-system-collects-sli-metrics"
      - text: shows how our white-box monitoring system collects metrics from the various components of the example application.
    - figure "Figure 2-2. How our monitoring system collects SLI metrics" [ref=e211]:
      - img "how-our-monitoring-system-collects-sli-metrics" [ref=e212]
    - paragraph [ref=e214]:
      - text: Let’s walk through an example of using metrics from our monitoring system to calculate our starter SLOs. While our example uses availability and latency metrics, the same principles apply to all other potential SLOs. For a full list of the metrics that our system uses, see
      - link "Example SLO Document" [ref=e215] [cursor=pointer]:
        - /url: https://sre.google/workbook/slo-document/
      - text: . All of our examples use
      - link "Prometheus notation" [ref=e216] [cursor=pointer]:
        - /url: https://prometheus.io/
      - text: .
    - heading "Load balancer metrics" [level=6] [ref=e217]
    - paragraph [ref=e218]:
      - text: Total requests by backend (
      - code [ref=e219]: "\"api\""
      - text: or
      - code [ref=e220]: "\"web\""
      - text: ") and response code:"
    - generic [ref=e221]: "http_requests_total{host=\"api\", status=\"500\"}"
    - paragraph [ref=e222]: "Total latency, as a cumulative histogram; each bucket counts the number of requests that took less than or equal to that time:"
    - generic [ref=e223]: "http_request_duration_seconds{host=\"api\", le=\"0.1\"} http_request_duration_seconds{host=\"api\", le=\"0.2\"} http_request_duration_seconds{host=\"api\", le=\"0.4\"}"
    - paragraph [ref=e224]: Generally speaking, it is better to count the slow requests than to approximate them with a histogram. But, because that information isn’t available, we use the histogram provided by our monitoring system. Another approach would be to base explicit slow request counts on the various slowness thresholds in the load balancer’s configuration (e.g., for thresholds of 100 ms and 500 ms). This strategy would provide more accurate numbers but require more configuration, which makes changing the thresholds retroactively harder.
    - paragraph [ref=e225]:
      - code [ref=e226]: "http_request_duration_seconds{host=\"api\", le=\"0.1\"} http_request_duration_seconds{host=\"api\", le=\"0.5\"}"
    - heading "Calculating the SLIs" [level=6] [ref=e227]
    - paragraph [ref=e228]:
      - text: Using the preceding metrics, we can calculate our current SLIs over the previous seven days, as shown in
      - link "Table 2-2" [ref=e229] [cursor=pointer]:
        - /url: "#calculations-for-slis"
      - text: .
    - table [ref=e230]:
      - caption [ref=e231]: Table 2-2. Calculations for SLIs over the previous seven days
      - rowgroup [ref=e232]:
        - row [ref=e233]:
          - cell [ref=e234]:
            - paragraph [ref=e235]: Availability
          - cell [ref=e236]:
            - paragraph [ref=e237]:
              - code [ref=e238]: "sum(rate(http_requests_total{host=\"api\", status!~\"5..\"}[7d]))"
            - paragraph [ref=e239]:
