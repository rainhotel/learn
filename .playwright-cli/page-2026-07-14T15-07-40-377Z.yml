    - heading "Choosing an Appropriate Time Window" [level=1] [ref=e310]
    - paragraph [ref=e311]: SLOs can be defined over various time intervals, and can use either a rolling window or a calendar-aligned window (e.g., a month). There are several factors you need to account for when choosing the window.
    - paragraph [ref=e312]: "Rolling windows are more closely aligned with user experience: if you have a large outage on the final day of a month, your user doesn’t suddenly forget about it on the first day of the following month. We recommend defining this period as an integral number of weeks so it always contains the same number of weekends. For example, if you use a 30-day window, some periods might include four weekends while others include five weekends. If weekend traffic differs significantly from weekday traffic, your SLIs may vary for uninteresting reasons."
    - paragraph [ref=e313]: "Calendar windows are more closely aligned with business planning and project work. For example, you might evaluate your SLOs every quarter to determine where to focus the next quarter’s project headcount. Calendar windows also introduce some element of uncertainty: in the middle of the quarter, it is impossible to know how many requests you will receive for the rest of the quarter. Therefore, decisions made mid-quarter must speculate as to how much error budget you’ll spend in the remainder of the quarter."
    - paragraph [ref=e314]: "Shorter time windows allow you to make decisions more quickly: if you missed your SLO for the previous week, then small course corrections—prioritizing relevant bugs, for example—can help avoid SLO violations in future weeks."
    - paragraph [ref=e315]: "Longer time periods are better for more strategic decisions: for example, if you could choose only one of three large projects, would you be better off moving to a high-availability distributed database, automating your rollout and rollback procedure, or deploying a duplicate stack in another zone? You need more than a week’s worth of data to evaluate large multiquarter projects; the amount of data required is roughly commensurate with the amount of engineering work being proposed to fix it."
    - paragraph [ref=e316]: We have found a four-week rolling window to be a good general-purpose interval. We complement this time frame with weekly summaries for task prioritization and quarterly summarized reports for project planning.
    - paragraph [ref=e317]: "If the data source allows, you can then use this proposed SLO to calculate your actual SLO performance over that interval: if you set your initial SLO based on actual measurements, by design, you met your SLO. But we can also gather interesting information about the distribution. Were there any days during the past four weeks when our service did not meet its SLO? Do these days correlate with actual incidents? Was there (or should there have been) some action taken on those days in response to incidents?"
    - paragraph [ref=e318]: If you do not have logs, metrics, or any other source of historical performance, you need to configure a data source. For example, as a low-fidelity solution for HTTP services, you can set up a remote monitoring service that performs some kind of periodic health check on the service (a ping or an HTTP GET) and reports back the number of successful requests. A number of online services can easily implement this solution.
    - heading "Getting Stakeholder Agreement" [level=1] [ref=e319]
    - paragraph [ref=e320]: "In order for a proposed SLO to be useful and effective, you will need to get all stakeholders to agree to it:"
    - list [ref=e321]:
      - listitem [ref=e322]: The product managers have to agree that this threshold is good enough for users—performance below this value is unacceptably low and worth spending engineering time to fix.
      - listitem [ref=e323]:
        - text: The product developers need to agree that if the error budget has been exhausted, they will take some steps to reduce risk to users until the service is back in budget (as discussed in
        - link "Establishing an Error Budget Policy" [ref=e324] [cursor=pointer]:
          - /url: "#establishing-an-error-budget-policy"
        - text: ).
      - listitem [ref=e325]: The team responsible for the production environment who are tasked with defending this SLO have agreed that it is defensible without Herculean effort, excessive toil, and burnout—all of which are damaging to the long-term health of the team and service.
    - paragraph [ref=e326]:
      - text: Once all of these points are agreed upon, the hard part is done.
      - superscript [ref=e327]:
        - link "6" [ref=e328] [cursor=pointer]:
          - /url: "#ch02fn6"
      - text: You have started your SLO journey, and the remaining steps entail iterating from this starting point.
    - paragraph [ref=e329]:
      - text: To defend your SLO you will need to set up monitoring and alerting (see
      - link "Alerting on SLOs" [ref=e330] [cursor=pointer]:
        - /url: https://sre.google/workbook/alerting-on-slos/
      - text: ) so that engineers receive timely notifications of threats to the error budget before those threats become deficits.
    - heading "Establishing an Error Budget Policy" [level=5] [ref=e331]
    - paragraph [ref=e332]: Once you have an SLO, you can use the SLO to derive an error budget. In order to use this error budget, you need a policy outlining what to do when your service runs out of budget.
    - paragraph [ref=e333]:
      - text: Getting the
      - link "error budget policy" [ref=e334] [cursor=pointer]:
        - /url: https://sre.google/workbook/error-budget-policy/
      - text: "approved by all key stakeholders—the product manager, the development team, and the SREs—is a good test for whether the SLOs are fit for purpose:"
    - list [ref=e335]:
      - listitem [ref=e336]: If the SREs feel that the SLO is not defensible without undue amounts of toil, they can make a case for relaxing some of the objectives.
      - listitem [ref=e337]: If the development team and product manager feel that the increased resources they’ll have to devote to fixing reliability will cause feature release velocity to fall below acceptable levels, then they can also argue for relaxing objectives. Remember that lowering the SLOs also lowers the number of situations to which the SREs will respond; the product manager needs to understand this tradeoff.
      - listitem [ref=e338]: If the product manager feels that the SLO will result in a bad experience for a significant number of users before the error budget policy prompts anyone to address an issue, the SLOs are likely not tight enough.
    - paragraph [ref=e339]: "If all three parties do not agree to enforce the error budget policy, you need to iterate on the SLIs and SLOs until all stakeholders are happy. Decide how to move forward and what you need to make the decision: more data, more resources, or a change to the SLI or SLO?"
    - paragraph [ref=e340]: When we talk about enforcing an error budget, we mean that once you exhaust your error budget (or come close to exhausting it), you should do something in order to restore stability to your system.
    - paragraph [ref=e341]: "To make error budget enforcement decisions, you need to start with a written policy. This policy should cover the specific actions that must be taken when a service has consumed its entire error budget for a given period of time, and specify who will take them. Common owners and actions might include:"
    - list [ref=e342]:
      - listitem [ref=e343]: The development team gives top priority to bugs relating to reliability issues over the past four weeks.
      - listitem [ref=e344]: The development team focuses exclusively on reliability issues until the system is within SLO. This responsibility comes with high-level approval to push back on external feature requests and mandates.
      - listitem [ref=e345]: To reduce the risk of more outages, a production freeze halts certain changes to the system until there is sufficient error budget to resume changes.
    - paragraph [ref=e346]: Sometimes a service consumes the entirety of its error budget, but not all stakeholders agree that enacting the error budget policy is appropriate. If this happens, you need to return to the error budget policy approval stage.
    - heading "Documenting the SLO and Error Budget Policy" [level=5] [ref=e347]
    - paragraph [ref=e348]: "An appropriately defined SLO should be documented in a prominent location where other teams and stakeholders can review it. This documentation should include the following information:"
    - list [ref=e349]:
      - listitem [ref=e350]: The authors of the SLO, the reviewers (who checked it for technical accuracy), and the approvers (who made the business decision about whether it is the right SLO).
      - listitem [ref=e351]: The date on which it was approved, and the date when it should next be reviewed.
      - listitem [ref=e352]: A brief description of the service to give the reader context.
      - listitem [ref=e353]: "The details of the SLO: the objectives and the SLI implementations."
      - listitem [ref=e354]: The details of how the error budget is calculated and consumed.
      - listitem [ref=e355]: The rationale behind the numbers, and whether they were derived from experimental or observational data. Even if the SLOs are totally ad hoc, this fact should be documented so that future engineers reading the document don’t make bad decisions based upon ad hoc data.
    - paragraph [ref=e356]: How often you review an SLO document depends on the maturity of your SLO culture. When starting out, you should probably review the SLO frequently—perhaps every month. Once the appropriateness of the SLO becomes more established, you can likely reduce reviews to happen quarterly or even less frequently.
    - paragraph [ref=e357]: "The error budget policy should also be documented, and should include the following information:"
    - list [ref=e358]:
      - listitem [ref=e359]: The policy authors, reviewers, and approvers
      - listitem [ref=e360]: The date on which it was approved, and the date when it should next be reviewed
      - listitem [ref=e361]: A brief description of the service to give the reader context
      - listitem [ref=e362]: The actions to be taken in response to budget exhaustion
      - listitem [ref=e363]: A clear escalation path to follow if there is disagreement on the calculation or whether the agreed-upon actions are appropriate in the circumstances
      - listitem [ref=e364]: Depending upon the audience’s level of error budget experience and expertise, it may be beneficial to include an overview of error budgets.
    - paragraph [ref=e365]:
      - text: See
      - link "Example SLO Document" [ref=e366] [cursor=pointer]:
        - /url: https://sre.google/workbook/slo-document/
      - text: for an example of an SLO document and an error budget policy.
    - heading "Dashboards and Reports" [level=5] [ref=e367]
    - paragraph [ref=e368]: In addition to the published SLO and error budget policy documents, it is useful to have reports and dashboards that provide in-time snapshots of the SLO compliance of your services, for communicating with other teams and for spotting problematic areas.
    - paragraph [ref=e369]:
      - text: The report in
      - link "Figure 2-3" [ref=e370] [cursor=pointer]:
        - /url: "#slo-compliance-report"
      - text: "shows the overall compliance of several services: whether they met all of their quarterly SLOs for the previous year (the numbers in parentheses indicate the number of objectives that were met, and the total number of objectives), and whether their SLIs were trending upward or downward in relation to the previous quarter and the same quarter last year."
    - figure "Figure 2-3. SLO compliance report" [ref=e371]:
      - img "slo-compliance-report" [ref=e372]
    - paragraph [ref=e374]: It is also useful to have dashboards showing SLI trends. These dashboards indicate if you are consuming budget at a higher-than-usual rate, or if there are patterns or trends you need to be aware of.
    - paragraph [ref=e375]:
      - text: The dashboard in
      - link "Figure 2-4" [ref=e376] [cursor=pointer]:
        - /url: "#error-budget-dashboard"
      - text: shows the error budget for a single quarter, midway through that quarter. Here we see that a single event consumed around 15% of the error budget over the course of two days.
    - figure "Figure 2-4. Error budget dashboard" [ref=e377]:
      - img "error-budget-dashboard" [ref=e378]
    - paragraph [ref=e380]: Error budgets can be useful for quantifying these events—for example, “this outage consumed 30% of my quarterly error budget,” or “these are the top three incidents this quarter, ordered by how much error budget they consumed.”
    - heading "Continuous Improvement of SLO Targets" [level=1] [ref=e381]
    - paragraph [ref=e382]:
      - text: Every service can benefit from continuous improvement. This is one of the central service goals in
      - link "ITIL" [ref=e383] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/ITIL
      - text: ", for example."
    - paragraph [ref=e384]: "Before you can improve your SLO targets, you need a source of information about user satisfaction with your service. There are a huge range of options:"
    - list [ref=e385]:
      - listitem [ref=e386]: You can count outages that were discovered manually, posts on public forums, support tickets, and calls to customer service.
      - listitem [ref=e387]: You can attempt to measure user sentiment on social media.
      - listitem [ref=e388]: You can add code to your system to periodically sample user happiness.
      - listitem [ref=e389]: You can conduct face-to-face user surveys and samples.
    - paragraph [ref=e390]: The possibilities are endless, and the optimal method depends on your service. We recommend starting with a measurement that’s cheap to collect and iterating from that starting point. Asking your product manager to include reliability into their existing discussions with customers about pricing and functionality is an excellent place to start.
    - heading "Improving the Quality of Your SLO" [level=5] [ref=e391]
    - paragraph [ref=e392]:
      - text: Count your manually detected outages. If you have support tickets, count those too. Look at periods when you had a known outage or incident. Check that these periods correlate with steep drops in error budget. Likewise, look at times when your SLIs indicate an issue, or your service fell out of SLO. Do these time periods correlate with known outages or an increase in support tickets? If you are familiar with statistical analysis,
      - link "Spearman’s rank correlation coefficient" [ref=e393] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/Spearman's_rank_correlation_coefficient
      - text: can be a useful way to quantify this relationship.
    - paragraph [ref=e394]:
      - link "Figure 2-5" [ref=e395] [cursor=pointer]:
        - /url: "#graph-showing-the-number-of-support-tickets-per-day"
      - text: "shows a graph of the number of support tickets raised per day versus the measured loss in our error budget on that day. While not all tickets are related to reliability issues, there is a correlation between tickets and error budget loss. We see two outliers: one day with only 5 tickets, where we lost 10% of our error budget, and one day with 40 tickets, on which we lost no error budget. Both warrant closer investigation."
    - figure "Figure 2-5. Graph showing the number of support tickets per day versus the budget loss on that day" [ref=e396]:
      - img "graph-showing-the-number-of-support-tickets-per-day" [ref=e397]
    - paragraph [ref=e399]: If some of your outages and ticket spikes are not captured in any SLI or SLO, or if you have SLI dips and SLO misses that don’t map to user-facing issues, this is a strong sign that your SLO lacks coverage. This situation is totally normal and should be expected. Your SLIs and SLOs should change over time as realities about the service they represent change. Don’t be afraid to examine and refine them over time!
    - paragraph [ref=e400]: "There are several courses of action you can take if your SLO lacks coverage:"
    - paragraph [ref=e401]: Change your SLO
    - list [ref=e402]:
      - listitem [ref=e403]: If your SLIs indicated a problem, but your SLOs didn’t prompt anyone to notice or respond, you may need to tighten your SLO.
      - list [ref=e404]:
        - listitem [ref=e405]:
          - text: If the incident on that date was large enough that it needs to be addressed, look at the SLI values during the periods of interest. Calculate what SLO would have resulted in a notification on those dates. Apply that SLO to your historic SLIs, and see what other events this adjustment would have captured. It’s pointless to improve the recall of your system if you lower the precision such that the team must constantly respond to unimportant events.
          - superscript [ref=e406]:
            - link "7" [ref=e407] [cursor=pointer]:
              - /url: "#ch02fn7"
        - listitem [ref=e408]: Likewise, for false-positive days, consider relaxing the SLO.
      - listitem [ref=e409]: If changing the SLO in either direction results in too many false positives or false negatives, then you also need to improve the SLI implementation.
    - paragraph [ref=e410]: Change your SLI implementation
    - list [ref=e411]:
      - listitem [ref=e412]: "There are two ways to change your SLI implementation: either move the measurement closer to the user to improve the quality of the metric, or improve coverage so you capture a higher percentage of user interactions. For example:"
      - list [ref=e413]:
        - listitem [ref=e414]: Instead of measuring success/latency at the server, measure it at the load balancer or on the client.
        - listitem [ref=e415]: Instead of measuring availability with a simple HTTP GET request, use a health-checking handler that exercises more functionality of the system, or a test that executes all of the client-side JavaScript.
    - paragraph [ref=e416]: Institute an aspirational SLO
    - list [ref=e417]:
      - listitem [ref=e418]: Sometimes you determine that you need a tighter SLO to make your users happy, but improving your product to meet that SLO will take some time. If you implement the tighter SLO, you’ll be permanently out of SLO and subject to your error budget policy. In this situation, you can make the refined SLO an aspirational SLO—measured and tracked alongside your current SLO, but explicitly called out in your error budget policy as not requiring action. This way you can track your progress toward meeting the aspirational SLO, but you won’t be in a perpetual state of emergency.
    - paragraph [ref=e419]: Iterate
    - list [ref=e420]:
      - listitem [ref=e421]: There are many different ways to iterate, and your review sessions will identify many potential improvements. Pick the option that’s most likely to give the highest return on investment. Especially during the first few iterations, err on the side of quicker and cheaper; doing so reduces the uncertainty in your metrics and helps you determine if you need more expensive metrics. Iterate as many times as you need to.
    - heading "Decision Making Using SLOs and Error Budgets" [level=1] [ref=e422]
    - paragraph [ref=e423]: Once you have SLOs, you can start using them for decision making.
    - paragraph [ref=e424]: The obvious decisions start from what to do when you’re not meeting your SLO—that is, when you’ve exhausted your error budget. As already discussed, the appropriate course of action when you exhaust your error budget should be covered by the error budget policy. Common policies include stopping feature launches until the service is once again within SLO or devoting some or all engineering time to working on reliability-related bugs.
    - paragraph [ref=e425]: In extreme circumstances, a team can declare an emergency with high-level approval to deprioritize all external demands (requests from other teams, for example) until the service meets exit criteria—typically that the service is within SLO and that you’ve taken steps to decrease the chances of a subsequent SLO miss. These steps may include improving monitoring, improving testing, removing dangerous dependencies, or rearchitecting the system to remove known failure types.
    - paragraph [ref=e426]: You can determine the scale of the incident according to the proportion of the error budget it consumed, and use this data to identify the most critical incidents that merit closer investigation.
    - paragraph [ref=e427]:
      - text: For example, imagine a release of a new API version causes 100%
      - code [ref=e428]: NullPointerException
      - text: s until the system can be reverted four hours later.
      - superscript [ref=e429]:
        - link "8" [ref=e430] [cursor=pointer]:
          - /url: "#ch02fn8"
      - text: Inspecting the raw server logs indicates that the issue caused 14,066 errors. Using the numbers from our 97% SLO earlier, and our budget of 109,897 errors, this single event used 13% of our error budget.
    - paragraph [ref=e431]: Or perhaps the server on which our singly homed state database is stored fails, and restoring from backups takes 20 hours. We estimate (based upon historical traffic over that period) that this outage caused us 72,000 errors, or 65% of our error budget.
    - paragraph [ref=e432]: Imagine that our example company had only one server failure in five years, but typically experiences two or three bad releases that require rollbacks per year. We can estimate that, on average, bad pushes cost twice as much error budget as database failures. The numbers prove that addressing the release problem provides much more benefit than investing resources in investigating the server failure.
    - paragraph [ref=e433]: If the service is running flawlessly and needs little oversight, then it may be time to move the service to a less hands-on tier of support. You might continue to provide incident response management and high-level oversight, but you no longer need to be as closely involved with the product on a day-to-day basis. Therefore, you can focus your efforts on other systems that need more SRE support.
    - paragraph [ref=e434]:
      - link "Table 2-5" [ref=e435] [cursor=pointer]:
        - /url: "#slo-decision-matrix"
      - text: "provides suggested courses of action based on three key dimensions:"
    - list [ref=e436]:
      - listitem [ref=e437]: Performance against SLO
      - listitem [ref=e438]: The amount of toil required to operate the service
      - listitem [ref=e439]: The level of customer satisfaction with the service
    - table [ref=e440]:
