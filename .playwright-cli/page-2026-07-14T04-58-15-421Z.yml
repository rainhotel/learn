                  - /url: "#producerconfigs_bootstrap.servers"
              - paragraph [ref=e179]:
                - text: A list of host/port pairs used to establish the initial connection to the Kafka cluster. Clients use this list to bootstrap and discover the full set of Kafka brokers. While the order of servers in the list does not matter, we recommend including more than one server to ensure resilience if any servers are down. This list does not need to contain the entire set of brokers, as Kafka clients automatically manage and update connections to the cluster efficiently. This list must be in the form
                - code [ref=e180]: host1:port1,host2:port2,...
                - text: .
