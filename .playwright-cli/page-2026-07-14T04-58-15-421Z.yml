                    - cell "[0,...]" [ref=e249]
                  - row [ref=e250]:
                    - rowheader "Importance:" [ref=e251]
                    - cell "high" [ref=e252]
            - listitem [ref=e253]:
              - heading [level=4] [ref=e254]:
                - link "compression.type" [ref=e255] [cursor=pointer]:
                  - /url: "#producerconfigs_compression.type"
              - paragraph [ref=e256]:
                - text: The compression type for all data generated by the producer. The default is none (i.e. no compression). Valid values are
                - code [ref=e257]: none
                - text: ","
                - code [ref=e258]: gzip
                - text: ","
                - code [ref=e259]: snappy
                - text: ","
                - code [ref=e260]: lz4
                - text: ", or"
                - code [ref=e261]: zstd
                - text: . Compression is of full batches of data, so the efficacy of batching will also impact the compression ratio (more batching means better compression).
              - table [ref=e262]:
                - rowgroup [ref=e263]:
                  - row [ref=e264]:
                    - rowheader "Type:" [ref=e265]
                    - cell "string" [ref=e266]
                  - row [ref=e267]:
                    - rowheader "Default:" [ref=e268]
                    - cell "none" [ref=e269]
                  - row [ref=e270]:
                    - rowheader "Valid Values:" [ref=e271]
                    - cell "[none, gzip, snappy, lz4, zstd]" [ref=e272]
                  - row [ref=e273]:
                    - rowheader "Importance:" [ref=e274]
                    - cell "high" [ref=e275]
            - listitem [ref=e276]:
              - heading [level=4] [ref=e277]:
                - link "retries" [ref=e278] [cursor=pointer]:
                  - /url: "#producerconfigs_retries"
              - paragraph [ref=e279]:
                - text: Number of times to retry a request that fails with a transient error. Setting a value greater than zero will cause the client to resend any record whose send fails with a potentially transient error. Requests will be retried this many times until they succeed, fail with a non-transient error, or the
                - code [ref=e280]: delivery.timeout.ms
                - text: expires. Note that this automatic retry will simply resend the same record upon receiving the error. Setting a value of zero will disable this automatic retry behaviour, so that the transient errors will be propagated to the application to be handled. Users should generally prefer to leave this config unset and instead use
                - code [ref=e281]: delivery.timeout.ms
                - text: to control retry behavior.
              - paragraph [ref=e282]: Enabling idempotence requires this config value to be greater than 0. If conflicting configurations are set and idempotence is not explicitly enabled, idempotence is disabled.
              - paragraph [ref=e283]:
                - text: Allowing retries while setting
                - code [ref=e284]: enable.idempotence
                - text: to
                - code [ref=e285]: "false"
                - text: and
                - code [ref=e286]: max.in.flight.requests.per.connection
                - text: to greater than 1 will potentially change the ordering of records because if two batches are sent to a single partition, and the first fails and is retried but the second succeeds, then the records in the second batch may appear first.
