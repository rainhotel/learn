              - heading [level=4] [ref=e973]:
                - link "sasl.oauthbearer.assertion.file" [ref=e974] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.assertion.file"
              - paragraph
              - paragraph [ref=e975]:
                - text: File that contains a
                - emphasis [ref=e976]: pre-generated
                - text: JWT assertion.
              - paragraph [ref=e977]: The underlying implementation caches the file contents to avoid the performance hit of loading the file on each access. The caching mechanism will detect whenthe file changes to allow for the file to be reloaded on modifications. This allows for "live" assertion rotation without restarting the Kafka client.
              - paragraph [ref=e978]: "The file contains the assertion in the serialized, three part JWT format:"
              - list [ref=e979]:
                - listitem [ref=e980]:
                  - text: The
                  - emphasis [ref=e981]: header
                  - text: section is a base 64-encoded JWT header that contains values like
                  - code [ref=e982]: alg
                  - text: (Algorithm),
                  - code [ref=e983]: typ
                  - text: (Type, always the literal value
                  - code [ref=e984]: JWT
                  - text: ), etc.
                - listitem [ref=e985]:
                  - text: The
                  - emphasis [ref=e986]: payload
                  - text: section includes the base 64-encoded set of JWT claims, such as
                  - code [ref=e987]: aud
                  - text: (Audience),
                  - code [ref=e988]: iss
                  - text: (Issuer),
                  - code [ref=e989]: sub
                  - text: (Subject), etc.
                - listitem [ref=e990]:
                  - text: The
                  - emphasis [ref=e991]: signature
                  - text: section is the concatenated
                  - emphasis [ref=e992]: header
                  - text: and
                  - emphasis [ref=e993]: payload
                  - text: sections that was signed using a private key
              - paragraph [ref=e994]:
                - text: See
                - link "RFC 7519" [ref=e995] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc7519
                - text: and
                - link "RFC 7515" [ref=e996] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc7515
                - text: for more details on the JWT and JWS formats.
              - paragraph [ref=e997]:
                - emphasis [ref=e998]: Note
                - text: ": If a value for"
                - code [ref=e999]: sasl.oauthbearer.assertion.file
                - text: is provided, all other
                - code [ref=e1000]: sasl.oauthbearer.assertion.
                - text: "* configurations are ignored."
              - paragraph
              - table [ref=e1001]:
                - rowgroup [ref=e1002]:
                  - row [ref=e1003]:
                    - rowheader "Type:" [ref=e1004]
                    - cell "string" [ref=e1005]
                  - row [ref=e1006]:
                    - rowheader "Default:" [ref=e1007]
                    - cell "null" [ref=e1008]
                  - row [ref=e1009]:
                    - columnheader "Valid Values:" [ref=e1010]
                    - cell [ref=e1011]
                  - row [ref=e1012]:
                    - rowheader "Importance:" [ref=e1013]
                    - cell "medium" [ref=e1014]
            - listitem [ref=e1015]:
              - heading [level=4] [ref=e1016]:
                - link "sasl.oauthbearer.assertion.private.key.file" [ref=e1017] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.assertion.private.key.file"
              - paragraph
              - paragraph [ref=e1018]: File that contains a private key in the standard PEM format which is used to sign the JWT assertion sent to the identity provider.
              - paragraph [ref=e1019]: The underlying implementation caches the file contents to avoid the performance hit of loading the file on each access. The caching mechanism will detect when the file changes to allow for the file to be reloaded on modifications. This allows for "live" private key rotation without restarting the Kafka client.
              - paragraph [ref=e1020]:
                - emphasis [ref=e1021]: Note
                - text: ": If a value for"
                - code [ref=e1022]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1023]:
                - rowgroup [ref=e1024]:
                  - row [ref=e1025]:
                    - rowheader "Type:" [ref=e1026]
                    - cell "string" [ref=e1027]
                  - row [ref=e1028]:
                    - rowheader "Default:" [ref=e1029]
                    - cell "null" [ref=e1030]
                  - row [ref=e1031]:
                    - columnheader "Valid Values:" [ref=e1032]
                    - cell [ref=e1033]
                  - row [ref=e1034]:
                    - rowheader "Importance:" [ref=e1035]
                    - cell "medium" [ref=e1036]
            - listitem [ref=e1037]:
              - heading [level=4] [ref=e1038]:
                - link "sasl.oauthbearer.assertion.private.key.passphrase" [ref=e1039] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.assertion.private.key.passphrase"
              - paragraph
              - paragraph [ref=e1040]:
                - text: The optional passphrase to decrypt the private key file specified by
                - code [ref=e1041]: sasl.oauthbearer.assertion.private.key.file
                - text: .
              - paragraph [ref=e1042]:
                - emphasis [ref=e1043]: Note
                - text: ": If the file referred to by"
                - code [ref=e1044]: sasl.oauthbearer.assertion.private.key.file
                - text: is modified on the file system at runtime and it was created with a
                - emphasis [ref=e1045]: different
                - text: passphrase than it was previously, the client will not be able to access the private key file because the passphrase is now out of date. For that reason, when using private key passphrases, either use the same passphrase each time, or—for improved security—restart the Kafka client using the new passphrase configuration.
              - paragraph [ref=e1046]:
                - emphasis [ref=e1047]: Note
                - text: ": If a value for"
                - code [ref=e1048]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1049]:
                - rowgroup [ref=e1050]:
                  - row [ref=e1051]:
                    - rowheader "Type:" [ref=e1052]
                    - cell "password" [ref=e1053]
                  - row [ref=e1054]:
                    - rowheader "Default:" [ref=e1055]
                    - cell "null" [ref=e1056]
                  - row [ref=e1057]:
                    - columnheader "Valid Values:" [ref=e1058]
                    - cell [ref=e1059]
                  - row [ref=e1060]:
                    - rowheader "Importance:" [ref=e1061]
                    - cell "medium" [ref=e1062]
            - listitem [ref=e1063]:
              - heading [level=4] [ref=e1064]:
                - link "sasl.oauthbearer.assertion.template.file" [ref=e1065] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.assertion.template.file"
              - paragraph
              - paragraph [ref=e1066]: This optional configuration specifies the file containing the JWT headers and/or payload claims to be used when creating the JWT assertion.
              - paragraph [ref=e1067]: Not all identity providers require the same set of claims; some may require a given claim while others may prohibit it. In order to provide the most flexibility, this configuration allows the user to provide the static header values and claims that are to be included in the JWT.
              - paragraph [ref=e1068]:
                - emphasis [ref=e1069]: Note
                - text: ": If a value for"
                - code [ref=e1070]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1071]:
                - rowgroup [ref=e1072]:
                  - row [ref=e1073]:
                    - rowheader "Type:" [ref=e1074]
                    - cell "string" [ref=e1075]
                  - row [ref=e1076]:
                    - rowheader "Default:" [ref=e1077]
                    - cell "null" [ref=e1078]
                  - row [ref=e1079]:
                    - columnheader "Valid Values:" [ref=e1080]
                    - cell [ref=e1081]
                  - row [ref=e1082]:
                    - rowheader "Importance:" [ref=e1083]
                    - cell "medium" [ref=e1084]
            - listitem [ref=e1085]:
              - heading [level=4] [ref=e1086]:
                - link "sasl.oauthbearer.client.credentials.client.id" [ref=e1087] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.client.credentials.client.id"
              - paragraph
              - paragraph [ref=e1088]: The ID (defined in/by the OAuth identity provider) to identify the client requesting the token.
              - paragraph [ref=e1089]:
                - text: The client ID was previously stored as part of the
                - code [ref=e1090]: sasl.jaas.config
                - text: configuration with the key
                - code [ref=e1091]: clientId
                - text: . For backward compatibility, the
                - code [ref=e1092]: clientId
                - text: JAAS option can still be used, but it is deprecated and will be removed in a future version.
              - paragraph [ref=e1093]: "Order of precedence:"
              - list [ref=e1094]:
                - listitem [ref=e1095]:
                  - code [ref=e1096]: sasl.oauthbearer.client.credentials.client.id
                  - text: from configuration
                - listitem [ref=e1097]:
                  - code [ref=e1098]: clientId
                  - text: from JAAS
              - paragraph
              - table [ref=e1099]:
                - rowgroup [ref=e1100]:
                  - row [ref=e1101]:
                    - rowheader "Type:" [ref=e1102]
                    - cell "string" [ref=e1103]
                  - row [ref=e1104]:
                    - rowheader "Default:" [ref=e1105]
                    - cell "null" [ref=e1106]
                  - row [ref=e1107]:
                    - columnheader "Valid Values:" [ref=e1108]
                    - cell [ref=e1109]
                  - row [ref=e1110]:
                    - rowheader "Importance:" [ref=e1111]
                    - cell "medium" [ref=e1112]
            - listitem [ref=e1113]:
              - heading [level=4] [ref=e1114]:
                - link "sasl.oauthbearer.client.credentials.client.secret" [ref=e1115] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.client.credentials.client.secret"
              - paragraph
              - paragraph [ref=e1116]: The secret (defined by either the user or preassigned, depending on the identity provider) of the client requesting the token.
              - paragraph [ref=e1117]:
                - text: The client secret was previously stored as part of the
                - code [ref=e1118]: sasl.jaas.config
                - text: configuration with the key
                - code [ref=e1119]: clientSecret
                - text: . For backward compatibility, the
                - code [ref=e1120]: clientSecret
                - text: JAAS option can still be used, but it is deprecated and will be removed in a future version.
              - paragraph [ref=e1121]: "Order of precedence:"
              - list [ref=e1122]:
                - listitem [ref=e1123]:
                  - code [ref=e1124]: sasl.oauthbearer.client.credentials.client.secret
                  - text: from configuration
                - listitem [ref=e1125]:
                  - code [ref=e1126]: clientSecret
                  - text: from JAAS
              - paragraph
              - table [ref=e1127]:
                - rowgroup [ref=e1128]:
                  - row [ref=e1129]:
                    - rowheader "Type:" [ref=e1130]
                    - cell "password" [ref=e1131]
                  - row [ref=e1132]:
                    - rowheader "Default:" [ref=e1133]
                    - cell "null" [ref=e1134]
                  - row [ref=e1135]:
                    - columnheader "Valid Values:" [ref=e1136]
                    - cell [ref=e1137]
                  - row [ref=e1138]:
                    - rowheader "Importance:" [ref=e1139]
                    - cell "medium" [ref=e1140]
            - listitem [ref=e1141]:
              - heading [level=4] [ref=e1142]:
                - link "sasl.oauthbearer.jwks.endpoint.url" [ref=e1143] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.jwks.endpoint.url"
              - paragraph [ref=e1144]:
                - text: The OAuth/OIDC provider URL from which the provider's
                - link "JWKS (JSON Web Key Set)" [ref=e1145] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc7517#section-5
                - text: can be retrieved. The URL can be HTTP(S)-based or file-based. If the URL is HTTP(S)-based, the JWKS data will be retrieved from the OAuth/OIDC provider via the configured URL on broker startup. All then-current keys will be cached on the broker for incoming requests. If an authentication request is received for a JWT that includes a "kid" header claim value that isn't yet in the cache, the JWKS endpoint will be queried again on demand. However, the broker polls the URL every sasl.oauthbearer.jwks.endpoint.refresh.ms milliseconds to refresh the cache with any forthcoming keys before any JWT requests that include them are received. If the URL is file-based, the broker will load the JWKS file from a configured location on startup. In the event that the JWT includes a "kid" header value that isn't in the JWKS file, the broker will reject the JWT and authentication will fail.
              - table [ref=e1146]:
                - rowgroup [ref=e1147]:
                  - row [ref=e1148]:
                    - rowheader "Type:" [ref=e1149]
                    - cell "string" [ref=e1150]
                  - row [ref=e1151]:
                    - rowheader "Default:" [ref=e1152]
                    - cell "null" [ref=e1153]
                  - row [ref=e1154]:
                    - columnheader "Valid Values:" [ref=e1155]
                    - cell [ref=e1156]
                  - row [ref=e1157]:
                    - rowheader "Importance:" [ref=e1158]
                    - cell "medium" [ref=e1159]
            - listitem [ref=e1160]:
              - heading [level=4] [ref=e1161]:
                - link "sasl.oauthbearer.jwt.retriever.class" [ref=e1162] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.jwt.retriever.class"
              - paragraph
              - paragraph [ref=e1163]:
                - text: The fully-qualified class name of a
                - code [ref=e1164]: JwtRetriever
                - text: implementation used to request tokens from the identity provider.
              - paragraph [ref=e1165]: The default configuration value represents a class that maintains backward compatibility with previous versions of Apache Kafka. The default implementation uses the configuration to determine which concrete implementation to create.
              - paragraph [ref=e1166]: "Other implementations that are provided include:"
              - list [ref=e1167]:
                - listitem [ref=e1168]:
                  - code [ref=e1169]: org.apache.kafka.common.security.oauthbearer.ClientCredentialsJwtRetriever
                - listitem [ref=e1170]:
                  - code [ref=e1171]: org.apache.kafka.common.security.oauthbearer.DefaultJwtRetriever
                - listitem [ref=e1172]:
                  - code [ref=e1173]: org.apache.kafka.common.security.oauthbearer.FileJwtRetriever
                - listitem [ref=e1174]:
                  - code [ref=e1175]: org.apache.kafka.common.security.oauthbearer.JwtBearerJwtRetriever
              - paragraph
              - table [ref=e1176]:
                - rowgroup [ref=e1177]:
                  - row [ref=e1178]:
                    - rowheader "Type:" [ref=e1179]
                    - cell "class" [ref=e1180]
                  - row [ref=e1181]:
                    - rowheader "Default:" [ref=e1182]
                    - cell "org.apache.kafka.common.security.oauthbearer.DefaultJwtRetriever" [ref=e1183]
                  - row [ref=e1184]:
                    - columnheader "Valid Values:" [ref=e1185]
                    - cell [ref=e1186]
                  - row [ref=e1187]:
                    - rowheader "Importance:" [ref=e1188]
                    - cell "medium" [ref=e1189]
            - listitem [ref=e1190]:
              - heading [level=4] [ref=e1191]:
                - link "sasl.oauthbearer.jwt.validator.class" [ref=e1192] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.jwt.validator.class"
              - paragraph
              - paragraph [ref=e1193]:
                - text: The fully-qualified class name of a
                - code [ref=e1194]: JwtValidator
                - text: implementation used to validate the JWT from the identity provider.
              - paragraph [ref=e1195]:
                - text: The default validator (
                - code [ref=e1196]: org.apache.kafka.common.security.oauthbearer.DefaultJwtValidator
                - text: ) maintains backward compatibility with previous versions of Apache Kafka. The default validator uses configuration to determine which concrete implementation to create.
              - paragraph [ref=e1197]:
                - text: The built-in
                - code [ref=e1198]: JwtValidator
                - text: "implementations are:"
              - list [ref=e1199]:
                - listitem [ref=e1200]:
                  - code [ref=e1201]: org.apache.kafka.common.security.oauthbearer.BrokerJwtValidator
                - listitem [ref=e1202]:
                  - code [ref=e1203]: org.apache.kafka.common.security.oauthbearer.ClientJwtValidator
                - listitem [ref=e1204]:
                  - code [ref=e1205]: org.apache.kafka.common.security.oauthbearer.DefaultJwtValidator
              - paragraph
              - table [ref=e1206]:
                - rowgroup [ref=e1207]:
                  - row [ref=e1208]:
                    - rowheader "Type:" [ref=e1209]
                    - cell "class" [ref=e1210]
                  - row [ref=e1211]:
                    - rowheader "Default:" [ref=e1212]
                    - cell "org.apache.kafka.common.security.oauthbearer.DefaultJwtValidator" [ref=e1213]
                  - row [ref=e1214]:
                    - columnheader "Valid Values:" [ref=e1215]
                    - cell [ref=e1216]
                  - row [ref=e1217]:
                    - rowheader "Importance:" [ref=e1218]
                    - cell "medium" [ref=e1219]
            - listitem [ref=e1220]:
              - heading [level=4] [ref=e1221]:
                - link "sasl.oauthbearer.scope" [ref=e1222] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.scope"
              - paragraph
              - paragraph [ref=e1223]: This is the level of access a client application is granted to a resource or API which is included in the token request. If provided, it should match one or more scopes configured in the identity provider.
              - paragraph [ref=e1224]:
                - text: The scope was previously stored as part of the
                - code [ref=e1225]: sasl.jaas.config
                - text: configuration with the key
                - code [ref=e1226]: scope
                - text: . For backward compatibility, the
                - code [ref=e1227]: scope
                - text: JAAS option can still be used, but it is deprecated and will be removed in a future version.
              - paragraph [ref=e1228]: "Order of precedence:"
              - list [ref=e1229]:
                - listitem [ref=e1230]:
                  - code [ref=e1231]: sasl.oauthbearer.scope
                  - text: from configuration
                - listitem [ref=e1232]:
                  - code [ref=e1233]: scope
                  - text: from JAAS
              - paragraph
              - table [ref=e1234]:
                - rowgroup [ref=e1235]:
                  - row [ref=e1236]:
                    - rowheader "Type:" [ref=e1237]
                    - cell "string" [ref=e1238]
                  - row [ref=e1239]:
                    - rowheader "Default:" [ref=e1240]
                    - cell "null" [ref=e1241]
                  - row [ref=e1242]:
                    - columnheader "Valid Values:" [ref=e1243]
                    - cell [ref=e1244]
                  - row [ref=e1245]:
                    - rowheader "Importance:" [ref=e1246]
                    - cell "medium" [ref=e1247]
            - listitem [ref=e1248]:
              - heading [level=4] [ref=e1249]:
                - link "sasl.oauthbearer.token.endpoint.url" [ref=e1250] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.token.endpoint.url"
              - paragraph [ref=e1251]:
                - text: The URL for the OAuth/OIDC identity provider. If the URL is HTTP(S)-based, it is the issuer's token endpoint URL to which requests will be made to login based on the configuration in
                - code [ref=e1252]: sasl.oauthbearer.jwt.retriever.class
                - text: . If the URL is file-based, it specifies a file containing an access token (in JWT serialized form) issued by the OAuth/OIDC identity provider to use for authorization.
              - table [ref=e1253]:
                - rowgroup [ref=e1254]:
                  - row [ref=e1255]:
                    - rowheader "Type:" [ref=e1256]
                    - cell "string" [ref=e1257]
                  - row [ref=e1258]:
                    - rowheader "Default:" [ref=e1259]
                    - cell "null" [ref=e1260]
                  - row [ref=e1261]:
                    - columnheader "Valid Values:" [ref=e1262]
                    - cell [ref=e1263]
                  - row [ref=e1264]:
                    - rowheader "Importance:" [ref=e1265]
                    - cell "medium" [ref=e1266]
            - listitem [ref=e1267]:
              - heading [level=4] [ref=e1268]:
                - link "security.protocol" [ref=e1269] [cursor=pointer]:
                  - /url: "#producerconfigs_security.protocol"
              - paragraph [ref=e1270]: Protocol used to communicate with brokers.
              - table [ref=e1271]:
                - rowgroup [ref=e1272]:
                  - row [ref=e1273]:
                    - rowheader "Type:" [ref=e1274]
                    - cell "string" [ref=e1275]
                  - row [ref=e1276]:
                    - rowheader "Default:" [ref=e1277]
                    - cell "PLAINTEXT" [ref=e1278]
                  - row [ref=e1279]:
                    - rowheader "Valid Values:" [ref=e1280]
                    - cell "(case insensitive) [SASL_SSL, PLAINTEXT, SSL, SASL_PLAINTEXT]" [ref=e1281]
                  - row [ref=e1282]:
                    - rowheader "Importance:" [ref=e1283]
                    - cell "medium" [ref=e1284]
            - listitem [ref=e1285]:
              - heading [level=4] [ref=e1286]:
                - link "send.buffer.bytes" [ref=e1287] [cursor=pointer]:
                  - /url: "#producerconfigs_send.buffer.bytes"
              - paragraph [ref=e1288]: The size of the TCP send buffer (SO_SNDBUF) to use when sending data. If the value is -1, the OS default will be used.
              - table [ref=e1289]:
                - rowgroup [ref=e1290]:
                  - row [ref=e1291]:
                    - rowheader "Type:" [ref=e1292]
                    - cell "int" [ref=e1293]
                  - row [ref=e1294]:
                    - rowheader "Default:" [ref=e1295]
                    - cell "131072 (128 kibibytes)" [ref=e1296]
                  - row [ref=e1297]:
                    - rowheader "Valid Values:" [ref=e1298]
                    - cell "[-1,...]" [ref=e1299]
                  - row [ref=e1300]:
                    - rowheader "Importance:" [ref=e1301]
                    - cell "medium" [ref=e1302]
            - listitem [ref=e1303]:
              - heading [level=4] [ref=e1304]:
                - link "socket.connection.setup.timeout.max.ms" [ref=e1305] [cursor=pointer]:
                  - /url: "#producerconfigs_socket.connection.setup.timeout.max.ms"
              - paragraph [ref=e1306]: The maximum amount of time the client will wait for the socket connection to be established. The connection setup timeout will increase exponentially for each consecutive connection failure up to this maximum. To avoid connection storms, a randomization factor of 0.2 will be applied to the timeout resulting in a random range between 20% below and 20% above the computed value.
              - table [ref=e1307]:
                - rowgroup [ref=e1308]:
                  - row [ref=e1309]:
                    - rowheader "Type:" [ref=e1310]
                    - cell "long" [ref=e1311]
                  - row [ref=e1312]:
                    - rowheader "Default:" [ref=e1313]
                    - cell "30000 (30 seconds)" [ref=e1314]
                  - row [ref=e1315]:
                    - columnheader "Valid Values:" [ref=e1316]
                    - cell [ref=e1317]
                  - row [ref=e1318]:
                    - rowheader "Importance:" [ref=e1319]
                    - cell "medium" [ref=e1320]
            - listitem [ref=e1321]:
              - heading [level=4] [ref=e1322]:
                - link "socket.connection.setup.timeout.ms" [ref=e1323] [cursor=pointer]:
                  - /url: "#producerconfigs_socket.connection.setup.timeout.ms"
              - paragraph [ref=e1324]:
                - text: The amount of time the client will wait for the socket connection to be established. If the connection is not built before the timeout elapses, clients will close the socket channel. This value is the initial backoff value and will increase exponentially for each consecutive connection failure, up to the
                - code [ref=e1325]: socket.connection.setup.timeout.max.ms
                - text: value.
              - table [ref=e1326]:
                - rowgroup [ref=e1327]:
                  - row [ref=e1328]:
                    - rowheader "Type:" [ref=e1329]
                    - cell "long" [ref=e1330]
                  - row [ref=e1331]:
                    - rowheader "Default:" [ref=e1332]
                    - cell "10000 (10 seconds)" [ref=e1333]
                  - row [ref=e1334]:
                    - columnheader "Valid Values:" [ref=e1335]
                    - cell [ref=e1336]
                  - row [ref=e1337]:
                    - rowheader "Importance:" [ref=e1338]
                    - cell "medium" [ref=e1339]
            - listitem [ref=e1340]:
              - heading [level=4] [ref=e1341]:
                - link "ssl.enabled.protocols" [ref=e1342] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.enabled.protocols"
              - paragraph [ref=e1343]:
                - text: The list of protocols enabled for SSL connections. The default is 'TLSv1.2,TLSv1.3'. This means that clients and servers will prefer TLSv1.3 if both support it and fallback to TLSv1.2 otherwise (assuming both support at least TLSv1.2). This default should be fine for most use cases. If this configuration is set to an empty list, Kafka will use the protocols enabled by default in the underlying SSLEngine, which may include additional protocols depending on the JVM version. Also see the config documentation for
                - code [ref=e1344]: ssl.protocol
                - text: to understand how it can impact the TLS version negotiation behavior.
              - table [ref=e1345]:
                - rowgroup [ref=e1346]:
                  - row [ref=e1347]:
                    - rowheader "Type:" [ref=e1348]
                    - cell "list" [ref=e1349]
                  - row [ref=e1350]:
                    - rowheader "Default:" [ref=e1351]
                    - cell "TLSv1.2,TLSv1.3" [ref=e1352]
                  - row [ref=e1353]:
                    - columnheader "Valid Values:" [ref=e1354]
                    - cell [ref=e1355]
                  - row [ref=e1356]:
                    - rowheader "Importance:" [ref=e1357]
                    - cell "medium" [ref=e1358]
            - listitem [ref=e1359]:
              - heading [level=4] [ref=e1360]:
                - link "ssl.keystore.type" [ref=e1361] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.keystore.type"
              - paragraph [ref=e1362]:
                - text: The file format of the key store file. This is optional for client. The values currently supported by the default
                - code [ref=e1363]: ssl.engine.factory.class
                - text: are [JKS, PKCS12, PEM].
              - table [ref=e1364]:
                - rowgroup [ref=e1365]:
                  - row [ref=e1366]:
                    - rowheader "Type:" [ref=e1367]
                    - cell "string" [ref=e1368]
                  - row [ref=e1369]:
                    - rowheader "Default:" [ref=e1370]
                    - cell "JKS" [ref=e1371]
                  - row [ref=e1372]:
                    - columnheader "Valid Values:" [ref=e1373]
                    - cell [ref=e1374]
                  - row [ref=e1375]:
                    - rowheader "Importance:" [ref=e1376]
                    - cell "medium" [ref=e1377]
            - listitem [ref=e1378]:
              - heading [level=4] [ref=e1379]:
                - link "ssl.protocol" [ref=e1380] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.protocol"
              - paragraph [ref=e1381]:
                - text: The SSL protocol used to generate the SSLContext. The default is 'TLSv1.3', which should be fine for most use cases. A typical alternative to the default is 'TLSv1.2'. Allowed values for this config are dependent on the JVM. Clients using the defaults for this config and 'ssl.enabled.protocols' will downgrade to 'TLSv1.2' if the server does not support 'TLSv1.3'. If this config is set to 'TLSv1.2', however, clients will not use 'TLSv1.3' even if it is one of the values in
                - code [ref=e1382]: ssl.enabled.protocols
                - text: and the server only supports 'TLSv1.3'.
              - table [ref=e1383]:
                - rowgroup [ref=e1384]:
                  - row [ref=e1385]:
                    - rowheader "Type:" [ref=e1386]
                    - cell "string" [ref=e1387]
                  - row [ref=e1388]:
                    - rowheader "Default:" [ref=e1389]
                    - cell "TLSv1.3" [ref=e1390]
                  - row [ref=e1391]:
                    - columnheader "Valid Values:" [ref=e1392]
                    - cell [ref=e1393]
                  - row [ref=e1394]:
                    - rowheader "Importance:" [ref=e1395]
                    - cell "medium" [ref=e1396]
            - listitem [ref=e1397]:
              - heading [level=4] [ref=e1398]:
                - link "ssl.provider" [ref=e1399] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.provider"
              - paragraph [ref=e1400]: The name of the security provider used for SSL connections. Default value is the default security provider of the JVM.
              - table [ref=e1401]:
                - rowgroup [ref=e1402]:
                  - row [ref=e1403]:
                    - rowheader "Type:" [ref=e1404]
                    - cell "string" [ref=e1405]
                  - row [ref=e1406]:
                    - rowheader "Default:" [ref=e1407]
                    - cell "null" [ref=e1408]
                  - row [ref=e1409]:
                    - columnheader "Valid Values:" [ref=e1410]
                    - cell [ref=e1411]
                  - row [ref=e1412]:
                    - rowheader "Importance:" [ref=e1413]
                    - cell "medium" [ref=e1414]
            - listitem [ref=e1415]:
              - heading [level=4] [ref=e1416]:
                - link "ssl.truststore.type" [ref=e1417] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.truststore.type"
              - paragraph [ref=e1418]:
                - text: The file format of the trust store file. The values currently supported by the default
                - code [ref=e1419]: ssl.engine.factory.class
                - text: are [JKS, PKCS12, PEM].
              - table [ref=e1420]:
                - rowgroup [ref=e1421]:
                  - row [ref=e1422]:
                    - rowheader "Type:" [ref=e1423]
                    - cell "string" [ref=e1424]
                  - row [ref=e1425]:
                    - rowheader "Default:" [ref=e1426]
                    - cell "JKS" [ref=e1427]
                  - row [ref=e1428]:
                    - columnheader "Valid Values:" [ref=e1429]
                    - cell [ref=e1430]
                  - row [ref=e1431]:
                    - rowheader "Importance:" [ref=e1432]
                    - cell "medium" [ref=e1433]
            - listitem [ref=e1434]:
              - heading [level=4] [ref=e1435]:
                - link "acks" [ref=e1436] [cursor=pointer]:
                  - /url: "#producerconfigs_acks"
              - paragraph [ref=e1437]: "The number of acknowledgments the producer requires the leader to have received before considering a request complete. This controls the durability of records that are sent. The following settings are allowed:"
              - list [ref=e1438]:
                - listitem [ref=e1439]:
                  - code [ref=e1440]: acks=0
                  - text: If set to zero then the producer will not wait for any acknowledgment from the server at all. The record will be immediately added to the socket buffer and considered sent. No guarantee can be made that the server has received the record in this case, and the
                  - code [ref=e1441]: retries
                  - text: configuration will not take effect (as the client won't generally know of any failures). The offset given back for each record will always be set to
                  - code [ref=e1442]: "-1"
                  - text: .
                - listitem [ref=e1443]:
                  - code [ref=e1444]: acks=1
                  - text: This will mean the leader will write the record to its local log but will respond without awaiting full acknowledgement from all followers. In this case should the leader fail immediately after acknowledging the record but before the followers have replicated it then the record will be lost.
                - listitem [ref=e1445]:
                  - code [ref=e1446]: acks=all
                  - text: This means the leader will wait for the full set of in-sync replicas to acknowledge the record. This guarantees that the record will not be lost as long as at least one in-sync replica remains alive. This is the strongest available guarantee. This is equivalent to the acks=-1 setting.
              - paragraph [ref=e1447]: Note that enabling idempotence requires this config value to be 'all'. If conflicting configurations are set and idempotence is not explicitly enabled, idempotence is disabled.
              - table [ref=e1448]:
                - rowgroup [ref=e1449]:
                  - row [ref=e1450]:
                    - rowheader "Type:" [ref=e1451]
                    - cell "string" [ref=e1452]
                  - row [ref=e1453]:
                    - rowheader "Default:" [ref=e1454]
                    - cell "all" [ref=e1455]
                  - row [ref=e1456]:
                    - rowheader "Valid Values:" [ref=e1457]
                    - cell "[all, -1, 0, 1]" [ref=e1458]
                  - row [ref=e1459]:
                    - rowheader "Importance:" [ref=e1460]
                    - cell "low" [ref=e1461]
            - listitem [ref=e1462]:
              - heading [level=4] [ref=e1463]:
                - link "config.providers" [ref=e1464] [cursor=pointer]:
                  - /url: "#producerconfigs_config.providers"
              - paragraph [ref=e1465]:
                - text: Comma-separated alias names for classes implementing the
                - code [ref=e1466]: ConfigProvider
                - text: interface. This enables loading configuration data (such as passwords, API keys, and other credentials) from external sources. For example, see
                - link "Configuration Providers" [ref=e1467] [cursor=pointer]:
                  - /url: https://kafka.apache.org/documentation/#config_providers
                - text: .
              - table [ref=e1468]:
                - rowgroup [ref=e1469]:
                  - row [ref=e1470]:
                    - rowheader "Type:" [ref=e1471]
                    - cell "list" [ref=e1472]
                  - row [ref=e1473]:
                    - rowheader "Default:" [ref=e1474]
                    - cell "\"\"" [ref=e1475]
                  - row [ref=e1476]:
                    - columnheader "Valid Values:" [ref=e1477]
                    - cell [ref=e1478]
                  - row [ref=e1479]:
                    - rowheader "Importance:" [ref=e1480]
                    - cell "low" [ref=e1481]
            - listitem [ref=e1482]:
              - heading [level=4] [ref=e1483]:
                - link "enable.idempotence" [ref=e1484] [cursor=pointer]:
                  - /url: "#producerconfigs_enable.idempotence"
              - paragraph [ref=e1485]:
                - text: When set to 'true', the producer will ensure that exactly one copy of each message is written in the stream. If 'false', producer retries due to broker failures, etc., may write duplicates of the retried message in the stream. Note that enabling idempotence requires
                - code [ref=e1486]: max.in.flight.requests.per.connection
                - text: to be less than or equal to 5 (with message ordering preserved for any allowable value),
                - code [ref=e1487]: retries
                - text: to be greater than 0, and
                - code [ref=e1488]: acks
                - text: must be 'all'.
              - paragraph [ref=e1489]:
                - text: Idempotence is enabled by default if no conflicting configurations are set. If conflicting configurations are set and idempotence is not explicitly enabled, idempotence is disabled. If idempotence is explicitly enabled and conflicting configurations are set, a
                - code [ref=e1490]: ConfigException
                - text: is thrown.
              - table [ref=e1491]:
                - rowgroup [ref=e1492]:
                  - row [ref=e1493]:
                    - rowheader "Type:" [ref=e1494]
                    - cell "boolean" [ref=e1495]
                  - row [ref=e1496]:
                    - rowheader "Default:" [ref=e1497]
                    - cell "true" [ref=e1498]
                  - row [ref=e1499]:
                    - columnheader "Valid Values:" [ref=e1500]
                    - cell [ref=e1501]
                  - row [ref=e1502]:
                    - rowheader "Importance:" [ref=e1503]
                    - cell "low" [ref=e1504]
            - listitem [ref=e1505]:
              - heading [level=4] [ref=e1506]:
                - link "enable.metrics.push" [ref=e1507] [cursor=pointer]:
                  - /url: "#producerconfigs_enable.metrics.push"
              - paragraph [ref=e1508]: Whether to enable pushing of client metrics to the cluster, if the cluster has a client metrics subscription which matches this client.
              - table [ref=e1509]:
                - rowgroup [ref=e1510]:
                  - row [ref=e1511]:
                    - rowheader "Type:" [ref=e1512]
                    - cell "boolean" [ref=e1513]
                  - row [ref=e1514]:
                    - rowheader "Default:" [ref=e1515]
                    - cell "true" [ref=e1516]
                  - row [ref=e1517]:
                    - columnheader "Valid Values:" [ref=e1518]
                    - cell [ref=e1519]
                  - row [ref=e1520]:
                    - rowheader "Importance:" [ref=e1521]
                    - cell "low" [ref=e1522]
            - listitem [ref=e1523]:
              - heading [level=4] [ref=e1524]:
                - link "interceptor.classes" [ref=e1525] [cursor=pointer]:
                  - /url: "#producerconfigs_interceptor.classes"
              - paragraph [ref=e1526]:
                - text: A list of classes to use as interceptors. Implementing the
                - code [ref=e1527]: org.apache.kafka.clients.producer.ProducerInterceptor
                - text: interface allows you to intercept (and possibly mutate) the records received by the producer before they are published to the Kafka cluster. By default, there are no interceptors.
              - table [ref=e1528]:
                - rowgroup [ref=e1529]:
                  - row [ref=e1530]:
                    - rowheader "Type:" [ref=e1531]
                    - cell "list" [ref=e1532]
                  - row [ref=e1533]:
                    - rowheader "Default:" [ref=e1534]
                    - cell "\"\"" [ref=e1535]
                  - row [ref=e1536]:
                    - columnheader "Valid Values:" [ref=e1537]
                    - cell [ref=e1538]
                  - row [ref=e1539]:
                    - rowheader "Importance:" [ref=e1540]
                    - cell "low" [ref=e1541]
            - listitem [ref=e1542]:
              - heading [level=4] [ref=e1543]:
                - link "max.in.flight.requests.per.connection" [ref=e1544] [cursor=pointer]:
                  - /url: "#producerconfigs_max.in.flight.requests.per.connection"
              - paragraph [ref=e1545]:
                - text: The maximum number of unacknowledged requests the client will send on a single connection before blocking. Note that if this configuration is set to be greater than 1 and
                - code [ref=e1546]: enable.idempotence
                - text: is set to false, there is a risk of message reordering after a failed send due to retries (i.e., if retries are enabled); if retries are disabled or if
                - code [ref=e1547]: enable.idempotence
                - text: is set to true, ordering will be preserved. Additionally, enabling idempotence requires the value of this configuration to be less than or equal to 5, because broker only retains at most 5 batches for each producer. If the value is more than 5, previous batches may be removed on broker side.
              - table [ref=e1548]:
                - rowgroup [ref=e1549]:
                  - row [ref=e1550]:
                    - rowheader "Type:" [ref=e1551]
                    - cell "int" [ref=e1552]
                  - row [ref=e1553]:
                    - rowheader "Default:" [ref=e1554]
                    - cell "5" [ref=e1555]
                  - row [ref=e1556]:
                    - rowheader "Valid Values:" [ref=e1557]
                    - cell "[1,...]" [ref=e1558]
                  - row [ref=e1559]:
                    - rowheader "Importance:" [ref=e1560]
                    - cell "low" [ref=e1561]
            - listitem [ref=e1562]:
              - heading [level=4] [ref=e1563]:
                - link "metadata.max.age.ms" [ref=e1564] [cursor=pointer]:
                  - /url: "#producerconfigs_metadata.max.age.ms"
              - paragraph [ref=e1565]: The period of time in milliseconds after which we force a refresh of metadata even if we haven't seen any partition leadership changes to proactively discover any new brokers or partitions.
              - table [ref=e1566]:
                - rowgroup [ref=e1567]:
                  - row [ref=e1568]:
                    - rowheader "Type:" [ref=e1569]
                    - cell "long" [ref=e1570]
                  - row [ref=e1571]:
                    - rowheader "Default:" [ref=e1572]
                    - cell "300000 (5 minutes)" [ref=e1573]
                  - row [ref=e1574]:
                    - rowheader "Valid Values:" [ref=e1575]
                    - cell "[0,...]" [ref=e1576]
                  - row [ref=e1577]:
                    - rowheader "Importance:" [ref=e1578]
                    - cell "low" [ref=e1579]
            - listitem [ref=e1580]:
              - heading [level=4] [ref=e1581]:
                - link "metadata.max.idle.ms" [ref=e1582] [cursor=pointer]:
                  - /url: "#producerconfigs_metadata.max.idle.ms"
              - paragraph [ref=e1583]: Controls how long the producer will cache metadata for a topic that's idle. If the elapsed time since a topic was last produced to exceeds the metadata idle duration, then the topic's metadata is forgotten and the next access to it will force a metadata fetch request.
              - table [ref=e1584]:
                - rowgroup [ref=e1585]:
                  - row [ref=e1586]:
                    - rowheader "Type:" [ref=e1587]
                    - cell "long" [ref=e1588]
                  - row [ref=e1589]:
                    - rowheader "Default:" [ref=e1590]
                    - cell "300000 (5 minutes)" [ref=e1591]
                  - row [ref=e1592]:
                    - rowheader "Valid Values:" [ref=e1593]
                    - cell "[5000,...]" [ref=e1594]
                  - row [ref=e1595]:
                    - rowheader "Importance:" [ref=e1596]
                    - cell "low" [ref=e1597]
            - listitem [ref=e1598]:
              - heading [level=4] [ref=e1599]:
                - link "metadata.recovery.rebootstrap.trigger.ms" [ref=e1600] [cursor=pointer]:
                  - /url: "#producerconfigs_metadata.recovery.rebootstrap.trigger.ms"
              - paragraph [ref=e1601]:
                - text: If a client configured to rebootstrap using
                - code [ref=e1602]: metadata.recovery.strategy=rebootstrap
                - text: is unable to obtain metadata from any of the brokers in the last known metadata for this interval, client repeats the bootstrap process using
                - code [ref=e1603]: bootstrap.servers
                - text: configuration.
              - table [ref=e1604]:
                - rowgroup [ref=e1605]:
                  - row [ref=e1606]:
                    - rowheader "Type:" [ref=e1607]
                    - cell "long" [ref=e1608]
                  - row [ref=e1609]:
                    - rowheader "Default:" [ref=e1610]
                    - cell "300000 (5 minutes)" [ref=e1611]
                  - row [ref=e1612]:
                    - rowheader "Valid Values:" [ref=e1613]
                    - cell "[0,...]" [ref=e1614]
                  - row [ref=e1615]:
                    - rowheader "Importance:" [ref=e1616]
                    - cell "low" [ref=e1617]
            - listitem [ref=e1618]:
              - heading [level=4] [ref=e1619]:
                - link "metadata.recovery.strategy" [ref=e1620] [cursor=pointer]:
                  - /url: "#producerconfigs_metadata.recovery.strategy"
              - paragraph [ref=e1621]:
                - text: Controls how the client recovers when none of the brokers known to it is available. If set to
                - code [ref=e1622]: none
                - text: ", the client fails. If set to"
                - code [ref=e1623]: rebootstrap
                - text: ", the client repeats the bootstrap process using"
                - code [ref=e1624]: bootstrap.servers
                - text: . Rebootstrapping is useful when a client communicates with brokers so infrequently that the set of brokers may change entirely before the client refreshes metadata. Metadata recovery is triggered when all last-known brokers appear unavailable simultaneously. Brokers appear unavailable when disconnected and no current retry attempt is in-progress. Consider increasing
                - code [ref=e1625]: reconnect.backoff.ms
                - text: and
                - code [ref=e1626]: reconnect.backoff.max.ms
                - text: and decreasing
                - code [ref=e1627]: socket.connection.setup.timeout.ms
                - text: and
                - code [ref=e1628]: socket.connection.setup.timeout.max.ms
                - text: for the client. Rebootstrap is also triggered if connection cannot be established to any of the brokers for
                - code [ref=e1629]: metadata.recovery.rebootstrap.trigger.ms
                - text: milliseconds or if server requests rebootstrap.
              - table [ref=e1630]:
                - rowgroup [ref=e1631]:
                  - row [ref=e1632]:
                    - rowheader "Type:" [ref=e1633]
                    - cell "string" [ref=e1634]
                  - row [ref=e1635]:
                    - rowheader "Default:" [ref=e1636]
                    - cell "rebootstrap" [ref=e1637]
                  - row [ref=e1638]:
                    - rowheader "Valid Values:" [ref=e1639]
                    - cell "(case insensitive) [REBOOTSTRAP, NONE]" [ref=e1640]
                  - row [ref=e1641]:
                    - rowheader "Importance:" [ref=e1642]
                    - cell "low" [ref=e1643]
            - listitem [ref=e1644]:
              - heading [level=4] [ref=e1645]:
                - link "metric.reporters" [ref=e1646] [cursor=pointer]:
                  - /url: "#producerconfigs_metric.reporters"
              - paragraph [ref=e1647]:
                - text: A list of classes to use as metrics reporters. Implementing the
                - code [ref=e1648]: org.apache.kafka.common.metrics.MetricsReporter
                - text: interface allows plugging in classes that will be notified of new metric creation. When custom reporters are set and
                - code [ref=e1649]: org.apache.kafka.common.metrics.JmxReporter
                - text: is needed, it has to be explicitly added to the list.
              - table [ref=e1650]:
                - rowgroup [ref=e1651]:
                  - row [ref=e1652]:
                    - rowheader "Type:" [ref=e1653]
                    - cell "list" [ref=e1654]
                  - row [ref=e1655]:
                    - rowheader "Default:" [ref=e1656]
                    - cell "org.apache.kafka.common.metrics.JmxReporter" [ref=e1657]
                  - row [ref=e1658]:
                    - columnheader "Valid Values:" [ref=e1659]
                    - cell [ref=e1660]
                  - row [ref=e1661]:
                    - rowheader "Importance:" [ref=e1662]
                    - cell "low" [ref=e1663]
            - listitem [ref=e1664]:
              - heading [level=4] [ref=e1665]:
                - link "metrics.num.samples" [ref=e1666] [cursor=pointer]:
                  - /url: "#producerconfigs_metrics.num.samples"
              - paragraph [ref=e1667]: The number of samples maintained to compute metrics.
              - table [ref=e1668]:
                - rowgroup [ref=e1669]:
                  - row [ref=e1670]:
                    - rowheader "Type:" [ref=e1671]
                    - cell "int" [ref=e1672]
                  - row [ref=e1673]:
                    - rowheader "Default:" [ref=e1674]
                    - cell "2" [ref=e1675]
                  - row [ref=e1676]:
                    - rowheader "Valid Values:" [ref=e1677]
                    - cell "[1,...]" [ref=e1678]
                  - row [ref=e1679]:
                    - rowheader "Importance:" [ref=e1680]
                    - cell "low" [ref=e1681]
            - listitem [ref=e1682]:
              - heading [level=4] [ref=e1683]:
                - link "metrics.recording.level" [ref=e1684] [cursor=pointer]:
                  - /url: "#producerconfigs_metrics.recording.level"
              - paragraph [ref=e1685]: The highest recording level for metrics. It has three levels for recording metrics - info, debug, and trace.INFO level records only essential metrics necessary for monitoring system performance and health. It collects vital data without gathering too much detail, making it suitable for production environments where minimal overhead is desired.DEBUG level records most metrics, providing more detailed information about the system's operation. It's useful for development and testing environments where you need deeper insights to debug and fine-tune the application.TRACE level records all possible metrics, capturing every detail about the system's performance and operation. It's best for controlled environments where in-depth analysis is required, though it can introduce significant overhead.
              - table [ref=e1686]:
                - rowgroup [ref=e1687]:
                  - row [ref=e1688]:
                    - rowheader "Type:" [ref=e1689]
                    - cell "string" [ref=e1690]
                  - row [ref=e1691]:
                    - rowheader "Default:" [ref=e1692]
                    - cell "INFO" [ref=e1693]
                  - row [ref=e1694]:
                    - rowheader "Valid Values:" [ref=e1695]
                    - cell "[INFO, DEBUG, TRACE]" [ref=e1696]
                  - row [ref=e1697]:
                    - rowheader "Importance:" [ref=e1698]
                    - cell "low" [ref=e1699]
            - listitem [ref=e1700]:
              - heading [level=4] [ref=e1701]:
                - link "metrics.sample.window.ms" [ref=e1702] [cursor=pointer]:
                  - /url: "#producerconfigs_metrics.sample.window.ms"
              - paragraph [ref=e1703]: The window of time a metrics sample is computed over.
              - table [ref=e1704]:
                - rowgroup [ref=e1705]:
                  - row [ref=e1706]:
                    - rowheader "Type:" [ref=e1707]
                    - cell "long" [ref=e1708]
                  - row [ref=e1709]:
                    - rowheader "Default:" [ref=e1710]
                    - cell "30000 (30 seconds)" [ref=e1711]
                  - row [ref=e1712]:
                    - rowheader "Valid Values:" [ref=e1713]
                    - cell "[0,...]" [ref=e1714]
                  - row [ref=e1715]:
                    - rowheader "Importance:" [ref=e1716]
                    - cell "low" [ref=e1717]
            - listitem [ref=e1718]:
              - heading [level=4] [ref=e1719]:
                - link "partitioner.adaptive.partitioning.enable" [ref=e1720] [cursor=pointer]:
                  - /url: "#producerconfigs_partitioner.adaptive.partitioning.enable"
              - paragraph [ref=e1721]: "When set to 'true', the producer will try to adapt to broker performance and produce more messages to partitions hosted on faster brokers. If 'false', the producer will try to distribute messages uniformly. Note: this setting has no effect if a custom partitioner is used."
              - table [ref=e1722]:
                - rowgroup [ref=e1723]:
                  - row [ref=e1724]:
                    - rowheader "Type:" [ref=e1725]
                    - cell "boolean" [ref=e1726]
                  - row [ref=e1727]:
                    - rowheader "Default:" [ref=e1728]
                    - cell "true" [ref=e1729]
                  - row [ref=e1730]:
                    - columnheader "Valid Values:" [ref=e1731]
                    - cell [ref=e1732]
                  - row [ref=e1733]:
                    - rowheader "Importance:" [ref=e1734]
                    - cell "low" [ref=e1735]
            - listitem [ref=e1736]:
              - heading [level=4] [ref=e1737]:
                - link "partitioner.availability.timeout.ms" [ref=e1738] [cursor=pointer]:
                  - /url: "#producerconfigs_partitioner.availability.timeout.ms"
              - paragraph [ref=e1739]:
                - text: If a broker cannot process produce requests from a partition for
                - code [ref=e1740]: partitioner.availability.timeout.ms
                - text: "time, the partitioner treats that partition as not available. If the value is 0, this logic is disabled. Note: this setting has no effect if a custom partitioner is used or"
                - code [ref=e1741]: partitioner.adaptive.partitioning.enable
                - text: is set to 'false'.
              - table [ref=e1742]:
                - rowgroup [ref=e1743]:
                  - row [ref=e1744]:
                    - rowheader "Type:" [ref=e1745]
                    - cell "long" [ref=e1746]
                  - row [ref=e1747]:
                    - rowheader "Default:" [ref=e1748]
                    - cell "0" [ref=e1749]
                  - row [ref=e1750]:
                    - rowheader "Valid Values:" [ref=e1751]
                    - cell "[0,...]" [ref=e1752]
                  - row [ref=e1753]:
                    - rowheader "Importance:" [ref=e1754]
                    - cell "low" [ref=e1755]
            - listitem [ref=e1756]:
              - heading [level=4] [ref=e1757]:
                - link "reconnect.backoff.max.ms" [ref=e1758] [cursor=pointer]:
                  - /url: "#producerconfigs_reconnect.backoff.max.ms"
              - paragraph [ref=e1759]: The maximum amount of time in milliseconds to wait when reconnecting to a broker that has repeatedly failed to connect. If provided, the backoff per host will increase exponentially for each consecutive connection failure, up to this maximum. After calculating the backoff increase, 20% random jitter is added to avoid connection storms.
              - table [ref=e1760]:
                - rowgroup [ref=e1761]:
                  - row [ref=e1762]:
                    - rowheader "Type:" [ref=e1763]
                    - cell "long" [ref=e1764]
                  - row [ref=e1765]:
                    - rowheader "Default:" [ref=e1766]
                    - cell "1000 (1 second)" [ref=e1767]
                  - row [ref=e1768]:
                    - rowheader "Valid Values:" [ref=e1769]
                    - cell "[0,...]" [ref=e1770]
                  - row [ref=e1771]:
                    - rowheader "Importance:" [ref=e1772]
                    - cell "low" [ref=e1773]
            - listitem [ref=e1774]:
              - heading [level=4] [ref=e1775]:
                - link "reconnect.backoff.ms" [ref=e1776] [cursor=pointer]:
                  - /url: "#producerconfigs_reconnect.backoff.ms"
              - paragraph [ref=e1777]:
                - text: The base amount of time to wait before attempting to reconnect to a given host. This avoids repeatedly connecting to a host in a tight loop. This backoff applies to all connection attempts by the client to a broker. This value is the initial backoff value and will increase exponentially for each consecutive connection failure, up to the
                - code [ref=e1778]: reconnect.backoff.max.ms
                - text: value.
              - table [ref=e1779]:
                - rowgroup [ref=e1780]:
                  - row [ref=e1781]:
                    - rowheader "Type:" [ref=e1782]
                    - cell "long" [ref=e1783]
                  - row [ref=e1784]:
                    - rowheader "Default:" [ref=e1785]
                    - cell "50" [ref=e1786]
                  - row [ref=e1787]:
                    - rowheader "Valid Values:" [ref=e1788]
                    - cell "[0,...]" [ref=e1789]
                  - row [ref=e1790]:
                    - rowheader "Importance:" [ref=e1791]
                    - cell "low" [ref=e1792]
            - listitem [ref=e1793]:
              - heading [level=4] [ref=e1794]:
                - link "retry.backoff.max.ms" [ref=e1795] [cursor=pointer]:
                  - /url: "#producerconfigs_retry.backoff.max.ms"
              - paragraph [ref=e1796]:
                - text: The maximum amount of time in milliseconds to wait when retrying a request to the broker that has repeatedly failed. If provided, the backoff per client will increase exponentially for each failed request, up to this maximum. To prevent all clients from being synchronized upon retry, a randomized jitter with a factor of 0.2 will be applied to the backoff, resulting in the backoff falling within a range between 20% below and 20% above the computed value. If
                - code [ref=e1797]: retry.backoff.ms
                - text: is set to be higher than
                - code [ref=e1798]: retry.backoff.max.ms
                - text: ", then"
                - code [ref=e1799]: retry.backoff.max.ms
                - text: will be used as a constant backoff from the beginning without any exponential increase
              - table [ref=e1800]:
                - rowgroup [ref=e1801]:
                  - row [ref=e1802]:
                    - rowheader "Type:" [ref=e1803]
                    - cell "long" [ref=e1804]
                  - row [ref=e1805]:
                    - rowheader "Default:" [ref=e1806]
                    - cell "1000 (1 second)" [ref=e1807]
                  - row [ref=e1808]:
                    - rowheader "Valid Values:" [ref=e1809]
                    - cell "[0,...]" [ref=e1810]
                  - row [ref=e1811]:
                    - rowheader "Importance:" [ref=e1812]
                    - cell "low" [ref=e1813]
            - listitem [ref=e1814]:
              - heading [level=4] [ref=e1815]:
                - link "retry.backoff.ms" [ref=e1816] [cursor=pointer]:
                  - /url: "#producerconfigs_retry.backoff.ms"
              - paragraph [ref=e1817]:
                - text: The amount of time to wait before attempting to retry a failed request to a given topic partition. This avoids repeatedly sending requests in a tight loop under some failure scenarios. This value is the initial backoff value and will increase exponentially for each failed request, up to the
                - code [ref=e1818]: retry.backoff.max.ms
                - text: value.
              - table [ref=e1819]:
                - rowgroup [ref=e1820]:
                  - row [ref=e1821]:
                    - rowheader "Type:" [ref=e1822]
                    - cell "long" [ref=e1823]
                  - row [ref=e1824]:
                    - rowheader "Default:" [ref=e1825]
                    - cell "100" [ref=e1826]
                  - row [ref=e1827]:
                    - rowheader "Valid Values:" [ref=e1828]
                    - cell "[0,...]" [ref=e1829]
                  - row [ref=e1830]:
                    - rowheader "Importance:" [ref=e1831]
                    - cell "low" [ref=e1832]
            - listitem [ref=e1833]:
              - heading [level=4] [ref=e1834]:
                - link "sasl.kerberos.kinit.cmd" [ref=e1835] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.kerberos.kinit.cmd"
              - paragraph [ref=e1836]: Kerberos kinit command path.
              - table [ref=e1837]:
                - rowgroup [ref=e1838]:
                  - row [ref=e1839]:
                    - rowheader "Type:" [ref=e1840]
                    - cell "string" [ref=e1841]
                  - row [ref=e1842]:
                    - rowheader "Default:" [ref=e1843]
                    - cell "/usr/bin/kinit" [ref=e1844]
                  - row [ref=e1845]:
                    - columnheader "Valid Values:" [ref=e1846]
                    - cell [ref=e1847]
                  - row [ref=e1848]:
                    - rowheader "Importance:" [ref=e1849]
                    - cell "low" [ref=e1850]
            - listitem [ref=e1851]:
              - heading [level=4] [ref=e1852]:
                - link "sasl.kerberos.min.time.before.relogin" [ref=e1853] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.kerberos.min.time.before.relogin"
              - paragraph [ref=e1854]: Login thread sleep time between refresh attempts.
              - table [ref=e1855]:
                - rowgroup [ref=e1856]:
                  - row [ref=e1857]:
                    - rowheader "Type:" [ref=e1858]
                    - cell "long" [ref=e1859]
                  - row [ref=e1860]:
                    - rowheader "Default:" [ref=e1861]
                    - cell "60000" [ref=e1862]
                  - row [ref=e1863]:
                    - columnheader "Valid Values:" [ref=e1864]
                    - cell [ref=e1865]
                  - row [ref=e1866]:
                    - rowheader "Importance:" [ref=e1867]
                    - cell "low" [ref=e1868]
            - listitem [ref=e1869]:
              - heading [level=4] [ref=e1870]:
                - link "sasl.kerberos.ticket.renew.jitter" [ref=e1871] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.kerberos.ticket.renew.jitter"
              - paragraph [ref=e1872]: Percentage of random jitter added to the renewal time.
              - table [ref=e1873]:
                - rowgroup [ref=e1874]:
                  - row [ref=e1875]:
                    - rowheader "Type:" [ref=e1876]
                    - cell "double" [ref=e1877]
                  - row [ref=e1878]:
                    - rowheader "Default:" [ref=e1879]
                    - cell "0.05" [ref=e1880]
                  - row [ref=e1881]:
                    - columnheader "Valid Values:" [ref=e1882]
                    - cell [ref=e1883]
                  - row [ref=e1884]:
                    - rowheader "Importance:" [ref=e1885]
                    - cell "low" [ref=e1886]
            - listitem [ref=e1887]:
              - heading [level=4] [ref=e1888]:
                - link "sasl.kerberos.ticket.renew.window.factor" [ref=e1889] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.kerberos.ticket.renew.window.factor"
              - paragraph [ref=e1890]: Login thread will sleep until the specified window factor of time from last refresh to ticket's expiry has been reached, at which time it will try to renew the ticket.
              - table [ref=e1891]:
                - rowgroup [ref=e1892]:
                  - row [ref=e1893]:
                    - rowheader "Type:" [ref=e1894]
                    - cell "double" [ref=e1895]
                  - row [ref=e1896]:
                    - rowheader "Default:" [ref=e1897]
                    - cell "0.8" [ref=e1898]
                  - row [ref=e1899]:
                    - columnheader "Valid Values:" [ref=e1900]
                    - cell [ref=e1901]
                  - row [ref=e1902]:
                    - rowheader "Importance:" [ref=e1903]
                    - cell "low" [ref=e1904]
            - listitem [ref=e1905]:
              - heading [level=4] [ref=e1906]:
                - link "sasl.login.connect.timeout.ms" [ref=e1907] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.connect.timeout.ms"
              - paragraph [ref=e1908]: The (optional) value in milliseconds for the external authentication provider connection timeout. Currently applies only to OAUTHBEARER.
              - table [ref=e1909]:
                - rowgroup [ref=e1910]:
                  - row [ref=e1911]:
                    - rowheader "Type:" [ref=e1912]
                    - cell "int" [ref=e1913]
                  - row [ref=e1914]:
                    - rowheader "Default:" [ref=e1915]
                    - cell "null" [ref=e1916]
                  - row [ref=e1917]:
                    - columnheader "Valid Values:" [ref=e1918]
                    - cell [ref=e1919]
                  - row [ref=e1920]:
                    - rowheader "Importance:" [ref=e1921]
                    - cell "low" [ref=e1922]
            - listitem [ref=e1923]:
              - heading [level=4] [ref=e1924]:
                - link "sasl.login.read.timeout.ms" [ref=e1925] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.read.timeout.ms"
              - paragraph [ref=e1926]: The (optional) value in milliseconds for the external authentication provider read timeout. Currently applies only to OAUTHBEARER.
              - table [ref=e1927]:
                - rowgroup [ref=e1928]:
                  - row [ref=e1929]:
                    - rowheader "Type:" [ref=e1930]
                    - cell "int" [ref=e1931]
                  - row [ref=e1932]:
                    - rowheader "Default:" [ref=e1933]
                    - cell "null" [ref=e1934]
                  - row [ref=e1935]:
                    - columnheader "Valid Values:" [ref=e1936]
                    - cell [ref=e1937]
                  - row [ref=e1938]:
                    - rowheader "Importance:" [ref=e1939]
                    - cell "low" [ref=e1940]
            - listitem [ref=e1941]:
              - heading [level=4] [ref=e1942]:
                - link "sasl.login.refresh.buffer.seconds" [ref=e1943] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.refresh.buffer.seconds"
              - paragraph [ref=e1944]: The amount of buffer time before credential expiration to maintain when refreshing a credential, in seconds. If a refresh would otherwise occur closer to expiration than the number of buffer seconds then the refresh will be moved up to maintain as much of the buffer time as possible. Legal values are between 0 and 3600 (1 hour); a default value of 300 (5 minutes) is used if no value is specified. This value and sasl.login.refresh.min.period.seconds are both ignored if their sum exceeds the remaining lifetime of a credential. Currently applies only to OAUTHBEARER.
              - table [ref=e1945]:
                - rowgroup [ref=e1946]:
                  - row [ref=e1947]:
                    - rowheader "Type:" [ref=e1948]
                    - cell "short" [ref=e1949]
                  - row [ref=e1950]:
                    - rowheader "Default:" [ref=e1951]
                    - cell "300" [ref=e1952]
                  - row [ref=e1953]:
                    - rowheader "Valid Values:" [ref=e1954]
                    - cell "[0,...,3600]" [ref=e1955]
                  - row [ref=e1956]:
                    - rowheader "Importance:" [ref=e1957]
                    - cell "low" [ref=e1958]
            - listitem [ref=e1959]:
              - heading [level=4] [ref=e1960]:
                - link "sasl.login.refresh.min.period.seconds" [ref=e1961] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.refresh.min.period.seconds"
              - paragraph [ref=e1962]: The desired minimum time for the login refresh thread to wait before refreshing a credential, in seconds. Legal values are between 0 and 900 (15 minutes); a default value of 60 (1 minute) is used if no value is specified. This value and sasl.login.refresh.buffer.seconds are both ignored if their sum exceeds the remaining lifetime of a credential. Currently applies only to OAUTHBEARER.
              - table [ref=e1963]:
                - rowgroup [ref=e1964]:
                  - row [ref=e1965]:
                    - rowheader "Type:" [ref=e1966]
                    - cell "short" [ref=e1967]
                  - row [ref=e1968]:
                    - rowheader "Default:" [ref=e1969]
                    - cell "60" [ref=e1970]
                  - row [ref=e1971]:
                    - rowheader "Valid Values:" [ref=e1972]
                    - cell "[0,...,900]" [ref=e1973]
                  - row [ref=e1974]:
                    - rowheader "Importance:" [ref=e1975]
                    - cell "low" [ref=e1976]
            - listitem [ref=e1977]:
              - heading [level=4] [ref=e1978]:
                - link "sasl.login.refresh.window.factor" [ref=e1979] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.refresh.window.factor"
              - paragraph [ref=e1980]: Login refresh thread will sleep until the specified window factor relative to the credential's lifetime has been reached, at which time it will try to refresh the credential. Legal values are between 0.5 (50%) and 1.0 (100%) inclusive; a default value of 0.8 (80%) is used if no value is specified. Currently applies only to OAUTHBEARER.
              - table [ref=e1981]:
                - rowgroup [ref=e1982]:
                  - row [ref=e1983]:
                    - rowheader "Type:" [ref=e1984]
                    - cell "double" [ref=e1985]
                  - row [ref=e1986]:
                    - rowheader "Default:" [ref=e1987]
                    - cell "0.8" [ref=e1988]
                  - row [ref=e1989]:
                    - rowheader "Valid Values:" [ref=e1990]
                    - cell "[0.5,...,1.0]" [ref=e1991]
                  - row [ref=e1992]:
                    - rowheader "Importance:" [ref=e1993]
                    - cell "low" [ref=e1994]
            - listitem [ref=e1995]:
              - heading [level=4] [ref=e1996]:
                - link "sasl.login.refresh.window.jitter" [ref=e1997] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.refresh.window.jitter"
              - paragraph [ref=e1998]: The maximum amount of random jitter relative to the credential's lifetime that is added to the login refresh thread's sleep time. Legal values are between 0 and 0.25 (25%) inclusive; a default value of 0.05 (5%) is used if no value is specified. Currently applies only to OAUTHBEARER.
              - table [ref=e1999]:
                - rowgroup [ref=e2000]:
                  - row [ref=e2001]:
                    - rowheader "Type:" [ref=e2002]
                    - cell "double" [ref=e2003]
                  - row [ref=e2004]:
                    - rowheader "Default:" [ref=e2005]
                    - cell "0.05" [ref=e2006]
                  - row [ref=e2007]:
                    - rowheader "Valid Values:" [ref=e2008]
                    - cell "[0.0,...,0.25]" [ref=e2009]
                  - row [ref=e2010]:
                    - rowheader "Importance:" [ref=e2011]
                    - cell "low" [ref=e2012]
            - listitem [ref=e2013]:
              - heading [level=4] [ref=e2014]:
                - link "sasl.login.retry.backoff.max.ms" [ref=e2015] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.retry.backoff.max.ms"
              - paragraph [ref=e2016]: The (optional) value in milliseconds for the maximum wait between login attempts to the external authentication provider. Login uses an exponential backoff algorithm with an initial wait based on the sasl.login.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.login.retry.backoff.max.ms setting. Currently applies only to OAUTHBEARER.
              - table [ref=e2017]:
                - rowgroup [ref=e2018]:
                  - row [ref=e2019]:
                    - rowheader "Type:" [ref=e2020]
                    - cell "long" [ref=e2021]
                  - row [ref=e2022]:
                    - rowheader "Default:" [ref=e2023]
                    - cell "10000 (10 seconds)" [ref=e2024]
                  - row [ref=e2025]:
                    - columnheader "Valid Values:" [ref=e2026]
                    - cell [ref=e2027]
                  - row [ref=e2028]:
                    - rowheader "Importance:" [ref=e2029]
                    - cell "low" [ref=e2030]
            - listitem [ref=e2031]:
              - heading [level=4] [ref=e2032]:
                - link "sasl.login.retry.backoff.ms" [ref=e2033] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.login.retry.backoff.ms"
              - paragraph [ref=e2034]: The (optional) value in milliseconds for the initial wait between login attempts to the external authentication provider. Login uses an exponential backoff algorithm with an initial wait based on the sasl.login.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.login.retry.backoff.max.ms setting. Currently applies only to OAUTHBEARER.
              - table [ref=e2035]:
                - rowgroup [ref=e2036]:
                  - row [ref=e2037]:
                    - rowheader "Type:" [ref=e2038]
                    - cell "long" [ref=e2039]
                  - row [ref=e2040]:
                    - rowheader "Default:" [ref=e2041]
                    - cell "100" [ref=e2042]
                  - row [ref=e2043]:
                    - columnheader "Valid Values:" [ref=e2044]
                    - cell [ref=e2045]
                  - row [ref=e2046]:
                    - rowheader "Importance:" [ref=e2047]
                    - cell "low" [ref=e2048]
            - listitem [ref=e2049]:
              - heading [level=4] [ref=e2050]:
                - link "sasl.oauthbearer.assertion.claim.exp.seconds" [ref=e2051] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.assertion.claim.exp.seconds"
              - paragraph
              - paragraph [ref=e2052]:
                - text: The number of seconds
                - emphasis [ref=e2053]: in the future
                - text: for which the JWT is valid. The value is used to determine the JWT
                - code [ref=e2054]: exp
                - text: (Expiration) claim based on the current system time when the JWT is created.
              - paragraph [ref=e2055]:
                - text: The formula to generate the
                - code [ref=e2056]: exp
                - text: "claim is very simple:"
              - generic [ref=e2057]: "Let: x = the current timestamp in seconds, on client y = the value of this configurationThen: exp = x + y"
              - paragraph [ref=e2058]:
                - emphasis [ref=e2059]: Note
                - text: ": If a value for"
                - code [ref=e2060]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e2061]:
                - rowgroup [ref=e2062]:
                  - row [ref=e2063]:
                    - rowheader "Type:" [ref=e2064]
                    - cell "int" [ref=e2065]
                  - row [ref=e2066]:
                    - rowheader "Default:" [ref=e2067]
                    - cell "300" [ref=e2068]
                  - row [ref=e2069]:
                    - rowheader "Valid Values:" [ref=e2070]
                    - cell "[0,...,86400]" [ref=e2071]
                  - row [ref=e2072]:
                    - rowheader "Importance:" [ref=e2073]
                    - cell "low" [ref=e2074]
            - listitem [ref=e2075]:
              - heading [level=4] [ref=e2076]:
                - link "sasl.oauthbearer.assertion.claim.nbf.seconds" [ref=e2077] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.assertion.claim.nbf.seconds"
              - paragraph
              - paragraph [ref=e2078]:
                - text: The number of seconds
                - emphasis [ref=e2079]: in the past
                - text: from which the JWT is valid. The value is used to determine the JWT
                - code [ref=e2080]: nbf
                - text: (Not Before) claim based on the current system time when the JWT is created.
              - paragraph [ref=e2081]:
                - text: The formula to generate the
                - code [ref=e2082]: nbf
                - text: "claim is very simple:"
              - generic [ref=e2083]: "Let: x = the current timestamp in seconds, on client y = the value of this configurationThen: nbf = x - y"
              - paragraph [ref=e2084]:
                - emphasis [ref=e2085]: Note
                - text: ": If a value for"
                - code [ref=e2086]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e2087]:
                - rowgroup [ref=e2088]:
                  - row [ref=e2089]:
                    - rowheader "Type:" [ref=e2090]
                    - cell "int" [ref=e2091]
                  - row [ref=e2092]:
                    - rowheader "Default:" [ref=e2093]
                    - cell "60" [ref=e2094]
                  - row [ref=e2095]:
                    - rowheader "Valid Values:" [ref=e2096]
                    - cell "[0,...,3600]" [ref=e2097]
                  - row [ref=e2098]:
                    - rowheader "Importance:" [ref=e2099]
                    - cell "low" [ref=e2100]
            - listitem [ref=e2101]:
              - heading [level=4] [ref=e2102]:
                - link "sasl.oauthbearer.clock.skew.seconds" [ref=e2103] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.clock.skew.seconds"
              - paragraph [ref=e2104]: The (optional) value in seconds to allow for differences between the time of the OAuth/OIDC identity provider and the broker.
              - table [ref=e2105]:
                - rowgroup [ref=e2106]:
                  - row [ref=e2107]:
                    - rowheader "Type:" [ref=e2108]
                    - cell "int" [ref=e2109]
                  - row [ref=e2110]:
                    - rowheader "Default:" [ref=e2111]
                    - cell "30" [ref=e2112]
                  - row [ref=e2113]:
                    - columnheader "Valid Values:" [ref=e2114]
                    - cell [ref=e2115]
                  - row [ref=e2116]:
                    - rowheader "Importance:" [ref=e2117]
                    - cell "low" [ref=e2118]
            - listitem [ref=e2119]:
              - heading [level=4] [ref=e2120]:
                - link "sasl.oauthbearer.expected.audience" [ref=e2121] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.expected.audience"
              - paragraph [ref=e2122]: The (optional) comma-delimited setting for the broker to use to verify that the JWT was issued for one of the expected audiences. The JWT will be inspected for the standard OAuth "aud" claim and if this value is set, the broker will match the value from JWT's "aud" claim to see if there is an exact match. If there is no match, the broker will reject the JWT and authentication will fail.
              - table [ref=e2123]:
                - rowgroup [ref=e2124]:
                  - row [ref=e2125]:
                    - rowheader "Type:" [ref=e2126]
                    - cell "list" [ref=e2127]
                  - row [ref=e2128]:
                    - rowheader "Default:" [ref=e2129]
                    - cell "\"\"" [ref=e2130]
                  - row [ref=e2131]:
                    - columnheader "Valid Values:" [ref=e2132]
                    - cell [ref=e2133]
                  - row [ref=e2134]:
                    - rowheader "Importance:" [ref=e2135]
                    - cell "low" [ref=e2136]
            - listitem [ref=e2137]:
              - heading [level=4] [ref=e2138]:
                - link "sasl.oauthbearer.expected.issuer" [ref=e2139] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.expected.issuer"
              - paragraph [ref=e2140]: The (optional) setting for the broker to use to verify that the JWT was created by the expected issuer. The JWT will be inspected for the standard OAuth "iss" claim and if this value is set, the broker will match it exactly against what is in the JWT's "iss" claim. If there is no match, the broker will reject the JWT and authentication will fail.
              - table [ref=e2141]:
                - rowgroup [ref=e2142]:
                  - row [ref=e2143]:
                    - rowheader "Type:" [ref=e2144]
                    - cell "string" [ref=e2145]
                  - row [ref=e2146]:
                    - rowheader "Default:" [ref=e2147]
                    - cell "null" [ref=e2148]
                  - row [ref=e2149]:
                    - columnheader "Valid Values:" [ref=e2150]
                    - cell [ref=e2151]
                  - row [ref=e2152]:
                    - rowheader "Importance:" [ref=e2153]
                    - cell "low" [ref=e2154]
            - listitem [ref=e2155]:
              - heading [level=4] [ref=e2156]:
                - link "sasl.oauthbearer.header.urlencode" [ref=e2157] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.header.urlencode"
              - paragraph [ref=e2158]:
                - text: The (optional) setting to enable the OAuth client to URL-encode the client_id and client_secret in the authorization header in accordance with RFC6749, see
                - link "here" [ref=e2159] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1
                - text: for more details. The default value is set to 'false' for backward compatibility
              - table [ref=e2160]:
                - rowgroup [ref=e2161]:
                  - row [ref=e2162]:
                    - rowheader "Type:" [ref=e2163]
                    - cell "boolean" [ref=e2164]
                  - row [ref=e2165]:
                    - rowheader "Default:" [ref=e2166]
                    - cell "false" [ref=e2167]
                  - row [ref=e2168]:
                    - columnheader "Valid Values:" [ref=e2169]
                    - cell [ref=e2170]
                  - row [ref=e2171]:
                    - rowheader "Importance:" [ref=e2172]
                    - cell "low" [ref=e2173]
            - listitem [ref=e2174]:
              - heading [level=4] [ref=e2175]:
                - link "sasl.oauthbearer.jwks.endpoint.refresh.ms" [ref=e2176] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.jwks.endpoint.refresh.ms"
              - paragraph [ref=e2177]: The (optional) value in milliseconds for the broker to wait between refreshing its JWKS (JSON Web Key Set) cache that contains the keys to verify the signature of the JWT.
              - table [ref=e2178]:
                - rowgroup [ref=e2179]:
                  - row [ref=e2180]:
                    - rowheader "Type:" [ref=e2181]
                    - cell "long" [ref=e2182]
                  - row [ref=e2183]:
                    - rowheader "Default:" [ref=e2184]
                    - cell "3600000 (1 hour)" [ref=e2185]
                  - row [ref=e2186]:
                    - columnheader "Valid Values:" [ref=e2187]
                    - cell [ref=e2188]
                  - row [ref=e2189]:
                    - rowheader "Importance:" [ref=e2190]
                    - cell "low" [ref=e2191]
            - listitem [ref=e2192]:
              - heading [level=4] [ref=e2193]:
                - link "sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms" [ref=e2194] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms"
              - paragraph [ref=e2195]: The (optional) value in milliseconds for the maximum wait between attempts to retrieve the JWKS (JSON Web Key Set) from the external authentication provider. JWKS retrieval uses an exponential backoff algorithm with an initial wait based on the sasl.oauthbearer.jwks.endpoint.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms setting.
              - table [ref=e2196]:
                - rowgroup [ref=e2197]:
                  - row [ref=e2198]:
                    - rowheader "Type:" [ref=e2199]
                    - cell "long" [ref=e2200]
                  - row [ref=e2201]:
                    - rowheader "Default:" [ref=e2202]
                    - cell "10000 (10 seconds)" [ref=e2203]
                  - row [ref=e2204]:
                    - columnheader "Valid Values:" [ref=e2205]
                    - cell [ref=e2206]
                  - row [ref=e2207]:
                    - rowheader "Importance:" [ref=e2208]
                    - cell "low" [ref=e2209]
            - listitem [ref=e2210]:
              - heading [level=4] [ref=e2211]:
                - link "sasl.oauthbearer.jwks.endpoint.retry.backoff.ms" [ref=e2212] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.jwks.endpoint.retry.backoff.ms"
              - paragraph [ref=e2213]: The (optional) value in milliseconds for the initial wait between JWKS (JSON Web Key Set) retrieval attempts from the external authentication provider. JWKS retrieval uses an exponential backoff algorithm with an initial wait based on the sasl.oauthbearer.jwks.endpoint.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms setting.
              - table [ref=e2214]:
                - rowgroup [ref=e2215]:
                  - row [ref=e2216]:
                    - rowheader "Type:" [ref=e2217]
                    - cell "long" [ref=e2218]
                  - row [ref=e2219]:
                    - rowheader "Default:" [ref=e2220]
                    - cell "100" [ref=e2221]
                  - row [ref=e2222]:
                    - columnheader "Valid Values:" [ref=e2223]
                    - cell [ref=e2224]
                  - row [ref=e2225]:
                    - rowheader "Importance:" [ref=e2226]
                    - cell "low" [ref=e2227]
            - listitem [ref=e2228]:
              - heading [level=4] [ref=e2229]:
                - link "sasl.oauthbearer.scope.claim.name" [ref=e2230] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.scope.claim.name"
              - paragraph [ref=e2231]: The OAuth claim for the scope is often named "scope", but this (optional) setting can provide a different name to use for the scope included in the JWT payload's claims if the OAuth/OIDC provider uses a different name for that claim.
              - table [ref=e2232]:
                - rowgroup [ref=e2233]:
                  - row [ref=e2234]:
                    - rowheader "Type:" [ref=e2235]
                    - cell "string" [ref=e2236]
                  - row [ref=e2237]:
                    - rowheader "Default:" [ref=e2238]
                    - cell "scope" [ref=e2239]
                  - row [ref=e2240]:
                    - columnheader "Valid Values:" [ref=e2241]
                    - cell [ref=e2242]
                  - row [ref=e2243]:
                    - rowheader "Importance:" [ref=e2244]
                    - cell "low" [ref=e2245]
            - listitem [ref=e2246]:
              - heading [level=4] [ref=e2247]:
                - link "sasl.oauthbearer.sub.claim.name" [ref=e2248] [cursor=pointer]:
                  - /url: "#producerconfigs_sasl.oauthbearer.sub.claim.name"
              - paragraph [ref=e2249]: The OAuth claim for the subject is often named "sub", but this (optional) setting can provide a different name to use for the subject included in the JWT payload's claims if the OAuth/OIDC provider uses a different name for that claim.
              - table [ref=e2250]:
                - rowgroup [ref=e2251]:
                  - row [ref=e2252]:
                    - rowheader "Type:" [ref=e2253]
                    - cell "string" [ref=e2254]
                  - row [ref=e2255]:
                    - rowheader "Default:" [ref=e2256]
                    - cell "sub" [ref=e2257]
                  - row [ref=e2258]:
                    - columnheader "Valid Values:" [ref=e2259]
                    - cell [ref=e2260]
                  - row [ref=e2261]:
                    - rowheader "Importance:" [ref=e2262]
                    - cell "low" [ref=e2263]
            - listitem [ref=e2264]:
              - heading [level=4] [ref=e2265]:
                - link "security.providers" [ref=e2266] [cursor=pointer]:
                  - /url: "#producerconfigs_security.providers"
              - paragraph [ref=e2267]:
                - text: A list of configurable creator classes each returning a provider implementing security algorithms. These classes should implement the
                - code [ref=e2268]: org.apache.kafka.common.security.auth.SecurityProviderCreator
                - text: interface.
              - table [ref=e2269]:
                - rowgroup [ref=e2270]:
                  - row [ref=e2271]:
                    - rowheader "Type:" [ref=e2272]
                    - cell "string" [ref=e2273]
                  - row [ref=e2274]:
                    - rowheader "Default:" [ref=e2275]
                    - cell "null" [ref=e2276]
                  - row [ref=e2277]:
                    - columnheader "Valid Values:" [ref=e2278]
                    - cell [ref=e2279]
                  - row [ref=e2280]:
                    - rowheader "Importance:" [ref=e2281]
                    - cell "low" [ref=e2282]
            - listitem [ref=e2283]:
              - heading [level=4] [ref=e2284]:
                - link "ssl.cipher.suites" [ref=e2285] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.cipher.suites"
              - paragraph [ref=e2286]: A list of cipher suites. This is a named combination of authentication, encryption, MAC and key exchange algorithm used to negotiate the security settings for a network connection using TLS or SSL network protocol. By default all the available cipher suites are supported.
              - table [ref=e2287]:
                - rowgroup [ref=e2288]:
                  - row [ref=e2289]:
                    - rowheader "Type:" [ref=e2290]
                    - cell "list" [ref=e2291]
                  - row [ref=e2292]:
                    - rowheader "Default:" [ref=e2293]
                    - cell "\"\"" [ref=e2294]
                  - row [ref=e2295]:
                    - columnheader "Valid Values:" [ref=e2296]
                    - cell [ref=e2297]
                  - row [ref=e2298]:
                    - rowheader "Importance:" [ref=e2299]
                    - cell "low" [ref=e2300]
            - listitem [ref=e2301]:
              - heading [level=4] [ref=e2302]:
                - link "ssl.endpoint.identification.algorithm" [ref=e2303] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.endpoint.identification.algorithm"
              - paragraph [ref=e2304]: The endpoint identification algorithm to validate server hostname using server certificate.
              - table [ref=e2305]:
                - rowgroup [ref=e2306]:
                  - row [ref=e2307]:
                    - rowheader "Type:" [ref=e2308]
                    - cell "string" [ref=e2309]
                  - row [ref=e2310]:
                    - rowheader "Default:" [ref=e2311]
                    - cell "https" [ref=e2312]
                  - row [ref=e2313]:
                    - columnheader "Valid Values:" [ref=e2314]
                    - cell [ref=e2315]
                  - row [ref=e2316]:
                    - rowheader "Importance:" [ref=e2317]
                    - cell "low" [ref=e2318]
            - listitem [ref=e2319]:
              - heading [level=4] [ref=e2320]:
                - link "ssl.engine.factory.class" [ref=e2321] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.engine.factory.class"
              - paragraph [ref=e2322]: The class of type org.apache.kafka.common.security.auth.SslEngineFactory to provide SSLEngine objects. Default value is org.apache.kafka.common.security.ssl.DefaultSslEngineFactory. Alternatively, setting this to org.apache.kafka.common.security.ssl.CommonNameLoggingSslEngineFactory will log the common name of expired SSL certificates used by clients to authenticate at any of the brokers with log level INFO. Note that this will cause a tiny delay during establishment of new connections from mTLS clients to brokers due to the extra code for examining the certificate chain provided by the client. Note further that the implementation uses a custom truststore based on the standard Java truststore and thus might be considered a security risk due to not being as mature as the standard one.
              - table [ref=e2323]:
                - rowgroup [ref=e2324]:
                  - row [ref=e2325]:
                    - rowheader "Type:" [ref=e2326]
                    - cell "class" [ref=e2327]
                  - row [ref=e2328]:
                    - rowheader "Default:" [ref=e2329]
                    - cell "null" [ref=e2330]
                  - row [ref=e2331]:
                    - columnheader "Valid Values:" [ref=e2332]
                    - cell [ref=e2333]
                  - row [ref=e2334]:
                    - rowheader "Importance:" [ref=e2335]
                    - cell "low" [ref=e2336]
            - listitem [ref=e2337]:
              - heading [level=4] [ref=e2338]:
                - link "ssl.keymanager.algorithm" [ref=e2339] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.keymanager.algorithm"
              - paragraph [ref=e2340]: The algorithm used by key manager factory for SSL connections. Default value is the key manager factory algorithm configured for the Java Virtual Machine.
              - table [ref=e2341]:
                - rowgroup [ref=e2342]:
                  - row [ref=e2343]:
                    - rowheader "Type:" [ref=e2344]
                    - cell "string" [ref=e2345]
                  - row [ref=e2346]:
                    - rowheader "Default:" [ref=e2347]
                    - cell "SunX509" [ref=e2348]
                  - row [ref=e2349]:
                    - columnheader "Valid Values:" [ref=e2350]
                    - cell [ref=e2351]
                  - row [ref=e2352]:
                    - rowheader "Importance:" [ref=e2353]
                    - cell "low" [ref=e2354]
            - listitem [ref=e2355]:
              - heading [level=4] [ref=e2356]:
                - link "ssl.secure.random.implementation" [ref=e2357] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.secure.random.implementation"
              - paragraph [ref=e2358]: The SecureRandom PRNG implementation to use for SSL cryptography operations.
              - table [ref=e2359]:
                - rowgroup [ref=e2360]:
                  - row [ref=e2361]:
                    - rowheader "Type:" [ref=e2362]
                    - cell "string" [ref=e2363]
                  - row [ref=e2364]:
                    - rowheader "Default:" [ref=e2365]
                    - cell "null" [ref=e2366]
                  - row [ref=e2367]:
                    - columnheader "Valid Values:" [ref=e2368]
                    - cell [ref=e2369]
                  - row [ref=e2370]:
                    - rowheader "Importance:" [ref=e2371]
                    - cell "low" [ref=e2372]
            - listitem [ref=e2373]:
              - heading [level=4] [ref=e2374]:
                - link "ssl.trustmanager.algorithm" [ref=e2375] [cursor=pointer]:
                  - /url: "#producerconfigs_ssl.trustmanager.algorithm"
              - paragraph [ref=e2376]: The algorithm used by trust manager factory for SSL connections. Default value is the trust manager factory algorithm configured for the Java Virtual Machine.
              - table [ref=e2377]:
                - rowgroup [ref=e2378]:
                  - row [ref=e2379]:
                    - rowheader "Type:" [ref=e2380]
                    - cell "string" [ref=e2381]
                  - row [ref=e2382]:
                    - rowheader "Default:" [ref=e2383]
                    - cell "PKIX" [ref=e2384]
                  - row [ref=e2385]:
                    - columnheader "Valid Values:" [ref=e2386]
                    - cell [ref=e2387]
                  - row [ref=e2388]:
                    - rowheader "Importance:" [ref=e2389]
                    - cell "low" [ref=e2390]
            - listitem [ref=e2391]:
              - heading [level=4] [ref=e2392]:
                - link "transaction.timeout.ms" [ref=e2393] [cursor=pointer]:
                  - /url: "#producerconfigs_transaction.timeout.ms"
              - paragraph [ref=e2394]:
                - text: The maximum amount of time in milliseconds that a transaction will remain open before the coordinator proactively aborts it. The start of the transaction is set at the time that the first partition is added to it. If this value is larger than the
                - code [ref=e2395]: transaction.max.timeout.ms
                - text: setting in the broker, the request will fail with a
                - code [ref=e2396]: InvalidTxnTimeoutException
                - text: error.
              - table [ref=e2397]:
                - rowgroup [ref=e2398]:
                  - row [ref=e2399]:
                    - rowheader "Type:" [ref=e2400]
                    - cell "int" [ref=e2401]
