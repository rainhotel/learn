              - heading [level=4] [ref=e234]:
                - link "buffer.memory" [ref=e235] [cursor=pointer]:
                  - /url: "#producerconfigs_buffer.memory"
              - paragraph [ref=e236]:
                - text: The total bytes of memory the producer can use to buffer records waiting to be sent to the server. If records are sent faster than they can be delivered to the server the producer will block for
                - code [ref=e237]: max.block.ms
                - text: after which it will fail with an exception.
              - paragraph [ref=e238]: This setting should correspond roughly to the total memory the producer will use, but is not a hard bound since not all memory the producer uses is used for buffering. Some additional memory will be used for compression (if compression is enabled) as well as for maintaining in-flight requests.
              - table [ref=e239]:
                - rowgroup [ref=e240]:
                  - row [ref=e241]:
                    - rowheader "Type:" [ref=e242]
                    - cell "long" [ref=e243]
                  - row [ref=e244]:
                    - rowheader "Default:" [ref=e245]
                    - cell "33554432" [ref=e246]
                  - row [ref=e247]:
