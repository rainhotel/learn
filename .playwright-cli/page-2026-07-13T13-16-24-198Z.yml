                        - text: =true)
                      - text: protected void finalize()
                    - generic [ref=e1001]:
                      - text: "Deprecated, for removal: This API element is subject to removal in a future version."
                      - generic [ref=e1002]:
                        - text: Finalization has been deprecated for removal. See
                        - link [ref=e1003] [cursor=pointer]:
                          - /url: ../../lang/Object.html#finalize()
                          - code [ref=e1004]: Object.finalize()
                        - text: for background information and details about migration options.
                    - generic [ref=e1006]:
                      - text: "Description copied from class:"
                      - code [ref=e1007]:
                        - link "Object" [ref=e1008] [cursor=pointer]:
                          - /url: ../../lang/Object.html#finalize()
                    - generic [ref=e1009]:
                      - text: Called by the garbage collector on an object when garbage collection determines that there are no more references to the object. A subclass overrides the
                      - code [ref=e1010]: finalize
                      - text: method to dispose of system resources or to perform other cleanup.
                      - paragraph [ref=e1011]:
                        - generic [ref=e1012]:
                          - text: When running in a Java virtual machine in which finalization has been disabled or removed, the garbage collector will never call
                          - code [ref=e1013]: finalize()
                          - text: . In a Java virtual machine in which finalization is enabled, the garbage collector might call
                          - code [ref=e1014]: finalize
                          - text: only after an indefinite delay.
                      - paragraph [ref=e1015]:
                        - text: The general contract of
                        - code [ref=e1016]: finalize
                        - text: is that it is invoked if and when the Java virtual machine has determined that there is no longer any means by which this object can be accessed by any thread that has not yet died, except as a result of an action taken by the finalization of some other object or class which is ready to be finalized. The
                        - code [ref=e1017]: finalize
                        - text: method may take any action, including making this object available again to other threads; the usual purpose of
                        - code [ref=e1018]: finalize
                        - text: ", however, is to perform cleanup actions before the object is irrevocably discarded. For example, the finalize method for an object that represents an input/output connection might perform explicit I/O transactions to break the connection before the object is permanently discarded."
                      - paragraph [ref=e1019]:
                        - text: The
                        - code [ref=e1020]: finalize
                        - text: method of class
                        - code [ref=e1021]: Object
                        - text: performs no special action; it simply returns normally. Subclasses of
                        - code [ref=e1022]: Object
                        - text: may override this definition.
                      - paragraph [ref=e1023]:
                        - text: The Java programming language does not guarantee which thread will invoke the
                        - code [ref=e1024]: finalize
                        - text: method for any given object. It is guaranteed, however, that the thread that invokes finalize will not be holding any user-visible synchronization locks when finalize is invoked. If an uncaught exception is thrown by the finalize method, the exception is ignored and finalization of that object terminates.
                      - paragraph [ref=e1025]:
                        - text: After the
                        - code [ref=e1026]: finalize
                        - text: method has been invoked for an object, no further action is taken until the Java virtual machine has again determined that there is no longer any means by which this object can be accessed by any thread that has not yet died, including possible actions by other objects or classes which are ready to be finalized, at which point the object may be discarded.
                      - paragraph [ref=e1027]:
                        - text: The
                        - code [ref=e1028]: finalize
                        - text: method is never invoked more than once by a Java virtual machine for any given object.
                      - paragraph [ref=e1029]:
                        - text: Any exception thrown by the
                        - code [ref=e1030]: finalize
                        - text: method causes the finalization of this object to be halted, but is otherwise ignored.
                    - generic [ref=e1031]:
                      - term [ref=e1032]: "Overrides:"
                      - definition [ref=e1033]:
                        - code [ref=e1034]:
