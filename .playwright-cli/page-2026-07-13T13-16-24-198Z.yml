          - generic [ref=e84]:
            - text: An
            - link [ref=e85] [cursor=pointer]:
              - /url: ExecutorService.html
              - code [ref=e86]: ExecutorService
            - text: that executes each submitted task using one of possibly several pooled threads, normally configured using
            - link [ref=e87] [cursor=pointer]:
              - /url: Executors.html
              - code [ref=e88]: Executors
            - text: factory methods.
            - paragraph [ref=e89]:
              - text: "Thread pools address two different problems: they usually provide improved performance when executing large numbers of asynchronous tasks, due to reduced per-task invocation overhead, and they provide a means of bounding and managing the resources, including threads, consumed when executing a collection of tasks. Each"
              - code [ref=e90]: ThreadPoolExecutor
              - text: also maintains some basic statistics, such as the number of completed tasks.
            - paragraph [ref=e91]:
              - text: To be useful across a wide range of contexts, this class provides many adjustable parameters and extensibility hooks. However, programmers are urged to use the more convenient
              - link [ref=e92] [cursor=pointer]:
                - /url: Executors.html
                - code [ref=e93]: Executors
              - text: factory methods
              - link [ref=e94] [cursor=pointer]:
                - /url: Executors.html#newCachedThreadPool()
                - code [ref=e95]: Executors.newCachedThreadPool()
              - text: (unbounded thread pool, with automatic thread reclamation),
              - link [ref=e96] [cursor=pointer]:
                - /url: Executors.html#newFixedThreadPool(int)
                - code [ref=e97]: Executors.newFixedThreadPool(int)
              - text: (fixed size thread pool) and
              - link [ref=e98] [cursor=pointer]:
                - /url: Executors.html#newSingleThreadExecutor()
                - code [ref=e99]: Executors.newSingleThreadExecutor()
              - text: "(single background thread), that preconfigure settings for the most common usage scenarios. Otherwise, use the following guide when manually configuring and tuning this class:"
            - generic [ref=e100]:
              - term [ref=e101]: Core and maximum pool sizes
              - definition [ref=e102]:
                - text: A
                - code [ref=e103]: ThreadPoolExecutor
                - text: will automatically adjust the pool size (see
                - link [ref=e104] [cursor=pointer]:
                  - /url: "#getPoolSize()"
                  - code [ref=e105]: getPoolSize()
                - text: ) according to the bounds set by corePoolSize (see
                - link [ref=e106] [cursor=pointer]:
                  - /url: "#getCorePoolSize()"
                  - code [ref=e107]: getCorePoolSize()
                - text: ) and maximumPoolSize (see
                - link [ref=e108] [cursor=pointer]:
                  - /url: "#getMaximumPoolSize()"
                  - code [ref=e109]: getMaximumPoolSize()
                - text: ). When a new task is submitted in method
                - link [ref=e110] [cursor=pointer]:
                  - /url: "#execute(java.lang.Runnable)"
                  - code [ref=e111]: execute(Runnable)
                - text: ", if fewer than corePoolSize threads are running, a new thread is created to handle the request, even if other worker threads are idle. Else if fewer than maximumPoolSize threads are running, a new thread will be created to handle the request only if the queue is full. By setting corePoolSize and maximumPoolSize the same, you create a fixed-size thread pool. By setting maximumPoolSize to an essentially unbounded value such as"
                - code [ref=e112]: Integer.MAX_VALUE
                - text: ", you allow the pool to accommodate an arbitrary number of concurrent tasks. Most typically, core and maximum pool sizes are set only upon construction, but they may also be changed dynamically using"
                - link [ref=e113] [cursor=pointer]:
                  - /url: "#setCorePoolSize(int)"
                  - code [ref=e114]: setCorePoolSize(int)
                - text: and
                - link [ref=e115] [cursor=pointer]:
                  - /url: "#setMaximumPoolSize(int)"
                  - code [ref=e116]: setMaximumPoolSize(int)
                - text: .
              - term [ref=e117]: On-demand construction
              - definition [ref=e118]:
                - text: By default, even core threads are initially created and started only when new tasks arrive, but this can be overridden dynamically using method
                - link [ref=e119] [cursor=pointer]:
                  - /url: "#prestartCoreThread()"
                  - code [ref=e120]: prestartCoreThread()
                - text: or
                - link [ref=e121] [cursor=pointer]:
                  - /url: "#prestartAllCoreThreads()"
                  - code [ref=e122]: prestartAllCoreThreads()
                - text: . You probably want to prestart threads if you construct the pool with a non-empty queue.
              - term [ref=e123]: Creating new threads
              - definition [ref=e124]:
                - text: New threads are created using a
                - link [ref=e125] [cursor=pointer]:
                  - /url: ThreadFactory.html
                  - code [ref=e126]: ThreadFactory
                - text: . If not otherwise specified, a
                - link [ref=e127] [cursor=pointer]:
                  - /url: Executors.html#defaultThreadFactory()
                  - code [ref=e128]: Executors.defaultThreadFactory()
                - text: is used, that creates threads to all be in the same
                - link [ref=e129] [cursor=pointer]:
                  - /url: ../../lang/ThreadGroup.html
                  - code [ref=e130]: ThreadGroup
                - text: and with the same
                - code [ref=e131]: NORM_PRIORITY
                - text: priority and non-daemon status. By supplying a different ThreadFactory, you can alter the thread's name, thread group, priority, daemon status, etc. If a
                - code [ref=e132]: ThreadFactory
                - text: fails to create a thread when asked by returning null from
                - code [ref=e133]: newThread
                - text: ", the executor will continue, but might not be able to execute any tasks. Threads should possess the \"modifyThread\""
                - code [ref=e134]: RuntimePermission
                - text: ". If worker threads or other threads using the pool do not possess this permission, service may be degraded: configuration changes may not take effect in a timely manner, and a shutdown pool may remain in a state in which termination is possible but not completed."
              - term [ref=e135]: Keep-alive times
              - definition [ref=e136]:
                - text: If the pool currently has more than corePoolSize threads, excess threads will be terminated if they have been idle for more than the keepAliveTime (see
                - link [ref=e137] [cursor=pointer]:
                  - /url: "#getKeepAliveTime(java.util.concurrent.TimeUnit)"
                  - code [ref=e138]: getKeepAliveTime(TimeUnit)
                - text: ). This provides a means of reducing resource consumption when the pool is not being actively used. If the pool becomes more active later, new threads will be constructed. This parameter can also be changed dynamically using method
                - link [ref=e139] [cursor=pointer]:
                  - /url: "#setKeepAliveTime(long,java.util.concurrent.TimeUnit)"
                  - code [ref=e140]: setKeepAliveTime(long, TimeUnit)
                - text: . Using a value of
                - code [ref=e141]: Long.MAX_VALUE
                - link [ref=e142] [cursor=pointer]:
                  - /url: TimeUnit.html#NANOSECONDS
                  - code [ref=e143]: TimeUnit.NANOSECONDS
                - text: effectively disables idle threads from ever terminating prior to shut down. By default, the keep-alive policy applies only when there are more than corePoolSize threads, but method
                - link [ref=e144] [cursor=pointer]:
                  - /url: "#allowCoreThreadTimeOut(boolean)"
                  - code [ref=e145]: allowCoreThreadTimeOut(boolean)
                - text: can be used to apply this time-out policy to core threads as well, so long as the keepAliveTime value is non-zero.
              - term [ref=e146]: Queuing
              - definition [ref=e147]:
                - text: Any
                - link [ref=e148] [cursor=pointer]:
                  - /url: BlockingQueue.html
                  - code [ref=e149]: BlockingQueue
                - text: "may be used to transfer and hold submitted tasks. The use of this queue interacts with pool sizing:"
                - list [ref=e150]:
                  - listitem [ref=e151]: If fewer than corePoolSize threads are running, the Executor always prefers adding a new thread rather than queuing.
                  - listitem [ref=e152]: If corePoolSize or more threads are running, the Executor always prefers queuing a request rather than adding a new thread.
                  - listitem [ref=e153]: If a request cannot be queued, a new thread is created unless this would exceed maximumPoolSize, in which case, the task will be rejected.
                - text: "There are three general strategies for queuing:"
                - list [ref=e154]:
                  - listitem [ref=e155]:
                    - emphasis [ref=e156]: Direct handoffs.
                    - text: A good default choice for a work queue is a
                    - link [ref=e157] [cursor=pointer]:
                      - /url: SynchronousQueue.html
                      - code [ref=e158]: SynchronousQueue
                    - text: that hands off tasks to threads without otherwise holding them. Here, an attempt to queue a task will fail if no threads are immediately available to run it, so a new thread will be constructed. This policy avoids lockups when handling sets of requests that might have internal dependencies. Direct handoffs generally require unbounded maximumPoolSizes to avoid rejection of new submitted tasks. This in turn admits the possibility of unbounded thread growth when commands continue to arrive on average faster than they can be processed.
                  - listitem [ref=e159]:
                    - emphasis [ref=e160]: Unbounded queues.
                    - text: Using an unbounded queue (for example a
                    - link [ref=e161] [cursor=pointer]:
                      - /url: LinkedBlockingQueue.html
                      - code [ref=e162]: LinkedBlockingQueue
                    - text: without a predefined capacity) will cause new tasks to wait in the queue when all corePoolSize threads are busy. Thus, no more than corePoolSize threads will ever be created. (And the value of the maximumPoolSize therefore doesn't have any effect.) This may be appropriate when each task is completely independent of others, so tasks cannot affect each others execution; for example, in a web page server. While this style of queuing can be useful in smoothing out transient bursts of requests, it admits the possibility of unbounded work queue growth when commands continue to arrive on average faster than they can be processed.
                  - listitem [ref=e163]:
                    - emphasis [ref=e164]: Bounded queues.
                    - text: A bounded queue (for example, an
                    - link [ref=e165] [cursor=pointer]:
                      - /url: ArrayBlockingQueue.html
                      - code [ref=e166]: ArrayBlockingQueue
                    - text: ") helps prevent resource exhaustion when used with finite maximumPoolSizes, but can be more difficult to tune and control. Queue sizes and maximum pool sizes may be traded off for each other: Using large queues and small pools minimizes CPU usage, OS resources, and context-switching overhead, but can lead to artificially low throughput. If tasks frequently block (for example if they are I/O bound), a system may be able to schedule time for more threads than you otherwise allow. Use of small queues generally requires larger pool sizes, which keeps CPUs busier but may encounter unacceptable scheduling overhead, which also decreases throughput."
              - term [ref=e167]: Rejected tasks
              - definition [ref=e168]:
                - text: New tasks submitted in method
                - link [ref=e169] [cursor=pointer]:
                  - /url: "#execute(java.lang.Runnable)"
                  - code [ref=e170]: execute(Runnable)
                - text: will be
                - emphasis [ref=e171]: rejected
                - text: when the Executor has been shut down, and also when the Executor uses finite bounds for both maximum threads and work queue capacity, and is saturated. In either case, the
                - code [ref=e172]: execute
                - text: method invokes the
                - link [ref=e173] [cursor=pointer]:
                  - /url: RejectedExecutionHandler.html#rejectedExecution(java.lang.Runnable,java.util.concurrent.ThreadPoolExecutor)
                  - code [ref=e174]: RejectedExecutionHandler.rejectedExecution(Runnable, ThreadPoolExecutor)
                - text: method of its
                - link [ref=e175] [cursor=pointer]:
                  - /url: RejectedExecutionHandler.html
                  - code [ref=e176]: RejectedExecutionHandler
                - text: ". Four predefined handler policies are provided:"
                - list [ref=e177]:
                  - listitem [ref=e178]:
                    - text: In the default
                    - link [ref=e179] [cursor=pointer]:
                      - /url: ThreadPoolExecutor.AbortPolicy.html
                      - code [ref=e180]: ThreadPoolExecutor.AbortPolicy
                    - text: ", the handler throws a runtime"
                    - link [ref=e181] [cursor=pointer]:
                      - /url: RejectedExecutionException.html
                      - code [ref=e182]: RejectedExecutionException
                    - text: upon rejection.
                  - listitem [ref=e183]:
                    - text: In
                    - link [ref=e184] [cursor=pointer]:
                      - /url: ThreadPoolExecutor.CallerRunsPolicy.html
                      - code [ref=e185]: ThreadPoolExecutor.CallerRunsPolicy
                    - text: ", the thread that invokes"
                    - code [ref=e186]: execute
                    - text: itself runs the task. This provides a simple feedback control mechanism that will slow down the rate that new tasks are submitted.
                  - listitem [ref=e187]:
                    - text: In
                    - link [ref=e188] [cursor=pointer]:
                      - /url: ThreadPoolExecutor.DiscardPolicy.html
                      - code [ref=e189]: ThreadPoolExecutor.DiscardPolicy
                    - text: ", a task that cannot be executed is simply dropped. This policy is designed only for those rare cases in which task completion is never relied upon."
                  - listitem [ref=e190]:
                    - text: In
                    - link [ref=e191] [cursor=pointer]:
                      - /url: ThreadPoolExecutor.DiscardOldestPolicy.html
                      - code [ref=e192]: ThreadPoolExecutor.DiscardOldestPolicy
                    - text: ", if the executor is not shut down, the task at the head of the work queue is dropped, and then execution is retried (which can fail again, causing this to be repeated.) This policy is rarely acceptable. In nearly all cases, you should also cancel the task to cause an exception in any component waiting for its completion, and/or log the failure, as illustrated in"
                    - link [ref=e193] [cursor=pointer]:
                      - /url: ThreadPoolExecutor.DiscardOldestPolicy.html
                      - code [ref=e194]: ThreadPoolExecutor.DiscardOldestPolicy
                    - text: documentation.
                - text: It is possible to define and use other kinds of
                - link [ref=e195] [cursor=pointer]:
                  - /url: RejectedExecutionHandler.html
                  - code [ref=e196]: RejectedExecutionHandler
                - text: classes. Doing so requires some care especially when policies are designed to work only under particular capacity or queuing policies.
              - term [ref=e197]: Hook methods
              - definition [ref=e198]:
                - text: This class provides
                - code [ref=e199]: protected
                - text: overridable
                - link [ref=e200] [cursor=pointer]:
                  - /url: "#beforeExecute(java.lang.Thread,java.lang.Runnable)"
                  - code [ref=e201]: beforeExecute(Thread, Runnable)
                - text: and
                - link [ref=e202] [cursor=pointer]:
                  - /url: "#afterExecute(java.lang.Runnable,java.lang.Throwable)"
                  - code [ref=e203]: afterExecute(Runnable, Throwable)
                - text: methods that are called before and after execution of each task. These can be used to manipulate the execution environment; for example, reinitializing ThreadLocals, gathering statistics, or adding log entries. Additionally, method
                - link [ref=e204] [cursor=pointer]:
                  - /url: "#terminated()"
                  - code [ref=e205]: terminated()
                - text: can be overridden to perform any special processing that needs to be done once the Executor has fully terminated.
                - paragraph [ref=e206]: If hook, callback, or BlockingQueue methods throw exceptions, internal worker threads may in turn fail, abruptly terminate, and possibly be replaced.
              - term [ref=e207]: Queue maintenance
              - definition [ref=e208]:
                - text: Method
                - link [ref=e209] [cursor=pointer]:
                  - /url: "#getQueue()"
                  - code [ref=e210]: getQueue()
                - text: allows access to the work queue for purposes of monitoring and debugging. Use of this method for any other purpose is strongly discouraged. Two supplied methods,
                - link [ref=e211] [cursor=pointer]:
                  - /url: "#remove(java.lang.Runnable)"
                  - code [ref=e212]: remove(Runnable)
                - text: and
                - link [ref=e213] [cursor=pointer]:
                  - /url: "#purge()"
                  - code [ref=e214]: purge()
                - text: are available to assist in storage reclamation when large numbers of queued tasks become cancelled.
              - term [ref=e215]: Reclamation
              - definition [ref=e216]:
                - text: A pool that is no longer referenced in a program
                - emphasis [ref=e217]: AND
                - text: has no remaining threads may be reclaimed (garbage collected) without being explicitly shutdown. You can configure a pool to allow all unused threads to eventually die by setting appropriate keep-alive times, using a lower bound of zero core threads and/or setting
                - link [ref=e218] [cursor=pointer]:
                  - /url: "#allowCoreThreadTimeOut(boolean)"
                  - code [ref=e219]: allowCoreThreadTimeOut(boolean)
                - text: .
            - paragraph
            - paragraph [ref=e220]: "Extension example. Most extensions of this class override one or more of the protected hook methods. For example, here is a subclass that adds a simple pause/resume feature:"
            - code [ref=e222]: "class PausableThreadPoolExecutor extends ThreadPoolExecutor { private boolean isPaused; private ReentrantLock pauseLock = new ReentrantLock(); private Condition unpaused = pauseLock.newCondition(); public PausableThreadPoolExecutor(...) { super(...); } protected void beforeExecute(Thread t, Runnable r) { super.beforeExecute(t, r); pauseLock.lock(); try { while (isPaused) unpaused.await(); } catch (InterruptedException ie) { t.interrupt(); } finally { pauseLock.unlock(); } } public void pause() { pauseLock.lock(); try { isPaused = true; } finally { pauseLock.unlock(); } } public void resume() { pauseLock.lock(); try { isPaused = false; unpaused.signalAll(); } finally { pauseLock.unlock(); } } }"
            - paragraph
