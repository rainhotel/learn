          - generic [ref=e354]:
            - heading "Getting Started" [level=2] [ref=e355]
            - generic [ref=e356]:
              - paragraph [ref=e358]:
                - text: Spring Boot auto-configures a composite
                - link [ref=e359] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.micrometer/micrometer-core/1.17.0/io/micrometer/core/instrument/MeterRegistry.html
                  - code [ref=e360]: MeterRegistry
                - text: and adds a registry to the composite for each of the supported implementations that it finds on the classpath. Having a dependency on
                - code [ref=e361]: "micrometer-registry-{system}"
                - text: in your runtime classpath is enough for Spring Boot to configure the registry.
              - paragraph [ref=e363]: "Most registries share common features. For instance, you can disable a particular registry even if the Micrometer registry implementation is on the classpath. The following example disables Datadog:"
              - generic [ref=e365]:
                - tablist [ref=e367]:
                  - tab [selected] [ref=e368] [cursor=pointer]:
                    - paragraph [ref=e369]: Properties
                  - tab [ref=e370] [cursor=pointer]:
                    - paragraph [ref=e371]: YAML
                - tabpanel "Properties" [ref=e372]:
                  - generic [ref=e375]:
                    - code [ref=e376]: properties management.datadog.metrics.export.enabled=false
                    - button "Copied!" [ref=e378] [cursor=pointer]
                - text: yaml
              - paragraph [ref=e381]: "You can also disable all registries unless stated otherwise by the registry-specific property, as the following example shows:"
              - generic [ref=e383]:
                - tablist [ref=e385]:
                  - tab [selected] [ref=e386] [cursor=pointer]:
                    - paragraph [ref=e387]: Properties
                  - tab [ref=e388] [cursor=pointer]:
                    - paragraph [ref=e389]: YAML
                - tabpanel "Properties" [ref=e390]:
                  - generic [ref=e393]:
                    - code [ref=e394]: properties management.defaults.metrics.export.enabled=false
                    - button "Copied!" [ref=e396] [cursor=pointer]
                - text: yaml
              - paragraph [ref=e399]:
                - text: Spring Boot also adds any auto-configured registries to the global static composite registry on the
                - link [ref=e400] [cursor=pointer]:
                  - /url: https://javadoc.io/doc/io.micrometer/micrometer-core/1.17.0/io/micrometer/core/instrument/Metrics.html
                  - code [ref=e401]: Metrics
                - text: "class, unless you explicitly tell it not to:"
              - generic [ref=e403]:
                - tablist [ref=e405]:
                  - tab [selected] [ref=e406] [cursor=pointer]:
                    - paragraph [ref=e407]: Properties
                  - tab [ref=e408] [cursor=pointer]:
                    - paragraph [ref=e409]: YAML
                - tabpanel "Properties" [ref=e410]:
                  - generic [ref=e413]:
                    - code [ref=e414]: properties management.metrics.use-global-registry=false
                    - button "Copied!" [ref=e416] [cursor=pointer]
                - text: yaml
              - paragraph [ref=e419]:
                - text: You can register any number of
                - link [ref=e420] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/micrometer/metrics/autoconfigure/MeterRegistryCustomizer.html
