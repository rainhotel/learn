                - text: for more details.
              - paragraph [ref=e2306]:
                - text: Navigating to
                - code [ref=e2307]: /actuator/metrics
                - text: displays a list of available meter names. You can drill down to view information about a particular meter by providing its name as a selector — for example,
                - code [ref=e2308]: /actuator/metrics/jvm.memory.max
                - text: .
              - table [ref=e2310]:
                - rowgroup [ref=e2311]:
                  - row [ref=e2312]:
                    - cell "Tip" [ref=e2313]
                    - cell [ref=e2315]:
                      - paragraph [ref=e2317]:
                        - text: The name you use here should match the name used in the code, not the name after it has been naming-convention normalized for a monitoring system to which it is shipped. In other words, if
                        - code [ref=e2318]: jvm.memory.max
                        - text: appears as
                        - code [ref=e2319]: jvm_memory_max
                        - text: in Prometheus because of its snake case naming convention, you should still use
                        - code [ref=e2320]: jvm.memory.max
                        - text: as the selector when inspecting the meter in the
                        - code [ref=e2321]: metrics
                        - text: endpoint.
              - paragraph [ref=e2323]:
                - text: You can also add any number of
                - code [ref=e2324]: tag=KEY:VALUE
                - text: query parameters to the end of the URL to dimensionally drill down on a meter — for example,
                - code [ref=e2325]: /actuator/metrics/jvm.memory.max?tag=area:nonheap
                - text: .
              - table [ref=e2327]:
                - rowgroup [ref=e2328]:
                  - row [ref=e2329]:
                    - cell "Tip" [ref=e2330]
                    - cell [ref=e2332]:
                      - paragraph [ref=e2334]:
                        - text: The reported measurements are the
                        - emphasis [ref=e2335]: sum
                        - text: of the statistics of all meters that match the meter name and any tags that have been applied. In the preceding example, the returned
                        - code [ref=e2336]: Value
                        - text: statistic is the sum of the maximum memory footprints of the “Code Cache”, “Compressed Class Space”, and “Metaspace” areas of the heap. If you wanted to see only the maximum size for the “Metaspace”, you could add an additional
                        - code [ref=e2337]: tag=id:Metaspace
                        - text: — that is,
                        - code [ref=e2338]: /actuator/metrics/jvm.memory.max?tag=area:nonheap&tag=id:Metaspace
                        - text: .
