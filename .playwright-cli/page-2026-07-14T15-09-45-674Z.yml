                    - paragraph [ref=e403]:
                      - code [ref=e404]: scheduledtasks
                  - cell [ref=e405]:
                    - paragraph [ref=e406]: Displays the scheduled tasks in your application.
                - row [ref=e407]:
                  - cell [ref=e408]:
                    - paragraph [ref=e409]:
                      - code [ref=e410]: sessions
                  - cell [ref=e411]:
                    - paragraph [ref=e412]: Allows retrieval and deletion of user sessions from a Spring Session-backed session store. Requires a servlet-based web application that uses Spring Session.
                - row [ref=e413]:
