                    - paragraph [ref=e364]:
                      - text: Shows the Spring Integration graph. Requires a dependency on
                      - code [ref=e365]: spring-integration-core
                      - text: .
                - row [ref=e366]:
                  - cell [ref=e367]:
                    - paragraph [ref=e368]:
                      - code [ref=e369]: loggers
                  - cell [ref=e370]:
                    - paragraph [ref=e371]: Shows and modifies the configuration of loggers in the application.
                - row [ref=e372]:
                  - cell [ref=e373]:
