          - heading "Endpoints" [level=1] [ref=e255]
          - generic [ref=e257]:
            - paragraph [ref=e259]:
              - text: Actuator endpoints let you monitor and interact with your application. Spring Boot includes a number of built-in endpoints and lets you add your own. For example, the
              - code [ref=e260]: health
              - text: endpoint provides basic application health information.
            - paragraph [ref=e262]:
              - text: You can
              - link "control access" [ref=e263] [cursor=pointer]:
                - /url: "#actuator.endpoints.controlling-access"
              - text: to each individual endpoint and
              - link "expose them (make them remotely accessible) over HTTP or JMX" [ref=e264] [cursor=pointer]:
                - /url: "#actuator.endpoints.exposing"
              - text: . An endpoint is considered to be available when access to it is permitted and it is exposed. The built-in endpoints are auto-configured only when they are available. Most applications choose exposure over HTTP, where the ID of the endpoint and a prefix of
              - code [ref=e265]: /actuator
              - text: is mapped to a URL. For example, by default, the
              - code [ref=e266]: health
              - text: endpoint is mapped to
              - code [ref=e267]: /actuator/health
              - text: .
            - table [ref=e269]:
              - rowgroup [ref=e270]:
                - row [ref=e271]:
                  - cell "Tip" [ref=e272]
                  - cell [ref=e274]:
                    - text: To learn more about the Actuator’s endpoints and their request and response formats, see the
                    - link "API documentation" [ref=e275] [cursor=pointer]:
                      - /url: ../../api/rest/actuator/index.html
                    - text: .
            - paragraph [ref=e277]: "The following technology-agnostic endpoints are available:"
            - table [ref=e278]:
              - rowgroup [ref=e282]:
                - row [ref=e283]:
                  - columnheader "ID" [ref=e284]
                  - columnheader "Description" [ref=e285]
              - rowgroup [ref=e286]:
                - row [ref=e287]:
                  - cell [ref=e288]:
                    - paragraph [ref=e289]:
                      - code [ref=e290]: auditevents
                  - cell [ref=e291]:
                    - paragraph [ref=e292]:
                      - text: Exposes audit events information for the current application. Requires an
                      - link [ref=e293] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/actuate/audit/AuditEventRepository.html
                        - code [ref=e294]: AuditEventRepository
                      - text: bean.
                - row [ref=e295]:
                  - cell [ref=e296]:
                    - paragraph [ref=e297]:
                      - code [ref=e298]: beans
                  - cell [ref=e299]:
                    - paragraph [ref=e300]: Displays a complete list of all the Spring beans in your application.
                - row [ref=e301]:
                  - cell [ref=e302]:
                    - paragraph [ref=e303]:
                      - code [ref=e304]: caches
                  - cell [ref=e305]:
                    - paragraph [ref=e306]: Exposes available caches.
                - row [ref=e307]:
                  - cell [ref=e308]:
                    - paragraph [ref=e309]:
                      - code [ref=e310]: conditions
                  - cell [ref=e311]:
                    - paragraph [ref=e312]: Shows the conditions that were evaluated on configuration and auto-configuration classes and the reasons why they did or did not match.
                - row [ref=e313]:
                  - cell [ref=e314]:
                    - paragraph [ref=e315]:
                      - code [ref=e316]: configprops
                  - cell [ref=e317]:
                    - paragraph [ref=e318]:
                      - text: Displays a collated list of all
                      - link [ref=e319] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/context/properties/ConfigurationProperties.html
                        - code [ref=e320]: "@ConfigurationProperties"
                      - text: . Subject to
                      - link "sanitization" [ref=e321] [cursor=pointer]:
                        - /url: "#actuator.endpoints.sanitization"
                      - text: .
                - row [ref=e322]:
                  - cell [ref=e323]:
                    - paragraph [ref=e324]:
                      - code [ref=e325]: env
                  - cell [ref=e326]:
                    - paragraph [ref=e327]:
                      - text: Exposes properties from Spring’s
                      - link [ref=e328] [cursor=pointer]:
                        - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/core/env/ConfigurableEnvironment.html
                        - code [ref=e329]: ConfigurableEnvironment
                      - text: . Subject to
                      - link "sanitization" [ref=e330] [cursor=pointer]:
                        - /url: "#actuator.endpoints.sanitization"
                      - text: .
                - row [ref=e331]:
                  - cell [ref=e332]:
                    - paragraph [ref=e333]:
                      - code [ref=e334]: flyway
                  - cell [ref=e335]:
                    - paragraph [ref=e336]:
                      - text: Shows any Flyway database migrations that have been applied. Requires one or more
                      - link [ref=e337] [cursor=pointer]:
                        - /url: https://javadoc.io/doc/org.flywaydb/flyway-core/12.4.0/org/flywaydb/core/Flyway.html
                        - code [ref=e338]: Flyway
                      - text: beans.
                - row [ref=e339]:
                  - cell [ref=e340]:
                    - paragraph [ref=e341]:
                      - code [ref=e342]: health
                  - cell [ref=e343]:
                    - paragraph [ref=e344]: Shows application health information.
                - row [ref=e345]:
                  - cell [ref=e346]:
                    - paragraph [ref=e347]:
                      - code [ref=e348]: httpexchanges
                  - cell [ref=e349]:
