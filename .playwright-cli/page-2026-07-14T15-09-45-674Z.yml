                        - code [ref=e352]: HttpExchangeRepository
                      - text: bean.
                - row [ref=e353]:
                  - cell [ref=e354]:
                    - paragraph [ref=e355]:
                      - code [ref=e356]: info
                  - cell [ref=e357]:
                    - paragraph [ref=e358]: Displays arbitrary application info.
                - row [ref=e359]:
                  - cell [ref=e360]:
                    - paragraph [ref=e361]:
                      - code [ref=e362]: integrationgraph
