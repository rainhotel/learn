                        - /url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/web/bind/annotation/RequestMapping.html
                        - code [ref=e393]: "@RequestMapping"
                      - text: paths.
                - row [ref=e394]:
                  - cell [ref=e395]:
                    - paragraph [ref=e396]:
