                - paragraph [ref=e2013]: "Health groups can be made available at an additional path on either the main or management port. This is useful in cloud environments such as Kubernetes, where it is quite common to use a separate management port for the actuator endpoints for security purposes. Having a separate port could lead to unreliable health checks because the main application might not work properly even if the health check is successful. The health group can be configured with an additional path as follows:"
                - generic [ref=e2016]:
                  - code [ref=e2017]: properties management.endpoint.health.group.live.additional-path="server:/healthz"
                  - button "Copied!" [ref=e2019] [cursor=pointer]
                - paragraph [ref=e2022]:
                  - text: This would make the
                  - code [ref=e2023]: live
                  - text: health group available on the main server port at
                  - code [ref=e2024]: /healthz
                  - text: . The prefix is mandatory and must be either
                  - code [ref=e2025]: "server:"
                  - text: (represents the main server port) or
                  - code [ref=e2026]: "management:"
                  - text: (represents the management port, if configured.) The path must be a single path segment.
              - generic [ref=e2027]:
                - heading "DataSource Health" [level=3] [ref=e2028]
                - paragraph [ref=e2030]:
                  - text: The
                  - link [ref=e2031] [cursor=pointer]:
                    - /url: https://docs.oracle.com/en/java/javase/17/docs/api/java.sql/javax/sql/DataSource.html
                    - code [ref=e2032]: DataSource
                  - text: health indicator shows the health of both standard data sources and routing data source beans. The health of a routing data source includes the health of each of its target data sources. In the health endpoint’s response, each of a routing data source’s targets is named by using its routing key. If you prefer not to include routing data sources in the indicator’s output, set
                  - code [ref=e2033]: management.health.db.ignore-routing-data-sources
                  - text: to
                  - code [ref=e2034]: "true"
                  - text: .
          - generic [ref=e2035]:
            - heading "Kubernetes Probes" [level=2] [ref=e2036]
            - generic [ref=e2037]:
              - paragraph [ref=e2039]:
                - text: Applications deployed on Kubernetes can provide information about their internal state with
                - link "Container Probes" [ref=e2040] [cursor=pointer]:
                  - /url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
                - text: . Depending on
                - link "your Kubernetes configuration" [ref=e2041] [cursor=pointer]:
                  - /url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
                - text: ", the kubelet calls those probes and reacts to the result."
              - paragraph [ref=e2043]:
                - text: By default, Spring Boot manages your
                - link "Application Availability" [ref=e2044] [cursor=pointer]:
                  - /url: ../features/spring-application.html#features.spring-application.application-availability
                - text: state. If deployed in a Kubernetes environment, actuator gathers the “Liveness” and “Readiness” information from the
                - link [ref=e2045] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/availability/ApplicationAvailability.html
                  - code [ref=e2046]: ApplicationAvailability
                - text: interface and uses that information in dedicated
                - link "health indicators" [ref=e2047] [cursor=pointer]:
                  - /url: "#actuator.endpoints.health.auto-configured-health-indicators"
                - text: ":"
                - link [ref=e2048] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/health/application/LivenessStateHealthIndicator.html
                  - code [ref=e2049]: LivenessStateHealthIndicator
                - text: and
                - link [ref=e2050] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/health/application/ReadinessStateHealthIndicator.html
                  - code [ref=e2051]: ReadinessStateHealthIndicator
                - text: . These indicators are shown on the global health endpoint (
                - code [ref=e2052]: "\"/actuator/health\""
                - text: ). They are also exposed as separate HTTP Probes by using
                - link "health groups" [ref=e2053] [cursor=pointer]:
                  - /url: "#actuator.endpoints.health.groups"
                - text: ":"
                - code [ref=e2054]: "\"/actuator/health/liveness\""
                - text: and
                - code [ref=e2055]: "\"/actuator/health/readiness\""
                - text: .
              - paragraph [ref=e2057]: "You can then configure your Kubernetes infrastructure with the following endpoint information:"
              - generic [ref=e2060]:
                - code [ref=e2061]: "yaml livenessProbe: httpGet: path: \"/actuator/health/liveness\" port: <actuator-port> failureThreshold: ... periodSeconds: ... readinessProbe: httpGet: path: \"/actuator/health/readiness\" port: <actuator-port> failureThreshold: ... periodSeconds: ..."
                - button "Copied!" [ref=e2063] [cursor=pointer]
              - table [ref=e2066]:
                - rowgroup [ref=e2067]:
                  - row [ref=e2068]:
                    - cell "Note" [ref=e2069]
                    - cell [ref=e2071]:
                      - code [ref=e2072]: <actuator-port>
                      - text: should be set to the port that the actuator endpoints are available on. It could be the main web server port or a separate management port if the
                      - code [ref=e2073]: "\"management.server.port\""
                      - text: property has been set.
              - paragraph [ref=e2075]:
                - text: These health groups are automatically enabled. You can disable them by using the
                - code [ref=e2076]: management.endpoint.health.probes.enabled
                - text: configuration property.
              - table [ref=e2078]:
                - rowgroup [ref=e2079]:
                  - row [ref=e2080]:
                    - cell "Note" [ref=e2081]
                    - cell [ref=e2083]:
                      - text: If an application takes longer to start than the configured liveness period, Kubernetes
                      - link [ref=e2084] [cursor=pointer]:
                        - /url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#when-should-you-use-a-startup-probe
                        - text: mentions the
                        - code [ref=e2085]: "\"startupProbe\""
                        - text: as a possible solution
                      - text: . Generally speaking, the
                      - code [ref=e2086]: "\"startupProbe\""
                      - text: is not necessarily needed here as the
                      - code [ref=e2087]: "\"readinessProbe\""
                      - text: fails until all startup tasks are done. This means your application will not receive traffic until it is ready. However, if your application takes a long time to start, consider
                      - link [ref=e2088] [cursor=pointer]:
                        - /url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-startup-probes
                        - text: configuring a
                        - code [ref=e2089]: "\"startupProbe\""
                      - text: that uses the liveness HTTP probe to make sure that Kubernetes won’t kill your application while it is in the process of starting. See the section that describes
                      - link "how probes behave during the application lifecycle" [ref=e2090] [cursor=pointer]:
                        - /url: "#actuator.endpoints.kubernetes-probes.lifecycle"
                      - text: .
              - paragraph [ref=e2092]:
                - text: If your Actuator endpoints are deployed on a separate management context, the endpoints do not use the same web infrastructure (port, connection pools, framework components) as the main application. In this case, a probe check could be successful even if the main application does not work properly (for example, it cannot accept new connections). For this reason, it is a good idea to make the
                - code [ref=e2093]: liveness
                - text: and
                - code [ref=e2094]: readiness
                - text: "health groups available on the main server port. This can be done by setting the following property:"
              - generic [ref=e2097]:
                - code [ref=e2098]: properties management.endpoint.health.probes.add-additional-paths=true
                - button "Copied!" [ref=e2100] [cursor=pointer]
              - paragraph [ref=e2103]:
                - text: This would make the
                - code [ref=e2104]: liveness
                - text: group available at
                - code [ref=e2105]: /livez
                - text: and the
                - code [ref=e2106]: readiness
                - text: group available at
                - code [ref=e2107]: /readyz
                - text: on the main server port. Paths can be customized using the
                - code [ref=e2108]: additional-path
                - text: property on each group, see
                - link "health groups" [ref=e2109] [cursor=pointer]:
                  - /url: "#actuator.endpoints.health.groups"
                - text: for details.
              - generic [ref=e2110]:
                - heading "Checking External State With Kubernetes Probes" [level=3] [ref=e2111]
                - paragraph [ref=e2113]:
                  - text: Actuator configures the “liveness” and “readiness” probes as Health Groups. This means that all the
                  - link "health groups features" [ref=e2114] [cursor=pointer]:
                    - /url: "#actuator.endpoints.health.groups"
                  - text: "are available for them. You can, for example, configure additional Health Indicators:"
                - generic [ref=e2116]:
                  - tablist [ref=e2118]:
                    - tab [selected] [ref=e2119] [cursor=pointer]:
                      - paragraph [ref=e2120]: Properties
                    - tab [ref=e2121] [cursor=pointer]:
                      - paragraph [ref=e2122]: YAML
                  - tabpanel "Properties" [ref=e2123]:
                    - generic [ref=e2126]:
                      - code [ref=e2127]: properties management.endpoint.health.group.readiness.include=readinessState,customCheck
                      - button "Copied!" [ref=e2129] [cursor=pointer]
                  - text: yaml
                - paragraph [ref=e2132]: By default, Spring Boot does not add other health indicators to these groups.
                - paragraph [ref=e2134]:
                  - text: The “liveness” probe should not depend on health checks for external systems. If the
                  - link "liveness state of an application" [ref=e2135] [cursor=pointer]:
                    - /url: ../features/spring-application.html#features.spring-application.application-availability.liveness
                  - text: is broken, Kubernetes tries to solve that problem by restarting the application instance. This means that if an external system (such as a database, a Web API, or an external cache) fails, Kubernetes might restart all application instances and create cascading failures.
                - paragraph [ref=e2137]:
                  - text: As for the “readiness” probe, the choice of checking external systems must be made carefully by the application developers. For this reason, Spring Boot does not include any additional health checks in the readiness probe. If the
                  - link "readiness state of an application instance" [ref=e2138] [cursor=pointer]:
                    - /url: ../features/spring-application.html#features.spring-application.application-availability.readiness
                  - text: "is unready, Kubernetes does not route traffic to that instance. Some external systems might not be shared by application instances, in which case they could be included in a readiness probe. Other external systems might not be essential to the application (the application could have circuit breakers and fallbacks), in which case they definitely should not be included. Unfortunately, an external system that is shared by all application instances is common, and you have to make a judgement call: Include it in the readiness probe and expect that the application is taken out of service when the external service is down or leave it out and deal with failures higher up the stack, perhaps by using a circuit breaker in the caller."
                - table [ref=e2140]:
                  - rowgroup [ref=e2141]:
                    - row [ref=e2142]:
                      - cell "Note" [ref=e2143]
                      - cell [ref=e2145]:
                        - text: If all instances of an application are unready, a Kubernetes Service with
                        - code [ref=e2146]: type=ClusterIP
                        - text: or
                        - code [ref=e2147]: NodePort
                        - text: does not accept any incoming connections. There is no HTTP error response (503 and so on), since there is no connection. A service with
                        - code [ref=e2148]: type=LoadBalancer
                        - text: might or might not accept connections, depending on the provider. A service that has an explicit
                        - link "ingress" [ref=e2149] [cursor=pointer]:
                          - /url: https://kubernetes.io/docs/concepts/services-networking/ingress/
                        - text: also responds in a way that depends on the implementation — the ingress service itself has to decide how to handle the “connection refused” from downstream. HTTP 503 is quite likely in the case of both load balancer and ingress.
                - paragraph [ref=e2151]:
                  - text: Also, if an application uses Kubernetes
                  - link "autoscaling" [ref=e2152] [cursor=pointer]:
                    - /url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
                  - text: ", it may react differently to applications being taken out of the load-balancer, depending on its autoscaler configuration."
              - generic [ref=e2153]:
                - heading "Application Lifecycle and Probe States" [level=3] [ref=e2154]
                - paragraph [ref=e2156]:
                  - text: An important aspect of the Kubernetes Probes support is its consistency with the application lifecycle. There is a significant difference between the
                  - link [ref=e2157] [cursor=pointer]:
                    - /url: https://docs.spring.io/spring-boot/4.1.0/api/java/org/springframework/boot/availability/AvailabilityState.html
                    - code [ref=e2158]: AvailabilityState
                  - text: (which is the in-memory, internal state of the application) and the actual probe (which exposes that state). Depending on the phase of application lifecycle, the probe might not be available.
                - paragraph [ref=e2160]:
                  - text: Spring Boot publishes
                  - link "application events during startup and shutdown" [ref=e2161] [cursor=pointer]:
                    - /url: ../features/spring-application.html#features.spring-application.application-events-and-listeners
                  - text: ", and probes can listen to such events and expose the"
