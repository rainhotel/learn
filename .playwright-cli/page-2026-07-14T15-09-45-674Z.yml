                        - code [ref=e379]: Liquibase
                      - text: beans.
                - row [ref=e380]:
                  - cell [ref=e381]:
                    - paragraph [ref=e382]:
                      - code [ref=e383]: metrics
                  - cell [ref=e384]:
                    - paragraph [ref=e385]: Shows “metrics” information for the current application to diagnose the metrics the application has recorded.
                - row [ref=e386]:
                  - cell [ref=e387]:
                    - paragraph [ref=e388]:
                      - code [ref=e389]: mappings
                  - cell [ref=e390]:
                    - paragraph [ref=e391]:
                      - text: Displays a collated list of all
