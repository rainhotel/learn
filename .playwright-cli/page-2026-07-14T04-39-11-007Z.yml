      - main [ref=f1e163]:
        - navigation "breadcrumb" [ref=f1e164]:
          - list [ref=f1e165]:
            - listitem [ref=f1e166]:
              - link "AK 4.3.X" [ref=f1e167] [cursor=pointer]:
                - /url: /43/
            - listitem [ref=f1e168]:
              - text: /
              - link "Getting Started" [ref=f1e169] [cursor=pointer]:
                - /url: /43/getting-started/
            - listitem [ref=f1e170]: / Introduction
        - generic [ref=f1e171]:
          - heading "Introduction" [level=1] [ref=f1e172]
          - generic [ref=f1e174]:
            - heading "Tags:" [level=5] [ref=f1e175]
            - list [ref=f1e176]:
              - listitem [ref=f1e177]:
                - link "Kafka" [ref=f1e178] [cursor=pointer]:
                  - /url: https://kafka.apache.org/tags/kafka/
              - listitem [ref=f1e179]:
                - link "Docs" [ref=f1e180] [cursor=pointer]:
                  - /url: https://kafka.apache.org/tags/docs/
          - heading "What is event streaming?" [level=2] [ref=f1e181]
          - paragraph [ref=f1e182]: Event streaming is the digital equivalent of the human body’s central nervous system. It is the technological foundation for the ‘always-on’ world where businesses are increasingly software-defined and automated, and where the user of software is more software.
          - paragraph [ref=f1e183]: Technically speaking, event streaming is the practice of capturing data in real-time from event sources like databases, sensors, mobile devices, cloud services, and software applications in the form of streams of events; storing these event streams durably for later retrieval; manipulating, processing, and reacting to the event streams in real-time as well as retrospectively; and routing the event streams to different destination technologies as needed. Event streaming thus ensures a continuous flow and interpretation of data so that the right information is at the right place, at the right time.
          - heading "What can I use event streaming for?" [level=2] [ref=f1e184]
          - paragraph [ref=f1e185]:
            - text: Event streaming is applied to a
            - link "wide variety of use cases" [ref=f1e186] [cursor=pointer]:
              - /url: /powered-by
            - text: "across a plethora of industries and organizations. Its many examples include:"
          - list [ref=f1e187]:
            - listitem [ref=f1e188]: To process payments and financial transactions in real-time, such as in stock exchanges, banks, and insurances.
            - listitem [ref=f1e189]: To track and monitor cars, trucks, fleets, and shipments in real-time, such as in logistics and the automotive industry.
            - listitem [ref=f1e190]: To continuously capture and analyze sensor data from IoT devices or other equipment, such as in factories and wind parks.
            - listitem [ref=f1e191]: To collect and immediately react to customer interactions and orders, such as in retail, the hotel and travel industry, and mobile applications.
            - listitem [ref=f1e192]: To monitor patients in hospital care and predict changes in condition to ensure timely treatment in emergencies.
            - listitem [ref=f1e193]: To connect, store, and make available data produced by different divisions of a company.
            - listitem [ref=f1e194]: To serve as the foundation for data platforms, event-driven architectures, and microservices.
          - heading "Apache Kafka® is an event streaming platform. What does that mean?" [level=2] [ref=f1e195]
          - paragraph [ref=f1e196]:
            - text: Kafka combines three key capabilities so you can implement
            - link "your use cases" [ref=f1e197] [cursor=pointer]:
              - /url: /powered-by
            - text: "for event streaming end-to-end with a single battle-tested solution:"
          - list [ref=f1e198]:
            - listitem [ref=f1e199]:
              - text: To
              - strong [ref=f1e200]: publish
              - text: (write) and
              - strong [ref=f1e201]: subscribe to
              - text: (read) streams of events, including continuous import/export of your data from other systems.
            - listitem [ref=f1e202]:
              - text: To
              - strong [ref=f1e203]: store
              - text: streams of events durably and reliably for as long as you want.
            - listitem [ref=f1e204]:
              - text: To
              - strong [ref=f1e205]: process
              - text: streams of events as they occur or retrospectively.
          - paragraph [ref=f1e206]: And all this functionality is provided in a distributed, highly scalable, elastic, fault-tolerant, and secure manner. Kafka can be deployed on bare-metal hardware, virtual machines, and containers, and on-premises as well as in the cloud. You can choose between self-managing your Kafka environments and using fully managed services offered by a variety of vendors.
          - heading "How does Kafka work in a nutshell?" [level=2] [ref=f1e207]
          - paragraph [ref=f1e208]:
            - text: Kafka is a distributed system consisting of
            - strong [ref=f1e209]: servers
            - text: and
            - strong [ref=f1e210]: clients
            - text: that communicate via a high-performance
            - link "TCP network protocol" [ref=f1e211] [cursor=pointer]:
              - /url: /protocol.html
            - text: . It can be deployed on bare-metal hardware, virtual machines, and containers in on-premise as well as cloud environments.
          - paragraph [ref=f1e212]:
            - strong [ref=f1e213]: Servers
            - text: ": Kafka is run as a cluster of one or more servers that can span multiple datacenters or cloud regions. Some of these servers form the storage layer, called the brokers. Other servers run"
            - link "Kafka Connect" [ref=f1e214] [cursor=pointer]:
              - /url: /documentation/#connect
            - text: "to continuously import and export data as event streams to integrate Kafka with your existing systems such as relational databases as well as other Kafka clusters. To let you implement mission-critical use cases, a Kafka cluster is highly scalable and fault-tolerant: if any of its servers fails, the other servers will take over their work to ensure continuous operations without any data loss."
          - paragraph [ref=f1e215]:
            - strong [ref=f1e216]: Clients
            - text: ": They allow you to write distributed applications and microservices that read, write, and process streams of events in parallel, at scale, and in a fault-tolerant manner even in the case of network problems or machine failures. Kafka ships with some such clients included, which are augmented by"
            - link "dozens of clients" [ref=f1e217] [cursor=pointer]:
              - /url: https://cwiki.apache.org/confluence/x/3gDVAQ
            - text: "provided by the Kafka community: clients are available for Java and Scala including the higher-level"
            - link "Kafka Streams" [ref=f1e218] [cursor=pointer]:
              - /url: /documentation/streams/
            - text: library, for Go, Python, C/C++, and many other programming languages as well as REST APIs.
          - heading "Main Concepts and Terminology" [level=2] [ref=f1e219]
          - paragraph [ref=f1e220]:
            - text: An
            - strong [ref=f1e221]: event
            - text: "records the fact that “something happened” in the world or in your business. It is also called record or message in the documentation. When you read or write data to Kafka, you do this in the form of events. Conceptually, an event has a key, value, timestamp, and optional metadata headers. Here’s an example event:"
          - list [ref=f1e222]:
            - listitem [ref=f1e223]: "Event key: “Alice”"
            - listitem [ref=f1e224]: "Event value: “Made a payment of $200 to Bob”"
            - listitem [ref=f1e225]: "Event timestamp: “Jun. 25, 2020 at 2:06 p.m.”"
          - paragraph [ref=f1e226]:
            - strong [ref=f1e227]: Producers
            - text: are those client applications that publish (write) events to Kafka, and
            - strong [ref=f1e228]: consumers
            - text: are those that subscribe to (read and process) these events. In Kafka, producers and consumers are fully decoupled and agnostic of each other, which is a key design element to achieve the high scalability that Kafka is known for. For example, producers never need to wait for consumers. Kafka provides various
            - link "guarantees" [ref=f1e229] [cursor=pointer]:
              - /url: /documentation/#semantics
            - text: such as the ability to process events exactly-once.
          - paragraph [ref=f1e230]:
            - text: Events are organized and durably stored in
            - strong [ref=f1e231]: topics
            - text: ". Very simplified, a topic is similar to a folder in a filesystem, and the events are the files in that folder. An example topic name could be “payments”. Topics in Kafka are always multi-producer and multi-subscriber: a topic can have zero, one, or many producers that write events to it, as well as zero, one, or many consumers that subscribe to these events. Events in a topic can be read as often as needed-unlike traditional messaging systems, events are not deleted after consumption. Instead, you define for how long Kafka should retain your events through a per-topic configuration setting, after which old events will be discarded. Kafka’s performance is effectively constant with respect to data size, so storing data for a long time is perfectly fine."
          - paragraph [ref=f1e232]:
            - text: Topics are
            - strong [ref=f1e233]: partitioned
            - text: ", meaning a topic is spread over a number of “buckets” located on different Kafka brokers. This distributed placement of your data is very important for scalability because it allows client applications to both read and write the data from/to many brokers at the same time. When a new event is published to a topic, it is actually appended to one of the topic’s partitions. Events with the same event key (e.g., a customer or vehicle ID) are written to the same partition, and Kafka"
            - link "guarantees" [ref=f1e234] [cursor=pointer]:
              - /url: /documentation/#semantics
            - text: that any consumer of a given topic-partition will always read that partition’s events in exactly the same order as they were written.
          - paragraph [ref=f1e235]: "Figure: This example topic has four partitions P1-P4. Two different producer clients are publishing, independently from each other, new events to the topic by writing events over the network to the topic’s partitions. Events with the same key (denoted by their color in the figure) are written to the same partition. Note that both producers can write to the same partition if appropriate."
          - paragraph [ref=f1e237]:
            - text: To make your data fault-tolerant and highly-available, every topic can be
            - strong [ref=f1e238]: replicated
            - text: ", even across geo-regions or datacenters, so that there are always multiple brokers that have a copy of the data just in case things go wrong, you want to do maintenance on the brokers, and so on. A common production setting is a replication factor of 3, i.e., there will always be three copies of your data. This replication is performed at the level of topic-partitions."
          - paragraph [ref=f1e239]:
            - text: This primer should be sufficient for an introduction. The
            - link "Design" [ref=f1e240] [cursor=pointer]:
              - /url: /documentation/#design
            - text: section of the documentation explains Kafka’s various concepts in full detail, if you are interested.
          - heading "Kafka APIs" [level=2] [ref=f1e241]
          - paragraph [ref=f1e242]: "In addition to command line tooling for management and administration tasks, Kafka has five core APIs for Java and Scala:"
          - list [ref=f1e243]:
            - listitem [ref=f1e244]:
              - text: The
              - link "Admin API" [ref=f1e245] [cursor=pointer]:
                - /url: /documentation.html#adminapi
              - text: to manage and inspect topics, brokers, and other Kafka objects.
            - listitem [ref=f1e246]:
              - text: The
              - link "Producer API" [ref=f1e247] [cursor=pointer]:
                - /url: /documentation.html#producerapi
              - text: to publish (write) a stream of events to one or more Kafka topics.
            - listitem [ref=f1e248]:
              - text: The
              - link "Consumer API" [ref=f1e249] [cursor=pointer]:
                - /url: /documentation.html#consumerapi
              - text: to subscribe to (read) one or more topics and to process the stream of events produced to them.
            - listitem [ref=f1e250]:
              - text: The
              - link "Kafka Streams API" [ref=f1e251] [cursor=pointer]:
                - /url: /documentation/streams
              - text: to implement stream processing applications and microservices. It provides higher-level functions to process event streams, including transformations, stateful operations like aggregations and joins, windowing, processing based on event-time, and more. Input is read from one or more topics in order to generate output to one or more topics, effectively transforming the input streams to output streams.
            - listitem [ref=f1e252]:
              - text: The
              - link "Kafka Connect API" [ref=f1e253] [cursor=pointer]:
                - /url: /documentation.html#connect
              - text: to build and run reusable data import/export connectors that consume (read) or produce (write) streams of events from and to external systems and applications so they can integrate with Kafka. For example, a connector to a relational database like PostgreSQL might capture every change to a set of tables. However, in practice, you typically don’t need to implement your own connectors because the Kafka community already provides hundreds of ready-to-use connectors.
          - heading "Where to go from here" [level=2] [ref=f1e254]
          - list [ref=f1e255]:
            - listitem [ref=f1e256]:
              - text: To get hands-on experience with Kafka, follow the
              - link "Quickstart" [ref=f1e257] [cursor=pointer]:
                - /url: /quickstart
              - text: .
            - listitem [ref=f1e258]:
              - text: To understand Kafka in more detail, read the
              - link "Documentation" [ref=f1e259] [cursor=pointer]:
                - /url: /documentation/
              - text: . You also have your choice of
              - link "Kafka books and academic papers" [ref=f1e260] [cursor=pointer]:
                - /url: /books-and-papers
              - text: .
            - listitem [ref=f1e261]:
              - text: Browse through the
              - link "Use Cases" [ref=f1e262] [cursor=pointer]:
                - /url: /powered-by
              - text: to learn how other users in our world-wide community are getting value out of Kafka.
            - listitem [ref=f1e263]:
              - text: Join a
              - link "local Kafka meetup group" [ref=f1e264] [cursor=pointer]:
