                - generic [ref=e1046]:
                  - heading "Why CC Switch?" [level=2] [ref=e1047]
                  - 'link "Permalink: Why CC Switch?" [ref=e1048] [cursor=pointer]':
                    - /url: "#why-cc-switch"
                - paragraph [ref=e1051]:
                  - text: Modern AI-powered coding relies on tools like Claude Code, Claude Desktop, Codex, Gemini CLI, OpenCode, OpenClaw, and Hermes — but each has its own configuration format. Switching API providers means manually editing JSON, TOML, or
                  - code [ref=e1052]: .env
                  - text: files, and there is no unified way to manage MCP and Skills across multiple tools.
                - paragraph [ref=e1053]:
                  - strong [ref=e1054]: CC Switch
                  - text: gives you a single desktop app to manage all supported AI tools. Instead of editing config files by hand, you get a visual interface to import providers with one click, switch between them instantly, with 50+ built-in provider presets, unified MCP and Skills management, and system tray quick switching — all backed by a reliable SQLite database with atomic writes that protect your configs from corruption.
                - list [ref=e1055]:
                  - listitem [ref=e1056]:
                    - strong [ref=e1057]: One App, Seven Tools
                    - text: — Manage Claude Code, Claude Desktop, Codex, Gemini CLI, OpenCode, OpenClaw, and Hermes from a single interface
                  - listitem [ref=e1058]:
                    - strong [ref=e1059]: No More Manual Editing
                    - text: — 50+ provider presets including AWS Bedrock, NVIDIA NIM, and community relays; just pick and switch
                  - listitem [ref=e1060]:
                    - strong [ref=e1061]: Unified MCP & Skills Management
                    - text: — One panel to manage MCP servers and Skills across Claude, Codex, Gemini, OpenCode, and Hermes with bidirectional sync
                  - listitem [ref=e1062]:
                    - strong [ref=e1063]: System Tray Quick Switch
                    - text: — Switch providers instantly from the tray menu, no need to open the full app
                  - listitem [ref=e1064]:
                    - strong [ref=e1065]: Cloud Sync
                    - text: — Sync provider data across devices via Dropbox, OneDrive, iCloud, or WebDAV servers
                  - listitem [ref=e1066]:
                    - strong [ref=e1067]: Cross-Platform
                    - text: — Native desktop app for Windows, macOS, and Linux, built with Tauri 2
                  - listitem [ref=e1068]:
                    - strong [ref=e1069]: Built-in Utilities
                    - text: — Includes various utilities for first-launch login confirmation, signature bypass, plugin extension sync, and more
