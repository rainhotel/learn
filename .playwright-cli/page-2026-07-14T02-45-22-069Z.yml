          - text: to
          - link "event processing" [ref=e141] [cursor=pointer]:
            - /url: /docs/latest/develop/data-types/streams/
          - text: . Below is a short description of each data type, with links to broader overviews and command references. Each overview includes a comprehensive tutorial with code samples.
