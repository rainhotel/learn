        - paragraph [ref=e408]:
          - link "Redis vector sets" [ref=e409] [cursor=pointer]:
            - /url: /docs/latest/develop/data-types/vector-sets/
          - text: are a specialized data type designed for managing high-dimensional vector data, enabling fast and efficient vector similarity search within Redis. Vector sets are optimized for use cases involving machine learning, recommendation systems, and semantic search, where each vector represents a data point in multi-dimensional space. Vector sets supports the
          - link "HNSW" [ref=e410] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Hierarchical_navigable_small_world
          - text: (hierarchical navigable small world) algorithm, allowing you to store, index, and query vectors based on the cosine similarity metric. With vector sets, Redis provides native support for hybrid search, combining vector similarity with structured
          - link "filters" [ref=e411] [cursor=pointer]:
            - /url: /docs/latest/develop/data-types/vector-sets/filtered-search/
          - text: ". For more information, see:"
        - list [ref=e412]:
