          - generic [ref=e319]:
            - heading "Function-tracking Timers" [level=2] [ref=e320]
            - generic [ref=e321]:
              - paragraph [ref=e323]: "Micrometer also provides a more infrequently used timer pattern that tracks two monotonically increasing functions (a function that stays the same or increases over time but never decreases): a count function and a total time function. Some monitoring systems, such as Prometheus, push cumulative values for counters (which apply to both the count and total time functions in this case) to the backend, but others publish the rate at which a counter increments over the push interval. By employing this pattern, you let the Micrometer implementation for your monitoring system choose whether to rate normalize the timer, and your timer remains portable across different types of monitoring systems."
              - generic [ref=e326]:
                - code [ref=e327]:
                  - text: java IMap<?, ?> cache = ...; // suppose we have a Hazelcast cache registry.more().timer("cache.gets.latency", Tags.of("name", cache.getName()), cache, c -> c.getLocalMapStats().getGetOperationCount(),
                  - generic [ref=e328]: "1"
                  - text: c -> c.getLocalMapStats().getTotalGetLatency(), TimeUnit.NANOSECONDS
                  - generic [ref=e329]: "2"
                  - text: );
                - button "Copied!" [ref=e331] [cursor=pointer]
              - table [ref=e334]:
                - rowgroup [ref=e335]:
                  - row [ref=e336]:
                    - cell "1" [ref=e337]
                    - cell [ref=e339]:
                      - code [ref=e340]: getGetOperationCount()
                      - text: is a monotonically increasing function incrementing with every cache get from the beginning of its life.
                  - row [ref=e341]:
                    - cell "2" [ref=e342]
                    - cell [ref=e344]:
                      - text: This represents the unit of time represented by
                      - code [ref=e345]: getTotalGetLatency()
                      - text: . Each registry implementation specifies what its expected base unit of time is, and the total time reported will be scaled to this value.
              - paragraph [ref=e347]:
                - text: The function-tracking timer, in concert with the monitoring system’s rate normalizing functionality (whether this is an artifact of the query language or the way data is pushed to the system), adds a layer of richness to the cumulative value of the functions themselves. You can reason about the
                - emphasis [ref=e348]: rate
                - text: of throughput and latency, whether that rate is within an acceptable bound, is increasing or decreasing over time, and so on.
              - table [ref=e350]:
                - rowgroup [ref=e351]:
                  - row [ref=e352]:
                    - cell "Warning" [ref=e353]
                    - cell "Micrometer cannot guarantee the monotonicity of the count and total time functions for you. By using this signature, you are asserting their monotonicity based on what you know about their definitions." [ref=e355]
              - paragraph [ref=e357]:
                - text: There is also a fluent builder for function timers on the
                - code [ref=e358]: FunctionTimer
                - text: interface itself, providing access to less frequently used options, such as base units and description. You can register the timer as the last step of its construction by calling
                - code [ref=e359]: register(MeterRegistry)
                - text: ":"
              - generic [ref=e362]:
