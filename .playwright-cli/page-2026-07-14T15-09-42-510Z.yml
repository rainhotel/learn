          - heading "Timers" [level=1] [ref=e132]
          - generic [ref=e134]:
            - paragraph [ref=e136]:
              - text: Timers are intended for measuring short-duration latencies and the frequency of such events. All implementations of
              - code [ref=e137]: Timer
              - text: report at least the total time and the count of events as separate time series but other time series can also be reported depending on what is supported by the backend (max, percentiles, histograms). While you can use timers for other use cases, note that negative values are not supported, and recording many longer durations could cause overflow of the total time at
              - code [ref=e138]: Long.MAX_VALUE
              - text: nanoseconds (292.3 years).
            - paragraph [ref=e140]: As an example, consider a graph showing request latency to a typical web server. The server can be expected to respond to many requests quickly, so the timer gets updated many times per second.
            - paragraph [ref=e142]:
              - text: The appropriate base unit for timers varies by metrics backend, and for good reason. Micrometer is decidedly un-opinionated about this. However, because of the potential for confusion, Micrometer requires a
              - code [ref=e143]: TimeUnit
              - text: when interacting with
              - code [ref=e144]: Timer
              - text: implementations. Micrometer is aware of the preferences of each implementation and publishes your timing in the appropriate base unit, based on the implementation. The following listing shows part of the
              - code [ref=e145]: Timer
              - text: "interface:"
            - generic [ref=e148]:
              - code [ref=e149]:
                - text: java public
                - generic [ref=e150]: interface Timer extends Meter
                - text: "{ ..."
                - generic [ref=e151]:
                  - text: void record
                  - generic [ref=e152]: (long amount, TimeUnit unit)
                - text: ;
                - generic [ref=e153]: void record(Duration duration)
                - text: ;
                - generic [ref=e154]: double totalTime(TimeUnit unit)
                - text: "; }"
              - button "Copied!" [ref=e156] [cursor=pointer]
            - paragraph [ref=e159]: "The interface contains a fluent builder for timers:"
            - generic [ref=e162]:
              - code [ref=e163]: java Timer timer = Timer .builder("my.timer") .description("a description of what this timer does") // optional .tags("region", "test") // optional .register(registry);
              - button "Copied!" [ref=e165] [cursor=pointer]
            - table [ref=e168]:
              - rowgroup [ref=e169]:
                - row [ref=e170]:
                  - cell "Note" [ref=e171]
                  - cell [ref=e173]:
                    - text: The maximum statistical value for basic
                    - code [ref=e174]: Timer
                    - text: implementations, such as
                    - code [ref=e175]: CumulativeTimer
                    - text: and
                    - code [ref=e176]: StepTimer
                    - text: ", is a time window maximum ("
                    - code [ref=e177]: TimeWindowMax
                    - text: ). It means that its value is the maximum value during a time window. If no new values are recorded for the time window length, the max is reset to 0 as a new time window starts. The time window size until values are fully expired is the
                    - code [ref=e178]: expiry
                    - text: multiplied by the
                    - code [ref=e179]: bufferLength
                    - text: in
                    - code [ref=e180]: DistributionStatisticConfig
                    - text: .
                    - code [ref=e181]: expiry
                    - text: defaults to the step size of the meter registry unless it’s explicitly set to a different value, and
                    - code [ref=e182]: bufferLength
                    - text: defaults to
                    - code [ref=e183]: "3"
                    - text: . A time window maximum is used to capture maximum latency in a subsequent interval after heavy resource pressure triggers the latency and prevents metrics from being published. Percentiles are also time window percentiles (
                    - code [ref=e184]: TimeWindowPercentileHistogram
                    - text: ). Histogram buckets usually behave like counters, so depending on the backend, they can be reported as cumulative values (for example in the case of Prometheus) or as a rate at which a counter increments over the push interval.
