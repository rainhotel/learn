          - generic [ref=e385]:
            - heading "Pause Detection" [level=2] [ref=e386]
            - generic [ref=e387]:
              - paragraph [ref=e389]:
                - text: Micrometer uses the
                - code [ref=e390]: LatencyUtils
                - text: package to compensate for
                - link "coordinated omission" [ref=e391] [cursor=pointer]:
                  - /url: https://highscalability.com/blog/2015/10/5/your-load-generator-is-probably-lying-to-you-take-the-red-pi.html
                - text: — extra latency arising from system and VM pauses that skew your latency statistics downward. Distribution statistics, such as percentiles and SLO counts, are influenced by a pause detector implementation that adds additional latency here and there to compensate for pauses.
              - paragraph [ref=e393]: "Micrometer supports two pause detector implementations: a clock-drift based detector and a no-op detector. The no-op detector is configured by default, but the clock-drift detector can be configured as shown in the next example."
              - paragraph [ref=e395]:
                - text: The clock-drift based detector has a configurable sleep interval and pause threshold. CPU consumption is inversely proportional to
                - code [ref=e396]: sleepInterval
                - text: ", as is pause detection accuracy. 100ms for both values is a reasonable default to offer decent detection of long pause events while consuming a negligible amount of CPU time."
              - table [ref=e398]:
                - rowgroup [ref=e399]:
                  - row [ref=e400]:
                    - cell "Note" [ref=e401]
                    - cell [ref=e403]:
                      - text: You need to add LatencyUtils(
                      - code [ref=e404]: org.latencyutils:LatencyUtils
                      - text: ) to your runtime classpath to use the
                      - code [ref=e405]: ClockDriftPauseDetector
                      - text: . Without it on the runtime classpath, a warning will be logged and no pause detection will happen.
              - paragraph [ref=e407]: "You can customize the pause detector as follows:"
              - generic [ref=e410]:
                - code [ref=e411]: java registry.config().pauseDetector(new ClockDriftPauseDetector(sleepInterval, pauseThreshold)); registry.config().pauseDetector(new NoPauseDetector());
                - button "Copied!" [ref=e413] [cursor=pointer]
              - paragraph [ref=e416]: In the future, we may provide further detector implementations. Some pauses may be able to be inferred from GC logging in some circumstances, for example, without requiring a constant CPU load, however minimal. Also, a future JDK may provide direct access to pause events.
          - generic [ref=e417]:
            - heading "Memory Footprint Estimation" [level=2] [ref=e418]
            - generic [ref=e419]:
              - paragraph [ref=e421]: Timers are the most memory-consuming meter, and their total footprint can vary dramatically, depending on which options you choose. The following table of memory consumption is based on the use of various features. These figures assume no tags and a ring buffer length of 3. Adding tags adds somewhat to the total, as does increasing the buffer length. Total storage can also vary somewhat, depending on the registry implementation.
              - list [ref=e423]:
                - listitem [ref=e424]:
                  - paragraph [ref=e425]:
                    - text: R = Ring buffer length. We assume the default of 3 in all examples. R is set with
                    - code [ref=e426]: Timer.Builder#distributionStatisticBufferLength
                    - text: .
                - listitem [ref=e427]:
                  - paragraph [ref=e428]: B = Total histogram buckets. Can be SLO boundaries or percentile histogram buckets. By default, timers are clamped to a minimum expected value of 1ms and a maximum expected value of 30 seconds, yielding 66 buckets for percentile histograms, when applicable.
                - listitem [ref=e429]:
                  - paragraph [ref=e430]: I = Interval estimator for pause compensation. 1.7 kb.
                - listitem [ref=e431]:
                  - paragraph [ref=e432]: M = Time-decaying max. 104 bytes.
                - listitem [ref=e433]:
                  - paragraph [ref=e434]: Fb = Fixed boundary histogram. 8b * B * R.
                - listitem [ref=e435]:
                  - paragraph [ref=e436]:
                    - text: Pp = Percentile precision. By default, it is 1. Generally in the range [0, 3]. Pp is set with
                    - code [ref=e437]: Timer.Builder#percentilePrecision
                    - text: .
                - listitem [ref=e438]:
                  - paragraph [ref=e439]: Hdr(Pp) = High dynamic range histogram.
