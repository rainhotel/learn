          - generic [ref=e343]:
            - heading "Redis Cache Expiration" [level=2] [ref=e344]
            - generic [ref=e345]:
              - paragraph [ref=e347]: The implementation of time-to-idle (TTI) as well as time-to-live (TTL) varies in definition and behavior even across different data stores.
              - paragraph [ref=e349]: "In general:"
              - list [ref=e351]:
                - listitem [ref=e352]:
                  - paragraph [ref=e353]:
                    - emphasis [ref=e354]: time-to-live
                    - text: (TTL)
                    - emphasis [ref=e355]: expiration
                    - text: "- TTL is only set and reset by a create or update data access operation. As long as the entry is written before the TTL expiration timeout, including on creation, an entry’s timeout will reset to the configured duration of the TTL expiration timeout. For example, if the TTL expiration timeout is set to 5 minutes, then the timeout will be set to 5 minutes on entry creation and reset to 5 minutes anytime the entry is updated thereafter and before the 5-minute interval expires. If no update occurs within 5 minutes, even if the entry was read several times, or even just read once during the 5-minute interval, the entry will still expire. The entry must be written to prevent the entry from expiring when declaring a TTL expiration policy."
                - listitem [ref=e356]:
                  - paragraph [ref=e357]:
                    - emphasis [ref=e358]: time-to-idle
                    - text: (TTI)
                    - emphasis [ref=e359]: expiration
                    - text: "- TTI is reset anytime the entry is also read as well as for entry updates, and is effectively and extension to the TTL expiration policy."
              - table [ref=e361]:
                - rowgroup [ref=e362]:
                  - row [ref=e363]:
                    - cell "Note" [ref=e364]
                    - cell [ref=e366]:
                      - paragraph [ref=e368]: "Some data stores expire an entry when TTL is configured no matter what type of data access operation occurs on the entry (reads, writes, or otherwise). After the set, configured TTL expiration timeout, the entry is evicted from the data store regardless. Eviction actions (for example: destroy, invalidate, overflow-to-disk (for persistent stores), etc.) are data store specific."
              - generic [ref=e369]:
                - heading "Time-To-Live (TTL) Expiration" [level=3] [ref=e370]
                - paragraph [ref=e372]:
                  - text: Spring Data Redis’s
                  - code [ref=e373]: Cache
                  - text: implementation supports
                  - emphasis [ref=e374]: time-to-live
                  - text: (TTL) expiration on cache entries. Users can either configure the TTL expiration timeout with a fixed
                  - code [ref=e375]: Duration
                  - text: or a dynamically computed
                  - code [ref=e376]: Duration
                  - text: per cache entry by supplying an implementation of the new
                  - code [ref=e377]: RedisCacheWriter.TtlFunction
                  - text: interface.
                - table [ref=e379]:
                  - rowgroup [ref=e380]:
                    - row [ref=e381]:
                      - cell "Tip" [ref=e382]
                      - cell [ref=e384]:
                        - paragraph [ref=e386]:
                          - text: The
                          - code [ref=e387]: RedisCacheWriter.TtlFunction
                          - text: interface was introduced in Spring Data Redis
                          - code [ref=e388]: 3.2.0
                          - text: .
                - paragraph [ref=e390]:
                  - text: If all cache entries should expire after a set duration of time, then simply configure a TTL expiration timeout with a fixed
                  - code [ref=e391]: Duration
                  - text: ", as follows:"
                - generic [ref=e394]:
                  - code [ref=e395]: java RedisCacheConfiguration fiveMinuteTtlExpirationDefaults = RedisCacheConfiguration.defaultCacheConfig().enableTtl(Duration.ofMinutes(5));
                  - button "Copied!" [ref=e397] [cursor=pointer]
                - paragraph [ref=e400]:
                  - text: However, if the TTL expiration timeout should vary by cache entry, then you must provide a custom implementation of the
                  - code [ref=e401]: RedisCacheWriter.TtlFunction
                  - text: "interface:"
                - generic [ref=e404]:
                  - code [ref=e405]:
                    - text: "java enum MyCustomTtlFunction implements TtlFunction { INSTANCE; @Override"
                    - generic [ref=e406]: public Duration getTimeToLive(Object key, @Nullable Object value)
                    - text: "{ // compute a TTL expiration timeout (Duration) based on the cache entry key and/or value } }"
                  - button "Copied!" [ref=e408] [cursor=pointer]
                - table [ref=e411]:
                  - rowgroup [ref=e412]:
                    - row [ref=e413]:
                      - cell "Note" [ref=e414]
                      - cell [ref=e416]:
                        - paragraph [ref=e418]:
                          - text: Under-the-hood, a fixed
                          - code [ref=e419]: Duration
                          - text: TTL expiration is wrapped in a
                          - code [ref=e420]: TtlFunction
                          - text: implementation returning the provided
                          - code [ref=e421]: Duration
                          - text: .
                - paragraph [ref=e423]:
                  - text: Then, you can either configure the fixed
                  - code [ref=e424]: Duration
                  - text: or the dynamic, per-cache entry
                  - code [ref=e425]: Duration
                  - text: "TTL expiration on a global basis using:"
                - generic [ref=e426]:
                  - generic [ref=e427]: Global fixed Duration TTL expiration timeout
                  - generic [ref=e429]:
                    - code [ref=e430]: java RedisCacheManager cacheManager = RedisCacheManager.builder(redisConnectionFactory) .cacheDefaults(fiveMinuteTtlExpirationDefaults) .build();
                    - button "Copied!" [ref=e432] [cursor=pointer]
                - paragraph [ref=e435]: "Or, alternatively:"
                - generic [ref=e436]:
                  - generic [ref=e437]: Global, dynamically computed per-cache entry Duration TTL expiration timeout
                  - generic [ref=e439]:
                    - code [ref=e440]: java RedisCacheConfiguration defaults = RedisCacheConfiguration.defaultCacheConfig() .entryTtl(MyCustomTtlFunction.INSTANCE); RedisCacheManager cacheManager = RedisCacheManager.builder(redisConnectionFactory) .cacheDefaults(defaults) .build();
                    - button "Copied!" [ref=e442] [cursor=pointer]
                - paragraph [ref=e445]: "Of course, you can combine both global and per-cache configuration using:"
                - generic [ref=e446]:
                  - generic [ref=e447]: Global fixed Duration TTL expiration timeout
                  - generic [ref=e449]:
                    - code [ref=e450]: java RedisCacheConfiguration predefined = RedisCacheConfiguration.defaultCacheConfig() .entryTtl(MyCustomTtlFunction.INSTANCE); Map<String, RedisCacheConfiguration> initialCaches = Collections.singletonMap("predefined", predefined); RedisCacheManager cacheManager = RedisCacheManager.builder(redisConnectionFactory) .cacheDefaults(fiveMinuteTtlExpirationDefaults) .withInitialCacheConfigurations(initialCaches) .build();
                    - button "Copied!" [ref=e452] [cursor=pointer]
              - generic [ref=e454]:
                - heading "Time-To-Idle (TTI) Expiration" [level=3] [ref=e455]
                - paragraph [ref=e457]: Redis itself does not support the concept of true, time-to-idle (TTI) expiration. Still, using Spring Data Redis’s Cache implementation, it is possible to achieve time-to-idle (TTI) expiration-like behavior.
                - paragraph [ref=e459]:
                  - text: The configuration of TTI in Spring Data Redis’s Cache implementation must be explicitly enabled, that is, is opt-in. Additionally, you must also provide TTL configuration using either a fixed
                  - code [ref=e460]: Duration
                  - text: or a custom implementation of the
                  - code [ref=e461]: TtlFunction
                  - text: interface as described above in
                  - link "Redis Cache Expiration" [ref=e462] [cursor=pointer]:
                    - /url: "#redis:support:cache-abstraction:expiration"
                  - text: .
                - paragraph [ref=e464]: "For example:"
                - generic [ref=e467]:
                  - code [ref=e468]:
                    - text: java @Configuration @EnableCaching
                    - generic [ref=e469]: class RedisConfiguration
                    - text: "{ @Bean"
                    - generic [ref=e470]: RedisConnectionFactory redisConnectionFactory()
                    - text: "{ // ... } @Bean"
                    - generic [ref=e471]: RedisCacheManager cacheManager(RedisConnectionFactory connectionFactory)
                    - text: "{ RedisCacheConfiguration defaults = RedisCacheConfiguration.defaultCacheConfig() .entryTtl(Duration.ofMinutes(5)) .enableTimeToIdle(); return RedisCacheManager.builder(connectionFactory) .cacheDefaults(defaults) .build(); } }"
                  - button "Copied!" [ref=e473] [cursor=pointer]
                - paragraph [ref=e476]:
                  - text: Because Redis servers do not implement a proper notion of TTI, then TTI can only be achieved with Redis commands accepting expiration options. In Redis, the "expiration" is technically a time-to-live (TTL) policy. However, TTL expiration can be passed when reading the value of a key thereby effectively resetting the TTL expiration timeout, as is now the case in Spring Data Redis’s
                  - code [ref=e477]: Cache.get(key)
                  - text: operation.
                - paragraph [ref=e479]:
                  - code [ref=e480]: RedisCache.get(key)
                  - text: is implemented by calling the Redis
                  - code [ref=e481]: GETEX
                  - text: command.
                - table [ref=e483]:
                  - rowgroup [ref=e484]:
                    - row [ref=e485]:
                      - cell "Warning" [ref=e486]
                      - cell [ref=e488]:
                        - paragraph [ref=e490]:
                          - text: The Redis
                          - link [ref=e491] [cursor=pointer]:
                            - /url: https://redis.io/commands/getex
                            - code [ref=e492]: GETEX
                          - text: command is only available in Redis version
                          - code [ref=e493]: 6.2.0
                          - text: and later. Therefore, if you are not using Redis
                          - code [ref=e494]: 6.2.0
                          - text: or later, then it is not possible to use Spring Data Redis’s TTI expiration. A command execution exception will be thrown if you enable TTI against an incompatible Redis (server) version. No attempt is made to determine if the Redis server version is correct and supports the
                          - code [ref=e495]: GETEX
                          - text: command.
                - table [ref=e497]:
                  - rowgroup [ref=e498]:
                    - row [ref=e499]:
                      - cell "Warning" [ref=e500]
                      - cell [ref=e502]:
                        - paragraph [ref=e504]:
                          - text: "In order to achieve true time-to-idle (TTI) expiration-like behavior in your Spring Data Redis application, then an entry must be consistently accessed with (TTL) expiration on every read or write operation. There are no exceptions to this rule. If you are mixing and matching different data access patterns across your Spring Data Redis application (for example: caching, invoking operations using"
                          - code [ref=e505]: RedisTemplate
                          - text: and possibly, or especially when using Spring Data Repository CRUD operations), then accessing an entry may not necessarily prevent the entry from expiring if TTL expiration was set. For example, an entry maybe "put" in (written to) the cache during a
                          - code [ref=e506]: "@Cacheable"
                          - text: service method invocation with a TTL expiration (i.e.
                          - code [ref=e507]: SET <expiration options>
                          - text: ) and later read using a Spring Data Redis Repository before the expiration timeout (using
                          - code [ref=e508]: GET
                          - text: without expiration options). A simple
                          - code [ref=e509]: GET
                          - text: without specifying expiration options will not reset the TTL expiration timeout on an entry. Therefore, the entry may expire before the next data access operation, even though it was just read. Since this cannot be enforced in the Redis server, then it is the responsibility of your application to consistently access an entry when time-to-idle expiration is configured, in and outside of caching, where appropriate.
