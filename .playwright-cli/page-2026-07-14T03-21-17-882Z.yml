          - heading "Redis Cache" [level=1] [ref=e134]
          - generic [ref=e136]:
            - paragraph [ref=e138]:
              - text: Spring Data Redis provides an implementation of Spring Framework’s
              - link "Cache Abstraction" [ref=e139] [cursor=pointer]:
                - /url: https://docs.spring.io/spring-framework/reference/7.0/integration.html#cache
              - text: in the
              - code [ref=e140]: org.springframework.data.redis.cache
              - text: package. To use Redis as a backing implementation, add
              - link [ref=e141] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/cache/RedisCacheManager.html
                - code [ref=e142]: RedisCacheManager
              - text: "to your configuration, as follows:"
            - generic [ref=e145]:
              - code [ref=e146]:
                - text: java @Bean
                - generic [ref=e147]: public RedisCacheManager cacheManager(RedisConnectionFactory connectionFactory)
                - text: "{ return RedisCacheManager.create(connectionFactory); }"
              - button "Copied!" [ref=e149] [cursor=pointer]
            - paragraph [ref=e152]:
              - code [ref=e153]: RedisCacheManager
              - text: behavior can be configured with
              - link [ref=e154] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/cache/RedisCacheManager.RedisCacheManagerBuilder.html
                - code [ref=e155]: RedisCacheManager.RedisCacheManagerBuilder
              - text: ", letting you set the default"
              - link [ref=e156] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/cache/RedisCacheManager.html
                - code [ref=e157]: RedisCacheManager
              - text: ", transaction behavior, and predefined caches."
            - generic [ref=e160]:
              - code [ref=e161]: java RedisCacheManager cacheManager = RedisCacheManager.builder(connectionFactory) .cacheDefaults(RedisCacheConfiguration.defaultCacheConfig()) .transactionAware() .withInitialCacheConfigurations(Collections.singletonMap("predefined", RedisCacheConfiguration.defaultCacheConfig().disableCachingNullValues())) .build();
              - button "Copied!" [ref=e163] [cursor=pointer]
            - paragraph [ref=e166]:
              - text: As shown in the preceding example,
              - code [ref=e167]: RedisCacheManager
              - text: allows custom configuration on a per-cache basis.
            - paragraph [ref=e169]:
              - text: The behavior of
              - link [ref=e170] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/cache/RedisCache.html
                - code [ref=e171]: RedisCache
              - text: created by
              - link [ref=e172] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/cache/RedisCacheManager.html
                - code [ref=e173]: RedisCacheManager
              - text: is defined with
              - code [ref=e174]: RedisCacheConfiguration
              - text: . The configuration lets you set key expiration times, prefixes, and
              - code [ref=e175]: RedisSerializer
              - text: "implementations for converting to and from the binary storage format, as shown in the following example:"
            - generic [ref=e178]:
              - code [ref=e179]: java RedisCacheConfiguration cacheConfiguration = RedisCacheConfiguration.defaultCacheConfig() .entryTtl(Duration.ofSeconds(1)) .disableCachingNullValues();
              - button "Copied!" [ref=e181] [cursor=pointer]
            - paragraph [ref=e184]:
              - link [ref=e185] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/cache/RedisCacheManager.html
                - code [ref=e186]: RedisCacheManager
              - text: defaults to a lock-free
              - link [ref=e187] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/cache/RedisCacheWriter.html
                - code [ref=e188]: RedisCacheWriter
              - text: for reading and writing binary values. Lock-free caching improves throughput. The lack of entry locking can lead to overlapping, non-atomic commands for the
              - code [ref=e189]: Cache
              - code [ref=e190]: putIfAbsent
              - text: and
              - code [ref=e191]: clean
              - text: operations, as those require multiple commands to be sent to Redis. The locking counterpart prevents command overlap by setting an explicit lock key and checking against presence of this key, which leads to additional requests and potential command wait times.
            - paragraph [ref=e193]:
              - text: Locking applies on the
              - strong [ref=e194]: cache level
              - text: ", not per"
              - strong [ref=e195]: cache entry
              - text: .
            - paragraph [ref=e197]: "It is possible to opt in to the locking behavior as follows:"
            - generic [ref=e200]:
              - code [ref=e201]: java RedisCacheManager cacheManager = RedisCacheManager .builder(RedisCacheWriter.lockingRedisCacheWriter(connectionFactory)) .cacheDefaults(RedisCacheConfiguration.defaultCacheConfig()) ...
              - button "Copied!" [ref=e203] [cursor=pointer]
            - paragraph [ref=e206]:
              - text: By default, any
              - code [ref=e207]: key
              - text: for a cache entry gets prefixed with the actual cache name followed by two colons (
              - code [ref=e208]: "::"
              - text: ). This behavior can be changed to a static as well as a computed prefix.
            - paragraph [ref=e210]: "The following example shows how to set a static prefix:"
            - generic [ref=e213]:
              - code [ref=e214]: "java // static key prefix RedisCacheConfiguration.defaultCacheConfig().prefixCacheNameWith(\"(͡° ᴥ ͡°)\"); The following example shows how to set a computed prefix: // computed key prefix RedisCacheConfiguration.defaultCacheConfig() .computePrefixWith(cacheName -> \"¯\\_(ツ)_/¯\" + cacheName);"
              - button "Copied!" [ref=e216] [cursor=pointer]
            - paragraph [ref=e219]:
              - text: The cache implementation defaults to use
              - code [ref=e220]: KEYS
              - text: and
              - code [ref=e221]: DEL
              - text: to clear the cache.
              - code [ref=e222]: KEYS
              - text: can cause performance issues with large keyspaces. Therefore, the default
              - code [ref=e223]: RedisCacheWriter
              - text: can be created with a
              - code [ref=e224]: BatchStrategy
              - text: to switch to a
              - code [ref=e225]: SCAN
              - text: "-based batch strategy. The"
              - code [ref=e226]: SCAN
              - text: "strategy requires a batch size to avoid excessive Redis command round trips:"
            - generic [ref=e229]:
              - code [ref=e230]: java RedisCacheManager cacheManager = RedisCacheManager .builder(RedisCacheWriter.nonLockingRedisCacheWriter(connectionFactory, BatchStrategies.scan(1000))) .cacheDefaults(RedisCacheConfiguration.defaultCacheConfig()) ...
              - button "Copied!" [ref=e232] [cursor=pointer]
            - table [ref=e235]:
              - rowgroup [ref=e236]:
                - row [ref=e237]:
                  - cell "Note" [ref=e238]
                  - cell [ref=e240]:
                    - paragraph [ref=e242]:
                      - text: The
                      - code [ref=e243]: KEYS
                      - text: batch strategy is fully supported using any driver and Redis operation mode (Standalone, Clustered).
                      - code [ref=e244]: SCAN
                      - text: is fully supported when using the Lettuce driver. Jedis supports
                      - code [ref=e245]: SCAN
                      - text: only in non-clustered modes.
