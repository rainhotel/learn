            - heading "Keeping reasoning items in context Copy link to keeping reasoning items in context" [level=3] [ref=e721]:
              - generic [ref=e722]: Keeping reasoning items in context
              - button "Copy link to keeping reasoning items in context" [ref=e723] [cursor=pointer]
            - paragraph [ref=e726]:
              - text: When doing
              - link "function calling" [ref=e727] [cursor=pointer]:
                - /url: /api/docs/guides/function-calling
              - text: with a reasoning model in the
              - link "Responses API" [ref=e728] [cursor=pointer]:
                - /url: /api/docs/api-reference/responses
              - text: ", we highly recommend you pass back any reasoning items returned with the last function call (in addition to the output of your function). If the model calls multiple functions consecutively, you should pass back all reasoning items, function call items, and function call output items, since the last"
              - code [ref=e729]: user
              - text: message. This allows the model to continue its reasoning process to produce better results in the most token-efficient manner.
            - paragraph [ref=e730]:
              - text: The simplest way to do this is to pass in all reasoning items from a previous response into the next one. Our systems will smartly ignore any reasoning items that aren’t relevant to your functions, and only retain those in context that are relevant. You can pass reasoning items from previous responses either using the
              - code [ref=e731]: previous_response_id
              - text: parameter, or by manually passing in all the
              - link "output" [ref=e732] [cursor=pointer]:
                - /url: /api/docs/api-reference/responses/object#responses/object-output
              - text: items from a past response into the
              - link "input" [ref=e733] [cursor=pointer]:
                - /url: /api/docs/api-reference/responses/create#responses-create-input
              - text: of a new one.
            - paragraph [ref=e734]: For advanced use cases where you might be truncating and optimizing parts of the context window before passing them on to the next response, just ensure all items between the last user message and your function call output are passed into the next response untouched. This will ensure that the model has all the context it needs.
            - paragraph [ref=e735]:
              - text: Check out
              - link "this guide" [ref=e736] [cursor=pointer]:
                - /url: /api/docs/guides/conversation-state
              - text: to learn more about manual context management.
            - heading "Preserve reasoning across calls Copy link to preserve reasoning across calls" [level=2] [ref=e737]:
              - generic [ref=e738]: Preserve reasoning across calls
              - button "Copy link to preserve reasoning across calls" [ref=e739] [cursor=pointer]
            - paragraph [ref=e742]: Conversation state and reasoning state serve different purposes. Passing messages across calls gives the model the visible conversation history. On supported models, persisted reasoning also lets the model render compatible reasoning items from earlier turns into its next context.
            - paragraph [ref=e743]:
              - text: Persisted reasoning provides continuity; it does not expose the model’s raw reasoning. The reasoning items remain opaque, and the API does not return their reasoning text. Set
              - code [ref=e744]: reasoning.context
              - text: "to control which available reasoning items the model can use:"
            - paragraph [ref=e754]:
              - text: Support for
              - code [ref=e755]: reasoning.context
              - text: modes is model-dependent. Replace
              - code [ref=e756]: YOUR_MODEL_ID
              - text: in the examples with a model that supports the mode you select.
            - table [ref=e758]:
              - rowgroup [ref=e759]:
                - row [ref=e760]:
                  - columnheader "Value" [ref=e761]
                  - columnheader "Behavior" [ref=e762]
              - rowgroup [ref=e763]:
                - row [ref=e764]:
                  - cell [ref=e765]:
                    - code [ref=e766]: auto
                  - cell [ref=e767]:
                    - text: Uses the selected model’s default. Omitting
                    - code [ref=e768]: reasoning.context
                    - text: has the same effect as
                    - code [ref=e769]: auto
                    - text: .
                - row [ref=e770]:
                  - cell [ref=e771]:
                    - code [ref=e772]: current_turn
                  - cell "Makes reasoning from the active turn available, but does not render reasoning from earlier turns into the next sample." [ref=e773]
                - row [ref=e774]:
                  - cell [ref=e775]:
                    - code [ref=e776]: all_turns
                  - cell "Renders available, compatible reasoning items from earlier turns into the next sample. Only supported models accept this value." [ref=e777]
            - paragraph [ref=e778]:
              - text: The response’s
              - code [ref=e779]: reasoning.context
              - text: field contains the effective mode, either
              - code [ref=e780]: current_turn
              - text: or
              - code [ref=e781]: all_turns
              - text: . Check this field on each response to confirm which mode the model used. The setting does not create reasoning items that are not already available.
            - paragraph [ref=e782]:
              - code [ref=e783]: all_turns
              - text: has an effect only when the request has access to earlier response items. Use
              - code [ref=e784]: previous_response_id
              - text: ", attach the response to a conversation, or manually replay the complete response history. On the first request,"
              - code [ref=e785]: current_turn
              - text: and
              - code [ref=e786]: all_turns
              - text: behave the same because no earlier reasoning exists.
            - heading "Continue reasoning with stored responses Copy link to continue reasoning with stored responses" [level=3] [ref=e787]:
