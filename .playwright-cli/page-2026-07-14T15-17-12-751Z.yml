            - heading "Reasoning summaries Copy link to reasoning summaries" [level=2] [ref=e900]:
              - generic [ref=e901]: Reasoning summaries
              - button "Copy link to reasoning summaries" [ref=e902] [cursor=pointer]
            - paragraph [ref=e905]:
              - text: While we don’t expose the raw reasoning tokens emitted by the model, you can view a summary of the model’s reasoning using the
              - code [ref=e906]: summary
              - text: parameter. See our
              - link "model documentation" [ref=e907] [cursor=pointer]:
