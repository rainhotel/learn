            - paragraph [ref=e995]:
              - text: For long-running or tool-heavy flows with GPT-5.5 and GPT-5.4 in the Responses API, use the assistant message
              - code [ref=e996]: phase
              - text: field to avoid early stopping and other misbehavior.
