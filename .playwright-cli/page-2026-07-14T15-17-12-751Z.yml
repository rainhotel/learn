                - row [ref=e548]:
                  - cell [ref=e549]:
                    - code [ref=e550]: low
                  - cell "Efficient reasoning with a modest latency increase. Ideal for use cases requiring tool-use, planning, search, or multi-step decision making, while optimizing for speed and cost. Common use cases include data analysis, drafting, execution-oriented coding, and customer support / chat assistant workflows." [ref=e551]: Efficient reasoning with a modest latency increase. Ideal for use cases requiring tool-use, planning, search, or multi-step decision making, while optimizing for speed and cost.Common use cases include data analysis, drafting, execution-oriented coding, and customer support / chat assistant workflows.
                - row [ref=e552]:
