              - text: summarizer, while o4-mini supports
              - code [ref=e910]: detailed
              - text: . To access the most detailed summarizer available for a model, set the value of this parameter to
              - code [ref=e911]: auto
              - text: .
              - code [ref=e912]: auto
              - text: will be equivalent to
              - code [ref=e913]: detailed
