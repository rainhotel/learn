              - text: ", and"
              - code [ref=e529]: xhigh
              - text: . Lower effort favors speed and lower token usage, while at higher effort the model thinks more completely to provide higher quality responses. The models also reason adaptively across reasoning efforts, using fewer tokens for simpler tasks and thinking harder for complex tasks.
            - paragraph [ref=e530]:
              - text: Defaults are also model-dependent rather than universal.
              - code [ref=e531]: gpt-5.5
