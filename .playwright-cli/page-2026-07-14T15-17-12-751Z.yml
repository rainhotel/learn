                    - text: Hard reasoning, complex debugging, deep planning, and high-value tasks where quality and intelligence matters more than latency. Recommended for complex workflows and agentic tasks.Common use cases include agentic coding, long-horizon research, and knowledge work. Depending on the complexity of the task, evaluate both
