            - paragraph [ref=e521]:
              - text: The
              - code [ref=e522]: reasoning.effort
              - text: parameter guides the model on how much to think when performing a task.
            - paragraph [ref=e523]:
              - text: Supported values are model-dependent and can include
              - code [ref=e524]: none
              - text: ","
              - code [ref=e525]: minimal
              - text: ","
              - code [ref=e526]: low
              - text: ","
              - code [ref=e527]: medium
              - text: ","
