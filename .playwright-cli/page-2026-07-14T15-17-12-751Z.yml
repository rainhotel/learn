                  - cell "Deep research, asynchronous workflows and agentic tasks that require long runs. Only use when your evals show a clear benefit that justifies the extra latency and cost. Common use cases include security and code review, enterprise productivity, deeper research tasks, and challenging coding workflows." [ref=e565]: Deep research, asynchronous workflows and agentic tasks that require long runs. Only use when your evals show a clear benefit that justifies the extra latency and cost.Common use cases include security and code review, enterprise productivity, deeper research tasks, and challenging coding workflows.
            - paragraph [ref=e566]: For faster time to first visible token in latency-sensitive applications, ask the model to generate a short preamble before continuing with deeper reasoning.
            - paragraph [ref=e567]:
              - text: Some models support only a subset of these values, so check the relevant
              - link "model page" [ref=e568] [cursor=pointer]:
                - /url: /api/docs/models
              - text: before choosing a setting.
            - heading "Reasoning mode Copy link to reasoning mode" [level=2] [ref=e569]:
              - generic [ref=e570]: Reasoning mode
              - button "Copy link to reasoning mode" [ref=e571] [cursor=pointer]
            - paragraph [ref=e574]:
              - text: GPT-5.6 models support
              - code [ref=e575]: standard
              - text: and
              - code [ref=e576]: pro
              - text: reasoning modes in the Responses API.
              - code [ref=e577]: standard
              - text: is the default. Set
              - code [ref=e578]: reasoning.mode
              - text: to
              - code [ref=e579]: pro
              - text: for difficult tasks that need more model work and can tolerate higher latency and token usage.
            - paragraph [ref=e580]:
              - text: Reasoning mode and reasoning effort are independent. Mode selects standard or pro execution, while
              - code [ref=e581]: reasoning.effort
              - text: controls how much reasoning the model applies within that mode. If you omit
              - code [ref=e582]: reasoning.effort
              - text: ", GPT-5.6 defaults to"
              - code [ref=e583]: medium
              - text: in both modes.
            - generic [ref=e584]:
              - generic [ref=e585]:
                - generic [ref=e586]: Using pro reasoning mode
