              - heading [level=2] [ref=e388]:
                - text: Usage notes
                - link "Direct link to heading" [ref=e389] [cursor=pointer]:
                  - /url: "#usage-notes"
                  - text: "#"
              - paragraph [ref=e390]:
                - strong [ref=e391]: Avoid timeout of a large number of half messages.
              - paragraph [ref=e392]: Apache RocketMQ allows you to check the transaction in the event of an exception during a transaction commit to ensure transaction consistency. However, producers should try to avoid local transactions returning unknown results. A large number of transaction checks can cause system performance to deteriorate and delay transaction processing.
              - paragraph [ref=e393]:
                - strong [ref=e394]: Properly handle transactions in progress.
              - paragraph [ref=e395]: During a half message status query, do not return Rollback or Commit for a transaction in progress. Instead, keep the Unknown status for the transaction.
              - paragraph [ref=e396]: "Generally, the reason why the transaction is in progress is that the transaction execution is slow and the query is frequent. Two solutions are recommended:"
              - list [ref=e397]:
                - listitem [ref=e398]:
                  - paragraph [ref=e399]: Set the interval for the first query to a larger value. However, this may cause a large delay for messages that depend on the query result.
                - listitem [ref=e400]:
                  - paragraph [ref=e401]: Make the program correctly identify ongoing transactions.
