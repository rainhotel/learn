                - listitem [ref=e129]:
                  - generic [ref=e130]: Transaction Message
            - generic [ref=e131]: "Version: 5.0"
            - generic [ref=e132]:
              - heading "Transaction Message" [level=1] [ref=e133]
              - paragraph [ref=e134]: Transactional messages are an advanced message type in Apache RocketMQ. This topic describes the application scenarios, working mechanism, limits, usage, and usage notes of transactional messages.
              - heading [level=2] [ref=e135]:
                - text: Scenarios
                - link "Direct link to heading" [ref=e136] [cursor=pointer]:
                  - /url: "#scenarios"
                  - text: "#"
              - paragraph [ref=e137]:
                - strong [ref=e138]: Distributed transactions
              - paragraph [ref=e139]:
                - text: When a core business logic is executed in a distributed system, multiple downstream businesses are invoked to process the logic simultaneously. Therefore, ensuring the consistency of the execution results between the core business and the downstream businesses is the biggest challenge that needs to be solved for distributed transactions.
                - img "事务消息诉求" [ref=e140]
              - paragraph [ref=e141]: "In an e-commerce scenario, when a user places an order, downstream systems are triggered to make changes accordingly. For example, the logistics system must initiate shipment, the credit system must update the user's credit points, and the shopping cart system must clear the user's shopping cart. The processing branches include:"
              - list [ref=e142]:
                - listitem [ref=e143]:
                  - paragraph [ref=e144]: The order system changes the order status from unpaid to paid.
                - listitem [ref=e145]:
                  - paragraph [ref=e146]: The logistics system adds a to-be-shipped record and creates an order logistics record.
                - listitem [ref=e147]:
                  - paragraph [ref=e148]: The credit system updates the credit points of the user.
                - listitem [ref=e149]:
                  - paragraph [ref=e150]: The shopping cart system clears the shopping cart and updates the user's shopping cart records.
              - paragraph [ref=e151]:
                - strong [ref=e152]: "Traditional XA-based solution: poor performance"
              - paragraph [ref=e153]: The typical method used to ensure result consistency among the branches is by using a distributed transaction system based on the eXtended Architecture (XA) protocol. The system encapsulates the four call branches into a large transaction that contains four independent transaction branches. While this solution can ensure result consistency, a large number of resources need to be locked to achieve this. This number increases with the number of branches, which results in low system concurrency. As more downstream branches are added, the system performance deteriorates.
              - paragraph [ref=e154]:
                - strong [ref=e155]: "Normal message-based solution: poor result consistency"
              - paragraph [ref=e156]:
                - text: A simpler solution based on the XA solution treats the change of the order system as a local transaction and the changes of downstream systems as downstream tasks. Transaction branches are treated as normal messages with added order table transactions. This solution processes messages asynchronously to shorten the processing lifecycle and improves system concurrency.
                - img "普通消息方案" [ref=e157]
              - paragraph [ref=e158]: "However, this solution is prone to deliver inconsistent results between the core transaction and transaction branches, for example:"
              - list [ref=e159]:
                - listitem [ref=e160]:
                  - paragraph [ref=e161]: The message is sent, but the order is not executed. As a result, the whole transaction needs to be rolled back.
                - listitem [ref=e162]:
                  - paragraph [ref=e163]: The order is executed, but the message is not sent. In this case, the message has to be resent for consumption.
                - listitem [ref=e164]:
                  - paragraph [ref=e165]: Timeout errors cannot be reliably detected, which makes it difficult to determine whether the order needs to be rolled back or an order change needs to be committed.
              - paragraph [ref=e166]:
                - strong [ref=e167]: "Distributed transaction message-based solution of Apache RocketMQ: thorough consistency"
              - paragraph [ref=e168]: The reason why consistency cannot be guaranteed in the preceding solution is that normal messages do not have the commit, rollback, and unified coordination capabilities of standalone database transactions.
              - paragraph [ref=e169]:
                - text: The transactional message feature of Apache RocketMQ supports two-phase commit on the basis of the normal message-based solution. The feature combines two-phase commit and local transaction to achieve global consistency of commit results.
                - img "事务消息" [ref=e170]
              - paragraph [ref=e171]: The transactional message solution of Apache RocketMQ is powerful, scalable, and easy to develop. For more information about the working mechanism and process of transactional message, see Working mechanism。
              - heading [level=2] [ref=e172]:
                - text: Working mechanism
                - link "Direct link to heading" [ref=e173] [cursor=pointer]:
                  - /url: "#working-mechanism"
                  - text: "#"
              - paragraph [ref=e174]:
                - strong [ref=e175]: Definition
              - paragraph [ref=e176]:
                - text: Transactional messages are an advanced message type provided by Apache RocketMQ to ensure the ultimate consistency between message production and local transaction.
                - strong [ref=e177]: Processing workflow
              - paragraph [ref=e178]:
                - text: The following figure shows the interaction process of transactional messages.
                - img "事务消息" [ref=e179]
              - list [ref=e180]:
                - listitem [ref=e181]:
                  - paragraph [ref=e182]: The producer sends a message to a Apache RocketMQ broker.
                - listitem [ref=e183]:
                  - paragraph [ref=e184]: The Apache RocketMQ broker saves the message and marks it as not ready for delivery. A message in this state is called a half message. After that, the broker sends an acknowledgment message (ACK) back to the producer.
                - listitem [ref=e185]:
                  - paragraph [ref=e186]: The producer executes the local transaction.
                - listitem [ref=e187]:
                  - paragraph [ref=e188]: The producer sends a second ACK to the broker to submit the execution result of the local transaction. The execution result may be Commit or Rollback.
                  - list [ref=e189]:
                    - listitem [ref=e190]:
                      - paragraph [ref=e191]: If the status of the message received by the broker is Commit, the broker marks the half message as deliverable and delivers the message to the consumer.
                    - listitem [ref=e192]:
                      - paragraph [ref=e193]: If the status of the message received by the broker is Rollback, the broker rolls back the transaction and does not deliver the half message to the consumer.
                - listitem [ref=e194]:
                  - paragraph [ref=e195]:
                    - text: If the network is disconnected or the producer application is restarted and the broker does not receive a second ACK or the status of the half message is Unknown, the broker waits a period of time and sends a request to a producer in the producer cluster to query the status of the half message.
                    - strong [ref=e196]: Note
                    - text: For more information about the length of the period and the maximum number of queries, see
                    - link "Parameter limits" [ref=e197] [cursor=pointer]:
                      - /url: /docs/introduction/03limits
                    - text: .
              - list [ref=e198]:
                - listitem [ref=e199]:
                  - paragraph [ref=e200]: After the producer receives the request, the producer checks the execution result of the local transaction that corresponds to the half message.
                - listitem [ref=e201]:
                  - paragraph [ref=e202]: The producer sends another ACK to the Apache RocketMQ broker based on the execution result of the local transaction. Then, the broker processes the half message by following Step 4.
              - paragraph [ref=e203]:
                - strong [ref=e204]: Lifecycle of a transactional message
                - img "事务消息" [ref=e205]
              - list [ref=e206]:
                - listitem [ref=e207]:
                  - paragraph [ref=e208]: "Initialized: The message is built and initialized by the producer and is ready to be sent to a broker."
                - listitem [ref=e209]:
                  - paragraph [ref=e210]: "Transaction pending: The half message is sent to the broker. However, it is not immediately written to a disk for permanent storage. Instead, it is stored in a transaction storage system. The message is not committed until the system verifies that the second phase of the local transaction is successful. During this period, the message is invisible to downstream consumers."
                - listitem [ref=e211]:
                  - paragraph [ref=e212]: "Rollback: In the second phase, if the execution result of the transaction is rollback, the broker rolls back the half message and terminates the workflow."
                - listitem [ref=e213]:
                  - paragraph [ref=e214]: "Ready: The message is sent to the broker, and is visible to the consumer and available for consumption."
                - listitem [ref=e215]:
                  - paragraph [ref=e216]: "Inflight: The message is obtained by the consumer and processed based on the local business logic of the consumer."
                  - paragraph [ref=e217]:
                    - text: In this process, the broker waits for the consumer to complete the consumption and submit the consumption result. If no response is received from the consumer in a certain period of time, Apache RocketMQ retries the message. For more information, see
                    - link "Consumption retry" [ref=e218] [cursor=pointer]:
                      - /url: /docs/featureBehavior/10consumerretrypolicy
                    - text: .
                - listitem [ref=e219]:
                  - paragraph [ref=e220]: "Acked: The consumer completes consumption and submits the consumption result to the broker. The broker marks whether the current message is successfully consumed."
                  - paragraph [ref=e221]: By default, Apache RocketMQ retains all messages. When the consumption result is submitted, the message data is logically marked as consumed instead of being deleted immediately. Therefore, the consumer can backtrack the message for re-consumption before it is deleted due to the expiration of the retention period or insufficient storage space.
                - listitem [ref=e222]:
                  - paragraph [ref=e223]:
                    - text: "Deleted: When the retention period of the message expires or the storage space is insufficient, Apache RocketMQ deletes the earliest saved message from the physical file in a rolling manner. For more information, see"
                    - link "Message storage and cleanup" [ref=e224] [cursor=pointer]:
                      - /url: /docs/featureBehavior/11messagestorepolicy
                    - text: .
              - heading [level=2] [ref=e225]:
                - text: Usage limits
                - link "Direct link to heading" [ref=e226] [cursor=pointer]:
                  - /url: "#usage-limits"
                  - text: "#"
              - paragraph [ref=e227]:
                - strong [ref=e228]: Message type consistency
              - paragraph [ref=e229]: Transactional messages can only be used in topics whose MessageType is Transaction.
              - paragraph [ref=e230]:
                - strong [ref=e231]: Transaction-centered consumption
              - paragraph [ref=e232]:
                - text: The transactional message feature of Apache RocketMQ guarantees that the same transaction can be processed between the local core transaction and downstream branches. However, it does not guarantee the consistency between the message consumption result and the upstream execution result. Therefore, downstream businesses must ensure that messages are processed correctly. We recommend that consumers
                - link "Consumption retry" [ref=e233] [cursor=pointer]:
                  - /url: /docs/featureBehavior/10consumerretrypolicy
                - text: properly to ensure that the message is processed correctly in the event of failure.
              - paragraph [ref=e234]:
                - strong [ref=e235]: Intermediate state visibility
              - paragraph [ref=e236]: The transactional message feature of Apache RocketMQ ensures only final consistency, which means that status consistency is not guaranteed between an upstream transaction and a downstream branch before a message is delivered to a consumer. Therefore, transactional messages are only suitable for transaction scenarios that accept asynchronous execution.
              - paragraph [ref=e237]:
                - strong [ref=e238]: Transaction timeout mechanism
              - paragraph [ref=e239]:
                - text: Apache RocketMQ implements a timeout mechanism for transactional messages. Upon receiving a half message, if the broker cannot determine whether to commit or roll back the transaction after a certain period of time, the broker rolls back the message by default. For more information about the timeout period, see
                - link "Parameter limits" [ref=e240] [cursor=pointer]:
                  - /url: /docs/introduction/03limits
                - text: .
              - heading [level=2] [ref=e241]:
                - text: Example
                - link "Direct link to heading" [ref=e242] [cursor=pointer]:
                  - /url: "#example"
                  - text: "#"
              - paragraph [ref=e243]:
                - strong [ref=e244]: Create topic
              - paragraph [ref=e245]: "For creating topics in Apache RocketMQ 5.0, it is recommended to use the mqadmin tool. However, it is worth noting that message type needs to be added as a property parameter. Here is an example:"
              - generic [ref=e247]:
                - code [ref=e249]:
                  - generic [ref=e250]: sh mqadmin updateTopic -n <nameserver_address> -t <topic_name> -c <cluster_name> -a +message.type=Transaction
                - generic [ref=e251]:
                  - button "Toggle word wrap" [ref=e252] [cursor=pointer]
                  - button "Copy code to clipboard" [ref=e255] [cursor=pointer]
              - paragraph [ref=e261]:
                - strong [ref=e262]: Send messages
              - paragraph [ref=e263]: "Sending transactional messages is different from sending normal messages in the following aspects:"
              - list [ref=e264]:
                - listitem [ref=e265]:
                  - paragraph [ref=e266]: Before sending transactional messages, you must enable the transaction checker and associate it with local transaction execution.
                - listitem [ref=e267]:
                  - paragraph [ref=e268]: When creating a producer, you must set the transaction checker and bind the list of topics of messages to be sent. These actions enable the built-in transaction checker of the client to restore topics in the event of exceptions.
              - paragraph [ref=e269]:
                - strong [ref=e270]: Create TRANSACTION Topic
              - paragraph [ref=e271]:
                - emphasis [ref=e272]: NORMAL Topic doesn't support delivery TRANSACTION message, you'll get an error if you send a TRANSACTION message to a NORMAL topic.
              - generic [ref=e274]:
                - code [ref=e276]:
                  - generic [ref=e277]: ./bin/mqadmin updatetopic -n localhost:9876 -t TestTopic -c DefaultCluster -a +message.type=TRANSACTION
                - generic [ref=e278]:
                  - button "Toggle word wrap" [ref=e279] [cursor=pointer]
                  - button "Copy code to clipboard" [ref=e282] [cursor=pointer]
              - list [ref=e288]:
                - listitem [ref=e289]: "-c the cluster name"
                - listitem [ref=e290]: "-t the topic name"
                - listitem [ref=e291]: "-n the address of the nameserver"
                - listitem [ref=e292]:
                  - strong [ref=e293]:
                    - text: "-a extra attributes，we add an"
                    - code [ref=e294]: message.type
                    - text: attribute with value
                    - code [ref=e295]: TRANSACTION
                    - text: to support delivery TRANSACTION message.
              - paragraph [ref=e296]: "The following example uses Java as an example to show you how to send transactional messages:"
              - generic [ref=e298]:
                - code [ref=e300]:
                  - generic [ref=e301]: // The demo is used to simulate the order table query service to check whether the order transaction is submitted.
                  - generic [ref=e302]: "private static boolean checkOrderById(String orderId) {"
                  - generic [ref=e303]: return true;
                  - generic [ref=e304]: "}"
