          - heading "Non-Blocking Retries" [level=1] [ref=e139]
          - paragraph [ref=e141]:
            - text: Version 2.9 changed the mechanism to bootstrap infrastructure beans; see
            - link "Configuration" [ref=e142] [cursor=pointer]:
              - /url: retrytopic/retry-config.html
            - text: for the two mechanisms that are now required to bootstrap the feature.
          - paragraph [ref=e144]:
            - text: Achieving non-blocking retry / dlt functionality with Kafka usually requires setting up extra topics and creating and configuring the corresponding listeners. Since 2.7 Spring for Apache Kafka offers support for that via the
            - code [ref=e145]: "@RetryableTopic"
            - text: annotation and
            - code [ref=e146]: RetryTopicConfiguration
            - text: class to simplify that bootstrapping.
          - paragraph [ref=e148]:
            - text: Since 3.2, Spring for Apache Kafka supports non-blocking retries with
            - link "@KafkaListener on a Class" [ref=e149] [cursor=pointer]:
              - /url: kafka/receiving-messages/class-level-kafkalistener.html
            - text: .
          - table [ref=e151]:
            - rowgroup [ref=e152]:
              - row [ref=e153]:
                - cell "Important" [ref=e154]
                - cell [ref=e156]:
                  - text: Non-blocking retries are not supported with
                  - link "Batch Listeners" [ref=e157] [cursor=pointer]:
                    - /url: kafka/receiving-messages/listener-annotation.html#batch-listeners
                  - text: .
          - table [ref=e159]:
            - rowgroup [ref=e160]:
              - row [ref=e161]:
                - cell "Important" [ref=e162]
                - cell [ref=e164]:
                  - text: Non-Blocking Retries cannot combine with
                  - link "Container Transactions" [ref=e165] [cursor=pointer]:
                    - /url: kafka/transactions.html#container-transaction-manager
                  - text: .
