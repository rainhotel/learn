          - heading "Declarative Transaction Management" [level=1] [ref=e173]
          - table [ref=e175]:
            - rowgroup [ref=e176]:
              - row [ref=e177]:
                - cell "Note" [ref=e178]
                - cell "Most Spring Framework users choose declarative transaction management. This option has the least impact on application code and, hence, is most consistent with the ideals of a non-invasive lightweight container." [ref=e180]
          - paragraph [ref=e182]: The Spring Framework’s declarative transaction management is made possible with Spring aspect-oriented programming (AOP). However, as the transactional aspects code comes with the Spring Framework distribution and may be used in a boilerplate fashion, AOP concepts do not generally have to be understood to make effective use of this code.
          - paragraph [ref=e184]:
            - text: The Spring Framework’s declarative transaction management is similar to EJB CMT, in that you can specify transaction behavior (or lack of it) down to the individual method level. You can make a
            - code [ref=e185]: setRollbackOnly()
            - text: "call within a transaction context, if necessary. The differences between the two types of transaction management are:"
          - list [ref=e187]:
            - listitem [ref=e188]:
              - paragraph [ref=e189]: Unlike EJB CMT, which is tied to JTA, the Spring Framework’s declarative transaction management works in any environment. It can work with JTA transactions or local transactions by using JDBC, JPA, or Hibernate by adjusting the configuration files.
            - listitem [ref=e190]:
              - paragraph [ref=e191]: You can apply the Spring Framework declarative transaction management to any class, not merely special classes such as EJBs.
            - listitem [ref=e192]:
              - paragraph [ref=e193]:
                - text: The Spring Framework offers declarative
                - link "rollback rules" [ref=e194] [cursor=pointer]:
                  - /url: declarative/rolling-back.html
                - text: ", a feature with no EJB equivalent. Both programmatic and declarative support for rollback rules is provided."
            - listitem [ref=e195]:
              - paragraph [ref=e196]:
                - text: The Spring Framework lets you customize transactional behavior by using AOP. For example, you can insert custom behavior in the case of transaction rollback. You can also add arbitrary advice, along with transactional advice. With EJB CMT, you cannot influence the container’s transaction management, except with
                - code [ref=e197]: setRollbackOnly()
                - text: .
            - listitem [ref=e198]:
              - paragraph [ref=e199]: The Spring Framework does not support propagation of transaction contexts across remote calls, as high-end application servers do. If you need this feature, we recommend that you use EJB. However, consider carefully before using such a feature, because, normally, one does not want transactions to span remote calls.
          - paragraph [ref=e201]:
            - text: The concept of rollback rules is important. They let you specify which exceptions (and throwables) should cause automatic rollback. You can specify this declaratively, in configuration, not in Java code. So, although you can still call
            - code [ref=e202]: setRollbackOnly()
            - text: on the
            - code [ref=e203]: TransactionStatus
            - text: object to roll back the current transaction back, most often you can specify a rule that
            - code [ref=e204]: MyApplicationException
            - text: must always result in rollback. The significant advantage to this option is that business objects do not depend on the transaction infrastructure. For example, they typically do not need to import Spring transaction APIs or other Spring APIs.
          - paragraph [ref=e206]:
            - text: Although EJB container default behavior automatically rolls back the transaction on a system exception (usually a runtime exception), EJB CMT does not roll back the transaction automatically on an application exception (that is, a checked exception other than
            - code [ref=e207]: java.rmi.RemoteException
            - text: ). While the Spring default behavior for declarative transaction management follows EJB convention (roll back is automatic only on unchecked exceptions), it is often useful to customize this behavior.
