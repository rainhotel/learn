          - generic [ref=e296]:
            - heading "Serializers" [level=2] [ref=e297]
            - generic [ref=e298]:
              - paragraph [ref=e300]: From the framework perspective, the data stored in Redis is only bytes. While Redis itself supports various types, for the most part, these refer to the way the data is stored rather than what it represents. It is up to the user to decide whether the information gets translated into strings or any other objects.
              - paragraph [ref=e302]:
                - text: In Spring Data, the conversion between the user (custom) types and raw data (and vice-versa) is handled by Spring Data Redis in the
                - code [ref=e303]: org.springframework.data.redis.serializer
                - text: package.
              - paragraph [ref=e305]: "This package contains two types of serializers that, as the name implies, take care of the serialization process:"
              - list [ref=e307]:
                - listitem [ref=e308]:
                  - paragraph [ref=e309]:
                    - text: Two-way serializers based on
                    - link [ref=e310] [cursor=pointer]:
                      - /url: ../api/java/org/springframework/data/redis/serializer/RedisSerializer.html
                      - code [ref=e311]: RedisSerializer
                    - text: .
                - listitem [ref=e312]:
                  - paragraph [ref=e313]:
                    - text: Element readers and writers that use
                    - code [ref=e314]: RedisElementReader
                    - text: and
                    - code [ref=e315]: RedisElementWriter
                    - text: .
              - paragraph [ref=e317]:
                - text: The main difference between these variants is that
                - code [ref=e318]: RedisSerializer
                - text: primarily serializes to
                - code [ref=e319]: byte[]
                - text: while readers and writers use
                - code [ref=e320]: ByteBuffer
                - text: .
              - paragraph [ref=e322]: "Multiple implementations are available (including two that have been already mentioned in this documentation):"
              - list [ref=e324]:
                - listitem [ref=e325]:
                  - paragraph [ref=e326]:
                    - link [ref=e327] [cursor=pointer]:
                      - /url: ../api/java/org/springframework/data/redis/serializer/JdkSerializationRedisSerializer.html
                      - code [ref=e328]: JdkSerializationRedisSerializer
                    - text: ", which is used by default for"
                    - link [ref=e329] [cursor=pointer]:
                      - /url: ../api/java/org/springframework/data/redis/cache/RedisCache.html
                      - code [ref=e330]: RedisCache
                    - text: and
                    - link [ref=e331] [cursor=pointer]:
                      - /url: ../api/java/org/springframework/data/redis/core/RedisTemplate.html
                      - code [ref=e332]: RedisTemplate
                    - text: .
                - listitem [ref=e333]:
                  - paragraph [ref=e334]:
                    - text: the
                    - code [ref=e335]: StringRedisSerializer
                    - text: .
              - paragraph [ref=e337]:
                - text: However, one can use
                - code [ref=e338]: OxmSerializer
                - text: for Object/XML mapping through Spring
                - link "OXM" [ref=e339] [cursor=pointer]:
                  - /url: https://docs.spring.io/spring-framework/reference/7.0/data-access.html#oxm
                - text: support or
                - link [ref=e340] [cursor=pointer]:
                  - /url: ../api/java/org/springframework/data/redis/serializer/JacksonJsonRedisSerializer.html
                  - code [ref=e341]: JacksonJsonRedisSerializer
                - text: or
                - link [ref=e342] [cursor=pointer]:
                  - /url: ../api/java/org/springframework/data/redis/serializer/GenericJacksonJsonRedisSerializer.html
                  - code [ref=e343]: GenericJacksonJsonRedisSerializer
                - text: for storing data in
                - link "JSON" [ref=e344] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/JSON
                - text: format.
              - paragraph [ref=e346]: Do note that the storage format is not limited only to values. It can be used for keys, values, or hashes without any restrictions.
              - table [ref=e348]:
                - rowgroup [ref=e349]:
                  - row [ref=e350]:
                    - cell "Warning" [ref=e351]
                    - cell [ref=e353]:
                      - paragraph [ref=e355]:
                        - text: By default,
                        - link [ref=e356] [cursor=pointer]:
                          - /url: ../api/java/org/springframework/data/redis/cache/RedisCache.html
                          - code [ref=e357]: RedisCache
                        - text: and
                        - link [ref=e358] [cursor=pointer]:
                          - /url: ../api/java/org/springframework/data/redis/core/RedisTemplate.html
                          - code [ref=e359]: RedisTemplate
                        - text: are configured to use Java native serialization. Java native serialization is known for allowing the running of remote code caused by payloads that exploit vulnerable libraries and classes injecting unverified bytecode. Manipulated input could lead to unwanted code being run in the application during the deserialization step. As a consequence, do not use serialization in untrusted environments. In general, we strongly recommend any other message format (such as JSON) instead.
                      - paragraph [ref=e361]: "If you are concerned about security vulnerabilities due to Java serialization, consider the general-purpose serialization filter mechanism at the core JVM level:"
                      - list [ref=e363]:
