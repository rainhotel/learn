          - generic [ref=e135]:
            - paragraph [ref=e137]:
              - text: Most users are likely to use
              - link [ref=e138] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/RedisTemplate.html
                - code [ref=e139]: RedisTemplate
              - text: and its corresponding package,
              - code [ref=e140]: org.springframework.data.redis.core
              - text: or its reactive variant
              - link [ref=e141] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/ReactiveRedisTemplate.html
                - code [ref=e142]: ReactiveRedisTemplate
              - text: . The template is, in fact, the central class of the Redis module, due to its rich feature set. The template offers a high-level abstraction for Redis interactions. While
              - code [ref=e143]: "[Reactive]RedisConnection"
              - text: offers low-level methods that accept and return binary values (
              - code [ref=e144]: byte
              - text: arrays), the template takes care of serialization and connection management, freeing the user from dealing with such details.
            - paragraph [ref=e146]:
              - text: The
              - link [ref=e147] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/RedisTemplate.html
                - code [ref=e148]: RedisTemplate
              - text: class implements the
              - link [ref=e149] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/RedisOperations.html
                - code [ref=e150]: RedisOperations
              - text: interface and its reactive variant
              - link [ref=e151] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/ReactiveRedisTemplate.html
                - code [ref=e152]: ReactiveRedisTemplate
              - text: implements
              - link [ref=e153] [cursor=pointer]:
                - /url: ../api/java/org/springframework/data/redis/core/ReactiveRedisOperations.html
                - code [ref=e154]: ReactiveRedisOperations
              - text: .
            - table [ref=e156]:
              - rowgroup [ref=e157]:
                - row [ref=e158]:
                  - cell "Note" [ref=e159]
                  - cell [ref=e161]:
                    - text: The preferred way to reference operations on a
                    - code [ref=e162]: "[Reactive]RedisTemplate"
                    - text: instance is through the
                    - code [ref=e163]: "[Reactive]RedisOperations"
                    - text: interface.
            - paragraph [ref=e165]:
              - text: Moreover, the template provides operations views (following the grouping from the Redis command
              - link "reference" [ref=e166] [cursor=pointer]:
                - /url: https://redis.io/commands
              - text: ) that offer rich, generified interfaces for working against a certain type or certain key (through the
              - code [ref=e167]: KeyBound
              - text: "interfaces) as described in the following table:"
            - group [ref=e168]:
              - generic "Operational views" [ref=e169] [cursor=pointer]
            - paragraph [ref=e171]: Once configured, the template is thread-safe and can be reused across multiple instances.
            - paragraph [ref=e173]:
              - code [ref=e174]: RedisTemplate
              - text: uses a Java-based serializer for most of its operations. This means that any object written or read by the template is serialized and deserialized through Java.
            - paragraph [ref=e176]:
              - text: You can change the serialization mechanism on the template, and the Redis module offers several implementations, which are available in the
              - code [ref=e177]: org.springframework.data.redis.serializer
              - text: package. See
              - link "Serializers" [ref=e178] [cursor=pointer]:
                - /url: "#redis:serializer"
              - text: for more information. You can also set any of the serializers to null and use RedisTemplate with raw byte arrays by setting the
              - code [ref=e179]: enableDefaultSerializer
              - text: property to
              - code [ref=e180]: "false"
              - text: . Note that the template requires all keys to be non-null. However, values can be null as long as the underlying serializer accepts them. Read the Javadoc of each serializer for more information.
            - paragraph [ref=e182]:
              - text: For cases where you need a certain template view, declare the view as a dependency and inject the template. The container automatically performs the conversion, eliminating the
              - code [ref=e183]: opsFor[X]
              - text: "calls, as shown in the following example:"
            - generic [ref=e184]:
