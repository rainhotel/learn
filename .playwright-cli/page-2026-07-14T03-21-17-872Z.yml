              - paragraph [ref=e279]:
                - text: As with the other Spring templates,
                - code [ref=e280]: RedisTemplate
                - text: and
                - code [ref=e281]: StringRedisTemplate
                - text: let you talk directly to Redis through the
                - code [ref=e282]: RedisCallback
