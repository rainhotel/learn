                - text: as a convenient one-stop solution for intensive String operations. In addition to being bound to
                - code [ref=e237]: String
                - text: keys, the template and the connection use the
                - code [ref=e238]: StringRedisSerializer
                - text: "underneath, which means the stored keys and values are human-readable (assuming the same encoding is used both in Redis and your code). The following listings show an example:"
              - generic [ref=e240]:
