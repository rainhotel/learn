            - text: public @interface Transactional
          - generic [ref=e88]:
            - text: Describes a transaction attribute on an individual method or on a class.
            - paragraph [ref=e89]:
              - text: When this annotation is declared at the class level, it applies as a default to all methods of the declaring class and its subclasses. Note that it does not apply to ancestor classes up the class hierarchy; inherited methods need to be locally redeclared in order to participate in a subclass-level annotation. For details on method visibility constraints, consult the
              - link "Transaction Management" [ref=e90] [cursor=pointer]:
                - /url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html#transaction-declarative-annotations-method-visibility
              - text: section of the reference manual.
            - paragraph [ref=e91]:
              - text: This annotation is generally directly comparable to Spring's
              - link [ref=e92] [cursor=pointer]:
                - /url: ../interceptor/RuleBasedTransactionAttribute.html
                - code [ref=e93]: RuleBasedTransactionAttribute
              - text: class, and in fact
              - link [ref=e94] [cursor=pointer]:
                - /url: AnnotationTransactionAttributeSource.html
                - code [ref=e95]: AnnotationTransactionAttributeSource
              - text: will directly convert this annotation's attributes to properties in
              - code [ref=e96]: RuleBasedTransactionAttribute
              - text: ", so that Spring's transaction support code does not have to know about annotations."
            - heading [level=3] [ref=e97]:
              - text: Attribute Semantics
              - link "Link to this section" [ref=e98] [cursor=pointer]:
                - /url: "#attribute-semantics-heading"
                - img "Link icon" [ref=e99]
            - paragraph [ref=e100]:
              - text: If no custom rollback rules are configured in this annotation, the transaction will roll back on
              - link [ref=e101] [cursor=pointer]:
                - /url: https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/RuntimeException.html
                - code [ref=e102]: RuntimeException
              - text: and
              - link [ref=e103] [cursor=pointer]:
                - /url: https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Error.html
                - code [ref=e104]: Error
              - text: but not on checked exceptions.
            - paragraph [ref=e105]:
              - text: Rollback rules determine if a transaction should be rolled back when a given exception is thrown, and the rules are based on types or patterns. Custom rules may be configured via
              - link [ref=e106] [cursor=pointer]:
                - /url: "#rollbackFor()"
                - code [ref=e107]: rollbackFor()
              - text: /
              - link [ref=e108] [cursor=pointer]:
                - /url: "#noRollbackFor()"
                - code [ref=e109]: noRollbackFor()
              - text: and
              - link [ref=e110] [cursor=pointer]:
                - /url: "#rollbackForClassName()"
                - code [ref=e111]: rollbackForClassName()
              - text: /
              - link [ref=e112] [cursor=pointer]:
                - /url: "#noRollbackForClassName()"
                - code [ref=e113]: noRollbackForClassName()
              - text: ", which allow rules to be specified as types or patterns, respectively."
            - paragraph [ref=e114]:
              - text: When a rollback rule is defined with an exception type — for example, via
              - link [ref=e115] [cursor=pointer]:
                - /url: "#rollbackFor()"
                - code [ref=e116]: rollbackFor()
              - text: — that type will be used to match against the type of a thrown exception. Specifically, given a configured exception type
              - code [ref=e117]: C
              - text: ", a thrown exception of type"
              - code [ref=e118]: T
              - text: will be considered a match against
              - code [ref=e119]: C
              - text: if
              - code [ref=e120]: T
              - text: is equal to
              - code [ref=e121]: C
              - text: or a subclass of
              - code [ref=e122]: C
              - text: . This provides type safety and avoids any unintentional matches that may occur when using a pattern. For example, a value of
              - code [ref=e123]: jakarta.servlet.ServletException.class
              - text: will only match thrown exceptions of type
              - code [ref=e124]: jakarta.servlet.ServletException
              - text: and its subclasses.
            - paragraph [ref=e125]:
              - text: When a rollback rule is defined with an exception pattern, the pattern can be a fully qualified class name or a substring of a fully qualified class name for an exception type (which must be a subclass of
              - code [ref=e126]: Throwable
              - text: ), with no wildcard support at present. For example, a value of
              - code [ref=e127]: "\"jakarta.servlet.ServletException\""
              - text: or
              - code [ref=e128]: "\"ServletException\""
              - text: will match
              - code [ref=e129]: jakarta.servlet.ServletException
              - text: and its subclasses.
            - paragraph [ref=e130]:
              - strong [ref=e131]: "WARNING:"
              - text: You must carefully consider how specific a pattern is and whether to include package information (which isn't mandatory). For example,
              - code [ref=e132]: "\"Exception\""
              - text: will match nearly anything and will probably hide other rules.
              - code [ref=e133]: "\"java.lang.Exception\""
              - text: would be correct if
              - code [ref=e134]: "\"Exception\""
              - text: were meant to define a rule for all checked exceptions. With more unique exception names such as
              - code [ref=e135]: "\"BaseBusinessException\""
              - text: there is likely no need to use the fully qualified class name for the exception pattern. Furthermore, rollback rules defined via patterns may result in unintentional matches for similarly named exceptions and nested classes. This is due to the fact that a thrown exception is considered to be a match for a given pattern-based rollback rule if the name of thrown exception contains the exception pattern configured for the rollback rule. For example, given a rule configured to match against
              - code [ref=e136]: "\"com.example.CustomException\""
              - text: ", that rule will match against an exception named"
              - code [ref=e137]: com.example.CustomExceptionV2
              - text: (an exception in the same package as
              - code [ref=e138]: CustomException
              - text: but with an additional suffix) or an exception named
              - code [ref=e139]: com.example.CustomException$AnotherException
              - text: (an exception declared as a nested class in
              - code [ref=e140]: CustomException
              - text: ).
            - paragraph [ref=e141]:
              - text: For specific information about the semantics of other attributes in this annotation, consult the
              - link [ref=e142] [cursor=pointer]:
                - /url: ../TransactionDefinition.html
                - code [ref=e143]: TransactionDefinition
              - text: and
              - link [ref=e144] [cursor=pointer]:
                - /url: ../interceptor/TransactionAttribute.html
                - code [ref=e145]: TransactionAttribute
              - text: javadocs.
            - heading [level=3] [ref=e146]:
              - text: Transaction Management
              - link "Link to this section" [ref=e147] [cursor=pointer]:
                - /url: "#transaction-management-heading"
                - img "Link icon" [ref=e148]
            - paragraph [ref=e149]:
              - text: This annotation commonly works with thread-bound transactions managed by a
              - link [ref=e150] [cursor=pointer]:
                - /url: ../PlatformTransactionManager.html
                - code [ref=e151]: PlatformTransactionManager
              - text: ", exposing a transaction to all data access operations within the current execution thread. Note: This does NOT propagate to newly started threads within the method."
            - paragraph [ref=e152]:
              - text: Alternatively, this annotation may demarcate a reactive transaction managed by a
              - link [ref=e153] [cursor=pointer]:
                - /url: ../ReactiveTransactionManager.html
                - code [ref=e154]: ReactiveTransactionManager
              - text: which uses the Reactor context instead of thread-local variables. As a consequence, all participating data access operations need to execute within the same Reactor context in the same reactive pipeline.
            - paragraph [ref=e155]:
              - generic [ref=e156]:
                - text: "Note: When configured with a"
                - code [ref=e157]: ReactiveTransactionManager
                - text: ", all transaction-demarcated methods are expected to return a reactive pipeline."
              - text: Void methods or regular return types need to be associated with a regular
              - code [ref=e158]: PlatformTransactionManager
              - text: ", for example, through"
              - link [ref=e159] [cursor=pointer]:
                - /url: "#transactionManager()"
                - code [ref=e160]: transactionManager()
              - text: .
