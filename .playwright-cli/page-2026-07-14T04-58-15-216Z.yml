            - listitem [ref=e214]:
              - heading [level=4] [ref=e215]:
                - link "value.deserializer" [ref=e216] [cursor=pointer]:
                  - /url: "#consumerconfigs_value.deserializer"
              - paragraph [ref=e217]:
                - text: Deserializer class for value that implements the
                - code [ref=e218]: org.apache.kafka.common.serialization.Deserializer
                - text: interface.
              - table [ref=e219]:
                - rowgroup [ref=e220]:
                  - row [ref=e221]:
