            - listitem [ref=e936]:
              - heading [level=4] [ref=e937]:
                - link "sasl.oauthbearer.assertion.algorithm" [ref=e938] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.algorithm"
              - paragraph
              - paragraph [ref=e939]:
                - text: The algorithm the Apache Kafka client should use to sign the assertion sent to the identity provider. It is also used as the value of the OAuth
                - code [ref=e940]: alg
                - text: (Algorithm) header in the JWT assertion.
              - paragraph [ref=e941]:
                - emphasis [ref=e942]: Note
                - text: ": If a value for"
                - code [ref=e943]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e944]:
                - rowgroup [ref=e945]:
                  - row [ref=e946]:
                    - rowheader "Type:" [ref=e947]
                    - cell "string" [ref=e948]
                  - row [ref=e949]:
                    - rowheader "Default:" [ref=e950]
                    - cell "RS256" [ref=e951]
                  - row [ref=e952]:
                    - rowheader "Valid Values:" [ref=e953]
                    - cell "(case insensitive) [ES256, RS256]" [ref=e954]
                  - row [ref=e955]:
                    - rowheader "Importance:" [ref=e956]
                    - cell "medium" [ref=e957]
            - listitem [ref=e958]:
              - heading [level=4] [ref=e959]:
                - link "sasl.oauthbearer.assertion.claim.aud" [ref=e960] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.claim.aud"
              - paragraph
              - paragraph [ref=e961]:
                - text: The JWT
                - code [ref=e962]: aud
                - text: (Audience) claim which will be included in the client JWT assertion created locally.
              - paragraph [ref=e963]:
                - emphasis [ref=e964]: Note
                - text: ": If a value for"
                - code [ref=e965]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e966]:
                - rowgroup [ref=e967]:
