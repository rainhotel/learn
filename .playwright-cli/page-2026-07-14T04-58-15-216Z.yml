                    - cell "null" [ref=e973]
                  - row [ref=e974]:
                    - columnheader "Valid Values:" [ref=e975]
                    - cell [ref=e976]
                  - row [ref=e977]:
                    - rowheader "Importance:" [ref=e978]
                    - cell "medium" [ref=e979]
            - listitem [ref=e980]:
              - heading [level=4] [ref=e981]:
                - link "sasl.oauthbearer.assertion.claim.iss" [ref=e982] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.claim.iss"
              - paragraph
              - paragraph [ref=e983]:
                - text: The value to be used as the
                - code [ref=e984]: iss
                - text: (Issuer) claim which will be included in the client JWT assertion created locally.
              - paragraph [ref=e985]:
                - emphasis [ref=e986]: Note
                - text: ": If a value for"
                - code [ref=e987]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e988]:
                - rowgroup [ref=e989]:
                  - row [ref=e990]:
                    - rowheader "Type:" [ref=e991]
                    - cell "string" [ref=e992]
                  - row [ref=e993]:
                    - rowheader "Default:" [ref=e994]
                    - cell "null" [ref=e995]
                  - row [ref=e996]:
                    - columnheader "Valid Values:" [ref=e997]
                    - cell [ref=e998]
                  - row [ref=e999]:
                    - rowheader "Importance:" [ref=e1000]
                    - cell "medium" [ref=e1001]
            - listitem [ref=e1002]:
              - heading [level=4] [ref=e1003]:
                - link "sasl.oauthbearer.assertion.claim.jti.include" [ref=e1004] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.claim.jti.include"
              - paragraph
              - paragraph [ref=e1005]:
                - text: Flag that determines if the JWT assertion should generate a unique ID for the JWT and include it in the
                - code [ref=e1006]: jti
                - text: (JWT ID) claim.
              - paragraph [ref=e1007]:
                - emphasis [ref=e1008]: Note
                - text: ": If a value for"
                - code [ref=e1009]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1010]:
                - rowgroup [ref=e1011]:
                  - row [ref=e1012]:
                    - rowheader "Type:" [ref=e1013]
                    - cell "boolean" [ref=e1014]
                  - row [ref=e1015]:
                    - rowheader "Default:" [ref=e1016]
                    - cell "false" [ref=e1017]
                  - row [ref=e1018]:
                    - columnheader "Valid Values:" [ref=e1019]
                    - cell [ref=e1020]
                  - row [ref=e1021]:
                    - rowheader "Importance:" [ref=e1022]
                    - cell "medium" [ref=e1023]
            - listitem [ref=e1024]:
              - heading [level=4] [ref=e1025]:
                - link "sasl.oauthbearer.assertion.claim.sub" [ref=e1026] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.claim.sub"
              - paragraph
              - paragraph [ref=e1027]:
                - text: The value to be used as the
                - code [ref=e1028]: sub
                - text: (Subject) claim which will be included in the client JWT assertion created locally.
              - paragraph [ref=e1029]:
                - emphasis [ref=e1030]: Note
                - text: ": If a value for"
                - code [ref=e1031]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1032]:
                - rowgroup [ref=e1033]:
                  - row [ref=e1034]:
                    - rowheader "Type:" [ref=e1035]
                    - cell "string" [ref=e1036]
                  - row [ref=e1037]:
                    - rowheader "Default:" [ref=e1038]
                    - cell "null" [ref=e1039]
                  - row [ref=e1040]:
                    - columnheader "Valid Values:" [ref=e1041]
                    - cell [ref=e1042]
                  - row [ref=e1043]:
                    - rowheader "Importance:" [ref=e1044]
                    - cell "medium" [ref=e1045]
            - listitem [ref=e1046]:
              - heading [level=4] [ref=e1047]:
                - link "sasl.oauthbearer.assertion.file" [ref=e1048] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.file"
              - paragraph
              - paragraph [ref=e1049]:
                - text: File that contains a
                - emphasis [ref=e1050]: pre-generated
                - text: JWT assertion.
              - paragraph [ref=e1051]: The underlying implementation caches the file contents to avoid the performance hit of loading the file on each access. The caching mechanism will detect whenthe file changes to allow for the file to be reloaded on modifications. This allows for "live" assertion rotation without restarting the Kafka client.
              - paragraph [ref=e1052]: "The file contains the assertion in the serialized, three part JWT format:"
              - list [ref=e1053]:
                - listitem [ref=e1054]:
                  - text: The
                  - emphasis [ref=e1055]: header
                  - text: section is a base 64-encoded JWT header that contains values like
                  - code [ref=e1056]: alg
                  - text: (Algorithm),
                  - code [ref=e1057]: typ
                  - text: (Type, always the literal value
                  - code [ref=e1058]: JWT
                  - text: ), etc.
                - listitem [ref=e1059]:
                  - text: The
                  - emphasis [ref=e1060]: payload
                  - text: section includes the base 64-encoded set of JWT claims, such as
                  - code [ref=e1061]: aud
                  - text: (Audience),
                  - code [ref=e1062]: iss
                  - text: (Issuer),
                  - code [ref=e1063]: sub
                  - text: (Subject), etc.
                - listitem [ref=e1064]:
                  - text: The
                  - emphasis [ref=e1065]: signature
                  - text: section is the concatenated
                  - emphasis [ref=e1066]: header
                  - text: and
                  - emphasis [ref=e1067]: payload
                  - text: sections that was signed using a private key
              - paragraph [ref=e1068]:
                - text: See
                - link "RFC 7519" [ref=e1069] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc7519
                - text: and
                - link "RFC 7515" [ref=e1070] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc7515
                - text: for more details on the JWT and JWS formats.
              - paragraph [ref=e1071]:
                - emphasis [ref=e1072]: Note
                - text: ": If a value for"
                - code [ref=e1073]: sasl.oauthbearer.assertion.file
                - text: is provided, all other
                - code [ref=e1074]: sasl.oauthbearer.assertion.
                - text: "* configurations are ignored."
              - paragraph
              - table [ref=e1075]:
                - rowgroup [ref=e1076]:
                  - row [ref=e1077]:
                    - rowheader "Type:" [ref=e1078]
                    - cell "string" [ref=e1079]
                  - row [ref=e1080]:
                    - rowheader "Default:" [ref=e1081]
                    - cell "null" [ref=e1082]
                  - row [ref=e1083]:
                    - columnheader "Valid Values:" [ref=e1084]
                    - cell [ref=e1085]
                  - row [ref=e1086]:
                    - rowheader "Importance:" [ref=e1087]
                    - cell "medium" [ref=e1088]
            - listitem [ref=e1089]:
              - heading [level=4] [ref=e1090]:
                - link "sasl.oauthbearer.assertion.private.key.file" [ref=e1091] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.private.key.file"
              - paragraph
              - paragraph [ref=e1092]: File that contains a private key in the standard PEM format which is used to sign the JWT assertion sent to the identity provider.
              - paragraph [ref=e1093]: The underlying implementation caches the file contents to avoid the performance hit of loading the file on each access. The caching mechanism will detect when the file changes to allow for the file to be reloaded on modifications. This allows for "live" private key rotation without restarting the Kafka client.
              - paragraph [ref=e1094]:
                - emphasis [ref=e1095]: Note
                - text: ": If a value for"
                - code [ref=e1096]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1097]:
                - rowgroup [ref=e1098]:
                  - row [ref=e1099]:
                    - rowheader "Type:" [ref=e1100]
                    - cell "string" [ref=e1101]
                  - row [ref=e1102]:
                    - rowheader "Default:" [ref=e1103]
                    - cell "null" [ref=e1104]
                  - row [ref=e1105]:
                    - columnheader "Valid Values:" [ref=e1106]
                    - cell [ref=e1107]
                  - row [ref=e1108]:
                    - rowheader "Importance:" [ref=e1109]
                    - cell "medium" [ref=e1110]
            - listitem [ref=e1111]:
              - heading [level=4] [ref=e1112]:
                - link "sasl.oauthbearer.assertion.private.key.passphrase" [ref=e1113] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.private.key.passphrase"
              - paragraph
              - paragraph [ref=e1114]:
                - text: The optional passphrase to decrypt the private key file specified by
                - code [ref=e1115]: sasl.oauthbearer.assertion.private.key.file
                - text: .
              - paragraph [ref=e1116]:
                - emphasis [ref=e1117]: Note
                - text: ": If the file referred to by"
                - code [ref=e1118]: sasl.oauthbearer.assertion.private.key.file
                - text: is modified on the file system at runtime and it was created with a
                - emphasis [ref=e1119]: different
                - text: passphrase than it was previously, the client will not be able to access the private key file because the passphrase is now out of date. For that reason, when using private key passphrases, either use the same passphrase each time, or—for improved security—restart the Kafka client using the new passphrase configuration.
              - paragraph [ref=e1120]:
                - emphasis [ref=e1121]: Note
                - text: ": If a value for"
                - code [ref=e1122]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1123]:
                - rowgroup [ref=e1124]:
                  - row [ref=e1125]:
                    - rowheader "Type:" [ref=e1126]
                    - cell "password" [ref=e1127]
                  - row [ref=e1128]:
                    - rowheader "Default:" [ref=e1129]
                    - cell "null" [ref=e1130]
                  - row [ref=e1131]:
                    - columnheader "Valid Values:" [ref=e1132]
                    - cell [ref=e1133]
                  - row [ref=e1134]:
                    - rowheader "Importance:" [ref=e1135]
                    - cell "medium" [ref=e1136]
            - listitem [ref=e1137]:
              - heading [level=4] [ref=e1138]:
                - link "sasl.oauthbearer.assertion.template.file" [ref=e1139] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.template.file"
              - paragraph
              - paragraph [ref=e1140]: This optional configuration specifies the file containing the JWT headers and/or payload claims to be used when creating the JWT assertion.
              - paragraph [ref=e1141]: Not all identity providers require the same set of claims; some may require a given claim while others may prohibit it. In order to provide the most flexibility, this configuration allows the user to provide the static header values and claims that are to be included in the JWT.
              - paragraph [ref=e1142]:
                - emphasis [ref=e1143]: Note
                - text: ": If a value for"
                - code [ref=e1144]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e1145]:
                - rowgroup [ref=e1146]:
                  - row [ref=e1147]:
                    - rowheader "Type:" [ref=e1148]
                    - cell "string" [ref=e1149]
                  - row [ref=e1150]:
                    - rowheader "Default:" [ref=e1151]
                    - cell "null" [ref=e1152]
                  - row [ref=e1153]:
                    - columnheader "Valid Values:" [ref=e1154]
                    - cell [ref=e1155]
                  - row [ref=e1156]:
                    - rowheader "Importance:" [ref=e1157]
                    - cell "medium" [ref=e1158]
            - listitem [ref=e1159]:
              - heading [level=4] [ref=e1160]:
                - link "sasl.oauthbearer.client.credentials.client.id" [ref=e1161] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.client.credentials.client.id"
              - paragraph
              - paragraph [ref=e1162]: The ID (defined in/by the OAuth identity provider) to identify the client requesting the token.
              - paragraph [ref=e1163]:
                - text: The client ID was previously stored as part of the
                - code [ref=e1164]: sasl.jaas.config
                - text: configuration with the key
                - code [ref=e1165]: clientId
                - text: . For backward compatibility, the
                - code [ref=e1166]: clientId
                - text: JAAS option can still be used, but it is deprecated and will be removed in a future version.
              - paragraph [ref=e1167]: "Order of precedence:"
              - list [ref=e1168]:
                - listitem [ref=e1169]:
                  - code [ref=e1170]: sasl.oauthbearer.client.credentials.client.id
                  - text: from configuration
                - listitem [ref=e1171]:
                  - code [ref=e1172]: clientId
                  - text: from JAAS
              - paragraph
              - table [ref=e1173]:
                - rowgroup [ref=e1174]:
                  - row [ref=e1175]:
                    - rowheader "Type:" [ref=e1176]
                    - cell "string" [ref=e1177]
                  - row [ref=e1178]:
                    - rowheader "Default:" [ref=e1179]
                    - cell "null" [ref=e1180]
                  - row [ref=e1181]:
                    - columnheader "Valid Values:" [ref=e1182]
                    - cell [ref=e1183]
                  - row [ref=e1184]:
                    - rowheader "Importance:" [ref=e1185]
                    - cell "medium" [ref=e1186]
            - listitem [ref=e1187]:
              - heading [level=4] [ref=e1188]:
                - link "sasl.oauthbearer.client.credentials.client.secret" [ref=e1189] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.client.credentials.client.secret"
              - paragraph
              - paragraph [ref=e1190]: The secret (defined by either the user or preassigned, depending on the identity provider) of the client requesting the token.
              - paragraph [ref=e1191]:
                - text: The client secret was previously stored as part of the
                - code [ref=e1192]: sasl.jaas.config
                - text: configuration with the key
                - code [ref=e1193]: clientSecret
                - text: . For backward compatibility, the
                - code [ref=e1194]: clientSecret
                - text: JAAS option can still be used, but it is deprecated and will be removed in a future version.
              - paragraph [ref=e1195]: "Order of precedence:"
              - list [ref=e1196]:
                - listitem [ref=e1197]:
                  - code [ref=e1198]: sasl.oauthbearer.client.credentials.client.secret
                  - text: from configuration
                - listitem [ref=e1199]:
                  - code [ref=e1200]: clientSecret
                  - text: from JAAS
              - paragraph
              - table [ref=e1201]:
                - rowgroup [ref=e1202]:
                  - row [ref=e1203]:
                    - rowheader "Type:" [ref=e1204]
                    - cell "password" [ref=e1205]
                  - row [ref=e1206]:
                    - rowheader "Default:" [ref=e1207]
                    - cell "null" [ref=e1208]
                  - row [ref=e1209]:
                    - columnheader "Valid Values:" [ref=e1210]
                    - cell [ref=e1211]
                  - row [ref=e1212]:
                    - rowheader "Importance:" [ref=e1213]
                    - cell "medium" [ref=e1214]
            - listitem [ref=e1215]:
              - heading [level=4] [ref=e1216]:
                - link "sasl.oauthbearer.jwks.endpoint.url" [ref=e1217] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.jwks.endpoint.url"
              - paragraph [ref=e1218]:
                - text: The OAuth/OIDC provider URL from which the provider's
                - link "JWKS (JSON Web Key Set)" [ref=e1219] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc7517#section-5
                - text: can be retrieved. The URL can be HTTP(S)-based or file-based. If the URL is HTTP(S)-based, the JWKS data will be retrieved from the OAuth/OIDC provider via the configured URL on broker startup. All then-current keys will be cached on the broker for incoming requests. If an authentication request is received for a JWT that includes a "kid" header claim value that isn't yet in the cache, the JWKS endpoint will be queried again on demand. However, the broker polls the URL every sasl.oauthbearer.jwks.endpoint.refresh.ms milliseconds to refresh the cache with any forthcoming keys before any JWT requests that include them are received. If the URL is file-based, the broker will load the JWKS file from a configured location on startup. In the event that the JWT includes a "kid" header value that isn't in the JWKS file, the broker will reject the JWT and authentication will fail.
              - table [ref=e1220]:
                - rowgroup [ref=e1221]:
                  - row [ref=e1222]:
                    - rowheader "Type:" [ref=e1223]
                    - cell "string" [ref=e1224]
                  - row [ref=e1225]:
                    - rowheader "Default:" [ref=e1226]
                    - cell "null" [ref=e1227]
                  - row [ref=e1228]:
                    - columnheader "Valid Values:" [ref=e1229]
                    - cell [ref=e1230]
                  - row [ref=e1231]:
                    - rowheader "Importance:" [ref=e1232]
                    - cell "medium" [ref=e1233]
            - listitem [ref=e1234]:
              - heading [level=4] [ref=e1235]:
                - link "sasl.oauthbearer.jwt.retriever.class" [ref=e1236] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.jwt.retriever.class"
              - paragraph
              - paragraph [ref=e1237]:
                - text: The fully-qualified class name of a
                - code [ref=e1238]: JwtRetriever
                - text: implementation used to request tokens from the identity provider.
              - paragraph [ref=e1239]: The default configuration value represents a class that maintains backward compatibility with previous versions of Apache Kafka. The default implementation uses the configuration to determine which concrete implementation to create.
              - paragraph [ref=e1240]: "Other implementations that are provided include:"
              - list [ref=e1241]:
                - listitem [ref=e1242]:
                  - code [ref=e1243]: org.apache.kafka.common.security.oauthbearer.ClientCredentialsJwtRetriever
                - listitem [ref=e1244]:
                  - code [ref=e1245]: org.apache.kafka.common.security.oauthbearer.DefaultJwtRetriever
                - listitem [ref=e1246]:
                  - code [ref=e1247]: org.apache.kafka.common.security.oauthbearer.FileJwtRetriever
                - listitem [ref=e1248]:
                  - code [ref=e1249]: org.apache.kafka.common.security.oauthbearer.JwtBearerJwtRetriever
              - paragraph
              - table [ref=e1250]:
                - rowgroup [ref=e1251]:
                  - row [ref=e1252]:
                    - rowheader "Type:" [ref=e1253]
                    - cell "class" [ref=e1254]
                  - row [ref=e1255]:
                    - rowheader "Default:" [ref=e1256]
                    - cell "org.apache.kafka.common.security.oauthbearer.DefaultJwtRetriever" [ref=e1257]
                  - row [ref=e1258]:
                    - columnheader "Valid Values:" [ref=e1259]
                    - cell [ref=e1260]
                  - row [ref=e1261]:
                    - rowheader "Importance:" [ref=e1262]
                    - cell "medium" [ref=e1263]
            - listitem [ref=e1264]:
              - heading [level=4] [ref=e1265]:
                - link "sasl.oauthbearer.jwt.validator.class" [ref=e1266] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.jwt.validator.class"
              - paragraph
              - paragraph [ref=e1267]:
                - text: The fully-qualified class name of a
                - code [ref=e1268]: JwtValidator
                - text: implementation used to validate the JWT from the identity provider.
              - paragraph [ref=e1269]:
                - text: The default validator (
                - code [ref=e1270]: org.apache.kafka.common.security.oauthbearer.DefaultJwtValidator
                - text: ) maintains backward compatibility with previous versions of Apache Kafka. The default validator uses configuration to determine which concrete implementation to create.
              - paragraph [ref=e1271]:
                - text: The built-in
                - code [ref=e1272]: JwtValidator
                - text: "implementations are:"
              - list [ref=e1273]:
                - listitem [ref=e1274]:
                  - code [ref=e1275]: org.apache.kafka.common.security.oauthbearer.BrokerJwtValidator
                - listitem [ref=e1276]:
                  - code [ref=e1277]: org.apache.kafka.common.security.oauthbearer.ClientJwtValidator
                - listitem [ref=e1278]:
                  - code [ref=e1279]: org.apache.kafka.common.security.oauthbearer.DefaultJwtValidator
              - paragraph
              - table [ref=e1280]:
                - rowgroup [ref=e1281]:
                  - row [ref=e1282]:
                    - rowheader "Type:" [ref=e1283]
                    - cell "class" [ref=e1284]
                  - row [ref=e1285]:
                    - rowheader "Default:" [ref=e1286]
                    - cell "org.apache.kafka.common.security.oauthbearer.DefaultJwtValidator" [ref=e1287]
                  - row [ref=e1288]:
                    - columnheader "Valid Values:" [ref=e1289]
                    - cell [ref=e1290]
                  - row [ref=e1291]:
                    - rowheader "Importance:" [ref=e1292]
                    - cell "medium" [ref=e1293]
            - listitem [ref=e1294]:
              - heading [level=4] [ref=e1295]:
                - link "sasl.oauthbearer.scope" [ref=e1296] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.scope"
              - paragraph
              - paragraph [ref=e1297]: This is the level of access a client application is granted to a resource or API which is included in the token request. If provided, it should match one or more scopes configured in the identity provider.
              - paragraph [ref=e1298]:
                - text: The scope was previously stored as part of the
                - code [ref=e1299]: sasl.jaas.config
                - text: configuration with the key
                - code [ref=e1300]: scope
                - text: . For backward compatibility, the
                - code [ref=e1301]: scope
                - text: JAAS option can still be used, but it is deprecated and will be removed in a future version.
              - paragraph [ref=e1302]: "Order of precedence:"
              - list [ref=e1303]:
                - listitem [ref=e1304]:
                  - code [ref=e1305]: sasl.oauthbearer.scope
                  - text: from configuration
                - listitem [ref=e1306]:
                  - code [ref=e1307]: scope
                  - text: from JAAS
              - paragraph
              - table [ref=e1308]:
                - rowgroup [ref=e1309]:
                  - row [ref=e1310]:
                    - rowheader "Type:" [ref=e1311]
                    - cell "string" [ref=e1312]
                  - row [ref=e1313]:
                    - rowheader "Default:" [ref=e1314]
                    - cell "null" [ref=e1315]
                  - row [ref=e1316]:
                    - columnheader "Valid Values:" [ref=e1317]
                    - cell [ref=e1318]
                  - row [ref=e1319]:
                    - rowheader "Importance:" [ref=e1320]
                    - cell "medium" [ref=e1321]
            - listitem [ref=e1322]:
              - heading [level=4] [ref=e1323]:
                - link "sasl.oauthbearer.token.endpoint.url" [ref=e1324] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.token.endpoint.url"
              - paragraph [ref=e1325]:
                - text: The URL for the OAuth/OIDC identity provider. If the URL is HTTP(S)-based, it is the issuer's token endpoint URL to which requests will be made to login based on the configuration in
                - code [ref=e1326]: sasl.oauthbearer.jwt.retriever.class
                - text: . If the URL is file-based, it specifies a file containing an access token (in JWT serialized form) issued by the OAuth/OIDC identity provider to use for authorization.
              - table [ref=e1327]:
                - rowgroup [ref=e1328]:
                  - row [ref=e1329]:
                    - rowheader "Type:" [ref=e1330]
                    - cell "string" [ref=e1331]
                  - row [ref=e1332]:
                    - rowheader "Default:" [ref=e1333]
                    - cell "null" [ref=e1334]
                  - row [ref=e1335]:
                    - columnheader "Valid Values:" [ref=e1336]
                    - cell [ref=e1337]
                  - row [ref=e1338]:
                    - rowheader "Importance:" [ref=e1339]
                    - cell "medium" [ref=e1340]
            - listitem [ref=e1341]:
              - heading [level=4] [ref=e1342]:
                - link "security.protocol" [ref=e1343] [cursor=pointer]:
                  - /url: "#consumerconfigs_security.protocol"
              - paragraph [ref=e1344]: Protocol used to communicate with brokers.
              - table [ref=e1345]:
                - rowgroup [ref=e1346]:
                  - row [ref=e1347]:
                    - rowheader "Type:" [ref=e1348]
                    - cell "string" [ref=e1349]
                  - row [ref=e1350]:
                    - rowheader "Default:" [ref=e1351]
                    - cell "PLAINTEXT" [ref=e1352]
                  - row [ref=e1353]:
                    - rowheader "Valid Values:" [ref=e1354]
                    - cell "(case insensitive) [SASL_SSL, PLAINTEXT, SSL, SASL_PLAINTEXT]" [ref=e1355]
                  - row [ref=e1356]:
                    - rowheader "Importance:" [ref=e1357]
                    - cell "medium" [ref=e1358]
            - listitem [ref=e1359]:
              - heading [level=4] [ref=e1360]:
                - link "send.buffer.bytes" [ref=e1361] [cursor=pointer]:
                  - /url: "#consumerconfigs_send.buffer.bytes"
              - paragraph [ref=e1362]: The size of the TCP send buffer (SO_SNDBUF) to use when sending data. If the value is -1, the OS default will be used.
              - table [ref=e1363]:
                - rowgroup [ref=e1364]:
                  - row [ref=e1365]:
                    - rowheader "Type:" [ref=e1366]
                    - cell "int" [ref=e1367]
                  - row [ref=e1368]:
                    - rowheader "Default:" [ref=e1369]
                    - cell "131072 (128 kibibytes)" [ref=e1370]
                  - row [ref=e1371]:
                    - rowheader "Valid Values:" [ref=e1372]
                    - cell "[-1,...]" [ref=e1373]
                  - row [ref=e1374]:
                    - rowheader "Importance:" [ref=e1375]
                    - cell "medium" [ref=e1376]
            - listitem [ref=e1377]:
              - heading [level=4] [ref=e1378]:
                - link "share.acknowledgement.mode" [ref=e1379] [cursor=pointer]:
                  - /url: "#consumerconfigs_share.acknowledgement.mode"
              - paragraph [ref=e1380]:
                - text: Controls the acknowledgement mode for a share consumer. If set to
                - code [ref=e1381]: implicit
                - text: ", the acknowledgement mode of the consumer is implicit and it must not use"
                - code [ref=e1382]: org.apache.kafka.clients.consumer.ShareConsumer.acknowledge()
                - text: to acknowledge delivery of records. Instead, delivery is acknowledged implicitly on the next call to poll or commit. If set to
                - code [ref=e1383]: explicit
                - text: ", the acknowledgement mode of the consumer is explicit and it must use"
                - code [ref=e1384]: org.apache.kafka.clients.consumer.ShareConsumer.acknowledge()
                - text: to acknowledge delivery of records.
              - table [ref=e1385]:
                - rowgroup [ref=e1386]:
                  - row [ref=e1387]:
                    - rowheader "Type:" [ref=e1388]
                    - cell "string" [ref=e1389]
                  - row [ref=e1390]:
                    - rowheader "Default:" [ref=e1391]
                    - cell "implicit" [ref=e1392]
                  - row [ref=e1393]:
                    - rowheader "Valid Values:" [ref=e1394]
                    - cell "[implicit, explicit]" [ref=e1395]
                  - row [ref=e1396]:
                    - rowheader "Importance:" [ref=e1397]
                    - cell "medium" [ref=e1398]
            - listitem [ref=e1399]:
              - heading [level=4] [ref=e1400]:
                - link "share.acquire.mode" [ref=e1401] [cursor=pointer]:
                  - /url: "#consumerconfigs_share.acquire.mode"
              - paragraph [ref=e1402]:
                - text: Controls the acquire mode for a share consumer. If set to
                - code [ref=e1403]: record_limit
                - text: ", the number of records returned in each poll() will not exceed the value of"
                - code [ref=e1404]: max.poll.records
                - text: . If set to
                - code [ref=e1405]: batch_optimized
                - text: ", the number of records returned in each poll() call may exceed"
                - code [ref=e1406]: max.poll.records
                - text: to align with batch boundaries for optimization.
              - table [ref=e1407]:
                - rowgroup [ref=e1408]:
                  - row [ref=e1409]:
                    - rowheader "Type:" [ref=e1410]
                    - cell "string" [ref=e1411]
                  - row [ref=e1412]:
                    - rowheader "Default:" [ref=e1413]
                    - cell "BATCH_OPTIMIZED" [ref=e1414]
                  - row [ref=e1415]:
                    - rowheader "Valid Values:" [ref=e1416]
                    - cell "[batch_optimized, record_limit]" [ref=e1417]
                  - row [ref=e1418]:
                    - rowheader "Importance:" [ref=e1419]
                    - cell "medium" [ref=e1420]
            - listitem [ref=e1421]:
              - heading [level=4] [ref=e1422]:
                - link "socket.connection.setup.timeout.max.ms" [ref=e1423] [cursor=pointer]:
                  - /url: "#consumerconfigs_socket.connection.setup.timeout.max.ms"
              - paragraph [ref=e1424]: The maximum amount of time the client will wait for the socket connection to be established. The connection setup timeout will increase exponentially for each consecutive connection failure up to this maximum. To avoid connection storms, a randomization factor of 0.2 will be applied to the timeout resulting in a random range between 20% below and 20% above the computed value.
              - table [ref=e1425]:
                - rowgroup [ref=e1426]:
                  - row [ref=e1427]:
                    - rowheader "Type:" [ref=e1428]
                    - cell "long" [ref=e1429]
                  - row [ref=e1430]:
                    - rowheader "Default:" [ref=e1431]
                    - cell "30000 (30 seconds)" [ref=e1432]
                  - row [ref=e1433]:
                    - columnheader "Valid Values:" [ref=e1434]
                    - cell [ref=e1435]
                  - row [ref=e1436]:
                    - rowheader "Importance:" [ref=e1437]
                    - cell "medium" [ref=e1438]
            - listitem [ref=e1439]:
              - heading [level=4] [ref=e1440]:
                - link "socket.connection.setup.timeout.ms" [ref=e1441] [cursor=pointer]:
                  - /url: "#consumerconfigs_socket.connection.setup.timeout.ms"
              - paragraph [ref=e1442]:
                - text: The amount of time the client will wait for the socket connection to be established. If the connection is not built before the timeout elapses, clients will close the socket channel. This value is the initial backoff value and will increase exponentially for each consecutive connection failure, up to the
                - code [ref=e1443]: socket.connection.setup.timeout.max.ms
                - text: value.
              - table [ref=e1444]:
                - rowgroup [ref=e1445]:
                  - row [ref=e1446]:
                    - rowheader "Type:" [ref=e1447]
                    - cell "long" [ref=e1448]
                  - row [ref=e1449]:
                    - rowheader "Default:" [ref=e1450]
                    - cell "10000 (10 seconds)" [ref=e1451]
                  - row [ref=e1452]:
                    - columnheader "Valid Values:" [ref=e1453]
                    - cell [ref=e1454]
                  - row [ref=e1455]:
                    - rowheader "Importance:" [ref=e1456]
                    - cell "medium" [ref=e1457]
            - listitem [ref=e1458]:
              - heading [level=4] [ref=e1459]:
                - link "ssl.enabled.protocols" [ref=e1460] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.enabled.protocols"
              - paragraph [ref=e1461]:
                - text: The list of protocols enabled for SSL connections. The default is 'TLSv1.2,TLSv1.3'. This means that clients and servers will prefer TLSv1.3 if both support it and fallback to TLSv1.2 otherwise (assuming both support at least TLSv1.2). This default should be fine for most use cases. If this configuration is set to an empty list, Kafka will use the protocols enabled by default in the underlying SSLEngine, which may include additional protocols depending on the JVM version. Also see the config documentation for
                - code [ref=e1462]: ssl.protocol
                - text: to understand how it can impact the TLS version negotiation behavior.
              - table [ref=e1463]:
                - rowgroup [ref=e1464]:
                  - row [ref=e1465]:
                    - rowheader "Type:" [ref=e1466]
                    - cell "list" [ref=e1467]
                  - row [ref=e1468]:
                    - rowheader "Default:" [ref=e1469]
                    - cell "TLSv1.2,TLSv1.3" [ref=e1470]
                  - row [ref=e1471]:
                    - columnheader "Valid Values:" [ref=e1472]
                    - cell [ref=e1473]
                  - row [ref=e1474]:
                    - rowheader "Importance:" [ref=e1475]
                    - cell "medium" [ref=e1476]
            - listitem [ref=e1477]:
              - heading [level=4] [ref=e1478]:
                - link "ssl.keystore.type" [ref=e1479] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.keystore.type"
              - paragraph [ref=e1480]:
                - text: The file format of the key store file. This is optional for client. The values currently supported by the default
                - code [ref=e1481]: ssl.engine.factory.class
                - text: are [JKS, PKCS12, PEM].
              - table [ref=e1482]:
                - rowgroup [ref=e1483]:
                  - row [ref=e1484]:
                    - rowheader "Type:" [ref=e1485]
                    - cell "string" [ref=e1486]
                  - row [ref=e1487]:
                    - rowheader "Default:" [ref=e1488]
                    - cell "JKS" [ref=e1489]
                  - row [ref=e1490]:
                    - columnheader "Valid Values:" [ref=e1491]
                    - cell [ref=e1492]
                  - row [ref=e1493]:
                    - rowheader "Importance:" [ref=e1494]
                    - cell "medium" [ref=e1495]
            - listitem [ref=e1496]:
              - heading [level=4] [ref=e1497]:
                - link "ssl.protocol" [ref=e1498] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.protocol"
              - paragraph [ref=e1499]:
                - text: The SSL protocol used to generate the SSLContext. The default is 'TLSv1.3', which should be fine for most use cases. A typical alternative to the default is 'TLSv1.2'. Allowed values for this config are dependent on the JVM. Clients using the defaults for this config and 'ssl.enabled.protocols' will downgrade to 'TLSv1.2' if the server does not support 'TLSv1.3'. If this config is set to 'TLSv1.2', however, clients will not use 'TLSv1.3' even if it is one of the values in
                - code [ref=e1500]: ssl.enabled.protocols
                - text: and the server only supports 'TLSv1.3'.
              - table [ref=e1501]:
                - rowgroup [ref=e1502]:
                  - row [ref=e1503]:
                    - rowheader "Type:" [ref=e1504]
                    - cell "string" [ref=e1505]
                  - row [ref=e1506]:
                    - rowheader "Default:" [ref=e1507]
                    - cell "TLSv1.3" [ref=e1508]
                  - row [ref=e1509]:
                    - columnheader "Valid Values:" [ref=e1510]
                    - cell [ref=e1511]
                  - row [ref=e1512]:
                    - rowheader "Importance:" [ref=e1513]
                    - cell "medium" [ref=e1514]
            - listitem [ref=e1515]:
              - heading [level=4] [ref=e1516]:
                - link "ssl.provider" [ref=e1517] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.provider"
              - paragraph [ref=e1518]: The name of the security provider used for SSL connections. Default value is the default security provider of the JVM.
              - table [ref=e1519]:
                - rowgroup [ref=e1520]:
                  - row [ref=e1521]:
                    - rowheader "Type:" [ref=e1522]
                    - cell "string" [ref=e1523]
                  - row [ref=e1524]:
                    - rowheader "Default:" [ref=e1525]
                    - cell "null" [ref=e1526]
                  - row [ref=e1527]:
                    - columnheader "Valid Values:" [ref=e1528]
                    - cell [ref=e1529]
                  - row [ref=e1530]:
                    - rowheader "Importance:" [ref=e1531]
                    - cell "medium" [ref=e1532]
            - listitem [ref=e1533]:
              - heading [level=4] [ref=e1534]:
                - link "ssl.truststore.type" [ref=e1535] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.truststore.type"
              - paragraph [ref=e1536]:
                - text: The file format of the trust store file. The values currently supported by the default
                - code [ref=e1537]: ssl.engine.factory.class
                - text: are [JKS, PKCS12, PEM].
              - table [ref=e1538]:
                - rowgroup [ref=e1539]:
                  - row [ref=e1540]:
                    - rowheader "Type:" [ref=e1541]
                    - cell "string" [ref=e1542]
                  - row [ref=e1543]:
                    - rowheader "Default:" [ref=e1544]
                    - cell "JKS" [ref=e1545]
                  - row [ref=e1546]:
                    - columnheader "Valid Values:" [ref=e1547]
                    - cell [ref=e1548]
                  - row [ref=e1549]:
                    - rowheader "Importance:" [ref=e1550]
                    - cell "medium" [ref=e1551]
            - listitem [ref=e1552]:
              - heading [level=4] [ref=e1553]:
                - link "auto.commit.interval.ms" [ref=e1554] [cursor=pointer]:
                  - /url: "#consumerconfigs_auto.commit.interval.ms"
              - paragraph [ref=e1555]:
                - text: The frequency in milliseconds that the consumer offsets are auto-committed to Kafka if
                - code [ref=e1556]: enable.auto.commit
                - text: is set to
                - code [ref=e1557]: "true"
                - text: .
              - table [ref=e1558]:
                - rowgroup [ref=e1559]:
                  - row [ref=e1560]:
                    - rowheader "Type:" [ref=e1561]
                    - cell "int" [ref=e1562]
                  - row [ref=e1563]:
                    - rowheader "Default:" [ref=e1564]
                    - cell "5000 (5 seconds)" [ref=e1565]
                  - row [ref=e1566]:
                    - rowheader "Valid Values:" [ref=e1567]
                    - cell "[0,...]" [ref=e1568]
                  - row [ref=e1569]:
                    - rowheader "Importance:" [ref=e1570]
                    - cell "low" [ref=e1571]
            - listitem [ref=e1572]:
              - heading [level=4] [ref=e1573]:
                - link "check.crcs" [ref=e1574] [cursor=pointer]:
                  - /url: "#consumerconfigs_check.crcs"
              - paragraph [ref=e1575]: Automatically check the CRC32 of the records consumed. This ensures no on-the-wire or on-disk corruption to the messages occurred. This check adds some overhead, so it may be disabled in cases seeking extreme performance.
              - table [ref=e1576]:
                - rowgroup [ref=e1577]:
                  - row [ref=e1578]:
                    - rowheader "Type:" [ref=e1579]
                    - cell "boolean" [ref=e1580]
                  - row [ref=e1581]:
                    - rowheader "Default:" [ref=e1582]
                    - cell "true" [ref=e1583]
                  - row [ref=e1584]:
                    - columnheader "Valid Values:" [ref=e1585]
                    - cell [ref=e1586]
                  - row [ref=e1587]:
                    - rowheader "Importance:" [ref=e1588]
                    - cell "low" [ref=e1589]
            - listitem [ref=e1590]:
              - heading [level=4] [ref=e1591]:
                - link "client.id" [ref=e1592] [cursor=pointer]:
                  - /url: "#consumerconfigs_client.id"
              - paragraph [ref=e1593]: An id string to pass to the server when making requests. The purpose of this is to be able to track the source of requests beyond just ip/port by allowing a logical application name to be included in server-side request logging.
              - table [ref=e1594]:
                - rowgroup [ref=e1595]:
                  - row [ref=e1596]:
                    - rowheader "Type:" [ref=e1597]
                    - cell "string" [ref=e1598]
                  - row [ref=e1599]:
                    - rowheader "Default:" [ref=e1600]
                    - cell "\"\"" [ref=e1601]
                  - row [ref=e1602]:
                    - columnheader "Valid Values:" [ref=e1603]
                    - cell [ref=e1604]
                  - row [ref=e1605]:
                    - rowheader "Importance:" [ref=e1606]
                    - cell "low" [ref=e1607]
            - listitem [ref=e1608]:
              - heading [level=4] [ref=e1609]:
                - link "client.rack" [ref=e1610] [cursor=pointer]:
                  - /url: "#consumerconfigs_client.rack"
              - paragraph [ref=e1611]: A rack identifier for this client. This can be any string value which indicates where this client is physically located. It corresponds with the broker config 'broker.rack'
              - table [ref=e1612]:
                - rowgroup [ref=e1613]:
                  - row [ref=e1614]:
                    - rowheader "Type:" [ref=e1615]
                    - cell "string" [ref=e1616]
                  - row [ref=e1617]:
                    - rowheader "Default:" [ref=e1618]
                    - cell "\"\"" [ref=e1619]
                  - row [ref=e1620]:
                    - columnheader "Valid Values:" [ref=e1621]
                    - cell [ref=e1622]
                  - row [ref=e1623]:
                    - rowheader "Importance:" [ref=e1624]
                    - cell "low" [ref=e1625]
            - listitem [ref=e1626]:
              - heading [level=4] [ref=e1627]:
                - link "config.providers" [ref=e1628] [cursor=pointer]:
                  - /url: "#consumerconfigs_config.providers"
              - paragraph [ref=e1629]:
                - text: Comma-separated alias names for classes implementing the
                - code [ref=e1630]: ConfigProvider
                - text: interface. This enables loading configuration data (such as passwords, API keys, and other credentials) from external sources. For example, see
                - link "Configuration Providers" [ref=e1631] [cursor=pointer]:
                  - /url: https://kafka.apache.org/documentation/#config_providers
                - text: .
              - table [ref=e1632]:
                - rowgroup [ref=e1633]:
                  - row [ref=e1634]:
                    - rowheader "Type:" [ref=e1635]
                    - cell "list" [ref=e1636]
                  - row [ref=e1637]:
                    - rowheader "Default:" [ref=e1638]
                    - cell "\"\"" [ref=e1639]
                  - row [ref=e1640]:
                    - columnheader "Valid Values:" [ref=e1641]
                    - cell [ref=e1642]
                  - row [ref=e1643]:
                    - rowheader "Importance:" [ref=e1644]
                    - cell "low" [ref=e1645]
            - listitem [ref=e1646]:
              - heading [level=4] [ref=e1647]:
                - link "enable.metrics.push" [ref=e1648] [cursor=pointer]:
                  - /url: "#consumerconfigs_enable.metrics.push"
              - paragraph [ref=e1649]: Whether to enable pushing of client metrics to the cluster, if the cluster has a client metrics subscription which matches this client.
              - table [ref=e1650]:
                - rowgroup [ref=e1651]:
                  - row [ref=e1652]:
                    - rowheader "Type:" [ref=e1653]
                    - cell "boolean" [ref=e1654]
                  - row [ref=e1655]:
                    - rowheader "Default:" [ref=e1656]
                    - cell "true" [ref=e1657]
                  - row [ref=e1658]:
                    - columnheader "Valid Values:" [ref=e1659]
                    - cell [ref=e1660]
                  - row [ref=e1661]:
                    - rowheader "Importance:" [ref=e1662]
                    - cell "low" [ref=e1663]
            - listitem [ref=e1664]:
              - heading [level=4] [ref=e1665]:
                - link "fetch.max.wait.ms" [ref=e1666] [cursor=pointer]:
                  - /url: "#consumerconfigs_fetch.max.wait.ms"
              - paragraph [ref=e1667]: The maximum amount of time the server will block before answering the fetch request there isn't sufficient data to immediately satisfy the requirement given by fetch.min.bytes. This config is used only for local log fetch. To tune the remote fetch maximum wait time, please refer to 'remote.fetch.max.wait.ms' broker config
              - table [ref=e1668]:
                - rowgroup [ref=e1669]:
                  - row [ref=e1670]:
                    - rowheader "Type:" [ref=e1671]
                    - cell "int" [ref=e1672]
                  - row [ref=e1673]:
                    - rowheader "Default:" [ref=e1674]
                    - cell "500" [ref=e1675]
                  - row [ref=e1676]:
                    - rowheader "Valid Values:" [ref=e1677]
                    - cell "[0,...]" [ref=e1678]
                  - row [ref=e1679]:
                    - rowheader "Importance:" [ref=e1680]
                    - cell "low" [ref=e1681]
            - listitem [ref=e1682]:
              - heading [level=4] [ref=e1683]:
                - link "interceptor.classes" [ref=e1684] [cursor=pointer]:
                  - /url: "#consumerconfigs_interceptor.classes"
              - paragraph [ref=e1685]:
                - text: A list of classes to use as interceptors. Implementing the
                - code [ref=e1686]: org.apache.kafka.clients.consumer.ConsumerInterceptor
                - text: interface allows you to intercept (and possibly mutate) records received by the consumer. By default, there are no interceptors.
              - table [ref=e1687]:
                - rowgroup [ref=e1688]:
                  - row [ref=e1689]:
                    - rowheader "Type:" [ref=e1690]
                    - cell "list" [ref=e1691]
                  - row [ref=e1692]:
                    - rowheader "Default:" [ref=e1693]
                    - cell "\"\"" [ref=e1694]
                  - row [ref=e1695]:
                    - columnheader "Valid Values:" [ref=e1696]
                    - cell [ref=e1697]
                  - row [ref=e1698]:
                    - rowheader "Importance:" [ref=e1699]
                    - cell "low" [ref=e1700]
            - listitem [ref=e1701]:
              - heading [level=4] [ref=e1702]:
                - link "metadata.max.age.ms" [ref=e1703] [cursor=pointer]:
                  - /url: "#consumerconfigs_metadata.max.age.ms"
              - paragraph [ref=e1704]: The period of time in milliseconds after which we force a refresh of metadata even if we haven't seen any partition leadership changes to proactively discover any new brokers or partitions.
              - table [ref=e1705]:
                - rowgroup [ref=e1706]:
                  - row [ref=e1707]:
                    - rowheader "Type:" [ref=e1708]
                    - cell "long" [ref=e1709]
                  - row [ref=e1710]:
                    - rowheader "Default:" [ref=e1711]
                    - cell "300000 (5 minutes)" [ref=e1712]
                  - row [ref=e1713]:
                    - rowheader "Valid Values:" [ref=e1714]
                    - cell "[0,...]" [ref=e1715]
                  - row [ref=e1716]:
                    - rowheader "Importance:" [ref=e1717]
                    - cell "low" [ref=e1718]
            - listitem [ref=e1719]:
              - heading [level=4] [ref=e1720]:
                - link "metadata.recovery.rebootstrap.trigger.ms" [ref=e1721] [cursor=pointer]:
                  - /url: "#consumerconfigs_metadata.recovery.rebootstrap.trigger.ms"
              - paragraph [ref=e1722]:
                - text: If a client configured to rebootstrap using
                - code [ref=e1723]: metadata.recovery.strategy=rebootstrap
                - text: is unable to obtain metadata from any of the brokers in the last known metadata for this interval, client repeats the bootstrap process using
                - code [ref=e1724]: bootstrap.servers
                - text: configuration.
              - table [ref=e1725]:
                - rowgroup [ref=e1726]:
                  - row [ref=e1727]:
                    - rowheader "Type:" [ref=e1728]
                    - cell "long" [ref=e1729]
                  - row [ref=e1730]:
                    - rowheader "Default:" [ref=e1731]
                    - cell "300000 (5 minutes)" [ref=e1732]
                  - row [ref=e1733]:
                    - rowheader "Valid Values:" [ref=e1734]
                    - cell "[0,...]" [ref=e1735]
                  - row [ref=e1736]:
                    - rowheader "Importance:" [ref=e1737]
                    - cell "low" [ref=e1738]
            - listitem [ref=e1739]:
              - heading [level=4] [ref=e1740]:
                - link "metadata.recovery.strategy" [ref=e1741] [cursor=pointer]:
                  - /url: "#consumerconfigs_metadata.recovery.strategy"
              - paragraph [ref=e1742]:
                - text: Controls how the client recovers when none of the brokers known to it is available. If set to
                - code [ref=e1743]: none
                - text: ", the client fails. If set to"
                - code [ref=e1744]: rebootstrap
                - text: ", the client repeats the bootstrap process using"
                - code [ref=e1745]: bootstrap.servers
                - text: . Rebootstrapping is useful when a client communicates with brokers so infrequently that the set of brokers may change entirely before the client refreshes metadata. Metadata recovery is triggered when all last-known brokers appear unavailable simultaneously. Brokers appear unavailable when disconnected and no current retry attempt is in-progress. Consider increasing
                - code [ref=e1746]: reconnect.backoff.ms
                - text: and
                - code [ref=e1747]: reconnect.backoff.max.ms
                - text: and decreasing
                - code [ref=e1748]: socket.connection.setup.timeout.ms
                - text: and
                - code [ref=e1749]: socket.connection.setup.timeout.max.ms
                - text: for the client. Rebootstrap is also triggered if connection cannot be established to any of the brokers for
                - code [ref=e1750]: metadata.recovery.rebootstrap.trigger.ms
                - text: milliseconds or if server requests rebootstrap.
              - table [ref=e1751]:
                - rowgroup [ref=e1752]:
                  - row [ref=e1753]:
                    - rowheader "Type:" [ref=e1754]
                    - cell "string" [ref=e1755]
                  - row [ref=e1756]:
                    - rowheader "Default:" [ref=e1757]
                    - cell "rebootstrap" [ref=e1758]
                  - row [ref=e1759]:
                    - rowheader "Valid Values:" [ref=e1760]
                    - cell "(case insensitive) [REBOOTSTRAP, NONE]" [ref=e1761]
                  - row [ref=e1762]:
                    - rowheader "Importance:" [ref=e1763]
                    - cell "low" [ref=e1764]
            - listitem [ref=e1765]:
              - heading [level=4] [ref=e1766]:
                - link "metric.reporters" [ref=e1767] [cursor=pointer]:
                  - /url: "#consumerconfigs_metric.reporters"
              - paragraph [ref=e1768]:
                - text: A list of classes to use as metrics reporters. Implementing the
                - code [ref=e1769]: org.apache.kafka.common.metrics.MetricsReporter
                - text: interface allows plugging in classes that will be notified of new metric creation. When custom reporters are set and
                - code [ref=e1770]: org.apache.kafka.common.metrics.JmxReporter
                - text: is needed, it has to be explicitly added to the list.
              - table [ref=e1771]:
                - rowgroup [ref=e1772]:
                  - row [ref=e1773]:
                    - rowheader "Type:" [ref=e1774]
                    - cell "list" [ref=e1775]
                  - row [ref=e1776]:
                    - rowheader "Default:" [ref=e1777]
                    - cell "org.apache.kafka.common.metrics.JmxReporter" [ref=e1778]
                  - row [ref=e1779]:
                    - columnheader "Valid Values:" [ref=e1780]
                    - cell [ref=e1781]
                  - row [ref=e1782]:
                    - rowheader "Importance:" [ref=e1783]
                    - cell "low" [ref=e1784]
            - listitem [ref=e1785]:
              - heading [level=4] [ref=e1786]:
                - link "metrics.num.samples" [ref=e1787] [cursor=pointer]:
                  - /url: "#consumerconfigs_metrics.num.samples"
              - paragraph [ref=e1788]: The number of samples maintained to compute metrics.
              - table [ref=e1789]:
                - rowgroup [ref=e1790]:
                  - row [ref=e1791]:
                    - rowheader "Type:" [ref=e1792]
                    - cell "int" [ref=e1793]
                  - row [ref=e1794]:
                    - rowheader "Default:" [ref=e1795]
                    - cell "2" [ref=e1796]
                  - row [ref=e1797]:
                    - rowheader "Valid Values:" [ref=e1798]
                    - cell "[1,...]" [ref=e1799]
                  - row [ref=e1800]:
                    - rowheader "Importance:" [ref=e1801]
                    - cell "low" [ref=e1802]
            - listitem [ref=e1803]:
              - heading [level=4] [ref=e1804]:
                - link "metrics.recording.level" [ref=e1805] [cursor=pointer]:
                  - /url: "#consumerconfigs_metrics.recording.level"
              - paragraph [ref=e1806]: The highest recording level for metrics. It has three levels for recording metrics - info, debug, and trace.INFO level records only essential metrics necessary for monitoring system performance and health. It collects vital data without gathering too much detail, making it suitable for production environments where minimal overhead is desired.DEBUG level records most metrics, providing more detailed information about the system's operation. It's useful for development and testing environments where you need deeper insights to debug and fine-tune the application.TRACE level records all possible metrics, capturing every detail about the system's performance and operation. It's best for controlled environments where in-depth analysis is required, though it can introduce significant overhead.
              - table [ref=e1807]:
                - rowgroup [ref=e1808]:
                  - row [ref=e1809]:
                    - rowheader "Type:" [ref=e1810]
                    - cell "string" [ref=e1811]
                  - row [ref=e1812]:
                    - rowheader "Default:" [ref=e1813]
                    - cell "INFO" [ref=e1814]
                  - row [ref=e1815]:
                    - rowheader "Valid Values:" [ref=e1816]
                    - cell "[INFO, DEBUG, TRACE]" [ref=e1817]
                  - row [ref=e1818]:
                    - rowheader "Importance:" [ref=e1819]
                    - cell "low" [ref=e1820]
            - listitem [ref=e1821]:
              - heading [level=4] [ref=e1822]:
                - link "metrics.sample.window.ms" [ref=e1823] [cursor=pointer]:
                  - /url: "#consumerconfigs_metrics.sample.window.ms"
              - paragraph [ref=e1824]: The window of time a metrics sample is computed over.
              - table [ref=e1825]:
                - rowgroup [ref=e1826]:
                  - row [ref=e1827]:
                    - rowheader "Type:" [ref=e1828]
                    - cell "long" [ref=e1829]
                  - row [ref=e1830]:
                    - rowheader "Default:" [ref=e1831]
                    - cell "30000 (30 seconds)" [ref=e1832]
                  - row [ref=e1833]:
                    - rowheader "Valid Values:" [ref=e1834]
                    - cell "[0,...]" [ref=e1835]
                  - row [ref=e1836]:
                    - rowheader "Importance:" [ref=e1837]
                    - cell "low" [ref=e1838]
            - listitem [ref=e1839]:
              - heading [level=4] [ref=e1840]:
                - link "reconnect.backoff.max.ms" [ref=e1841] [cursor=pointer]:
                  - /url: "#consumerconfigs_reconnect.backoff.max.ms"
              - paragraph [ref=e1842]: The maximum amount of time in milliseconds to wait when reconnecting to a broker that has repeatedly failed to connect. If provided, the backoff per host will increase exponentially for each consecutive connection failure, up to this maximum. After calculating the backoff increase, 20% random jitter is added to avoid connection storms.
              - table [ref=e1843]:
                - rowgroup [ref=e1844]:
                  - row [ref=e1845]:
                    - rowheader "Type:" [ref=e1846]
                    - cell "long" [ref=e1847]
                  - row [ref=e1848]:
                    - rowheader "Default:" [ref=e1849]
                    - cell "1000 (1 second)" [ref=e1850]
                  - row [ref=e1851]:
                    - rowheader "Valid Values:" [ref=e1852]
                    - cell "[0,...]" [ref=e1853]
                  - row [ref=e1854]:
                    - rowheader "Importance:" [ref=e1855]
                    - cell "low" [ref=e1856]
            - listitem [ref=e1857]:
              - heading [level=4] [ref=e1858]:
                - link "reconnect.backoff.ms" [ref=e1859] [cursor=pointer]:
                  - /url: "#consumerconfigs_reconnect.backoff.ms"
              - paragraph [ref=e1860]:
                - text: The base amount of time to wait before attempting to reconnect to a given host. This avoids repeatedly connecting to a host in a tight loop. This backoff applies to all connection attempts by the client to a broker. This value is the initial backoff value and will increase exponentially for each consecutive connection failure, up to the
                - code [ref=e1861]: reconnect.backoff.max.ms
                - text: value.
              - table [ref=e1862]:
                - rowgroup [ref=e1863]:
                  - row [ref=e1864]:
                    - rowheader "Type:" [ref=e1865]
                    - cell "long" [ref=e1866]
                  - row [ref=e1867]:
                    - rowheader "Default:" [ref=e1868]
                    - cell "50" [ref=e1869]
                  - row [ref=e1870]:
                    - rowheader "Valid Values:" [ref=e1871]
                    - cell "[0,...]" [ref=e1872]
                  - row [ref=e1873]:
                    - rowheader "Importance:" [ref=e1874]
                    - cell "low" [ref=e1875]
            - listitem [ref=e1876]:
              - heading [level=4] [ref=e1877]:
                - link "retry.backoff.max.ms" [ref=e1878] [cursor=pointer]:
                  - /url: "#consumerconfigs_retry.backoff.max.ms"
              - paragraph [ref=e1879]:
                - text: The maximum amount of time in milliseconds to wait when retrying a request to the broker that has repeatedly failed. If provided, the backoff per client will increase exponentially for each failed request, up to this maximum. To prevent all clients from being synchronized upon retry, a randomized jitter with a factor of 0.2 will be applied to the backoff, resulting in the backoff falling within a range between 20% below and 20% above the computed value. If
                - code [ref=e1880]: retry.backoff.ms
                - text: is set to be higher than
                - code [ref=e1881]: retry.backoff.max.ms
                - text: ", then"
                - code [ref=e1882]: retry.backoff.max.ms
                - text: will be used as a constant backoff from the beginning without any exponential increase
              - table [ref=e1883]:
                - rowgroup [ref=e1884]:
                  - row [ref=e1885]:
                    - rowheader "Type:" [ref=e1886]
                    - cell "long" [ref=e1887]
                  - row [ref=e1888]:
                    - rowheader "Default:" [ref=e1889]
                    - cell "1000 (1 second)" [ref=e1890]
                  - row [ref=e1891]:
                    - rowheader "Valid Values:" [ref=e1892]
                    - cell "[0,...]" [ref=e1893]
                  - row [ref=e1894]:
                    - rowheader "Importance:" [ref=e1895]
                    - cell "low" [ref=e1896]
            - listitem [ref=e1897]:
              - heading [level=4] [ref=e1898]:
                - link "retry.backoff.ms" [ref=e1899] [cursor=pointer]:
                  - /url: "#consumerconfigs_retry.backoff.ms"
              - paragraph [ref=e1900]:
                - text: The amount of time to wait before attempting to retry a failed request to a given topic partition. This avoids repeatedly sending requests in a tight loop under some failure scenarios. This value is the initial backoff value and will increase exponentially for each failed request, up to the
                - code [ref=e1901]: retry.backoff.max.ms
                - text: value.
              - table [ref=e1902]:
                - rowgroup [ref=e1903]:
                  - row [ref=e1904]:
                    - rowheader "Type:" [ref=e1905]
                    - cell "long" [ref=e1906]
                  - row [ref=e1907]:
                    - rowheader "Default:" [ref=e1908]
                    - cell "100" [ref=e1909]
                  - row [ref=e1910]:
                    - rowheader "Valid Values:" [ref=e1911]
                    - cell "[0,...]" [ref=e1912]
                  - row [ref=e1913]:
                    - rowheader "Importance:" [ref=e1914]
                    - cell "low" [ref=e1915]
            - listitem [ref=e1916]:
              - heading [level=4] [ref=e1917]:
                - link "sasl.kerberos.kinit.cmd" [ref=e1918] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.kerberos.kinit.cmd"
              - paragraph [ref=e1919]: Kerberos kinit command path.
              - table [ref=e1920]:
                - rowgroup [ref=e1921]:
                  - row [ref=e1922]:
                    - rowheader "Type:" [ref=e1923]
                    - cell "string" [ref=e1924]
                  - row [ref=e1925]:
                    - rowheader "Default:" [ref=e1926]
                    - cell "/usr/bin/kinit" [ref=e1927]
                  - row [ref=e1928]:
                    - columnheader "Valid Values:" [ref=e1929]
                    - cell [ref=e1930]
                  - row [ref=e1931]:
                    - rowheader "Importance:" [ref=e1932]
                    - cell "low" [ref=e1933]
            - listitem [ref=e1934]:
              - heading [level=4] [ref=e1935]:
                - link "sasl.kerberos.min.time.before.relogin" [ref=e1936] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.kerberos.min.time.before.relogin"
              - paragraph [ref=e1937]: Login thread sleep time between refresh attempts.
              - table [ref=e1938]:
                - rowgroup [ref=e1939]:
                  - row [ref=e1940]:
                    - rowheader "Type:" [ref=e1941]
                    - cell "long" [ref=e1942]
                  - row [ref=e1943]:
                    - rowheader "Default:" [ref=e1944]
                    - cell "60000" [ref=e1945]
                  - row [ref=e1946]:
                    - columnheader "Valid Values:" [ref=e1947]
                    - cell [ref=e1948]
                  - row [ref=e1949]:
                    - rowheader "Importance:" [ref=e1950]
                    - cell "low" [ref=e1951]
            - listitem [ref=e1952]:
              - heading [level=4] [ref=e1953]:
                - link "sasl.kerberos.ticket.renew.jitter" [ref=e1954] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.kerberos.ticket.renew.jitter"
              - paragraph [ref=e1955]: Percentage of random jitter added to the renewal time.
              - table [ref=e1956]:
                - rowgroup [ref=e1957]:
                  - row [ref=e1958]:
                    - rowheader "Type:" [ref=e1959]
                    - cell "double" [ref=e1960]
                  - row [ref=e1961]:
                    - rowheader "Default:" [ref=e1962]
                    - cell "0.05" [ref=e1963]
                  - row [ref=e1964]:
                    - columnheader "Valid Values:" [ref=e1965]
                    - cell [ref=e1966]
                  - row [ref=e1967]:
                    - rowheader "Importance:" [ref=e1968]
                    - cell "low" [ref=e1969]
            - listitem [ref=e1970]:
              - heading [level=4] [ref=e1971]:
                - link "sasl.kerberos.ticket.renew.window.factor" [ref=e1972] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.kerberos.ticket.renew.window.factor"
              - paragraph [ref=e1973]: Login thread will sleep until the specified window factor of time from last refresh to ticket's expiry has been reached, at which time it will try to renew the ticket.
              - table [ref=e1974]:
                - rowgroup [ref=e1975]:
                  - row [ref=e1976]:
                    - rowheader "Type:" [ref=e1977]
                    - cell "double" [ref=e1978]
                  - row [ref=e1979]:
                    - rowheader "Default:" [ref=e1980]
                    - cell "0.8" [ref=e1981]
                  - row [ref=e1982]:
                    - columnheader "Valid Values:" [ref=e1983]
                    - cell [ref=e1984]
                  - row [ref=e1985]:
                    - rowheader "Importance:" [ref=e1986]
                    - cell "low" [ref=e1987]
            - listitem [ref=e1988]:
              - heading [level=4] [ref=e1989]:
                - link "sasl.login.connect.timeout.ms" [ref=e1990] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.connect.timeout.ms"
              - paragraph [ref=e1991]: The (optional) value in milliseconds for the external authentication provider connection timeout. Currently applies only to OAUTHBEARER.
              - table [ref=e1992]:
                - rowgroup [ref=e1993]:
                  - row [ref=e1994]:
                    - rowheader "Type:" [ref=e1995]
                    - cell "int" [ref=e1996]
                  - row [ref=e1997]:
                    - rowheader "Default:" [ref=e1998]
                    - cell "null" [ref=e1999]
                  - row [ref=e2000]:
                    - columnheader "Valid Values:" [ref=e2001]
                    - cell [ref=e2002]
                  - row [ref=e2003]:
                    - rowheader "Importance:" [ref=e2004]
                    - cell "low" [ref=e2005]
            - listitem [ref=e2006]:
              - heading [level=4] [ref=e2007]:
                - link "sasl.login.read.timeout.ms" [ref=e2008] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.read.timeout.ms"
              - paragraph [ref=e2009]: The (optional) value in milliseconds for the external authentication provider read timeout. Currently applies only to OAUTHBEARER.
              - table [ref=e2010]:
                - rowgroup [ref=e2011]:
                  - row [ref=e2012]:
                    - rowheader "Type:" [ref=e2013]
                    - cell "int" [ref=e2014]
                  - row [ref=e2015]:
                    - rowheader "Default:" [ref=e2016]
                    - cell "null" [ref=e2017]
                  - row [ref=e2018]:
                    - columnheader "Valid Values:" [ref=e2019]
                    - cell [ref=e2020]
                  - row [ref=e2021]:
                    - rowheader "Importance:" [ref=e2022]
                    - cell "low" [ref=e2023]
            - listitem [ref=e2024]:
              - heading [level=4] [ref=e2025]:
                - link "sasl.login.refresh.buffer.seconds" [ref=e2026] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.refresh.buffer.seconds"
              - paragraph [ref=e2027]: The amount of buffer time before credential expiration to maintain when refreshing a credential, in seconds. If a refresh would otherwise occur closer to expiration than the number of buffer seconds then the refresh will be moved up to maintain as much of the buffer time as possible. Legal values are between 0 and 3600 (1 hour); a default value of 300 (5 minutes) is used if no value is specified. This value and sasl.login.refresh.min.period.seconds are both ignored if their sum exceeds the remaining lifetime of a credential. Currently applies only to OAUTHBEARER.
              - table [ref=e2028]:
                - rowgroup [ref=e2029]:
                  - row [ref=e2030]:
                    - rowheader "Type:" [ref=e2031]
                    - cell "short" [ref=e2032]
                  - row [ref=e2033]:
                    - rowheader "Default:" [ref=e2034]
                    - cell "300" [ref=e2035]
                  - row [ref=e2036]:
                    - rowheader "Valid Values:" [ref=e2037]
                    - cell "[0,...,3600]" [ref=e2038]
                  - row [ref=e2039]:
                    - rowheader "Importance:" [ref=e2040]
                    - cell "low" [ref=e2041]
            - listitem [ref=e2042]:
              - heading [level=4] [ref=e2043]:
                - link "sasl.login.refresh.min.period.seconds" [ref=e2044] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.refresh.min.period.seconds"
              - paragraph [ref=e2045]: The desired minimum time for the login refresh thread to wait before refreshing a credential, in seconds. Legal values are between 0 and 900 (15 minutes); a default value of 60 (1 minute) is used if no value is specified. This value and sasl.login.refresh.buffer.seconds are both ignored if their sum exceeds the remaining lifetime of a credential. Currently applies only to OAUTHBEARER.
              - table [ref=e2046]:
                - rowgroup [ref=e2047]:
                  - row [ref=e2048]:
                    - rowheader "Type:" [ref=e2049]
                    - cell "short" [ref=e2050]
                  - row [ref=e2051]:
                    - rowheader "Default:" [ref=e2052]
                    - cell "60" [ref=e2053]
                  - row [ref=e2054]:
                    - rowheader "Valid Values:" [ref=e2055]
                    - cell "[0,...,900]" [ref=e2056]
                  - row [ref=e2057]:
                    - rowheader "Importance:" [ref=e2058]
                    - cell "low" [ref=e2059]
            - listitem [ref=e2060]:
              - heading [level=4] [ref=e2061]:
                - link "sasl.login.refresh.window.factor" [ref=e2062] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.refresh.window.factor"
              - paragraph [ref=e2063]: Login refresh thread will sleep until the specified window factor relative to the credential's lifetime has been reached, at which time it will try to refresh the credential. Legal values are between 0.5 (50%) and 1.0 (100%) inclusive; a default value of 0.8 (80%) is used if no value is specified. Currently applies only to OAUTHBEARER.
              - table [ref=e2064]:
                - rowgroup [ref=e2065]:
                  - row [ref=e2066]:
                    - rowheader "Type:" [ref=e2067]
                    - cell "double" [ref=e2068]
                  - row [ref=e2069]:
                    - rowheader "Default:" [ref=e2070]
                    - cell "0.8" [ref=e2071]
                  - row [ref=e2072]:
                    - rowheader "Valid Values:" [ref=e2073]
                    - cell "[0.5,...,1.0]" [ref=e2074]
                  - row [ref=e2075]:
                    - rowheader "Importance:" [ref=e2076]
                    - cell "low" [ref=e2077]
            - listitem [ref=e2078]:
              - heading [level=4] [ref=e2079]:
                - link "sasl.login.refresh.window.jitter" [ref=e2080] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.refresh.window.jitter"
              - paragraph [ref=e2081]: The maximum amount of random jitter relative to the credential's lifetime that is added to the login refresh thread's sleep time. Legal values are between 0 and 0.25 (25%) inclusive; a default value of 0.05 (5%) is used if no value is specified. Currently applies only to OAUTHBEARER.
              - table [ref=e2082]:
                - rowgroup [ref=e2083]:
                  - row [ref=e2084]:
                    - rowheader "Type:" [ref=e2085]
                    - cell "double" [ref=e2086]
                  - row [ref=e2087]:
                    - rowheader "Default:" [ref=e2088]
                    - cell "0.05" [ref=e2089]
                  - row [ref=e2090]:
                    - rowheader "Valid Values:" [ref=e2091]
                    - cell "[0.0,...,0.25]" [ref=e2092]
                  - row [ref=e2093]:
                    - rowheader "Importance:" [ref=e2094]
                    - cell "low" [ref=e2095]
            - listitem [ref=e2096]:
              - heading [level=4] [ref=e2097]:
                - link "sasl.login.retry.backoff.max.ms" [ref=e2098] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.retry.backoff.max.ms"
              - paragraph [ref=e2099]: The (optional) value in milliseconds for the maximum wait between login attempts to the external authentication provider. Login uses an exponential backoff algorithm with an initial wait based on the sasl.login.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.login.retry.backoff.max.ms setting. Currently applies only to OAUTHBEARER.
              - table [ref=e2100]:
                - rowgroup [ref=e2101]:
                  - row [ref=e2102]:
                    - rowheader "Type:" [ref=e2103]
                    - cell "long" [ref=e2104]
                  - row [ref=e2105]:
                    - rowheader "Default:" [ref=e2106]
                    - cell "10000 (10 seconds)" [ref=e2107]
                  - row [ref=e2108]:
                    - columnheader "Valid Values:" [ref=e2109]
                    - cell [ref=e2110]
                  - row [ref=e2111]:
                    - rowheader "Importance:" [ref=e2112]
                    - cell "low" [ref=e2113]
            - listitem [ref=e2114]:
              - heading [level=4] [ref=e2115]:
                - link "sasl.login.retry.backoff.ms" [ref=e2116] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.login.retry.backoff.ms"
              - paragraph [ref=e2117]: The (optional) value in milliseconds for the initial wait between login attempts to the external authentication provider. Login uses an exponential backoff algorithm with an initial wait based on the sasl.login.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.login.retry.backoff.max.ms setting. Currently applies only to OAUTHBEARER.
              - table [ref=e2118]:
                - rowgroup [ref=e2119]:
                  - row [ref=e2120]:
                    - rowheader "Type:" [ref=e2121]
                    - cell "long" [ref=e2122]
                  - row [ref=e2123]:
                    - rowheader "Default:" [ref=e2124]
                    - cell "100" [ref=e2125]
                  - row [ref=e2126]:
                    - columnheader "Valid Values:" [ref=e2127]
                    - cell [ref=e2128]
                  - row [ref=e2129]:
                    - rowheader "Importance:" [ref=e2130]
                    - cell "low" [ref=e2131]
            - listitem [ref=e2132]:
              - heading [level=4] [ref=e2133]:
                - link "sasl.oauthbearer.assertion.claim.exp.seconds" [ref=e2134] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.claim.exp.seconds"
              - paragraph
              - paragraph [ref=e2135]:
                - text: The number of seconds
                - emphasis [ref=e2136]: in the future
                - text: for which the JWT is valid. The value is used to determine the JWT
                - code [ref=e2137]: exp
                - text: (Expiration) claim based on the current system time when the JWT is created.
              - paragraph [ref=e2138]:
                - text: The formula to generate the
                - code [ref=e2139]: exp
                - text: "claim is very simple:"
              - generic [ref=e2140]: "Let: x = the current timestamp in seconds, on client y = the value of this configurationThen: exp = x + y"
              - paragraph [ref=e2141]:
                - emphasis [ref=e2142]: Note
                - text: ": If a value for"
                - code [ref=e2143]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e2144]:
                - rowgroup [ref=e2145]:
                  - row [ref=e2146]:
                    - rowheader "Type:" [ref=e2147]
                    - cell "int" [ref=e2148]
                  - row [ref=e2149]:
                    - rowheader "Default:" [ref=e2150]
                    - cell "300" [ref=e2151]
                  - row [ref=e2152]:
                    - rowheader "Valid Values:" [ref=e2153]
                    - cell "[0,...,86400]" [ref=e2154]
                  - row [ref=e2155]:
                    - rowheader "Importance:" [ref=e2156]
                    - cell "low" [ref=e2157]
            - listitem [ref=e2158]:
              - heading [level=4] [ref=e2159]:
                - link "sasl.oauthbearer.assertion.claim.nbf.seconds" [ref=e2160] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.assertion.claim.nbf.seconds"
              - paragraph
              - paragraph [ref=e2161]:
                - text: The number of seconds
                - emphasis [ref=e2162]: in the past
                - text: from which the JWT is valid. The value is used to determine the JWT
                - code [ref=e2163]: nbf
                - text: (Not Before) claim based on the current system time when the JWT is created.
              - paragraph [ref=e2164]:
                - text: The formula to generate the
                - code [ref=e2165]: nbf
                - text: "claim is very simple:"
              - generic [ref=e2166]: "Let: x = the current timestamp in seconds, on client y = the value of this configurationThen: nbf = x - y"
              - paragraph [ref=e2167]:
                - emphasis [ref=e2168]: Note
                - text: ": If a value for"
                - code [ref=e2169]: sasl.oauthbearer.assertion.file
                - text: is provided, this configuration will be ignored.
              - paragraph
              - table [ref=e2170]:
                - rowgroup [ref=e2171]:
                  - row [ref=e2172]:
                    - rowheader "Type:" [ref=e2173]
                    - cell "int" [ref=e2174]
                  - row [ref=e2175]:
                    - rowheader "Default:" [ref=e2176]
                    - cell "60" [ref=e2177]
                  - row [ref=e2178]:
                    - rowheader "Valid Values:" [ref=e2179]
                    - cell "[0,...,3600]" [ref=e2180]
                  - row [ref=e2181]:
                    - rowheader "Importance:" [ref=e2182]
                    - cell "low" [ref=e2183]
            - listitem [ref=e2184]:
              - heading [level=4] [ref=e2185]:
                - link "sasl.oauthbearer.clock.skew.seconds" [ref=e2186] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.clock.skew.seconds"
              - paragraph [ref=e2187]: The (optional) value in seconds to allow for differences between the time of the OAuth/OIDC identity provider and the broker.
              - table [ref=e2188]:
                - rowgroup [ref=e2189]:
                  - row [ref=e2190]:
                    - rowheader "Type:" [ref=e2191]
                    - cell "int" [ref=e2192]
                  - row [ref=e2193]:
                    - rowheader "Default:" [ref=e2194]
                    - cell "30" [ref=e2195]
                  - row [ref=e2196]:
                    - columnheader "Valid Values:" [ref=e2197]
                    - cell [ref=e2198]
                  - row [ref=e2199]:
                    - rowheader "Importance:" [ref=e2200]
                    - cell "low" [ref=e2201]
            - listitem [ref=e2202]:
              - heading [level=4] [ref=e2203]:
                - link "sasl.oauthbearer.expected.audience" [ref=e2204] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.expected.audience"
              - paragraph [ref=e2205]: The (optional) comma-delimited setting for the broker to use to verify that the JWT was issued for one of the expected audiences. The JWT will be inspected for the standard OAuth "aud" claim and if this value is set, the broker will match the value from JWT's "aud" claim to see if there is an exact match. If there is no match, the broker will reject the JWT and authentication will fail.
              - table [ref=e2206]:
                - rowgroup [ref=e2207]:
                  - row [ref=e2208]:
                    - rowheader "Type:" [ref=e2209]
                    - cell "list" [ref=e2210]
                  - row [ref=e2211]:
                    - rowheader "Default:" [ref=e2212]
                    - cell "\"\"" [ref=e2213]
                  - row [ref=e2214]:
                    - columnheader "Valid Values:" [ref=e2215]
                    - cell [ref=e2216]
                  - row [ref=e2217]:
                    - rowheader "Importance:" [ref=e2218]
                    - cell "low" [ref=e2219]
            - listitem [ref=e2220]:
              - heading [level=4] [ref=e2221]:
                - link "sasl.oauthbearer.expected.issuer" [ref=e2222] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.expected.issuer"
              - paragraph [ref=e2223]: The (optional) setting for the broker to use to verify that the JWT was created by the expected issuer. The JWT will be inspected for the standard OAuth "iss" claim and if this value is set, the broker will match it exactly against what is in the JWT's "iss" claim. If there is no match, the broker will reject the JWT and authentication will fail.
              - table [ref=e2224]:
                - rowgroup [ref=e2225]:
                  - row [ref=e2226]:
                    - rowheader "Type:" [ref=e2227]
                    - cell "string" [ref=e2228]
                  - row [ref=e2229]:
                    - rowheader "Default:" [ref=e2230]
                    - cell "null" [ref=e2231]
                  - row [ref=e2232]:
                    - columnheader "Valid Values:" [ref=e2233]
                    - cell [ref=e2234]
                  - row [ref=e2235]:
                    - rowheader "Importance:" [ref=e2236]
                    - cell "low" [ref=e2237]
            - listitem [ref=e2238]:
              - heading [level=4] [ref=e2239]:
                - link "sasl.oauthbearer.header.urlencode" [ref=e2240] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.header.urlencode"
              - paragraph [ref=e2241]:
                - text: The (optional) setting to enable the OAuth client to URL-encode the client_id and client_secret in the authorization header in accordance with RFC6749, see
                - link "here" [ref=e2242] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1
                - text: for more details. The default value is set to 'false' for backward compatibility
              - table [ref=e2243]:
                - rowgroup [ref=e2244]:
                  - row [ref=e2245]:
                    - rowheader "Type:" [ref=e2246]
                    - cell "boolean" [ref=e2247]
                  - row [ref=e2248]:
                    - rowheader "Default:" [ref=e2249]
                    - cell "false" [ref=e2250]
                  - row [ref=e2251]:
                    - columnheader "Valid Values:" [ref=e2252]
                    - cell [ref=e2253]
                  - row [ref=e2254]:
                    - rowheader "Importance:" [ref=e2255]
                    - cell "low" [ref=e2256]
            - listitem [ref=e2257]:
              - heading [level=4] [ref=e2258]:
                - link "sasl.oauthbearer.jwks.endpoint.refresh.ms" [ref=e2259] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.jwks.endpoint.refresh.ms"
              - paragraph [ref=e2260]: The (optional) value in milliseconds for the broker to wait between refreshing its JWKS (JSON Web Key Set) cache that contains the keys to verify the signature of the JWT.
              - table [ref=e2261]:
                - rowgroup [ref=e2262]:
                  - row [ref=e2263]:
                    - rowheader "Type:" [ref=e2264]
                    - cell "long" [ref=e2265]
                  - row [ref=e2266]:
                    - rowheader "Default:" [ref=e2267]
                    - cell "3600000 (1 hour)" [ref=e2268]
                  - row [ref=e2269]:
                    - columnheader "Valid Values:" [ref=e2270]
                    - cell [ref=e2271]
                  - row [ref=e2272]:
                    - rowheader "Importance:" [ref=e2273]
                    - cell "low" [ref=e2274]
            - listitem [ref=e2275]:
              - heading [level=4] [ref=e2276]:
                - link "sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms" [ref=e2277] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms"
              - paragraph [ref=e2278]: The (optional) value in milliseconds for the maximum wait between attempts to retrieve the JWKS (JSON Web Key Set) from the external authentication provider. JWKS retrieval uses an exponential backoff algorithm with an initial wait based on the sasl.oauthbearer.jwks.endpoint.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms setting.
              - table [ref=e2279]:
                - rowgroup [ref=e2280]:
                  - row [ref=e2281]:
                    - rowheader "Type:" [ref=e2282]
                    - cell "long" [ref=e2283]
                  - row [ref=e2284]:
                    - rowheader "Default:" [ref=e2285]
                    - cell "10000 (10 seconds)" [ref=e2286]
                  - row [ref=e2287]:
                    - columnheader "Valid Values:" [ref=e2288]
                    - cell [ref=e2289]
                  - row [ref=e2290]:
                    - rowheader "Importance:" [ref=e2291]
                    - cell "low" [ref=e2292]
            - listitem [ref=e2293]:
              - heading [level=4] [ref=e2294]:
                - link "sasl.oauthbearer.jwks.endpoint.retry.backoff.ms" [ref=e2295] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.jwks.endpoint.retry.backoff.ms"
              - paragraph [ref=e2296]: The (optional) value in milliseconds for the initial wait between JWKS (JSON Web Key Set) retrieval attempts from the external authentication provider. JWKS retrieval uses an exponential backoff algorithm with an initial wait based on the sasl.oauthbearer.jwks.endpoint.retry.backoff.ms setting and will double in wait length between attempts up to a maximum wait length specified by the sasl.oauthbearer.jwks.endpoint.retry.backoff.max.ms setting.
              - table [ref=e2297]:
                - rowgroup [ref=e2298]:
                  - row [ref=e2299]:
                    - rowheader "Type:" [ref=e2300]
                    - cell "long" [ref=e2301]
                  - row [ref=e2302]:
                    - rowheader "Default:" [ref=e2303]
                    - cell "100" [ref=e2304]
                  - row [ref=e2305]:
                    - columnheader "Valid Values:" [ref=e2306]
                    - cell [ref=e2307]
                  - row [ref=e2308]:
                    - rowheader "Importance:" [ref=e2309]
                    - cell "low" [ref=e2310]
            - listitem [ref=e2311]:
              - heading [level=4] [ref=e2312]:
                - link "sasl.oauthbearer.scope.claim.name" [ref=e2313] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.scope.claim.name"
              - paragraph [ref=e2314]: The OAuth claim for the scope is often named "scope", but this (optional) setting can provide a different name to use for the scope included in the JWT payload's claims if the OAuth/OIDC provider uses a different name for that claim.
              - table [ref=e2315]:
                - rowgroup [ref=e2316]:
                  - row [ref=e2317]:
                    - rowheader "Type:" [ref=e2318]
                    - cell "string" [ref=e2319]
                  - row [ref=e2320]:
                    - rowheader "Default:" [ref=e2321]
                    - cell "scope" [ref=e2322]
                  - row [ref=e2323]:
                    - columnheader "Valid Values:" [ref=e2324]
                    - cell [ref=e2325]
                  - row [ref=e2326]:
                    - rowheader "Importance:" [ref=e2327]
                    - cell "low" [ref=e2328]
            - listitem [ref=e2329]:
              - heading [level=4] [ref=e2330]:
                - link "sasl.oauthbearer.sub.claim.name" [ref=e2331] [cursor=pointer]:
                  - /url: "#consumerconfigs_sasl.oauthbearer.sub.claim.name"
              - paragraph [ref=e2332]: The OAuth claim for the subject is often named "sub", but this (optional) setting can provide a different name to use for the subject included in the JWT payload's claims if the OAuth/OIDC provider uses a different name for that claim.
              - table [ref=e2333]:
                - rowgroup [ref=e2334]:
                  - row [ref=e2335]:
                    - rowheader "Type:" [ref=e2336]
                    - cell "string" [ref=e2337]
                  - row [ref=e2338]:
                    - rowheader "Default:" [ref=e2339]
                    - cell "sub" [ref=e2340]
                  - row [ref=e2341]:
                    - columnheader "Valid Values:" [ref=e2342]
                    - cell [ref=e2343]
                  - row [ref=e2344]:
                    - rowheader "Importance:" [ref=e2345]
                    - cell "low" [ref=e2346]
            - listitem [ref=e2347]:
              - heading [level=4] [ref=e2348]:
                - link "security.providers" [ref=e2349] [cursor=pointer]:
                  - /url: "#consumerconfigs_security.providers"
              - paragraph [ref=e2350]:
                - text: A list of configurable creator classes each returning a provider implementing security algorithms. These classes should implement the
                - code [ref=e2351]: org.apache.kafka.common.security.auth.SecurityProviderCreator
                - text: interface.
              - table [ref=e2352]:
                - rowgroup [ref=e2353]:
                  - row [ref=e2354]:
                    - rowheader "Type:" [ref=e2355]
                    - cell "string" [ref=e2356]
                  - row [ref=e2357]:
                    - rowheader "Default:" [ref=e2358]
                    - cell "null" [ref=e2359]
                  - row [ref=e2360]:
                    - columnheader "Valid Values:" [ref=e2361]
                    - cell [ref=e2362]
                  - row [ref=e2363]:
                    - rowheader "Importance:" [ref=e2364]
                    - cell "low" [ref=e2365]
            - listitem [ref=e2366]:
              - heading [level=4] [ref=e2367]:
                - link "ssl.cipher.suites" [ref=e2368] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.cipher.suites"
              - paragraph [ref=e2369]: A list of cipher suites. This is a named combination of authentication, encryption, MAC and key exchange algorithm used to negotiate the security settings for a network connection using TLS or SSL network protocol. By default all the available cipher suites are supported.
              - table [ref=e2370]:
                - rowgroup [ref=e2371]:
                  - row [ref=e2372]:
                    - rowheader "Type:" [ref=e2373]
                    - cell "list" [ref=e2374]
                  - row [ref=e2375]:
                    - rowheader "Default:" [ref=e2376]
                    - cell "\"\"" [ref=e2377]
                  - row [ref=e2378]:
                    - columnheader "Valid Values:" [ref=e2379]
                    - cell [ref=e2380]
                  - row [ref=e2381]:
                    - rowheader "Importance:" [ref=e2382]
                    - cell "low" [ref=e2383]
            - listitem [ref=e2384]:
              - heading [level=4] [ref=e2385]:
                - link "ssl.endpoint.identification.algorithm" [ref=e2386] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.endpoint.identification.algorithm"
              - paragraph [ref=e2387]: The endpoint identification algorithm to validate server hostname using server certificate.
              - table [ref=e2388]:
                - rowgroup [ref=e2389]:
                  - row [ref=e2390]:
                    - rowheader "Type:" [ref=e2391]
                    - cell "string" [ref=e2392]
                  - row [ref=e2393]:
                    - rowheader "Default:" [ref=e2394]
                    - cell "https" [ref=e2395]
                  - row [ref=e2396]:
                    - columnheader "Valid Values:" [ref=e2397]
                    - cell [ref=e2398]
                  - row [ref=e2399]:
                    - rowheader "Importance:" [ref=e2400]
                    - cell "low" [ref=e2401]
            - listitem [ref=e2402]:
              - heading [level=4] [ref=e2403]:
                - link "ssl.engine.factory.class" [ref=e2404] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.engine.factory.class"
              - paragraph [ref=e2405]: The class of type org.apache.kafka.common.security.auth.SslEngineFactory to provide SSLEngine objects. Default value is org.apache.kafka.common.security.ssl.DefaultSslEngineFactory. Alternatively, setting this to org.apache.kafka.common.security.ssl.CommonNameLoggingSslEngineFactory will log the common name of expired SSL certificates used by clients to authenticate at any of the brokers with log level INFO. Note that this will cause a tiny delay during establishment of new connections from mTLS clients to brokers due to the extra code for examining the certificate chain provided by the client. Note further that the implementation uses a custom truststore based on the standard Java truststore and thus might be considered a security risk due to not being as mature as the standard one.
              - table [ref=e2406]:
                - rowgroup [ref=e2407]:
                  - row [ref=e2408]:
                    - rowheader "Type:" [ref=e2409]
                    - cell "class" [ref=e2410]
                  - row [ref=e2411]:
                    - rowheader "Default:" [ref=e2412]
                    - cell "null" [ref=e2413]
                  - row [ref=e2414]:
                    - columnheader "Valid Values:" [ref=e2415]
                    - cell [ref=e2416]
                  - row [ref=e2417]:
                    - rowheader "Importance:" [ref=e2418]
                    - cell "low" [ref=e2419]
            - listitem [ref=e2420]:
              - heading [level=4] [ref=e2421]:
