                - text: ". The format for the value is:"
                - code [ref=e849]: loginModuleClass controlFlag (optionName=optionValue)*;
                - text: . For brokers, the config must be prefixed with listener prefix and SASL mechanism name in lower-case. For example, listener.name.sasl_ssl.scram-sha-256.sasl.jaas.config=com.example.ScramLoginModule required;
              - table [ref=e850]:
