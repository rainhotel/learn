                    - cell "high" [ref=e194]
            - listitem [ref=e195]:
              - heading [level=4] [ref=e196]:
                - link "key.deserializer" [ref=e197] [cursor=pointer]:
                  - /url: "#consumerconfigs_key.deserializer"
              - paragraph [ref=e198]:
                - text: Deserializer class for key that implements the
                - code [ref=e199]: org.apache.kafka.common.serialization.Deserializer
                - text: interface.
