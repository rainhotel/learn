                    - cell [ref=e229]
                  - row [ref=e230]:
                    - rowheader "Importance:" [ref=e231]
                    - cell "high" [ref=e232]
            - listitem [ref=e233]:
              - heading [level=4] [ref=e234]:
                - link "fetch.min.bytes" [ref=e235] [cursor=pointer]:
                  - /url: "#consumerconfigs_fetch.min.bytes"
              - paragraph [ref=e236]: The minimum amount of data the server should return for a fetch request. If insufficient data is available the request will wait for that much data to accumulate before answering the request. The default setting of 1 byte means that fetch requests are answered as soon as that many byte(s) of data is available or the fetch request times out waiting for data to arrive. Setting this to a larger value will cause the server to wait for larger amounts of data to accumulate which can improve server throughput a bit at the cost of some additional latency. Even if the total data available in the broker exceeds fetch.min.bytes, the actual returned size may still be less than this value due to per-partition limits max.partition.fetch.bytes and max returned limits fetch.max.bytes.
              - table [ref=e237]:
                - rowgroup [ref=e238]:
                  - row [ref=e239]:
                    - rowheader "Type:" [ref=e240]
                    - cell "int" [ref=e241]
                  - row [ref=e242]:
                    - rowheader "Default:" [ref=e243]
                    - cell "1" [ref=e244]
                  - row [ref=e245]:
                    - rowheader "Valid Values:" [ref=e246]
                    - cell "[0,...]" [ref=e247]
                  - row [ref=e248]:
                    - rowheader "Importance:" [ref=e249]
                    - cell "high" [ref=e250]
            - listitem [ref=e251]:
              - heading [level=4] [ref=e252]:
                - link "group.id" [ref=e253] [cursor=pointer]:
                  - /url: "#consumerconfigs_group.id"
              - paragraph [ref=e254]:
                - text: A unique string that identifies the consumer group this consumer belongs to. This property is required if the consumer uses either the group management functionality by using
                - code [ref=e255]: subscribe(topic)
                - text: or the Kafka-based offset management strategy.
              - table [ref=e256]:
                - rowgroup [ref=e257]:
                  - row [ref=e258]:
                    - rowheader "Type:" [ref=e259]
                    - cell "string" [ref=e260]
                  - row [ref=e261]:
                    - rowheader "Default:" [ref=e262]
                    - cell "null" [ref=e263]
                  - row [ref=e264]:
                    - columnheader "Valid Values:" [ref=e265]
                    - cell [ref=e266]
                  - row [ref=e267]:
                    - rowheader "Importance:" [ref=e268]
                    - cell "high" [ref=e269]
            - listitem [ref=e270]:
              - heading [level=4] [ref=e271]:
                - link "group.protocol" [ref=e272] [cursor=pointer]:
                  - /url: "#consumerconfigs_group.protocol"
              - paragraph [ref=e273]:
                - text: The group protocol that the consumer uses. The supported values are
                - code [ref=e274]: classic
                - text: or
                - code [ref=e275]: consumer
                - text: . The default value is
                - code [ref=e276]: classic
                - text: .
              - table [ref=e277]:
                - rowgroup [ref=e278]:
                  - row [ref=e279]:
                    - rowheader "Type:" [ref=e280]
                    - cell "string" [ref=e281]
                  - row [ref=e282]:
                    - rowheader "Default:" [ref=e283]
                    - cell "classic" [ref=e284]
                  - row [ref=e285]:
                    - rowheader "Valid Values:" [ref=e286]
                    - cell "(case insensitive) [CONSUMER, CLASSIC]" [ref=e287]
                  - row [ref=e288]:
                    - rowheader "Importance:" [ref=e289]
                    - cell "high" [ref=e290]
            - listitem [ref=e291]:
              - heading [level=4] [ref=e292]:
                - link "heartbeat.interval.ms" [ref=e293] [cursor=pointer]:
                  - /url: "#consumerconfigs_heartbeat.interval.ms"
              - paragraph [ref=e294]:
                - text: The expected time between heartbeats to the consumer coordinator when using Kafka's group management facilities. Heartbeats are used to ensure that the consumer's session stays active and to facilitate rebalancing when new consumers join or leave the group. This config is only supported if
                - code [ref=e295]: group.protocol
                - text: is set to "classic". In that case, the value must be set lower than
                - code [ref=e296]: session.timeout.ms
                - text: ", but typically should be set no higher than 1/3 of that value. It can be adjusted even lower to control the expected time for normal rebalances.If"
                - code [ref=e297]: group.protocol
                - text: is set to "consumer", this config is not supported, as the heartbeat interval is controlled by the broker with
                - code [ref=e298]: group.consumer.heartbeat.interval.ms
                - text: .
              - table [ref=e299]:
                - rowgroup [ref=e300]:
                  - row [ref=e301]:
                    - rowheader "Type:" [ref=e302]
                    - cell "int" [ref=e303]
                  - row [ref=e304]:
                    - rowheader "Default:" [ref=e305]
                    - cell "3000 (3 seconds)" [ref=e306]
                  - row [ref=e307]:
                    - columnheader "Valid Values:" [ref=e308]
                    - cell [ref=e309]
                  - row [ref=e310]:
                    - rowheader "Importance:" [ref=e311]
                    - cell "high" [ref=e312]
            - listitem [ref=e313]:
              - heading [level=4] [ref=e314]:
                - link "max.partition.fetch.bytes" [ref=e315] [cursor=pointer]:
                  - /url: "#consumerconfigs_max.partition.fetch.bytes"
              - paragraph [ref=e316]:
                - text: The maximum amount of data per-partition the server will return. Records are fetched in batches by the consumer. If the first record batch in the first non-empty partition of the fetch is larger than this limit, the batch will still be returned to ensure that the consumer can make progress. The maximum record batch size accepted by the broker is defined via
                - code [ref=e317]: message.max.bytes
                - text: (broker config) or
                - code [ref=e318]: max.message.bytes
                - text: (topic config). See fetch.max.bytes for limiting the consumer request size.
              - table [ref=e319]:
                - rowgroup [ref=e320]:
                  - row [ref=e321]:
                    - rowheader "Type:" [ref=e322]
                    - cell "int" [ref=e323]
                  - row [ref=e324]:
                    - rowheader "Default:" [ref=e325]
                    - cell "1048576 (1 mebibyte)" [ref=e326]
                  - row [ref=e327]:
                    - rowheader "Valid Values:" [ref=e328]
                    - cell "[0,...]" [ref=e329]
                  - row [ref=e330]:
                    - rowheader "Importance:" [ref=e331]
                    - cell "high" [ref=e332]
            - listitem [ref=e333]:
              - heading [level=4] [ref=e334]:
                - link "session.timeout.ms" [ref=e335] [cursor=pointer]:
                  - /url: "#consumerconfigs_session.timeout.ms"
              - paragraph [ref=e336]:
                - text: The timeout used to detect client failures when using Kafka's group management facility. The client sends periodic heartbeats to indicate its liveness to the broker. If no heartbeats are received by the broker before the expiration of this session timeout, then the broker will remove this client from the group and initiate a rebalance. Note that the value must be in the allowable range as configured in the broker configuration by
                - code [ref=e337]: group.min.session.timeout.ms
                - text: and
                - code [ref=e338]: group.max.session.timeout.ms
                - text: . Note that this client configuration is not supported when
                - code [ref=e339]: group.protocol
                - text: is set to "consumer". In that case, session timeout is controlled by the broker config
                - code [ref=e340]: group.consumer.session.timeout.ms
                - text: .
              - table [ref=e341]:
                - rowgroup [ref=e342]:
                  - row [ref=e343]:
                    - rowheader "Type:" [ref=e344]
                    - cell "int" [ref=e345]
                  - row [ref=e346]:
                    - rowheader "Default:" [ref=e347]
                    - cell "45000 (45 seconds)" [ref=e348]
                  - row [ref=e349]:
                    - columnheader "Valid Values:" [ref=e350]
                    - cell [ref=e351]
                  - row [ref=e352]:
                    - rowheader "Importance:" [ref=e353]
                    - cell "high" [ref=e354]
            - listitem [ref=e355]:
              - heading [level=4] [ref=e356]:
                - link "ssl.key.password" [ref=e357] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.key.password"
              - paragraph [ref=e358]: The password of the private key in the key store file or the PEM key specified in 'ssl.keystore.key'.
              - table [ref=e359]:
                - rowgroup [ref=e360]:
                  - row [ref=e361]:
                    - rowheader "Type:" [ref=e362]
                    - cell "password" [ref=e363]
                  - row [ref=e364]:
                    - rowheader "Default:" [ref=e365]
                    - cell "null" [ref=e366]
                  - row [ref=e367]:
                    - columnheader "Valid Values:" [ref=e368]
                    - cell [ref=e369]
                  - row [ref=e370]:
                    - rowheader "Importance:" [ref=e371]
                    - cell "high" [ref=e372]
            - listitem [ref=e373]:
              - heading [level=4] [ref=e374]:
                - link "ssl.keystore.certificate.chain" [ref=e375] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.keystore.certificate.chain"
              - paragraph [ref=e376]: Certificate chain in the format specified by 'ssl.keystore.type'. Default SSL engine factory supports only PEM format with a list of X.509 certificates
              - table [ref=e377]:
                - rowgroup [ref=e378]:
                  - row [ref=e379]:
                    - rowheader "Type:" [ref=e380]
                    - cell "password" [ref=e381]
                  - row [ref=e382]:
                    - rowheader "Default:" [ref=e383]
                    - cell "null" [ref=e384]
                  - row [ref=e385]:
                    - columnheader "Valid Values:" [ref=e386]
                    - cell [ref=e387]
                  - row [ref=e388]:
                    - rowheader "Importance:" [ref=e389]
                    - cell "high" [ref=e390]
            - listitem [ref=e391]:
              - heading [level=4] [ref=e392]:
                - link "ssl.keystore.key" [ref=e393] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.keystore.key"
              - paragraph [ref=e394]: Private key in the format specified by 'ssl.keystore.type'. Default SSL engine factory supports only PEM format with PKCS#8 keys. If the key is encrypted, key password must be specified using 'ssl.key.password'
              - table [ref=e395]:
                - rowgroup [ref=e396]:
                  - row [ref=e397]:
                    - rowheader "Type:" [ref=e398]
                    - cell "password" [ref=e399]
                  - row [ref=e400]:
                    - rowheader "Default:" [ref=e401]
                    - cell "null" [ref=e402]
                  - row [ref=e403]:
                    - columnheader "Valid Values:" [ref=e404]
                    - cell [ref=e405]
                  - row [ref=e406]:
                    - rowheader "Importance:" [ref=e407]
                    - cell "high" [ref=e408]
            - listitem [ref=e409]:
              - heading [level=4] [ref=e410]:
                - link "ssl.keystore.location" [ref=e411] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.keystore.location"
              - paragraph [ref=e412]: The location of the key store file. This is optional for client and can be used for two-way authentication for client.
              - table [ref=e413]:
                - rowgroup [ref=e414]:
                  - row [ref=e415]:
                    - rowheader "Type:" [ref=e416]
                    - cell "string" [ref=e417]
                  - row [ref=e418]:
                    - rowheader "Default:" [ref=e419]
                    - cell "null" [ref=e420]
                  - row [ref=e421]:
                    - columnheader "Valid Values:" [ref=e422]
                    - cell [ref=e423]
                  - row [ref=e424]:
                    - rowheader "Importance:" [ref=e425]
                    - cell "high" [ref=e426]
            - listitem [ref=e427]:
              - heading [level=4] [ref=e428]:
                - link "ssl.keystore.password" [ref=e429] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.keystore.password"
              - paragraph [ref=e430]: The store password for the key store file. This is optional for client and only needed if 'ssl.keystore.location' is configured. Key store password is not supported for PEM format.
              - table [ref=e431]:
                - rowgroup [ref=e432]:
                  - row [ref=e433]:
                    - rowheader "Type:" [ref=e434]
                    - cell "password" [ref=e435]
                  - row [ref=e436]:
                    - rowheader "Default:" [ref=e437]
                    - cell "null" [ref=e438]
                  - row [ref=e439]:
                    - columnheader "Valid Values:" [ref=e440]
                    - cell [ref=e441]
                  - row [ref=e442]:
                    - rowheader "Importance:" [ref=e443]
                    - cell "high" [ref=e444]
            - listitem [ref=e445]:
              - heading [level=4] [ref=e446]:
                - link "ssl.truststore.certificates" [ref=e447] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.truststore.certificates"
              - paragraph [ref=e448]: Trusted certificates in the format specified by 'ssl.truststore.type'. Default SSL engine factory supports only PEM format with X.509 certificates.
              - table [ref=e449]:
                - rowgroup [ref=e450]:
                  - row [ref=e451]:
                    - rowheader "Type:" [ref=e452]
                    - cell "password" [ref=e453]
                  - row [ref=e454]:
                    - rowheader "Default:" [ref=e455]
                    - cell "null" [ref=e456]
                  - row [ref=e457]:
                    - columnheader "Valid Values:" [ref=e458]
                    - cell [ref=e459]
                  - row [ref=e460]:
                    - rowheader "Importance:" [ref=e461]
                    - cell "high" [ref=e462]
            - listitem [ref=e463]:
              - heading [level=4] [ref=e464]:
                - link "ssl.truststore.location" [ref=e465] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.truststore.location"
              - paragraph [ref=e466]: The location of the trust store file.
              - table [ref=e467]:
                - rowgroup [ref=e468]:
                  - row [ref=e469]:
                    - rowheader "Type:" [ref=e470]
                    - cell "string" [ref=e471]
                  - row [ref=e472]:
                    - rowheader "Default:" [ref=e473]
                    - cell "null" [ref=e474]
                  - row [ref=e475]:
                    - columnheader "Valid Values:" [ref=e476]
                    - cell [ref=e477]
                  - row [ref=e478]:
                    - rowheader "Importance:" [ref=e479]
                    - cell "high" [ref=e480]
            - listitem [ref=e481]:
              - heading [level=4] [ref=e482]:
                - link "ssl.truststore.password" [ref=e483] [cursor=pointer]:
                  - /url: "#consumerconfigs_ssl.truststore.password"
              - paragraph [ref=e484]: The password for the trust store file. If a password is not set, trust store file configured will still be used, but integrity checking is disabled. Trust store password is not supported for PEM format.
              - table [ref=e485]:
                - rowgroup [ref=e486]:
                  - row [ref=e487]:
                    - rowheader "Type:" [ref=e488]
                    - cell "password" [ref=e489]
                  - row [ref=e490]:
                    - rowheader "Default:" [ref=e491]
                    - cell "null" [ref=e492]
                  - row [ref=e493]:
                    - columnheader "Valid Values:" [ref=e494]
                    - cell [ref=e495]
                  - row [ref=e496]:
                    - rowheader "Importance:" [ref=e497]
                    - cell "high" [ref=e498]
            - listitem [ref=e499]:
              - heading [level=4] [ref=e500]:
                - link "allow.auto.create.topics" [ref=e501] [cursor=pointer]:
                  - /url: "#consumerconfigs_allow.auto.create.topics"
              - paragraph [ref=e502]:
                - text: Allow automatic topic creation on the broker when subscribing to or assigning a topic. A topic being subscribed to will be automatically created only if the broker allows for it using
                - code [ref=e503]: auto.create.topics.enable
                - text: broker configuration.
              - table [ref=e504]:
                - rowgroup [ref=e505]:
                  - row [ref=e506]:
                    - rowheader "Type:" [ref=e507]
                    - cell "boolean" [ref=e508]
                  - row [ref=e509]:
                    - rowheader "Default:" [ref=e510]
                    - cell "true" [ref=e511]
                  - row [ref=e512]:
                    - columnheader "Valid Values:" [ref=e513]
                    - cell [ref=e514]
                  - row [ref=e515]:
                    - rowheader "Importance:" [ref=e516]
                    - cell "medium" [ref=e517]
            - listitem [ref=e518]:
              - heading [level=4] [ref=e519]:
                - link "auto.offset.reset" [ref=e520] [cursor=pointer]:
                  - /url: "#consumerconfigs_auto.offset.reset"
              - paragraph [ref=e521]: "What to do when there is no initial offset in Kafka or if the current offset does not exist any more on the server (e.g. because that data has been deleted):"
              - list [ref=e522]:
                - listitem [ref=e523]: "earliest: automatically reset the offset to the earliest offset"
                - listitem [ref=e524]: "latest: automatically reset the offset to the latest offset"
                - listitem [ref=e525]: "by_duration:<duration>: automatically reset the offset to a configured <duration> from the current timestamp. <duration> must be specified in ISO8601 format (PnDTnHnMn.nS). Negative duration is not allowed."
                - listitem [ref=e526]: "none: throw exception to the consumer if no previous offset is found for the consumer's group"
                - listitem [ref=e527]: "anything else: throw exception to the consumer."
              - paragraph [ref=e528]: Note that altering partition numbers while setting this config to latest may cause message delivery loss since producers could start to send messages to newly added partitions (i.e. no initial offsets exist yet) before consumers reset their offsets.
              - table [ref=e529]:
                - rowgroup [ref=e530]:
                  - row [ref=e531]:
                    - rowheader "Type:" [ref=e532]
                    - cell "string" [ref=e533]
                  - row [ref=e534]:
                    - rowheader "Default:" [ref=e535]
                    - cell "latest" [ref=e536]
                  - row [ref=e537]:
                    - rowheader "Valid Values:" [ref=e538]
                    - cell "[latest, earliest, none, by_duration:PnDTnHnMn.nS]" [ref=e539]
                  - row [ref=e540]:
                    - rowheader "Importance:" [ref=e541]
                    - cell "medium" [ref=e542]
            - listitem [ref=e543]:
              - heading [level=4] [ref=e544]:
                - link "client.dns.lookup" [ref=e545] [cursor=pointer]:
                  - /url: "#consumerconfigs_client.dns.lookup"
              - paragraph [ref=e546]:
                - text: Controls how the client uses DNS lookups. If set to
                - code [ref=e547]: use_all_dns_ips
                - text: ", connect to each returned IP address in sequence until a successful connection is established. After a disconnection, the next IP is used. Once all IPs have been used once, the client resolves the IP(s) from the hostname again (both the JVM and the OS cache DNS name lookups, however). If set to"
                - code [ref=e548]: resolve_canonical_bootstrap_servers_only
                - text: ", resolve each bootstrap address into a list of canonical names. After the bootstrap phase, this behaves the same as"
                - code [ref=e549]: use_all_dns_ips
                - text: .
              - table [ref=e550]:
                - rowgroup [ref=e551]:
                  - row [ref=e552]:
                    - rowheader "Type:" [ref=e553]
                    - cell "string" [ref=e554]
                  - row [ref=e555]:
                    - rowheader "Default:" [ref=e556]
                    - cell "use_all_dns_ips" [ref=e557]
                  - row [ref=e558]:
                    - rowheader "Valid Values:" [ref=e559]
                    - cell "[use_all_dns_ips, resolve_canonical_bootstrap_servers_only]" [ref=e560]
                  - row [ref=e561]:
                    - rowheader "Importance:" [ref=e562]
                    - cell "medium" [ref=e563]
            - listitem [ref=e564]:
              - heading [level=4] [ref=e565]:
                - link "connections.max.idle.ms" [ref=e566] [cursor=pointer]:
                  - /url: "#consumerconfigs_connections.max.idle.ms"
              - paragraph [ref=e567]: Close idle connections after the number of milliseconds specified by this config.
              - table [ref=e568]:
                - rowgroup [ref=e569]:
                  - row [ref=e570]:
                    - rowheader "Type:" [ref=e571]
                    - cell "long" [ref=e572]
                  - row [ref=e573]:
                    - rowheader "Default:" [ref=e574]
                    - cell "540000 (9 minutes)" [ref=e575]
                  - row [ref=e576]:
                    - columnheader "Valid Values:" [ref=e577]
                    - cell [ref=e578]
                  - row [ref=e579]:
                    - rowheader "Importance:" [ref=e580]
                    - cell "medium" [ref=e581]
            - listitem [ref=e582]:
              - heading [level=4] [ref=e583]:
                - link "default.api.timeout.ms" [ref=e584] [cursor=pointer]:
                  - /url: "#consumerconfigs_default.api.timeout.ms"
              - paragraph [ref=e585]:
                - text: Specifies the timeout (in milliseconds) for client APIs. This configuration is used as the default timeout for all client operations that do not specify a
                - code [ref=e586]: timeout
                - text: parameter.
              - table [ref=e587]:
                - rowgroup [ref=e588]:
                  - row [ref=e589]:
                    - rowheader "Type:" [ref=e590]
                    - cell "int" [ref=e591]
                  - row [ref=e592]:
                    - rowheader "Default:" [ref=e593]
                    - cell "60000 (1 minute)" [ref=e594]
                  - row [ref=e595]:
                    - rowheader "Valid Values:" [ref=e596]
                    - cell "[0,...]" [ref=e597]
                  - row [ref=e598]:
                    - rowheader "Importance:" [ref=e599]
                    - cell "medium" [ref=e600]
            - listitem [ref=e601]:
              - heading [level=4] [ref=e602]:
                - link "enable.auto.commit" [ref=e603] [cursor=pointer]:
                  - /url: "#consumerconfigs_enable.auto.commit"
              - paragraph [ref=e604]: If true the consumer's offset will be periodically committed in the background.
              - table [ref=e605]:
                - rowgroup [ref=e606]:
                  - row [ref=e607]:
                    - rowheader "Type:" [ref=e608]
                    - cell "boolean" [ref=e609]
                  - row [ref=e610]:
                    - rowheader "Default:" [ref=e611]
                    - cell "true" [ref=e612]
                  - row [ref=e613]:
                    - columnheader "Valid Values:" [ref=e614]
                    - cell [ref=e615]
                  - row [ref=e616]:
                    - rowheader "Importance:" [ref=e617]
                    - cell "medium" [ref=e618]
            - listitem [ref=e619]:
              - heading [level=4] [ref=e620]:
                - link "exclude.internal.topics" [ref=e621] [cursor=pointer]:
                  - /url: "#consumerconfigs_exclude.internal.topics"
              - paragraph [ref=e622]: Whether internal topics matching a subscribed pattern should be excluded from the subscription. It is always possible to explicitly subscribe to an internal topic.
              - table [ref=e623]:
                - rowgroup [ref=e624]:
                  - row [ref=e625]:
                    - rowheader "Type:" [ref=e626]
                    - cell "boolean" [ref=e627]
                  - row [ref=e628]:
                    - rowheader "Default:" [ref=e629]
                    - cell "true" [ref=e630]
                  - row [ref=e631]:
                    - columnheader "Valid Values:" [ref=e632]
                    - cell [ref=e633]
                  - row [ref=e634]:
                    - rowheader "Importance:" [ref=e635]
                    - cell "medium" [ref=e636]
            - listitem [ref=e637]:
              - heading [level=4] [ref=e638]:
                - link "fetch.max.bytes" [ref=e639] [cursor=pointer]:
                  - /url: "#consumerconfigs_fetch.max.bytes"
              - paragraph [ref=e640]:
                - text: The maximum amount of data the server should return for a fetch request. Records are fetched in batches by the consumer, and if the first record batch in the first non-empty partition of the fetch is larger than this value, the record batch will still be returned to ensure that the consumer can make progress. As such, this is not a absolute maximum. The maximum record batch size accepted by the broker is defined via
                - code [ref=e641]: message.max.bytes
                - text: (broker config) or
                - code [ref=e642]: max.message.bytes
                - text: (topic config). A fetch request consists of many partitions, and there is another setting that controls how much data is returned for each partition in a fetch request - see
                - code [ref=e643]: max.partition.fetch.bytes
                - text: . Note that the consumer performs multiple fetches in parallel.
              - table [ref=e644]:
                - rowgroup [ref=e645]:
                  - row [ref=e646]:
                    - rowheader "Type:" [ref=e647]
                    - cell "int" [ref=e648]
                  - row [ref=e649]:
                    - rowheader "Default:" [ref=e650]
                    - cell "52428800 (50 mebibytes)" [ref=e651]
                  - row [ref=e652]:
                    - rowheader "Valid Values:" [ref=e653]
                    - cell "[0,...]" [ref=e654]
                  - row [ref=e655]:
                    - rowheader "Importance:" [ref=e656]
                    - cell "medium" [ref=e657]
            - listitem [ref=e658]:
              - heading [level=4] [ref=e659]:
                - link "group.instance.id" [ref=e660] [cursor=pointer]:
                  - /url: "#consumerconfigs_group.instance.id"
              - paragraph [ref=e661]: A unique identifier of the consumer instance provided by the end user. Only non-empty strings are permitted. If set, the consumer is treated as a static member, which means that only one instance with this ID is allowed in the consumer group at any time. This can be used in combination with a larger session timeout to avoid group rebalances caused by transient unavailability (e.g. process restarts). If not set, the consumer will join the group as a dynamic member, which is the traditional behavior.
              - table [ref=e662]:
                - rowgroup [ref=e663]:
                  - row [ref=e664]:
                    - rowheader "Type:" [ref=e665]
                    - cell "string" [ref=e666]
                  - row [ref=e667]:
                    - rowheader "Default:" [ref=e668]
                    - cell "null" [ref=e669]
                  - row [ref=e670]:
                    - rowheader "Valid Values:" [ref=e671]
                    - cell "non-empty string" [ref=e672]
                  - row [ref=e673]:
                    - rowheader "Importance:" [ref=e674]
                    - cell "medium" [ref=e675]
            - listitem [ref=e676]:
              - heading [level=4] [ref=e677]:
                - link "group.remote.assignor" [ref=e678] [cursor=pointer]:
                  - /url: "#consumerconfigs_group.remote.assignor"
              - paragraph [ref=e679]:
                - text: The name of the server-side assignor to use. If not specified, the group coordinator will pick the first assignor defined in the broker config group.consumer.assignors.This configuration is applied only if
                - code [ref=e680]: group.protocol
                - text: is set to "consumer".
              - table [ref=e681]:
                - rowgroup [ref=e682]:
                  - row [ref=e683]:
                    - rowheader "Type:" [ref=e684]
                    - cell "string" [ref=e685]
                  - row [ref=e686]:
                    - rowheader "Default:" [ref=e687]
                    - cell "null" [ref=e688]
                  - row [ref=e689]:
                    - columnheader "Valid Values:" [ref=e690]
                    - cell [ref=e691]
                  - row [ref=e692]:
                    - rowheader "Importance:" [ref=e693]
                    - cell "medium" [ref=e694]
            - listitem [ref=e695]:
              - heading [level=4] [ref=e696]:
                - link "isolation.level" [ref=e697] [cursor=pointer]:
                  - /url: "#consumerconfigs_isolation.level"
              - paragraph [ref=e698]:
                - text: Controls how to read messages written transactionally. If set to
                - code [ref=e699]: read_committed
                - text: ", consumer.poll() will only return transactional messages which have been committed. If set to"
                - code [ref=e700]: read_uncommitted
                - text: (the default), consumer.poll() will return all messages, even transactional messages which have been aborted. Non-transactional messages will be returned unconditionally in either mode.
              - paragraph [ref=e701]:
                - text: Messages will always be returned in offset order. Hence, in
                - code [ref=e702]: read_committed
                - text: mode, consumer.poll() will only return messages up to the last stable offset (LSO), which is the one less than the offset of the first open transaction. In particular any messages appearing after messages belonging to ongoing transactions will be withheld until the relevant transaction has been completed. As a result,
                - code [ref=e703]: read_committed
                - text: consumers will not be able to read up to the high watermark when there are in flight transactions.
              - paragraph [ref=e704]:
                - text: Further, when in
                - code [ref=e705]: read_committed
                - text: the seekToEnd method will return the LSO
              - paragraph
              - table [ref=e706]:
                - rowgroup [ref=e707]:
                  - row [ref=e708]:
                    - rowheader "Type:" [ref=e709]
                    - cell "string" [ref=e710]
                  - row [ref=e711]:
                    - rowheader "Default:" [ref=e712]
                    - cell "read_uncommitted" [ref=e713]
                  - row [ref=e714]:
                    - rowheader "Valid Values:" [ref=e715]
                    - cell "[read_committed, read_uncommitted]" [ref=e716]
                  - row [ref=e717]:
                    - rowheader "Importance:" [ref=e718]
                    - cell "medium" [ref=e719]
            - listitem [ref=e720]:
              - heading [level=4] [ref=e721]:
                - link "max.poll.interval.ms" [ref=e722] [cursor=pointer]:
                  - /url: "#consumerconfigs_max.poll.interval.ms"
              - paragraph [ref=e723]:
                - text: The maximum delay between invocations of poll() when using consumer group management. This places an upper bound on the amount of time that the consumer can be idle before fetching more records. If poll() is not called before expiration of this timeout, then the consumer is considered failed and the group will rebalance in order to reassign the partitions to another member. For consumers using a non-null
                - code [ref=e724]: group.instance.id
                - text: which reach this timeout, partitions will not be immediately reassigned. Instead, the consumer will stop sending heartbeats and partitions will be reassigned after expiration of the session timeout (defined by the client config
                - code [ref=e725]: session.timeout.ms
                - text: if using the Classic rebalance protocol, or by the broker config
                - code [ref=e726]: group.consumer.session.timeout.ms
                - text: if using the Consumer protocol). This mirrors the behavior of a static consumer which has shutdown.
              - table [ref=e727]:
                - rowgroup [ref=e728]:
                  - row [ref=e729]:
                    - rowheader "Type:" [ref=e730]
                    - cell "int" [ref=e731]
                  - row [ref=e732]:
                    - rowheader "Default:" [ref=e733]
                    - cell "300000 (5 minutes)" [ref=e734]
                  - row [ref=e735]:
                    - rowheader "Valid Values:" [ref=e736]
                    - cell "[1,...]" [ref=e737]
                  - row [ref=e738]:
                    - rowheader "Importance:" [ref=e739]
                    - cell "medium" [ref=e740]
            - listitem [ref=e741]:
              - heading [level=4] [ref=e742]:
                - link "max.poll.records" [ref=e743] [cursor=pointer]:
                  - /url: "#consumerconfigs_max.poll.records"
              - paragraph [ref=e744]:
                - text: The maximum number of records returned in a single call to poll(). Note, that
                - code [ref=e745]: max.poll.records
                - text: does not impact the underlying fetching behavior. The consumer will cache the records from each fetch request and returns them incrementally from each poll.
              - table [ref=e746]:
                - rowgroup [ref=e747]:
                  - row [ref=e748]:
                    - rowheader "Type:" [ref=e749]
                    - cell "int" [ref=e750]
                  - row [ref=e751]:
                    - rowheader "Default:" [ref=e752]
                    - cell "500" [ref=e753]
                  - row [ref=e754]:
                    - rowheader "Valid Values:" [ref=e755]
                    - cell "[1,...]" [ref=e756]
                  - row [ref=e757]:
                    - rowheader "Importance:" [ref=e758]
                    - cell "medium" [ref=e759]
            - listitem [ref=e760]:
              - heading [level=4] [ref=e761]:
                - link "partition.assignment.strategy" [ref=e762] [cursor=pointer]:
                  - /url: "#consumerconfigs_partition.assignment.strategy"
              - paragraph [ref=e763]: "A list of class names or class types, ordered by preference, of supported partition assignment strategies that the client will use to distribute partition ownership amongst consumer instances when group management is used. Available options are:"
              - list [ref=e764]:
                - listitem [ref=e765]:
                  - code [ref=e766]: org.apache.kafka.clients.consumer.RangeAssignor
                  - text: ": Assigns partitions on a per-topic basis."
                - listitem [ref=e767]:
                  - code [ref=e768]: org.apache.kafka.clients.consumer.RoundRobinAssignor
                  - text: ": Assigns partitions to consumers in a round-robin fashion."
                - listitem [ref=e769]:
                  - code [ref=e770]: org.apache.kafka.clients.consumer.StickyAssignor
                  - text: ": Guarantees an assignment that is maximally balanced while preserving as many existing partition assignments as possible."
                - listitem [ref=e771]:
                  - code [ref=e772]: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
                  - text: ": Follows the same StickyAssignor logic, but allows for cooperative rebalancing."
              - paragraph [ref=e773]: The default assignor is [RangeAssignor, CooperativeStickyAssignor], which will use the RangeAssignor by default, but allows upgrading to the CooperativeStickyAssignor with just a single rolling bounce that removes the RangeAssignor from the list.
              - paragraph [ref=e774]:
                - text: Implementing the
                - code [ref=e775]: org.apache.kafka.clients.consumer.ConsumerPartitionAssignor
                - text: interface allows you to plug in a custom assignment strategy.
              - paragraph
              - table [ref=e776]:
                - rowgroup [ref=e777]:
                  - row [ref=e778]:
                    - rowheader "Type:" [ref=e779]
                    - cell "list" [ref=e780]
                  - row [ref=e781]:
                    - rowheader "Default:" [ref=e782]
                    - cell "class org.apache.kafka.clients.consumer.RangeAssignor,class org.apache.kafka.clients.consumer.CooperativeStickyAssignor" [ref=e783]
                  - row [ref=e784]:
                    - columnheader "Valid Values:" [ref=e785]
                    - cell [ref=e786]
                  - row [ref=e787]:
                    - rowheader "Importance:" [ref=e788]
                    - cell "medium" [ref=e789]
            - listitem [ref=e790]:
              - heading [level=4] [ref=e791]:
                - link "receive.buffer.bytes" [ref=e792] [cursor=pointer]:
                  - /url: "#consumerconfigs_receive.buffer.bytes"
              - paragraph [ref=e793]: The size of the TCP receive buffer (SO_RCVBUF) to use when reading data. If the value is -1, the OS default will be used.
              - table [ref=e794]:
                - rowgroup [ref=e795]:
                  - row [ref=e796]:
                    - rowheader "Type:" [ref=e797]
                    - cell "int" [ref=e798]
                  - row [ref=e799]:
                    - rowheader "Default:" [ref=e800]
                    - cell "65536 (64 kibibytes)" [ref=e801]
                  - row [ref=e802]:
                    - rowheader "Valid Values:" [ref=e803]
                    - cell "[-1,...]" [ref=e804]
                  - row [ref=e805]:
                    - rowheader "Importance:" [ref=e806]
                    - cell "medium" [ref=e807]
            - listitem [ref=e808]:
              - heading [level=4] [ref=e809]:
                - link "request.timeout.ms" [ref=e810] [cursor=pointer]:
                  - /url: "#consumerconfigs_request.timeout.ms"
              - paragraph [ref=e811]: The configuration controls the maximum amount of time the client will wait for the response of a request. If the response is not received before the timeout elapses the client will resend the request if necessary or fail the request if retries are exhausted.
              - table [ref=e812]:
                - rowgroup [ref=e813]:
                  - row [ref=e814]:
                    - rowheader "Type:" [ref=e815]
                    - cell "int" [ref=e816]
                  - row [ref=e817]:
                    - rowheader "Default:" [ref=e818]
                    - cell "30000 (30 seconds)" [ref=e819]
                  - row [ref=e820]:
