            - listitem [ref=e178]: / Metrics
        - generic [ref=e179]:
          - heading "Metrics" [level=1] [ref=e180]
          - generic [ref=e181]: A measurement captured at runtime.
          - paragraph [ref=e182]:
            - text: A
            - strong [ref=e183]: metric
            - text: is a
            - strong [ref=e184]: measurement
            - text: of a service captured at runtime. The moment of capturing a measurement is known as a
            - strong [ref=e185]: metric event
            - text: ", which consists not only of the measurement itself, but also the time at which it was captured and associated metadata."
          - paragraph [ref=e186]: Application and request metrics are important indicators of availability and performance. Custom metrics can provide insights into how availability indicators impact user experience or the business. Collected data can be used to alert of an outage or trigger scheduling decisions to scale up a deployment automatically upon high demand.
          - paragraph [ref=e187]: To understand how metrics in OpenTelemetry works, let’s look at a list of components that will play a part in instrumenting our code.
          - heading "Meter Provider" [level=2] [ref=e188]
          - paragraph [ref=e189]:
            - text: A Meter Provider (sometimes called
            - code [ref=e190]: MeterProvider
            - text: ) is a factory for
            - code [ref=e191]: Meter
            - text: s. In most applications, a Meter Provider is initialized once and its lifecycle matches the application’s lifecycle. Meter Provider initialization also includes Resource and Exporter initialization. It is typically the first step in metering with OpenTelemetry. In some language SDKs, a global Meter Provider is already initialized for you.
          - heading "Meter" [level=2] [ref=e192]
          - paragraph [ref=e193]:
            - text: A Meter creates
            - link "metric instruments" [ref=e194] [cursor=pointer]:
              - /url: "#metric-instruments"
            - text: ", capturing measurements about a service at runtime. Meters are created from Meter Providers."
          - heading "Metric Exporter" [level=2] [ref=e195]
          - paragraph [ref=e196]: Metric Exporters send metric data to a consumer. This consumer can be standard output for debugging during development, the OpenTelemetry Collector, or any open source or vendor backend of your choice.
          - heading "Metric Instruments" [level=2] [ref=e197]
          - paragraph [ref=e198]:
            - text: In OpenTelemetry measurements are captured by
            - strong [ref=e199]: metric instruments
            - text: ". A metric instrument is defined by:"
          - list [ref=e200]:
            - listitem [ref=e201]: Name
            - listitem [ref=e202]: Kind
            - listitem [ref=e203]: Unit (optional)
            - listitem [ref=e204]: Description (optional)
          - paragraph [ref=e205]:
            - text: The name, unit, and description are chosen by the developer or defined via
            - link "semantic conventions" [ref=e206] [cursor=pointer]:
              - /url: /docs/specs/semconv/general/metrics/
            - text: for common ones like request and process metrics.
          - paragraph [ref=e207]: "The instrument kind is one of the following:"
          - list [ref=e208]:
            - listitem [ref=e209]:
              - strong [ref=e210]: Counter
              - text: ": A value that accumulates over time – you can think of this like an odometer on a car; it only ever goes up."
            - listitem [ref=e211]:
              - strong [ref=e212]: Asynchronous Counter
              - text: ": Same as the"
              - strong [ref=e213]: Counter
              - text: ", but is collected once for each export. Could be used if you don’t have access to the continuous increments, but only to the aggregated value."
            - listitem [ref=e214]:
              - strong [ref=e215]: UpDownCounter
              - text: ": A value that accumulates over time, but can also go down again. An example could be a queue length, it will increase and decrease with the number of work items in the queue."
            - listitem [ref=e216]:
              - strong [ref=e217]: Asynchronous UpDownCounter
              - text: ": Same as the"
              - strong [ref=e218]: UpDownCounter
              - text: ", but is collected once for each export. Could be used if you don’t have access to the continuous changes, but only to the aggregated value (e.g., current queue size)."
            - listitem [ref=e219]:
              - strong [ref=e220]: Gauge
              - text: ": Measures a current value at the time it is read. An example would be the fuel gauge in a vehicle. Gauges are synchronous."
            - listitem [ref=e221]:
              - strong [ref=e222]: Asynchronous Gauge
              - text: ": Same as the"
              - strong [ref=e223]: Gauge
              - text: ", but is collected once for each export. Could be used if you don’t have access to the continuous changes, but only to the aggregated value."
            - listitem [ref=e224]:
              - strong [ref=e225]: Histogram
              - text: ": A client-side aggregation of values, such as request latencies. A histogram is a good choice if you are interested in value statistics. For example: How many requests take fewer than 1s?"
          - paragraph [ref=e226]:
            - text: For more on synchronous and asynchronous instruments, and which kind is best suited for your use case, see
            - link "Supplementary Guidelines" [ref=e227] [cursor=pointer]:
              - /url: /docs/specs/otel/metrics/supplementary-guidelines/
            - text: .
          - heading "Aggregation" [level=2] [ref=e228]
          - paragraph [ref=e229]:
            - text: In addition to the metric instruments, the concept of
            - strong [ref=e230]: aggregations
            - text: is an important one to understand. An aggregation is a technique whereby a large number of measurements are combined into either exact or estimated statistics about metric events that took place during a time window. The OTLP protocol transports such aggregated metrics. The OpenTelemetry API provides a default aggregation for each instrument which can be overridden using the Views. The OpenTelemetry project aims to provide default aggregations that are supported by visualizers and telemetry backends.
          - paragraph [ref=e231]:
            - text: Unlike
            - link "request tracing" [ref=e232] [cursor=pointer]:
              - /url: ../traces/
            - text: ", which is intended to capture request lifecycles and provide context to the individual pieces of a request, metrics are intended to provide statistical information in aggregate. Some examples of use cases for metrics include:"
          - list [ref=e233]:
            - listitem [ref=e234]: Reporting the total number of bytes read by a service, per protocol type.
            - listitem [ref=e235]: Reporting the total number of bytes read and the bytes per request.
            - listitem [ref=e236]: Reporting the duration of a system call.
            - listitem [ref=e237]: Reporting request sizes in order to determine a trend.
            - listitem [ref=e238]: Reporting CPU or memory usage of a process.
            - listitem [ref=e239]: Reporting average balance values from an account.
            - listitem [ref=e240]: Reporting current active requests being handled.
          - heading "Views" [level=2] [ref=e241]
          - paragraph [ref=e242]: A view provides SDK users with the flexibility to customize the metrics output by the SDK. You can customize which metric instruments are to be processed or ignored. You can also customize aggregation and what attributes you want to report on metrics.
          - heading "Cardinality limits" [level=2] [ref=e243]
          - paragraph [ref=e244]:
            - text: The
            - strong [ref=e245]: cardinality
            - text: of a metric is the number of unique attribute combinations reported for it. Because the SDK keeps a separate aggregation state (a data point) in memory for each unique combination, cardinality drives the memory cost of metrics. Unlike logs, this cost scales with the number of distinct attribute combinations rather than with request volume, so high-cardinality attributes, such as user IDs or raw URL paths, can cause unbounded memory growth.
          - paragraph [ref=e246]:
            - text: To protect applications from this, the OpenTelemetry metrics SDK enforces a
            - strong [ref=e247]: cardinality limit
            - text: ": a maximum number of unique attribute combinations tracked per metric stream. The default is 2000 and can be overridden with a"
            - link "View" [ref=e248] [cursor=pointer]:
              - /url: "#views"
            - text: .
          - paragraph [ref=e249]:
            - text: When the limit is reached, additional attribute combinations are not dropped outright. Instead, their measurements are aggregated into a single
            - strong [ref=e250]: overflow data point
            - text: identified by the attribute
            - code [ref=e251]: otel.metric.overflow=true
            - text: ". This design has three important properties:"
          - list [ref=e252]:
            - listitem [ref=e253]:
              - strong [ref=e254]: No measurements are lost.
              - text: Only the attributes are dropped; the recorded values are folded into the overflow data point, so the metric’s overall total stays correct.
            - listitem [ref=e255]:
              - strong [ref=e256]: Memory is bounded.
              - text: The SDK never tracks more than the configured number of combinations.
            - listitem [ref=e257]:
              - strong [ref=e258]: Overflow is observable.
              - text: Every SDK uses the same
              - code [ref=e259]: otel.metric.overflow=true
              - text: marker, so a single query can detect overflow across services, languages, and backends.
          - paragraph [ref=e260]:
            - text: The trade-off is that any query that
            - strong [ref=e261]: filters or groups by an attribute
            - text: on an overflowed metric undercounts, because the measurements folded into overflow no longer carry that attribute.
          - paragraph [ref=e262]:
            - text: This is easy to underestimate, because overflow replaces the
            - strong [ref=e263]: entire
            - text: attribute combination, not just its high-cardinality part. Suppose a request counter records
            - code [ref=e264]: url.path
            - text: (high cardinality) together with
            - code [ref=e265]: success
            - text: (a boolean). Once the stream overflows, a measurement for
            - code [ref=e266]: "{url.path=/checkout, success=false}"
            - text: is folded into the single overflow data point
            - code [ref=e267]: "{otel.metric.overflow=true}"
            - text: ", dropping"
            - code [ref=e268]: success
            - text: along with
            - code [ref=e269]: url.path
            - text: . A query for
            - code [ref=e270]: success=false
            - text: then misses that measurement, even though
            - code [ref=e271]: success
            - text: on its own is as low-cardinality as an attribute can be. An error-rate alert built on
            - code [ref=e272]: success=false
            - text: can therefore stop firing, while the metric’s overall total stays correct.
          - heading "What the limit does not apply to" [level=3] [ref=e273]
          - paragraph [ref=e274]:
            - text: The cardinality limit applies only to attributes supplied when recording measurements through the metrics API. It does
            - strong [ref=e275]: not
            - text: "apply to:"
          - list [ref=e276]:
            - listitem [ref=e277]:
              - link "Resource" [ref=e278] [cursor=pointer]:
                - /url: /docs/concepts/resources/
              - text: attributes, such as
              - code [ref=e279]: service.name
              - text: or
              - code [ref=e280]: service.instance.id
              - text: .
            - listitem [ref=e281]:
              - text: Instrumentation scope attributes set when a
              - link "Meter" [ref=e282] [cursor=pointer]:
                - /url: "#meter"
              - text: is created.
          - paragraph [ref=e283]: "Values in Resource and instrumentation scope attributes are recorded on every data point, including the overflow one, so they remain reliably queryable even during overflow. This is not a reason to relocate measurement attributes to work around the limit. Attributes should be placed according to what they describe: a Resource describes the entity producing telemetry, instrumentation scope describes the instrumenting library, and measurement attributes describe an individual measurement. When attributes are modeled this way, context that is constant for the lifetime of the process, such as service name, environment, or region, naturally belongs in the Resource, where it also stays queryable under overflow."
          - heading "Temporality and cardinality limits" [level=3] [ref=e284]
          - paragraph [ref=e285]:
            - text: For synchronous instruments,
            - link "aggregation temporality" [ref=e286] [cursor=pointer]:
              - /url: /docs/specs/otel/metrics/data-model/#temporality
            - text: "determines how quickly the SDK can reclaim aggregation state, and therefore how quickly the limit is reached:"
          - list [ref=e287]:
            - listitem [ref=e288]:
              - text: With
              - strong [ref=e289]: delta
              - text: temporality, the SDK resets state after each cycle, so the limit bounds only the combinations active within a single cycle.
            - listitem [ref=e290]:
              - text: With
              - strong [ref=e291]: cumulative
              - text: temporality, the SDK retains state across cycles, so once the limit is reached, new combinations keep overflowing until the process restarts.
          - paragraph [ref=e292]: Asynchronous instruments follow different rules that are beyond the scope of this overview.
          - heading "Language Support" [level=2] [ref=e293]
          - paragraph [ref=e294]:
            - text: Metrics are a
            - link "stable" [ref=e295] [cursor=pointer]:
              - /url: /docs/specs/otel/versioning-and-stability/#stable
            - text: "signal in the OpenTelemetry specification. For the individual language specific implementations of the Metrics API & SDK, the status is as follows:"
          - table [ref=e296]:
            - rowgroup [ref=e297]:
              - row [ref=e298]:
                - columnheader "Language" [ref=e299]
                - columnheader "Metrics" [ref=e300]
            - rowgroup [ref=e301]:
