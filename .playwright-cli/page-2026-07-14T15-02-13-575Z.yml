          - heading "Open and closed models" [level=1] [ref=e99]
          - paragraph [ref=e100]:
            - text: Different k6 executors have different ways of scheduling VUs. Some executors use the
            - emphasis [ref=e101]: closed model
            - text: ", while the arrival-rate executors use the"
            - emphasis [ref=e102]: open model
            - text: .
          - paragraph [ref=e103]: In short, in the closed model, VU iterations start only when the last iteration finishes. In the open model, on the other hand, VUs arrive independently of iteration completion. Different models suit different test aims.
          - heading "Closed Model" [level=2] [ref=e104]
          - paragraph [ref=e105]: In a closed model, the execution time of each iteration dictates the number of iterations executed in your test. The next iteration doesn’t start until the previous one finishes.
          - paragraph [ref=e106]:
            - text: Thus, in a closed model, the start or arrival rate of new VU iterations is tightly coupled with the iteration duration (that is, time from start to finish of the VU’s
            - code [ref=e107]: exec
            - text: function, by default the
            - code [ref=e108]: export default function
            - text: "):"
          - generic [ref=e109]:
            - generic [ref=e110]:
