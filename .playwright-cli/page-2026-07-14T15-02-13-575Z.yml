          - heading "Drawbacks of using the closed model" [level=3] [ref=e134]
          - paragraph [ref=e135]:
            - text: When the duration of the VU iteration is tightly coupled to the start of new VU iterations, the target system’s response time can influence the throughput of the test. Slower response times means longer iterations and a lower arrival rate of new iterations―and vice versa for faster response times. In some testing literature, this problem is known as
            - emphasis [ref=e136]: coordinated omission.
          - paragraph [ref=e137]: In other words, when the target system is stressed and starts to respond more slowly, a closed model load test will wait, resulting in increased iteration durations and a tapering off of the arrival rate of new VU iterations.
          - paragraph [ref=e138]: This effect is not ideal when the goal is to simulate a certain arrival rate of new VUs, or more generally throughput (e.g. requests per second).
          - heading "Open model" [level=2] [ref=e139]
          - paragraph [ref=e140]: Compared to the closed model, the open model decouples VU iterations from the iteration duration. The response times of the target system no longer influence the load on the target system.
          - paragraph [ref=e141]: To fix this problem of coordination, you can use an open model, which decouples the start of new VU iterations from the iteration duration. This reduces the influence of the target system’s response time.
          - paragraph [ref=e142]
          - paragraph [ref=e143]:
