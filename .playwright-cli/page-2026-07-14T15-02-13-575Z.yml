              - button "Copy code to clipboard Copy" [ref=e113] [cursor=pointer]:
                - img "Copy code to clipboard" [ref=e114]
                - generic [ref=e115]: Copy
            - generic [ref=e118]:
              - button "Expand code" [ref=e119] [cursor=pointer]
              - code [ref=e121]: "import http from 'k6/http'; export const options = { scenarios: { closed_model: { executor: 'constant-vus', vus: 1, duration: '1m', }, }, }; export default function () { // The following request will take roughly 6s to complete, // resulting in an iteration duration of 6s. // As a result, New VU iterations will start at a rate of 1 per 6s, // and we can expect to get 10 iterations completed in total for the // full 1m test duration. http.get('https://quickpizza.grafana.com/api/delay/6'); }"
          - paragraph [ref=e122]: "Running this script would result in something like:"
