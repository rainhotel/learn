        - generic [ref=e189]:
          - heading "Logs" [level=1] [ref=e190]
          - generic [ref=e191]: A recording of an event.
          - paragraph [ref=e192]:
            - text: A
            - strong [ref=e193]: log
            - text: is a timestamped text record, either structured (recommended) or unstructured, with optional metadata. Of all telemetry signals, logs have the biggest legacy. Most programming languages have built-in logging capabilities or well-known, widely used logging libraries.
          - heading "OpenTelemetry logs" [level=2] [ref=e194]
          - paragraph [ref=e195]: OpenTelemetry provides a Logs API and SDK for producing log records, and language SDKs and logging bridges to integrate with existing logging frameworks. Logs are anything you send through a Logging Provider, and events are a special type of logs. Not all logs are events, but all events are logs. The Logs API is public and can be used directly by application code or indirectly via existing logging libraries and bridges.
          - paragraph [ref=e196]: OpenTelemetry is designed to work with the logs you already produce, offering tools to correlate logs with other signals, add contextual attributes, and normalize different sources into a common representation for processing and export.
          - heading "OpenTelemetry logs in the OpenTelemetry Collector" [level=3] [ref=e197]
          - paragraph [ref=e198]:
            - text: The
            - link "OpenTelemetry Collector" [ref=e199] [cursor=pointer]:
              - /url: /docs/collector/
            - text: "provides several tools to work with logs:"
          - list [ref=e200]:
            - listitem [ref=e201]: Several receivers which parse logs from specific, known sources of log data.
            - listitem [ref=e202]:
              - text: The
              - code [ref=e203]: filelogreceiver
              - text: ", which reads logs from any file and provides features to parse them from different formats or use a regular expression."
            - listitem [ref=e204]:
              - text: Processors like the
              - code [ref=e205]: transformprocessor
              - text: which lets you parse nested data, flatten nested structures, add/remove/update values, and more.
            - listitem [ref=e206]: Exporters that let you emit log data in a non-OpenTelemetry format.
          - paragraph [ref=e207]: The first step in adopting OpenTelemetry frequently involves deploying a Collector as a general-purposes logging agent.
          - heading "OpenTelemetry logs for applications" [level=3] [ref=e208]
          - paragraph [ref=e209]: In applications, OpenTelemetry logs are created with any logging library or built-in logging capabilities. When you add autoinstrumentation or activate an SDK, OpenTelemetry will automatically correlate your existing logs with any active trace and span, wrapping the log body with their IDs. In other words, OpenTelemetry automatically correlates your logs and traces.
          - heading "Language support" [level=3] [ref=e210]
          - paragraph [ref=e211]:
            - text: Logs are a
            - link "stable" [ref=e212] [cursor=pointer]:
              - /url: /docs/specs/otel/versioning-and-stability/#stable
            - text: "signal in the OpenTelemetry specification. For the individual language specific implementations of the Logs API & SDK, the status is as follows:"
