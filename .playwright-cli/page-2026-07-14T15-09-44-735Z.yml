          - heading "Structured, unstructured, and semistructured logs" [level=2] [ref=e263]
          - paragraph [ref=e264]: "OpenTelemetry accepts any log format, but not all formats are equally useful for analysis. The following section explains the differences between structured, semistructured, and unstructured logs. Important: a log encoded as JSON is not automatically “structured” in the sense of having a stable schema —it may be semistructured. Structured logs imply a consistent schema or well-defined typed fields that downstream processing can reliably depend on."
          - heading "Structured logs" [level=3] [ref=e265]
          - paragraph [ref=e266]: "A structured log is a log with a defined, consistent schema or typed fields that downstream systems can reliably parse and interpret. The textual encoding can be JSON, protobuf, or another format, but what makes a log structured is the presence of a stable schema (field names, types, and semantics), not merely that it is valid JSON. For example, a structured JSON log might look like:"
          - generic [ref=e268]:
            - button "Copy to clipboard" [ref=e269] [cursor=pointer]: 
            - code [ref=e270]:
              - generic [ref=e271]: "{"
              - generic [ref=e273]: "\"timestamp\": \"2024-08-04T12:34:56.789Z\","
              - generic [ref=e275]: "\"level\": \"INFO\","
              - generic [ref=e277]: "\"service\": \"user-authentication\","
              - generic [ref=e279]: "\"environment\": \"production\","
              - generic [ref=e281]: "\"message\": \"User login successful\","
              - generic [ref=e283]: "\"context\": {"
              - generic [ref=e285]: "\"userId\": \"12345\","
              - generic [ref=e287]: "\"username\": \"johndoe\","
              - generic [ref=e289]: "\"ipAddress\": \"192.168.1.1\","
              - generic [ref=e291]: "\"userAgent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36\""
              - generic [ref=e293]: "},"
              - generic [ref=e295]: "\"transactionId\": \"abcd-efgh-ijkl-mnop\","
              - generic [ref=e297]: "\"duration\": 200,"
              - generic [ref=e299]: "\"request\": {"
              - generic [ref=e301]: "\"method\": \"POST\","
              - generic [ref=e303]: "\"url\": \"/api/v1/login\","
              - generic [ref=e305]: "\"headers\": {"
              - generic [ref=e307]: "\"Content-Type\": \"application/json\","
              - generic [ref=e309]: "\"Accept\": \"application/json\""
              - generic [ref=e311]: "},"
              - generic [ref=e313]: "\"body\": {"
              - generic [ref=e315]: "\"username\": \"johndoe\","
              - generic [ref=e317]: "\"password\": \"******\""
              - generic [ref=e319]: "}"
              - generic [ref=e321]: "},"
              - generic [ref=e323]: "\"response\": {"
              - generic [ref=e325]: "\"statusCode\": 200,"
              - generic [ref=e327]: "\"body\": {"
              - generic [ref=e329]: "\"success\": true,"
              - generic [ref=e331]: "\"token\": \"jwt-token-here\""
              - generic [ref=e333]: "}"
              - generic [ref=e335]: "}"
              - generic [ref=e337]: "}"
          - paragraph [ref=e339]: "and for infrastructure components, Common Log Format (CLF) is commonly used:"
          - generic [ref=e341]:
            - button "Copy to clipboard" [ref=e342] [cursor=pointer]: 
            - code [ref=e343]:
              - generic [ref=e344]: 127.0.0.1 - johndoe [04/Aug/2024:12:34:56 -0400] "POST /api/v1/login HTTP/1.1" 200 1234
          - paragraph [ref=e346]: It is also common to encounter hybrid or extended formats (for example, CLF fields combined with a trailing JSON blob).
          - generic [ref=e348]:
            - button "Copy to clipboard" [ref=e349] [cursor=pointer]: 
            - code [ref=e350]:
              - generic [ref=e351]: "192.168.1.1 - johndoe [04/Aug/2024:12:34:56 -0400] \"POST /api/v1/login HTTP/1.1\" 200 1234 \"http://example.com\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36\" {\"transactionId\": \"abcd-efgh-ijkl-mnop\", \"responseTime\": 150, \"requestBody\": {\"username\": \"johndoe\"}, \"responseHeaders\": {\"Content-Type\": \"application/json\"}}"
          - paragraph [ref=e353]:
            - text: In those cases, parse or extract the parts you need into a normalized record so downstream tooling can analyze them consistently. The
            - code [ref=e354]: filelogreceiver
            - text: in the
            - link "OpenTelemetry Collector" [ref=e355] [cursor=pointer]:
              - /url: /docs/collector/
            - text: provides helpers to parse mixed formats.
          - paragraph [ref=e356]: Structured logs are preferred in production because their stable schema makes them straightforward to validate, parse, correlate with traces and metrics, and analyze at scale.
          - heading "Unstructured logs" [level=3] [ref=e357]
          - paragraph [ref=e358]: Unstructured logs are logs that don’t follow a consistent structure. They may be more human-readable, and are often used in development. However, it is not preferred to use unstructured logs for production observability purposes, since they are much more difficult to parse and analyze at scale.
          - paragraph [ref=e359]: "Examples of unstructured logs:"
          - generic [ref=e361]:
            - button "Copy to clipboard" [ref=e362] [cursor=pointer]: 
            - code [ref=e363]:
              - generic [ref=e364]: "[ERROR] 2024-08-04 12:45:23 - Failed to connect to database. Exception: java.sql.SQLException: Timeout expired. Attempted reconnect 3 times. Server: db.example.com, Port: 5432"
              - generic [ref=e367]: "System reboot initiated at 2024-08-04 03:00:00 by user: admin. Reason: Scheduled maintenance. Services stopped: web-server, database, cache. Estimated downtime: 15 minutes."
              - generic [ref=e370]: "DEBUG - 2024-08-04 09:30:15 - User johndoe performed action: file_upload. Filename: report_Q3_2024.pdf, Size: 2.3 MB, Duration: 5.2 seconds. Result: Success"
          - paragraph [ref=e372]: It is possible to store and analyze Unstructured logs in production, although you may need to do substantial work to parse or otherwise pre-process them to be machine-readable. For example, the above three logs will require a regular expression to parse their timestamps and custom parsers to consistently extract the bodies of the log message. This will typically be necessary for a logging backend to know how to sort and organize the logs by timestamp. Although it’s possible to parse unstructured logs for analysis purposes, doing this may be more work than switching to structured logging, such as via a standard logging framework in your applications.
          - heading "Semistructured logs" [level=3] [ref=e373]
          - paragraph [ref=e374]: Semistructured logs include machine-readable key/value pairs or delimited fields but do not guarantee a stable schema across emitters. Examples include key=value logging (shown below) or JSON blobs where field names and types vary between messages. Semistructured logs are often easier to parse than unstructured logs but may still require processing and normalization before analysis.
          - paragraph [ref=e375]: "Example of a semistructured log:"
          - generic [ref=e377]:
            - button "Copy to clipboard" [ref=e378] [cursor=pointer]: 
            - code [ref=e379]:
              - generic [ref=e380]: 2024-08-04T12:45:23Z level=ERROR service=user-authentication userId=12345 action=login message="Failed login attempt" error="Invalid password" ipAddress=192.168.1.1 userAgent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36"
          - paragraph [ref=e382]: Semistructured logs may require mapping and type coercion during ingestion to be fully useful for downstream analysis.
          - heading "OpenTelemetry logging components" [level=2] [ref=e383]
          - paragraph [ref=e384]: The following lists of concepts and components power OpenTelemetry’s logging support.
          - heading "Log Appender / Bridge" [level=3] [ref=e385]
          - paragraph [ref=e386]:
            - text: As an application developer, the
            - strong [ref=e387]: Logs Bridge API
            - text: should not be called by you directly, as it is provided for logging library authors to build log appenders / bridges. Instead, you just use your preferred logging library and configure it to use a log appender (or log bridge) that is able to emit logs into an OpenTelemetry LogRecordExporter.
          - paragraph [ref=e388]: OpenTelemetry language SDKs offer this functionality.
          - heading "Logger Provider" [level=3] [ref=e389]
          - blockquote [ref=e390]:
            - paragraph [ref=e391]:
              - text: Part of the
              - strong [ref=e392]: Logs Bridge API
              - text: and should only be used if you are the author of a logging library.
          - paragraph [ref=e393]:
            - text: A Logger Provider (sometimes called
            - code [ref=e394]: LoggerProvider
            - text: ) is a factory for
            - code [ref=e395]: Logger
            - text: s. In most cases, the Logger Provider is initialized once and its lifecycle matches the application’s lifecycle. Logger Provider initialization also includes Resource and Exporter initialization.
          - heading "Logger" [level=3] [ref=e396]
          - blockquote [ref=e397]:
            - paragraph [ref=e398]:
              - text: Part of the
              - strong [ref=e399]: Logs Bridge API
              - text: and should only be used if you are the author of a logging library.
          - paragraph [ref=e400]: A Logger creates log records. Loggers are created from Log Providers.
          - heading "Log Record Exporter" [level=3] [ref=e401]
          - paragraph [ref=e402]: Log Record Exporters send log records to a consumer. This consumer can be standard output for debugging and development-time, the OpenTelemetry Collector, or any open source or vendor backend of your choice.
          - heading "Log Record" [level=3] [ref=e403]
          - paragraph [ref=e404]: "A log record represents the recording of an event. In OpenTelemetry a log record contains two kinds of fields:"
          - list [ref=e405]:
            - listitem [ref=e406]: Named top-level fields of specific type and meaning
            - listitem [ref=e407]: Resource and attributes fields of arbitrary value and type
          - paragraph [ref=e408]: "The top-level fields are:"
          - table [ref=e409]:
            - rowgroup [ref=e410]:
              - row [ref=e411]:
                - columnheader "Field Name" [ref=e412]
                - columnheader "Description" [ref=e413]
            - rowgroup [ref=e414]:
              - row [ref=e415]:
                - cell "Timestamp" [ref=e416]
                - cell "Time when the event occurred." [ref=e417]
              - row [ref=e418]:
                - cell "ObservedTimestamp" [ref=e419]
                - cell "Time when the event was observed." [ref=e420]
              - row [ref=e421]:
                - cell "TraceId" [ref=e422]
                - cell "Request trace ID." [ref=e423]
              - row [ref=e424]:
                - cell "SpanId" [ref=e425]
                - cell "Request span ID." [ref=e426]
              - row [ref=e427]:
                - cell "TraceFlags" [ref=e428]
                - cell "W3C trace flag." [ref=e429]
              - row [ref=e430]:
                - cell "SeverityText" [ref=e431]
                - cell "The severity text (also known as log level)." [ref=e432]
              - row [ref=e433]:
                - cell "SeverityNumber" [ref=e434]
                - cell "Numerical value of the severity." [ref=e435]
              - row [ref=e436]:
                - cell "Body" [ref=e437]
                - cell "The body of the log record." [ref=e438]
              - row [ref=e439]:
                - cell "Resource" [ref=e440]
                - cell "Describes the source of the log." [ref=e441]
              - row [ref=e442]:
                - cell "InstrumentationScope" [ref=e443]
                - cell "Describes the scope that emitted the log." [ref=e444]
              - row [ref=e445]:
                - cell "Attributes" [ref=e446]
                - cell "Additional information about the event." [ref=e447]
              - row [ref=e448]:
                - cell "EventName" [ref=e449]
                - cell "Name that identifies the class or type of the event." [ref=e450]
          - paragraph [ref=e451]:
            - text: For more details on log records and log fields, see
